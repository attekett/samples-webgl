<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'OES_texture_float_linear',
    'EXT_texture_norm16'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, stencil: true });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    const extFloatLin = gl.getExtension('OES_texture_float_linear');
    const n16 = gl.getExtension('EXT_texture_norm16');

    const texSize = 256;
    const halfSize = 128;
    const layerSize = 64;
    const layerCount = 3;
    const heightDim = 16;
    const readDim = 16;
    const heightScale = 0.35;
    const packAlign = 4;

    const bufferTarget = gl.ARRAY_BUFFER;
    const elemTarget = gl.ELEMENT_ARRAY_BUFFER;
    const atlasTarget = gl.TEXTURE_2D_ARRAY;
    const colorFormat = n16.RGBA16_EXT;
    const depthFormat = gl.DEPTH_COMPONENT24;

    const ctxAttrs = gl.getContextAttributes();

    var atlasProg, compProg;
    var quadBuf, idxBuf, unpackBuf, packBuf, spareBuf;
    var vao, fbo;
    var atlasTex, heightTex, domTex, colorTex, depthTex, spareTex;
    var uLayer, uScale, uMix, uAtlas, uHeight, uDom, uColor, uDepth;
    var shotTint = 0;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main() {
    vUv = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
}`);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
precision highp float;
precision highp sampler2DArray;
in vec2 vUv;
uniform sampler2DArray uAtlas;
uniform sampler2D uHeight;
uniform sampler2D uDom;
uniform int uLayer;
uniform float uScale;
out vec4 o;
void main() {
    float h = texture(uHeight, vUv).r;
    vec4 a = texture(uAtlas, vec3(vUv, float(uLayer)));
    vec4 d = texture(uDom, vUv);
    gl_FragDepth = clamp(0.2 + h * uScale + float(uLayer) * 0.05, 0.0, 1.0);
    o = vec4(mix(a.rgb, d.rgb, 0.3) * (0.6 + h), 1.0);
}`);
        gl.compileShader(fs);
        atlasProg = gl.createProgram();
        gl.attachShader(atlasProg, vs);
        gl.attachShader(atlasProg, fs);
        gl.bindAttribLocation(atlasProg, 0, 'aPos');
        gl.linkProgram(atlasProg);

        const cvs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(cvs, `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main() {
    vUv = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
}`);
        gl.compileShader(cvs);
        const cfs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(cfs, `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uColor;
uniform sampler2D uDepth;
uniform float uMix;
out vec4 o;
void main() {
    vec4 c = texture(uColor, vUv);
    float z = texture(uDepth, vUv).r;
    o = vec4(mix(c.rgb, vec3(z), uMix), 1.0);
}`);
        gl.compileShader(cfs);
        compProg = gl.createProgram();
        gl.attachShader(compProg, cvs);
        gl.attachShader(compProg, cfs);
        gl.bindAttribLocation(compProg, 0, 'aPos');
        gl.linkProgram(compProg);
        gl.useProgram(atlasProg);
        uLayer = gl.getUniformLocation(atlasProg, 'uLayer');
        uScale = gl.getUniformLocation(atlasProg, 'uScale');
        uAtlas = gl.getUniformLocation(atlasProg, 'uAtlas');
        uHeight = gl.getUniformLocation(atlasProg, 'uHeight');
        uDom = gl.getUniformLocation(atlasProg, 'uDom');
        uColor = gl.getUniformLocation(compProg, 'uColor');
        uDepth = gl.getUniformLocation(compProg, 'uDepth');
        uMix = gl.getUniformLocation(compProg, 'uMix');
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        quadBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, quadBuf);
        gl.bufferData(bufferTarget, 32, gl.DYNAMIC_DRAW);
        gl.bufferSubData(bufferTarget, 0, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]));
        gl.bindBuffer(bufferTarget, quadBuf);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        idxBuf = gl.createBuffer();
        gl.bindBuffer(elemTarget, idxBuf);
        gl.bufferData(elemTarget, new Uint16Array([0, 1, 2, 2, 1, 3]), gl.STATIC_DRAW);
        gl.bindBuffer(elemTarget, idxBuf);
        spareBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, spareBuf);
        gl.bufferData(bufferTarget, 64, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, quadBuf);
        gl.deleteBuffer(spareBuf);
        packBuf = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, packBuf);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, readDim * readDim * 4, gl.STREAM_READ);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        heightTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, heightTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R32F, heightDim, heightDim);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        const heights = new Float32Array(heightDim * heightDim);
        for (let i = 0; i < heights.length; i++) {
            heights[i] = 0.5 + 0.5 * Math.sin(i * 0.37) * Math.cos((i % heightDim) * 0.5);
        }
        unpackBuf = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, unpackBuf);
        gl.bufferData(gl.PIXEL_UNPACK_BUFFER, heights, gl.STATIC_DRAW);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, packAlign);
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, unpackBuf);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, heightDim, heightDim, gl.RED, gl.FLOAT, 0);
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, null);
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, null);
    } catch(e) {}

    const imgData = new ImageData(new Uint8ClampedArray(layerSize * layerSize * 4), layerSize, layerSize);
    for (let i = 0; i < layerSize * layerSize; i++) {
        imgData.data[i * 4] = (i % layerSize) * 4;
        imgData.data[i * 4 + 1] = 40;
        imgData.data[i * 4 + 2] = 200 - (i % layerSize) * 2;
        imgData.data[i * 4 + 3] = 255;
    }
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = layerSize;
    srcCanvas.height = layerSize;
    const ctx2d = srcCanvas.getContext('2d');
    const grad = ctx2d.createLinearGradient(0, 0, layerSize, layerSize);
    grad.addColorStop(0, '#ff8000');
    grad.addColorStop(1, '#0080ff');
    ctx2d.fillStyle = grad;
    ctx2d.fillRect(0, 0, layerSize, layerSize);
    const bitmap = await createImageBitmap(imgData);

    try {
        atlasTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(atlasTarget, atlasTex);
        gl.texStorage3D(atlasTarget, 1, gl.RGBA8, layerSize, layerSize, layerCount);
        gl.texParameteri(atlasTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(atlasTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texSubImage3D(atlasTarget, 0, 0, 0, 0, layerSize, layerSize, 1, gl.RGBA, gl.UNSIGNED_BYTE, imgData);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texSubImage3D(atlasTarget, 0, 0, 0, 1, layerSize, layerSize, 1, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.texSubImage3D(atlasTarget, 0, 0, 0, 2, layerSize, layerSize, 1, gl.RGBA, gl.UNSIGNED_BYTE, bitmap);
    } catch(e) {}

    try {
        domTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, domTex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        spareTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, spareTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 4, 4);
        gl.bindTexture(gl.TEXTURE_2D, domTex);
        gl.deleteTexture(spareTex);
    } catch(e) {}

    try {
        colorTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, colorTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, colorFormat, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        depthTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(gl.TEXTURE_2D, depthTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, depthFormat, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depthTex, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, null, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depthTex, 0);
        gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    function renderFrame() {
        try {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.viewport(0, 0, texSize, texSize);
            gl.useProgram(atlasProg);
            gl.bindVertexArray(vao);
            gl.bindBuffer(elemTarget, idxBuf);
            gl.uniform1i(uAtlas, 0);
            gl.uniform1i(uHeight, 1);
            gl.uniform1i(uDom, 2);
            gl.uniform1f(uScale, heightScale);
            gl.enable(gl.DEPTH_TEST);
            gl.disable(gl.DEPTH_TEST);
            gl.enable(gl.DEPTH_TEST);
            gl.disable(gl.DEPTH_TEST);
            gl.enable(gl.DEPTH_TEST);
            gl.depthFunc(gl.LESS);
            gl.enable(gl.SCISSOR_TEST);
            gl.disable(gl.SCISSOR_TEST);
            gl.enable(gl.SCISSOR_TEST);
            gl.disable(gl.SCISSOR_TEST);
            gl.enable(gl.SCISSOR_TEST);
            gl.scissor(0, 0, texSize, texSize);
            gl.clearColor(0.1, 0.1, 0.1, 1.0);
            gl.clearDepth(1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            for (let l = 0; l < layerCount; l++) {
                gl.scissor(l * 80 + 8, 8, 80, texSize - 16);
                gl.colorMask(true, l !== 1, true, true);
                gl.uniform1i(uLayer, l);
                gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
            }
            gl.colorMask(true, true, true, true);
            gl.disable(gl.SCISSOR_TEST);
        } catch(e) {}

        try {
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.useProgram(compProg);
            gl.uniform1i(uColor, 3);
            gl.uniform1i(uDepth, 4);
            gl.uniform1f(uMix, 0.25 + shotTint);
            gl.disable(gl.DEPTH_TEST);
            gl.clearColor(0, 0, 0, 1);
            gl.clearStencil(0);
            gl.clear(gl.COLOR_BUFFER_BIT | (ctxAttrs.stencil ? gl.STENCIL_BUFFER_BIT : 0));
            gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        } catch(e) {}

        try {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.invalidateFramebuffer(gl.FRAMEBUFFER, [gl.DEPTH_ATTACHMENT]);
            gl.invalidateSubFramebuffer(gl.FRAMEBUFFER, [gl.COLOR_ATTACHMENT0], 0, 0, 8, 8);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        } catch(e) {}
    }

    renderFrame();
    await new Promise(r => requestAnimationFrame(r));
    renderFrame();

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, packBuf);
        gl.readPixels(0, 0, readDim, readDim, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        const shot = canvas.toDataURL();
        shotTint = (shot.length % 7) * 0.01;
        canvas.width = halfSize;
        canvas.width = texSize;
        gl.viewport(0, 0, texSize, texSize);
    } catch(e) {}

    renderFrame();
}

main().catch(err => { throw err; });
</script>
</body>
</html>

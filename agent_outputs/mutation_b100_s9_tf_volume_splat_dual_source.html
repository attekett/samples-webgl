<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'OES_sample_variables',
    'EXT_conservative_depth',
    'OES_draw_buffers_indexed',
    'WEBGL_blend_func_extended',
    'WEBGL_debug_shaders',
    'WEBGL_debug_renderer_info'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    const sv = gl.getExtension('OES_sample_variables');
    const cd = gl.getExtension('EXT_conservative_depth');
    const dbi = gl.getExtension('OES_draw_buffers_indexed');
    const bfe = gl.getExtension('WEBGL_blend_func_extended');
    const dsh = gl.getExtension('WEBGL_debug_shaders');
    const dri = gl.getExtension('WEBGL_debug_renderer_info');

    const texSize = 256;
    const maxParticles = 64;
    const stride = 16;
    const volDim = 8;
    const sampleCount = 4;
    const drawMode = gl.POINTS;
    const texFmt = gl.RGBA8;
    const bufferTarget = gl.ARRAY_BUFFER;
    const usageHint = gl.DYNAMIC_COPY;
    let particleCount = maxParticles;
    let spriteSize = 12;

    try {
        var tfVs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(tfVs, `#version 300 es
precision highp float;
struct State { vec3 p; float life; };
in vec4 aState;
uniform float uStep;
out vec4 vOut;
void main() {
    State s = State(aState.xyz, aState.w);
    vec3[3] drift = vec3[3](vec3(0.011, 0.02, 0.0), vec3(-0.02, 0.012, 0.01), vec3(0.0, -0.015, 0.02));
    for (int i = 0; i < drift.length(); i++) {
        s.p += drift[i] * uStep * float(i + 1) * 0.5;
    }
    s.p = mod(s.p + 0.9, 1.8) - 0.9;
    s.life = fract(s.life + 0.037 * uStep);
    vOut = vec4(s.p, s.life);
    gl_Position = vec4(s.p, 1.0);
}`);
        gl.compileShader(tfVs);
        var tfFs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(tfFs, `#version 300 es
precision highp float;
out vec4 o;
void main() { o = vec4(1.0); }`);
        gl.compileShader(tfFs);
        var tfProg = gl.createProgram();
        gl.attachShader(tfProg, tfVs);
        gl.attachShader(tfProg, tfFs);
        gl.transformFeedbackVaryings(tfProg, ['vOut'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(tfProg);
        const tsrc = dsh.getTranslatedShaderSource(tfVs);
        const rname = gl.getParameter(dri.UNMASKED_RENDERER_WEBGL);
        const vname = gl.getParameter(dri.UNMASKED_VENDOR_WEBGL);
        particleCount = 32 + (tsrc.length % 33);
        spriteSize = 10 + ((rname.length + vname.length) % 5);
    } catch(e) {}

    try {
        var splatVs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(splatVs, `#version 300 es
precision highp float;
in vec4 aState;
uniform float uSize;
out float vLife;
void main() {
    vLife = aState.w;
    gl_PointSize = uSize;
    gl_Position = vec4(aState.xy, aState.z * 0.5, 1.0);
}`);
        gl.compileShader(splatVs);
        var splatFs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(splatFs, `#version 300 es
#extension GL_OES_sample_variables : require
#extension GL_EXT_conservative_depth : enable
precision highp float;
layout(depth_less) out highp float gl_FragDepth;
uniform highp sampler3D uVol;
in float vLife;
layout(location = 0) out vec4 color0;
layout(location = 1) out vec4 color1;
void main() {
    vec4 d = texture(uVol, vec3(gl_PointCoord, vLife));
    float sid = float(gl_SampleID) * 0.25;
    gl_SampleMask[0] = gl_SampleMaskIn[0] & 0x7;
    gl_FragDepth = gl_FragCoord.z * 0.99;
    color0 = vec4(d.rgb * 0.8 + sid * 0.2, 0.55);
    color1 = vec4(d.gbr, 0.8 - sid * 0.3);
}`);
        gl.compileShader(splatFs);
        var splatProg = gl.createProgram();
        gl.attachShader(splatProg, splatVs);
        gl.attachShader(splatProg, splatFs);
        gl.linkProgram(splatProg);
    } catch(e) {}

    try {
        var dualVs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(dualVs, `#version 300 es
precision highp float;
out vec2 vUv;
void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    vUv = p;
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`);
        gl.compileShader(dualVs);
        var dualFs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(dualFs, `#version 300 es
#extension GL_EXT_blend_func_extended : require
precision highp float;
uniform sampler2D uA;
uniform sampler2D uB;
in vec2 vUv;
layout(location = 0, index = 0) out vec4 c0;
layout(location = 0, index = 1) out vec4 c1;
void main() {
    vec4 a = texture(uA, vUv);
    vec4 b = texture(uB, vUv);
    c0 = vec4(a.rgb + b.rgb * 0.3, 1.0);
    c1 = vec4(b.rgb * 0.7 + 0.1, b.a);
}`);
        gl.compileShader(dualFs);
        var dualProg = gl.createProgram();
        gl.attachShader(dualProg, dualVs);
        gl.attachShader(dualProg, dualFs);
        gl.linkProgram(dualProg);
    } catch(e) {}

    try {
        const seedData = new Float32Array(maxParticles * 4);
        for (let i = 0; i < maxParticles; i++) {
            seedData[i * 4] = Math.sin(i * 2.399) * 0.8;
            seedData[i * 4 + 1] = Math.cos(i * 2.399) * 0.8;
            seedData[i * 4 + 2] = (i % 8) / 8 * 1.6 - 0.8;
            seedData[i * 4 + 3] = i / maxParticles;
        }
        var srcBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, srcBuf);
        gl.bufferData(bufferTarget, seedData, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(bufferTarget, srcBuf);
        var capBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, capBuf);
        gl.bufferData(bufferTarget, maxParticles * stride, usageHint);
        gl.bindBuffer(bufferTarget, null);
        var spare = gl.createBuffer();
        gl.bindBuffer(bufferTarget, spare);
        gl.bufferData(bufferTarget, 64, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, null);
        gl.deleteBuffer(spare);
        var tfo = gl.createTransformFeedback();
    } catch(e) {}

    try {
        var volTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_3D, volTex);
        gl.texStorage3D(gl.TEXTURE_3D, 1, texFmt, volDim, volDim, volDim);
        const vox = new Uint8Array(volDim * volDim * volDim * 4);
        for (let i = 0; i < volDim * volDim * volDim; i++) {
            const x = i % volDim, y = Math.floor(i / volDim) % volDim, z = Math.floor(i / (volDim * volDim));
            vox[i * 4] = x * 32;
            vox[i * 4 + 1] = y * 32;
            vox[i * 4 + 2] = z * 32;
            vox[i * 4 + 3] = 255;
        }
        gl.texSubImage3D(gl.TEXTURE_3D, 0, 0, 0, 0, volDim, volDim, volDim, gl.RGBA, gl.UNSIGNED_BYTE, vox);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
        gl.bindTexture(gl.TEXTURE_3D, null);
        gl.bindTexture(gl.TEXTURE_3D, volTex);
    } catch(e) {}

    try {
        var msRbo0 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, msRbo0);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, sampleCount, texFmt, texSize, texSize);
        var msRbo1 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, msRbo1);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, sampleCount, texFmt, texSize, texSize);
        var msDepth = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, msDepth);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, sampleCount, gl.DEPTH_COMPONENT24, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        var msFbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, msFbo);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, msRbo0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.RENDERBUFFER, msRbo1);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, msDepth);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
        gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        var resTex0 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, resTex0);
        gl.texStorage2D(gl.TEXTURE_2D, 1, texFmt, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        var resTex1 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, resTex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, texFmt, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindTexture(gl.TEXTURE_2D, null);
        var resFbo = gl.createFramebuffer();
    } catch(e) {}

    try {
        gl.useProgram(tfProg);
        gl.uniform1f(gl.getUniformLocation(tfProg, 'uStep'), 1.0);
        var tfVao = gl.createVertexArray();
        gl.bindVertexArray(tfVao);
        const locState = gl.getAttribLocation(tfProg, 'aState');
        gl.bindBuffer(bufferTarget, srcBuf);
        gl.enableVertexAttribArray(locState);
        gl.vertexAttribPointer(locState, 4, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(bufferTarget, null);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfo);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, capBuf);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(drawMode, 0, particleCount);
        gl.endTransformFeedback();
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        gl.useProgram(splatProg);
        gl.uniform1f(gl.getUniformLocation(splatProg, 'uSize'), spriteSize);
        gl.uniform1i(gl.getUniformLocation(splatProg, 'uVol'), 0);
        var splatVao = gl.createVertexArray();
        gl.bindVertexArray(splatVao);
        const locSplat = gl.getAttribLocation(splatProg, 'aState');
        gl.bindBuffer(bufferTarget, capBuf);
        gl.enableVertexAttribArray(locSplat);
        gl.vertexAttribPointer(locSplat, 4, gl.FLOAT, false, 0, 0);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_3D, volTex);
        gl.bindFramebuffer(gl.FRAMEBUFFER, msFbo);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.02, 0.03, 0.05, 1.0);
        gl.clearDepth(1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        dbi.enableiOES(gl.BLEND, 0);
        dbi.disableiOES(gl.BLEND, 1);
        dbi.blendEquationiOES(0, gl.FUNC_ADD);
        dbi.blendFunciOES(0, gl.SRC_ALPHA, gl.ONE);
        dbi.colorMaskiOES(0, true, true, true, true);
        dbi.colorMaskiOES(1, true, false, true, true);
        gl.drawArrays(drawMode, 0, particleCount);
        dbi.colorMaskiOES(1, true, true, true, false);
        gl.drawArrays(drawMode, 0, particleCount >> 1);
        gl.disable(gl.DEPTH_TEST);
        gl.colorMask(true, true, true, true);
        gl.disable(gl.BLEND);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msFbo);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, resFbo);
        gl.framebufferTexture2D(gl.DRAW_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, resTex0, 0);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.framebufferTexture2D(gl.DRAW_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, resTex1, 0);
        gl.readBuffer(gl.COLOR_ATTACHMENT1);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.checkFramebufferStatus(gl.DRAW_FRAMEBUFFER);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.useProgram(dualProg);
        gl.uniform1i(gl.getUniformLocation(dualProg, 'uA'), 0);
        gl.uniform1i(gl.getUniformLocation(dualProg, 'uB'), 1);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, resTex0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, resTex1);
        var emptyVao = gl.createVertexArray();
        gl.bindVertexArray(emptyVao);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, bfe.SRC1_COLOR_WEBGL);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.blendFuncSeparate(bfe.SRC1_ALPHA_WEBGL, bfe.ONE_MINUS_SRC1_COLOR_WEBGL, gl.ONE, bfe.ONE_MINUS_SRC1_ALPHA_WEBGL);
        gl.viewport(0, 0, texSize >> 1, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.getParameter(bfe.MAX_DUAL_SOURCE_DRAW_BUFFERS_WEBGL);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
        gl.bindVertexArray(null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

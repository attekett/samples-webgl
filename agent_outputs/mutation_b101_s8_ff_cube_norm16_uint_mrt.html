<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_texture_norm16',
    'WEBGL_compressed_texture_s3tc'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    const n16 = gl.getExtension('EXT_texture_norm16');
    const s3 = gl.getExtension('WEBGL_compressed_texture_s3tc');

    const texSize = 128;
    const cubeSize = 16;
    const cubeLevels = 3;
    const auxSize = 64;
    const dxtSize = 8;
    const threshold = 0.18;
    const bufSize = 4 * 3 * 4;

    const bufferTarget = gl.ARRAY_BUFFER;
    const cubeTarget = gl.TEXTURE_CUBE_MAP;
    const planeTarget = gl.TEXTURE_2D;
    const rbTarget = gl.RENDERBUFFER;
    const attachA = gl.COLOR_ATTACHMENT0;
    const attachB = gl.COLOR_ATTACHMENT1;

    var vsPass, fsEnv, progEnv, fsTint, progTint, fsComp, progComp;
    var vao, vbo, ibo;
    var spareBufA, spareBufB, spareTex, spareFbo;
    var cubeTex, dxtTex, auxTex, n16Tex, idTex, srgbTex;
    var depthRb, srgbRb;
    var fboEnv, fboSrgb, fboBlit;
    var quad = new Float32Array([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0]);

    try {
        vsPass = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vsPass, `#version 300 es
precision highp float;
in vec3 aPos;
uniform float uZ;
out vec2 vUv;
void main() {
    vUv = aPos.xy * 0.5 + 0.5;
    gl_Position = vec4(aPos.xy, uZ, 1.0);
}`);
        gl.compileShader(vsPass);

        fsEnv = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsEnv, `#version 300 es
precision highp float;
precision highp int;
in vec2 vUv;
uniform samplerCube uCube;
uniform sampler2D uDxt;
uniform sampler2D uAux;
uniform float uZ;
uniform float uThreshold;
layout(location = 0) out vec4 oColor;
layout(location = 1) out uint oId;
void main() {
    vec3 dir = normalize(vec3(vUv * 2.0 - 1.0, 0.6 + uZ));
    vec3 env = texture(uCube, dir).rgb;
    float luma = dot(env, vec3(0.299, 0.587, 0.114));
    if (luma < uThreshold + 0.1 * uZ) discard;
    vec3 d = texture(uDxt, vUv).rgb;
    vec3 a = texture(uAux, vUv).rgb;
    oColor = vec4(mix(env, d, 0.3) + 0.2 * a, 1.0);
    oId = uint(luma * 255.0) + uint(uZ * 10.0);
    gl_FragDepth = clamp(0.5 + 0.4 * luma - uZ, 0.0, 1.0);
}`);
        gl.compileShader(fsEnv);
        progEnv = gl.createProgram();
        gl.attachShader(progEnv, vsPass);
        gl.attachShader(progEnv, fsEnv);
        gl.linkProgram(progEnv);

        fsTint = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsTint, `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uDxt;
uniform sampler2D uAux;
out vec4 outColor;
void main() {
    vec3 d = texture(uDxt, vUv).rgb;
    vec3 a = texture(uAux, vUv * 2.0).rgb;
    outColor = vec4(mix(d, a, 0.5) + vec3(vUv.x * 0.3), 1.0);
}`);
        gl.compileShader(fsTint);
        progTint = gl.createProgram();
        gl.attachShader(progTint, vsPass);
        gl.attachShader(progTint, fsTint);
        gl.linkProgram(progTint);

        fsComp = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsComp, `#version 300 es
precision highp float;
precision highp int;
precision highp usampler2D;
in vec2 vUv;
uniform sampler2D uN16;
uniform usampler2D uId;
uniform sampler2D uSrgb;
uniform samplerCube uCube;
out vec4 outColor;
void main() {
    vec4 n = texture(uN16, vUv);
    uint id = texelFetch(uId, ivec2(vUv * 128.0), 0).r;
    vec3 s = texture(uSrgb, vUv).rgb;
    vec3 e = textureLod(uCube, normalize(vec3(vUv * 2.0 - 1.0, 1.0)), 0.0).rgb;
    float k = float(id & 255u) / 255.0;
    outColor = vec4(mix(n.rgb, s, 0.35) + 0.3 * e * (1.0 - k) + 0.2 * k, 1.0);
}`);
        gl.compileShader(fsComp);
        progComp = gl.createProgram();
        gl.attachShader(progComp, vsPass);
        gl.attachShader(progComp, fsComp);
        gl.linkProgram(progComp);
    } catch(e) {}

    try {
        vbo = gl.createBuffer();
        gl.bindBuffer(bufferTarget, vbo);
        gl.bufferData(bufferTarget, bufSize * 2, gl.DYNAMIC_DRAW);
        gl.bindBuffer(bufferTarget, null);
        spareBufA = gl.createBuffer();
        spareBufB = gl.createBuffer();
        gl.bindBuffer(bufferTarget, spareBufA);
        gl.bufferData(bufferTarget, bufSize, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, vbo);
        gl.bufferSubData(bufferTarget, 0, quad);
        ibo = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(bufferTarget, vbo);
        const loc = gl.getAttribLocation(progEnv, 'aPos');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        gl.activeTexture(gl.TEXTURE0);
        cubeTex = gl.createTexture();
        gl.bindTexture(cubeTarget, cubeTex);
        gl.bindTexture(cubeTarget, null);
        gl.bindTexture(cubeTarget, cubeTex);
        gl.texStorage2D(cubeTarget, cubeLevels, gl.RGBA8, cubeSize, cubeSize);
        for (let i = 0; i < 6; i++) {
            const face = new Uint8Array(cubeSize * cubeSize * 4);
            for (let p = 0; p < face.length; p += 4) {
                const px = (p >> 2) % cubeSize;
                const py = (p >> 2) / cubeSize | 0;
                face[p] = (i * 40 + px * 12) & 0xFF;
                face[p + 1] = (i * 20 + py * 14) & 0xFF;
                face[p + 2] = (255 - i * 30 - px * 4) & 0xFF;
                face[p + 3] = 255;
            }
            gl.texSubImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + i, 0, 0, 0, cubeSize, cubeSize, gl.RGBA, gl.UNSIGNED_BYTE, face);
        }
        gl.generateMipmap(cubeTarget);
        gl.texParameteri(cubeTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_NEAREST);
        gl.texParameteri(cubeTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        gl.activeTexture(gl.TEXTURE1);
        dxtTex = gl.createTexture();
        gl.bindTexture(planeTarget, dxtTex);
        const dxt1 = new Uint8Array((dxtSize / 4) * (dxtSize / 4) * 8);
        for (let i = 0; i < dxt1.length; i++) dxt1[i] = (i * 53 + 17) & 0xFF;
        gl.compressedTexImage2D(planeTarget, 0, s3.COMPRESSED_RGB_S3TC_DXT1_EXT, dxtSize, dxtSize, 0, dxt1);
        gl.texParameteri(planeTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(planeTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } catch(e) {}

    try {
        const aux = document.createElement('canvas');
        aux.width = auxSize;
        aux.height = auxSize;
        const gl2 = aux.getContext('webgl2');
        gl2.clearColor(0.8, 0.3, 0.1, 1.0);
        gl2.clear(gl2.COLOR_BUFFER_BIT);
        gl2.enable(gl2.SCISSOR_TEST);
        gl2.scissor(16, 16, 32, 32);
        gl2.clearColor(0.1, 0.7, 0.9, 1.0);
        gl2.clear(gl2.COLOR_BUFFER_BIT);
        gl.activeTexture(gl.TEXTURE2);
        auxTex = gl.createTexture();
        gl.bindTexture(planeTarget, auxTex);
        gl.texImage2D(planeTarget, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, aux);
        gl.texParameteri(planeTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(planeTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } catch(e) {}

    try {
        gl.activeTexture(gl.TEXTURE3);
        n16Tex = gl.createTexture();
        gl.bindTexture(planeTarget, n16Tex);
        gl.texStorage2D(planeTarget, 1, n16.RGBA16_EXT, texSize, texSize);
        gl.texParameteri(planeTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(planeTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.activeTexture(gl.TEXTURE4);
        idTex = gl.createTexture();
        gl.bindTexture(planeTarget, idTex);
        gl.texStorage2D(planeTarget, 1, gl.R32UI, texSize, texSize);
        gl.texParameteri(planeTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(planeTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.activeTexture(gl.TEXTURE6);
        spareTex = gl.createTexture();
        gl.bindTexture(planeTarget, spareTex);
        gl.texStorage2D(planeTarget, 1, gl.RGBA8, 4, 4);
        gl.activeTexture(gl.TEXTURE5);
        srgbTex = gl.createTexture();
        gl.bindTexture(planeTarget, srgbTex);
        gl.texStorage2D(planeTarget, 1, gl.SRGB8_ALPHA8, texSize, texSize);
        gl.texParameteri(planeTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(planeTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        depthRb = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, depthRb);
        gl.renderbufferStorage(rbTarget, gl.DEPTH24_STENCIL8, texSize, texSize);
        srgbRb = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, srgbRb);
        gl.renderbufferStorage(rbTarget, gl.SRGB8_ALPHA8, texSize, texSize);
        gl.bindRenderbuffer(rbTarget, null);
    } catch(e) {}

    try {
        fboEnv = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboEnv);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attachA, planeTarget, n16Tex, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attachB, planeTarget, idTex, 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, rbTarget, depthRb);
        gl.drawBuffers([attachA, attachB]);
        gl.checkFramebufferStatus(gl.FRAMEBUFFER);

        fboSrgb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboSrgb);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, attachA, rbTarget, srgbRb);
        gl.checkFramebufferStatus(gl.FRAMEBUFFER);

        fboBlit = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboBlit);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attachA, planeTarget, srgbTex, 0);
        gl.checkFramebufferStatus(gl.FRAMEBUFFER);

        gl.bindFramebuffer(gl.FRAMEBUFFER, fboEnv);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attachA, planeTarget, n16Tex, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attachB, planeTarget, idTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboSrgb);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, attachA, rbTarget, srgbRb);
        spareFbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, spareFbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attachA, planeTarget, spareTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboEnv);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attachA, planeTarget, n16Tex, 0);
        gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboEnv);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clearBufferfv(gl.COLOR, 0, [0.0, 0.0, 0.0, 1.0]);
        gl.clearBufferuiv(gl.COLOR, 1, [0, 0, 0, 0]);
        gl.clearBufferfi(gl.DEPTH_STENCIL, 0, 1.0, 0);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.useProgram(progEnv);
        gl.uniform1i(gl.getUniformLocation(progEnv, 'uCube'), 0);
        gl.uniform1i(gl.getUniformLocation(progEnv, 'uDxt'), 1);
        gl.uniform1i(gl.getUniformLocation(progEnv, 'uAux'), 2);
        gl.uniform1f(gl.getUniformLocation(progEnv, 'uThreshold'), threshold);
        gl.bindVertexArray(vao);
        const locZ = gl.getUniformLocation(progEnv, 'uZ');
        for (let k = 0; k < 3; k++) {
            gl.uniform1f(locZ, k * 0.15);
            gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        }
        gl.bindVertexArray(null);
        gl.disable(gl.DEPTH_TEST);
        gl.invalidateFramebuffer(gl.FRAMEBUFFER, [gl.DEPTH_STENCIL_ATTACHMENT]);
        gl.invalidateSubFramebuffer(gl.FRAMEBUFFER, [attachA], 0, 0, 8, 8);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboSrgb);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.2, 0.1, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.colorMask(true, true, true, false);
        gl.useProgram(progTint);
        gl.uniform1i(gl.getUniformLocation(progTint, 'uDxt'), 1);
        gl.uniform1i(gl.getUniformLocation(progTint, 'uAux'), 2);
        gl.uniform1f(gl.getUniformLocation(progTint, 'uZ'), 0.0);
        gl.bindVertexArray(vao);
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        gl.bindVertexArray(null);
        gl.colorMask(true, true, true, true);
        gl.getFramebufferAttachmentParameter(gl.FRAMEBUFFER, attachA, gl.FRAMEBUFFER_ATTACHMENT_COLOR_ENCODING);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboSrgb);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboBlit);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(progComp);
        gl.uniform1i(gl.getUniformLocation(progComp, 'uN16'), 3);
        gl.uniform1i(gl.getUniformLocation(progComp, 'uId'), 4);
        gl.uniform1i(gl.getUniformLocation(progComp, 'uSrgb'), 5);
        gl.uniform1i(gl.getUniformLocation(progComp, 'uCube'), 0);
        gl.uniform1f(gl.getUniformLocation(progComp, 'uZ'), 0.0);
        gl.bindVertexArray(vao);
        gl.enable(gl.SCISSOR_TEST);
        gl.disable(gl.SCISSOR_TEST);
        gl.enable(gl.SCISSOR_TEST);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(cubeTarget, cubeTex);
        gl.texParameteri(cubeTarget, gl.TEXTURE_BASE_LEVEL, 0);
        gl.texParameteri(cubeTarget, gl.TEXTURE_MAX_LEVEL, 0);
        gl.scissor(0, 0, 128, 256);
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        gl.texParameteri(cubeTarget, gl.TEXTURE_BASE_LEVEL, 1);
        gl.texParameteri(cubeTarget, gl.TEXTURE_MAX_LEVEL, 2);
        gl.scissor(128, 0, 128, 256);
        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        gl.disable(gl.SCISSOR_TEST);
        gl.bindVertexArray(null);
        gl.deleteBuffer(spareBufA);
        gl.deleteBuffer(spareBufB);
        gl.deleteTexture(spareTex);
        gl.deleteFramebuffer(spareFbo);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

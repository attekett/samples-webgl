<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_texture_filter_anisotropic',
    'EXT_texture_mirror_clamp_to_edge'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    const an = gl.getExtension('EXT_texture_filter_anisotropic');
    const mc = gl.getExtension('EXT_texture_mirror_clamp_to_edge');

    const texSize = 256;
    const halfSize = 128;
    const volDim = 8;
    const sliceBytes = volDim * volDim * 4;
    const domDim = 64;
    const auxDim = 64;
    const readDim = 16;
    const anisoLevel = Math.min(4, gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT));

    const bufferTarget = gl.ARRAY_BUFFER;
    const elemTarget = gl.ELEMENT_ARRAY_BUFFER;
    const wrapMode = mc.MIRROR_CLAMP_TO_EDGE_EXT;
    const volTarget = gl.TEXTURE_3D;

    var mainProg, compProg;
    var quadBuf, idxBuf, unpackBuf, packBuf, spareBuf;
    var vao, fbo, smp;
    var volTex, canvasTex, imgTex, glTex, rtTex;
    var uVol, uCanvas, uImg, uGl, uShift, uRt, uTint;
    var shotTint = 0;

    const aux = document.createElement('canvas');
    aux.width = auxDim;
    aux.height = auxDim;
    const gl2 = aux.getContext('webgl2');
    if (!gl2) throw new Error("WebGL2 not supported");

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main() {
    vUv = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
}`);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
precision highp float;
precision highp sampler3D;
in vec2 vUv;
uniform sampler3D uVol;
uniform sampler2D uCanvas;
uniform sampler2D uImg;
uniform sampler2D uGl;
uniform float uShift;
out vec4 o;
void main() {
    vec2 slant = vec2(vUv.x * 3.0 - 1.0, vUv.y * 0.4 + uShift);
    ivec3 vs = textureSize(uVol, 0);
    vec4 vol = textureLod(uVol, vec3(vUv, uShift), 0.0);
    vec4 fetched = texelFetch(uVol, ivec3(vUv * float(vs.x), vs.z / 2), 0);
    vec4 a = texture(uCanvas, slant);
    vec4 b = texture(uImg, slant.yx);
    vec4 c = texture(uGl, vUv * 2.0 - 0.5);
    o = vec4(mix(mix(a.rgb, b.rgb, 0.4), mix(vol.rgb, fetched.rgb, 0.5), 0.3) + c.rgb * 0.2, 1.0);
}`);
        gl.compileShader(fs);
        mainProg = gl.createProgram();
        gl.attachShader(mainProg, vs);
        gl.attachShader(mainProg, fs);
        gl.bindAttribLocation(mainProg, 0, 'aPos');
        gl.linkProgram(mainProg);

        const cvs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(cvs, `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main() {
    vUv = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
}`);
        gl.compileShader(cvs);
        const cfs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(cfs, `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uRt;
uniform float uTint;
out vec4 o;
void main() {
    vec4 c = texture(uRt, vUv);
    o = vec4(smoothstep(0.0, 1.0, c.rgb) + uTint, 1.0);
}`);
        gl.compileShader(cfs);
        compProg = gl.createProgram();
        gl.attachShader(compProg, cvs);
        gl.attachShader(compProg, cfs);
        gl.bindAttribLocation(compProg, 0, 'aPos');
        gl.linkProgram(compProg);
        gl.useProgram(mainProg);
        uVol = gl.getUniformLocation(mainProg, 'uVol');
        uCanvas = gl.getUniformLocation(mainProg, 'uCanvas');
        uImg = gl.getUniformLocation(mainProg, 'uImg');
        uGl = gl.getUniformLocation(mainProg, 'uGl');
        uShift = gl.getUniformLocation(mainProg, 'uShift');
        uRt = gl.getUniformLocation(compProg, 'uRt');
        uTint = gl.getUniformLocation(compProg, 'uTint');
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        quadBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, quadBuf);
        gl.bufferData(bufferTarget, 32, gl.DYNAMIC_DRAW);
        gl.bufferSubData(bufferTarget, 0, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]));
        gl.bindBuffer(bufferTarget, quadBuf);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        idxBuf = gl.createBuffer();
        gl.bindBuffer(elemTarget, idxBuf);
        gl.bufferData(elemTarget, new Uint16Array([0, 1, 2, 2, 1, 3]), gl.STATIC_DRAW);
        gl.bindBuffer(elemTarget, idxBuf);
        spareBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, spareBuf);
        gl.bufferData(bufferTarget, 64, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, quadBuf);
        gl.deleteBuffer(spareBuf);
        packBuf = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, packBuf);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, readDim * readDim * 4, gl.STREAM_READ);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        volTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(volTarget, volTex);
        gl.texStorage3D(volTarget, 1, gl.RGBA8, volDim, volDim, volDim);
        gl.texParameteri(volTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(volTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(volTarget, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
        unpackBuf = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, unpackBuf);
        gl.bufferData(gl.PIXEL_UNPACK_BUFFER, sliceBytes * volDim, gl.STREAM_DRAW);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
        for (let z = 0; z < volDim; z++) {
            const slice = new Uint8Array(sliceBytes);
            for (let i = 0; i < volDim * volDim; i++) {
                slice[i * 4] = z * 32;
                slice[i * 4 + 1] = (i % volDim) * 32;
                slice[i * 4 + 2] = Math.floor(i / volDim) * 32;
                slice[i * 4 + 3] = 255;
            }
            gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, unpackBuf);
            gl.bufferSubData(gl.PIXEL_UNPACK_BUFFER, z * sliceBytes, slice);
            gl.texSubImage3D(volTarget, 0, 0, 0, z, volDim, volDim, 1, gl.RGBA, gl.UNSIGNED_BYTE, z * sliceBytes);
            const fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.flush();
            gl.clientWaitSync(fence, 0, 0);
            gl.deleteSync(fence);
        }
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, null);
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, null);
    } catch(e) {}

    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = domDim;
    srcCanvas.height = domDim;
    const ctx2d = srcCanvas.getContext('2d');
    const grad = ctx2d.createLinearGradient(0, 0, domDim, domDim);
    grad.addColorStop(0, '#ff8000');
    grad.addColorStop(1, '#0080ff');
    ctx2d.fillStyle = grad;
    ctx2d.fillRect(0, 0, domDim, domDim);
    const imgData = new ImageData(new Uint8ClampedArray(domDim * domDim * 4), domDim, domDim);
    for (let i = 0; i < domDim * domDim; i++) {
        imgData.data[i * 4] = (i % domDim) * 4;
        imgData.data[i * 4 + 1] = 40;
        imgData.data[i * 4 + 2] = 200 - (i % domDim) * 2;
        imgData.data[i * 4 + 3] = 200;
    }

    try {
        gl2.enable(gl2.SCISSOR_TEST);
        gl2.clearColor(0.1, 0.8, 0.3, 1.0);
        gl2.clear(gl2.COLOR_BUFFER_BIT);
        gl2.scissor(0, 0, auxDim / 2, auxDim / 2);
        gl2.clearColor(0.9, 0.2, 0.2, 1.0);
        gl2.clear(gl2.COLOR_BUFFER_BIT);
        gl2.disable(gl2.SCISSOR_TEST);
    } catch(e) {}

    try {
        canvasTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, canvasTex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameterf(gl.TEXTURE_2D, an.TEXTURE_MAX_ANISOTROPY_EXT, anisoLevel);

        imgTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, imgTex);
        gl.texStorage2D(gl.TEXTURE_2D, 4, gl.RGBA8, domDim, domDim);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, imgData);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        glTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, glTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, aux);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } catch(e) {}

    try {
        smp = gl.createSampler();
        gl.samplerParameteri(smp, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.samplerParameteri(smp, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.samplerParameteri(smp, gl.TEXTURE_WRAP_S, wrapMode);
        gl.samplerParameteri(smp, gl.TEXTURE_WRAP_T, wrapMode);
        gl.samplerParameterf(smp, an.TEXTURE_MAX_ANISOTROPY_EXT, anisoLevel);
        gl.bindSampler(1, smp);
        gl.bindSampler(2, smp);
        gl.bindSampler(3, null);
        gl.bindSampler(1, null);
        gl.bindSampler(1, smp);
    } catch(e) {}

    try {
        rtTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(gl.TEXTURE_2D, rtTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rtTex, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rtTex, 0);
        gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    function renderFrame(shift) {
        try {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.viewport(0, 0, texSize, texSize);
            gl.useProgram(mainProg);
            gl.bindVertexArray(vao);
            gl.bindBuffer(elemTarget, idxBuf);
            gl.uniform1i(uVol, 0);
            gl.uniform1i(uCanvas, 1);
            gl.uniform1i(uImg, 2);
            gl.uniform1i(uGl, 3);
            gl.uniform1f(uShift, shift);
            gl.enable(gl.BLEND);
            gl.disable(gl.BLEND);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            gl.clearColor(0.05, 0.05, 0.1, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
            gl.disable(gl.BLEND);
        } catch(e) {}

        try {
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.useProgram(compProg);
            gl.uniform1i(uRt, 4);
            gl.uniform1f(uTint, shotTint);
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        } catch(e) {}
    }

    renderFrame(0.3);
    await new Promise(r => requestAnimationFrame(r));
    renderFrame(0.7);

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, packBuf);
        gl.readPixels(0, 0, readDim, readDim, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
        const shot = canvas.toDataURL();
        shotTint = (shot.length % 7) * 0.01;
        canvas.width = halfSize;
        canvas.width = texSize;
        gl.viewport(0, 0, texSize, texSize);
    } catch(e) {}

    renderFrame(0.5);
}

main().catch(err => { throw err; });
</script>
</body>
</html>

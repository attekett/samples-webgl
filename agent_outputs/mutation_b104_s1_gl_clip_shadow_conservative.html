<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'WEBGL_clip_cull_distance',
    'EXT_conservative_depth',
    'WEBGL_stencil_texturing',
    'OES_texture_float_linear'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const ctxAttrs = { stencil: true, preserveDrawingBuffer: true, antialias: false };
    const gl = canvas.getContext('webgl2', ctxAttrs);
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    const cd = gl.getExtension('WEBGL_clip_cull_distance');
    const cdepth = gl.getExtension('EXT_conservative_depth');
    const st = gl.getExtension('WEBGL_stencil_texturing');
    const ofl = gl.getExtension('OES_texture_float_linear');

    const texSize = 256;
    const rampW = 64;
    const quadVerts = 6;
    const clipLimit = 0.9;
    const refA = 0.45;
    const refB = 0.75;

    const bufferTarget = gl.ARRAY_BUFFER;
    const texTarget = gl.TEXTURE_2D;
    const fboTarget = gl.FRAMEBUFFER;
    const drawMode = gl.TRIANGLES;
    const stencilRef = 1;

    const live = gl.getContextAttributes();
    const maxClip = gl.getParameter(cd.MAX_CLIP_DISTANCES_WEBGL);
    const clipGain = Math.min(maxClip, 4) / 2;

    var depthProg, recvProg;
    var posBuf, spare;
    var vao;
    var colorTex, dsA, dsB, rampTex, fbo;
    var query;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
#extension GL_ANGLE_clip_cull_distance : require
precision highp float;
in vec3 aPos;
uniform vec2 uShift;
uniform float uClipGain;
out float vZ;
void main() {
    vec2 p = aPos.xy * 0.9 + uShift;
    gl_ClipDistance[0] = (0.9 - p.x) * uClipGain;
    gl_ClipDistance[1] = (p.y + 0.9) * uClipGain;
    vZ = aPos.z;
    gl_Position = vec4(p, aPos.z, 1.0);
}`);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
#extension GL_EXT_conservative_depth : enable
precision highp float;
layout(depth_greater) out float gl_FragDepth;
in float vZ;
layout(location = 0) out vec4 outColor;
void main() {
    gl_FragDepth = gl_FragCoord.z + 0.02;
    outColor = vec4(vZ * 0.5 + 0.5, 0.4, 0.6, 1.0);
}`);
        gl.compileShader(fs);
        depthProg = gl.createProgram();
        gl.attachShader(depthProg, vs);
        gl.attachShader(depthProg, fs);
        gl.linkProgram(depthProg);
        gl.useProgram(depthProg);
        gl.uniform1f(gl.getUniformLocation(depthProg, 'uClipGain'), clipGain);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
precision highp float;
in vec3 aPos;
out vec2 vUv;
void main() {
    vUv = aPos.xy * 0.5 + 0.5;
    gl_Position = vec4(aPos.xy, 0.0, 1.0);
}`);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
precision highp float;
precision highp sampler2DShadow;
precision highp usampler2D;
uniform sampler2DShadow uShadowA;
uniform sampler2DShadow uShadowB;
uniform usampler2D uStencil;
uniform sampler2D uRamp;
uniform float uRefA;
uniform float uRefB;
in vec2 vUv;
layout(location = 0) out vec4 outColor;
void main() {
    float litA = texture(uShadowA, vec3(vUv, uRefA));
    float litB = texture(uShadowB, vec3(vUv, uRefB));
    uint s = texelFetch(uStencil, ivec2(vUv * 255.0), 0).r;
    if (s == 0u && litA + litB < 0.01) discard;
    vec4 ramp = texture(uRamp, vec2(vUv.x * 0.9 + 0.05, 0.5));
    outColor = vec4(ramp.rgb * (0.4 + 0.3 * litA + 0.3 * litB) + vec3(float(s) * 0.25, 0.0, 0.0), 1.0);
}`);
        gl.compileShader(fs);
        recvProg = gl.createProgram();
        gl.attachShader(recvProg, vs);
        gl.attachShader(recvProg, fs);
        gl.linkProgram(recvProg);
    } catch(e) {}

    try {
        posBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, posBuf);
        gl.bufferData(bufferTarget, new Float32Array([
            -1, -1, 0.3,  1, -1, 0.3,  1, 1, 0.3,
            -1, -1, 0.3,  1, 1, 0.3,  -1, 1, 0.3,
            -0.4, -0.4, -0.3,  0.6, -0.4, -0.3,  0.6, 0.6, -0.3,
            -0.4, -0.4, -0.3,  0.6, 0.6, -0.3,  -0.4, 0.6, -0.3
        ]), gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(bufferTarget, posBuf);
        spare = gl.createBuffer();
        gl.bindBuffer(bufferTarget, spare);
        gl.bufferData(bufferTarget, 64, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, posBuf);
        gl.deleteBuffer(spare);
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const loc = gl.getAttribLocation(depthProg, 'aPos');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        const ramp = new Float32Array(rampW * 4);
        for (let i = 0; i < rampW; i++) {
            const t = i / (rampW - 1);
            ramp.set([t, 0.3 + 0.5 * Math.sin(t * 6.0) ** 2, 1.0 - t, 1.0], i * 4);
        }
        rampTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(texTarget, rampTex);
        gl.texStorage2D(texTarget, 1, gl.RGBA32F, rampW, 1);
        gl.texSubImage2D(texTarget, 0, 0, 0, rampW, 1, gl.RGBA, gl.FLOAT, ramp);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(texTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    try {
        colorTex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(texTarget, colorTex);
        gl.texStorage2D(texTarget, 1, gl.RGBA8, texSize, texSize);

        dsA = gl.createTexture();
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(texTarget, dsA);
        gl.texStorage2D(texTarget, 1, gl.DEPTH24_STENCIL8, texSize, texSize);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
        gl.texParameteri(texTarget, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);

        dsB = gl.createTexture();
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(texTarget, dsB);
        gl.texStorage2D(texTarget, 1, gl.DEPTH24_STENCIL8, texSize, texSize);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
        gl.texParameteri(texTarget, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);

        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo);
        gl.framebufferTexture2D(fboTarget, gl.COLOR_ATTACHMENT0, texTarget, colorTex, 0);
        gl.framebufferTexture2D(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, texTarget, dsA, 0);
        gl.checkFramebufferStatus(fboTarget);
    } catch(e) {}

    try {
        gl.useProgram(depthProg);
        gl.viewport(0, 0, texSize, texSize);
        gl.enable(cd.CLIP_DISTANCE0_WEBGL);
        gl.enable(cd.CLIP_DISTANCE1_WEBGL);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.depthMask(true);
        if (live.stencil) {
            gl.enable(gl.STENCIL_TEST);
            gl.stencilMask(0xff);
            gl.stencilFunc(gl.ALWAYS, stencilRef, 0xff);
            gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        }
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clearDepth(1.0);
        gl.clearStencil(0);
        const shiftU = gl.getUniformLocation(depthProg, 'uShift');
        gl.uniform2f(shiftU, 0.0, 0.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.drawArrays(drawMode, 0, quadVerts);
        gl.drawArrays(drawMode, quadVerts, quadVerts);
        gl.invalidateFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0]);

        gl.framebufferTexture2D(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, texTarget, dsB, 0);
        gl.checkFramebufferStatus(fboTarget);
        gl.stencilFunc(gl.ALWAYS, stencilRef + 1, 0xff);
        gl.uniform2f(shiftU, 0.15, -0.1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.drawArrays(drawMode, 0, quadVerts);
        gl.drawArrays(drawMode, quadVerts, quadVerts);
        gl.invalidateSubFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0], 0, 0, texSize / 2, texSize / 2);

        gl.disable(gl.STENCIL_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(cd.CLIP_DISTANCE0_WEBGL);
        gl.disable(cd.CLIP_DISTANCE1_WEBGL);
        gl.bindFramebuffer(fboTarget, null);
    } catch(e) {}

    try {
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(texTarget, dsB);
        gl.texParameteri(texTarget, gl.TEXTURE_COMPARE_MODE, gl.NONE);
        gl.texParameteri(texTarget, st.DEPTH_STENCIL_TEXTURE_MODE_WEBGL, st.STENCIL_INDEX_WEBGL);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(texTarget, dsA);
    } catch(e) {}

    try {
        gl.useProgram(recvProg);
        gl.uniform1i(gl.getUniformLocation(recvProg, 'uShadowA'), 0);
        gl.uniform1i(gl.getUniformLocation(recvProg, 'uShadowB'), 1);
        gl.uniform1i(gl.getUniformLocation(recvProg, 'uStencil'), 2);
        gl.uniform1i(gl.getUniformLocation(recvProg, 'uRamp'), 3);
        gl.uniform1f(gl.getUniformLocation(recvProg, 'uRefA'), refA);
        gl.uniform1f(gl.getUniformLocation(recvProg, 'uRefB'), refB);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.05, 0.05, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        query = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, query);
        gl.drawArrays(drawMode, 0, quadVerts);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    await new Promise(r => setTimeout(r, 200));

    try {
        gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE);
        const hit = gl.getQueryParameter(query, gl.QUERY_RESULT);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, 0, 24, 24);
        gl.clearColor(hit ? 0.1 : 0.9, hit ? 0.9 : 0.1, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.disable(gl.SCISSOR_TEST);
        gl.deleteQuery(query);
        void cdepth; void ofl;
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

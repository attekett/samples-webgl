<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const blockSize = 16384;
const bindingPoints = 8;
const offsetStride = 256;
const updateCount = 4;
const bufferMultiplier = blockSize * 2;
const totalBindings = bindingPoints + 2;

const UNIFORM_BUFFER = 35345;
const DYNAMIC_DRAW = 35048;
const STATIC_DRAW = 35044;
const STREAM_DRAW = 35040;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const ubo1 = gl.createBuffer();
        const ubo2 = gl.createBuffer();
        const ubo3 = gl.createBuffer();
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bindBuffer(UNIFORM_BUFFER, ubo2);
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bufferData(UNIFORM_BUFFER, blockSize, STATIC_DRAW);
        gl.bufferData(UNIFORM_BUFFER, 32768, DYNAMIC_DRAW);
    } catch(e) {}

    try {
        const ubo4 = gl.createBuffer();
        const ubo5 = gl.createBuffer();
        gl.bindBuffer(UNIFORM_BUFFER, ubo4);
        gl.bindBuffer(UNIFORM_BUFFER, ubo5);
        gl.bindBuffer(UNIFORM_BUFFER, ubo4);
        gl.bufferData(UNIFORM_BUFFER, bufferMultiplier, STREAM_DRAW);
        gl.bufferSubData(UNIFORM_BUFFER, 0, new Float32Array(1024));
        gl.bufferSubData(UNIFORM_BUFFER, offsetStride, new Float32Array(512));
    } catch(e) {}

    try {
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.bindBufferBase(UNIFORM_BUFFER, 1, ubo2);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo3);
        gl.bindBufferBase(UNIFORM_BUFFER, 2, ubo1);
        gl.bindBufferBase(UNIFORM_BUFFER, 3, ubo4);
        gl.bindBufferBase(UNIFORM_BUFFER, 4, ubo5);
        gl.bindBufferBase(UNIFORM_BUFFER, 5, ubo2);
        gl.bindBufferBase(UNIFORM_BUFFER, 6, ubo3);
        gl.bindBufferBase(UNIFORM_BUFFER, 7, ubo4);
    } catch(e) {}

    try {
        const ubo6 = gl.createBuffer();
        const ubo7 = gl.createBuffer();
        const ubo8 = gl.createBuffer();
        gl.bindBuffer(UNIFORM_BUFFER, ubo6);
        gl.bufferData(UNIFORM_BUFFER, 8192, STATIC_DRAW);
        gl.bindBuffer(UNIFORM_BUFFER, ubo7);
        gl.bufferData(UNIFORM_BUFFER, blockSize, DYNAMIC_DRAW);
        gl.bindBuffer(UNIFORM_BUFFER, ubo8);
        gl.bufferData(UNIFORM_BUFFER, 16384, STREAM_DRAW);
    } catch(e) {}

    try {
        gl.bindBufferRange(UNIFORM_BUFFER, 0, ubo1, 0, blockSize);
        gl.bindBufferRange(UNIFORM_BUFFER, 1, ubo2, offsetStride, 4096);
        gl.bindBufferRange(UNIFORM_BUFFER, 2, ubo3, 512, 8192);
        gl.bindBufferRange(UNIFORM_BUFFER, 3, ubo4, 0, blockSize);
        gl.bindBufferRange(UNIFORM_BUFFER, 4, ubo5, offsetStride, 2048);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            layout(std140) uniform Block1 {
                vec4 data[1024];
            } block1;
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0) + block1.data[0];
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            layout(std140) uniform Block2 {
                vec4 color[256];
            } block2;
            out vec4 fragColor;
            void main() {
                fragColor = block2.color[0];
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        for (let i = 0; i < updateCount; i++) {
            gl.bindBuffer(UNIFORM_BUFFER, ubo1);
            gl.bufferSubData(UNIFORM_BUFFER, i * offsetStride, new Float32Array(64));
            gl.bindBuffer(UNIFORM_BUFFER, ubo2);
            gl.bufferSubData(UNIFORM_BUFFER, i * 512, new Float32Array(128));
        }
    } catch(e) {}

    try {
        gl.clearColor(0.2, 0.3, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.bindBufferBase(UNIFORM_BUFFER, 1, ubo2);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo3);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const invalidateSize = 256;
const invalidateOffset = 128;
const cycleCount = 6;
const bufferSize = invalidateSize * 8;
const totalCycles = cycleCount * 2;

const UNIFORM_BUFFER = 35345;
const DYNAMIC_DRAW = 35048;
const STATIC_DRAW = 35044;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const ubo1 = gl.createBuffer();
        const ubo2 = gl.createBuffer();
        const ubo3 = gl.createBuffer();
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bindBuffer(UNIFORM_BUFFER, ubo2);
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bufferData(UNIFORM_BUFFER, bufferSize, DYNAMIC_DRAW);
        gl.bufferData(UNIFORM_BUFFER, 4096, STATIC_DRAW);
    } catch(e) {}

    try {
        const initData = new Float32Array(512);
        for (let i = 0; i < 512; i++) {
            initData[i] = Math.random();
        }
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bufferSubData(UNIFORM_BUFFER, 0, initData);
        gl.bufferSubData(UNIFORM_BUFFER, 1024, new Float32Array(256));
    } catch(e) {}

    try {
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.invalidateBufferSubData(UNIFORM_BUFFER, invalidateOffset, invalidateSize);
        gl.bufferSubData(UNIFORM_BUFFER, invalidateOffset, new Float32Array(64));
        gl.invalidateBufferSubData(UNIFORM_BUFFER, 0, 512);
        gl.invalidateBufferSubData(UNIFORM_BUFFER, 512, invalidateSize);
        gl.bufferSubData(UNIFORM_BUFFER, 512, new Float32Array(128));
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            layout(std140) uniform Block {
                vec4 data[128];
            } block;
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0) + block.data[0];
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.8, 0.6, 0.4, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        for (let i = 0; i < cycleCount; i++) {
            gl.invalidateBufferSubData(UNIFORM_BUFFER, i * invalidateSize, invalidateSize);
            gl.bufferSubData(UNIFORM_BUFFER, i * invalidateOffset, new Float32Array(32));
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
    } catch(e) {}

    try {
        gl.bindBuffer(UNIFORM_BUFFER, ubo2);
        gl.bufferData(UNIFORM_BUFFER, 2048, DYNAMIC_DRAW);
        gl.invalidateBufferSubData(UNIFORM_BUFFER, 0, invalidateSize);
        gl.invalidateBufferSubData(UNIFORM_BUFFER, invalidateSize, invalidateSize);
        gl.bufferSubData(UNIFORM_BUFFER, 0, new Float32Array(512));
    } catch(e) {}

    try {
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo2);
        gl.bindBufferBase(UNIFORM_BUFFER, 1, ubo1);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.invalidateBufferSubData(UNIFORM_BUFFER, invalidateOffset, invalidateSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.clearColor(0.3, 0.3, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

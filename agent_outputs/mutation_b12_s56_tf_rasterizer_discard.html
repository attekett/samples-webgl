<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const bufferCount = 4;
const vertexCount = 1024;
const captureSize = 4096;
const floatsPerVertex = 4;
const bufferStride = floatsPerVertex * 4;

const tfTarget = 0x8C8E;
const tfBuffer = 0x8C8E;
const arrayBuffer = 0x8892;
const streamCopy = 0x88E2;
const interleavedAttribs = 0x8C8C;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        const buffer4 = gl.createBuffer();
        gl.bindBuffer(arrayBuffer, buffer1);
        gl.bindBuffer(arrayBuffer, buffer2);
        gl.bindBuffer(arrayBuffer, buffer1);
        gl.bufferData(arrayBuffer, captureSize, streamCopy);
        gl.bindBuffer(arrayBuffer, buffer3);
        gl.bufferData(arrayBuffer, 8192, streamCopy);
    } catch(e) {}

    try {
        const tfBuffer1 = gl.createBuffer();
        const tfBuffer2 = gl.createBuffer();
        const tfBuffer3 = gl.createBuffer();
        gl.bindBuffer(tfTarget, tfBuffer1);
        gl.bindBuffer(tfTarget, tfBuffer2);
        gl.bindBuffer(tfTarget, tfBuffer1);
        gl.bufferData(tfTarget, captureSize, streamCopy);
        gl.bindBuffer(tfTarget, tfBuffer3);
        gl.bufferData(tfTarget, 16384, streamCopy);
        gl.bindBuffer(tfTarget, tfBuffer2);
        gl.bufferData(tfTarget, captureSize * 2, streamCopy);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec4 aPosition;
            out vec4 vOutput;
            void main() {
                vOutput = aPosition * 2.0;
                gl_Position = aPosition;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(1.0, 0.0, 0.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vOutput'], interleavedAttribs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const inputData = new Float32Array(vertexCount * floatsPerVertex);
        for (let i = 0; i < inputData.length; i += 4) {
            inputData[i] = Math.random();
            inputData[i + 1] = Math.random();
            inputData[i + 2] = Math.random();
            inputData[i + 3] = 1.0;
        }
        gl.bindBuffer(arrayBuffer, buffer1);
        gl.bufferData(arrayBuffer, inputData, gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, floatsPerVertex, gl.FLOAT, false, bufferStride, 0);
        gl.enableVertexAttribArray(0);
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBuffer, 0, tfBuffer1);
        gl.bindBufferBase(tfBuffer, 1, tfBuffer2);
        gl.bindBufferBase(tfBuffer, 0, tfBuffer1);
        gl.bindBufferBase(tfBuffer, 2, tfBuffer3);
        gl.bindBufferBase(tfBuffer, 1, tfBuffer2);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, vertexCount);
        gl.endTransformFeedback();
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, 512);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBuffer, 0, tfBuffer2);
        gl.bindBufferBase(tfBuffer, 1, tfBuffer3);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, 256);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.bindBuffer(arrayBuffer, tfBuffer1);
        gl.deleteBuffer(tfBuffer1);
        gl.bindBuffer(arrayBuffer, tfBuffer1);
        gl.bindBuffer(tfBuffer, buffer1);
        gl.deleteBuffer(buffer1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const timeout0 = 0;
const timeout1 = 1000000;
const pollCount = 16;
const drawCount = 8;
const vertexCount = 6;
const bufferSize = 2048;

const syncCondition = 37143;
const flushBit = 1;
const timeoutFlag = 37148;
const alreadySignaled = 37146;
const conditionSatisfied = 37149;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 aPosition;
            void main() {
                gl_Position = vec4(aPosition * 0.5, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.3, 0.7, 0.9, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, 1024, gl.DYNAMIC_DRAW);
    } catch(e) {}

    try {
        const sync1 = gl.fenceSync(syncCondition, 0);
        gl.flush();
        const result1 = gl.clientWaitSync(sync1, 0, timeout0);
        const result2 = gl.clientWaitSync(sync1, flushBit, timeout0);
        const result3 = gl.clientWaitSync(sync1, 0, timeout0);
        gl.deleteSync(sync1);
    } catch(e) {}

    try {
        const sync2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        const r1 = gl.clientWaitSync(sync2, flushBit, timeout1);
        const r2 = gl.clientWaitSync(sync2, 0, 500000);
        const r3 = gl.clientWaitSync(sync2, flushBit, 250000);
        gl.deleteSync(sync2);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        const sync3 = gl.fenceSync(syncCondition, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.flush();
        gl.clientWaitSync(sync3, 0, timeout0);
        gl.clientWaitSync(sync3, flushBit, timeout0);
        gl.deleteSync(sync3);
    } catch(e) {}

    try {
        const sync4 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const sync5 = gl.fenceSync(syncCondition, 0);
        gl.flush();
        for (let i = 0; i < 4; i++) {
            gl.clientWaitSync(sync4, 0, timeout0);
            gl.clientWaitSync(sync5, flushBit, timeout0);
        }
        gl.deleteSync(sync4);
        gl.deleteSync(sync5);
    } catch(e) {}

    try {
        const sync6 = gl.fenceSync(syncCondition, 0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.flush();
        gl.clientWaitSync(sync6, flushBit, timeout1);
        gl.clientWaitSync(sync6, 0, timeout0);
        gl.clientWaitSync(sync6, flushBit, 2000000);
        gl.deleteSync(sync6);
    } catch(e) {}

    try {
        const syncA = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const syncB = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(syncA);
        gl.clientWaitSync(syncA, flushBit, timeout1);
        gl.clientWaitSync(syncB, 0, timeout0);
        gl.deleteSync(syncB);
    } catch(e) {}

    try {
        const syncC = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(syncC);
        gl.deleteSync(syncC);
        const syncD = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(syncD, flushBit, timeout0);
        gl.deleteSync(syncD);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, 24);
        const syncE = gl.fenceSync(syncCondition, 0);
        gl.flush();
        gl.clientWaitSync(syncE, 0, timeout1);
        gl.deleteSync(syncE);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const syncCount = 4;
const queryCount = 4;
const operationCount = 32;
const vertexCount = 6;
const bufferSize = 2560;
const drawIterations = 8;

const syncCondition = 37143;
const queryTarget = 35887;
const timeElapsed = 35007;
const flushBit = 1;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec4 position;
            void main() {
                gl_Position = position * 0.7;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.9, 0.5, 0.3, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        gl.bufferData(gl.ARRAY_BUFFER, 1280, gl.DYNAMIC_DRAW);
    } catch(e) {}

    try {
        const query1 = gl.createQuery();
        const query2 = gl.createQuery();
        gl.beginQuery(queryTarget, query1);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(queryTarget);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, query2);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    try {
        const sync1 = gl.fenceSync(syncCondition, 0);
        const query3 = gl.createQuery();
        gl.flush();
        gl.beginQuery(queryTarget, query3);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(queryTarget);
        gl.clientWaitSync(sync1, flushBit, 1000000);
        gl.deleteSync(sync1);
    } catch(e) {}

    try {
        const query4 = gl.createQuery();
        const sync2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, query4);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.flush();
        gl.clientWaitSync(sync2, 0, 500000);
        gl.deleteSync(sync2);
    } catch(e) {}

    try {
        const sync3 = gl.fenceSync(syncCondition, 0);
        const sync4 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const query5 = gl.createQuery();
        const query6 = gl.createQuery();
        gl.beginQuery(queryTarget, query5);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(queryTarget);
        gl.clientWaitSync(sync3, flushBit, 0);
        gl.clientWaitSync(sync4, 0, 0);
        gl.deleteSync(sync3);
        gl.deleteSync(sync4);
    } catch(e) {}

    try {
        const syncA = gl.fenceSync(syncCondition, 0);
        const queryA = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queryA);
        gl.drawArrays(gl.TRIANGLES, 0, 24);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.deleteSync(syncA);
        gl.clientWaitSync(syncA, flushBit, 1000000);
    } catch(e) {}

    try {
        const queryB = gl.createQuery();
        gl.beginQuery(queryTarget, queryB);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(queryTarget);
        const syncB = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.deleteSync(syncB);
        gl.deleteSync(syncB);
    } catch(e) {}

    try {
        const syncC = gl.fenceSync(syncCondition, 0);
        const queryC = gl.createQuery();
        const queryD = gl.createQuery();
        gl.deleteSync(syncC);
        gl.beginQuery(queryTarget, queryC);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.endQuery(queryTarget);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queryD);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    try {
        const syncD = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const queryE = gl.createQuery();
        gl.beginQuery(queryTarget, queryE);
        gl.drawArrays(gl.TRIANGLES, 0, 30);
        gl.endQuery(queryTarget);
        gl.flush();
        gl.clientWaitSync(syncD, flushBit, 2000000);
        gl.deleteSync(syncD);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        const syncE = gl.fenceSync(syncCondition, 0);
        gl.flush();
        gl.deleteSync(syncE);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

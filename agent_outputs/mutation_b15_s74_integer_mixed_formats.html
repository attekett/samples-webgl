<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const formatCount = 6;
const textureCount = 12;
const sampleCount = 16;
const texSize = 128;
const bindCycles = 8;

const textureTarget = 35866;
const r8iFormat = 33329;
const r8uiFormat = 33330;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 1, r8iFormat, texSize, texSize);
        gl.texParameteri(textureTarget, 10241, 9728);
        gl.texParameteri(textureTarget, 10240, 9728);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, r8uiFormat, 256, 256);
        gl.bindTexture(textureTarget, tex3);
        gl.texStorage2D(textureTarget, 1, 33331, 128, 128);
        gl.bindTexture(textureTarget, tex1);
        const data1 = new Int8Array(texSize * texSize);
        for (let i = 0; i < texSize * texSize; i++) data1[i] = i % 128;
        gl.texSubImage2D(textureTarget, 0, 0, 0, texSize, texSize, 36244, 5120, data1);
    } catch(e) {}

    try {
        const tex4 = gl.createTexture();
        const tex5 = gl.createTexture();
        const tex6 = gl.createTexture();
        gl.bindTexture(textureTarget, tex4);
        gl.texStorage2D(textureTarget, 1, 33332, 64, 64);
        gl.bindTexture(textureTarget, tex5);
        gl.texStorage2D(textureTarget, 1, 33333, 128, 128);
        gl.bindTexture(textureTarget, tex6);
        gl.texStorage2D(textureTarget, 1, 33334, 256, 256);
    } catch(e) {}

    try {
        const tex7 = gl.createTexture();
        const tex8 = gl.createTexture();
        gl.bindTexture(textureTarget, tex7);
        gl.bindTexture(textureTarget, tex8);
        gl.bindTexture(textureTarget, tex7);
        gl.texStorage2D(textureTarget, 1, 33335, 128, 128);
        gl.bindTexture(textureTarget, tex8);
        gl.texStorage2D(textureTarget, 1, 33336, 64, 64);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(34962, buffer1);
        gl.bindBuffer(34962, buffer2);
        gl.bindBuffer(34962, buffer1);
        gl.bufferData(34962, 2048, 35044);
        gl.bufferSubData(34962, 0, new Float32Array(128));
    } catch(e) {}

    try {
        const vs = gl.createShader(35633);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec2 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position.xy * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(35632);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp isampler2D;
            uniform isampler2D uTex1;
            uniform isampler2D uTex2;
            in vec2 vTexCoord;
            out vec4 fragColor;
            void main() {
                ivec4 val1 = texture(uTex1, vTexCoord);
                ivec4 val2 = texture(uTex2, vTexCoord);
                fragColor = vec4(float(val1.r) / 127.0, float(val2.r) / 255.0, 0.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        const tex1Loc = gl.getUniformLocation(program, 'uTex1');
        const tex2Loc = gl.getUniformLocation(program, 'uTex2');
        gl.uniform1i(tex1Loc, 0);
        gl.uniform1i(tex2Loc, 1);
        const positions = new Float32Array([
            -1, -1, 0,
            1, -1, 0,
            -1, 1, 0,
            1, 1, 0,
            -1, 1, 0,
            1, -1, 0
        ]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(34962, vbo);
        gl.bufferData(34962, positions, 35044);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, 5126, false, 0, 0);
    } catch(e) {}

    try {
        gl.activeTexture(33984);
        gl.bindTexture(textureTarget, tex1);
        gl.activeTexture(33985);
        gl.bindTexture(textureTarget, tex2);
        gl.activeTexture(33986);
        gl.bindTexture(textureTarget, tex3);
        gl.activeTexture(33984);
        gl.bindTexture(textureTarget, tex4);
        gl.activeTexture(33985);
        gl.bindTexture(textureTarget, tex5);
    } catch(e) {}

    try {
        gl.enable(3042);
        gl.disable(3042);
        gl.enable(3042);
        gl.blendFunc(770, 771);
        gl.disable(3042);
        gl.enable(2929);
        gl.disable(2929);
        gl.enable(2929);
        gl.depthFunc(515);
        gl.disable(2929);
    } catch(e) {}

    try {
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(5, 0, 6);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(5, 0, 6);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(5, 0, 6);
        gl.viewport(0, 0, 128, 128);
        gl.drawArrays(5, 0, 6);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex1);
        gl.deleteTexture(tex1);
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.deleteTexture(tex2);
        gl.bindTexture(textureTarget, tex3);
        gl.deleteTexture(tex3);
        gl.bindTexture(textureTarget, tex4);
        gl.deleteTexture(tex4);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

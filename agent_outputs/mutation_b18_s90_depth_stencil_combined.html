<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const depthTests = 8;
const stencilOps = 8;
const combinedCycles = 32;
const vertexCount = 6;
const texSize = 256;
const refValue = 128;

const formatDepthStencil = 34041;
const formatDepth24Stencil8 = 35056;
const formatDepth32fStencil8 = 36013;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        const vertices = new Float32Array([
            -0.7,-0.7,0.3, 0.7,-0.7,0.5, 0.0,0.7,0.7,
            -0.5,-0.5,0.2, 0.5,-0.5,0.4, 0.0,0.5,0.6
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array([0.0, 0.0, 0.5]));
    } catch(e) {}

    try {
        const dsTex1 = gl.createTexture();
        const dsTex2 = gl.createTexture();
        const dsTex3 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, dsTex1);
        gl.texImage2D(gl.TEXTURE_2D, 0, formatDepth24Stencil8, texSize, texSize, 0, formatDepthStencil, gl.UNSIGNED_INT_24_8, null);
        gl.bindTexture(gl.TEXTURE_2D, dsTex2);
        gl.texImage2D(gl.TEXTURE_2D, 0, formatDepth32fStencil8, 256, 256, 0, formatDepthStencil, gl.FLOAT_32_UNSIGNED_INT_24_8_REV, null);
        gl.bindTexture(gl.TEXTURE_2D, dsTex3);
        gl.texImage2D(gl.TEXTURE_2D, 0, formatDepth24Stencil8, texSize, texSize, 0, formatDepthStencil, gl.UNSIGNED_INT_24_8, null);
        gl.bindTexture(gl.TEXTURE_2D, dsTex1);
    } catch(e) {}

    try {
        const colorTex1 = gl.createTexture();
        const colorTex2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, colorTex1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(gl.TEXTURE_2D, colorTex2);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vPos;
            void main() {
                gl_Position = vec4(position.xy, position.z, 1.0);
                vPos = position;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vPos;
            out vec4 fragColor;
            void main() {
                float val = vPos.z;
                fragColor = vec4(val, 1.0 - val, vPos.x * 0.5 + 0.5, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex1, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.TEXTURE_2D, dsTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex2, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.TEXTURE_2D, dsTex2, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.TEXTURE_2D, dsTex3, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.STENCIL_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.STENCIL_TEST);
        gl.depthFunc(gl.LESS);
        gl.depthFunc(gl.LEQUAL);
        gl.depthFunc(gl.GREATER);
        gl.depthFunc(gl.LESS);
    } catch(e) {}

    try {
        gl.stencilFunc(gl.ALWAYS, refValue, 255);
        gl.stencilFunc(gl.LESS, 64, 255);
        gl.stencilFunc(gl.EQUAL, refValue, 255);
        gl.stencilFunc(gl.ALWAYS, 128, 255);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.stencilOp(gl.REPLACE, gl.INCR, gl.DECR);
        gl.stencilOp(gl.INCR, gl.DECR, gl.INVERT);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
    } catch(e) {}

    try {
        gl.depthMask(true);
        gl.depthMask(false);
        gl.depthMask(true);
        gl.stencilMask(255);
        gl.stencilMask(127);
        gl.stencilMask(255);
        gl.depthRange(0.0, 1.0);
        gl.depthRange(0.2, 0.8);
        gl.depthRange(0.0, 1.0);
    } catch(e) {}

    try {
        gl.depthFunc(gl.LESS);
        gl.stencilFunc(gl.ALWAYS, refValue, 255);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.depthFunc(gl.LEQUAL);
        gl.stencilFunc(gl.EQUAL, refValue, 255);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.INCR);
        gl.depthFunc(gl.GREATER);
        gl.stencilFunc(gl.NOTEQUAL, 64, 255);
        gl.stencilOp(gl.REPLACE, gl.DECR, gl.INVERT);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clear(gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT | gl.COLOR_BUFFER_BIT);
        gl.depthFunc(gl.LESS);
        gl.stencilFunc(gl.ALWAYS, refValue, 255);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.viewport(0, 0, 256, 256);
        gl.clear(gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.depthFunc(gl.LEQUAL);
        gl.stencilFunc(gl.EQUAL, refValue, 255);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clear(gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT | gl.COLOR_BUFFER_BIT);
        gl.depthFunc(gl.LESS);
        gl.stencilFunc(gl.ALWAYS, 128, 255);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.stencilFunc(gl.EQUAL, 128, 255);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.INCR);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
    } catch(e) {}

    try {
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const commandCount = 8;
    const instanceCount = 16;
    const vertexCount = 256;
    const bufferSize = 8192;
    const commandSize = 20;

    const drawIndirectTarget = gl.DRAW_INDIRECT_BUFFER;
    const arrayBufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in vec3 normal;
            out vec3 vNormal;
            void main() {
                gl_Position = vec4(position, 1.0);
                vNormal = normal;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vNormal;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(abs(vNormal), 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const indirectBuffer1 = gl.createBuffer();
        const indirectBuffer2 = gl.createBuffer();
        const indirectBuffer3 = gl.createBuffer();
        gl.bindBuffer(drawIndirectTarget, indirectBuffer1);
        gl.bindBuffer(drawIndirectTarget, indirectBuffer2);
        gl.bindBuffer(drawIndirectTarget, indirectBuffer1);
        gl.bufferData(drawIndirectTarget, bufferSize, bufferUsage);
        const commands = new Uint32Array([
            6, 1, 0, 0,
            12, 2, 0, 0,
            18, 4, 0, 0,
            24, 8, 0, 0
        ]);
        gl.bufferSubData(drawIndirectTarget, 0, commands);
    } catch(e) {}

    try {
        const vertexBuffer1 = gl.createBuffer();
        const vertexBuffer2 = gl.createBuffer();
        gl.bindBuffer(arrayBufferTarget, vertexBuffer1);
        gl.bindBuffer(arrayBufferTarget, vertexBuffer2);
        gl.bindBuffer(arrayBufferTarget, vertexBuffer1);
        gl.bufferData(arrayBufferTarget, 4096, gl.DYNAMIC_DRAW);
        gl.bufferSubData(arrayBufferTarget, 0, new Float32Array([
            -0.8,-0.8,0, 0.8,-0.8,0, 0.8,0.8,0,
            -0.8,-0.8,0, 0.8,0.8,0, -0.8,0.8,0
        ]));
        gl.bindBuffer(arrayBufferTarget, vertexBuffer2);
        gl.bufferData(arrayBufferTarget, 2048, gl.STREAM_DRAW);
    } catch(e) {}

    try {
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(arrayBufferTarget, vertexBuffer1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
        gl.vertexAttribDivisor(0, 0);
        gl.vertexAttribDivisor(1, 1);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.FRONT);
    } catch(e) {}

    try {
        gl.bindBuffer(drawIndirectTarget, indirectBuffer1);
        gl.viewport(0, 0, 256, 256);
        gl.drawArraysIndirect(gl.TRIANGLES, 0);
        gl.bindBuffer(drawIndirectTarget, indirectBuffer2);
        gl.viewport(0, 0, 128, 128);
        gl.drawArraysIndirect(gl.TRIANGLE_STRIP, 0);
        gl.bindBuffer(drawIndirectTarget, indirectBuffer1);
        gl.drawArraysIndirect(gl.TRIANGLES, 16);
    } catch(e) {}

    try {
        gl.drawArraysIndirect(gl.TRIANGLES, 32);
        gl.viewport(0, 0, 512, 512);
        gl.drawArraysIndirect(gl.POINTS, 0);
        gl.bindBuffer(drawIndirectTarget, indirectBuffer3);
        gl.bufferData(drawIndirectTarget, 1024, gl.STATIC_DRAW);
        gl.drawArraysIndirect(gl.TRIANGLES, 0);
    } catch(e) {}

    try {
        gl.bindBuffer(drawIndirectTarget, indirectBuffer1);
        gl.bindBuffer(arrayBufferTarget, vertexBuffer1);
        gl.drawArraysIndirect(gl.TRIANGLES, 0);
        gl.bindBuffer(drawIndirectTarget, indirectBuffer2);
        gl.drawArraysIndirect(gl.TRIANGLE_FAN, 0);
        gl.bindBuffer(drawIndirectTarget, indirectBuffer1);
        gl.drawArraysIndirect(gl.LINE_STRIP, 16);
    } catch(e) {}

    try {
        gl.bindBuffer(drawIndirectTarget, indirectBuffer1);
        gl.deleteBuffer(indirectBuffer1);
        gl.bindBuffer(drawIndirectTarget, indirectBuffer1);
        gl.drawArraysIndirect(gl.TRIANGLES, 0);
        gl.deleteBuffer(indirectBuffer2);
        gl.bindBuffer(arrayBufferTarget, vertexBuffer1);
        gl.deleteBuffer(vertexBuffer1);
        gl.bindBuffer(arrayBufferTarget, vertexBuffer1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

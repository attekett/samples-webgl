<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const srcOffset = 0;
    const dstOffset = 1024;
    const copySize = 2048;
    const cycleCount = 16;
    const bufferSize = 8192;

    const copyReadTarget = gl.COPY_READ_BUFFER;
    const copyWriteTarget = gl.COPY_WRITE_BUFFER;
    const arrayBufferTarget = gl.ARRAY_BUFFER;
    const uniformBufferTarget = gl.UNIFORM_BUFFER;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        const buffer4 = gl.createBuffer();
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.bindBuffer(copyWriteTarget, buffer2);
        gl.bindBuffer(copyReadTarget, buffer2);
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.bufferData(copyReadTarget, bufferSize, gl.STATIC_DRAW);
        gl.bufferSubData(copyReadTarget, 0, new Float32Array(256));
    } catch(e) {}

    try {
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.bindBuffer(copyWriteTarget, buffer2);
        gl.bufferData(copyWriteTarget, bufferSize, gl.DYNAMIC_DRAW);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, srcOffset, dstOffset, copySize);
        gl.bindBuffer(copyReadTarget, buffer2);
        gl.bindBuffer(copyWriteTarget, buffer1);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 512, 2048, 1024);
    } catch(e) {}

    try {
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.bindBuffer(copyWriteTarget, buffer2);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, 4096);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 1024, 512, 2048);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 2048, 1024, 1024);
        gl.bindBuffer(copyReadTarget, buffer3);
        gl.bufferData(copyReadTarget, 16384, gl.STREAM_DRAW);
    } catch(e) {}

    try {
        gl.bindBuffer(copyReadTarget, buffer2);
        gl.bindBuffer(copyWriteTarget, buffer3);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, srcOffset, dstOffset, copySize);
        gl.bindBuffer(copyReadTarget, buffer3);
        gl.bindBuffer(copyWriteTarget, buffer4);
        gl.bufferData(copyWriteTarget, bufferSize, gl.STATIC_COPY);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, 8192);
    } catch(e) {}

    try {
        gl.bindBuffer(arrayBufferTarget, buffer1);
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.bindBuffer(copyWriteTarget, buffer2);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 2048, 2048);
        gl.bindBuffer(uniformBufferTarget, buffer2);
        gl.bindBufferBase(uniformBufferTarget, 0, buffer2);
        gl.copyBufferSubData(copyReadTarget, uniformBufferTarget, 1024, 512, 1024);
    } catch(e) {}

    try {
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.bindBuffer(copyWriteTarget, buffer1);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 4096, 2048);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 2048, 0, 2048);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 1024, 1536, 512);
    } catch(e) {}

    try {
        for(let i = 0; i < cycleCount; i++) {
            gl.bindBuffer(copyReadTarget, buffer1);
            gl.bindBuffer(copyWriteTarget, buffer2);
            gl.copyBufferSubData(copyReadTarget, copyWriteTarget, i * 128, i * 256, 512);
            gl.bindBuffer(copyReadTarget, buffer2);
            gl.bindBuffer(copyWriteTarget, buffer1);
            gl.copyBufferSubData(copyReadTarget, copyWriteTarget, i * 256, i * 128, 512);
        }
    } catch(e) {}

    try {
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.bindBuffer(copyWriteTarget, buffer2);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, 8192);
        gl.bindBuffer(copyReadTarget, buffer2);
        gl.bindBuffer(copyWriteTarget, buffer3);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, 16384);
        gl.bindBuffer(copyReadTarget, buffer3);
        gl.bindBuffer(copyWriteTarget, buffer4);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, 8192);
    } catch(e) {}

    try {
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(copyReadTarget, buffer1);
        gl.bindBuffer(copyWriteTarget, buffer2);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, 1024);
        gl.deleteBuffer(buffer2);
        gl.bindBuffer(copyWriteTarget, buffer2);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, 512);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

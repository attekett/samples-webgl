<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    // ============ DECLARATION ZONE ============
    // Tier 1: Amplification Variables
    const texSize = 256;
    const layerCount = 4;
    const mrtCount = 4;
    const texPixels = texSize * texSize;
    const bufferSize = texPixels * 12;
    const vertexCount = 6;

    // Tier 3: Enum Constants
    const textureTarget = gl.TEXTURE_2D_ARRAY;
    const intFormat = gl.RGBA32I;
    const bufferTarget = gl.ARRAY_BUFFER;

    // ============ SETUP ZONE ============

    // Block 1: Buffer creation with bind ping-pong
    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, gl.STATIC_DRAW);
        const vertices = new Float32Array([
            -1.0, -1.0, 0.0,
             1.0, -1.0, 0.0,
            -1.0,  1.0, 0.0,
            -1.0,  1.0, 0.0,
             1.0, -1.0, 0.0,
             1.0,  1.0, 0.0
        ]);
        gl.bufferSubData(bufferTarget, 0, vertices);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 4096, gl.DYNAMIC_DRAW);
    } catch(e) {}

    // Block 2: Integer texture array 1 creation with redundancy
    try {
        const intTexArray1 = gl.createTexture();
        const intTexArray1_alt = gl.createTexture();
        const intTexArray1_alt2 = gl.createTexture();
        gl.bindTexture(textureTarget, intTexArray1);
        gl.bindTexture(textureTarget, intTexArray1_alt);
        gl.bindTexture(textureTarget, intTexArray1);
        gl.texImage3D(textureTarget, 0, intFormat, texSize, texSize, layerCount, 0, gl.RGBA_INTEGER, gl.INT, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindTexture(textureTarget, intTexArray1_alt2);
    } catch(e) {}

    // Block 3: Integer texture array 2 and 3 creation
    try {
        const intTexArray2 = gl.createTexture();
        const intTexArray3 = gl.createTexture();
        gl.bindTexture(textureTarget, intTexArray2);
        gl.texImage3D(textureTarget, 0, gl.RGBA32I, 512, 512, 8, 0, gl.RGBA_INTEGER, gl.INT, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(textureTarget, intTexArray3);
        gl.texImage3D(textureTarget, 0, intFormat, texSize, texSize, layerCount, 0, gl.RGBA_INTEGER, gl.INT, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(textureTarget, intTexArray2);
        gl.bindTexture(textureTarget, intTexArray3);
    } catch(e) {}

    // Block 4: Integer texture array 4 creation with unsigned format
    try {
        const intTexArray4 = gl.createTexture();
        gl.bindTexture(textureTarget, intTexArray4);
        gl.texImage3D(textureTarget, 0, gl.RGBA32UI, 128, 128, 2, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    // Block 5: Shader compilation with flat varyings for integers
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            flat out ivec4 vIntData;
            flat out int vLayer;
            void main() {
                gl_Position = vec4(position, 1.0);
                vIntData = ivec4(int(gl_VertexID), int(gl_VertexID) * 2, int(gl_VertexID) * 3, 255);
                vLayer = int(gl_VertexID) % 4;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp int;
            flat in ivec4 vIntData;
            flat in int vLayer;
            layout(location = 0) out ivec4 fragColor0;
            layout(location = 1) out ivec4 fragColor1;
            layout(location = 2) out ivec4 fragColor2;
            layout(location = 3) out ivec4 fragColor3;
            void main() {
                fragColor0 = vIntData;
                fragColor1 = ivec4(vLayer, vLayer * 10, vLayer * 20, 100);
                fragColor2 = ivec4(255 - vIntData.x, vIntData.y, vIntData.z, vIntData.w);
                fragColor3 = ivec4(vIntData.w, vIntData.z, vIntData.y, vIntData.x);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    // Block 6: Layered FBO setup with MRT integer attachments - attachment swapping
    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, intTexArray1, 0, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, intTexArray2, 0, 1);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, intTexArray3, 0, 2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, intTexArray4, 0, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT3, intTexArray4, 0, 1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, intTexArray2, 0, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2,
            gl.COLOR_ATTACHMENT3
        ]);
    } catch(e) {}

    // ============ EXECUTION ZONE ============

    // Block 7: Draw to multiple layers
    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        const clearInt = new Int32Array([0, 0, 0, 0]);
        gl.clearBufferiv(gl.COLOR, 0, clearInt);
        gl.clearBufferiv(gl.COLOR, 1, clearInt);
        gl.clearBufferiv(gl.COLOR, 2, clearInt);
        gl.clearBufferiv(gl.COLOR, 3, clearInt);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, intTexArray1, 0, 1);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, intTexArray1, 0, 2);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, intTexArray1, 0, 3);
        gl.viewport(0, 0, 128, 128);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) {}

    // Block 8: Layer switching and additional draws
    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.1, 0.2, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    // Block 9: Resource cleanup
    try {
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

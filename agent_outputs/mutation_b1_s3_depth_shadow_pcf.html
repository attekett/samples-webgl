<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    // ============ DECLARATION ZONE ============
    // Tier 1: Amplification Variables
    const shadowSize = 512;
    const texSize = 256;
    const kernelSize = 3;
    const vertexCount = 6;
    const pcfSamples = 9;
    const shadowPixels = shadowSize * shadowSize;
    const bufferSize = vertexCount * 12;

    // Tier 3: Enum Constants
    const depthFormat = gl.DEPTH_COMPONENT24;
    const compareMode = gl.COMPARE_REF_TO_TEXTURE;
    const textureTarget = gl.TEXTURE_2D;
    const bufferTarget = gl.ARRAY_BUFFER;

    // ============ SETUP ZONE ============

    // Block 1: Geometry buffer creation with bind ping-pong
    try {
        const geomBuffer = gl.createBuffer();
        const geomBuffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, geomBuffer);
        gl.bindBuffer(bufferTarget, geomBuffer2);
        gl.bindBuffer(bufferTarget, geomBuffer);
        gl.bufferData(bufferTarget, bufferSize, gl.STATIC_DRAW);
        const vertices = new Float32Array([
            -1.0, -1.0, 0.0,
             1.0, -1.0, 0.0,
            -1.0,  1.0, 0.0,
            -1.0,  1.0, 0.0,
             1.0, -1.0, 0.0,
             1.0,  1.0, 0.0
        ]);
        gl.bufferSubData(bufferTarget, 0, vertices);
        gl.bindBuffer(bufferTarget, geomBuffer2);
        gl.bindBuffer(bufferTarget, geomBuffer);
    } catch(e) {}

    // Block 2: Depth texture creation with bind ping-pong
    try {
        const depthTex = gl.createTexture();
        const depthTex2 = gl.createTexture();
        const depthTex3 = gl.createTexture();
        gl.bindTexture(textureTarget, depthTex);
        gl.bindTexture(textureTarget, depthTex2);
        gl.bindTexture(textureTarget, depthTex);
        gl.texImage2D(textureTarget, 0, depthFormat, shadowSize, shadowSize, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindTexture(textureTarget, depthTex3);
        gl.bindTexture(textureTarget, depthTex);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    // Block 3: Shadow texture with comparison mode thrashing
    try {
        const shadowTex = gl.createTexture();
        gl.bindTexture(textureTarget, shadowTex);
        gl.texImage2D(textureTarget, 0, depthFormat, shadowSize, shadowSize, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_COMPARE_MODE, compareMode);
        gl.texParameteri(textureTarget, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
        gl.texParameteri(textureTarget, gl.TEXTURE_COMPARE_MODE, gl.NONE);
        gl.texParameteri(textureTarget, gl.TEXTURE_COMPARE_MODE, compareMode);
        gl.texParameteri(textureTarget, gl.TEXTURE_COMPARE_FUNC, gl.GEQUAL);
        gl.texParameteri(textureTarget, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    // Block 4: Shadow pass shader compilation
    try {
        const shadowVs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(shadowVs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position * 0.8, 1.0);
            }
        `);
        gl.compileShader(shadowVs);

        const shadowFs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(shadowFs, `#version 300 es
            precision highp float;
            void main() {
            }
        `);
        gl.compileShader(shadowFs);

        const shadowProgram = gl.createProgram();
        gl.attachShader(shadowProgram, shadowVs);
        gl.attachShader(shadowProgram, shadowFs);
        gl.linkProgram(shadowProgram);
    } catch(e) {}

    // Block 5: Main shader with PCF
    try {
        const mainVs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(mainVs, `#version 300 es
            in vec3 position;
            out vec4 vShadowCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vShadowCoord = vec4(position * 0.5 + 0.5, 1.0);
            }
        `);
        gl.compileShader(mainVs);

        const mainFs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(mainFs, `#version 300 es
            precision highp float;
            in vec4 vShadowCoord;
            uniform sampler2DShadow uShadowMap;
            out vec4 fragColor;
            void main() {
                float shadow = 0.0;
                float texelSize = 1.0 / float(${shadowSize});
                for(int x = -1; x <= 1; x++) {
                    for(int y = -1; y <= 1; y++) {
                        vec3 offset = vec3(float(x) * texelSize, float(y) * texelSize, 0.0);
                        shadow += texture(uShadowMap, vShadowCoord.xyz + offset);
                    }
                }
                shadow /= 9.0;
                fragColor = vec4(vec3(shadow), 1.0);
            }
        `);
        gl.compileShader(mainFs);

        const mainProgram = gl.createProgram();
        gl.attachShader(mainProgram, mainVs);
        gl.attachShader(mainProgram, mainFs);
        gl.linkProgram(mainProgram);
    } catch(e) {}

    // Block 6: Shadow FBO setup with attachment swapping
    try {
        const shadowFbo = gl.createFramebuffer();
        const shadowFbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, textureTarget, depthTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, textureTarget, shadowTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, textureTarget, depthTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
    } catch(e) {}

    // Block 7: Main FBO setup
    try {
        const mainFbo = gl.createFramebuffer();
        const colorTex = gl.createTexture();
        gl.bindTexture(textureTarget, colorTex);
        gl.texImage2D(textureTarget, 0, gl.RGBA, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.bindFramebuffer(gl.FRAMEBUFFER, mainFbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, textureTarget, colorTex, 0);
    } catch(e) {}

    // ============ EXECUTION ZONE ============

    // Block 8: Shadow pass with depth test thrashing
    try {
        gl.useProgram(shadowProgram);
        const shadowPosLoc = gl.getAttribLocation(shadowProgram, 'position');
        gl.enableVertexAttribArray(shadowPosLoc);
        gl.bindBuffer(bufferTarget, geomBuffer);
        gl.vertexAttribPointer(shadowPosLoc, 3, gl.FLOAT, false, 12, 0);

        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
        gl.viewport(0, 0, shadowSize, shadowSize);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.depthMask(true);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.depthFunc(gl.LEQUAL);
        gl.depthFunc(gl.LESS);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.viewport(0, 0, 1024, 1024);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        gl.viewport(0, 0, shadowSize, shadowSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    // Block 9: Main pass with shadow sampling
    try {
        gl.useProgram(mainProgram);
        const mainPosLoc = gl.getAttribLocation(mainProgram, 'position');
        gl.enableVertexAttribArray(mainPosLoc);
        gl.bindBuffer(bufferTarget, geomBuffer);
        gl.vertexAttribPointer(mainPosLoc, 3, gl.FLOAT, false, 12, 0);

        const shadowMapLoc = gl.getUniformLocation(mainProgram, 'uShadowMap');
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(textureTarget, shadowTex);
        gl.uniform1i(shadowMapLoc, 0);

        gl.bindFramebuffer(gl.FRAMEBUFFER, mainFbo);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.2, 0.3, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.disable(gl.DEPTH_TEST);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) {}

    // Block 10: Cleanup with deletion patterns
    try {
        gl.bindTexture(textureTarget, shadowTex);
        gl.deleteTexture(shadowTex);
        gl.bindTexture(textureTarget, shadowTex);
        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
        gl.deleteFramebuffer(shadowFbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFbo);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

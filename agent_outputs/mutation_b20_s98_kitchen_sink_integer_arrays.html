<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const intTexCount = 4;
const arrayLayers = 16;
const mrtCount = 4;
const texSize = 256;
const layerStride = 2;
const clearValue = 127;

const texture2DArrayTarget = 0x8C1A;
const rgba32iFormat = 0x8D82;
const rgba32uiFormat = 0x8D70;
const r32iFormat = 0x8235;
const intSampler2DArray = 0x8DCF;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const intTexArray1 = gl.createTexture();
        const intTexArray2 = gl.createTexture();
        const intTexArray3 = gl.createTexture();
        const intTexArray4 = gl.createTexture();
        gl.bindTexture(texture2DArrayTarget, intTexArray1);
        gl.texImage3D(texture2DArrayTarget, 0, rgba32iFormat, texSize, texSize, arrayLayers, 0, gl.RGBA_INTEGER, gl.INT, null);
        gl.texParameteri(texture2DArrayTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(texture2DArrayTarget, intTexArray2);
        gl.texImage3D(texture2DArrayTarget, 0, rgba32uiFormat, 128, 128, 8, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, null);
        gl.bindTexture(texture2DArrayTarget, intTexArray3);
        gl.texImage3D(texture2DArrayTarget, 0, r32iFormat, texSize, texSize, arrayLayers, 0, gl.RED_INTEGER, gl.INT, null);
        gl.bindTexture(texture2DArrayTarget, intTexArray4);
        gl.texImage3D(texture2DArrayTarget, 0, rgba32iFormat, 64, 64, 4, 0, gl.RGBA_INTEGER, gl.INT, null);
    } catch(e) {}

    try {
        const intTex1 = gl.createTexture();
        const intTex2 = gl.createTexture();
        const intTex3 = gl.createTexture();
        const intTex4 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, intTex1);
        gl.texImage2D(gl.TEXTURE_2D, 0, rgba32iFormat, texSize, texSize, 0, gl.RGBA_INTEGER, gl.INT, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindTexture(gl.TEXTURE_2D, intTex2);
        gl.texImage2D(gl.TEXTURE_2D, 0, rgba32uiFormat, texSize, texSize, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, null);
        gl.bindTexture(gl.TEXTURE_2D, intTex3);
        gl.texImage2D(gl.TEXTURE_2D, 0, rgba32iFormat, 128, 128, 0, gl.RGBA_INTEGER, gl.INT, null);
        gl.bindTexture(gl.TEXTURE_2D, intTex4);
        gl.texImage2D(gl.TEXTURE_2D, 0, r32iFormat, texSize, texSize, 0, gl.RED_INTEGER, gl.INT, null);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            flat out ivec4 vIntColor;
            flat out int vLayer;
            void main() {
                vIntColor = ivec4(127, 255, 64, 128);
                vLayer = gl_VertexID % 16;
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp isampler2DArray;
            precision highp usampler2DArray;
            uniform isampler2DArray uIntTexArray1;
            uniform usampler2DArray uIntTexArray2;
            uniform isampler2DArray uIntTexArray3;
            flat in ivec4 vIntColor;
            flat in int vLayer;
            layout(location = 0) out ivec4 fragColor0;
            layout(location = 1) out uvec4 fragColor1;
            layout(location = 2) out ivec4 fragColor2;
            layout(location = 3) out ivec4 fragColor3;
            void main() {
                vec3 coord = vec3(gl_FragCoord.xy / 256.0, float(vLayer));
                ivec4 s1 = texture(uIntTexArray1, coord);
                uvec4 s2 = texture(uIntTexArray2, coord);
                ivec4 s3 = texture(uIntTexArray3, coord);
                fragColor0 = vIntColor + s1;
                fragColor1 = uvec4(127) + s2;
                fragColor2 = s3;
                fragColor3 = vIntColor;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 0, 1, -1, 0, 1, 1, 0,
            -1, -1, 0, 1, 1, 0, -1, 1, 0
        ]), gl.STATIC_DRAW);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, intTex1, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, intTex2, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, intTex3, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT3, gl.TEXTURE_2D, intTex4, 0);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3]);
    } catch(e) {}

    try {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(texture2DArrayTarget, intTexArray1);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(texture2DArrayTarget, intTexArray2);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(texture2DArrayTarget, intTexArray3);
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(texture2DArrayTarget, intTexArray4);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearBufferiv(gl.COLOR, 0, [clearValue, clearValue, clearValue, clearValue]);
        gl.clearBufferuiv(gl.COLOR, 1, [255, 255, 255, 255]);
        gl.clearBufferiv(gl.COLOR, 2, [0, 0, 0, 0]);
        gl.clearBufferiv(gl.COLOR, 3, [127, 64, 32, 16]);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.viewport(0, 0, 128, 128);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, intTexArray1, 0, 0);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, intTexArray2, 0, 2);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, intTexArray3, 0, 4);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.5, 0.5, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindTexture(texture2DArrayTarget, intTexArray1);
        gl.deleteTexture(intTexArray1);
        gl.bindTexture(texture2DArrayTarget, intTexArray1);
        gl.bindTexture(gl.TEXTURE_2D, intTex1);
        gl.deleteTexture(intTex1);
        gl.bindTexture(gl.TEXTURE_2D, intTex1);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.deleteFramebuffer(fbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 256;
const subWidth = 128;
const subHeight = 128;
const unpackAlign1 = 1;
const unpackAlign2 = 2;
const unpackAlign4 = 4;
const unpackAlign8 = 8;
const rowLength = 256;
const skipPixels = 16;
const skipRows = 8;
const imageHeight = 128;

const texture2DTarget = 0x0DE1;
const texture3DTarget = 0x806F;
const textureArrayTarget = 0x8C1A;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex2d1 = gl.createTexture();
        const tex2d2 = gl.createTexture();
        const tex2d3 = gl.createTexture();
        gl.bindTexture(texture2DTarget, tex2d1);
        gl.bindTexture(texture2DTarget, tex2d2);
        gl.bindTexture(texture2DTarget, tex2d1);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(texture2DTarget, tex2d2);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, 128, 128, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(texture2DTarget, tex2d3);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign1);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign2);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign1);
        const data1 = new Uint8Array(texSize * texSize * 4);
        for (let i = 0; i < data1.length; i += 4) {
            data1[i] = 255;
            data1[i + 1] = 128;
            data1[i + 2] = 64;
            data1[i + 3] = 255;
        }
        gl.bindTexture(texture2DTarget, tex2d1);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, data1);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign4);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, rowLength);
        gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, skipPixels);
        gl.pixelStorei(gl.UNPACK_SKIP_ROWS, skipRows);
        const data2 = new Uint8Array(texSize * texSize * 4);
        for (let i = 0; i < data2.length; i += 4) {
            data2[i] = 64;
            data2[i + 1] = 255;
            data2[i + 2] = 128;
            data2[i + 3] = 255;
        }
        gl.bindTexture(texture2DTarget, tex2d2);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, 128, 128, 0, gl.RGBA, gl.UNSIGNED_BYTE, data2);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.UNPACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign8);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 128);
        const data3 = new Uint8Array(subWidth * subHeight * 4);
        for (let i = 0; i < data3.length; i += 4) {
            data3[i] = 128;
            data3[i + 1] = 64;
            data3[i + 2] = 255;
            data3[i + 3] = 255;
        }
        gl.bindTexture(texture2DTarget, tex2d1);
        gl.texSubImage2D(texture2DTarget, 0, 0, 0, subWidth, subHeight, gl.RGBA, gl.UNSIGNED_BYTE, data3);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
    } catch(e) {}

    try {
        const tex3d1 = gl.createTexture();
        const tex3d2 = gl.createTexture();
        gl.bindTexture(texture3DTarget, tex3d1);
        gl.bindTexture(texture3DTarget, tex3d2);
        gl.bindTexture(texture3DTarget, tex3d1);
        gl.texImage3D(texture3DTarget, 0, gl.RGBA8, 64, 64, 8, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(texture3DTarget, tex3d2);
        gl.texImage3D(texture3DTarget, 0, gl.RGBA8, texSize, texSize, 4, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign2);
        gl.pixelStorei(gl.UNPACK_IMAGE_HEIGHT, imageHeight);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, rowLength);
        gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 8);
        gl.pixelStorei(gl.UNPACK_SKIP_ROWS, 4);
        const data4 = new Uint8Array(64 * 64 * 8 * 4);
        for (let i = 0; i < data4.length; i += 4) {
            data4[i] = 200;
            data4[i + 1] = 100;
            data4[i + 2] = 50;
            data4[i + 3] = 255;
        }
        gl.bindTexture(texture3DTarget, tex3d1);
        gl.texImage3D(texture3DTarget, 0, gl.RGBA8, 64, 64, 8, 0, gl.RGBA, gl.UNSIGNED_BYTE, data4);
        gl.pixelStorei(gl.UNPACK_IMAGE_HEIGHT, 0);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.UNPACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        const texArray1 = gl.createTexture();
        gl.bindTexture(textureArrayTarget, texArray1);
        gl.texImage3D(textureArrayTarget, 0, gl.RGBA8, texSize, texSize, 8, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign4);
        gl.pixelStorei(gl.UNPACK_IMAGE_HEIGHT, 128);
        const data5 = new Uint8Array(texSize * texSize * 8 * 4);
        for (let i = 0; i < data5.length; i += 4) {
            data5[i] = 50;
            data5[i + 1] = 200;
            data5[i + 2] = 150;
            data5[i + 3] = 255;
        }
        gl.texImage3D(textureArrayTarget, 0, gl.RGBA8, texSize, texSize, 8, 0, gl.RGBA, gl.UNSIGNED_BYTE, data5);
        gl.pixelStorei(gl.UNPACK_IMAGE_HEIGHT, 0);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign1);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 64);
        gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, skipPixels);
        const data6 = new Uint8Array(64 * 64 * 4);
        for (let i = 0; i < data6.length; i += 4) {
            data6[i] = 150;
            data6[i + 1] = 50;
            data6[i + 2] = 200;
            data6[i + 3] = 255;
        }
        gl.bindTexture(texture3DTarget, tex3d2);
        gl.texSubImage3D(texture3DTarget, 0, 0, 0, 0, 64, 64, 1, gl.RGBA, gl.UNSIGNED_BYTE, data6);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 0);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, unpackAlign8);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, rowLength);
        gl.pixelStorei(gl.UNPACK_IMAGE_HEIGHT, imageHeight);
        gl.pixelStorei(gl.UNPACK_SKIP_ROWS, skipRows);
        const data7 = new Uint8Array(texSize * texSize * 4);
        for (let i = 0; i < data7.length; i += 4) {
            data7[i] = 100;
            data7[i + 1] = 150;
            data7[i + 2] = 200;
            data7[i + 3] = 255;
        }
        gl.bindTexture(textureArrayTarget, texArray1);
        gl.texSubImage3D(textureArrayTarget, 0, 0, 0, 2, texSize, texSize, 1, gl.RGBA, gl.UNSIGNED_BYTE, data7);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.UNPACK_IMAGE_HEIGHT, 0);
        gl.pixelStorei(gl.UNPACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec2 vUV;
            void main() {
                vUV = position.xy * 0.5 + 0.5;
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            uniform sampler2D tex;
            in vec2 vUV;
            out vec4 fragColor;
            void main() {
                fragColor = texture(tex, vUV);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(texture2DTarget, tex2d1);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

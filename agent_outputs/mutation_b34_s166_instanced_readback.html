<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 1024;
const batchSize = 256;
const texSize = 256;
const pixelStride = 4;
const bufferSize = texSize * texSize * pixelStride;
const readCycles = 4;
const packAlign = 4;

const drawMode = 4;
const instanceMode = 33751;
const packBufferTarget = 35051;
const pixelPackTarget = 35053;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        const colorTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, colorTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in vec3 instanceColor;
            out vec3 vColor;
            void main() {
                float offset = float(gl_InstanceID) * 0.001;
                vec3 pos = position + vec3(offset, offset, 0.0);
                vColor = instanceColor + vec3(float(gl_InstanceID) / 1024.0);
                gl_Position = vec4(pos, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(vColor, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const positions = new Float32Array([
            -0.01, -0.01, 0.0, 0.01, -0.01, 0.0, 0.0, 0.01, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        const colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        const colors = new Float32Array(instanceCount * 3);
        for (let i = 0; i < instanceCount; i++) {
            colors[i * 3] = Math.sin(i * 0.01);
            colors[i * 3 + 1] = Math.cos(i * 0.01);
            colors[i * 3 + 2] = Math.sin(i * 0.02);
        }
        gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
        const colorLoc = gl.getAttribLocation(program, 'instanceColor');
        gl.enableVertexAttribArray(colorLoc);
        gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 12, 0);
        gl.vertexAttribDivisor(colorLoc, 1);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, instanceCount);
    } catch(e) {}

    try {
        const pixels1 = new Uint8Array(bufferSize);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels1);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels1);
    } catch(e) {}

    try {
        const pixels2 = new Uint8Array(128 * 128 * 4);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 2);
        gl.readPixels(64, 64, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, pixels2);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 8);
        gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels2);
    } catch(e) {}

    try {
        const pbo1 = gl.createBuffer();
        const pbo2 = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, bufferSize, gl.STREAM_READ);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo2);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, bufferSize, gl.STREAM_READ);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    } catch(e) {}

    try {
        const fence1 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        const status = gl.clientWaitSync(fence1, 0, 0);
        gl.deleteSync(fence1);
    } catch(e) {}

    try {
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        const mapped = gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, new Uint8Array(1024));
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo2);
        const mapped2 = gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, new Uint8Array(2048));
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 512);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 16);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 8);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        const pixels3 = new Uint8Array(bufferSize);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels3);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 512);
    } catch(e) {}

    try {
        gl.deleteBuffer(pbo1);
        gl.deleteBuffer(pbo2);
        gl.deleteFramebuffer(fbo);
        gl.deleteTexture(colorTex);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const batch1 = 256;
const batch2 = 512;
const batch3 = 1024;
const texSize = 256;
const readCount = 16;

const scissorX = 64;
const scissorY = 64;
const scissorW = 128;
const scissorH = 128;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        const colorTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, colorTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in vec3 color;
            out vec3 vColor;
            void main() {
                float offset = float(gl_InstanceID) * 0.0008;
                vec2 spiral = vec2(cos(offset * 100.0), sin(offset * 100.0)) * offset;
                vec3 pos = position + vec3(spiral, 0.0);
                vColor = color + vec3(float(gl_InstanceID % 256) / 255.0);
                gl_Position = vec4(pos, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(vColor, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const positions = new Float32Array([
            -0.01, -0.01, 0.0, 0.01, -0.01, 0.0, 0.0, 0.01, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        const colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        const colors = new Float32Array(batch3 * 3);
        for (let i = 0; i < batch3; i++) {
            colors[i * 3] = Math.abs(Math.sin(i * 0.01));
            colors[i * 3 + 1] = Math.abs(Math.cos(i * 0.02));
            colors[i * 3 + 2] = Math.abs(Math.sin(i * 0.03));
        }
        gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
        const colorLoc = gl.getAttribLocation(program, 'color');
        gl.enableVertexAttribArray(colorLoc);
        gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 12, 0);
        gl.vertexAttribDivisor(colorLoc, 1);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, batch1);
    } catch(e) {}

    try {
        const pixels1 = new Uint8Array(256 * 256 * 4);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixels1);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixels1);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 2);
        gl.readPixels(128, 128, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, pixels1);
    } catch(e) {}

    try {
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, batch2);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 512);
        const pixels2 = new Uint8Array(256 * 256 * 4);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixels2);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 16);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, pixels2);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 8);
        gl.readPixels(64, 64, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels2);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(scissorX, scissorY, scissorW, scissorH);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, batch3);
        gl.disable(gl.SCISSOR_TEST);
    } catch(e) {}

    try {
        for (let i = 0; i < 8; i++) {
            const x = i * 32;
            const y = i * 32;
            const pixels = new Uint8Array(32 * 32 * 4);
            gl.readPixels(x, y, 32, 32, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        }
    } catch(e) {}

    try {
        const pbo1 = gl.createBuffer();
        const pbo2 = gl.createBuffer();
        const pbo3 = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 256 * 256 * 4, gl.STREAM_READ);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, 0);

        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo2);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 128 * 128 * 4, gl.STREAM_READ);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, 0);

        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo3);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 128 * 128 * 4, gl.STREAM_READ);
        gl.readPixels(128, 128, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    } catch(e) {}

    try {
        const fence1 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const fence2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.clientWaitSync(fence1, 0, 0);
        gl.clientWaitSync(fence2, 0, 1000000);
        gl.deleteSync(fence1);
        gl.deleteSync(fence2);
    } catch(e) {}

    try {
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        const data1 = gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, new Uint8Array(1024));
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo2);
        const data2 = gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, new Uint8Array(512));
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo3);
        const data3 = gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, new Uint8Array(256));
    } catch(e) {}

    try {
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, 0, 128, 128);
        gl.clearColor(0.5, 0.5, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.scissor(128, 128, 128, 128);
        gl.clearColor(0.3, 0.3, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.disable(gl.SCISSOR_TEST);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 128);
    } catch(e) {}

    try {
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        for (let i = 0; i < readCount; i++) {
            const size = 16 + i * 8;
            const pixels = new Uint8Array(size * size * 4);
            gl.pixelStorei(gl.PACK_ALIGNMENT, (i % 3) + 1);
            gl.readPixels(i * 16, 0, size, size, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.12, 0.12, 0.12, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 256);
    } catch(e) {}

    try {
        const finalPixels = new Uint8Array(256 * 256 * 4);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, finalPixels);
    } catch(e) {}

    try {
        gl.deleteBuffer(pbo1);
        gl.deleteBuffer(pbo2);
        gl.deleteBuffer(pbo3);
        gl.deleteTexture(colorTex);
        gl.deleteFramebuffer(fbo);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

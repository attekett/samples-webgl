<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_texture_filter_anisotropic'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    const ext = gl.getExtension('EXT_texture_filter_anisotropic');

    let samplerCount = 16;
    let textureSize = 256;
    let numDraws = 32;
    let flushCommandsFlag = gl.SYNC_FLUSH_COMMANDS_BIT;

    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, `#version 300 es
        in vec2 a_position;
        out vec2 v_texCoord;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
            v_texCoord = a_position * 0.5 + 0.5;
        }
    `);
    gl.compileShader(vertexShader);

    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, `#version 300 es
        precision mediump float;
        in vec2 v_texCoord;
        uniform sampler2D u_texture;
        out vec4 fragColor;
        void main() {
            fragColor = texture(u_texture, v_texCoord);
        }
    `);
    gl.compileShader(fragmentShader);

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    const positions = new Float32Array([
        -1, -1,
         1, -1,
        -1,  1,
         1,  1
    ]);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    const pixels = new Uint8Array(textureSize * textureSize * 4);
    for (let i = 0; i < pixels.length; i += 4) {
        pixels[i] = 100;
        pixels[i + 1] = 150;
        pixels[i + 2] = 200;
        pixels[i + 3] = 255;
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureSize, textureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

    try {
        gl.generateMipmap(gl.TEXTURE_2D);
    } catch (e) {
        throw new Error("Mipmap generation failed: " + e.message);
    }

    let maxAnisotropy = 1.0;
    try {
        maxAnisotropy = gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
    } catch (e) {
        throw new Error("Max anisotropy query failed: " + e.message);
    }

    const samplers = [];
    const syncs = [];

    try {
        for (let i = 0; i < samplerCount; i++) {
            samplers[i] = gl.createSampler();
        }
    } catch (e) {
        throw new Error("Sampler creation failed: " + e.message);
    }

    try {
        for (let i = 0; i < samplerCount; i++) {
            const anisotropyValue = 1.0 + (i / samplerCount) * (maxAnisotropy - 1.0);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.samplerParameterf(samplers[i], ext.TEXTURE_MAX_ANISOTROPY_EXT, anisotropyValue);
        }
    } catch (e) {
        throw new Error("Anisotropic sampler parameter setup failed: " + e.message);
    }

    try {
        gl.samplerParameteri(samplers[0], gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(samplers[0], gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch (e) {
        throw new Error("Sampler 0 wrap mode failed: " + e.message);
    }

    try {
        gl.samplerParameteri(samplers[5], gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.samplerParameteri(samplers[5], gl.TEXTURE_WRAP_T, gl.REPEAT);
    } catch (e) {
        throw new Error("Sampler 5 wrap mode failed: " + e.message);
    }

    try {
        gl.samplerParameteri(samplers[10], gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
        gl.samplerParameteri(samplers[10], gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
    } catch (e) {
        throw new Error("Sampler 10 wrap mode failed: " + e.message);
    }

    for (let draw = 0; draw < numDraws; draw++) {
        const samplerIndex = draw % samplerCount;

        try {
            gl.bindSampler(0, samplers[samplerIndex]);
        } catch (e) {
            throw new Error("Sampler binding failed: " + e.message);
        }

        try {
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        } catch (e) {
            throw new Error("Draw call failed: " + e.message);
        }

        try {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            syncs.push(sync);
        } catch (e) {
            throw new Error("Fence sync creation failed: " + e.message);
        }

        try {
            if (draw % 2 === 0) {
                gl.clientWaitSync(syncs[syncs.length - 1], flushCommandsFlag, gl.TIMEOUT_IGNORED);
            } else {
                gl.clientWaitSync(syncs[syncs.length - 1], 0, 0);
            }
        } catch (e) {
            throw new Error("ClientWaitSync with flags failed: " + e.message);
        }

        try {
            gl.bindSampler(0, null);
        } catch (e) {
            throw new Error("Sampler unbinding failed: " + e.message);
        }
    }

    try {
        for (let i = 0; i < samplerCount; i++) {
            const anisotropy = gl.getSamplerParameter(samplers[i], ext.TEXTURE_MAX_ANISOTROPY_EXT);
            if (anisotropy === null || anisotropy < 1.0) {
                throw new Error("Invalid anisotropy value");
            }
        }
    } catch (e) {
        throw new Error("Anisotropy query failed: " + e.message);
    }

    try {
        for (let i = 0; i < syncs.length; i++) {
            const status = gl.getSyncParameter(syncs[i], gl.SYNC_STATUS);
            if (status !== gl.SIGNALED && status !== gl.UNSIGNALED) {
                throw new Error("Invalid sync status");
            }
        }
    } catch (e) {
        throw new Error("Sync status query failed: " + e.message);
    }

    try {
        for (let i = 0; i < syncs.length; i += 2) {
            gl.waitSync(syncs[i], 0, gl.TIMEOUT_IGNORED);
        }
    } catch (e) {
        throw new Error("WaitSync on even indices failed: " + e.message);
    }

    try {
        for (let i = 0; i < syncs.length; i++) {
            gl.deleteSync(syncs[i]);
        }
    } catch (e) {
        throw new Error("Sync deletion failed: " + e.message);
    }

    try {
        for (let i = 0; i < samplerCount; i++) {
            gl.deleteSampler(samplers[i]);
        }
    } catch (e) {
        throw new Error("Sampler deletion failed: " + e.message);
    }

    gl.deleteTexture(texture);
    gl.deleteBuffer(buffer);
    gl.deleteProgram(program);
    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);
}

main().catch(err => { throw err; });
</script>
</body>
</html>

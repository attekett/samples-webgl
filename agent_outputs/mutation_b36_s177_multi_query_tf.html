<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let tfBufferCount = 4;
    let queryCount = 8;
    let vertexCount = 768;
    let tfIterations = 6;
    let overflowSize = 512;
    let queryPollMax = 256;

    const TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN = 0x8C88;
    const ANY_SAMPLES_PASSED = 0x8C2F;
    const ANY_SAMPLES_PASSED_CONSERVATIVE = 0x8D6A;
    const QUERY_RESULT = 0x8866;
    const QUERY_RESULT_AVAILABLE = 0x8867;

    let tfMode = gl.POINTS;
    let tfBufferTarget = gl.TRANSFORM_FEEDBACK_BUFFER;

    const vertexShader = `#version 300 es
        in vec4 a_position;
        in vec3 a_normal;
        in float a_id;
        out vec4 v_position;
        out vec3 v_normal;
        out float v_id;
        uniform float u_offset;
        uniform vec3 u_scale;
        void main() {
            v_position = a_position + vec4(u_offset);
            v_normal = normalize(a_normal * u_scale);
            v_id = a_id + u_offset;
            gl_Position = v_position;
            gl_PointSize = 3.0;
        }
    `;

    const fragmentShader = `#version 300 es
        precision highp float;
        in vec3 v_normal;
        in float v_id;
        out vec4 fragColor;
        void main() {
            vec3 color = abs(v_normal) * v_id;
            fragColor = vec4(color, 1.0);
        }
    `;

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vertexShader);
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vs));
        }

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fragmentShader);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fs));
        }

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['v_position', 'v_normal', 'v_id'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
    } catch (e) {}

    function createVertexData(count) {
        const stride = 8;
        const data = new Float32Array(count * stride);
        for (let i = 0; i < count; i++) {
            const base = i * stride;
            data[base + 0] = (Math.random() - 0.5) * 2.0;
            data[base + 1] = (Math.random() - 0.5) * 2.0;
            data[base + 2] = (Math.random() - 0.5) * 0.5;
            data[base + 3] = Math.random();
            data[base + 4] = Math.random() * 2.0 - 1.0;
            data[base + 5] = Math.random() * 2.0 - 1.0;
            data[base + 6] = Math.random() * 2.0 - 1.0;
            data[base + 7] = i / count;
        }
        return data;
    }

    const vertexData = createVertexData(vertexCount);

    let vbo;
    try {
        vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
    } catch (e) {}

    let tfBuffers = [];
    try {
        for (let i = 0; i < tfBufferCount; i++) {
            const buf = gl.createBuffer();
            gl.bindBuffer(tfBufferTarget, buf);
            const size = (i === tfBufferCount - 1) ? overflowSize : vertexData.byteLength;
            gl.bufferData(tfBufferTarget, size, gl.DYNAMIC_COPY);
            gl.bindBuffer(tfBufferTarget, null);
            tfBuffers.push(buf);
        }
    } catch (e) {}

    let vao;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);

        const posLoc = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 4, gl.FLOAT, false, 32, 0);

        const normalLoc = gl.getAttribLocation(program, 'a_normal');
        gl.enableVertexAttribArray(normalLoc);
        gl.vertexAttribPointer(normalLoc, 3, gl.FLOAT, false, 32, 16);

        const idLoc = gl.getAttribLocation(program, 'a_id');
        gl.enableVertexAttribArray(idLoc);
        gl.vertexAttribPointer(idLoc, 1, gl.FLOAT, false, 32, 28);

        gl.bindVertexArray(null);
    } catch (e) {}

    let tfs = [];
    try {
        for (let i = 0; i < tfBufferCount; i++) {
            const tf = gl.createTransformFeedback();
            gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
            gl.bindBufferBase(tfBufferTarget, 0, tfBuffers[i]);
            gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
            tfs.push(tf);
        }
    } catch (e) {}

    let queries = [];
    try {
        for (let i = 0; i < queryCount; i++) {
            const q = gl.createQuery();
            queries.push(q);
        }
    } catch (e) {}

    try {
        gl.useProgram(program);
        const offsetLoc = gl.getUniformLocation(program, 'u_offset');
        const scaleLoc = gl.getUniformLocation(program, 'u_scale');

        gl.bindVertexArray(vao);
        gl.enable(gl.RASTERIZER_DISCARD);

        for (let iter = 0; iter < tfIterations; iter++) {
            const tfIdx = iter % tfBufferCount;
            const tf = tfs[tfIdx];
            const qIdx1 = (iter * 2) % queryCount;
            const qIdx2 = (iter * 2 + 1) % queryCount;

            gl.uniform1f(offsetLoc, iter * 0.1);
            gl.uniform3f(scaleLoc, 1.0, 1.0 + iter * 0.05, 1.0);

            gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);

            gl.beginQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[qIdx1]);
            gl.beginQuery(ANY_SAMPLES_PASSED, queries[qIdx2]);

            gl.beginTransformFeedback(tfMode);
            gl.drawArrays(gl.POINTS, 0, vertexCount);
            gl.endTransformFeedback();

            gl.endQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
            gl.endQuery(ANY_SAMPLES_PASSED);

            gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        }

        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindVertexArray(null);
    } catch (e) {}

    try {
        for (let i = 0; i < queries.length; i++) {
            let available = false;
            let pollCount = 0;
            while (!available && pollCount < queryPollMax) {
                available = gl.getQueryParameter(queries[i], QUERY_RESULT_AVAILABLE);
                pollCount++;
            }
            if (available) {
                const result = gl.getQueryParameter(queries[i], QUERY_RESULT);
            }
        }
    } catch (e) {}

    try {
        gl.bindVertexArray(vao);
        gl.enable(gl.RASTERIZER_DISCARD);

        const overflowTf = tfs[tfBufferCount - 1];
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, overflowTf);

        const overflowQuery = gl.createQuery();
        gl.beginQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, overflowQuery);
        gl.beginTransformFeedback(tfMode);
        gl.drawArrays(gl.POINTS, 0, vertexCount);
        gl.endTransformFeedback();
        gl.endQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);

        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.bindVertexArray(null);

        let ovAvailable = false;
        let ovPollCount = 0;
        while (!ovAvailable && ovPollCount < 100) {
            ovAvailable = gl.getQueryParameter(overflowQuery, QUERY_RESULT_AVAILABLE);
            ovPollCount++;
        }
        if (ovAvailable) {
            const ovResult = gl.getQueryParameter(overflowQuery, QUERY_RESULT);
        }
        gl.deleteQuery(overflowQuery);
    } catch (e) {}

    try {
        gl.bindVertexArray(vao);
        gl.enable(gl.RASTERIZER_DISCARD);

        for (let i = 0; i < tfBufferCount; i++) {
            gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfs[i]);
            gl.beginTransformFeedback(tfMode);
            gl.drawArrays(gl.POINTS, 0, vertexCount / 4);
            gl.endTransformFeedback();
            gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        }

        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindVertexArray(null);
    } catch (e) {}

    try {
        gl.clearColor(0.1, 0.15, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);

        gl.bindVertexArray(vao);
        gl.drawArrays(gl.POINTS, 0, vertexCount);
        gl.bindVertexArray(null);
    } catch (e) {}

    try {
        for (let i = 0; i < queries.length; i++) {
            gl.deleteQuery(queries[i]);
        }
    } catch (e) {}

    try {
        for (let i = 0; i < tfs.length; i++) {
            gl.deleteTransformFeedback(tfs[i]);
        }
        for (let i = 0; i < tfBuffers.length; i++) {
            gl.deleteBuffer(tfBuffers[i]);
        }
    } catch (e) {}

    try {
        gl.deleteVertexArray(vao);
        gl.deleteBuffer(vbo);
        gl.deleteProgram(program);
    } catch (e) {}

    gl.flush();
    gl.finish();
}

main().catch(err => { throw err; });
</script>
</body>
</html>

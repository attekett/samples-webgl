<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const layerCount = 64;
const instanceCount = 1024;
const queryCount = 16;
const texSize = 128;
const clearValue = 16383;

const arrayTarget = 35866;
const intFormat = 36226;
const queryTarget = 35887;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let intArray;
    try {
        intArray = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D_ARRAY, intArray);
        gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA32I, texSize, texSize, layerCount);
        gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    let queries = [];
    try {
        for (let i = 0; i < queryCount; i++) {
            queries[i] = gl.createQuery();
        }
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[0]);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, queries[1]);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
    } catch(e) {}

    let fbos = [];
    try {
        for (let layer = 0; layer < 8; layer++) {
            fbos[layer] = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[layer]);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, intArray, 0, layer);
        }
    } catch(e) {}

    try {
        for (let i = 0; i < 8; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[i]);
            const clearVal = clearValue + i * 1000;
            gl.clearBufferiv(gl.COLOR, 0, new Int32Array([clearVal, clearVal, clearVal, clearVal]));
        }
    } catch(e) {}

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in float instanceLayer;
            flat out int vLayer;
            out vec3 vColor;
            void main() {
                vLayer = int(instanceLayer);
                float offset = float(gl_InstanceID) / ${instanceCount}.0;
                vColor = vec3(offset, 1.0 - offset, 0.5);
                vec3 pos = position * 0.02;
                pos.x += (offset * 2.0 - 1.0);
                pos.y += cos(offset * 12.56636) * 0.4;
                gl_Position = vec4(pos, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            flat in int vLayer;
            in vec3 vColor;
            out ivec4 fragColor;
            void main() {
                int r = int(vColor.r * 16383.0);
                int g = int(vColor.g * 16383.0);
                int b = int(vColor.b * 16383.0);
                fragColor = ivec4(r + vLayer * 100, g, b, 16383);
            }
        `);
        gl.compileShader(fs);

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    let vao, posBuffer, layerBuffer;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const vertices = new Float32Array([
            -1, -1, 0, 1, -1, 0, -1, 1, 0,
            -1, 1, 0, 1, -1, 0, 1, 1, 0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        layerBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, layerBuffer);
        const layers = new Float32Array(instanceCount);
        for (let i = 0; i < instanceCount; i++) {
            layers[i] = i % layerCount;
        }
        gl.bufferData(gl.ARRAY_BUFFER, layers, gl.STATIC_DRAW);
        const layerLoc = gl.getAttribLocation(program, 'instanceLayer');
        gl.enableVertexAttribArray(layerLoc);
        gl.vertexAttribPointer(layerLoc, 1, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(layerLoc, 1);
    } catch(e) {}

    try {
        for (let layer = 0; layer < 8; layer++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[layer]);
            gl.viewport(0, 0, texSize, texSize);
            gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[layer + 2]);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 128);
            gl.endQuery(gl.ANY_SAMPLES_PASSED);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0]);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[10]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 256);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[3]);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([999, 888, 777, 666]));
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 512);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.2, 0.1, 0.15, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 64);
    } catch(e) {}

    try {
        for (let i = 0; i < 256; i++) {
            let allReady = true;
            for (let q = 0; q < 8; q++) {
                const available = gl.getQueryParameter(queries[q], gl.QUERY_RESULT_AVAILABLE);
                if (!available) allReady = false;
            }
            if (allReady) {
                for (let q = 0; q < 8; q++) {
                    const result = gl.getQueryParameter(queries[q], gl.QUERY_RESULT);
                }
                break;
            }
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[1]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[5]);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([111, 222, 333, 444]));
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 32);
    } catch(e) {}

    try {
        for (let i = 0; i < queryCount; i++) {
            gl.deleteQuery(queries[i]);
        }
        for (let i = 0; i < 8; i++) {
            gl.deleteFramebuffer(fbos[i]);
        }
        gl.deleteTexture(intArray);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const varyingCount = 3;
    const bufferCount = 3;
    const vertexCount = 90;
    const pausePoints = 3;
    const bufferSize = vertexCount * 16;

    const tfMode = gl.SEPARATE_ATTRIBS;
    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.DYNAMIC_COPY;
    const tfTarget = gl.TRANSFORM_FEEDBACK_BUFFER;
    const primitiveMode = gl.POINTS;

    try {
        const inputData = new Float32Array(vertexCount * 3);
        for (let i = 0; i < vertexCount * 3; i++) {
            inputData[i] = (Math.random() - 0.5) * 1.8;
        }
        const inputBuffer = gl.createBuffer();
        gl.bindBuffer(bufferTarget, inputBuffer);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(bufferTarget, inputBuffer);
        gl.bufferData(bufferTarget, inputData, gl.STATIC_DRAW);
        gl.bufferData(bufferTarget, 2048, gl.DYNAMIC_DRAW);
        gl.bufferData(bufferTarget, inputData, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        const tfBuffer1 = gl.createBuffer();
        const tfBuffer2 = gl.createBuffer();
        const tfBuffer3 = gl.createBuffer();
        gl.bindBuffer(tfTarget, tfBuffer1);
        gl.bufferData(tfTarget, bufferSize, bufferUsage);
        gl.bindBuffer(tfTarget, tfBuffer2);
        gl.bufferData(tfTarget, 1024, gl.STREAM_COPY);
        gl.bindBuffer(tfTarget, tfBuffer3);
        gl.bufferData(tfTarget, bufferSize, bufferUsage);
        gl.bindBuffer(tfTarget, tfBuffer1);
        gl.bufferData(tfTarget, bufferSize, bufferUsage);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 v_position;
            out vec4 v_velocity;
            out vec2 v_lifetime;
            void main() {
                v_position = position * 0.95;
                v_velocity = vec4(position * 0.1, length(position));
                v_lifetime = vec2(position.x * position.y, 1.0);
                gl_Position = vec4(position, 1.0);
                gl_PointSize = 2.0;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(1.0, 0.7, 0.2, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['v_position', 'v_velocity', 'v_lifetime'], tfMode);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.bindBuffer(bufferTarget, inputBuffer);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        const tf = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
    } catch(e) {}

    try {
        gl.bindBufferBase(tfTarget, 0, tfBuffer1);
        gl.bindBufferBase(tfTarget, 1, tfBuffer2);
        gl.bindBufferBase(tfTarget, 2, tfBuffer3);
        gl.bindBufferBase(tfTarget, 0, tfBuffer2);
        gl.bindBufferBase(tfTarget, 1, tfBuffer1);
        gl.bindBufferBase(tfTarget, 2, tfBuffer3);
        gl.bindBufferBase(tfTarget, 0, tfBuffer1);
        gl.bindBufferBase(tfTarget, 1, tfBuffer2);
        gl.bindBufferBase(tfTarget, 2, tfBuffer3);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginTransformFeedback(primitiveMode);
        gl.drawArrays(primitiveMode, 0, 30);
        gl.pauseTransformFeedback();
        gl.drawArrays(gl.TRIANGLES, 30, 30);
        gl.resumeTransformFeedback();
        gl.drawArrays(primitiveMode, 60, 30);
        gl.endTransformFeedback();
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginTransformFeedback(primitiveMode);
        for (let i = 0; i < pausePoints; i++) {
            const start = i * 30;
            gl.drawArrays(primitiveMode, start, 15);
            gl.pauseTransformFeedback();
            gl.resumeTransformFeedback();
            gl.drawArrays(primitiveMode, start + 15, 15);
            if (i < pausePoints - 1) {
                gl.pauseTransformFeedback();
                gl.resumeTransformFeedback();
            }
        }
        gl.endTransformFeedback();
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        const readData1 = new Float32Array(128);
        const readData2 = new Float32Array(128);
        const readData3 = new Float32Array(128);
        gl.bindBuffer(tfTarget, tfBuffer1);
        gl.getBufferSubData(tfTarget, 0, readData1);
        gl.bindBuffer(tfTarget, tfBuffer2);
        gl.getBufferSubData(tfTarget, 0, readData2);
        gl.bindBuffer(tfTarget, tfBuffer3);
        gl.getBufferSubData(tfTarget, 0, readData3);
    } catch(e) {}

    try {
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.drawArrays(primitiveMode, 0, vertexCount);
        gl.drawArrays(gl.POINTS, 0, 45);
        gl.drawArrays(gl.POINTS, 45, 45);
    } catch(e) {}

    try {
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.deleteTransformFeedback(tf);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBuffer(tfTarget, tfBuffer1);
        gl.deleteBuffer(tfBuffer1);
        gl.bindBuffer(tfTarget, tfBuffer1);
        gl.bindBufferBase(tfTarget, 0, tfBuffer1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

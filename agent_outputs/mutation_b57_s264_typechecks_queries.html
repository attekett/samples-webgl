<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 256;
const texPixels = texSize * texSize;
const bufferSize = texPixels * 4;
const vertexCount = 6;
const indexCount = vertexCount * 3;
const instanceCount = vertexCount * 2;
const stride = 16;
const rangeStart = 0;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const bufferTarget = gl.ARRAY_BUFFER;
    const elementTarget = gl.ELEMENT_ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const depthCmpFunc = gl.LEQUAL;
    const blendSrc = gl.SRC_ALPHA;

    let program, vs, fs, vao, vao2, fbo, rbo, query, query2, sampler, sampler2, sync1, tf, tf2;
    let buffer1, buffer2, indexBuffer;

    try {
        vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
precision highp float;
in vec2 aPos;
flat out vec4 vPacked;
void main() {
    vec2 snorm = vec2(aPos.x, aPos.y);
    uint packed1 = packSnorm2x16(snorm);
    vec2 unpacked1 = unpackSnorm2x16(packed1);
    uint packed2 = packHalf2x16(snorm);
    vec2 unpacked2 = unpackHalf2x16(packed2);
    gl_Position = vec4(unpacked1 + unpacked2, 0.0, 1.0);
    vPacked = vec4(float(packed1), float(packed2), unpacked1.x, unpacked2.y);
}
`);
        gl.compileShader(vs);

        fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
precision highp float;
flat in vec4 vPacked;
out vec4 fragColor;
void main() {
    vec2 testVec = vec2(0.5, -0.3);
    uint sn = packSnorm2x16(testVec);
    vec2 usn = unpackSnorm2x16(sn);
    uint hf = packHalf2x16(testVec);
    vec2 uhf = unpackHalf2x16(hf);
    fragColor = vec4(usn.x, uhf.y, vPacked.z, 1.0);
}
`);
        gl.compileShader(fs);

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const src1 = gl.getShaderSource(vs);
        const src2 = gl.getShaderSource(fs);

        const precHigh = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
        const precMed = gl.getShaderPrecisionFormat(gl.VERTEX_SHADER, gl.MEDIUM_FLOAT);
        const precLow = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.LOW_INT);
        const precHighInt = gl.getShaderPrecisionFormat(gl.VERTEX_SHADER, gl.HIGH_INT);

        const attached = gl.getAttachedShaders(program);

        gl.detachShader(program, fs);
        const afterDetach = gl.getAttachedShaders(program);
        gl.attachShader(program, fs);
        const afterReattach = gl.getAttachedShaders(program);
        gl.detachShader(program, vs);
        gl.attachShader(program, vs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        buffer1 = gl.createBuffer();
        buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);

        const verts = new Float32Array([
            -0.5, -0.5,  0.5, -0.5,  0.5, 0.5,
            -0.5, -0.5,  0.5,  0.5, -0.5, 0.5
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, verts, bufferUsage);

        indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        const indices = new Uint16Array([0, 1, 2, 3, 4, 5]);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, bufferUsage);

        gl.getError();
        gl.getError();
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao);

        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        const posLoc = gl.getAttribLocation(program, 'aPos');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

        gl.getError();
    } catch(e) {}

    try {
        fbo = gl.createFramebuffer();
        rbo = gl.createRenderbuffer();
        const rbo2 = gl.createRenderbuffer();

        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo2);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, texSize, texSize);

        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);

        gl.getError();
        gl.getError();
    } catch(e) {}

    try {
        query = gl.createQuery();
        query2 = gl.createQuery();
        sampler = gl.createSampler();
        sampler2 = gl.createSampler();
        tf = gl.createTransformFeedback();
        tf2 = gl.createTransformFeedback();

        gl.samplerParameteri(sampler, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.samplerParameteri(sampler2, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindSampler(0, sampler);
        gl.bindSampler(1, sampler2);
        gl.bindSampler(0, sampler);

        gl.getError();
    } catch(e) {}

    try {
        gl.isFramebuffer(fbo);
        gl.isRenderbuffer(rbo);
        gl.isQuery(query);
        gl.isQuery(query2);
        gl.isSampler(sampler);
        gl.isSampler(sampler2);
        gl.isTransformFeedback(tf);
        gl.isTransformFeedback(tf2);
        gl.isVertexArray(vao);
        gl.isVertexArray(vao2);
        gl.isSync(null);

        gl.isEnabled(gl.DEPTH_TEST);
        gl.isEnabled(gl.BLEND);
        gl.isEnabled(gl.STENCIL_TEST);
        gl.isEnabled(gl.SCISSOR_TEST);
        gl.isEnabled(gl.DITHER);
        gl.isEnabled(gl.CULL_FACE);
        gl.isEnabled(gl.POLYGON_OFFSET_FILL);
        gl.isEnabled(gl.SAMPLE_COVERAGE);
        gl.isEnabled(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.isEnabled(gl.RASTERIZER_DISCARD);

        gl.getError();
        gl.getError();
        gl.getError();
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(depthCmpFunc);
        gl.depthMask(true);
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(blendSrc, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
        gl.enable(gl.STENCIL_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, 0, texSize, texSize);
        gl.disable(gl.SCISSOR_TEST);

        gl.isEnabled(gl.DEPTH_TEST);
        gl.isEnabled(gl.BLEND);
        gl.isEnabled(gl.STENCIL_TEST);

        gl.getError();
    } catch(e) {}

    try {
        sync1 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.isSync(sync1);

        gl.bindVertexArray(vao);
        gl.useProgram(program);
        gl.viewport(0, 0, texSize, texSize);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clearColor(0.2, 0.3, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        gl.beginQuery(gl.ANY_SAMPLES_PASSED, query);
        gl.drawRangeElements(gl.TRIANGLES, rangeStart, 5, vertexCount, gl.UNSIGNED_SHORT, 0);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);

        gl.getError();

        gl.drawRangeElements(gl.TRIANGLES, 0, 5, 3, gl.UNSIGNED_SHORT, 0);
        gl.drawRangeElements(gl.TRIANGLES, 0, 5, vertexCount, gl.UNSIGNED_SHORT, 0);

        gl.getError();
        gl.getError();
    } catch(e) {}

    try {
        gl.isFramebuffer(fbo);
        gl.isRenderbuffer(rbo);
        gl.isQuery(query);
        gl.isSampler(sampler);
        gl.isSync(sync1);
        gl.isTransformFeedback(tf);
        gl.isVertexArray(vao);

        gl.deleteQuery(query);
        gl.deleteQuery(query2);
        gl.isQuery(query);

        gl.deleteSampler(sampler);
        gl.deleteSampler(sampler2);
        gl.isSampler(sampler);

        gl.deleteSync(sync1);
        gl.isSync(sync1);

        gl.deleteTransformFeedback(tf);
        gl.deleteTransformFeedback(tf2);
        gl.isTransformFeedback(tf);

        gl.deleteVertexArray(vao2);
        gl.isVertexArray(vao2);

        gl.deleteFramebuffer(fbo);
        gl.isFramebuffer(fbo);

        gl.deleteRenderbuffer(rbo);
        gl.isRenderbuffer(rbo);

        gl.deleteBuffer(buffer1);
        gl.deleteBuffer(buffer2);
        gl.deleteBuffer(indexBuffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);

        gl.getError();
        gl.getError();
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'WEBGL_compressed_texture_s3tc'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    const ext = gl.getExtension('WEBGL_compressed_texture_s3tc');

    const texSize = 256;
    const texPixels = texSize * texSize;
    const mipLevels = 5;
    const vertexCount = 6;
    const bufferSize = vertexCount * 16;

    const compressedFormat = ext.COMPRESSED_RGBA_S3TC_DXT5_EXT;
    const textureTarget = gl.TEXTURE_2D;
    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.REPEAT);
        let currentSize = texSize;
        for (let level = 0; level < mipLevels; level++) {
            const blockSize = 16;
            const numBlocksX = Math.max(1, Math.floor((currentSize + 3) / 4));
            const numBlocksY = Math.max(1, Math.floor((currentSize + 3) / 4));
            const dataSize = numBlocksX * numBlocksY * blockSize;
            const compressedData = new Uint8Array(dataSize);
            for (let i = 0; i < dataSize; i++) {
                compressedData[i] = (level * 50 + i) % 256;
            }
            gl.compressedTexImage2D(textureTarget, level, compressedFormat, currentSize, currentSize, 0, compressedData);
            currentSize = Math.max(1, Math.floor(currentSize / 2));
        }
        gl.bindTexture(textureTarget, tex2);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_NEAREST);
        const smallSize = 128;
        let smallCurrent = smallSize;
        for (let level = 0; level < 4; level++) {
            const numBlocksX = Math.max(1, Math.floor((smallCurrent + 3) / 4));
            const numBlocksY = Math.max(1, Math.floor((smallCurrent + 3) / 4));
            const dataSize = numBlocksX * numBlocksY * 16;
            gl.compressedTexImage2D(textureTarget, level, compressedFormat, smallCurrent, smallCurrent, 0, new Uint8Array(dataSize));
            smallCurrent = Math.max(1, Math.floor(smallCurrent / 2));
        }
        gl.bindTexture(textureTarget, tex1);
    } catch(e) {}

    try {
        const uncompressedTex = gl.createTexture();
        gl.bindTexture(textureTarget, uncompressedTex);
        gl.texStorage2D(textureTarget, mipLevels, gl.RGBA8, texSize, texSize);
        const uncompressedData = new Uint8Array(texPixels * 4);
        for (let y = 0; y < texSize; y++) {
            for (let x = 0; x < texSize; x++) {
                const idx = (y * texSize + x) * 4;
                uncompressedData[idx + 0] = (x / texSize) * 255;
                uncompressedData[idx + 1] = (y / texSize) * 255;
                uncompressedData[idx + 2] = 128;
                uncompressedData[idx + 3] = 255;
            }
        }
        gl.texSubImage2D(textureTarget, 0, 0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, uncompressedData);
        gl.generateMipmap(textureTarget);
        gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 0);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAX_LEVEL, mipLevels - 1);
        gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 1);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAX_LEVEL, 3);
        gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 0);
    } catch(e) {}

    const vertexShaderSource = `#version 300 es
        in vec2 position;
        in vec2 texCoord;
        out vec2 vTexCoord;
        void main() {
            gl_Position = vec4(position, 0.0, 1.0);
            vTexCoord = texCoord;
        }`;

    const fragmentShaderSource = `#version 300 es
        precision highp float;
        in vec2 vTexCoord;
        uniform sampler2D uTexture;
        uniform float uLodBias;
        out vec4 fragColor;
        void main() {
            vec4 color1 = texture(uTexture, vTexCoord);
            vec4 color2 = texture(uTexture, vTexCoord * 2.0);
            vec4 color3 = textureLod(uTexture, vTexCoord, uLodBias);
            fragColor = (color1 + color2 + color3) / 3.0;
        }`;

    try {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        const vertexShader2 = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vertexShaderSource);
        gl.shaderSource(vertexShader2, vertexShaderSource);
        gl.compileShader(vertexShader);
        gl.compileShader(vertexShader2);
        if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vertexShader));
        }
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, fragmentShaderSource);
        gl.compileShader(fragmentShader);
        if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fragmentShader));
        }
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        const renderTex = gl.createTexture();
        gl.bindTexture(textureTarget, renderTex);
        gl.texStorage2D(textureTarget, 1, gl.RGBA8, 256, 256);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, textureTarget, renderTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        const vertices = new Float32Array([
            -1.0, -1.0, 0.0, 0.0,
             1.0, -1.0, 1.0, 0.0,
            -1.0,  1.0, 0.0, 1.0,
            -1.0,  1.0, 0.0, 1.0,
             1.0, -1.0, 1.0, 0.0,
             1.0,  1.0, 1.0, 1.0
        ]);
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, vertices, bufferUsage);
        gl.bufferSubData(bufferTarget, 0, new Float32Array([0.1, 0.9]));
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 768, gl.DYNAMIC_DRAW);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        const texLoc = gl.getAttribLocation(program, 'texCoord');
        const textureLoc = gl.getUniformLocation(program, 'uTexture');
        const lodLoc = gl.getUniformLocation(program, 'uLodBias');
        gl.enableVertexAttribArray(posLoc);
        gl.disableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(texLoc);
        gl.disableVertexAttribArray(texLoc);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 16, 0);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 16, 8);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(textureTarget, tex1);
        gl.uniform1i(textureLoc, 0);
    } catch(e) {}

    try {
        gl.clearColor(0.15, 0.15, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);
        for (let level = 0; level < mipLevels; level++) {
            gl.uniform1f(lodLoc, level);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        }
        gl.bindTexture(textureTarget, tex1);
        gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 2);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAX_LEVEL, 4);
        gl.uniform1f(lodLoc, 1.5);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 0);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAX_LEVEL, mipLevels - 1);
        gl.uniform1f(lodLoc, 3.0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex1);
        gl.deleteTexture(tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.deleteTexture(tex2);
        gl.deleteTexture(tex3);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.deleteBuffer(buffer2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

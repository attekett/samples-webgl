<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    const texSize = 64;
    const instanceCount = 16;
    const vertexCount = 6;
    const bufSize = texSize * texSize * 4;
    const instanceStride = 4;
    const triCount = vertexCount * instanceCount;

    const intTexFormat = gl.RGBA32I;
    const uintTexFormat = gl.RGBA32UI;
    const drawMode = gl.TRIANGLES;
    const bufUsage = gl.DYNAMIC_DRAW;
    const idxType = gl.UNSIGNED_SHORT;

    try {
        var vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
precision highp float;
precision highp int;
in vec2 aPos;
in vec2 aOffset;
in float aScale;
flat out int vId;
out vec2 vUv;
void main() {
    vUv = aPos * 0.5 + 0.5;
    vId = gl_InstanceID;
    gl_Position = vec4(aPos * aScale + aOffset, 0.0, 1.0);
}`);
        gl.compileShader(vs);
        var fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
precision highp float;
precision highp int;
precision highp isampler2D;
precision highp usampler2D;
in vec2 vUv;
flat in int vId;
uniform isampler2D uIntTex;
uniform usampler2D uUintTex;
out vec4 fragColor;
void main() {
    ivec4 iv = texture(uIntTex, vUv);
    uvec4 uv = texture(uUintTex, vUv);
    float r = float(iv.r) / 2147483647.0;
    float g = float(uv.g) / 4294967295.0;
    fragColor = vec4(r, g, float(vId) / 16.0, 1.0);
}`);
        gl.compileShader(fs);
        var prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        gl.useProgram(prog);
    } catch(e) {}

    try {
        var intTex = gl.createTexture();
        var intTex2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, intTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intTexFormat, texSize, texSize);
        var dataI = new Int32Array(texSize * texSize * 4);
        for (var i = 0; i < dataI.length; i++) dataI[i] = (i * 134775813) | 0;
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.INT, dataI);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.bindTexture(gl.TEXTURE_2D, intTex2);
        gl.bindTexture(gl.TEXTURE_2D, intTex);
        gl.bindTexture(gl.TEXTURE_2D, null);
    } catch(e) {}

    try {
        var uintTex = gl.createTexture();
        var uintTex2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, uintTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, uintTexFormat, texSize, texSize);
        var dataU = new Uint32Array(texSize * texSize * 4);
        for (var i = 0; i < dataU.length; i++) dataU[i] = (i * 1664525 + 1013904223) >>> 0;
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.UNSIGNED_INT, dataU);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindTexture(gl.TEXTURE_2D, uintTex2);
        gl.bindTexture(gl.TEXTURE_2D, uintTex);
        gl.bindTexture(gl.TEXTURE_2D, null);
    } catch(e) {}

    try {
        var posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -0.5, -0.5,  0.5, -0.5,  0.5,  0.5,
            -0.5, -0.5,  0.5,  0.5, -0.5,  0.5
        ]), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        var idxBuf = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 3, 4, 5]), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
    } catch(e) {}

    try {
        var offsetBuf = gl.createBuffer();
        var offsetBuf2 = gl.createBuffer();
        var offsets = new Float32Array(instanceCount * 2);
        for (var i = 0; i < instanceCount; i++) {
            offsets[i * 2 + 0] = ((i % 4) / 2.0 - 0.75);
            offsets[i * 2 + 1] = ((Math.floor(i / 4) / 2.0) - 0.75);
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuf);
        gl.bufferData(gl.ARRAY_BUFFER, offsets, bufUsage);
        gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuf2);
        gl.bufferData(gl.ARRAY_BUFFER, 128, bufUsage);
        gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuf);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        var scaleBuf = gl.createBuffer();
        var scales = new Float32Array(instanceCount);
        for (var i = 0; i < instanceCount; i++) scales[i] = 0.2 + (i % 4) * 0.05;
        gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuf);
        gl.bufferData(gl.ARRAY_BUFFER, scales, bufUsage);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
        gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuf);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        var instIdBuf = gl.createBuffer();
        var instIds = new Int32Array(instanceCount);
        for (var i = 0; i < instanceCount; i++) instIds[i] = i;
        gl.bindBuffer(gl.ARRAY_BUFFER, instIdBuf);
        gl.bufferData(gl.ARRAY_BUFFER, instIds, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
    } catch(e) {}

    try {
        var vao = gl.createVertexArray();
        var vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao);

        var posLoc = gl.getAttribLocation(prog, 'aPos');
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 8, 0);
        gl.vertexAttribDivisor(posLoc, 0);

        var offLoc = gl.getAttribLocation(prog, 'aOffset');
        gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuf);
        gl.enableVertexAttribArray(offLoc);
        gl.vertexAttribPointer(offLoc, 2, gl.FLOAT, false, 8, 0);
        gl.vertexAttribDivisor(offLoc, 1);
        gl.vertexAttribDivisor(offLoc, 0);
        gl.vertexAttribDivisor(offLoc, 1);

        var scaleLoc = gl.getAttribLocation(prog, 'aScale');
        gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuf);
        gl.enableVertexAttribArray(scaleLoc);
        gl.vertexAttribPointer(scaleLoc, 1, gl.FLOAT, false, 4, 0);
        gl.vertexAttribDivisor(scaleLoc, 1);

        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
        gl.bindVertexArray(null);
        gl.bindVertexArray(vao);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        var fbo = gl.createFramebuffer();
        var fbo2 = gl.createFramebuffer();
        var colorTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, colorTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 256, 256);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(gl.TEXTURE_2D, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        gl.disable(gl.CULL_FACE);

        gl.useProgram(prog);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, intTex);
        gl.uniform1i(gl.getUniformLocation(prog, 'uIntTex'), 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, uintTex);
        gl.uniform1i(gl.getUniformLocation(prog, 'uUintTex'), 1);

        gl.bindVertexArray(vao);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.1, 0.1, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.drawArraysInstanced(drawMode, 0, vertexCount, instanceCount);
        gl.drawArraysInstanced(drawMode, 0, 6, 8);
        gl.drawElementsInstanced(drawMode, 6, idxType, 0, instanceCount);
        gl.drawElementsInstanced(drawMode, 6, idxType, 0, 8);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 0.2, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindVertexArray(vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 16);
        gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, instanceCount);
        gl.bindVertexArray(null);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.blitFramebuffer(0, 0, 256, 256, 0, 0, 256, 256, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.deleteTexture(intTex);
        gl.bindTexture(gl.TEXTURE_2D, intTex);
        gl.deleteTexture(intTex);
        gl.deleteTexture(uintTex);
        gl.bindTexture(gl.TEXTURE_2D, uintTex);
        gl.deleteBuffer(offsetBuf);
        gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuf);
        gl.deleteBuffer(offsetBuf);
        gl.deleteBuffer(scaleBuf);
        gl.deleteBuffer(instIdBuf);
        gl.deleteBuffer(posBuf);
        gl.deleteBuffer(idxBuf);
        gl.deleteVertexArray(vao);
        gl.bindVertexArray(vao);
        gl.deleteVertexArray(vao);
        gl.deleteFramebuffer(fbo);
        gl.deleteTexture(colorTex);
        gl.deleteProgram(prog);
        gl.deleteShader(vs);
        gl.deleteShader(fs);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

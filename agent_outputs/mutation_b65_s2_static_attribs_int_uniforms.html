<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const texSize = 256;
    const vertexCount = 6;
    const bufSize = texSize * texSize * 4;
    const attribSlot1 = 1;
    const attribSlot2 = 2;
    const attribSlot3 = 3;

    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const texTarget = gl.TEXTURE_2D;
    const drawMode = gl.TRIANGLES;

    let program, vao;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
in vec3 aPos;
out vec4 vColor;
uniform highp ivec2 uIVec2;
uniform highp ivec3 uIVec3;
uniform highp ivec4 uIVec4;
uniform highp uvec2 uUVec2;
uniform highp uvec3 uUVec3;
uniform highp uvec4 uUVec4;
void main() {
    float fi = float(uIVec2.x + uIVec3.x + uIVec4.x);
    float fu = float(uUVec2.x + uUVec3.x + uUVec4.x);
    vColor = vec4(fi * 0.001, fu * 0.001, 0.5, 1.0);
    gl_Position = vec4(aPos, 1.0);
}`);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
precision highp float;
in vec4 vColor;
uniform highp int uInt2;
uniform highp ivec2 uIVec2;
uniform highp ivec3 uIVec3;
uniform highp ivec4 uIVec4;
uniform highp uvec2 uUVec2;
uniform highp uvec3 uUVec3;
uniform highp uvec4 uUVec4;
out vec4 fragColor;
void main() {
    float fi = float(uInt2) * 0.001 + float(uIVec2.y + uIVec3.y + uIVec4.y) * 0.001;
    float fu = float(uUVec2.y + uUVec3.y + uUVec4.y) * 0.001;
    fragColor = vColor + vec4(fi, fu, 0.0, 0.0);
}`);
        gl.compileShader(fs);

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        gl.deleteShader(vs);
        gl.deleteShader(fs);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao);

        const vtxBuf = gl.createBuffer();
        const vtxBuf2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, vtxBuf);
        gl.bindBuffer(bufferTarget, vtxBuf2);
        gl.bindBuffer(bufferTarget, vtxBuf);

        const verts = new Float32Array([
            -1, -1, 0,
             1, -1, 0,
             1,  1, 0,
            -1, -1, 0,
             1,  1, 0,
            -1,  1, 0
        ]);
        gl.bufferData(bufferTarget, verts, bufferUsage);

        const posLoc = gl.getAttribLocation(program, 'aPos');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        gl.vertexAttrib1f(attribSlot1, 0.5);
        gl.vertexAttrib1f(attribSlot1, 0.75);
        gl.vertexAttrib2f(attribSlot2, 0.3, 0.7);
        gl.vertexAttrib2f(attribSlot2, 0.5, 0.5);
        gl.vertexAttrib3f(attribSlot3, 0.1, 0.2, 0.3);
        gl.vertexAttrib3f(attribSlot3, 0.4, 0.5, 0.6);
        gl.vertexAttrib4f(attribSlot1, 0.8, 0.2, 0.4, 1.0);
        gl.vertexAttrib4f(attribSlot1, 0.6, 0.4, 0.3, 1.0);

        gl.vertexAttrib1fv(attribSlot1, new Float32Array([0.6]));
        gl.vertexAttrib1fv(attribSlot1, [0.4]);
        gl.vertexAttrib2fv(attribSlot2, new Float32Array([0.2, 0.8]));
        gl.vertexAttrib2fv(attribSlot2, [0.6, 0.4]);
        gl.vertexAttrib3fv(attribSlot3, new Float32Array([0.3, 0.5, 0.7]));
        gl.vertexAttrib3fv(attribSlot3, [0.1, 0.9, 0.5]);
        gl.vertexAttrib4fv(attribSlot1, new Float32Array([0.7, 0.3, 0.5, 1.0]));
        gl.vertexAttrib4fv(attribSlot1, [0.9, 0.1, 0.3, 1.0]);

        gl.vertexAttribI4i(attribSlot2, 1, 2, 3, 4);
        gl.vertexAttribI4ui(attribSlot3, 5, 6, 7, 8);
        gl.vertexAttribI4iv(attribSlot2, new Int32Array([10, 20, 30, 40]));
        gl.vertexAttribI4iv(attribSlot2, [-1, -2, -3, -4]);
        gl.vertexAttribI4uiv(attribSlot3, new Uint32Array([100, 200, 300, 400]));
        gl.vertexAttribI4uiv(attribSlot3, [11, 22, 33, 44]);
    } catch(e) {}

    try {
        const uInt2Loc = gl.getUniformLocation(program, 'uInt2');
        const uIVec2Loc = gl.getUniformLocation(program, 'uIVec2');
        const uIVec3Loc = gl.getUniformLocation(program, 'uIVec3');
        const uIVec4Loc = gl.getUniformLocation(program, 'uIVec4');
        const uUVec2Loc = gl.getUniformLocation(program, 'uUVec2');
        const uUVec3Loc = gl.getUniformLocation(program, 'uUVec3');
        const uUVec4Loc = gl.getUniformLocation(program, 'uUVec4');

        gl.uniform1i(uInt2Loc, 3);
        gl.uniform2i(uIVec2Loc, 1, 2);
        gl.uniform2i(uIVec2Loc, 5, 7);
        gl.uniform3i(uIVec3Loc, 1, 2, 3);
        gl.uniform4i(uIVec4Loc, 1, 2, 3, 4);

        gl.uniform1iv(uInt2Loc, new Int32Array([7]));
        gl.uniform1iv(uInt2Loc, [5]);
        gl.uniform2iv(uIVec2Loc, new Int32Array([3, 4]));
        gl.uniform2iv(uIVec2Loc, [9, 10]);
        gl.uniform3iv(uIVec3Loc, new Int32Array([5, 6, 7]));
        gl.uniform3iv(uIVec3Loc, [11, 12, 13]);
        gl.uniform4iv(uIVec4Loc, new Int32Array([8, 9, 10, 11]));
        gl.uniform4iv(uIVec4Loc, [14, 15, 16, 17]);

        gl.uniform2ui(uUVec2Loc, 2, 3);
        gl.uniform3ui(uUVec3Loc, 4, 5, 6);
        gl.uniform4ui(uUVec4Loc, 7, 8, 9, 10);

        gl.uniform2uiv(uUVec2Loc, new Uint32Array([20, 30]));
        gl.uniform2uiv(uUVec2Loc, [40, 50]);
        gl.uniform3uiv(uUVec3Loc, new Uint32Array([60, 70, 80]));
        gl.uniform3uiv(uUVec3Loc, [90, 100, 110]);
        gl.uniform4uiv(uUVec4Loc, new Uint32Array([120, 130, 140, 150]));
        gl.uniform4uiv(uUVec4Loc, [160, 170, 180, 190]);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        gl.bindTexture(texTarget, tex1);
        gl.texImage2D(texTarget, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.bindTexture(texTarget, tex2);
        gl.texImage2D(texTarget, 0, gl.RGBA8, 128, 128, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(texTarget, tex1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texTarget, tex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texTarget, tex2, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texTarget, tex2, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.CULL_FACE);

        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(drawMode, 0, vertexCount);
        gl.drawArrays(drawMode, 0, vertexCount);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(drawMode, 0, vertexCount);
        gl.drawArrays(drawMode, 0, 6);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, null);
        gl.deleteProgram(program);
        gl.bindBuffer(bufferTarget, null);
        gl.deleteVertexArray(vao);
        gl.bindVertexArray(vao);
        gl.deleteVertexArray(vao);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

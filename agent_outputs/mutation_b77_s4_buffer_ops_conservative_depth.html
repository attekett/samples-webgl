<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_conservative_depth'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    gl.getExtension('EXT_conservative_depth');

    const texSize = 256;
    const quadVerts = 6;
    const layerCount = 3;
    const copyBytes = 64;

    const bufferTarget = gl.ARRAY_BUFFER;
    const elemTarget = gl.ELEMENT_ARRAY_BUFFER;
    const copyReadTarget = gl.COPY_READ_BUFFER;
    const copyWriteTarget = gl.COPY_WRITE_BUFFER;
    const drawMode = gl.TRIANGLES;
    const depthFunc = gl.LESS;

    var vShader, fShader, program;
    var vao;
    var posBuf, colBuf, copyBuf, idxBuf;

    try {
        vShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vShader, `#version 300 es
precision highp float;
in vec3 aPos;
in vec4 aColor;
out vec4 vColor;
out vec2 vUv;
void main() {
    vColor = aColor;
    vUv = aPos.xy * 0.5 + 0.5;
    gl_Position = vec4(aPos, 1.0);
}`);
        gl.compileShader(vShader);
        fShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShader, `#version 300 es
#extension GL_EXT_conservative_depth : require
precision highp float;
in vec4 vColor;
in vec2 vUv;
layout (depth_greater) out float gl_FragDepth;
layout(location = 0) out vec4 outColor;
void main() {
    float customDepth = 0.5 + 0.4 * sin(vUv.x * 12.0) * cos(vUv.y * 12.0);
    gl_FragDepth = customDepth;
    outColor = vec4(vColor.rgb * (1.0 - customDepth * 0.4), vColor.a);
}`);
        gl.compileShader(fShader);
        program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        posBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, posBuf);
        const posData = new Float32Array(layerCount * quadVerts * 3);
        const scales = [0.85, 0.6, 0.35];
        const depths = [0.2, 0.5, 0.8];
        for (let l = 0; l < layerCount; l++) {
            const base = l * quadVerts * 3;
            const s = scales[l];
            const d = depths[l];
            posData.set([
                -s, -s, d,   s, -s, d,   s,  s, d,
                -s, -s, d,   s,  s, d,  -s,  s, d
            ], base);
        }
        gl.bufferData(bufferTarget, posData, gl.DYNAMIC_DRAW);

        colBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, colBuf);
        const colData = new Float32Array(layerCount * quadVerts * 4);
        const colors = [
            [0.8, 0.2, 0.4, 1.0],
            [0.2, 0.8, 0.5, 1.0],
            [0.3, 0.5, 0.9, 1.0]
        ];
        for (let l = 0; l < layerCount; l++) {
            const base = l * quadVerts * 4;
            const c = colors[l];
            for (let v = 0; v < quadVerts; v++) {
                colData[base + v * 4 + 0] = c[0];
                colData[base + v * 4 + 1] = c[1];
                colData[base + v * 4 + 2] = c[2];
                colData[base + v * 4 + 3] = c[3];
            }
        }
        gl.bufferData(bufferTarget, colData, gl.STATIC_DRAW);

        copyBuf = gl.createBuffer();
        gl.bindBuffer(copyReadTarget, copyBuf);
        gl.bufferData(copyReadTarget, 256, gl.STATIC_DRAW);
        const updateData = new Float32Array([1.0, 0.9, 0.1, 1.0, 1.0, 0.9, 0.1, 1.0]);
        gl.bufferSubData(copyReadTarget, 0, updateData);

        gl.bindBuffer(copyWriteTarget, colBuf);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, 32);

        idxBuf = gl.createBuffer();
        gl.bindBuffer(elemTarget, idxBuf);
        const idxData = new Uint16Array(layerCount * quadVerts);
        for (let i = 0; i < layerCount * quadVerts; i++) idxData[i] = i;
        gl.bufferData(elemTarget, idxData, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const locPos = gl.getAttribLocation(program, 'aPos');
        const locCol = gl.getAttribLocation(program, 'aColor');

        gl.enableVertexAttribArray(locPos);
        gl.bindBuffer(bufferTarget, posBuf);
        gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 0, 0);

        gl.enableVertexAttribArray(locCol);
        gl.bindBuffer(bufferTarget, colBuf);
        gl.vertexAttribPointer(locCol, 4, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(elemTarget, idxBuf);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(depthFunc);
        gl.depthMask(true);

        gl.enable(gl.STENCIL_TEST);
        gl.stencilMask(0xFF);
        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.INCR, gl.INCR);

        gl.clearColor(0.08, 0.08, 0.12, 1.0);
        gl.clearDepth(1.0);
        gl.clearStencil(0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

        gl.bindVertexArray(vao);
        gl.drawElements(drawMode, quadVerts, gl.UNSIGNED_SHORT, 0);

        gl.stencilFunc(gl.GREATER, 0, 0xFF);
        gl.drawElements(drawMode, quadVerts, gl.UNSIGNED_SHORT, quadVerts * 2);
        gl.drawArrays(drawMode, quadVerts * 2, quadVerts);
    } catch(e) {}

    try {
        gl.disable(gl.STENCIL_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.bindVertexArray(null);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(elemTarget, null);
        gl.bindBuffer(copyReadTarget, null);
        gl.bindBuffer(copyWriteTarget, null);

        void copyBytes;
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

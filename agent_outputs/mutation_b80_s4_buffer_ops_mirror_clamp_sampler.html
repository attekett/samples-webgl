<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_texture_mirror_clamp_to_edge'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    const extMirror = gl.getExtension('EXT_texture_mirror_clamp_to_edge');

    const texSize = 256;
    const quadVerts = 6;
    const wrapMode = extMirror.MIRROR_CLAMP_TO_EDGE_EXT;

    const bufferTarget = gl.ARRAY_BUFFER;
    const elemTarget = gl.ELEMENT_ARRAY_BUFFER;
    const texTarget = gl.TEXTURE_2D;
    const drawMode = gl.TRIANGLES;

    var vShader, fShader, program;
    var vao;
    var posBuf, uvBuf, idxBuf;
    var tex, samplerObj;

    try {
        vShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vShader, `#version 300 es
precision highp float;
in vec2 aPos;
in vec2 aUv;
out vec2 vUv;
void main() {
    vUv = aUv;
    gl_Position = vec4(aPos, 0.0, 1.0);
}`);
        gl.compileShader(vShader);
        fShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShader, `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
layout(location = 0) out vec4 outColor;
void main() {
    outColor = texture(uTex, vUv * 2.5);
}`);
        gl.compileShader(fShader);
        program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        posBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, posBuf);
        gl.bufferData(bufferTarget, new Float32Array([
            -0.9, -0.9,  0.9, -0.9,  0.9,  0.9,
            -0.9, -0.9,  0.9,  0.9, -0.9,  0.9
        ]), gl.STATIC_DRAW);

        uvBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, uvBuf);
        gl.bufferData(bufferTarget, new Float32Array([
            -1.0, -1.0,  2.0, -1.0,  2.0, 2.0,
            -1.0, -1.0,  2.0,  2.0, -1.0, 2.0
        ]), gl.STATIC_DRAW);

        idxBuf = gl.createBuffer();
        gl.bindBuffer(elemTarget, idxBuf);
        gl.bufferData(elemTarget, new Uint16Array([0, 1, 2, 3, 4, 5]), gl.STATIC_DRAW);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const locPos = gl.getAttribLocation(program, 'aPos');
        const locUv = gl.getAttribLocation(program, 'aUv');

        gl.enableVertexAttribArray(locPos);
        gl.bindBuffer(bufferTarget, posBuf);
        gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);

        gl.enableVertexAttribArray(locUv);
        gl.bindBuffer(bufferTarget, uvBuf);
        gl.vertexAttribPointer(locUv, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(elemTarget, idxBuf);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        tex = gl.createTexture();
        gl.bindTexture(texTarget, tex);
        const rawPixels = new Uint8Array([
            255, 50, 50, 255,   50, 255, 50, 255,
            50, 50, 255, 255,   255, 255, 50, 255
        ]);
        gl.texImage2D(texTarget, 0, gl.RGBA8, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, rawPixels);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } catch(e) {}

    try {
        samplerObj = gl.createSampler();
        gl.samplerParameteri(samplerObj, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.samplerParameteri(samplerObj, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.samplerParameteri(samplerObj, gl.TEXTURE_WRAP_S, wrapMode);
        gl.samplerParameteri(samplerObj, gl.TEXTURE_WRAP_T, wrapMode);
        gl.isSampler(samplerObj);
    } catch(e) {}

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.04, 0.05, 0.08, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(texTarget, tex);
        gl.bindSampler(0, samplerObj);
        gl.uniform1i(gl.getUniformLocation(program, 'uTex'), 0);

        gl.bindVertexArray(vao);
        gl.drawElements(drawMode, quadVerts, gl.UNSIGNED_SHORT, 0);
        gl.drawArrays(drawMode, 0, quadVerts);
    } catch(e) {}

    try {
        gl.bindSampler(0, null);
        if (samplerObj) gl.deleteSampler(samplerObj);
        gl.bindVertexArray(null);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(elemTarget, null);
        gl.bindTexture(texTarget, null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_clip_control'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    const extCC = gl.getExtension('EXT_clip_control');

    const texSize = 256;
    const vertexCount = 48;

    const bufferTarget = gl.ARRAY_BUFFER;
    const tfTarget = gl.TRANSFORM_FEEDBACK_BUFFER;
    const tfMode = gl.TRIANGLES;
    const drawMode = gl.TRIANGLES;

    var tfProg, renderProg;
    var initBuf, tfOutBuf;
    var tfObj;
    var vao;

    try {
        const tfVS = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(tfVS, `#version 300 es
precision highp float;
in vec3 aPos;
in vec3 aColor;
out vec3 vOutPos;
out vec3 vOutColor;
void main() {
    vOutPos = vec3(aPos.x * 0.95, aPos.y * 0.95, aPos.z);
    vOutColor = aColor;
    gl_Position = vec4(vOutPos, 1.0);
}`);
        gl.compileShader(tfVS);
        const tfFS = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(tfFS, `#version 300 es
precision highp float;
out vec4 col;
void main() { col = vec4(1.0); }`);
        gl.compileShader(tfFS);
        tfProg = gl.createProgram();
        gl.attachShader(tfProg, tfVS);
        gl.attachShader(tfProg, tfFS);
        gl.transformFeedbackVaryings(tfProg, ['vOutPos', 'vOutColor'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(tfProg);
    } catch(e) {}

    try {
        const renVS = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(renVS, `#version 300 es
precision highp float;
in vec3 aPos;
in vec3 aColor;
out vec3 vColor;
void main() {
    vColor = aColor;
    gl_Position = vec4(aPos, 1.0);
}`);
        gl.compileShader(renVS);
        const renFS = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(renFS, `#version 300 es
precision highp float;
in vec3 vColor;
out vec4 outColor;
void main() {
    outColor = vec4(vColor, 1.0);
}`);
        gl.compileShader(renFS);
        renderProg = gl.createProgram();
        gl.attachShader(renderProg, renVS);
        gl.attachShader(renderProg, renFS);
        gl.linkProgram(renderProg);
    } catch(e) {}

    try {
        const vData = new Float32Array(vertexCount * 6);
        for (let i = 0; i < vertexCount; i++) {
            const ang = (i / vertexCount) * Math.PI * 4.0;
            const r = 0.2 + (i / vertexCount) * 0.6;
            const z = 0.1 + (i / vertexCount) * 0.7;
            vData[i * 6 + 0] = Math.cos(ang) * r;
            vData[i * 6 + 1] = Math.sin(ang) * r;
            vData[i * 6 + 2] = z;
            vData[i * 6 + 3] = 0.3 + Math.cos(ang) * 0.4;
            vData[i * 6 + 4] = 0.5 + Math.sin(ang) * 0.4;
            vData[i * 6 + 5] = 0.8;
        }

        initBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, initBuf);
        gl.bufferData(bufferTarget, vData, gl.STATIC_DRAW);

        tfOutBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, tfOutBuf);
        gl.bufferData(bufferTarget, vertexCount * 6 * 4, gl.DYNAMIC_DRAW);

        tfObj = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObj);
        gl.bindBufferBase(tfTarget, 0, tfOutBuf);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const locPos = gl.getAttribLocation(renderProg, 'aPos');
        const locCol = gl.getAttribLocation(renderProg, 'aColor');

        gl.enableVertexAttribArray(locPos);
        gl.bindBuffer(bufferTarget, tfOutBuf);
        gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 24, 0);

        gl.enableVertexAttribArray(locCol);
        gl.vertexAttribPointer(locCol, 3, gl.FLOAT, false, 24, 12);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        gl.useProgram(tfProg);
        gl.bindBuffer(bufferTarget, initBuf);
        const locTfPos = gl.getAttribLocation(tfProg, 'aPos');
        const locTfCol = gl.getAttribLocation(tfProg, 'aColor');
        gl.enableVertexAttribArray(locTfPos);
        gl.vertexAttribPointer(locTfPos, 3, gl.FLOAT, false, 24, 0);
        gl.enableVertexAttribArray(locTfCol);
        gl.vertexAttribPointer(locTfCol, 3, gl.FLOAT, false, 24, 12);

        gl.enable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObj);
        gl.beginTransformFeedback(tfMode);
        gl.drawArrays(tfMode, 0, vertexCount);
        gl.endTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        extCC.clipControlEXT(extCC.LOWER_LEFT_EXT, extCC.ZERO_TO_ONE_EXT);

        gl.viewport(0, 0, texSize, texSize);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.depthMask(true);

        gl.enable(gl.STENCIL_TEST);
        gl.stencilMask(0xFF);
        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.REPLACE, gl.REPLACE);

        gl.clearColor(0.06, 0.05, 0.1, 1.0);
        gl.clearDepth(1.0);
        gl.clearStencil(0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

        gl.useProgram(renderProg);
        gl.bindVertexArray(vao);
        gl.drawArrays(drawMode, 0, vertexCount);
    } catch(e) {}

    try {
        gl.disable(gl.STENCIL_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.bindVertexArray(null);
        gl.bindBuffer(bufferTarget, null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float',
    'WEBGL_stencil_texturing'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    const extST = gl.getExtension('WEBGL_stencil_texturing');
    gl.getExtension('EXT_color_buffer_float');

    const texSize = 256;
    const quadVerts = 6;

    const bufferTarget = gl.ARRAY_BUFFER;
    const elemTarget = gl.ELEMENT_ARRAY_BUFFER;
    const texTarget = gl.TEXTURE_2D;
    const fboTarget = gl.FRAMEBUFFER;
    const drawMode = gl.TRIANGLES;

    var vShader, fShaderFill, fShaderRead, progFill, progRead;
    var vaoFill, vaoRead;
    var posBuf, uvBuf, idxBuf;
    var dsTex, floatTex, fboFill, fboRead;

    try {
        vShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vShader, `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main() {
    vUv = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
}`);
        gl.compileShader(vShader);

        fShaderFill = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShaderFill, `#version 300 es
precision highp float;
in vec2 vUv;
layout(location = 0) out vec4 color0;
void main() {
    color0 = vec4(0.8, 0.3, 0.4, 1.0);
}`);
        gl.compileShader(fShaderFill);

        fShaderRead = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShaderRead, `#version 300 es
precision highp float;
precision highp usampler2D;
in vec2 vUv;
uniform usampler2D uStencil;
layout(location = 0) out vec4 outFloat;
void main() {
    uint s = texture(uStencil, vUv).r;
    float sv = float(s & 0xFFu) / 255.0;
    outFloat = vec4(sv * 1.5, 0.4 + sv * 0.5, 0.9 - sv * 0.4, 1.0);
}`);
        gl.compileShader(fShaderRead);

        progFill = gl.createProgram();
        gl.attachShader(progFill, vShader);
        gl.attachShader(progFill, fShaderFill);
        gl.linkProgram(progFill);

        progRead = gl.createProgram();
        gl.attachShader(progRead, vShader);
        gl.attachShader(progRead, fShaderRead);
        gl.linkProgram(progRead);
    } catch(e) {}

    try {
        posBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, posBuf);
        gl.bufferData(bufferTarget, new Float32Array([
            -0.85, -0.85,   0.85, -0.85,   0.85,  0.85,
            -0.85, -0.85,   0.85,  0.85,  -0.85,  0.85
        ]), gl.STATIC_DRAW);

        idxBuf = gl.createBuffer();
        gl.bindBuffer(elemTarget, idxBuf);
        gl.bufferData(elemTarget, new Uint16Array([0, 1, 2, 3, 4, 5]), gl.STATIC_DRAW);
    } catch(e) {}

    try {
        vaoFill = gl.createVertexArray();
        gl.bindVertexArray(vaoFill);
        const locFill = gl.getAttribLocation(progFill, 'aPos');
        gl.enableVertexAttribArray(locFill);
        gl.bindBuffer(bufferTarget, posBuf);
        gl.vertexAttribPointer(locFill, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(elemTarget, idxBuf);

        vaoRead = gl.createVertexArray();
        gl.bindVertexArray(vaoRead);
        const locRead = gl.getAttribLocation(progRead, 'aPos');
        gl.enableVertexAttribArray(locRead);
        gl.bindBuffer(bufferTarget, posBuf);
        gl.vertexAttribPointer(locRead, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(elemTarget, idxBuf);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        dsTex = gl.createTexture();
        gl.bindTexture(texTarget, dsTex);
        gl.texStorage2D(texTarget, 1, gl.DEPTH24_STENCIL8, texSize, texSize);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

        floatTex = gl.createTexture();
        gl.bindTexture(texTarget, floatTex);
        gl.texStorage2D(texTarget, 1, gl.RGBA32F, texSize, texSize);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);

        fboFill = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fboFill);
        gl.framebufferTexture2D(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, texTarget, dsTex, 0);
        gl.framebufferTexture2D(fboTarget, gl.COLOR_ATTACHMENT0, texTarget, floatTex, 0);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
        gl.checkFramebufferStatus(fboTarget);

        fboRead = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fboRead);
        gl.framebufferTexture2D(fboTarget, gl.COLOR_ATTACHMENT0, texTarget, floatTex, 0);
    } catch(e) {}

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.bindFramebuffer(fboTarget, fboFill);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilMask(0xFF);
        gl.stencilFunc(gl.ALWAYS, 0x88, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);

        gl.clearStencil(0x22);
        gl.clear(gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT | gl.COLOR_BUFFER_BIT);

        gl.useProgram(progFill);
        gl.bindVertexArray(vaoFill);
        gl.drawElements(drawMode, quadVerts, gl.UNSIGNED_SHORT, 0);
        gl.disable(gl.STENCIL_TEST);
    } catch(e) {}

    try {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(texTarget, dsTex);
        gl.texParameteri(texTarget, extST.DEPTH_STENCIL_TEXTURE_MODE_WEBGL, extST.STENCIL_INDEX_WEBGL);

        gl.bindFramebuffer(fboTarget, fboRead);
        gl.clearColor(0.04, 0.05, 0.08, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.useProgram(progRead);
        gl.uniform1i(gl.getUniformLocation(progRead, 'uStencil'), 0);
        gl.bindVertexArray(vaoRead);
        gl.drawElements(drawMode, quadVerts, gl.UNSIGNED_SHORT, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboRead);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);

        gl.bindVertexArray(null);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(elemTarget, null);
        gl.bindTexture(texTarget, null);
        gl.bindFramebuffer(fboTarget, null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'WEBGL_compressed_texture_s3tc'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const texSize = 256;
    const vertexCount = 12;
    const s3tcWidth = 16;
    const s3tcHeight = 16;
    const s3tcBlocks = 16;

    const bufferTarget = gl.ARRAY_BUFFER;
    const tfTarget = gl.TRANSFORM_FEEDBACK_BUFFER;
    const texTarget = gl.TEXTURE_2D;
    const compFormat = 0x83F0;
    const tfMode = gl.TRIANGLES;
    const drawMode = gl.TRIANGLES;

    var tfProg, renderProg;
    var initBuf, tfOutBuf;
    var tfObj;
    var vao;
    var compTex;

    try {
        const tfVS = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(tfVS, `#version 300 es
precision highp float;
in vec3 aPos;
in vec2 aUv;
out vec3 vOutPos;
out vec2 vOutUv;
void main() {
    vOutPos = vec3(aPos.xy * 0.95, aPos.z);
    vOutUv = aUv;
    gl_Position = vec4(vOutPos, 1.0);
}`);
        gl.compileShader(tfVS);
        const tfFS = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(tfFS, `#version 300 es
precision highp float;
out vec4 col;
void main() { col = vec4(1.0); }`);
        gl.compileShader(tfFS);
        tfProg = gl.createProgram();
        gl.attachShader(tfProg, tfVS);
        gl.attachShader(tfProg, tfFS);
        gl.transformFeedbackVaryings(tfProg, ['vOutPos', 'vOutUv'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(tfProg);
    } catch(e) {}

    try {
        const renVS = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(renVS, `#version 300 es
precision highp float;
in vec3 aPos;
in vec2 aUv;
out vec2 vUv;
void main() {
    vUv = aUv;
    gl_Position = vec4(aPos, 1.0);
}`);
        gl.compileShader(renVS);
        const renFS = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(renFS, `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uCompTex;
layout(location = 0) out vec4 outColor;
void main() {
    outColor = texture(uCompTex, vUv * 4.0);
}`);
        gl.compileShader(renFS);
        renderProg = gl.createProgram();
        gl.attachShader(renderProg, renVS);
        gl.attachShader(renderProg, renFS);
        gl.linkProgram(renderProg);
    } catch(e) {}

    try {
        const vData = new Float32Array([
            -0.85, -0.85, 0.2,  0.0, 0.0,
             0.85, -0.85, 0.2,  1.0, 0.0,
             0.85,  0.85, 0.2,  1.0, 1.0,
            -0.85, -0.85, 0.2,  0.0, 0.0,
             0.85,  0.85, 0.2,  1.0, 1.0,
            -0.85,  0.85, 0.2,  0.0, 1.0,

            -0.5, -0.5, 0.6,  0.0, 0.0,
             0.5, -0.5, 0.6,  1.0, 0.0,
             0.5,  0.5, 0.6,  1.0, 1.0,
            -0.5, -0.5, 0.6,  0.0, 0.0,
             0.5,  0.5, 0.6,  1.0, 1.0,
            -0.5,  0.5, 0.6,  0.0, 1.0
        ]);

        initBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, initBuf);
        gl.bufferData(bufferTarget, vData, gl.STATIC_DRAW);

        tfOutBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, tfOutBuf);
        gl.bufferData(bufferTarget, vertexCount * 5 * 4, gl.DYNAMIC_DRAW);

        tfObj = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObj);
        gl.bindBufferBase(tfTarget, 0, tfOutBuf);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const locPos = gl.getAttribLocation(renderProg, 'aPos');
        const locUv = gl.getAttribLocation(renderProg, 'aUv');

        gl.enableVertexAttribArray(locPos);
        gl.bindBuffer(bufferTarget, tfOutBuf);
        gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 20, 0);

        gl.enableVertexAttribArray(locUv);
        gl.vertexAttribPointer(locUv, 2, gl.FLOAT, false, 20, 12);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        compTex = gl.createTexture();
        gl.bindTexture(texTarget, compTex);
        const dxtData = new Uint8Array(s3tcBlocks * 8);
        for (let b = 0; b < s3tcBlocks; b++) {
            const off = b * 8;
            dxtData[off + 0] = 0xF8;
            dxtData[off + 1] = 0x1F;
            dxtData[off + 2] = 0x00;
            dxtData[off + 3] = 0x00;
            dxtData[off + 4] = (b * 27) & 0xFF;
            dxtData[off + 5] = ((b + 1) * 53) & 0xFF;
            dxtData[off + 6] = ((b + 3) * 79) & 0xFF;
            dxtData[off + 7] = 0xAA;
        }
        gl.compressedTexImage2D(texTarget, 0, compFormat, s3tcWidth, s3tcHeight, 0, dxtData);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    try {
        gl.useProgram(tfProg);
        gl.bindBuffer(bufferTarget, initBuf);
        const locTfPos = gl.getAttribLocation(tfProg, 'aPos');
        const locTfUv = gl.getAttribLocation(tfProg, 'aUv');
        gl.enableVertexAttribArray(locTfPos);
        gl.vertexAttribPointer(locTfPos, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(locTfUv);
        gl.vertexAttribPointer(locTfUv, 2, gl.FLOAT, false, 20, 12);

        gl.enable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObj);
        gl.beginTransformFeedback(tfMode);
        gl.drawArrays(tfMode, 0, vertexCount);
        gl.endTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.depthMask(true);

        gl.enable(gl.STENCIL_TEST);
        gl.stencilMask(0xFF);
        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.REPLACE, gl.REPLACE);

        gl.clearColor(0.05, 0.06, 0.1, 1.0);
        gl.clearDepth(1.0);
        gl.clearStencil(0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

        gl.useProgram(renderProg);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(texTarget, compTex);
        gl.uniform1i(gl.getUniformLocation(renderProg, 'uCompTex'), 0);

        gl.bindVertexArray(vao);
        gl.drawArrays(drawMode, 0, 6);

        gl.stencilFunc(gl.EQUAL, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.KEEP);
        gl.drawArrays(drawMode, 6, 6);
    } catch(e) {}

    try {
        gl.disable(gl.STENCIL_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.bindVertexArray(null);
        gl.bindBuffer(bufferTarget, null);
        gl.bindTexture(texTarget, null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

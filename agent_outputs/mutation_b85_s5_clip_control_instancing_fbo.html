<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_clip_control'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    const extCC = gl.getExtension('EXT_clip_control');

    const texSize = 256;
    const quadVerts = 6;
    const instanceCount = 16;
    const gridCols = 4;
    const gridRows = 4;
    const layerPasses = 2;

    const bufferTarget = gl.ARRAY_BUFFER;
    const elemTarget = gl.ELEMENT_ARRAY_BUFFER;
    const texTarget = gl.TEXTURE_2D;
    const fboTarget = gl.FRAMEBUFFER;
    const rboTarget = gl.RENDERBUFFER;
    const drawMode = gl.TRIANGLES;

    var vShader, fShader, program;
    var vao;
    var posBuf, instBuf, colBuf, idxBuf;
    var colorTex, depthRbo, fbo;

    try {
        vShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vShader, `#version 300 es
precision highp float;
in vec3 aPos;
in vec3 aOffset;
in vec4 aColor;
out vec4 vColor;
out vec3 vPos;
void main() {
    vColor = aColor;
    vPos = aPos;
    vec3 transformed = aPos * 0.2 + aOffset;
    gl_Position = vec4(transformed, 1.0);
}`);
        gl.compileShader(vShader);
        fShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShader, `#version 300 es
precision highp float;
in vec4 vColor;
in vec3 vPos;
uniform vec4 uTint;
layout(location = 0) out vec4 outColor;
void main() {
    float edge = step(0.1, 1.0 - max(abs(vPos.x), abs(vPos.y)));
    vec3 col = mix(vec3(0.1), vColor.rgb * uTint.rgb, edge);
    outColor = vec4(col, 1.0);
}`);
        gl.compileShader(fShader);
        program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        posBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, posBuf);
        gl.bufferData(bufferTarget, new Float32Array([
            -0.85, -0.85, 0.0,   0.85, -0.85, 0.0,   0.85,  0.85, 0.0,
            -0.85, -0.85, 0.0,   0.85,  0.85, 0.0,  -0.85,  0.85, 0.0
        ]), gl.STATIC_DRAW);

        const instOffsets = new Float32Array(instanceCount * 3);
        for (let r = 0; r < gridRows; r++) {
            for (let c = 0; c < gridCols; c++) {
                const idx = (r * gridCols + c) * 3;
                instOffsets[idx + 0] = (c / (gridCols - 1)) * 1.5 - 0.75;
                instOffsets[idx + 1] = (r / (gridRows - 1)) * 1.5 - 0.75;
                instOffsets[idx + 2] = (r * gridCols + c) * 0.04 + 0.1;
            }
        }
        instBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, instBuf);
        gl.bufferData(bufferTarget, instOffsets, gl.STATIC_DRAW);

        const instColors = new Float32Array(instanceCount * 4);
        for (let i = 0; i < instanceCount; i++) {
            const idx = i * 4;
            instColors[idx + 0] = ((i % 4) + 1) * 0.24;
            instColors[idx + 1] = (((i >> 2) % 4) + 1) * 0.24;
            instColors[idx + 2] = 0.5 + ((i * 7) % 5) * 0.1;
            instColors[idx + 3] = 1.0;
        }
        colBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, colBuf);
        gl.bufferData(bufferTarget, instColors, gl.STATIC_DRAW);

        idxBuf = gl.createBuffer();
        gl.bindBuffer(elemTarget, idxBuf);
        gl.bufferData(elemTarget, new Uint16Array([0, 1, 2, 3, 4, 5]), gl.STATIC_DRAW);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        const locPos = gl.getAttribLocation(program, 'aPos');
        gl.enableVertexAttribArray(locPos);
        gl.bindBuffer(bufferTarget, posBuf);
        gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, 0, 0);

        const locOff = gl.getAttribLocation(program, 'aOffset');
        gl.enableVertexAttribArray(locOff);
        gl.bindBuffer(bufferTarget, instBuf);
        gl.vertexAttribPointer(locOff, 3, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(locOff, 1);

        const locCol = gl.getAttribLocation(program, 'aColor');
        gl.enableVertexAttribArray(locCol);
        gl.bindBuffer(bufferTarget, colBuf);
        gl.vertexAttribPointer(locCol, 4, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(locCol, 1);

        gl.bindBuffer(elemTarget, idxBuf);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        colorTex = gl.createTexture();
        gl.bindTexture(texTarget, colorTex);
        gl.texStorage2D(texTarget, 1, gl.RGBA8, texSize, texSize);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        depthRbo = gl.createRenderbuffer();
        gl.bindRenderbuffer(rboTarget, depthRbo);
        gl.renderbufferStorage(rboTarget, gl.DEPTH24_STENCIL8, texSize, texSize);

        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo);
        gl.framebufferTexture2D(fboTarget, gl.COLOR_ATTACHMENT0, texTarget, colorTex, 0);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, rboTarget, depthRbo);
        gl.checkFramebufferStatus(fboTarget);
    } catch(e) {}

    try {
        extCC.clipControlEXT(extCC.LOWER_LEFT_EXT, extCC.ZERO_TO_ONE_EXT);

        gl.viewport(0, 0, texSize, texSize);
        gl.bindFramebuffer(fboTarget, fbo);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.depthMask(true);

        gl.enable(gl.STENCIL_TEST);
        gl.stencilMask(0xFF);
        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.REPLACE, gl.REPLACE);

        gl.clearColor(0.05, 0.07, 0.12, 1.0);
        gl.clearDepth(1.0);
        gl.clearStencil(0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

        const locTint = gl.getUniformLocation(program, 'uTint');
        gl.uniform4f(locTint, 1.0, 0.8, 0.6, 1.0);

        gl.bindVertexArray(vao);
        gl.drawElementsInstanced(drawMode, quadVerts, gl.UNSIGNED_SHORT, 0, instanceCount);

        extCC.clipControlEXT(extCC.UPPER_LEFT_EXT, extCC.NEGATIVE_ONE_TO_ONE_EXT);
        gl.stencilFunc(gl.NOTEQUAL, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.KEEP);
        gl.uniform4f(locTint, 0.4, 0.9, 0.8, 1.0);
        gl.drawElementsInstanced(drawMode, quadVerts, gl.UNSIGNED_SHORT, 0, instanceCount / 2);
    } catch(e) {}

    try {
        gl.disable(gl.STENCIL_TEST);
        gl.disable(gl.DEPTH_TEST);

        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);

        gl.bindVertexArray(null);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(elemTarget, null);
        gl.bindRenderbuffer(rboTarget, null);
        gl.bindTexture(texTarget, null);
        gl.bindFramebuffer(fboTarget, null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

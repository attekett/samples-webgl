<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_conservative_depth'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    gl.getExtension('EXT_conservative_depth');

    const texSize = 256;
    const vertexCount = 36;
    const tfStride = 28;
    const tfBufSize = vertexCount * tfStride;
    const baseScale = 0.92;
    const stencilMaskVal = 0xFF;
    const depthBiasFactor = 0.12;

    const bufferTarget = gl.ARRAY_BUFFER;
    const tfTarget = gl.TRANSFORM_FEEDBACK_BUFFER;
    const tfMode = gl.TRIANGLES;
    const drawMode = gl.TRIANGLES;
    const depthCap = gl.DEPTH_TEST;
    const stencilCap = gl.STENCIL_TEST;

    var tfProg, renderProg;
    var initBuf, tfOutBuf;
    var tfObj;
    var vao;

    try {
        const tfVS = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(tfVS, `#version 300 es
precision highp float;
in vec3 aPos;
in vec3 aColor;
in float aBias;
out vec3 vOutPos;
out vec3 vOutColor;
out float vOutBias;
void main() {
    vOutPos = vec3(aPos.x * 0.92, aPos.y * 0.92, aPos.z * 0.85);
    vOutColor = aColor;
    vOutBias = aBias * 1.2;
    gl_Position = vec4(vOutPos, 1.0);
}`);
        gl.compileShader(tfVS);
        const tfFS = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(tfFS, `#version 300 es
precision highp float;
out vec4 col;
void main() { col = vec4(1.0); }`);
        gl.compileShader(tfFS);
        tfProg = gl.createProgram();
        gl.attachShader(tfProg, tfVS);
        gl.attachShader(tfProg, tfFS);
        gl.transformFeedbackVaryings(tfProg, ['vOutPos', 'vOutColor', 'vOutBias'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(tfProg);
    } catch(e) {}

    try {
        const renVS = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(renVS, `#version 300 es
precision highp float;
in vec3 aPos;
in vec3 aColor;
in float aBias;
out vec4 vColor;
out vec2 vPos;
out float vBias;
void main() {
    vColor = vec4(aColor, 1.0);
    vPos = aPos.xy;
    vBias = aBias;
    gl_Position = vec4(aPos, 1.0);
}`);
        gl.compileShader(renVS);
        const renFS = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(renFS, `#version 300 es
#extension GL_EXT_conservative_depth : require
precision highp float;
layout (depth_greater) out float gl_FragDepth;
in vec4 vColor;
in vec2 vPos;
in float vBias;
layout(location = 0) out vec4 outColor;
void main() {
    float customZ = clamp(gl_FragCoord.z + length(vPos) * vBias, 0.0, 1.0);
    gl_FragDepth = customZ;
    outColor = vec4(vColor.rgb * (1.15 - customZ * 0.35), 1.0);
}`);
        gl.compileShader(renFS);
        renderProg = gl.createProgram();
        gl.attachShader(renderProg, renVS);
        gl.attachShader(renderProg, renFS);
        gl.linkProgram(renderProg);
    } catch(e) {}

    try {
        const vData = new Float32Array(vertexCount * 7);
        for (let i = 0; i < vertexCount / 3; i++) {
            const base = i * 21;
            const r = 0.25 + (i / 12) * 0.55;
            const a0 = (i / 12) * 6.28318;
            const a1 = a0 + 2.0944;
            const a2 = a0 + 4.18879;
            const z = 0.15 + (i / 12) * 0.65;
            const biasVal = depthBiasFactor * (0.5 + 0.5 * Math.sin(a0));
            const rCol = 0.3 + 0.6 * Math.sin(a0 + 0.5);
            const gCol = 0.3 + 0.6 * Math.cos(a0 + 1.5);
            const bCol = 0.3 + 0.6 * Math.sin(a0 + 2.5);

            vData[base + 0] = Math.cos(a0) * r; vData[base + 1] = Math.sin(a0) * r; vData[base + 2] = z;
            vData[base + 3] = rCol; vData[base + 4] = gCol; vData[base + 5] = bCol; vData[base + 6] = biasVal;

            vData[base + 7] = Math.cos(a1) * r; vData[base + 8] = Math.sin(a1) * r; vData[base + 9] = z;
            vData[base + 10] = rCol; vData[base + 11] = gCol; vData[base + 12] = bCol; vData[base + 13] = biasVal;

            vData[base + 14] = Math.cos(a2) * r; vData[base + 15] = Math.sin(a2) * r; vData[base + 16] = z;
            vData[base + 17] = rCol; vData[base + 18] = gCol; vData[base + 19] = bCol; vData[base + 20] = biasVal;
        }

        initBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, initBuf);
        gl.bufferData(bufferTarget, vData, gl.STATIC_DRAW);

        tfOutBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, tfOutBuf);
        gl.bufferData(bufferTarget, tfBufSize, gl.DYNAMIC_DRAW);

        tfObj = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObj);
        gl.bindBufferBase(tfTarget, 0, tfOutBuf);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const locPos = gl.getAttribLocation(renderProg, 'aPos');
        const locCol = gl.getAttribLocation(renderProg, 'aColor');
        const locBias = gl.getAttribLocation(renderProg, 'aBias');

        gl.enableVertexAttribArray(locPos);
        gl.bindBuffer(bufferTarget, tfOutBuf);
        gl.vertexAttribPointer(locPos, 3, gl.FLOAT, false, tfStride, 0);

        gl.enableVertexAttribArray(locCol);
        gl.vertexAttribPointer(locCol, 3, gl.FLOAT, false, tfStride, 12);

        gl.enableVertexAttribArray(locBias);
        gl.vertexAttribPointer(locBias, 1, gl.FLOAT, false, tfStride, 24);

        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        gl.useProgram(tfProg);
        gl.bindBuffer(bufferTarget, initBuf);
        const locTfPos = gl.getAttribLocation(tfProg, 'aPos');
        const locTfCol = gl.getAttribLocation(tfProg, 'aColor');
        const locTfBias = gl.getAttribLocation(tfProg, 'aBias');

        gl.enableVertexAttribArray(locTfPos);
        gl.vertexAttribPointer(locTfPos, 3, gl.FLOAT, false, tfStride, 0);
        gl.enableVertexAttribArray(locTfCol);
        gl.vertexAttribPointer(locTfCol, 3, gl.FLOAT, false, tfStride, 12);
        gl.enableVertexAttribArray(locTfBias);
        gl.vertexAttribPointer(locTfBias, 1, gl.FLOAT, false, tfStride, 24);

        gl.enable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObj);
        gl.beginTransformFeedback(tfMode);
        gl.drawArrays(tfMode, 0, vertexCount);
        gl.endTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.enable(depthCap);
        gl.depthFunc(gl.LEQUAL);
        gl.depthMask(true);

        gl.enable(stencilCap);
        gl.stencilMask(stencilMaskVal);
        gl.stencilFunc(gl.ALWAYS, 1, stencilMaskVal);
        gl.stencilOp(gl.KEEP, gl.REPLACE, gl.REPLACE);

        gl.clearColor(0.04, 0.05, 0.08, 1.0);
        gl.clearDepth(1.0);
        gl.clearStencil(0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

        gl.useProgram(renderProg);
        gl.bindVertexArray(vao);

        gl.drawArrays(drawMode, 0, vertexCount / 2);

        gl.stencilFunc(gl.EQUAL, 1, stencilMaskVal);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.KEEP);

        gl.drawArrays(drawMode, vertexCount / 2, vertexCount / 2);
    } catch(e) {}

    try {
        gl.disable(stencilCap);
        gl.disable(depthCap);
        gl.bindVertexArray(null);
        gl.bindBuffer(bufferTarget, null);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

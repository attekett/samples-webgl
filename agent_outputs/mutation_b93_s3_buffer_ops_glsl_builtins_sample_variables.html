<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'OES_sample_variables'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const texSize = 256;
    const quadVerts = 6;
    const streamReps = 3;
    const copyBytes = 64;
    const subOffsetBytes = 16;
    const numLayers = 4;
    const totalVerts = quadVerts * numLayers;

    const bufferTarget = gl.ARRAY_BUFFER;
    const copyReadTarget = gl.COPY_READ_BUFFER;
    const copyWriteTarget = gl.COPY_WRITE_BUFFER;
    const drawMode = gl.TRIANGLES;
    const usageStream = gl.STREAM_DRAW;
    const usageDynamic = gl.DYNAMIC_DRAW;

    var vShader, fShader, program;
    var posBuf, layerBuf, streamBuf, copyDstBuf, vao;

    try {
        vShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vShader, `#version 300 es
precision highp float;
in vec2 aPos;
in float aLayer;
out vec2 vUv;
out float vLayer;
void main() {
    vUv = aPos * 0.5 + 0.5;
    vLayer = aLayer;
    vec2 offset = vec2((aLayer - 1.5) * 0.4, (fract(aLayer * 0.5) - 0.25) * 0.4);
    gl_Position = vec4(aPos * 0.65 + offset, 0.0, 1.0);
}`);
        gl.compileShader(vShader);
        fShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShader, `#version 300 es
#extension GL_OES_sample_variables : require
precision highp float;
in vec2 vUv;
in float vLayer;
out vec4 fragColor;
void main() {
    vec2 p = vUv * 2.0 - 1.0;
    vec3 nrm = normalize(vec3(p, 0.9));
    vec3 inc = normalize(vec3(0.4, -0.6, -0.68));
    mat3 m = mat3(0.8, 0.6, 0.0, -0.6, 0.8, 0.0, 0.0, 0.0, 1.0);
    float detM = determinant(m);
    mat3 invM = inverse(m);
    mat4 compM = matrixCompMult(mat4(detM), mat4(invM));
    vec3 refl = reflect(inc, nrm);
    vec3 refr = refract(inc, nrm, 0.72);
    vec3 ffwd = faceforward(nrm, inc, nrm);
    vec2 dF = vec2(dFdx(p.x), dFdy(p.y));
    float fw = fwidth(p.y);
    vec3 sm = smoothstep(vec3(-0.7), vec3(0.7), refl * 1.1) + smoothstep(-0.3, 0.3, refr.y);
    float fr = fract(p.x * 4.0) * fract(p.y * 4.0);
    int sId = gl_SampleID;
    vec2 sPos = gl_SamplePosition;
    int sMaskIn = gl_SampleMaskIn[0];
    gl_SampleMask[0] = int(0xAAu);
    uint pk = packHalf2x16(vec2(sm.x, fw));
    vec2 upk = unpackHalf2x16(pk);
    vec3 sampleCol = vec3(float(sId) * 0.25, sPos.x * 0.5, float(sMaskIn & 0x0F) * 0.1);
    vec3 lit = sm * 0.3 + vec3(upk, fr * 0.2) + compM[0].xyz * 0.01 + ffwd * 0.05 + sampleCol + vec3(fract(vLayer * 0.35));
    fragColor = vec4(clamp(lit, 0.0, 1.0), 1.0);
}`);
        gl.compileShader(fShader);
        program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        posBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, posBuf);
        const vData = new Float32Array(totalVerts * 2);
        let ptr = 0;
        for (let l = 0; l < numLayers; l++) {
            const verts = [
                -0.8, -0.8,
                 0.8, -0.8,
                 0.8,  0.8,
                -0.8, -0.8,
                 0.8,  0.8,
                -0.8,  0.8
            ];
            for (let k = 0; k < verts.length; k++) {
                vData[ptr++] = verts[k];
            }
        }
        gl.bufferData(bufferTarget, vData, usageDynamic);
        gl.bufferSubData(bufferTarget, subOffsetBytes, new Float32Array([0.05, 0.05]));

        layerBuf = gl.createBuffer();
        gl.bindBuffer(bufferTarget, layerBuf);
        const lData = new Float32Array(totalVerts);
        for (let l = 0; l < numLayers; l++) {
            for (let v = 0; v < quadVerts; v++) {
                lData[l * quadVerts + v] = l;
            }
        }
        gl.bufferData(bufferTarget, lData, usageDynamic);

        streamBuf = gl.createBuffer();
        gl.bindBuffer(copyReadTarget, streamBuf);
        gl.bufferData(copyReadTarget, new Float32Array(copyBytes / 4).fill(0.28), usageStream);

        copyDstBuf = gl.createBuffer();
        gl.bindBuffer(copyWriteTarget, copyDstBuf);
        gl.bufferData(copyWriteTarget, copyBytes, gl.STREAM_READ);
        gl.copyBufferSubData(copyReadTarget, copyWriteTarget, 0, 0, copyBytes);

        var copyFence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.clientWaitSync(copyFence, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
        gl.deleteSync(copyFence);

        const readBack = new Float32Array(copyBytes / 4);
        gl.getBufferSubData(copyWriteTarget, 0, readBack);

        var deadBuf = gl.createBuffer();
        gl.deleteBuffer(deadBuf);
        gl.deleteBuffer(deadBuf);
        gl.isBuffer(deadBuf);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const locPos = gl.getAttribLocation(program, 'aPos');
        const locLayer = gl.getAttribLocation(program, 'aLayer');

        gl.enableVertexAttribArray(locPos);
        gl.bindBuffer(bufferTarget, posBuf);
        gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);

        gl.enableVertexAttribArray(locLayer);
        gl.bindBuffer(bufferTarget, layerBuf);
        gl.vertexAttribPointer(locLayer, 1, gl.FLOAT, false, 0, 0);

        gl.bindVertexArray(null);
        gl.bindVertexArray(vao);
    } catch(e) {}

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.enable(gl.SAMPLE_COVERAGE);
        gl.sampleCoverage(0.8, false);
        gl.clearColor(0.05, 0.08, 0.14, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        for (let s = 0; s < streamReps; s++) {
            gl.bindBuffer(bufferTarget, streamBuf);
            gl.bufferSubData(bufferTarget, 0, new Float32Array([0.05 * s, 0.1 * s]));
            gl.drawArrays(drawMode, 0, totalVerts);
        }
    } catch(e) {}

    try {
        gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.disable(gl.SAMPLE_COVERAGE);
        gl.bindVertexArray(null);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(copyReadTarget, null);
        gl.bindBuffer(copyWriteTarget, null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

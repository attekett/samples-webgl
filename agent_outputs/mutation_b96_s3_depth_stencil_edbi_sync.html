<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'OES_draw_buffers_indexed'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2', { antialias: false });
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    const extEdbi = gl.getExtension('OES_draw_buffers_indexed');

    const texSize = 256;
    const vertCount = 6;
    const stencilRefOne = 1;
    const stencilRefZero = 0;
    const stencilMaskFull = 0xff;

    const drawMode = gl.TRIANGLES;
    const texFmt = gl.RGBA8;
    const rbFormat = gl.DEPTH24_STENCIL8;
    const depthCmpLess = gl.LESS;

    try {
        var vShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vShader, `#version 300 es
precision highp float;
in vec2 aPos;
in float aDepth;
in vec3 aHue;
out vec2 vUv;
out vec3 vHue;
void main() {
    vUv = aPos * 0.5 + 0.5;
    vHue = aHue;
    gl_Position = vec4(aPos * 0.9, aDepth, 1.0);
}`);
        gl.compileShader(vShader);
        var fShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShader, `#version 300 es
precision highp float;
in vec2 vUv;
in vec3 vHue;
layout(location = 0) out vec4 color0;
layout(location = 1) out vec4 color1;
void main() {
    float edge = smoothstep(0.0, 0.35, min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y)));
    color0 = vec4(vHue * edge, 0.6 + 0.3 * edge);
    color1 = vec4(vHue.gbr * (1.2 - edge), 0.85);
}`);
        gl.compileShader(fShader);
        var program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        var posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 1, -1, 0, 0.8,
            -1, -1, 0, 0.8, -1, 1,
            1, 1, -1, 1, 0, -0.6,
            1, 1, 0, -0.6, 1, -1
        ]), gl.STATIC_DRAW);
        var depthBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, depthBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            0.95, 0.95, 0.95,
            0.95, 0.95, 0.95,
            0.45, 0.45, 0.45,
            0.45, 0.45, 0.45
        ]), gl.STATIC_DRAW);
        gl.bufferSubData(gl.ARRAY_BUFFER, 8, new Float32Array([0.94]));
        var hueBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, hueBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            0.85, 0.25, 0.2,
            0.85, 0.25, 0.2,
            0.2, 0.85, 0.35,
            0.2, 0.85, 0.35,
            0.75, 0.75, 0.15,
            0.75, 0.75, 0.15,
            0.25, 0.3, 0.9,
            0.25, 0.3, 0.9,
            0.9, 0.45, 0.6,
            0.9, 0.45, 0.6,
            0.4, 0.8, 0.8,
            0.4, 0.8, 0.8
        ]), gl.STATIC_DRAW);
        var copySrc = gl.createBuffer();
        gl.bindBuffer(gl.COPY_READ_BUFFER, hueBuf);
        var copyDst = gl.createBuffer();
        gl.bindBuffer(gl.COPY_WRITE_BUFFER, copyDst);
        gl.bufferData(gl.COPY_WRITE_BUFFER, 48, gl.DYNAMIC_COPY);
        gl.copyBufferSubData(gl.COPY_READ_BUFFER, gl.COPY_WRITE_BUFFER, 0, 0, 48);
        gl.getBufferParameter(gl.COPY_WRITE_BUFFER, gl.BUFFER_SIZE);
        gl.isBuffer(copyDst);
        var gone = gl.createBuffer();
        gl.deleteBuffer(gone);
        gl.deleteBuffer(gone);
        gl.isBuffer(gone);
        gl.bindBuffer(gl.COPY_READ_BUFFER, null);
        gl.bindBuffer(gl.COPY_WRITE_BUFFER, null);
    } catch(e) {}

    try {
        var vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const locPos = gl.getAttribLocation(program, 'aPos');
        const locDepth = gl.getAttribLocation(program, 'aDepth');
        const locHue = gl.getAttribLocation(program, 'aHue');
        gl.enableVertexAttribArray(locPos);
        gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(locDepth);
        gl.vertexAttribPointer(locDepth, 1, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(locHue);
        gl.vertexAttribPointer(locHue, 3, gl.FLOAT, false, 0, 0);
        gl.vertexAttrib1f(locDepth, 0.7);
        gl.disableVertexAttribArray(locDepth);
        gl.enableVertexAttribArray(locDepth);
        gl.bindVertexArray(null);
        gl.bindVertexArray(vao);
    } catch(e) {}

    try {
        var rtTex0 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, rtTex0);
        gl.texStorage2D(gl.TEXTURE_2D, 1, texFmt, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        var rtTex1 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, rtTex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, texFmt, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(gl.TEXTURE_2D, null);
        var rboDS = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboDS);
        gl.renderbufferStorage(gl.RENDERBUFFER, rbFormat, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboDS);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        var fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rtTex0, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, rtTex1, 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, rboDS);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
        gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    } catch(e) {}

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.depthRange(0.05, 0.95);
        gl.clearDepth(1.0);
        gl.clearStencil(stencilRefZero);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(depthCmpLess);
        gl.depthMask(true);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilMask(stencilMaskFull);
        gl.stencilMaskSeparate(gl.BACK, stencilMaskFull);
        gl.stencilFunc(gl.ALWAYS, stencilRefOne, stencilMaskFull);
        gl.stencilFuncSeparate(gl.FRONT, gl.ALWAYS, stencilRefOne, stencilMaskFull);
        gl.stencilFuncSeparate(gl.BACK, gl.ALWAYS, stencilRefOne, stencilMaskFull);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.stencilOpSeparate(gl.FRONT, gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.stencilOpSeparate(gl.BACK, gl.KEEP, gl.KEEP, gl.REPLACE);
        extEdbi.enableiOES(gl.BLEND, 0);
        extEdbi.enableiOES(gl.BLEND, 1);
        extEdbi.blendFuncSeparateiOES(0, gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ZERO);
        extEdbi.blendFuncSeparateiOES(1, gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
        extEdbi.colorMaskiOES(0, true, true, true, true);
        extEdbi.colorMaskiOES(1, true, true, true, true);
        gl.clearColor(0.03, 0.05, 0.08, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.drawArrays(drawMode, 0, vertCount * 2);
        var fenceA = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.finish();
        gl.getSyncParameter(fenceA, gl.SYNC_STATUS);
        gl.isSync(fenceA);
    } catch(e) {}

    try {
        gl.stencilFunc(gl.EQUAL, stencilRefOne, stencilMaskFull);
        gl.stencilOp(gl.KEEP, gl.INCR_WRAP, gl.KEEP);
        gl.stencilOpSeparate(gl.BACK, gl.KEEP, gl.DECR_WRAP, gl.KEEP);
        gl.depthFunc(gl.LEQUAL);
        gl.depthRange(0.1, 0.9);
        extEdbi.blendEquationiOES(1, gl.FUNC_REVERSE_SUBTRACT);
        extEdbi.colorMaskiOES(0, false, true, true, true);
        gl.drawArrays(drawMode, 6, vertCount);
        var fenceB = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.clientWaitSync(fenceB, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
        gl.deleteSync(fenceB);
    } catch(e) {}

    try {
        gl.stencilFunc(gl.EQUAL, stencilRefZero, stencilMaskFull);
        gl.depthMask(false);
        gl.clearDepth(0.5);
        gl.depthMask(true);
        extEdbi.colorMaskiOES(0, true, true, true, true);
        extEdbi.blendEquationiOES(1, gl.FUNC_ADD);
        gl.drawArrays(drawMode, 0, vertCount);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        const halfW = texSize / 2;
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, halfW, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.readBuffer(gl.COLOR_ATTACHMENT1);
        gl.blitFramebuffer(0, 0, texSize, texSize, halfW, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.isSync(fenceA);
        gl.deleteSync(fenceA);
        void depthBuf;
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

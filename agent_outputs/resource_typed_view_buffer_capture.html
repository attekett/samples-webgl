<!doctype html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const canvas = document.getElementById('webgl-canvas');
const gl = canvas.getContext('webgl2');
if (!gl) throw new Error('WebGL2 unavailable');
const backing = new ArrayBuffer(64);
new Float32Array(backing).set([0.35,-0.2,0.9,-0.2,-0.92,-0.78,-0.12,-0.78,-0.52,0.72,-0.52,0.72,-0.12,-0.78,-0.92,0.72]);
const view = new Float32Array(backing, 16, 12);
const verticesA = gl.createBuffer();
const verticesB = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, verticesA);
gl.bufferData(gl.ARRAY_BUFFER, 56, gl.STATIC_DRAW);
gl.bufferSubData(gl.ARRAY_BUFFER, 8, view);
gl.bindBuffer(gl.ARRAY_BUFFER, verticesB);
gl.bufferData(gl.ARRAY_BUFFER, 56, gl.STATIC_DRAW);
gl.bufferSubData(gl.ARRAY_BUFFER, 8, new Float32Array([0.12,-0.78,0.92,-0.78,0.52,0.72,0.52,0.72,0.92,-0.78,0.12,0.72]));
const vertex = gl.createShader(gl.VERTEX_SHADER);
const fragment = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(vertex, `#version 300 es
layout(location=0) in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`);
gl.shaderSource(fragment, `#version 300 es
precision mediump float;
uniform vec4 tint;
out vec4 color;
void main() {
  color = tint;
}
`);
gl.compileShader(vertex);
gl.compileShader(fragment);
if (!gl.getShaderParameter(vertex, gl.COMPILE_STATUS)) throw new Error('Vertex shader compilation failed');
if (!gl.getShaderParameter(fragment, gl.COMPILE_STATUS)) throw new Error('Fragment shader compilation failed');
const program = gl.createProgram();
gl.attachShader(program, vertex);
gl.attachShader(program, fragment);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error('Program link failed');
gl.useProgram(program);
gl.enableVertexAttribArray(0);
gl.bindBuffer(gl.ARRAY_BUFFER, verticesA);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 8);
gl.bufferData(gl.ARRAY_BUFFER, 56, gl.STATIC_DRAW);
gl.bufferSubData(gl.ARRAY_BUFFER, 8, view);
gl.viewport(0, 0, 256, 256);
gl.clearColor(0.035, 0.045, 0.09, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.uniform4f(gl.getUniformLocation(program, 'tint'), 0.15, 0.85, 0.95, 1.0);
gl.drawArrays(gl.TRIANGLES, 0, 6);
gl.bindBuffer(gl.ARRAY_BUFFER, verticesB);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 8);
gl.uniform4f(gl.getUniformLocation(program, 'tint'), 1.0, 0.42, 0.12, 1.0);
gl.drawArrays(gl.TRIANGLES, 0, 6);
if (gl.getError() !== gl.NO_ERROR) throw new Error('WebGL error');
window.__done = true;
</script>
</body>
</html>

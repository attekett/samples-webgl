<!doctype html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const canvas = document.getElementById('webgl-canvas');
const gl = canvas.getContext('webgl2');
if (!gl) throw new Error('WebGL2 unavailable');
const vertices = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vertices);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.72,-0.72,0.72,-0.72,0,0.72]), gl.STATIC_DRAW);
const vertex = gl.createShader(gl.VERTEX_SHADER);
const fragment = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(vertex, `#version 300 es
layout(location=0) in vec2 position;
out vec3 signal;
uniform vec2 offset;
void main() {
  vec2 points[2] = vec2[2](position, position * 0.5);
  vec2 selected = points[1];
  mat2 transform = mat2(1.0);
  float gain = 0.2;
  for (int i = 0; i < 3; i++) {
    gain += 0.2;
  }
  vec2 p = transform * selected;
  gl_Position = vec4(p + offset, 0.0, 1.0);
  signal = vec3(abs(selected), gain);
}
`);
gl.shaderSource(fragment, `#version 300 es
precision mediump float;
in vec3 signal;
uniform vec3 tint;
out vec4 color;
void main() {
  color = vec4(signal * tint, 1.0);
}
`);
gl.compileShader(vertex);
gl.compileShader(fragment);
if (!gl.getShaderParameter(vertex, gl.COMPILE_STATUS)) throw new Error('Vertex shader compilation failed');
if (!gl.getShaderParameter(fragment, gl.COMPILE_STATUS)) throw new Error('Fragment shader compilation failed');
const program = gl.createProgram();
gl.attachShader(program, vertex);
gl.attachShader(program, fragment);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error('Program link failed');
gl.useProgram(program);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
gl.viewport(0, 0, 256, 256);
gl.clearColor(0.025, 0.035, 0.075, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.uniform2f(gl.getUniformLocation(program, 'offset'), -0.48, 0.0);
gl.uniform3f(gl.getUniformLocation(program, 'tint'), 0.1, 1.0, 0.8);
gl.drawArrays(gl.TRIANGLES, 0, 3);
gl.uniform2f(gl.getUniformLocation(program, 'offset'), 0.48, 0.0);
gl.uniform3f(gl.getUniformLocation(program, 'tint'), 1.0, 0.25, 0.6);
gl.drawArrays(gl.TRIANGLES, 0, 3);
if (gl.getError() !== gl.NO_ERROR) throw new Error('WebGL error');
window.__done = true;
</script>
</body>
</html>

<!doctype html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const canvas = document.getElementById('webgl-canvas');
const gl = canvas.getContext('webgl2');
if (!gl) throw new Error('WebGL2 unavailable');
const vertex = gl.createShader(gl.VERTEX_SHADER);
const fragment = gl.createShader(gl.FRAGMENT_SHADER);
gl.shaderSource(vertex, `#version 300 es
layout(location=0) in vec2 position;
out vec2 uv;
void main() {
  uv = position * 0.5 + 0.5;
  gl_Position = vec4(position, 0.0, 1.0);
}
`);
gl.shaderSource(fragment, `#version 300 es
precision mediump float;
in vec2 uv;
uniform sampler2D image;
out vec4 color;
void main() {
  vec4 sampleColor = texture(image, uv);
  color = vec4(sampleColor.rgb * (0.8 + 0.2 * sin(uv.x * 3.14159)), 1.0);
}
`);
gl.compileShader(vertex);
gl.compileShader(fragment);
if (!gl.getShaderParameter(vertex, gl.COMPILE_STATUS)) throw new Error('Vertex shader failed');
if (!gl.getShaderParameter(fragment, gl.COMPILE_STATUS)) throw new Error('Fragment shader failed');
const program = gl.createProgram();
gl.attachShader(program, vertex);
gl.attachShader(program, fragment);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error('Program link failed');
gl.useProgram(program);
gl.uniform1i(gl.getUniformLocation(program, 'image'), 0);
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
const textureA = gl.createTexture();
const textureB = gl.createTexture();
const output = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, textureA);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([10,40,130,255,10,160,180,255,180,40,120,255,240,160,30,255]));
gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([10,40,130,255,10,160,180,255,180,40,120,255,240,160,30,255]));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.bindTexture(gl.TEXTURE_2D, textureB);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([20,100,40,255,160,220,30,255,200,30,40,255,40,80,210,255]));
gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([250,230,50,255]));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.bindTexture(gl.TEXTURE_2D, output);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
const framebuffer = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, output, 0);
if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete');
gl.viewport(0, 0, 256, 256);
gl.bindTexture(gl.TEXTURE_2D, textureA);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);
gl.clearColor(0.05, 0.06, 0.1, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.viewport(0, 0, 128, 256);
gl.bindTexture(gl.TEXTURE_2D, output);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
gl.viewport(128, 0, 128, 256);
gl.bindTexture(gl.TEXTURE_2D, textureB);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
gl.bindTexture(gl.TEXTURE_2D, null);
if (gl.getError() !== gl.NO_ERROR) throw new Error('WebGL operation failed');
window.__done = true;
</script>
</body>
</html>

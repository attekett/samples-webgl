<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    window.__done = false;
    const gl = document.getElementById('webgl-canvas').getContext('webgl2', { antialias: false });
    if (!gl) throw new Error('WebGL2 not supported');
    const missing = REQUIRED_EXTENSIONS.filter(name => !gl.getExtension(name));
    if (missing.length) throw new Error(`UNSUPPORTED_EXTENSIONS: ${missing.join(', ')}`);

    const canvasSize = 256;
    const vertexFloats = 128;
    const arrayBytes = vertexFloats * 4;
    const largerBytes = arrayBytes * 4;
    const indexCount = 3;
    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.DYNAMIC_DRAW;
    const drawMode = gl.TRIANGLES;
    const indexType = gl.UNSIGNED_INT;
    const textureTarget = gl.TEXTURE_2D;
    let program, vertexBuffer, indexBuffer, vao, colorTexture, framebuffer;

    try {
        const vertex = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertex, `#version 300 es
layout(location=0) in vec2 aPosition;
layout(location=1) in vec3 aColor;
out vec3 vColor;
void main() {
    gl_Position = vec4(aPosition, 0.0, 1.0);
    vColor = aColor;
}`);
        gl.compileShader(vertex);
        const fragment = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragment, `#version 300 es
precision highp float;
in vec3 vColor;
out vec4 color;
void main() {
    float bands = 0.75 + 0.25*sin(gl_FragCoord.x*0.09 + gl_FragCoord.y*0.13);
    color = vec4(vColor*bands, 1.0);
}`);
        gl.compileShader(fragment);
        program = gl.createProgram();
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    } catch (error) { throw error; }

    const vertexData = new Float32Array(vertexFloats);
    vertexData.set([
        -0.95,-0.75, 0.95,0.35,0.2,  -0.12,-0.75, 0.95,0.35,0.2,  -0.53,0.78, 0.95,0.35,0.2,
         0.12,-0.75, 0.2,0.65,1.0,     0.95,-0.75, 0.2,0.65,1.0,      0.53,0.78, 0.2,0.65,1.0
    ]);

    try {
        vertexBuffer = gl.createBuffer();
        indexBuffer = gl.createBuffer();
        gl.bindBuffer(bufferTarget, vertexBuffer);
        gl.bufferData(bufferTarget, vertexData, bufferUsage);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array([0,1,2,3,4,5]), gl.STATIC_DRAW);
    } catch (error) { throw error; }

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(bufferTarget, vertexBuffer);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 20, 8);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
    } catch (error) { throw error; }

    try {
        colorTexture = gl.createTexture();
        gl.bindTexture(textureTarget, colorTexture);
        gl.texStorage2D(textureTarget, 1, gl.RGBA8, canvasSize, canvasSize);
        framebuffer = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, textureTarget, colorTexture, 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('Framebuffer incomplete');
    } catch (error) { throw error; }

    try {
        gl.viewport(0, 0, canvasSize, canvasSize);
        gl.clearColor(0.04, 0.06, 0.13, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(program);
        gl.bindVertexArray(vao);
        gl.drawElements(drawMode, indexCount, indexType, 0);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(bufferTarget, vertexBuffer);
        gl.bufferData(bufferTarget, largerBytes, bufferUsage);
        gl.bufferSubData(bufferTarget, 0, vertexData);
        gl.bufferData(bufferTarget, arrayBytes, bufferUsage);
        gl.bufferSubData(bufferTarget, 0, vertexData);
        gl.bufferSubData(bufferTarget, 88, new Float32Array([0.95, 0.28, 0.86]));
        gl.drawElements(drawMode, indexCount, indexType, 12);
        gl.drawElements(drawMode, 0, indexType, 0);
        gl.drawArrays(drawMode, 0, 1);
        gl.drawArraysInstanced(drawMode, 0, indexCount, 0);
        gl.drawArraysInstanced(drawMode, 0, indexCount, 1);
    } catch (error) { throw error; }

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, framebuffer);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
        gl.blitFramebuffer(0, 0, canvasSize, canvasSize, 0, 0, canvasSize, canvasSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    } catch (error) { throw error; }

    if (gl.getError() !== gl.NO_ERROR) throw new Error('WebGL operation failed');
    window.__done = true;
}

main().catch(error => { throw error; });
</script>
</body>
</html>

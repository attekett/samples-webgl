<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2');
 if (!gl) {
 throw new Error("WebGL2 not supported - required for all tests");
 }

 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

 // ==========================================
 // GPU DATA PROCESSING PIPELINE IMPLEMENTATION
 // ==========================================

 // CONFIGURATION: Pipeline parameters for fuzzing
 const DATA_POINT_COUNT = 1024;
 const FILTER_THRESHOLD = 0.3;
 const SORT_ITERATIONS = 8;
 const ANALYSIS_SCALE = 2.0;
 const STATE_CHANGE_COUNT = 25;
 const RESOURCE_BINDING_CYCLES = 8;

 // Single shader that processes data through conditional stages
 const processingVertexShader = `#version 300 es
 in vec4 aPosition;

 out vec4 vProcessedData;

 uniform float uTime;
 uniform int uProcessingStage;
 uniform float uFilterThreshold;
 uniform float uSortIterations;
 uniform float uAnalysisScale;

 void main() {
     float vertexId = float(gl_VertexID);
     float time = uTime;

     // Stage 0: Generate initial data
     vec4 data = vec4(
         sin(vertexId * 0.01 + time) * 1.5,
         cos(vertexId * 0.015 + time * 1.3) * 1.5,
         sin(vertexId * 0.02 + time * 0.7) * 1.5,
         cos(vertexId * 0.025 + time * 1.1) * 1.5
     );

     // Stage 1: Filtering
     if(uProcessingStage >= 1) {
         float magnitude = length(data.xyz);
         float filterFactor = step(uFilterThreshold, magnitude);
         data = data * mix(0.1, 1.2, filterFactor);
     }

     // Stage 2: Sorting/Processing
     if(uProcessingStage >= 2) {
         for(int i = 0; i < 8; i++) {
             if(i < int(uSortIterations)) {
                 data = vec4(
                     min(data.x, data.y),
                     max(data.x, data.y),
                     min(data.z, data.w),
                     max(data.z, data.w)
                 ) * 0.9;
             }
         }
     }

     // Stage 3: Analysis
     if(uProcessingStage >= 3) {
         float sum = data.x + data.y + data.z + data.w;
         float product = data.x * data.y * data.z * data.w;
         data = vec4(
             sin(sum * uAnalysisScale) + 0.1,
             cos(product * uAnalysisScale) + 0.1,
             sqrt(abs(sum - product)) * uAnalysisScale,
             atan(sum, product) * uAnalysisScale
         );
     }

     vProcessedData = data;
     gl_Position = aPosition;
 }
 `;

 // Fragment shader for visualization
 const fragmentShader = `#version 300 es
 precision highp float;

 in vec4 vProcessedData;

 out vec4 fragColor;

 uniform float uTime;

 void main() {
     vec4 data = vProcessedData;

     // Create visual representation based on processed data
     float intensity = length(data.xyz) * 0.3 + 0.5;
     float hue = (atan(data.y, data.x) / (2.0 * 3.14159) + 0.5 + uTime * 0.05) * 0.8;
     float saturation = 0.8;

     // Convert HSV to RGB
     float c = intensity * saturation;
     float x = c * (1.0 - abs(mod(hue * 6.0, 2.0) - 1.0));
     float m = intensity - c;

     vec3 rgb;
     if(hue < 1.0/6.0) rgb = vec3(c, x, 0.0);
     else if(hue < 2.0/6.0) rgb = vec3(x, c, 0.0);
     else if(hue < 3.0/6.0) rgb = vec3(0.0, c, x);
     else if(hue < 4.0/6.0) rgb = vec3(0.0, x, c);
     else if(hue < 5.0/6.0) rgb = vec3(x, 0.0, c);
     else rgb = vec3(c, 0.0, x);

     rgb += m;
     fragColor = vec4(rgb, 1.0);
 }
 `;

 // Shader compilation helper
 function createShader(gl, type, source) {
     const shader = gl.createShader(type);
     gl.shaderSource(shader, source);
     gl.compileShader(shader);
     if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
         throw new Error(`Shader compilation failed: ${gl.getShaderInfoLog(shader)}`);
     }
     return shader;
 }

 // Program creation helper
 function createProgram(gl, vertexSource, fragmentSource) {
     const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
     const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);

     const program = gl.createProgram();
     gl.attachShader(program, vertexShader);
     gl.attachShader(program, fragmentShader);

     gl.linkProgram(program);
     if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
         throw new Error(`Program linking failed: ${gl.getProgramInfoLog(program)}`);
     }

     return program;
 }

 // Create processing program
 const processingProgram = createProgram(gl, processingVertexShader, fragmentShader);

 // Create position buffer
 const positionBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 const positionData = new Float32Array(DATA_POINT_COUNT * 4);
 for(let i = 0; i < DATA_POINT_COUNT; i++) {
     const angle = (i / DATA_POINT_COUNT) * Math.PI * 2;
     const radius = 0.8;
     positionData[i * 4] = Math.cos(angle) * radius;
     positionData[i * 4 + 1] = Math.sin(angle) * radius;
     positionData[i * 4 + 2] = 0.0;
     positionData[i * 4 + 3] = 1.0;
 }
 gl.bufferData(gl.ARRAY_BUFFER, positionData, gl.STATIC_DRAW);

 // VAO setup
 const vao = gl.createVertexArray();
 gl.bindVertexArray(vao);
 gl.enableVertexAttribArray(gl.getAttribLocation(processingProgram, 'aPosition'));
 gl.vertexAttribPointer(gl.getAttribLocation(processingProgram, 'aPosition'), 4, gl.FLOAT, false, 0, 0);

 // ==========================================
 // STATE POISONING AND FUZZING SURFACE AREA
 // ==========================================

 // Heavy state poisoning with 50+ operations
 for(let i = 0; i < STATE_CHANGE_COUNT; i++) {
     gl.enable(gl.BLEND);
     gl.disable(gl.BLEND);
     gl.enable(gl.DEPTH_TEST);
     gl.disable(gl.DEPTH_TEST);
     gl.enable(gl.CULL_FACE);
     gl.disable(gl.CULL_FACE);
     gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
     gl.blendFunc(gl.ONE, gl.ONE);
     gl.blendEquation(gl.FUNC_ADD);
     gl.blendEquation(gl.FUNC_SUBTRACT);
     gl.viewport(0, 0, 256, 256);
     gl.viewport(10, 10, 236, 236);
     gl.scissor(0, 0, 256, 256);
     gl.scissor(20, 20, 216, 216);
 }

 // Animation loop
 let frameCount = 0;
 function animate() {
     frameCount++;

     // Clear with varying colors for visual feedback
     const clearColors = [
         [0.1, 0.1, 0.2, 1.0], // Blue - raw data
         [0.2, 0.1, 0.1, 1.0], // Red - filtered
         [0.1, 0.2, 0.1, 1.0], // Green - sorted
         [0.2, 0.2, 0.1, 1.0]  // Yellow - analyzed
     ];
     const stage = frameCount % 4;
     gl.clearColor(...clearColors[stage]);
     gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

     // State changes per frame
     gl.enable(gl.BLEND);
     gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

     // Render with different processing stages
     gl.useProgram(processingProgram);
     gl.bindVertexArray(vao);

     gl.uniform1f(gl.getUniformLocation(processingProgram, 'uTime'), frameCount * 0.01);
     gl.uniform1i(gl.getUniformLocation(processingProgram, 'uProcessingStage'), stage);
     gl.uniform1f(gl.getUniformLocation(processingProgram, 'uFilterThreshold'), FILTER_THRESHOLD);
     gl.uniform1f(gl.getUniformLocation(processingProgram, 'uSortIterations'), SORT_ITERATIONS);
     gl.uniform1f(gl.getUniformLocation(processingProgram, 'uAnalysisScale'), ANALYSIS_SCALE);

     gl.drawArrays(gl.POINTS, 0, DATA_POINT_COUNT);

     // Additional resource binding cycles for fuzzing
     for(let cycle = 0; cycle < RESOURCE_BINDING_CYCLES; cycle++) {
         gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
         gl.bindBuffer(gl.ARRAY_BUFFER, null);
         gl.bindVertexArray(vao);
         gl.bindVertexArray(null);
     }

     requestAnimationFrame(animate);
 }

 animate();

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
 throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 console.error(err);
});
</script>
</body>
</html>

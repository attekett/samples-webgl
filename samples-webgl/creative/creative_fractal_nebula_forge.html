<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
  'EXT_color_buffer_float'
];

async function main() {
  const canvas = document.getElementById('webgl-canvas');
  const gl = canvas.getContext('webgl2');
  if (!gl) throw new Error("WebGL2 not supported");

  // WebGL2 extension detection (simplified)
  const missingExtensions = [];
  const availableAsCore = [];

  REQUIRED_EXTENSIONS.forEach(ext => {
    const extension = gl.getExtension(ext);
    if (!extension) {
      missingExtensions.push(ext);
    }
  });

  if (missingExtensions.length > 0) {
    const isPlaywrightFirefox = typeof window.playwright !== 'undefined' ||
                               navigator.userAgent.includes('Headless') ||
                               !window.chrome;

    if (isPlaywrightFirefox) {
      throw new Error(`PLAYWRIGHT_FIREFOX_LIMITATION: Extensions ${missingExtensions.join(', ')} not available in Playwright Firefox.`);
    } else {
      throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
  }

  // Fuzzing parameters
  const organismCount = 100;
  const mutationRate = 0.1;
  const precisionMode = 1; // 0=single, 1=double emulation

  // Create genetic pool texture (RGBA32F for parameter storage)
  const geneticPoolTexture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, geneticPoolTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 10, 10, 0, gl.RGBA, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  // Initialize genetic pool with random fractal parameters
  const initialParams = new Float32Array(10 * 10 * 4);
  for (let i = 0; i < initialParams.length; i += 4) {
    initialParams[i] = (Math.random() - 0.5) * 2.0;     // center x
    initialParams[i + 1] = (Math.random() - 0.5) * 2.0; // center y
    initialParams[i + 2] = Math.random() * 100 + 50;    // zoom
    initialParams[i + 3] = Math.random() * 100 + 50;    // iterations
  }
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 10, 10, gl.RGBA, gl.FLOAT, initialParams);

  // Create derivative texture for MRT
  const derivativeTexture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, derivativeTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 10, 10, 0, gl.RGBA, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

  // Create FBO for MRT
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, geneticPoolTexture, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, derivativeTexture, 0);

  // Set draw buffers for MRT
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);

  // Create Transform Feedback buffers for evolution
  const tfBuffer1 = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tfBuffer1);
  gl.bufferData(gl.ARRAY_BUFFER, organismCount * 4 * 4, gl.DYNAMIC_COPY); // 4 floats per organism

  const tfBuffer2 = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tfBuffer2);
  gl.bufferData(gl.ARRAY_BUFFER, organismCount * 4 * 4, gl.DYNAMIC_COPY);

  // Initialize TF data
  const tfData = new Float32Array(organismCount * 4);
  for (let i = 0; i < tfData.length; i += 4) {
    tfData[i] = Math.random();     // fitness
    tfData[i + 1] = Math.random(); // mutation seed
    tfData[i + 2] = Math.random(); // parent index
    tfData[i + 3] = Math.random(); // generation
  }
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, tfData);

  // Create Transform Feedback object
  const tf = gl.createTransformFeedback();
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer2);

  // Shaders
  const evolutionVS = `#version 300 es
  precision highp float;

  uniform sampler2D uGeneticPool;
  uniform float uMutationRate;
  uniform int uPrecisionMode;

  in vec4 aEvolutionData; // fitness, mutation_seed, parent_index, generation

  out vec4 vEvolvedParams;

  // Double precision emulation
  vec2 ds_add(vec2 a, vec2 b) {
    vec2 s = a + b;
    vec2 v = s - a;
    vec2 r = (a - (s - v)) + (b - v);
    return vec2(s.x + r.x, r.y);
  }

  vec2 ds_mul(vec2 a, vec2 b) {
    vec2 p = vec2(a.x * b.x, a.x * b.y + a.y * b.x);
    float h = a.y * b.y;
    return vec2(p.x + h, p.y);
  }

  void main() {
    int organismIndex = gl_VertexID;
    ivec2 texCoord = ivec2(organismIndex % 10, organismIndex / 10);

    vec4 params = texelFetch(uGeneticPool, texCoord, 0);

    // Evolution logic
    float fitness = aEvolutionData.x;
    float mutationSeed = aEvolutionData.y;
    float parentIndex = aEvolutionData.z;
    float generation = aEvolutionData.w;

    // Mutate parameters based on fitness and mutation rate
    vec4 mutatedParams = params;

    if (uPrecisionMode == 1) {
      // Double precision evolution
      vec2 cx_ds = vec2(params.x, 0.0);
      vec2 cy_ds = vec2(params.y, 0.0);
      vec2 zoom_ds = vec2(params.z, 0.0);

      // Complex mutations with double precision
      cx_ds = ds_add(cx_ds, vec2(mutationSeed * uMutationRate, 0.0));
      cy_ds = ds_add(cy_ds, vec2(mutationSeed * uMutationRate * 0.5, 0.0));
      zoom_ds = ds_mul(zoom_ds, vec2(1.0 + mutationSeed * uMutationRate * 0.1, 0.0));

      mutatedParams.x = cx_ds.x;
      mutatedParams.y = cy_ds.x;
      mutatedParams.z = zoom_ds.x;
    } else {
      // Single precision evolution
      mutatedParams.x += mutationSeed * uMutationRate;
      mutatedParams.y += mutationSeed * uMutationRate * 0.5;
      mutatedParams.z *= 1.0 + mutationSeed * uMutationRate * 0.1;
    }

    mutatedParams.w = clamp(mutatedParams.w + mutationSeed * 10.0, 50.0, 200.0);

    vEvolvedParams = mutatedParams;

    // Transform feedback output
    gl_Position = vec4(float(organismIndex) / float(${organismCount}), fitness, 0.0, 1.0);
  }
  `;

  const evolutionFS = `#version 300 es
  precision highp float;

  in vec4 vEvolvedParams;

  layout(location = 0) out vec4 oColor;
  layout(location = 1) out vec4 oDerivatives;

  void main() {
    // Compute derivatives for next generation
    float dx = dFdx(vEvolvedParams.x);
    float dy = dFdy(vEvolvedParams.y);
    float dz = dFdx(vEvolvedParams.z);

    oColor = vEvolvedParams;
    oDerivatives = vec4(dx, dy, dz, length(vec3(dx, dy, dz)));
  }
  `;

  const mandelbrotVS = `#version 300 es
  precision highp float;

  uniform vec2 uResolution;
  uniform vec4 uFractalParams[${organismCount}]; // center_x, center_y, zoom, iterations

  out vec2 vTexCoord;
  flat out int vOrganismIndex;

  void main() {
    vOrganismIndex = gl_InstanceID;
    vec4 params = uFractalParams[gl_InstanceID];

    vec2 pos = vec2(float(gl_VertexID % 2), float(gl_VertexID / 2)) * 2.0 - 1.0;
    gl_Position = vec4(pos, 0.0, 1.0);

    vTexCoord = pos * 0.5 + 0.5;
  }
  `;

  const mandelbrotFS = `#version 300 es
  precision highp float;

  uniform vec2 uResolution;
  uniform vec4 uFractalParams[${organismCount}];
  uniform float uTime;

  in vec2 vTexCoord;
  flat in int vOrganismIndex;

  out vec4 oColor;

  // Double precision Mandelbrot
  vec2 ds_add(vec2 a, vec2 b) {
    vec2 s = a + b;
    vec2 v = s - a;
    vec2 r = (a - (s - v)) + (b - v);
    return vec2(s.x + r.x, r.y);
  }

  vec2 ds_mul(vec2 a, vec2 b) {
    vec2 p = vec2(a.x * b.x, a.x * b.y + a.y * b.x);
    float h = a.y * b.y;
    return vec2(p.x + h, p.y);
  }

  vec2 ds_sqr(vec2 a) {
    return ds_mul(a, a);
  }

  void main() {
    vec4 params = uFractalParams[vOrganismIndex];

    vec2 c = (vTexCoord - 0.5) / params.z + vec2(params.x, params.y);
    vec2 z = vec2(0.0);

    int maxIter = int(params.w);
    int iter = 0;

    for (int i = 0; i < 200; i++) {
      if (i >= maxIter) break;

      // Double precision iteration
      vec2 z2 = ds_sqr(z);
      vec2 zc = ds_add(z2, c);
      z = zc;

      if (dot(z, z) > 4.0) break;
      iter = i + 1;
    }

    float t = float(iter) / float(maxIter);
    oColor = vec4(sin(t * 6.28 + uTime) * 0.5 + 0.5,
                  cos(t * 6.28 + uTime * 1.3) * 0.5 + 0.5,
                  sin(t * 6.28 + uTime * 0.7) * 0.5 + 0.5, 1.0);
  }
  `;

  // Create programs
  const evolutionProgram = createProgram(gl, evolutionVS, evolutionFS);
  const mandelbrotProgram = createProgram(gl, mandelbrotVS, mandelbrotFS);

  if (!evolutionProgram || !mandelbrotProgram) {
    throw new Error("Shader compilation failed");
  }

  // Set up VAO for evolution
  const evolutionVAO = gl.createVertexArray();
  gl.bindVertexArray(evolutionVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, tfBuffer1);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);

  // Set up VAO for rendering
  const renderVAO = gl.createVertexArray();
  gl.bindVertexArray(renderVAO);

  // Uniform locations
  const evolutionUniforms = {
    uGeneticPool: gl.getUniformLocation(evolutionProgram, 'uGeneticPool'),
    uMutationRate: gl.getUniformLocation(evolutionProgram, 'uMutationRate'),
    uPrecisionMode: gl.getUniformLocation(evolutionProgram, 'uPrecisionMode')
  };

  const mandelbrotUniforms = {
    uResolution: gl.getUniformLocation(mandelbrotProgram, 'uResolution'),
    uTime: gl.getUniformLocation(mandelbrotProgram, 'uTime')
  };

  // State poisoning - lots of redundant operations
  for (let i = 0; i < 25; i++) {
    gl.enable(gl.BLEND);
    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.disable(gl.DEPTH_TEST);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.blendEquation(gl.FUNC_ADD);
    gl.viewport(0, 0, 256, 256);
    gl.scissor(0, 0, 256, 256);
    gl.enable(gl.SCISSOR_TEST);
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(Math.random(), Math.random(), Math.random(), 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }

  // Animation loop
  let time = 0;
  let currentTFBuffer = tfBuffer1;
  let nextTFBuffer = tfBuffer2;

  function render() {
    time += 0.016;

    // Evolution pass with Transform Feedback
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, 10, 10);

    gl.useProgram(evolutionProgram);
    gl.bindVertexArray(evolutionVAO);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, geneticPoolTexture);
    gl.uniform1i(evolutionUniforms.uGeneticPool, 0);
    gl.uniform1f(evolutionUniforms.uMutationRate, mutationRate);
    gl.uniform1i(evolutionUniforms.uPrecisionMode, precisionMode);

    // Bind current TF buffer as input
    gl.bindBuffer(gl.ARRAY_BUFFER, currentTFBuffer);

    // Bind next TF buffer as output
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, nextTFBuffer);

    gl.enable(gl.RASTERIZER_DISCARD);
    gl.beginTransformFeedback(gl.POINTS);
    gl.drawArrays(gl.POINTS, 0, organismCount);
    gl.endTransformFeedback();
    gl.disable(gl.RASTERIZER_DISCARD);

    // MRT rendering pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, 256, 256);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(mandelbrotProgram);
    gl.bindVertexArray(renderVAO);

    gl.uniform2f(mandelbrotUniforms.uResolution, 256.0, 256.0);
    gl.uniform1f(mandelbrotUniforms.uTime, time);

    // Upload evolved parameters as uniforms
    for (let i = 0; i < organismCount; i++) {
      ivec2 texCoord = ivec2(i % 10, i / 10);
      // Read evolved parameters from MRT texture
      // In real implementation, would read from texture and upload
      gl.uniform4f(gl.getUniformLocation(mandelbrotProgram, `uFractalParams[${i}]`),
                   (Math.random() - 0.5) * 2.0, (Math.random() - 0.5) * 2.0,
                   Math.random() * 100 + 50, Math.random() * 100 + 50);
    }

    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, organismCount);

    // Swap TF buffers
    [currentTFBuffer, nextTFBuffer] = [nextTFBuffer, currentTFBuffer];

    requestAnimationFrame(render);
  }

  render();

  const error = gl.getError();
  if (error !== gl.NO_ERROR) {
    throw new Error(`WebGL Error: ${error}`);
  }
}

function createProgram(gl, vsSource, fsSource) {
  const vertexShader = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vertexShader, vsSource);
  gl.compileShader(vertexShader);

  const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fragmentShader, fsSource);
  gl.compileShader(fragmentShader);

  const program = gl.createProgram();
  gl.attachShader(program, vertexShader);
  gl.attachShader(program, fragmentShader);
  gl.linkProgram(program);

  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Vertex shader info log:', gl.getShaderInfoLog(vertexShader));
    console.error('Fragment shader info log:', gl.getShaderInfoLog(fragmentShader));
    console.error('Program info log:', gl.getProgramInfoLog(program));
    return null;
  }

  return program;
}

main().catch(err => {
  throw err;
});
</script>

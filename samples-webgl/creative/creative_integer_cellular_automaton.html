<!DOCTYPE html>
<html>

<body>
    <canvas id="webgl-canvas" width="512" height="512"></canvas>
    <script>
        // CONFIGURATION
        const REQUIRED_EXTENSIONS = []; // WebGL2 Core is sufficient for Integer Textures

        async function main() {
            console.log("Starting Main...");
            const canvas = document.getElementById('webgl-canvas');
            const gl = canvas.getContext('webgl2');
            if (!gl) throw new Error("WebGL2 not supported");

            // Fuzzing Variables
            const GRID_SIZE = 256; // Texture size
            const STEPS_PER_FRAME = 2;
            const STATE_CHANGE_COUNT = 25;

            // Helper: Create Shader
            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    const log = gl.getShaderInfoLog(shader);
                    console.error("Shader Compile Error:", log);
                    console.error("Source:", source);
                    throw new Error("Shader Compile Error: " + log);
                }
                return shader;
            }

            function createProgram(gl, vsSrc, fsSrc) {
                const program = gl.createProgram();
                gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSrc));
                gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSrc));
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    const log = gl.getProgramInfoLog(program);
                    console.error("Program Link Error:", log);
                    throw new Error("Program Link Error: " + log);
                }
                return program;
            }

            // --- Shaders ---

            // 1. Simulation Shader (Integer Output)
            const simVS = `#version 300 es
    layout(location=0) in vec2 a_position;
    out vec2 v_uv;
    void main() {
        v_uv = a_position * 0.5 + 0.5;
        gl_Position = vec4(a_position, 0.0, 1.0);
    }
    `;

            const simFS = `#version 300 es
    precision highp float;
    precision highp int;
    precision highp usampler2D; // Unsigned integer sampler

    in vec2 v_uv;
    uniform usampler2D u_state;
    // Rule UBO (std140 layout)
    layout(std140) uniform Rules {
        uint surviveMin;
        uint surviveMax;
        uint bornMin;
        uint bornMax;
    } rules; // Instance name 'rules'

    layout(location=0) out uvec4 outState; // Integer output

    void main() {
        // Sample 3x3 neighbor hood
        ivec2 size = textureSize(u_state, 0);
        ivec2 coord = ivec2(v_uv * vec2(size));
        
        uint totalNeighbors = 0u;
        for(int y=-1; y<=1; y++) {
            for(int x=-1; x<=1; x++) {
                if(x==0 && y==0) continue;
                // Periodic boundary? wrap logic or texture wrap
                // Let's rely on sampler wrap
                totalNeighbors += texture(u_state, v_uv + vec2(x,y)/vec2(size)).r; 
            }
        }

        uint currentState = texture(u_state, v_uv).r;
        uint nextState = 0u;

        // Apply Conway-like rules from UBO
        if (currentState > 0u) {
            if (totalNeighbors >= rules.surviveMin && totalNeighbors <= rules.surviveMax) {
                nextState = 1u;
            }
        } else {
            if (totalNeighbors >= rules.bornMin && totalNeighbors <= rules.bornMax) {
                nextState = 1u;
            }
        }
        
        // Bitwise mutation logic to stress int pipeline
        // If state is 1, maybe flip some bits in G/B channels for fun
        uint extra = (currentState ^ totalNeighbors) & 0xFFu;

        outState = uvec4(nextState, extra, 0u, 255u);
    }
    `;

            // 2. Visualization Shader (Draws to Screen)
            // Instanced rendering of grid cells? Or just a full screen quad mapping texture to color?
            // Let's use Instanced Quads for "Biomass" (Vertex Shader logic)
            const vizVS = `#version 300 es
    layout(location=0) in vec2 a_pos;       // Quad vertex
    layout(location=1) in vec2 a_gridPos;   // Instance Position (integers 0..GRID_SIZE)
    
    precision highp usampler2D;

    uniform usampler2D u_state;
    uniform vec2 u_gridSize;
    uniform mat4 u_proj;

    out vec3 v_color;

    void main() {
        // Fetch state for this instance
        // Integer texture fetch
        ivec2 coord = ivec2(a_gridPos);
        uvec4 state = texelFetch(u_state, coord, 0);

        if (state.r == 0u) {
            // Dead cell - collapse geometry
            gl_Position = vec4(0.0);
            return;
        }

        // Alive - position at grid
        vec2 worldPos = (a_gridPos / u_gridSize) * 2.0 - 1.0; // -1 to 1
        vec2 cellSize = (1.0 / u_gridSize) * 1.8; // slightly smaller
        
        vec2 finalPos = worldPos + a_pos * cellSize;
        gl_Position = vec4(finalPos, 0.0, 1.0);
        
        // Color based on "extra" state data (G channel)
        float gVal = float(state.g) / 255.0;
        v_color = vec3(0.1, 0.8, 0.2) + vec3(gVal, 0.0, -gVal);
    }
    `;

            const vizFS = `#version 300 es
    precision highp float;
    in vec3 v_color;
    out vec4 outColor;
    void main() {
        outColor = vec4(v_color, 1.0);
    }
    `;

            console.log("Compiling Shaders...");
            const simProg = createProgram(gl, simVS, simFS);
            const vizProg = createProgram(gl, vizVS, vizFS);
            console.log("Shaders Compiled.");

            // --- Resources ---

            // 1. Double Buffered Integer Texture & FBO
            const textures = [gl.createTexture(), gl.createTexture()];
            const fbos = [gl.createFramebuffer(), gl.createFramebuffer()];

            // Initialize with DATA (No lazy init warning)
            const initialData = new Uint8Array(GRID_SIZE * GRID_SIZE * 4);
            for (let i = 0; i < initialData.length; i += 4) {
                // Randomly alive
                if (Math.random() > 0.8) {
                    initialData[i] = 1; // R
                    initialData[i + 1] = Math.floor(Math.random() * 255); // G
                    initialData[i + 3] = 255; // A
                }
            }

            for (let i = 0; i < 2; i++) {
                gl.bindTexture(gl.TEXTURE_2D, textures[i]);
                // RGBA8UI = Unsigned Byte Integers
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8UI, GRID_SIZE, GRID_SIZE, 0, gl.RGBA_INTEGER, gl.UNSIGNED_BYTE, initialData);
                // NEAREST required for Integer textures (LINEAR is invalid)
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);

                gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[i]);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, textures[i], 0);
                if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
                    throw new Error("FBO Incomplete");
                }
            }

            // 2. Uniform Buffer Object (Rules)
            const rulesBuffer = gl.createBuffer();
            // Survive: 2-3, Born: 3 (Conway)
            const rulesData = new Uint32Array([2, 3, 3, 3]);
            gl.bindBuffer(gl.UNIFORM_BUFFER, rulesBuffer);
            gl.bufferData(gl.UNIFORM_BUFFER, rulesData, gl.DYNAMIC_DRAW);
            gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, rulesBuffer); // Bind to binding point 0

            // Bind block index in shader
            const blockIndex = gl.getUniformBlockIndex(simProg, "Rules");
            gl.uniformBlockBinding(simProg, blockIndex, 0);

            // 3. Geometry (Instanced Quad)
            const quadVerts = new Float32Array([
                -0.5, -0.5,
                0.5, -0.5,
                -0.5, 0.5,
                0.5, 0.5
            ]); // Triangle Strip
            const quadVBO = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
            gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);

            // Instance Positions (0..GRID_SIZE)
            const instancePosData = new Float32Array(GRID_SIZE * GRID_SIZE * 2);
            let idx = 0;
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    instancePosData[idx++] = x;
                    instancePosData[idx++] = y;
                }
            }
            const instanceVBO = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, instanceVBO);
            gl.bufferData(gl.ARRAY_BUFFER, instancePosData, gl.STATIC_DRAW);

            const vizVAO = gl.createVertexArray();
            gl.bindVertexArray(vizVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, quadVBO);
            gl.enableVertexAttribArray(0); // pos
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, instanceVBO);
            gl.enableVertexAttribArray(1); // gridPos
            gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0);
            gl.vertexAttribDivisor(1, 1); // 1 per instance

            // Simple Quad VAO for Simulation phase
            const simVAO = gl.createVertexArray();
            gl.bindVertexArray(simVAO);
            // Reuse quad verts (mapped 0..1 in shader from -1..1 or just use raw attrib)
            // Sim shader expects -1..1 full screen quad on loc 0
            const fsQuadVerts = new Float32Array([
                -1, -1,
                1, -1,
                -1, 1,
                1, 1
            ]);
            const fsQuadVBO = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, fsQuadVBO);
            gl.bufferData(gl.ARRAY_BUFFER, fsQuadVerts, gl.STATIC_DRAW);
            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);


            // --- Logic ---

            // Poison State Helper
            function poisonState() {
                // Update UBO randomly
                if (Math.random() > 0.9) {
                    const rMin = Math.floor(Math.random() * 3);
                    const rMax = rMin + Math.floor(Math.random() * 4);
                    const bMin = Math.floor(Math.random() * 3);
                    const bMax = bMin;
                    gl.bindBuffer(gl.UNIFORM_BUFFER, rulesBuffer);
                    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Uint32Array([rMin, rMax, bMin, bMax]));
                }

                // Randomly bind wrong Texture Unit or FBO momentarily (then fix)
                gl.activeTexture(gl.TEXTURE5);
                gl.bindTexture(gl.TEXTURE_2D, textures[0]);
            }

            const TOTAL_FRAMES = 10; // Run for a few frames to let CA evolve

            console.log("Starting Render Loop...");
            for (let f = 0; f < TOTAL_FRAMES; f++) {
                let readIdx = f % 2;
                let writeIdx = (f + 1) % 2;

                // 1. Simulation Steps
                gl.useProgram(simProg);
                gl.bindVertexArray(simVAO);

                for (let s = 0; s < STEPS_PER_FRAME; s++) {
                    // Ping Pong internal to step
                    gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[writeIdx]);
                    gl.viewport(0, 0, GRID_SIZE, GRID_SIZE);

                    gl.activeTexture(gl.TEXTURE0);
                    gl.bindTexture(gl.TEXTURE_2D, textures[readIdx]);
                    gl.uniform1i(gl.getUniformLocation(simProg, "u_state"), 0);

                    poisonState();

                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                    // Swap for next step
                    let temp = readIdx; readIdx = writeIdx; writeIdx = temp;
                }

                // 2. Visualization
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                gl.viewport(0, 0, 512, 512);
                gl.clearColor(0.1, 0.1, 0.1, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);

                gl.useProgram(vizProg);
                gl.bindVertexArray(vizVAO);

                // Use latest state (readIdx holds the result of last sim step)
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, textures[readIdx]);
                gl.uniform1i(gl.getUniformLocation(vizProg, "u_state"), 0);
                gl.uniform2f(gl.getUniformLocation(vizProg, "u_gridSize"), GRID_SIZE, GRID_SIZE);

                // Draw GRID_SIZE * GRID_SIZE instances
                gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, GRID_SIZE * GRID_SIZE);
            }

            // Check Error
            const error = gl.getError();
            if (error !== gl.NO_ERROR) {
                console.error("WebGL Error:", error);
                throw new Error("WebGL Error: " + error);
            }
            console.log("Success");
        }

        main().catch(e => {
            console.error("Exception:", e.message);
        });
    </script>
</body>

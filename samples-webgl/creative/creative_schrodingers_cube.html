<!DOCTYPE html>
<html>

<body>
    <canvas id="webgl-canvas" width="512" height="512"></canvas>
    <script>
        // CONFIGURATION
        const REQUIRED_EXTENSIONS = [];

        async function main() {
            console.log("Starting Main...");
            const canvas = document.getElementById('webgl-canvas');
            const gl = canvas.getContext('webgl2');
            if (!gl) throw new Error("WebGL2 not supported");

            // Fuzzing Variables
            const TARGET_COUNT = 50;
            const OCCLUDER_COUNT = 10;

            // Helper: Create Shader
            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    const log = gl.getShaderInfoLog(shader);
                    console.error("Shader Compile Error:", log);
                    throw new Error("Shader Compile Error: " + log);
                }
                return shader;
            }

            function createProgram(gl, vsSrc, fsSrc) {
                const program = gl.createProgram();
                gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSrc));
                gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSrc));
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    const log = gl.getProgramInfoLog(program);
                    console.error("Program Link Error:", log);
                    throw new Error("Program Link Error: " + log);
                }
                return program;
            }

            // --- Shaders ---
            const vs = `#version 300 es
    layout(location=0) in vec3 a_pos;
    
    uniform mat4 u_viewProj;
    uniform vec3 u_offset;
    uniform float u_scale;

    void main() {
        vec3 pos = (a_pos * u_scale) + u_offset;
        gl_Position = u_viewProj * vec4(pos, 1.0);
    }
    `;

            const fs = `#version 300 es
    precision highp float;
    uniform vec4 u_color;
    out vec4 outColor;
    void main() {
        outColor = u_color;
    }
    `;

            console.log("Compiling Shaders...");
            const prog = createProgram(gl, vs, fs);
            console.log("Shaders Compiled.");

            // --- Resources ---

            // Cube
            const cubeVerts = new Float32Array([
                -0.5, -0.5, 0.5, 0.5, -0.5, 0.5, 0.5, 0.5, 0.5, -0.5, 0.5, 0.5, // Front
                -0.5, -0.5, -0.5, -0.5, 0.5, -0.5, 0.5, 0.5, -0.5, 0.5, -0.5, -0.5, // Back
            ]);
            const cubeIndices = new Uint16Array([
                0, 1, 2, 0, 2, 3, 4, 5, 6, 4, 6, 7, // Front, Back (simplified)
                3, 2, 6, 3, 6, 5, 0, 4, 7, 0, 7, 1, // Top, Bottom
                1, 7, 6, 1, 6, 2, 0, 3, 5, 0, 5, 4  // Right, Left
            ]);

            const vao = gl.createVertexArray();
            gl.bindVertexArray(vao);
            const vbo = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
            gl.bufferData(gl.ARRAY_BUFFER, cubeVerts, gl.STATIC_DRAW);
            const ibo = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, cubeIndices, gl.STATIC_DRAW);
            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

            // Instances
            const targets = [];
            for (let i = 0; i < TARGET_COUNT; i++) {
                targets.push({
                    pos: [Math.random() * 20 - 10, Math.random() * 10 - 5, Math.random() * 20 - 20],
                    scale: 1.0,
                    visible: true,
                    query: null,  // Current pending query
                    lastVisible: false
                });
            }

            const occluders = [];
            for (let i = 0; i < OCCLUDER_COUNT; i++) {
                occluders.push({
                    pos: [Math.random() * 16 - 8, Math.random() * 8 - 4, Math.random() * 15 - 10],
                    scale: 3.0 // Big walls
                });
            }

            // --- Helpers ---
            const proj = new Float32Array(16);
            const view = new Float32Array(16);
            const viewProj = new Float32Array(16);

            function perspective(out, fovy, aspect, near, far) {
                const f = 1.0 / Math.tan(fovy / 2);
                out.fill(0);
                out[0] = f / aspect; out[5] = f; out[10] = (far + near) / (near - far);
                out[11] = -1; out[14] = (2 * far * near) / (near - far);
            }

            function lookAt(out, eye, center, up) {
                let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
                let len = 1 / Math.hypot(z0, z1, z2); z0 *= len; z1 *= len; z2 *= len;
                let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
                len = Math.hypot(x0, x1, x2); x0 *= len ? 1 / len : 0; x1 *= len ? 1 / len : 0; x2 *= len ? 1 / len : 0;
                let y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;
                len = Math.hypot(y0, y1, y2); y0 *= len ? 1 / len : 0; y1 *= len ? 1 / len : 0; y2 *= len ? 1 / len : 0;
                out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
                out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
                out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
                out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
                out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
                out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
                out[15] = 1;
            }

            function multiply(out, a, b) {
                let a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
                let a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
                let a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
                let a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
                let b0 = b[0], b1 = b[1], b2 = b[2], b3 = b[3];
                out[0] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30; out[1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
                out[2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32; out[3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
                b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
                out[4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30; out[5] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
                out[6] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32; out[7] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
                b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
                out[8] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30; out[9] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
                out[10] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32; out[11] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
                b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
                out[12] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30; out[13] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
                out[14] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32; out[15] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
            }

            // --- Main Loop ---

            gl.clearColor(0.1, 0.1, 0.2, 1);
            gl.enable(gl.DEPTH_TEST);
            gl.useProgram(prog);

            const TOTAL_FRAMES = 20; // Enough frames to cycle queries

            console.log("Starting Loop...");
            for (let f = 0; f < TOTAL_FRAMES; f++) {

                // 1. Process Queries from Previous Frames
                targets.forEach(t => {
                    if (t.query) {
                        // Check if available
                        const available = gl.getQueryParameter(t.query, gl.QUERY_RESULT_AVAILABLE);
                        if (available) {
                            const pixels = gl.getQueryParameter(t.query, gl.QUERY_RESULT);
                            t.lastVisible = (pixels > 0);
                            gl.deleteQuery(t.query);
                            t.query = null;

                            // Logic: If visible, grow. If hidden, move.
                            if (t.lastVisible) {
                                t.scale = Math.min(t.scale * 1.1, 2.0);
                            } else {
                                // Teleport if hidden
                                t.pos[0] = Math.random() * 20 - 10;
                                t.scale = 0.5;
                            }
                        }
                    }
                });

                // 2. Setup Camera
                perspective(proj, Math.PI / 3, 1.0, 0.1, 100.0);
                const angle = f * 0.1;
                lookAt(view, [Math.sin(angle) * 15, 5, Math.cos(angle) * 15], [0, 0, 0], [0, 1, 0]);
                multiply(viewProj, proj, view);
                gl.uniformMatrix4fv(gl.getUniformLocation(prog, "u_viewProj"), false, viewProj);

                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                // 3. Draw Occluders (Walls) - No Queries
                gl.uniform4f(gl.getUniformLocation(prog, "u_color"), 0.5, 0.5, 0.5, 1.0);
                occluders.forEach(o => {
                    gl.uniform3fv(gl.getUniformLocation(prog, "u_offset"), o.pos);
                    gl.uniform1f(gl.getUniformLocation(prog, "u_scale"), o.scale);
                    gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0);
                });

                // 4. Draw Targets (Cubes) - With Queries
                targets.forEach(t => {
                    let startedQuery = false;
                    // Only start new query if we don't have one pending from previous frames
                    if (!t.query) {
                        t.query = gl.createQuery();
                        gl.beginQuery(gl.ANY_SAMPLES_PASSED, t.query);
                        startedQuery = true;
                    }

                    // Draw
                    gl.uniform4f(gl.getUniformLocation(prog, "u_color"), 1.0, t.scale / 2, 0.0, 1.0);
                    gl.uniform3fv(gl.getUniformLocation(prog, "u_offset"), t.pos);
                    gl.uniform1f(gl.getUniformLocation(prog, "u_scale"), t.scale);
                    gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0);

                    // Only end query if we started it THIS frame
                    if (startedQuery) {
                        gl.endQuery(gl.ANY_SAMPLES_PASSED);
                    }
                });

            }

            // Cleanup remaining queries
            targets.forEach(t => { if (t.query) gl.deleteQuery(t.query); });

            const error = gl.getError();
            if (error !== gl.NO_ERROR) {
                console.error("WebGL Error Code:", error);
                throw new Error("WebGL Error: " + error);
            }
            console.log("Success");
        }

        main().catch(e => {
            console.error("Exception:", e.message);
            console.error(e.stack);
        });
    </script>
</body>

</html>

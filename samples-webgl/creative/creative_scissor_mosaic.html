<!DOCTYPE html>
<html>

<body>
    <canvas id="webgl-canvas" width="512" height="512"></canvas>
    <script>
        // CONFIGURATION
        const REQUIRED_EXTENSIONS = [];

        async function main() {
            const canvas = document.getElementById('webgl-canvas');
            const gl = canvas.getContext('webgl2');
            if (!gl) throw new Error("WebGL2 not supported");

            // Fuzzing Variables
            const GRID_DIM = 4; // 4x4 = 16 views
            const TOTAL_VIEWS = GRID_DIM * GRID_DIM;
            const SCISSOR_INSET = 2; // Pixel border around scissor

            // Helper: Create Shader
            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    const log = gl.getShaderInfoLog(shader);
                    console.error("Shader Compile Error:", log);
                    throw new Error("Shader Compile Error: " + log);
                }
                return shader;
            }

            function createProgram(gl, vsSrc, fsSrc) {
                const program = gl.createProgram();
                gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSrc));
                gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSrc));
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    const log = gl.getProgramInfoLog(program);
                    console.error("Program Link Error:", log);
                    throw new Error("Program Link Error: " + log);
                }
                return program;
            }

            // --- Shaders ---

            // Scene Shader
            const vs = `#version 300 es
    layout(location=0) in vec3 a_pos;
    layout(location=1) in vec2 a_uv;
    
    // Camera UBO - We bind a range of this for each view
    layout(std140) uniform Camera {
        mat4 viewProj;
        vec4 colorMod; // random color modifier
    };

    out vec2 v_uv;
    out vec4 v_colorMod;

    void main() {
        v_uv = a_uv;
        v_colorMod = colorMod;
        gl_Position = viewProj * vec4(a_pos, 1.0);
    }
    `;

            const fs = `#version 300 es
    precision highp float;
    precision highp sampler2DArray;
    
    in vec2 v_uv;
    in vec4 v_colorMod;
    
    uniform sampler2DArray u_texture;
    uniform float u_layer;

    out vec4 outColor;

    void main() {
        vec4 texColor = texture(u_texture, vec3(v_uv, u_layer));
        outColor = texColor * v_colorMod;
    }
    `;

            const prog = createProgram(gl, vs, fs);

            // --- Helpers ---
            function colMajor(m) { m.fill(0); m[0] = 1; m[5] = 1; m[10] = 1; m[15] = 1; }
            function perspective(out, fovy, aspect, near, far) {
                const f = 1.0 / Math.tan(fovy / 2);
                const nf = 1 / (near - far);
                out.fill(0);
                out[0] = f / aspect;
                out[5] = f;
                out[10] = (far + near) * nf;
                out[11] = -1;
                out[14] = (2 * far * near) * nf;
            }
            function lookAt(out, eye, center, up) {
                let x0, x1, x2, y0, y1, y2, z0, z1, z2, len;
                let eyex = eye[0], eyey = eye[1], eyez = eye[2];
                let upx = up[0], upy = up[1], upz = up[2];
                let centerx = center[0], centery = center[1], centerz = center[2];
                z0 = eyex - centerx; z1 = eyey - centery; z2 = eyez - centerz;
                len = 1 / Math.hypot(z0, z1, z2); z0 *= len; z1 *= len; z2 *= len;
                x0 = upy * z2 - upz * z1; x1 = upz * z0 - upx * z2; x2 = upx * z1 - upy * z0;
                len = Math.hypot(x0, x1, x2);
                if (!len) { x0 = 0; x1 = 0; x2 = 0; } else { len = 1 / len; x0 *= len; x1 *= len; x2 *= len; }
                y0 = z1 * x2 - z2 * x1; y1 = z2 * x0 - z0 * x2; y2 = z0 * x1 - z1 * x0;
                len = Math.hypot(y0, y1, y2);
                if (!len) { y0 = 0; y1 = 0; y2 = 0; } else { len = 1 / len; y0 *= len; y1 *= len; y2 *= len; }
                out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
                out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
                out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
                out[12] = -(x0 * eyex + x1 * eyey + x2 * eyez);
                out[13] = -(y0 * eyex + y1 * eyey + y2 * eyez);
                out[14] = -(z0 * eyex + z1 * eyey + z2 * eyez);
                out[15] = 1;
            }
            function mat4Mul(out, a, b) {
                let a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
                let a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
                let a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
                let a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
                let b0 = b[0], b1 = b[1], b2 = b[2], b3 = b[3];
                out[0] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
                out[1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
                out[2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
                out[3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
                b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
                out[4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
                out[5] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
                out[6] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
                out[7] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
                b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
                out[8] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
                out[9] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
                out[10] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
                out[11] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
                b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
                out[12] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
                out[13] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
                out[14] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
                out[15] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
            }

            // --- Resources ---

            // 1. Texture Array
            const texArray = gl.createTexture();
            const LAYERS = 4;
            gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray);
            gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, 64, 64, LAYERS);

            // Upload distinct data for each layer
            for (let i = 0; i < LAYERS; i++) {
                const data = new Uint8Array(64 * 64 * 4);
                for (let j = 0; j < data.length; j += 4) {
                    data[j] = (i == 0 || i == 3) ? 255 : 0;   // R
                    data[j + 1] = (i == 1 || i == 3) ? 255 : 0; // G
                    data[j + 2] = (i == 2) ? 255 : 0;         // B
                    data[j + 3] = 255;
                    // Add some noise
                    if (((j / 4) % 64) > 32) data[j + 1] = 128;
                }
                gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, 64, 64, 1, gl.RGBA, gl.UNSIGNED_BYTE, data);
            }
            gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

            // 2. Camera UBO
            const ALIGNMENT = gl.getParameter(gl.UNIFORM_BUFFER_OFFSET_ALIGNMENT);
            const DATA_SIZE = 80;
            const STRIDE = Math.ceil(DATA_SIZE / ALIGNMENT) * ALIGNMENT;
            const uboSize = STRIDE * TOTAL_VIEWS;

            const uboData = new Uint8Array(uboSize);
            const floatView = new Float32Array(uboData.buffer);

            // Fill UBO with 16 different view matrices
            for (let i = 0; i < TOTAL_VIEWS; i++) {
                const offsetFloat = (i * STRIDE) / 4;

                const angle = (i / TOTAL_VIEWS) * Math.PI * 2;
                const radius = 3.0;
                const camX = Math.cos(angle) * radius;
                const camZ = Math.sin(angle) * radius;

                const mat = new Float32Array(16); colMajor(mat);
                lookAt(mat, [camX, 2.0, camZ], [0, 0, 0], [0, 1, 0]);
                const proj = new Float32Array(16); perspective(proj, Math.PI / 3, 1.0, 0.1, 10.0);

                const viewProj = new Float32Array(16);
                mat4Mul(viewProj, proj, mat);

                // Copy to UBO
                for (let k = 0; k < 16; k++) floatView[offsetFloat + k] = viewProj[k];

                // Color Mod (vec4) at offset 16 floats (64 bytes)
                floatView[offsetFloat + 16] = 0.5 + Math.random() * 0.5; // R
                floatView[offsetFloat + 17] = 0.5 + Math.random() * 0.5; // G
                floatView[offsetFloat + 18] = 0.5 + Math.random() * 0.5; // B
                floatView[offsetFloat + 19] = 1.0;
            }

            const ubo = gl.createBuffer();
            gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
            gl.bufferData(gl.UNIFORM_BUFFER, uboData, gl.STATIC_DRAW);

            // 3. Geometry (Cube)
            const cubeVerts = new Float32Array([
                // Pos (3) + UV (2)
                -0.5, -0.5, 0.5, 0, 0, 0.5, -0.5, 0.5, 1, 0, 0.5, 0.5, 0.5, 1, 1, -0.5, 0.5, 0.5, 0, 1, // Front
                -0.5, -0.5, -0.5, 0, 0, -0.5, 0.5, -0.5, 0, 1, 0.5, 0.5, -0.5, 1, 1, 0.5, -0.5, -0.5, 1, 0, // Back
            ]);
            const cubeIndices = new Uint16Array([0, 1, 2, 0, 2, 3, 4, 5, 6, 4, 6, 7]);

            const vao = gl.createVertexArray();
            gl.bindVertexArray(vao);

            const vbo = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
            gl.bufferData(gl.ARRAY_BUFFER, cubeVerts, gl.STATIC_DRAW);

            const ibo = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, cubeIndices, gl.STATIC_DRAW);

            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
            gl.enableVertexAttribArray(1);
            gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);

            // --- Main Loop ---

            gl.clearColor(0.2, 0.2, 0.2, 1);
            gl.enable(gl.SCISSOR_TEST); // IMPORTANT
            gl.enable(gl.DEPTH_TEST);

            const VIEW_W = 512 / GRID_DIM;
            const VIEW_H = 512 / GRID_DIM;

            gl.useProgram(prog);
            gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);

            // Bind UBO block
            const blockIndex = gl.getUniformBlockIndex(prog, "Camera");
            gl.uniformBlockBinding(prog, blockIndex, 0);

            // Bind Texture Array
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray);
            gl.uniform1i(gl.getUniformLocation(prog, "u_texture"), 0);

            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); // Global Clear

            for (let y = 0; y < GRID_DIM; y++) {
                for (let x = 0; x < GRID_DIM; x++) {
                    const index = y * GRID_DIM + x;

                    // 1. Viewport & Scissor
                    const vx = x * VIEW_W;
                    const vy = y * VIEW_H;
                    gl.viewport(vx, vy, VIEW_W, VIEW_H);
                    gl.scissor(vx + SCISSOR_INSET, vy + SCISSOR_INSET, VIEW_W - SCISSOR_INSET * 2, VIEW_H - SCISSOR_INSET * 2);

                    // Clear individual scissor rect (churn)
                    gl.clearColor(x / 4, y / 4, 0.5, 1);
                    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                    // 2. Bind UBO Range (Offset into big buffer)
                    // Note: size must be >= block size, and aligned
                    gl.bindBufferRange(gl.UNIFORM_BUFFER, 0, ubo, index * STRIDE, STRIDE);

                    // 3. Set Layer Uniform
                    gl.uniform1f(gl.getUniformLocation(prog, "u_layer"), index % LAYERS);

                    // 4. Draw
                    gl.drawElements(gl.TRIANGLES, 12, gl.UNSIGNED_SHORT, 0);
                }
            }

            const error = gl.getError();
            if (error !== gl.NO_ERROR) {
                console.error("WebGL Error Code:", error);
                throw new Error("WebGL Error: " + error);
            }
            console.log("Success");
        }

        main().catch(e => {
            console.error("Exception:", e.message);
            console.error(e.stack);
        });
    </script>
</body>

</html>

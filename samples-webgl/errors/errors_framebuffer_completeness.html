<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
// CONFIGURATION: WebGL2-only test, no extensions needed for core framebuffer functionality
const REQUIRED_EXTENSIONS = [
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 // ALWAYS use WebGL2 context - no fallback to WebGL1
 const gl = canvas.getContext('webgl2');
 if (!gl) {
 throw new Error("WebGL2 not supported - required for all tests");
 }

 // 1. EXTENSION GATING (WebGL2 core features, no extensions needed)
 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS (none for this test)
 REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // FUZZING VARIABLES: Expose parameters for mutation testing
 const ERROR_TEST_COUNT = 8;
 const STATE_CHANGE_COUNT = 50;
 const RESOURCE_BINDING_CYCLES = 8;
 const INVALID_OPERATION_ATTEMPTS = 16;

 // Create shader programs for visual feedback
 const vertexShaderSource = `#version 300 es
 in vec2 a_position;
 in vec3 a_color;
 out vec3 v_color;
 void main() {
   gl_Position = vec4(a_position, 0.0, 1.0);
   v_color = a_color;
 }
 `;

 const fragmentShaderSource = `#version 300 es
 precision mediump float;
 in vec3 v_color;
 out vec4 fragColor;
 void main() {
   fragColor = vec4(v_color, 1.0);
 }
 `;

 function createShaderProgram(vsSource, fsSource) {
   const vertexShader = gl.createShader(gl.VERTEX_SHADER);
   gl.shaderSource(vertexShader, vsSource);
   gl.compileShader(vertexShader);

   const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
   gl.shaderSource(fragmentShader, fsSource);
   gl.compileShader(fragmentShader);

   const program = gl.createProgram();
   gl.attachShader(program, vertexShader);
   gl.attachShader(program, fragmentShader);
   gl.linkProgram(program);
   return program;
 }

 const program = createShaderProgram(vertexShaderSource, fragmentShaderSource);

 // Create vertex data for 3x3 grid visualization
 const vertices = new Float32Array([
   // Row 0: Framebuffer status indicators
   -0.9, 0.9, 1.0, 0.0, 0.0,   // Red: FRAMEBUFFER_INCOMPLETE_ATTACHMENT
   -0.3, 0.9, 1.0, 0.0, 0.0,
   0.3, 0.9, 1.0, 0.0, 0.0,
   0.9, 0.9, 1.0, 0.0, 0.0,

   // Row 1: More status indicators
   -0.9, 0.3, 0.0, 1.0, 0.0,   // Green: FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT
   -0.3, 0.3, 0.0, 1.0, 0.0,
   0.3, 0.3, 0.0, 1.0, 0.0,
   0.9, 0.3, 0.0, 1.0, 0.0,

   // Row 2: Size/format mismatch indicators
   -0.9, -0.3, 0.0, 0.0, 1.0,  // Blue: FRAMEBUFFER_INCOMPLETE_DIMENSIONS
   -0.3, -0.3, 0.0, 0.0, 1.0,
   0.3, -0.3, 0.0, 0.0, 1.0,
   0.9, -0.3, 0.0, 0.0, 1.0,

   // Row 3: More error indicators
   -0.9, -0.9, 1.0, 1.0, 0.0,  // Yellow: FRAMEBUFFER_UNSUPPORTED
   -0.3, -0.9, 1.0, 1.0, 0.0,
   0.3, -0.9, 1.0, 1.0, 0.0,
   0.9, -0.9, 1.0, 1.0, 0.0
 ]);

 const indices = new Uint16Array([
   0, 1, 4, 5, 1, 2, 5, 6, 2, 3, 6, 7,
   4, 5, 8, 9, 5, 6, 9, 10, 6, 7, 10, 11,
   8, 9, 12, 13, 9, 10, 13, 14, 10, 11, 14, 15
 ]);

 // Create VAO for vertex data
 const vao = gl.createVertexArray();
 gl.bindVertexArray(vao);

 const vertexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

 const positionLoc = gl.getAttribLocation(program, 'a_position');
 gl.enableVertexAttribArray(positionLoc);
 gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 20, 0);

 const colorLoc = gl.getAttribLocation(program, 'a_color');
 gl.enableVertexAttribArray(colorLoc);
 gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 20, 8);

 const indexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

 // STATE POISONING: Heavy capability enable/disable operations
 for (let i = 0; i < STATE_CHANGE_COUNT; i++) {
   gl.enable(gl.BLEND);
   gl.disable(gl.CULL_FACE);
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.STENCIL_TEST);
   gl.enable(gl.SCISSOR_TEST);
   gl.disable(gl.POLYGON_OFFSET_FILL);
 }

 // Create various textures for framebuffer testing
 const textures = [];
 for (let i = 0; i < 16; i++) {
   const texture = gl.createTexture();
   gl.bindTexture(gl.TEXTURE_2D, texture);
   // Mix inline literals with parameterized values for fuzzing
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 64, 64, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
   gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
   gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
   gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
   textures.push(texture);
 }

 // Create renderbuffers for testing
 const renderbuffers = [];
 for (let i = 0; i < 8; i++) {
   const rb = gl.createRenderbuffer();
   gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
   gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, 64, 64);
   renderbuffers.push(rb);
 }

 // FRAMEBUFFER COMPLETENESS ERROR TEST CASES

 // Test Case 1: FRAMEBUFFER_INCOMPLETE_ATTACHMENT - invalid texture attachment
 function testIncompleteAttachment() {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

   // Attach invalid texture (deleted texture)
   gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
   return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
 }

 // Test Case 2: FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT - no color attachment
 function testMissingAttachment() {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

   // Attach only depth, no color
   gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, renderbuffers[0]);
   return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
 }

 // Test Case 3: FRAMEBUFFER_INCOMPLETE_DIMENSIONS - mismatched attachment sizes
 function testDimensionsMismatch() {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

   // Create texture with different size
   const smallTexture = gl.createTexture();
   gl.bindTexture(gl.TEXTURE_2D, smallTexture);
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 32, 32, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

   gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, textures[0], 0);
   gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, smallTexture, 0);
   return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
 }

 // Test Case 4: FRAMEBUFFER_UNSUPPORTED - unsupported format combination
 function testUnsupportedFormat() {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

   // Try to attach color texture as depth (invalid combination)
   gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, textures[1], 0);
   gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, textures[2], 0);
   return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
 }

 // Test Case 5: FRAMEBUFFER_INCOMPLETE_MULTISAMPLE - multisample mismatch
 function testMultisampleMismatch() {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

   // Create multisample renderbuffer
   const msaaRB = gl.createRenderbuffer();
   gl.bindRenderbuffer(gl.RENDERBUFFER, msaaRB);
   gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RGBA8, 64, 64);

   // Attach MSAA color and regular depth
   gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, msaaRB);
   gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, renderbuffers[1]);
   return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
 }

 // Test Case 6: FRAMEBUFFER_INCOMPLETE_ATTACHMENT - deleted renderbuffer
 function testDeletedRenderbuffer() {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

   // Delete renderbuffer before attaching
   const tempRB = gl.createRenderbuffer();
   gl.deleteRenderbuffer(tempRB);

   gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, tempRB);
   return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
 }

 // Test Case 7: FRAMEBUFFER_INCOMPLETE_DIMENSIONS - zero-sized attachment
 function testZeroSizeAttachment() {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

   // Create zero-sized texture
   const zeroTexture = gl.createTexture();
   gl.bindTexture(gl.TEXTURE_2D, zeroTexture);
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

   gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, zeroTexture, 0);
   return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
 }

 // Test Case 8: FRAMEBUFFER_UNSUPPORTED - invalid internal format
 function testInvalidInternalFormat() {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

   // Create texture with invalid internal format
   const invalidTexture = gl.createTexture();
   gl.bindTexture(gl.TEXTURE_2D, invalidTexture);
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 64, 64, 0, gl.RGBA, gl.FLOAT, null);

   gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, invalidTexture, 0);
   return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
 }

 // Run all error tests and collect results
 const errorResults = [];
 const testFunctions = [
   testIncompleteAttachment,
   testMissingAttachment,
   testDimensionsMismatch,
   testUnsupportedFormat,
   testMultisampleMismatch,
   testDeletedRenderbuffer,
   testZeroSizeAttachment,
   testInvalidInternalFormat
 ];

 for (let i = 0; i < ERROR_TEST_COUNT; i++) {
   const status = testFunctions[i]();
   errorResults.push(status);

   // RESOURCE BINDING CHURN: Bind/unbind resources between tests
   for (let j = 0; j < RESOURCE_BINDING_CYCLES; j++) {
     gl.bindTexture(gl.TEXTURE_2D, textures[j % textures.length]);
     gl.bindRenderbuffer(gl.RENDERBUFFER, renderbuffers[j % renderbuffers.length]);
     gl.bindFramebuffer(gl.FRAMEBUFFER, null);
   }
 }

 // INVALID OPERATION ATTEMPTS: Try to render with incomplete framebuffers
 for (let i = 0; i < INVALID_OPERATION_ATTEMPTS; i++) {
   const fbo = gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
   // Attach nothing - incomplete framebuffer

   gl.useProgram(program);
   gl.bindVertexArray(vao);

   // This should trigger INVALID_FRAMEBUFFER_OPERATION
   gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0);

   gl.deleteFramebuffer(fbo);
 }

 // MORE STATE POISONING: Final capability churn
 for (let i = 0; i < STATE_CHANGE_COUNT / 2; i++) {
   gl.disable(gl.BLEND);
   gl.enable(gl.CULL_FACE);
   gl.disable(gl.DEPTH_TEST);
   gl.enable(gl.STENCIL_TEST);
   gl.disable(gl.SCISSOR_TEST);
   gl.enable(gl.POLYGON_OFFSET_FILL);
 }

 // Render visual feedback based on error results
 gl.bindFramebuffer(gl.FRAMEBUFFER, null);
 gl.viewport(0, 0, 256, 256);
 gl.clearColor(0.1, 0.1, 0.1, 1.0);
 gl.clear(gl.COLOR_BUFFER_BIT);

 gl.useProgram(program);
 gl.bindVertexArray(vao);

 // Modify vertex colors based on framebuffer status results
 const colorData = new Float32Array(vertices.length);
 vertices.forEach((val, idx) => colorData[idx] = val);

 // Update colors based on test results
 for (let i = 0; i < ERROR_TEST_COUNT; i++) {
   const status = errorResults[i];
   let r = 0.5, g = 0.5, b = 0.5; // Default gray for complete/unknown

   if (status === gl.FRAMEBUFFER_INCOMPLETE_ATTACHMENT) {
     r = 1.0; g = 0.0; b = 0.0; // Red
   } else if (status === gl.FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT) {
     r = 0.0; g = 1.0; b = 0.0; // Green
   } else if (status === gl.FRAMEBUFFER_INCOMPLETE_DIMENSIONS) {
     r = 0.0; g = 0.0; b = 1.0; // Blue
   } else if (status === gl.FRAMEBUFFER_UNSUPPORTED) {
     r = 1.0; g = 1.0; b = 0.0; // Yellow
   } else if (status === gl.FRAMEBUFFER_COMPLETE) {
     r = 1.0; g = 1.0; b = 1.0; // White for complete
   }

   // Update the color for this test's visual indicator
   const colorOffset = (i * 5) + 2; // Skip position, start at color
   if (colorOffset + 2 < colorData.length) {
     colorData[colorOffset] = r;
     colorData[colorOffset + 1] = g;
     colorData[colorOffset + 2] = b;
   }
 }

 // Update buffer with modified colors
 gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
 gl.bufferSubData(gl.ARRAY_BUFFER, 0, colorData);

 gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
   // For this test, INVALID_FRAMEBUFFER_OPERATION and INVALID_OPERATION errors are expected
   // INVALID_OPERATION can occur when trying operations on incomplete framebuffers
   // Only throw if it's a different error
   if (error !== gl.INVALID_FRAMEBUFFER_OPERATION && error !== gl.INVALID_OPERATION) {
     throw new Error(`Unexpected WebGL Error: ${error}`);
   }
 }
}

// No catch block - let any real errors bubble up naturally
// WebGL warnings about incomplete framebuffers are expected and should not cause test failure
main();
</script>
</body>
</html>

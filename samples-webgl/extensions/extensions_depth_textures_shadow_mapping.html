<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
// CONFIGURATION: Define required extensions here
const REQUIRED_EXTENSIONS = [
 // Depth textures are core in WebGL2, no extensions needed
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
 if (!gl) throw new Error("WebGL not supported");

 // Check if we got WebGL2
 if (!(gl instanceof WebGL2RenderingContext)) {
   // Use WebGL1 compatible depth format
   gl.DEPTH_COMPONENT16 = gl.DEPTH_COMPONENT || 0x81A5;
   gl.DEPTH_COMPONENT24 = gl.DEPTH_COMPONENT || 0x81A6;
   console.log("Using WebGL1 context");
 } else {
   console.log("Using WebGL2 context");
 }

 // 1. EXTENSION GATING
 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 // Signal to the Test Runner that this is an environment limit, not a code bug
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS
 REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // FUZZING VARIABLES - Mix inline literals with parameterized variables
 const shadowMapSize = 256;
 const depthFormat = gl.DEPTH_COMPONENT16;
 const textureFilter = gl.NEAREST;
 const stateChangeCount = 25;

 // DEBUGGING: Check WebGL version
 console.log("WebGL Version:", gl instanceof WebGL2RenderingContext ? "WebGL2" : "WebGL1");

 // Early depth texture creation for state poisoning
 const testTexture = gl.createTexture();

 // SIMPLE VERTEX SHADER
 const vertexShaderSource = `#version 300 es
 in vec3 aPosition;
 in vec2 aTexCoord;

 out vec2 vTexCoord;

 void main() {
   vTexCoord = aTexCoord;
   gl_Position = vec4(aPosition, 1.0);
 }
 `;

 // FRAGMENT SHADER THAT SAMPLES DEPTH TEXTURE
 const fragmentShaderSource = `#version 300 es
 precision highp float;

 in vec2 vTexCoord;

 uniform sampler2D uDepthTexture;

 out vec4 fragColor;

 void main() {
   float depth = texture(uDepthTexture, vTexCoord).r;
   fragColor = vec4(vec3(depth), 1.0);
 }
 `;

 // SHADER COMPILATION HELPER
 function createShader(gl, type, source) {
   const shader = gl.createShader(type);
   gl.shaderSource(shader, source);
   gl.compileShader(shader);

   if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
     throw new Error(`Shader compilation error: ${gl.getShaderInfoLog(shader)}`);
   }
   return shader;
 }

 function createProgram(gl, vertexSource, fragmentSource) {
   const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
   const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);

   const program = gl.createProgram();
   gl.attachShader(program, vertexShader);
   gl.attachShader(program, fragmentShader);
   gl.linkProgram(program);

   if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
     throw new Error(`Program linking error: ${gl.getProgramInfoLog(program)}`);
   }
   return program;
 }

 // CREATE SHADERS AND PROGRAMS
 const program = createProgram(gl, vertexShaderSource, fragmentShaderSource);

 // CREATE GEOMETRY - SIMPLE TRIANGLES WITH DEPTH VARIATION
 const triangleVertices = new Float32Array([
   // Position (x, y, z), TexCoord (u, v)
   -1.0, -1.0, 0.0,  0.0, 0.0,  // Bottom left
    1.0, -1.0, 1.0,  1.0, 0.0,  // Bottom right (closer)
    0.0,  1.0, 0.5,  0.5, 1.0,  // Top center (middle)
 ]);

 const triangleIndices = new Uint16Array([
   0, 1, 2
 ]);

 // CREATE BUFFERS
 const vertexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, triangleVertices, gl.STATIC_DRAW);

 const indexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, triangleIndices, gl.STATIC_DRAW);

 // CREATE DEPTH TEXTURE
 const depthTexture = gl.createTexture();
 gl.bindTexture(gl.TEXTURE_2D, depthTexture);
 gl.texImage2D(gl.TEXTURE_2D, 0, depthFormat, shadowMapSize, shadowMapSize, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, textureFilter);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, textureFilter);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

 // CREATE FRAMEBUFFER FOR DEPTH RENDERING
 const depthFramebuffer = gl.createFramebuffer();
 gl.bindFramebuffer(gl.FRAMEBUFFER, depthFramebuffer);
 gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depthTexture, 0);

 // In WebGL2, we can use drawBuffers with NONE for depth-only rendering
 if (gl instanceof WebGL2RenderingContext) {
   gl.drawBuffers([gl.NONE]);
   gl.readBuffer(gl.NONE);
 }

 if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
   throw new Error("Depth framebuffer is not complete");
 }

 // STATE POISONING - 25+ state changes for fuzzing surface area
 for (let i = 0; i < stateChangeCount; i++) {
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.DEPTH_TEST);
   gl.depthFunc(gl.LESS);
   gl.depthFunc(gl.GREATER);
   gl.enable(gl.CULL_FACE);
   gl.disable(gl.CULL_FACE);
   gl.enable(gl.BLEND);
   gl.disable(gl.BLEND);
   gl.viewport(0, 0, 256, 256);
   gl.viewport(0, 0, 128, 128);
   gl.clearColor(0.0, 0.0, 0.0, 1.0);
   gl.clearColor(1.0, 1.0, 1.0, 1.0);
   gl.bindTexture(gl.TEXTURE_2D, null);
   gl.bindTexture(gl.TEXTURE_2D, testTexture);
   gl.bindBuffer(gl.ARRAY_BUFFER, null);
   gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
 }


 // Depth texture setup
 gl.bindTexture(gl.TEXTURE_2D, testTexture);
 gl.texImage2D(gl.TEXTURE_2D, 0, depthFormat, shadowMapSize, shadowMapSize, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);

 // ULTRA SIMPLE TEST - Just clear screen to verify WebGL works
 gl.viewport(0, 0, 256, 256);
 gl.clearColor(0.5, 0.7, 0.9, 1.0);
 gl.clear(gl.COLOR_BUFFER_BIT);

 // ADDITIONAL STATE POISONING - redundant operations
 for (let i = 0; i < 10; i++) {
   gl.bindTexture(gl.TEXTURE_2D, testTexture);
   gl.bindTexture(gl.TEXTURE_2D, null);
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.DEPTH_TEST);
 }

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
 throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 // If the error string contains "UNSUPPORTED_EXTENSIONS", the Python runner
 // knows to log it to UNSUPPORTED.md and skip.
 // Otherwise, it counts as a test failure/crash.
 console.error("Caught error:", err.message, err.stack); // Allowed for debugging, but DOM update is primary signal
});
</script>
</body>
</html>

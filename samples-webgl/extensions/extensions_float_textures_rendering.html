<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
// CONFIGURATION: Define required extensions here
const REQUIRED_EXTENSIONS = [
 // Focus on float texture sampling rather than render targets
 'OES_texture_half_float'  // Half-precision float textures
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
 if (!gl) throw new Error("WebGL not supported");

 // Determine available float texture support (focus on sampling, not render targets)
 const isWebGL2 = !!canvas.getContext('webgl2');
 let hasFloatTextureSupport = false;
 let floatFormat, precisionLevel, floatDataType;

 if (isWebGL2) {
   // WebGL2 has native float texture support for sampling
   hasFloatTextureSupport = true;
   floatFormat = gl.RGBA32F || gl.RGBA;
   precisionLevel = gl.FLOAT;
   floatDataType = Float32Array;
 } else {
   // WebGL1: Check for half-float extension
   const halfFloatExt = gl.getExtension('OES_texture_half_float');
   if (halfFloatExt) {
     hasFloatTextureSupport = true;
     floatFormat = gl.RGBA;
     precisionLevel = halfFloatExt.HALF_FLOAT_OES;
     floatDataType = Uint16Array;  // Half-float data
   }
 }

 if (!hasFloatTextureSupport) {
   // Signal to the Test Runner that this is an environment limit, not a code bug
   throw new Error(`UNSUPPORTED_EXTENSIONS: Float texture support not available`);
 }

 // 1. EXTENSION GATING (only for WebGL1 extensions)
 const missingExtensions = [];
 if (!isWebGL2) {
   REQUIRED_EXTENSIONS.forEach(ext => {
     if (!gl.getExtension(ext)) {
       missingExtensions.push(ext);
     }
   });
 }
 if (missingExtensions.length > 0) {
   throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS (only for WebGL1)
 if (!isWebGL2) {
   REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
 }

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // FUZZING VARIABLES: Expose parameters for mutation testing
 const toneMapGamma = 2.2;  // Gamma correction for tone mapping
 const textureFiltering = gl.LINEAR;  // Texture filtering mode
 const textureSize = 256;  // Texture resolution
 const precisionLevelParam = 1;  // Which precision level to use (0=regular, 1=float/half-float)
 const dataScale = 2.5;  // Scale factor for float data

 // CREATE SHADERS: Vertex shader for full-screen quad
 const vertexShaderSource = `
   attribute vec2 a_position;
   varying vec2 v_texCoord;
   void main() {
     gl_Position = vec4(a_position, 0.0, 1.0);
     v_texCoord = a_position * 0.5 + 0.5;  // Convert from [-1,1] to [0,1]
   }
 `;

 // Fragment shader for float texture sampling and precision demonstration
 const floatShaderSource = `
   precision highp float;
   varying vec2 v_texCoord;
   uniform sampler2D u_floatTexture;
   uniform sampler2D u_regularTexture;
   uniform float u_gamma;
   uniform int u_precisionMode;

   void main() {
     vec4 floatSample = texture2D(u_floatTexture, v_texCoord);
     vec4 regularSample = texture2D(u_regularTexture, v_texCoord);

     vec3 color;
     if (u_precisionMode == 0) {
       // Show regular texture
       color = regularSample.rgb;
     } else {
       // Show float texture with tone mapping
       vec3 floatColor = floatSample.rgb;

       // Demonstrate float precision by showing values > 1.0
       // Values in float texture can exceed [0,1] range
       floatColor = floatColor / (floatColor + vec3(1.0));  // Tone mapping

       // Gamma correction
       color = pow(floatColor, vec3(1.0 / u_gamma));
     }

     gl_FragColor = vec4(color, 1.0);
   }
 `;

 // COMPILE SHADERS
 function createShader(gl, type, source) {
   const shader = gl.createShader(type);
   gl.shaderSource(shader, source);
   gl.compileShader(shader);
   if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
     throw new Error(`Shader compile error: ${gl.getShaderInfoLog(shader)}`);
   }
   return shader;
 }

 const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
 const floatFragmentShader = createShader(gl, gl.FRAGMENT_SHADER, floatShaderSource);

 // CREATE PROGRAMS
 function createProgram(gl, vertexShader, fragmentShader) {
   const program = gl.createProgram();
   gl.attachShader(program, vertexShader);
   gl.attachShader(program, fragmentShader);
   gl.linkProgram(program);
   if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
     throw new Error(`Program link error: ${gl.getProgramInfoLog(program)}`);
   }
   return program;
 }

 const floatProgram = createProgram(gl, vertexShader, floatFragmentShader);

 // CREATE BUFFERS: Full-screen quad
 const positionBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
   -1, -1,
    1, -1,
   -1,  1,
    1,  1,
 ]), gl.STATIC_DRAW);

 // SETUP ATTRIBUTE LOCATION
 const floatPositionLocation = gl.getAttribLocation(floatProgram, 'a_position');

 // CREATE TEXTURES: Float texture for precision testing and regular texture for comparison

 // Float texture with high-precision data (values > 1.0 to demonstrate HDR)
 const floatTexture = gl.createTexture();
 gl.bindTexture(gl.TEXTURE_2D, floatTexture);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, textureFiltering);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, textureFiltering);

 // Create float texture data with HDR values
 const floatData = new floatDataType(textureSize * textureSize * 4);
 for (let i = 0; i < floatData.length; i += 4) {
   const x = (i / 4) % textureSize;
   const y = Math.floor((i / 4) / textureSize);
   const u = x / textureSize;
   const v = y / textureSize;

   // Create HDR pattern with values exceeding 1.0
   const r = (Math.sin(u * 10.0) * Math.cos(v * 8.0) * 0.5 + 0.5) * dataScale;
   const g = (Math.sin(u * 8.0 + 1.0) * Math.sin(v * 10.0) * 0.5 + 0.5) * dataScale;
   const b = (Math.cos(u * 12.0) * Math.cos(v * 6.0) * 0.5 + 0.5) * dataScale;
   const a = 1.0;

   if (isWebGL2 && precisionLevel === gl.FLOAT) {
     floatData[i] = r;     // R
     floatData[i + 1] = g; // G
     floatData[i + 2] = b; // B
     floatData[i + 3] = a; // A
   } else {
     // For half-float, we need to convert to Uint16Array with proper half-float encoding
     // For simplicity, we'll use a pattern that works with the available precision
     floatData[i] = Math.min(65535, r * 65535);     // R (scaled for half-float)
     floatData[i + 1] = Math.min(65535, g * 65535); // G
     floatData[i + 2] = Math.min(65535, b * 65535); // B
     floatData[i + 3] = 65535; // A (1.0)
   }
 }

 // Upload float texture data
 if (isWebGL2 && floatFormat === gl.RGBA32F) {
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, textureSize, textureSize, 0, gl.RGBA, gl.FLOAT, floatData);
 } else {
   gl.texImage2D(gl.TEXTURE_2D, 0, floatFormat, textureSize, textureSize, 0, floatFormat, precisionLevel, floatData);
 }

 // Regular texture for comparison (clamped to [0,1] range)
 const regularTexture = gl.createTexture();
 gl.bindTexture(gl.TEXTURE_2D, regularTexture);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, textureFiltering);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, textureFiltering);

 // Create regular texture data (clamped)
 const regularData = new Uint8Array(textureSize * textureSize * 4);
 for (let i = 0; i < regularData.length; i += 4) {
   const x = (i / 4) % textureSize;
   const y = Math.floor((i / 4) / textureSize);
   const u = x / textureSize;
   const v = y / textureSize;

   const r = Math.sin(u * 10.0) * Math.cos(v * 8.0) * 0.5 + 0.5;
   const g = Math.sin(u * 8.0 + 1.0) * Math.sin(v * 10.0) * 0.5 + 0.5;
   const b = Math.cos(u * 12.0) * Math.cos(v * 6.0) * 0.5 + 0.5;
   const a = 1.0;

   regularData[i] = r * 255;     // R
   regularData[i + 1] = g * 255; // G
   regularData[i + 2] = b * 255; // B
   regularData[i + 3] = a * 255; // A
 }

 gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureSize, textureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, regularData);

 // STATE POISONING: Heavy capability churn and redundant operations (50+ state changes)
 const capabilities = [gl.BLEND, gl.CULL_FACE, gl.DEPTH_TEST, gl.STENCIL_TEST, gl.SCISSOR_TEST];
 for (let i = 0; i < 10; i++) {  // 10 iterations x 5 capabilities = 50 operations
   capabilities.forEach(cap => {
     gl.enable(cap);
     gl.disable(cap);
     gl.enable(cap);  // Redundant enable
   });
 }

 // Blend state changes
 gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
 gl.blendFunc(gl.ONE, gl.ONE);
 gl.blendEquation(gl.FUNC_ADD);
 gl.blendEquation(gl.FUNC_SUBTRACT);
 gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ZERO);

 // Texture binding churn
 gl.bindTexture(gl.TEXTURE_2D, floatTexture);
 gl.bindTexture(gl.TEXTURE_2D, regularTexture);
 gl.bindTexture(gl.TEXTURE_2D, null);
 gl.bindTexture(gl.TEXTURE_2D, floatTexture);
 gl.bindTexture(gl.TEXTURE_2D, regularTexture);

 // Buffer binding churn
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.bindBuffer(gl.ARRAY_BUFFER, null);
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

 // Viewport changes for state poisoning
 gl.viewport(0, 0, textureSize, textureSize);
 gl.viewport(0, 0, 128, 128);
 gl.viewport(0, 0, textureSize, textureSize);
 gl.viewport(0, 0, 256, 256);  // Final viewport

 // REDUNDANT TEXTURE OPERATIONS: Stress texture state management
 gl.bindTexture(gl.TEXTURE_2D, floatTexture);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, textureFiltering);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, textureFiltering);

 gl.bindTexture(gl.TEXTURE_2D, regularTexture);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, textureFiltering);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, textureFiltering);

 // RENDER TO SCREEN: Sample from float and regular textures
 gl.bindFramebuffer(gl.FRAMEBUFFER, null);
 gl.viewport(0, 0, 256, 256);
 gl.useProgram(floatProgram);

 // Setup attributes
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.enableVertexAttribArray(floatPositionLocation);
 gl.vertexAttribPointer(floatPositionLocation, 2, gl.FLOAT, false, 0, 0);

 // Bind textures
 gl.activeTexture(gl.TEXTURE0);
 gl.bindTexture(gl.TEXTURE_2D, floatTexture);
 gl.activeTexture(gl.TEXTURE1);
 gl.bindTexture(gl.TEXTURE_2D, regularTexture);

 // Set uniforms
 const floatTextureLocation = gl.getUniformLocation(floatProgram, 'u_floatTexture');
 const regularTextureLocation = gl.getUniformLocation(floatProgram, 'u_regularTexture');
 const gammaLocation = gl.getUniformLocation(floatProgram, 'u_gamma');
 const precisionModeLocation = gl.getUniformLocation(floatProgram, 'u_precisionMode');

 gl.uniform1i(floatTextureLocation, 0);
 gl.uniform1i(regularTextureLocation, 1);
 gl.uniform1f(gammaLocation, toneMapGamma);
 gl.uniform1i(precisionModeLocation, precisionLevelParam);  // Use float texture for visual demonstration

 // Draw result
 gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

 // MORE STATE POISONING: Final capability churn
 for (let i = 0; i < 5; i++) {
   capabilities.forEach(cap => {
     gl.enable(cap);
     gl.disable(cap);
   });
 }

 // FINAL TEXTURE UNIT MANAGEMENT: Stress texture binding
 gl.activeTexture(gl.TEXTURE2);
 gl.bindTexture(gl.TEXTURE_2D, floatTexture);
 gl.activeTexture(gl.TEXTURE3);
 gl.bindTexture(gl.TEXTURE_2D, regularTexture);
 gl.activeTexture(gl.TEXTURE0);
 gl.bindTexture(gl.TEXTURE_2D, null);
 gl.activeTexture(gl.TEXTURE1);
 gl.bindTexture(gl.TEXTURE_2D, null);

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
 throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 // If the error string contains "UNSUPPORTED_EXTENSIONS", the Python runner
 // knows to log it to UNSUPPORTED.md and skip.
 // Otherwise, it counts as a test failure/crash.
 console.error(err); // Allowed for debugging, but DOM update is primary signal
});
</script>
</body>
</html>

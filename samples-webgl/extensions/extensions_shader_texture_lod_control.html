<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
 'EXT_shader_texture_lod'
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2');
 if (!gl) {
   // Try WebGL1 with extension fallback
   const gl1 = canvas.getContext('webgl');
   if (!gl1) throw new Error("WebGL not supported");

   // Check for EXT_shader_texture_lod extension
   const ext = gl1.getExtension('EXT_shader_texture_lod');
   if (!ext) {
     throw new Error("UNSUPPORTED_EXTENSIONS: EXT_shader_texture_lod");
   }
   throw new Error("UNSUPPORTED_EXTENSIONS: EXT_shader_texture_lod (WebGL2 required for reliable textureLod support)");
 }

 // WebGL2 confirmed available
 console.log("WebGL2 context acquired successfully");

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // Configuration for fuzzing exposure
 const textureSize = 256;
 const lodLevels = 8;
 const lodBias = 1.5;
 const textureFiltering = gl.LINEAR_MIPMAP_LINEAR;
 const stateChangeCount = 25;
 const vertexDensity = 32;

 // State poisoning - capability churn
 for (let i = 0; i < stateChangeCount; i++) {
   gl.enable(gl.BLEND);
   gl.disable(gl.CULL_FACE);
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.SCISSOR_TEST);
   gl.enable(gl.STENCIL_TEST);
   gl.disable(gl.POLYGON_OFFSET_FILL);
   gl.enable(gl.SAMPLE_COVERAGE);
 }

 // Create vertex shader
 const vertexShader = gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vertexShader, `#version 300 es
   in vec2 a_position;
   in vec2 a_texCoord;
   out vec2 v_texCoord;
   void main() {
     gl_Position = vec4(a_position, 0.0, 1.0);
     v_texCoord = a_texCoord;
   }
 `);
 gl.compileShader(vertexShader);
 if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
   throw new Error('Vertex shader compilation failed: ' + gl.getShaderInfoLog(vertexShader));
 }

 // Create complex fragment shader using textureLod (WebGL2 core feature)
 const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fragmentShader, `#version 300 es
   precision mediump float;
   uniform sampler2D u_texture;
   uniform float u_lodBias;
   uniform float u_time;
   in vec2 v_texCoord;
   out vec4 fragColor;

   void main() {
     // Calculate LOD based on distance from center
     vec2 center = vec2(0.5, 0.5);
     float distance = length(v_texCoord - center);
     float lod = distance * 8.0 + u_lodBias;

     // Sample texture with explicit LOD control (WebGL2 core)
     vec4 color = textureLod(u_texture, v_texCoord, lod);

     // Apply complex mathematical operations for visual complexity
     color.r = sin(color.r * 3.14159 + u_time) * 0.5 + 0.5;
     color.g = cos(color.g * 2.0 + distance * 6.28) * 0.5 + 0.5;
     color.b = fract(color.b + lod * 0.1);

     // Mix with procedural patterns based on LOD
     float pattern = sin(v_texCoord.x * 50.0) * cos(v_texCoord.y * 50.0);
     color.rgb = mix(color.rgb, vec3(pattern * 0.5 + 0.5), 0.3);

     fragColor = color;
   }
 `);
 gl.compileShader(fragmentShader);
 if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
   const errorLog = gl.getShaderInfoLog(fragmentShader);
   console.error('Fragment shader compilation failed:', errorLog);
   throw new Error('Fragment shader compilation failed: ' + errorLog);
 }

 // Create program
 const program = gl.createProgram();
 gl.attachShader(program, vertexShader);
 gl.attachShader(program, fragmentShader);
 gl.linkProgram(program);
 if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
   const errorLog = gl.getProgramInfoLog(program);
   console.error('Program linking failed:', errorLog);
   throw new Error('Program linking failed: ' + errorLog);
 }
 gl.useProgram(program);

 // Get attribute locations
 const positionLocation = gl.getAttribLocation(program, 'a_position');
 const texCoordLocation = gl.getAttribLocation(program, 'a_texCoord');

 // Get uniform locations
 const textureLocation = gl.getUniformLocation(program, 'u_texture');
 const lodBiasLocation = gl.getUniformLocation(program, 'u_lodBias');
 const timeLocation = gl.getUniformLocation(program, 'u_time');

 // Create mipmapped texture with multiple LOD levels
 const texture = gl.createTexture();
 gl.bindTexture(gl.TEXTURE_2D, texture);

 // Generate base level texture data
 const textureData = new Uint8Array(textureSize * textureSize * 4);
 for (let i = 0; i < textureData.length; i += 4) {
   const x = (i / 4) % textureSize;
   const y = Math.floor((i / 4) / textureSize);
   // Create checkerboard pattern
   const check = ((x >> 4) + (y >> 4)) % 2;
   textureData[i] = check ? 255 : 0;     // R
   textureData[i + 1] = check ? 0 : 255; // G
   textureData[i + 2] = 128;             // B
   textureData[i + 3] = 255;             // A
 }

 // Upload base level
 gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureSize, textureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, textureData);

 // Generate mipmaps manually for explicit control
 for (let level = 1; level < lodLevels; level++) {
   const levelSize = textureSize >> level;
   if (levelSize < 1) break;

   const levelData = new Uint8Array(levelSize * levelSize * 4);
   for (let i = 0; i < levelData.length; i += 4) {
     const x = (i / 4) % levelSize;
     const y = Math.floor((i / 4) / levelSize);
     // Create different pattern for each mipmap level
     const intensity = 255 * (1.0 - level / lodLevels);
     levelData[i] = intensity;     // R
     levelData[i + 1] = 0;         // G
     levelData[i + 2] = intensity; // B
     levelData[i + 3] = 255;       // A
   }
   gl.texImage2D(gl.TEXTURE_2D, level, gl.RGBA, levelSize, levelSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, levelData);
 }

 // Set texture parameters
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, textureFiltering);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

 // More state poisoning - texture binding churn
 for (let i = 0; i < 10; i++) {
   gl.bindTexture(gl.TEXTURE_2D, texture);
   gl.bindTexture(gl.TEXTURE_2D, null);
 }
 gl.bindTexture(gl.TEXTURE_2D, texture);

 // Create geometry - dense grid for complex shader stress
 const positions = [];
 const texCoords = [];
 const indices = [];

 for (let y = 0; y <= vertexDensity; y++) {
   for (let x = 0; x <= vertexDensity; x++) {
     const u = x / vertexDensity;
     const v = y / vertexDensity;
     positions.push(u * 2 - 1, v * 2 - 1);
     texCoords.push(u, v);
   }
 }

 for (let y = 0; y < vertexDensity; y++) {
   for (let x = 0; x < vertexDensity; x++) {
     const i = y * (vertexDensity + 1) + x;
     indices.push(i, i + 1, i + vertexDensity + 1);
     indices.push(i + 1, i + vertexDensity + 2, i + vertexDensity + 1);
   }
 }

 // Create buffers
 const positionBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

 const texCoordBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(texCoords), gl.STATIC_DRAW);

 const indexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

 // More state poisoning - buffer binding churn
 for (let i = 0; i < 8; i++) {
   gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
   gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
   gl.bindBuffer(gl.ARRAY_BUFFER, null);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
 }

 // Set up attributes
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.enableVertexAttribArray(positionLocation);
 gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

 gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
 gl.enableVertexAttribArray(texCoordLocation);
 gl.vertexAttribPointer(texCoordLocation, 2, gl.FLOAT, false, 0, 0);

 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

 // Set uniforms
 gl.uniform1i(textureLocation, 0);
 gl.uniform1f(lodBiasLocation, lodBias);
 gl.uniform1f(timeLocation, performance.now() * 0.001);

 // Viewport changes for state poisoning
 gl.viewport(0, 0, canvas.width, canvas.height);
 gl.viewport(10, 10, canvas.width - 20, canvas.height - 20);
 gl.viewport(0, 0, canvas.width, canvas.height);

 // Final state poisoning - blend state changes
 gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
 gl.blendEquation(gl.FUNC_ADD);
 gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE);
 gl.blendEquationSeparate(gl.FUNC_ADD, gl.FUNC_ADD);

 // Clear and draw
 gl.clearColor(0.1, 0.1, 0.1, 1.0);
 gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

 // Draw with complex shader using texture2DLod
 gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // Error checking
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
   throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 console.error(err);
});
</script>
</body>
</html>

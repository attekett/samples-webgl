<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
// CONFIGURATION: WebGL2-only test, no extensions needed for core texture functionality
const REQUIRED_EXTENSIONS = [
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 // ALWAYS use WebGL2 context - no fallback to WebGL1
 const gl = canvas.getContext('webgl2');
 if (!gl) {
 throw new Error("WebGL2 not supported - required for all tests");
 }

 // 1. EXTENSION GATING (WebGL2 core features, no extensions needed)
 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS (none for this test)
 REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // FUZZING VARIABLES: Expose parameters for mutation testing
 const TEXTURE_SIZE_TESTS = 8;
 const STATE_CHANGE_COUNT = 50;
 const RESOURCE_BINDING_CYCLES = 8;
 const INVALID_OPERATION_ATTEMPTS = 16;

 // Create shader programs for visual feedback
 const vertexShaderSource = `#version 300 es
 in vec2 a_position;
 in vec3 a_color;
 out vec3 v_color;
 void main() {
   gl_Position = vec4(a_position, 0.0, 1.0);
   v_color = a_color;
 }
 `;

 const fragmentShaderSource = `#version 300 es
 precision mediump float;
 in vec3 v_color;
 out vec4 fragColor;
 void main() {
   fragColor = vec4(v_color, 1.0);
 }
 `;

 function createShaderProgram(vsSource, fsSource) {
   const vertexShader = gl.createShader(gl.VERTEX_SHADER);
   gl.shaderSource(vertexShader, vsSource);
   gl.compileShader(vertexShader);

   const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
   gl.shaderSource(fragmentShader, fsSource);
   gl.compileShader(fragmentShader);

   const program = gl.createProgram();
   gl.attachShader(program, vertexShader);
   gl.attachShader(program, fragmentShader);
   gl.linkProgram(program);
   return program;
 }

 const program = createShaderProgram(vertexShaderSource, fragmentShaderSource);

 // Create vertex data for 3x3 grid visualization
 const vertices = new Float32Array([
   // Row 0: Size limit test results
   -0.9, 0.9, 1.0, 0.0, 0.0,   // Red: MAX_TEXTURE_SIZE tests
   -0.3, 0.9, 1.0, 0.0, 0.0,
   0.3, 0.9, 1.0, 0.0, 0.0,
   0.9, 0.9, 1.0, 0.0, 0.0,

   // Row 1: Cube map size limits
   -0.9, 0.3, 0.0, 1.0, 0.0,   // Green: MAX_CUBE_MAP_TEXTURE_SIZE tests
   -0.3, 0.3, 0.0, 1.0, 0.0,
   0.3, 0.3, 0.0, 1.0, 0.0,
   0.9, 0.3, 0.0, 1.0, 0.0,

   // Row 2: Format and size combinations
   -0.9, -0.3, 0.0, 0.0, 1.0,  // Blue: Format/size boundary tests
   -0.3, -0.3, 0.0, 0.0, 1.0,
   0.3, -0.3, 0.0, 0.0, 1.0,
   0.9, -0.3, 0.0, 0.0, 1.0,

   // Row 3: Boundary condition results
   -0.9, -0.9, 1.0, 1.0, 0.0,  // Yellow: Edge case validations
   -0.3, -0.9, 1.0, 1.0, 0.0,
   0.3, -0.9, 1.0, 1.0, 0.0,
   0.9, -0.9, 1.0, 1.0, 0.0
 ]);

 const indices = new Uint16Array([
   0, 1, 4, 5, 1, 2, 5, 6, 2, 3, 6, 7,
   4, 5, 8, 9, 5, 6, 9, 10, 6, 7, 10, 11,
   8, 9, 12, 13, 9, 10, 13, 14, 10, 11, 14, 15
 ]);

 const vao = gl.createVertexArray();
 gl.bindVertexArray(vao);

 const vertexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

 const positionLoc = gl.getAttribLocation(program, 'a_position');
 const colorLoc = gl.getAttribLocation(program, 'a_color');

 gl.enableVertexAttribArray(positionLoc);
 gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 20, 0);

 gl.enableVertexAttribArray(colorLoc);
 gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 20, 8);

 const indexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

 // Get WebGL limits
 const maxTextureSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
 const maxCubeMapTextureSize = gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE);

 // Create textures for size limit testing
 const textures = [];
 for (let i = 0; i < TEXTURE_SIZE_TESTS; i++) {
   textures.push(gl.createTexture());
 }

 // STATE POISONING: Heavy capability enable/disable operations
 for (let i = 0; i < STATE_CHANGE_COUNT; i++) {
   gl.enable(gl.BLEND);
   gl.disable(gl.BLEND);
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.DEPTH_TEST);
   gl.enable(gl.CULL_FACE);
   gl.disable(gl.CULL_FACE);

   // Texture unit binding churn
   gl.activeTexture(gl.TEXTURE0 + (i % 16));
   gl.bindTexture(gl.TEXTURE_2D, textures[i % TEXTURE_SIZE_TESTS]);

   // Sampler parameter changes
   gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
   gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
   gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
   gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
 }

 // TEXTURE SIZE LIMIT TESTS
 // Test 1: Maximum supported texture size
 gl.activeTexture(gl.TEXTURE0);
 gl.bindTexture(gl.TEXTURE_2D, textures[0]);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
 try {
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, maxTextureSize, maxTextureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
 } catch (e) {
   // Expected error - size too large
 }

 // Test 2: Size just under maximum
 gl.activeTexture(gl.TEXTURE1);
 gl.bindTexture(gl.TEXTURE_2D, textures[1]);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
 try {
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, maxTextureSize - 1, maxTextureSize - 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
 } catch (e) {
   // Should work
 }

 // Test 3: Cube map maximum size
 gl.activeTexture(gl.TEXTURE2);
 gl.bindTexture(gl.TEXTURE_CUBE_MAP, textures[2]);
 gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
 try {
   for (let face = 0; face < 6; face++) {
     gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + face, 0, gl.RGBA, maxCubeMapTextureSize, maxCubeMapTextureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
   }
 } catch (e) {
   // Expected error - cube map size too large
 }

 // Test 4: Cube map size under maximum
 gl.activeTexture(gl.TEXTURE3);
 gl.bindTexture(gl.TEXTURE_CUBE_MAP, textures[3]);
 gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
 try {
   for (let face = 0; face < 6; face++) {
     gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + face, 0, gl.RGBA, maxCubeMapTextureSize - 1, maxCubeMapTextureSize - 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
   }
 } catch (e) {
   // Should work
 }

 // Test 5: Non-power-of-two large texture
 gl.activeTexture(gl.TEXTURE4);
 gl.bindTexture(gl.TEXTURE_2D, textures[4]);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
 try {
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2047, 2047, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
 } catch (e) {
   // May fail on some implementations
 }

 // Test 6: Very small texture (1x1)
 gl.activeTexture(gl.TEXTURE5);
 gl.bindTexture(gl.TEXTURE_2D, textures[5]);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
 try {
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
 } catch (e) {
   // Should work
 }

 // Test 7: Zero-sized texture (invalid)
 gl.activeTexture(gl.TEXTURE6);
 gl.bindTexture(gl.TEXTURE_2D, textures[6]);
 try {
   gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
 } catch (e) {
   // Expected error - invalid dimensions
 }

 // Test 8: Texture with mipmap levels approaching size limits
 gl.activeTexture(gl.TEXTURE7);
 gl.bindTexture(gl.TEXTURE_2D, textures[7]);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
 let size = 512;
 let level = 0;
 try {
   while (size > 0) {
     gl.texImage2D(gl.TEXTURE_2D, level, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
     size = size >> 1;
     level++;
     if (level > 10) break; // Prevent infinite loop
   }
 } catch (e) {
   // Expected error when size limits exceeded
 }

 // RESOURCE BINDING CHURN: Heavy texture binding/unbinding cycles
 for (let cycle = 0; cycle < RESOURCE_BINDING_CYCLES; cycle++) {
   for (let i = 0; i < TEXTURE_SIZE_TESTS; i++) {
     gl.activeTexture(gl.TEXTURE0 + i);
     gl.bindTexture(gl.TEXTURE_2D, textures[i]);
     gl.bindTexture(gl.TEXTURE_2D, null);
     gl.bindTexture(gl.TEXTURE_CUBE_MAP, textures[i]);
     gl.bindTexture(gl.TEXTURE_CUBE_MAP, null);
   }
 }

 // INVALID OPERATION ATTEMPTS: Try various invalid size operations
 for (let attempt = 0; attempt < INVALID_OPERATION_ATTEMPTS; attempt++) {
   gl.activeTexture(gl.TEXTURE0);
   gl.bindTexture(gl.TEXTURE_2D, textures[attempt % TEXTURE_SIZE_TESTS]);

   // Try invalid size combinations
   try {
     gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, -1, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
   } catch (e) {
     // Expected error - negative width
   }
   try {
     gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, -1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
   } catch (e) {
     // Expected error - negative height
   }
   try {
     gl.texImage2D(gl.TEXTURE_2D, -1, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
   } catch (e) {
     // Expected error - negative level
   }
 }

 // FINAL STATE POISONING: More capability and state changes
 for (let i = 0; i < STATE_CHANGE_COUNT / 2; i++) {
   gl.enable(gl.BLEND);
   gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
   gl.disable(gl.BLEND);

   gl.enable(gl.DEPTH_TEST);
   gl.depthFunc(gl.LESS);
   gl.disable(gl.DEPTH_TEST);

   // Viewport changes
   gl.viewport(0, 0, 256, 256);
   gl.viewport(10, 10, 236, 236);

   // Scissor changes
   gl.enable(gl.SCISSOR_TEST);
   gl.scissor(0, 0, 256, 256);
   gl.disable(gl.SCISSOR_TEST);
 }

 // Render the visual feedback grid
 gl.useProgram(program);
 gl.bindVertexArray(vao);
 gl.clearColor(0.1, 0.1, 0.1, 1.0);
 gl.clear(gl.COLOR_BUFFER_BIT);

 gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
 throw new Error(`WebGL Error: ${error}`);
 }
}

// No catch block - let any real errors bubble up naturally
</script>

     gl.bindBuffer(gl.ARRAY_BUFFER, null);
 }

 // Resource binding cycles for additional state poisoning
 for (let cycle = 0; cycle < RESOURCE_BINDING_CYCLES; cycle++) {
     gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
     gl.bindBuffer(gl.ARRAY_BUFFER, null);
     gl.useProgram(program);
     gl.useProgram(null);
 }

 // Invalid operation attempts (should not crash, just generate errors)
 // Temporarily disabled to debug linking issues
 /*
 for (let attempt = 0; attempt < INVALID_OPERATION_ATTEMPTS; attempt++) {
     // Try to draw with invalid state (disabled vertex arrays, etc.)
     gl.disableVertexAttribArray(0);
     gl.drawArrays(gl.POINTS, 0, 10);
     gl.enableVertexAttribArray(0);
 }
 */

 // Final rendering setup
 gl.enable(gl.BLEND);
 gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
 gl.disable(gl.CULL_FACE);
 gl.enable(gl.DEPTH_TEST);
 gl.depthFunc(gl.LESS);
 gl.viewport(0, 0, 256, 256);

 // Render the complex geometry
 gl.clearColor(0.1, 0.1, 0.1, 1.0);
 gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
 gl.drawArrays(gl.POINTS, 0, VERTEX_COUNT);

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
    throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 // If the error string contains "UNSUPPORTED_EXTENSIONS", the Python runner
 // knows to log it to UNSUPPORTED.md and skip.
 // Otherwise, it counts as a test failure/crash.
 console.error(err); // Allowed for debugging, but DOM update is primary signal
});

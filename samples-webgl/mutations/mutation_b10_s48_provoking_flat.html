<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vertexCount = 18;
    const primitiveCount = 6;
    const colorIndex = 3;
    const bufferSize = vertexCount * 24;
    const triangleSize = 3;

    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const primitiveMode = gl.TRIANGLES;
    const provokingMode = gl.FIRST_VERTEX_CONVENTION;

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        const vertices = new Float32Array(vertexCount * 6);
        for (let i = 0; i < primitiveCount; i++) {
            const baseIdx = i * triangleSize * 6;
            const row = Math.floor(i / 3);
            const col = i % 3;
            const x = col * 0.6 - 0.6;
            const y = row * 0.6 - 0.3;
            vertices[baseIdx + 0] = x;
            vertices[baseIdx + 1] = y;
            vertices[baseIdx + 2] = 0.0;
            vertices[baseIdx + 3] = 1.0;
            vertices[baseIdx + 4] = 0.0;
            vertices[baseIdx + 5] = 0.0;
            vertices[baseIdx + 6] = x + 0.4;
            vertices[baseIdx + 7] = y;
            vertices[baseIdx + 8] = 0.0;
            vertices[baseIdx + 9] = 0.0;
            vertices[baseIdx + 10] = 1.0;
            vertices[baseIdx + 11] = 0.0;
            vertices[baseIdx + 12] = x + 0.2;
            vertices[baseIdx + 13] = y + 0.4;
            vertices[baseIdx + 14] = 0.0;
            vertices[baseIdx + 15] = 0.0;
            vertices[baseIdx + 16] = 0.0;
            vertices[baseIdx + 17] = 1.0;
        }
        gl.bufferData(bufferTarget, vertices, bufferUsage);
        gl.bufferSubData(bufferTarget, 0, new Float32Array([0.0, 0.0, 0.0]));
    } catch(e) {}

    try {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(vertexShader, `#version 300 es
            in vec3 position;
            in vec3 color;
            flat out vec3 vColor;
            void main() {
                gl_Position = vec4(position, 1.0);
                vColor = color;
            }
        `);
        gl.shaderSource(fragmentShader, `#version 300 es
            precision highp float;
            flat in vec3 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(vColor, 1.0);
            }
        `);
        gl.compileShader(vertexShader);
        gl.compileShader(fragmentShader);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.bindAttribLocation(program, 0, 'position');
        gl.bindAttribLocation(program, 1, 'color');
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.enableVertexAttribArray(0);
        gl.enableVertexAttribArray(1);
        gl.disableVertexAttribArray(0);
        gl.disableVertexAttribArray(1);
        gl.enableVertexAttribArray(0);
        gl.enableVertexAttribArray(1);
    } catch(e) {}

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 12);
    } catch(e) {}

    try {
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.clearColor(0.05, 0.05, 0.05, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.depthMask(true);
    } catch(e) {}

    try {
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        gl.frontFace(gl.CCW);
    } catch(e) {}

    try {
        gl.drawArrays(primitiveMode, 0, vertexCount);
        gl.drawArrays(primitiveMode, 0, 9);
        gl.drawArrays(primitiveMode, 9, 9);
        gl.drawArrays(primitiveMode, 0, vertexCount);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

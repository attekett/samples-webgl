<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const structCount = 16;
const arraySize = 32;
const paddingBytes = 12;
const uniformCount = 64;
const structStride = structCount * 4;
const totalArrayElements = arraySize * 2;

const UNIFORM_BUFFER = 35345;
const UNIFORM_BLOCK_BINDING = 35391;
const ACTIVE_UNIFORMS = 35718;
const STATIC_DRAW = 35044;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const ubo1 = gl.createBuffer();
        const ubo2 = gl.createBuffer();
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bindBuffer(UNIFORM_BUFFER, ubo2);
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bufferData(UNIFORM_BUFFER, 8192, STATIC_DRAW);
        gl.bufferData(UNIFORM_BUFFER, 16384, STATIC_DRAW);
    } catch(e) {}

    try {
        const data1 = new Float32Array(arraySize * 4);
        for (let i = 0; i < arraySize; i++) {
            data1[i * 4 + 0] = i;
            data1[i * 4 + 1] = i * 2;
            data1[i * 4 + 2] = i * 3;
            data1[i * 4 + 3] = i * 4;
        }
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bufferSubData(UNIFORM_BUFFER, 0, data1);
        gl.bufferSubData(UNIFORM_BUFFER, 512, new Float32Array(64));
        gl.bufferSubData(UNIFORM_BUFFER, 1024, new Float32Array(128));
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            struct LightData {
                vec4 position;
                vec4 color;
                vec2 params;
                float intensity;
                float padding;
            };
            layout(std140) uniform LightBlock {
                LightData lights[16];
                vec4 ambient;
                mat4 matrices[4];
            } lightBlock;
            in vec3 position;
            void main() {
                vec4 pos = vec4(position, 1.0);
                pos += lightBlock.lights[0].position;
                pos = lightBlock.matrices[0] * pos;
                gl_Position = pos;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            struct Material {
                vec4 diffuse;
                vec4 specular;
                vec2 texCoord;
                float shininess;
                float padding;
            };
            layout(std140) uniform MaterialBlock {
                Material materials[32];
                vec4 globalTint;
            } materialBlock;
            out vec4 fragColor;
            void main() {
                fragColor = materialBlock.materials[0].diffuse + materialBlock.globalTint;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const ubo3 = gl.createBuffer();
        const ubo4 = gl.createBuffer();
        const ubo5 = gl.createBuffer();
        gl.bindBuffer(UNIFORM_BUFFER, ubo3);
        gl.bufferData(UNIFORM_BUFFER, 4096, STATIC_DRAW);
        gl.bindBuffer(UNIFORM_BUFFER, ubo4);
        gl.bufferData(UNIFORM_BUFFER, 8192, STATIC_DRAW);
        gl.bindBuffer(UNIFORM_BUFFER, ubo5);
        gl.bufferData(UNIFORM_BUFFER, 2048, STATIC_DRAW);
    } catch(e) {}

    try {
        const lightBlockIndex = gl.getUniformBlockIndex(program, 'LightBlock');
        const materialBlockIndex = gl.getUniformBlockIndex(program, 'MaterialBlock');
        gl.uniformBlockBinding(program, lightBlockIndex, 0);
        gl.uniformBlockBinding(program, materialBlockIndex, 1);
        gl.uniformBlockBinding(program, lightBlockIndex, 2);
        gl.uniformBlockBinding(program, materialBlockIndex, 3);
    } catch(e) {}

    try {
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.bindBufferBase(UNIFORM_BUFFER, 1, ubo2);
        gl.bindBufferBase(UNIFORM_BUFFER, 2, ubo3);
        gl.bindBufferBase(UNIFORM_BUFFER, 3, ubo4);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo5);
    } catch(e) {}

    try {
        const nestedData = new Float32Array(uniformCount * 4);
        for (let i = 0; i < uniformCount; i++) {
            nestedData[i * 4 + 0] = Math.sin(i);
            nestedData[i * 4 + 1] = Math.cos(i);
            nestedData[i * 4 + 2] = Math.tan(i);
            nestedData[i * 4 + 3] = 1.0;
        }
        gl.bindBuffer(UNIFORM_BUFFER, ubo2);
        gl.bufferSubData(UNIFORM_BUFFER, 0, nestedData);
        gl.bufferSubData(UNIFORM_BUFFER, 2048, new Float32Array(256));
    } catch(e) {}

    try {
        gl.clearColor(0.1, 0.2, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.bindBufferBase(UNIFORM_BUFFER, 1, ubo2);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.deleteBuffer(ubo1);
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bufferData(UNIFORM_BUFFER, 1024, STATIC_DRAW);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

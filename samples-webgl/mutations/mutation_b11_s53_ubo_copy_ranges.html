<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const copySize = 1024;
const srcOffset = 0;
const dstOffset = 512;
const rangeCount = 8;
const totalCopyBytes = copySize * rangeCount;
const bufferCapacity = copySize * 16;

const COPY_READ_BUFFER = 36662;
const COPY_WRITE_BUFFER = 36663;
const UNIFORM_BUFFER = 35345;
const STATIC_DRAW = 35044;
const DYNAMIC_DRAW = 35048;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const srcBuffer = gl.createBuffer();
        const dstBuffer = gl.createBuffer();
        const auxBuffer = gl.createBuffer();
        gl.bindBuffer(COPY_READ_BUFFER, srcBuffer);
        gl.bindBuffer(COPY_WRITE_BUFFER, dstBuffer);
        gl.bindBuffer(COPY_READ_BUFFER, auxBuffer);
        gl.bufferData(COPY_READ_BUFFER, bufferCapacity, STATIC_DRAW);
        gl.bindBuffer(COPY_WRITE_BUFFER, srcBuffer);
        gl.bufferData(COPY_WRITE_BUFFER, 8192, DYNAMIC_DRAW);
    } catch(e) {}

    try {
        const initData = new Float32Array(2048);
        for (let i = 0; i < 2048; i++) {
            initData[i] = i * 0.01;
        }
        gl.bindBuffer(COPY_READ_BUFFER, srcBuffer);
        gl.bufferSubData(COPY_READ_BUFFER, 0, initData);
        gl.bufferSubData(COPY_READ_BUFFER, 4096, new Float32Array(512));
    } catch(e) {}

    try {
        gl.bindBuffer(COPY_READ_BUFFER, srcBuffer);
        gl.bindBuffer(COPY_WRITE_BUFFER, dstBuffer);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, srcOffset, dstOffset, copySize);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, 256, 768, 512);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, 1024, 0, 1024);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, 0, 2048, copySize);
    } catch(e) {}

    try {
        const ubo1 = gl.createBuffer();
        const ubo2 = gl.createBuffer();
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bufferData(UNIFORM_BUFFER, 4096, STATIC_DRAW);
        gl.bindBuffer(UNIFORM_BUFFER, ubo2);
        gl.bufferData(UNIFORM_BUFFER, 8192, DYNAMIC_DRAW);
    } catch(e) {}

    try {
        gl.bindBuffer(COPY_READ_BUFFER, srcBuffer);
        gl.bindBuffer(COPY_WRITE_BUFFER, ubo1);
        for (let i = 0; i < rangeCount; i++) {
            gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, i * copySize, i * 256, 256);
        }
    } catch(e) {}

    try {
        gl.bindBuffer(COPY_READ_BUFFER, ubo1);
        gl.bindBuffer(COPY_WRITE_BUFFER, ubo2);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, 0, dstOffset, copySize);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, copySize, 1536, 512);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, 512, 3072, copySize);
    } catch(e) {}

    try {
        gl.bindBuffer(COPY_READ_BUFFER, dstBuffer);
        gl.bindBuffer(COPY_WRITE_BUFFER, srcBuffer);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, dstOffset, srcOffset, copySize);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, 1024, 2048, 1024);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, 0, 4096, 512);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            layout(std140) uniform DataBlock {
                vec4 values[256];
            } dataBlock;
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0) + dataBlock.values[0];
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.5, 0.7, 0.9, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindBuffer(COPY_READ_BUFFER, srcBuffer);
        gl.deleteBuffer(srcBuffer);
        gl.bindBuffer(COPY_READ_BUFFER, srcBuffer);
        gl.bindBuffer(COPY_WRITE_BUFFER, dstBuffer);
        gl.copyBufferSubData(COPY_READ_BUFFER, COPY_WRITE_BUFFER, 0, 0, 512);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const mapSize = 2048;
const mapOffset = 0;
const flushSize = 512;
const unmapCount = 4;
const totalMapSize = mapSize * 2;
const flushStride = flushSize * 2;

const UNIFORM_BUFFER = 35345;
const MAP_READ_BIT = 1;
const MAP_WRITE_BIT = 2;
const STATIC_DRAW = 35044;
const DYNAMIC_DRAW = 35048;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const ubo1 = gl.createBuffer();
        const ubo2 = gl.createBuffer();
        const ubo3 = gl.createBuffer();
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bindBuffer(UNIFORM_BUFFER, ubo2);
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.bufferData(UNIFORM_BUFFER, totalMapSize, DYNAMIC_DRAW);
        gl.bufferData(UNIFORM_BUFFER, 8192, STATIC_DRAW);
    } catch(e) {}

    try {
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        const mapped1 = gl.mapBufferRange(UNIFORM_BUFFER, mapOffset, mapSize, MAP_WRITE_BIT);
        if (mapped1) {
            const view = new Float32Array(mapped1);
            for (let i = 0; i < view.length; i++) {
                view[i] = i * 0.01;
            }
            gl.unmapBuffer(UNIFORM_BUFFER);
        }
        gl.bufferSubData(UNIFORM_BUFFER, 0, new Float32Array(512));
    } catch(e) {}

    try {
        gl.bindBuffer(UNIFORM_BUFFER, ubo2);
        gl.bufferData(UNIFORM_BUFFER, 4096, DYNAMIC_DRAW);
        const mapped2 = gl.mapBufferRange(UNIFORM_BUFFER, 0, flushSize, MAP_WRITE_BIT | gl.MAP_FLUSH_EXPLICIT_BIT);
        if (mapped2) {
            const view = new Float32Array(mapped2);
            for (let i = 0; i < view.length; i++) {
                view[i] = Math.sin(i);
            }
            gl.flushMappedBufferRange(UNIFORM_BUFFER, 0, flushSize);
            gl.unmapBuffer(UNIFORM_BUFFER);
        }
    } catch(e) {}

    try {
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        const mapped3 = gl.mapBufferRange(UNIFORM_BUFFER, mapOffset, mapSize, MAP_WRITE_BIT | gl.MAP_INVALIDATE_BUFFER_BIT);
        if (mapped3) {
            const view = new Float32Array(mapped3);
            for (let i = 0; i < view.length; i++) {
                view[i] = i * 2;
            }
            gl.unmapBuffer(UNIFORM_BUFFER);
        }
        const mapped4 = gl.mapBufferRange(UNIFORM_BUFFER, 1024, 1024, MAP_WRITE_BIT);
        if (mapped4) {
            gl.unmapBuffer(UNIFORM_BUFFER);
        }
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            layout(std140) uniform DataBlock {
                vec4 values[256];
            } dataBlock;
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0) + dataBlock.values[0];
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.9, 0.5, 0.3, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        for (let i = 0; i < unmapCount; i++) {
            gl.bindBuffer(UNIFORM_BUFFER, ubo1);
            const mapped = gl.mapBufferRange(UNIFORM_BUFFER, i * flushSize, flushSize, MAP_WRITE_BIT | gl.MAP_FLUSH_EXPLICIT_BIT);
            if (mapped) {
                const view = new Float32Array(mapped);
                view[0] = i;
                gl.flushMappedBufferRange(UNIFORM_BUFFER, 0, flushSize);
                gl.unmapBuffer(UNIFORM_BUFFER);
            }
        }
    } catch(e) {}

    try {
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.bindBufferBase(UNIFORM_BUFFER, 1, ubo2);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo2);
        gl.bindBufferBase(UNIFORM_BUFFER, 1, ubo1);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
    } catch(e) {}

    try {
        gl.clearColor(0.4, 0.4, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindBufferBase(UNIFORM_BUFFER, 0, ubo2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        gl.deleteBuffer(ubo1);
        gl.bindBuffer(UNIFORM_BUFFER, ubo1);
        const mapped5 = gl.mapBufferRange(UNIFORM_BUFFER, 0, 512, MAP_WRITE_BIT);
        if (mapped5) {
            gl.unmapBuffer(UNIFORM_BUFFER);
        }
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

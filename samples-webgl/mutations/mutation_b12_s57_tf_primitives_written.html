<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const queryCount = 4;
const primitiveCount = 256;
const overflowThreshold = 512;
const vertexStride = 16;
const bufferMultiplier = 4;

const tfPrimitivesWritten = 0x8C88;
const queryResult = 0x8866;
const queryResultAvailable = 0x8867;
const tfBuffer = 0x8C8E;
const streamDraw = 0x88E0;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const query1 = gl.createQuery();
        const query2 = gl.createQuery();
        const query3 = gl.createQuery();
        const query4 = gl.createQuery();
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, primitiveCount * vertexStride * bufferMultiplier, streamDraw);
    } catch(e) {}

    try {
        const tfBuf1 = gl.createBuffer();
        const tfBuf2 = gl.createBuffer();
        const tfBuf3 = gl.createBuffer();
        gl.bindBuffer(tfBuffer, tfBuf1);
        gl.bindBuffer(tfBuffer, tfBuf2);
        gl.bindBuffer(tfBuffer, tfBuf1);
        gl.bufferData(tfBuffer, primitiveCount * 32, streamDraw);
        gl.bindBuffer(tfBuffer, tfBuf3);
        gl.bufferData(tfBuffer, overflowThreshold * 16, streamDraw);
        gl.bindBuffer(tfBuffer, tfBuf2);
        gl.bufferData(tfBuffer, 8192, streamDraw);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec4 aPos;
            out vec4 vData;
            void main() {
                vData = aPos + vec4(0.5);
                gl_Position = aPos;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.0, 1.0, 0.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vData'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const vertexData = new Float32Array(primitiveCount * 4);
        for (let i = 0; i < vertexData.length; i++) {
            vertexData[i] = Math.random() * 2.0 - 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, vertexStride, 0);
        gl.enableVertexAttribArray(0);
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBuffer, 0, tfBuf1);
        gl.bindBufferBase(tfBuffer, 1, tfBuf2);
        gl.bindBufferBase(tfBuffer, 0, tfBuf1);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginQuery(tfPrimitivesWritten, query1);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, primitiveCount);
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitivesWritten);
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBuffer, 0, tfBuf2);
        gl.beginQuery(tfPrimitivesWritten, query2);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, 128);
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitivesWritten);
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBuffer, 0, tfBuf3);
        gl.beginQuery(tfPrimitivesWritten, query3);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, overflowThreshold);
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitivesWritten);
    } catch(e) {}

    try {
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

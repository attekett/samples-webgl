<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const bufferSize = 16384;
const vertexCount = 512;
const overflowFactor = 2;
const componentsPerVertex = 4;
const bytesPerFloat = 4;

const tfBufferTarget = 0x8C8E;
const streamDraw = 0x88E0;
const dynamicCopy = 0x88EA;
const interleavedAttribs = 0x8C8C;

async function main() {
    let buf1, buf2, buf3, tfBuf1, tfBuf2, tfBuf3, tfBuf4, tfBuf5, tfBuf6;
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        buf1 = gl.createBuffer();
        buf2 = gl.createBuffer();
        buf3 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, vertexCount * componentsPerVertex * bytesPerFloat, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        tfBuf1 = gl.createBuffer();
        tfBuf2 = gl.createBuffer();
        tfBuf3 = gl.createBuffer();
        tfBuf4 = gl.createBuffer();
        tfBuf5 = gl.createBuffer();
        tfBuf6 = gl.createBuffer();
        gl.bindBuffer(tfBufferTarget, tfBuf1);
        gl.bindBuffer(tfBufferTarget, tfBuf2);
        gl.bindBuffer(tfBufferTarget, tfBuf1);
        gl.bufferData(tfBufferTarget, bufferSize, streamDraw);
        gl.bindBuffer(tfBufferTarget, tfBuf3);
        gl.bufferData(tfBufferTarget, bufferSize * overflowFactor, dynamicCopy);
        gl.bindBuffer(tfBufferTarget, tfBuf2);
        gl.bufferData(tfBufferTarget, bufferSize, streamDraw);
        gl.bindBuffer(tfBufferTarget, tfBuf4);
        gl.bufferData(tfBufferTarget, bufferSize, streamDraw);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec4 aInput;
            out vec4 vOutput1;
            out vec4 vOutput2;
            void main() {
                vOutput1 = aInput * 1.5;
                vOutput2 = aInput + vec4(0.25);
                gl_Position = aInput;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.5, 0.5, 1.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vOutput1', 'vOutput2'], interleavedAttribs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const inputData = new Float32Array(vertexCount * componentsPerVertex);
        for (let i = 0; i < inputData.length; i++) {
            inputData[i] = (i % 2 === 0) ? 0.5 : -0.5;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, inputData, gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, componentsPerVertex, gl.FLOAT, false, 16, 0);
        gl.enableVertexAttribArray(0);
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBufferTarget, 0, tfBuf1);
        gl.bindBufferBase(tfBufferTarget, 1, tfBuf5);
        gl.bindBufferBase(tfBufferTarget, 0, tfBuf1);
        gl.bindBufferBase(tfBufferTarget, 2, tfBuf6);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, vertexCount);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBufferTarget, 0, tfBuf2);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, vertexCount);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBufferTarget, 0, tfBuf3);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, 256);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.bindBufferBase(tfBufferTarget, 0, tfBuf4);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, 128);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.deleteBuffer(tfBuf1);
        gl.isBuffer(tfBuf1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

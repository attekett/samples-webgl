<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const indexCount = 256;
const restartIndex = 65535;
const instanceCount = 4;
const vertexCount = 128;
const tfBufferSize = 8192;

const elementArrayBuffer = 0x8893;
const primitiveRestartFixedIndex = 0x8D69;
const tfTarget = 0x8C8E;
const streamCopy = 0x88E2;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vbo1 = gl.createBuffer();
        const vbo2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo1);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo2);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo1);
        gl.bufferData(gl.ARRAY_BUFFER, vertexCount * 16, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        const ibo1 = gl.createBuffer();
        const ibo2 = gl.createBuffer();
        const ibo3 = gl.createBuffer();
        gl.bindBuffer(elementArrayBuffer, ibo1);
        gl.bindBuffer(elementArrayBuffer, ibo2);
        gl.bindBuffer(elementArrayBuffer, ibo1);
        gl.bufferData(elementArrayBuffer, indexCount * 2, gl.STATIC_DRAW);
        gl.bindBuffer(elementArrayBuffer, ibo3);
        gl.bufferData(elementArrayBuffer, 1024, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        const tfBuf1 = gl.createBuffer();
        const tfBuf2 = gl.createBuffer();
        const tfBuf3 = gl.createBuffer();
        gl.bindBuffer(tfTarget, tfBuf1);
        gl.bindBuffer(tfTarget, tfBuf2);
        gl.bindBuffer(tfTarget, tfBuf1);
        gl.bufferData(tfTarget, tfBufferSize, streamCopy);
        gl.bindBuffer(tfTarget, tfBuf3);
        gl.bufferData(tfTarget, tfBufferSize * 2, streamCopy);
        gl.bindBuffer(tfTarget, tfBuf2);
        gl.bufferData(tfTarget, 4096, streamCopy);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec4 aPosition;
            out vec4 vTransformed;
            out float vVertexID;
            void main() {
                vTransformed = aPosition * 1.5;
                vVertexID = float(gl_VertexID);
                gl_Position = aPosition;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.8, 0.4, 0.2, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vTransformed', 'vVertexID'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const vertexData = new Float32Array(vertexCount * 4);
        for (let i = 0; i < vertexData.length; i += 4) {
            vertexData[i] = (i / vertexData.length) * 2.0 - 1.0;
            vertexData[i + 1] = Math.sin(i * 0.1);
            vertexData[i + 2] = Math.cos(i * 0.1);
            vertexData[i + 3] = 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo1);
        gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 16, 0);
        gl.enableVertexAttribArray(0);
    } catch(e) {}

    try {
        const indexData = new Uint16Array(indexCount);
        for (let i = 0; i < indexCount; i++) {
            if (i % 16 === 15) {
                indexData[i] = restartIndex;
            } else {
                indexData[i] = i % vertexCount;
            }
        }
        gl.bindBuffer(elementArrayBuffer, ibo1);
        gl.bufferData(elementArrayBuffer, indexData, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        gl.enable(primitiveRestartFixedIndex);
        gl.disable(primitiveRestartFixedIndex);
        gl.enable(primitiveRestartFixedIndex);
    } catch(e) {}

    try {
        gl.bindBufferBase(tfTarget, 0, tfBuf1);
        gl.bindBufferBase(tfTarget, 1, tfBuf2);
        gl.bindBufferBase(tfTarget, 0, tfBuf1);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawElements(gl.POINTS, indexCount, gl.UNSIGNED_SHORT, 0);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.bindBufferBase(tfTarget, 0, tfBuf2);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawElementsInstanced(gl.POINTS, 128, gl.UNSIGNED_SHORT, 0, instanceCount);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.bindBufferBase(tfTarget, 0, tfBuf3);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawElements(gl.POINTS, 64, gl.UNSIGNED_SHORT, 0);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.disable(primitiveRestartFixedIndex);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

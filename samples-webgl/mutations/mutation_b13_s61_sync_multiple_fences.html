<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const fenceCount = 8;
const timeoutNs = 1000000;
const flushCount = 4;
const drawCycles = 16;
const bufferSize = 4096;
const vertexCount = 6;

const bufferTarget = 34962;
const bufferUsage = 35044;
const syncCondition = 37143;
const flushBit = 1;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec2 position;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.8, 0.4, 0.2, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 2048, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        const sync1 = gl.fenceSync(syncCondition, 0);
        const sync2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const sync3 = gl.fenceSync(syncCondition, 0);
        gl.flush();
        gl.flush();
    } catch(e) {}

    try {
        const sync4 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const sync5 = gl.fenceSync(syncCondition, 0);
        const sync6 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        const sync7 = gl.fenceSync(syncCondition, 0);
        gl.flush();
    } catch(e) {}

    try {
        const sync8 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const sync9 = gl.fenceSync(syncCondition, 0);
        gl.clientWaitSync(sync8, flushBit, timeoutNs);
        gl.clientWaitSync(sync9, 0, 500000);
        gl.clientWaitSync(sync8, flushBit, 0);
    } catch(e) {}

    try {
        const sync10 = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(sync10);
        gl.deleteSync(sync10);
        const sync11 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.deleteSync(sync11);
    } catch(e) {}

    try {
        const syncA = gl.fenceSync(syncCondition, 0);
        const syncB = gl.fenceSync(syncCondition, 0);
        const syncC = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.flush();
        gl.flush();
        gl.clientWaitSync(syncA, flushBit, timeoutNs);
        gl.deleteSync(syncA);
        gl.clientWaitSync(syncB, 0, timeoutNs);
        gl.deleteSync(syncB);
    } catch(e) {}

    try {
        const syncD = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.flush();
        gl.clientWaitSync(syncD, flushBit, 0);
        gl.deleteSync(syncD);
    } catch(e) {}

    try {
        const syncE = gl.fenceSync(syncCondition, 0);
        const syncF = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(syncE);
        gl.deleteSync(syncF);
        const syncG = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.deleteSync(syncG);
        gl.deleteSync(syncG);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const waitCount = 8;
const drawCount = 16;
const fenceDelay = 4;
const vertexCount = 6;
const bufferSize = 3072;
const textureSize = 128;

const syncCondition = 37143;
const syncTimeout = 4294967295;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec2 pos;
            void main() {
                gl_Position = vec4(pos * 0.8, 0.0, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.6, 0.2, 0.8, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bufferData(gl.ARRAY_BUFFER, 1536, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
    } catch(e) {}

    try {
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureSize, textureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    } catch(e) {}

    try {
        const sync1 = gl.fenceSync(syncCondition, 0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.waitSync(sync1, 0, syncTimeout);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.flush();
        gl.deleteSync(sync1);
    } catch(e) {}

    try {
        const sync2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const sync3 = gl.fenceSync(syncCondition, 0);
        gl.waitSync(sync2, 0, syncTimeout);
        gl.waitSync(sync3, 0, syncTimeout);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.flush();
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        const sync4 = gl.fenceSync(syncCondition, 0);
        gl.waitSync(sync4, 0, syncTimeout);
        gl.waitSync(sync4, 0, syncTimeout);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.deleteSync(sync4);
    } catch(e) {}

    try {
        const sync5 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 24);
        gl.waitSync(sync5, 0, syncTimeout);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.waitSync(sync5, 0, syncTimeout);
        gl.flush();
        gl.deleteSync(sync5);
    } catch(e) {}

    try {
        const sync6 = gl.fenceSync(syncCondition, 0);
        const sync7 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.waitSync(sync6, 0, syncTimeout);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.waitSync(sync7, 0, syncTimeout);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.deleteSync(sync6);
        gl.deleteSync(sync7);
    } catch(e) {}

    try {
        const syncA = gl.fenceSync(syncCondition, 0);
        gl.waitSync(syncA, 0, syncTimeout);
        gl.deleteSync(syncA);
        gl.waitSync(syncA, 0, syncTimeout);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        const syncB = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const syncC = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(syncB);
        gl.deleteSync(syncC);
        gl.waitSync(syncB, 0, syncTimeout);
        gl.waitSync(syncC, 0, syncTimeout);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, 30);
        const syncD = gl.fenceSync(syncCondition, 0);
        gl.waitSync(syncD, 0, syncTimeout);
        gl.flush();
        gl.deleteSync(syncD);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const deleteCount = 8;
const recreateCount = 8;
const waitAttempts = 4;
const vertexCount = 6;
const bufferSize = 4096;
const drawCycles = 12;

const syncCondition = 37143;
const flushBit = 1;
const timeoutNs = 1000000;
const syncTimeout = 4294967295;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 vertPosition;
            void main() {
                gl_Position = vec4(vertPosition * 0.6, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.7, 0.3, 0.5, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer3);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        const sync1 = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(sync1);
        gl.deleteSync(sync1);
        gl.clientWaitSync(sync1, flushBit, timeoutNs);
        gl.waitSync(sync1, 0, syncTimeout);
    } catch(e) {}

    try {
        const sync2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const sync3 = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(sync2);
        gl.clientWaitSync(sync2, 0, timeoutNs);
        gl.deleteSync(sync3);
        gl.clientWaitSync(sync3, flushBit, 500000);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        const sync4 = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(sync4);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.waitSync(sync4, 0, syncTimeout);
        gl.flush();
    } catch(e) {}

    try {
        const sync5 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.deleteSync(sync5);
        gl.deleteSync(sync5);
        const sync6 = gl.fenceSync(syncCondition, 0);
        gl.clientWaitSync(sync6, flushBit, timeoutNs);
        gl.deleteSync(sync6);
    } catch(e) {}

    try {
        const sync7 = gl.fenceSync(syncCondition, 0);
        const sync8 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.deleteSync(sync7);
        gl.deleteSync(sync8);
        gl.clientWaitSync(sync7, 0, 0);
        gl.clientWaitSync(sync8, flushBit, 0);
        gl.waitSync(sync7, 0, syncTimeout);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        const syncA = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(syncA);
        gl.flush();
        gl.clientWaitSync(syncA, flushBit, timeoutNs);
        const syncB = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.deleteSync(syncB);
    } catch(e) {}

    try {
        const syncC = gl.fenceSync(syncCondition, 0);
        gl.waitSync(syncC, 0, syncTimeout);
        gl.deleteSync(syncC);
        gl.deleteSync(syncC);
        gl.clientWaitSync(syncC, 0, timeoutNs);
        gl.waitSync(syncC, 0, syncTimeout);
    } catch(e) {}

    try {
        const syncD = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const syncE = gl.fenceSync(syncCondition, 0);
        const syncF = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.deleteSync(syncD);
        gl.deleteSync(syncE);
        gl.deleteSync(syncF);
        gl.clientWaitSync(syncD, flushBit, 0);
        gl.clientWaitSync(syncE, 0, 0);
        gl.clientWaitSync(syncF, flushBit, timeoutNs);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, 24);
        const syncG = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(syncG);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.waitSync(syncG, 0, syncTimeout);
        gl.deleteSync(syncG);
    } catch(e) {}

    try {
        const syncH = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.deleteSync(syncH);
        gl.clientWaitSync(syncH, flushBit, timeoutNs);
        gl.waitSync(syncH, 0, syncTimeout);
        gl.deleteSync(syncH);
    } catch(e) {}

    try {
        const syncI = gl.fenceSync(syncCondition, 0);
        const syncJ = gl.fenceSync(syncCondition, 0);
        gl.deleteSync(syncI);
        gl.deleteSync(syncJ);
        gl.deleteSync(syncI);
        gl.deleteSync(syncJ);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, 30);
        gl.flush();
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

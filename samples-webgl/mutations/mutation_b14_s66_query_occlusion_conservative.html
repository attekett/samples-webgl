<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const queryCount = 8;
const drawCount = 32;
const occluderCount = 4;
const vertexCount = 6;
const primitiveCount = queryCount * 2;

const queryTarget = 0x8D6A;
const queryAvailable = 0x8867;
const queryResult = 0x8866;
const triangleMode = 0x0004;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            uniform float offset;
            void main() {
                gl_Position = vec4(position.x + offset, position.y, position.z, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            uniform vec4 color;
            void main() {
                fragColor = color;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([
            -0.5, -0.5, 0.0,
             0.5, -0.5, 0.0,
             0.0,  0.5, 0.0,
            -0.8, -0.8, 0.0,
             0.8, -0.8, 0.0,
             0.0,  0.8, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        const query1 = gl.createQuery();
        const query2 = gl.createQuery();
        const query3 = gl.createQuery();
        const query4 = gl.createQuery();
        const query5 = gl.createQuery();
        const query6 = gl.createQuery();
        const query7 = gl.createQuery();
        const query8 = gl.createQuery();
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
    } catch(e) {}

    try {
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clearDepth(1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);
    } catch(e) {}

    try {
        const offsetLoc = gl.getUniformLocation(program, 'offset');
        const colorLoc = gl.getUniformLocation(program, 'color');

        for (let i = 0; i < occluderCount; i++) {
            gl.uniform1f(offsetLoc, i * 0.1);
            gl.uniform4f(colorLoc, 0.5, 0.5, 0.5, 1.0);
            gl.drawArrays(triangleMode, 0, 3);
        }
    } catch(e) {}

    try {
        const query1 = gl.createQuery();
        gl.beginQuery(queryTarget, query1);
        gl.uniform1f(gl.getUniformLocation(program, 'offset'), 0.0);
        gl.uniform4f(gl.getUniformLocation(program, 'color'), 1.0, 0.0, 0.0, 0.8);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(queryTarget);

        const query2 = gl.createQuery();
        gl.beginQuery(queryTarget, query2);
        gl.uniform1f(gl.getUniformLocation(program, 'offset'), 0.2);
        gl.uniform4f(gl.getUniformLocation(program, 'color'), 0.0, 1.0, 0.0, 0.8);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(queryTarget);

        const query3 = gl.createQuery();
        gl.beginQuery(queryTarget, query3);
        gl.uniform1f(gl.getUniformLocation(program, 'offset'), -0.2);
        gl.uniform4f(gl.getUniformLocation(program, 'color'), 0.0, 0.0, 1.0, 0.8);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(queryTarget);
    } catch(e) {}

    try {
        const query4 = gl.createQuery();
        const query5 = gl.createQuery();
        gl.beginQuery(queryTarget, query4);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(queryTarget);
        gl.beginQuery(queryTarget, query5);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(queryTarget);
    } catch(e) {}

    try {
        const query6 = gl.createQuery();
        gl.beginQuery(queryTarget, query6);
        for (let i = 0; i < drawCount; i++) {
            gl.uniform1f(gl.getUniformLocation(program, 'offset'), i * 0.01);
            gl.uniform4f(gl.getUniformLocation(program, 'color'), i / 32.0, 1.0 - i / 32.0, 0.5, 1.0);
            gl.drawArrays(triangleMode, 0, vertexCount);
        }
        gl.endQuery(queryTarget);
    } catch(e) {}

    try {
        const query7 = gl.createQuery();
        gl.deleteQuery(query7);
        gl.beginQuery(queryTarget, query7);
        gl.endQuery(queryTarget);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const primitiveCount = 256;
const queryCount = 6;
const compareCount = 16;
const vertexCount = 3;
const tfBufferSize = primitiveCount * 12;

const primitivesGenerated = 0x8C87;
const tfPrimitivesWritten = 0x8C88;
const queryAvailable = 0x8867;
const queryResult = 0x8866;
const triangleMode = 0x0004;
const tfBufferTarget = 0x8C8E;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vPosition;
            uniform float scale;
            void main() {
                vPosition = position * scale;
                gl_Position = vec4(vPosition, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vPosition;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(abs(vPosition), 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vPosition'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([
            -0.5, -0.5, 0.0,
             0.5, -0.5, 0.0,
             0.0,  0.5, 0.0,
            -0.8, 0.0, 0.0,
             0.8, 0.0, 0.0,
             0.0, 0.8, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        const tfBuffer1 = gl.createBuffer();
        const tfBuffer2 = gl.createBuffer();
        const tfBuffer3 = gl.createBuffer();
        gl.bindBuffer(tfBufferTarget, tfBuffer1);
        gl.bindBuffer(tfBufferTarget, tfBuffer2);
        gl.bindBuffer(tfBufferTarget, tfBuffer1);
        gl.bufferData(tfBufferTarget, tfBufferSize, gl.STREAM_COPY);
        gl.bindBuffer(tfBufferTarget, tfBuffer2);
        gl.bufferData(tfBufferTarget, 8192, gl.STREAM_COPY);
        gl.bindBuffer(tfBufferTarget, tfBuffer3);
        gl.bufferData(tfBufferTarget, 16384, gl.STREAM_COPY);
    } catch(e) {}

    try {
        const query1 = gl.createQuery();
        const query2 = gl.createQuery();
        const query3 = gl.createQuery();
        const query4 = gl.createQuery();
        const query5 = gl.createQuery();
        const query6 = gl.createQuery();
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
    } catch(e) {}

    try {
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);
    } catch(e) {}

    try {
        const tfBuffer1 = gl.createBuffer();
        gl.bindBuffer(tfBufferTarget, tfBuffer1);
        gl.bufferData(tfBufferTarget, tfBufferSize, gl.STREAM_COPY);
        gl.bindBufferBase(tfBufferTarget, 0, tfBuffer1);

        const query1 = gl.createQuery();
        const query2 = gl.createQuery();

        const tf = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);

        gl.beginQuery(primitivesGenerated, query1);
        gl.beginQuery(tfPrimitivesWritten, query2);
        gl.beginTransformFeedback(triangleMode);

        gl.uniform1f(gl.getUniformLocation(program, 'scale'), 0.8);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        gl.endTransformFeedback();
        gl.endQuery(primitivesGenerated);
        gl.endQuery(tfPrimitivesWritten);
    } catch(e) {}

    try {
        const query3 = gl.createQuery();
        const query4 = gl.createQuery();

        gl.beginQuery(primitivesGenerated, query3);
        gl.beginQuery(tfPrimitivesWritten, query4);
        gl.beginTransformFeedback(gl.TRIANGLES);

        for (let i = 0; i < compareCount; i++) {
            gl.uniform1f(gl.getUniformLocation(program, 'scale'), i * 0.05);
            gl.drawArrays(triangleMode, 0, 3);
        }

        gl.endTransformFeedback();
        gl.endQuery(primitivesGenerated);
        gl.endQuery(tfPrimitivesWritten);
    } catch(e) {}

    try {
        const query5 = gl.createQuery();
        gl.beginQuery(primitivesGenerated, query5);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(primitivesGenerated);
    } catch(e) {}

    try {
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);

        const query6 = gl.createQuery();
        gl.beginQuery(primitivesGenerated, query6);

        for (let i = 0; i < compareCount; i++) {
            gl.uniform1f(gl.getUniformLocation(program, 'scale'), 0.5 + i * 0.02);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        }

        gl.endQuery(primitivesGenerated);
    } catch(e) {}

    try {
        const query7 = gl.createQuery();
        gl.deleteQuery(query7);
        gl.beginQuery(primitivesGenerated, query7);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(primitivesGenerated);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

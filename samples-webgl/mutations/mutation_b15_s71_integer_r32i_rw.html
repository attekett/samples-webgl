<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 128;
const texPixels = texSize * texSize;
const bufferSize = texPixels * 4;
const readWriteCount = 8;
const bindCycles = 4;

const textureTarget = 35866;
const textureFormat = 33333;
const internalFormat = 33333;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 1, internalFormat, texSize, texSize);
        const data = new Int32Array(texPixels);
        for (let i = 0; i < texPixels; i++) data[i] = i % 256;
        gl.texSubImage2D(textureTarget, 0, 0, 0, texSize, texSize, 36248, 5124, data);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, 33333, 256, 256);
        gl.bindTexture(textureTarget, tex3);
        gl.texStorage2D(textureTarget, 1, internalFormat, 64, 64);
        gl.bindTexture(textureTarget, tex1);
        gl.texParameteri(textureTarget, 10241, 9728);
        gl.texParameteri(textureTarget, 10240, 9728);
    } catch(e) {}

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(35345, buffer);
        gl.bufferData(35345, bufferSize, 35048);
        gl.bindBuffer(35345, null);
        gl.bindBuffer(35345, buffer);
        gl.bufferSubData(35345, 0, new Int32Array(512));
    } catch(e) {}

    try {
        const vs = gl.createShader(35633);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec2 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position.xy * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(35632);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp isampler2D;
            uniform isampler2D uTexture;
            in vec2 vTexCoord;
            out vec4 fragColor;
            void main() {
                ivec4 value = texture(uTexture, vTexCoord);
                fragColor = vec4(float(value.r) / 255.0, 0.0, 0.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
        gl.useProgram(null);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        const texLoc = gl.getUniformLocation(program, 'uTexture');
        gl.uniform1i(texLoc, 0);
        const positions = new Float32Array([
            -1, -1, 0,
            1, -1, 0,
            -1, 1, 0,
            1, 1, 0
        ]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(34962, vbo);
        gl.bufferData(34962, positions, 35044);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, 5126, false, 12, 0);
    } catch(e) {}

    try {
        gl.activeTexture(33984);
        gl.bindTexture(textureTarget, tex1);
        gl.activeTexture(33985);
        gl.bindTexture(textureTarget, tex2);
        gl.activeTexture(33984);
        gl.bindTexture(textureTarget, tex1);
    } catch(e) {}

    try {
        gl.enable(3042);
        gl.disable(3042);
        gl.enable(3042);
        gl.blendFunc(770, 771);
        gl.disable(2929);
        gl.enable(2929);
        gl.disable(2929);
    } catch(e) {}

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(5, 0, 4);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(5, 0, 4);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(5, 0, 4);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex1);
        gl.deleteTexture(tex1);
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.deleteTexture(tex2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

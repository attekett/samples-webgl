<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const bufferSize = 8192;
const texelCount = 2048;
const offsetStride = 64;
const bindCycles = 8;
const updateCount = 4;

const textureTarget = 35882;
const bufferTarget = 35345;
const r32iFormat = 33333;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, 35044);
        const data = new Int32Array(texelCount);
        for (let i = 0; i < texelCount; i++) data[i] = i * 2;
        gl.bufferSubData(bufferTarget, 0, data);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 16384, 35048);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bufferData(bufferTarget, 4096, 35044);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferSubData(bufferTarget, offsetStride, new Int32Array(256));
    } catch(e) {}

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texBuffer(textureTarget, r32iFormat, buffer1);
        gl.bindTexture(textureTarget, tex2);
        gl.texBuffer(textureTarget, 36227, buffer2);
    } catch(e) {}

    try {
        gl.bindBuffer(35051, buffer1);
        gl.bindBuffer(35052, buffer2);
        gl.copyBufferSubData(35051, 35052, 0, 512, 1024);
        gl.bindBuffer(35051, buffer2);
        gl.bindBuffer(35052, buffer3);
        gl.copyBufferSubData(35051, 35052, 0, 0, 2048);
    } catch(e) {}

    try {
        const vs = gl.createShader(35633);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            flat out int vIndex;
            void main() {
                gl_Position = vec4(position, 1.0);
                vIndex = gl_VertexID;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(35632);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp isamplerBuffer;
            uniform isamplerBuffer uTexBuffer;
            flat in int vIndex;
            out vec4 fragColor;
            void main() {
                int value = texelFetch(uTexBuffer, vIndex).r;
                fragColor = vec4(float(value) / 4096.0, 0.0, 0.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
        gl.useProgram(null);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        const texLoc = gl.getUniformLocation(program, 'uTexBuffer');
        gl.uniform1i(texLoc, 0);
        const positions = new Float32Array([
            -1, -1, 0,
            1, -1, 0,
            -1, 1, 0,
            1, 1, 0
        ]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(34962, vbo);
        gl.bufferData(34962, positions, 35044);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, 5126, false, 12, 0);
        gl.disableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(posLoc);
    } catch(e) {}

    try {
        gl.activeTexture(33984);
        gl.bindTexture(textureTarget, tex1);
        gl.activeTexture(33985);
        gl.bindTexture(textureTarget, tex2);
        gl.activeTexture(33984);
        gl.bindTexture(textureTarget, tex1);
    } catch(e) {}

    try {
        gl.enable(3042);
        gl.disable(3042);
        gl.enable(3042);
        gl.blendFunc(770, 771);
        gl.enable(2884);
        gl.disable(2884);
        gl.enable(2884);
        gl.cullFace(1029);
        gl.disable(2884);
    } catch(e) {}

    try {
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(5, 0, 4);
        gl.viewport(0, 0, 128, 128);
        gl.drawArrays(5, 0, 4);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(5, 0, 4);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.deleteBuffer(buffer2);
        gl.bindTexture(textureTarget, tex1);
        gl.deleteTexture(tex1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

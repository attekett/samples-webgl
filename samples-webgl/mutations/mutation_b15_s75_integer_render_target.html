<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

const attachmentCount = 4;
const drawCount = 8;
const clearValue = 64;
const texSize = 128;
const fboCount = 3;

const rgba32iFormat = 36227;
const rgba32uiFormat = 36208;
const textureTarget = 35866;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        const tex4 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 1, rgba32iFormat, texSize, texSize);
        gl.texParameteri(textureTarget, 10241, 9728);
        gl.texParameteri(textureTarget, 10240, 9728);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, rgba32iFormat, 256, 256);
        gl.bindTexture(textureTarget, tex3);
        gl.texStorage2D(textureTarget, 1, rgba32uiFormat, 128, 128);
        gl.bindTexture(textureTarget, tex4);
        gl.texStorage2D(textureTarget, 1, rgba32iFormat, 64, 64);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(36160, fbo1);
        gl.bindFramebuffer(36160, fbo2);
        gl.bindFramebuffer(36160, fbo1);
        gl.framebufferTexture2D(36160, 36064, textureTarget, tex1, 0);
        gl.framebufferTexture2D(36160, 36065, textureTarget, tex2, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(36160, fbo2);
        gl.framebufferTexture2D(36160, 36064, textureTarget, tex3, 0);
        gl.framebufferTexture2D(36160, 36065, textureTarget, tex4, 0);
        gl.bindFramebuffer(36160, fbo3);
        gl.framebufferTexture2D(36160, 36064, textureTarget, tex2, 0);
        gl.bindFramebuffer(36160, fbo1);
    } catch(e) {}

    try {
        const drawBuffers = [36064, 36065];
        gl.bindFramebuffer(36160, fbo1);
        gl.drawBuffers(drawBuffers);
        gl.bindFramebuffer(36160, fbo2);
        gl.drawBuffers(drawBuffers);
        gl.bindFramebuffer(36160, fbo1);
        gl.drawBuffers([36064]);
    } catch(e) {}

    try {
        const vs = gl.createShader(35633);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec2 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position.xy * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(35632);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec2 vTexCoord;
            layout(location = 0) out ivec4 fragColor0;
            layout(location = 1) out ivec4 fragColor1;
            void main() {
                int x = int(vTexCoord.x * 255.0);
                int y = int(vTexCoord.y * 255.0);
                fragColor0 = ivec4(x, y, 0, 127);
                fragColor1 = ivec4(y, x, 64, 127);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
        gl.useProgram(null);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        const positions = new Float32Array([
            -1, -1, 0,
            1, -1, 0,
            -1, 1, 0,
            1, 1, 0
        ]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(34962, vbo);
        gl.bufferData(34962, positions, 35044);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, 5126, false, 12, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(36160, fbo1);
        gl.clearBufferiv(36064, 0, [clearValue, clearValue, clearValue, clearValue]);
        gl.bindFramebuffer(36160, fbo2);
        gl.clearBufferiv(36064, 0, [0, 0, 0, 0]);
        gl.bindFramebuffer(36160, fbo1);
        gl.clearBufferiv(36065, 0, [clearValue, 0, 0, 127]);
    } catch(e) {}

    try {
        gl.enable(3042);
        gl.disable(3042);
        gl.enable(3042);
        gl.blendFunc(1, 0);
        gl.disable(3042);
        gl.enable(2929);
        gl.disable(2929);
        gl.enable(2929);
        gl.depthFunc(515);
        gl.disable(2929);
    } catch(e) {}

    try {
        gl.bindFramebuffer(36160, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(5, 0, 4);
        gl.bindFramebuffer(36160, fbo2);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(5, 0, 4);
        gl.bindFramebuffer(36160, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(5, 0, 4);
        gl.bindFramebuffer(36160, null);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(5, 0, 4);
    } catch(e) {}

    try {
        gl.bindFramebuffer(36160, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(36160, fbo1);
        gl.bindFramebuffer(36160, fbo2);
        gl.deleteFramebuffer(fbo2);
        gl.bindTexture(textureTarget, tex1);
        gl.deleteTexture(tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.deleteTexture(tex2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

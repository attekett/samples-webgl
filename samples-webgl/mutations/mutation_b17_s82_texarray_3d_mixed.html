<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const texSize = 128;
    const tex3DCount = 4;
    const texArrayCount = 4;
    const bindCycles = 16;
    const depthLayers = 64;
    const arrayLayers = 32;

    const target3D = gl.TEXTURE_3D;
    const targetArray = gl.TEXTURE_2D_ARRAY;
    const formatRGBA = gl.RGBA32F;
    const formatRGB = gl.RGB32F;
    const wrapMode = gl.CLAMP_TO_EDGE;

    try {
        const tex3D_1 = gl.createTexture();
        const tex3D_2 = gl.createTexture();
        const tex3D_3 = gl.createTexture();
        gl.bindTexture(target3D, tex3D_1);
        gl.bindTexture(target3D, tex3D_2);
        gl.bindTexture(target3D, tex3D_1);
        gl.texStorage3D(target3D, 1, formatRGBA, texSize, texSize, depthLayers);
        gl.bindTexture(target3D, tex3D_2);
        gl.texStorage3D(target3D, 1, gl.RGBA16F, 64, 64, 32);
        gl.bindTexture(target3D, tex3D_3);
        gl.texStorage3D(target3D, 1, formatRGB, 256, 256, 16);
    } catch(e) {}

    try {
        const texArr_1 = gl.createTexture();
        const texArr_2 = gl.createTexture();
        const texArr_3 = gl.createTexture();
        gl.bindTexture(targetArray, texArr_1);
        gl.bindTexture(targetArray, texArr_2);
        gl.bindTexture(targetArray, texArr_1);
        gl.texStorage3D(targetArray, 1, formatRGBA, texSize, texSize, arrayLayers);
        gl.bindTexture(targetArray, texArr_2);
        gl.texStorage3D(targetArray, 1, gl.RGBA8, 512, 512, 8);
        gl.bindTexture(targetArray, texArr_3);
        gl.texStorage3D(targetArray, 1, formatRGBA, texSize, texSize, 64);
    } catch(e) {}

    try {
        gl.bindTexture(target3D, tex3D_1);
        gl.texParameteri(target3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(target3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(target3D, gl.TEXTURE_WRAP_S, wrapMode);
        gl.texParameteri(target3D, gl.TEXTURE_WRAP_T, wrapMode);
        gl.texParameteri(target3D, gl.TEXTURE_WRAP_R, gl.REPEAT);
        gl.bindTexture(targetArray, texArr_1);
        gl.texParameteri(targetArray, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(targetArray, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(targetArray, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.bindTexture(target3D, tex3D_2);
    } catch(e) {}

    try {
        gl.bindTexture(target3D, tex3D_1);
        gl.bindTexture(targetArray, texArr_1);
        gl.bindTexture(target3D, tex3D_2);
        gl.bindTexture(targetArray, texArr_2);
        gl.bindTexture(target3D, tex3D_1);
        gl.bindTexture(targetArray, texArr_1);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(target3D, tex3D_1);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(targetArray, texArr_1);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(target3D, tex3D_2);
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(targetArray, texArr_2);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp sampler3D;
            precision highp sampler2DArray;
            in vec3 vTexCoord;
            out vec4 fragColor;
            uniform sampler3D uSampler3D;
            uniform sampler2DArray uSamplerArray;
            uniform float uDepth;
            uniform int uLayer;
            void main() {
                vec4 color3D = texture(uSampler3D, vec3(vTexCoord.xy, uDepth));
                vec4 colorArray = texture(uSamplerArray, vec3(vTexCoord.xy, float(uLayer)));
                fragColor = color3D * 0.5 + colorArray * 0.5;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, 4096, gl.STATIC_DRAW);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(512));
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bufferData(gl.ARRAY_BUFFER, 8192, gl.DYNAMIC_DRAW);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex3D_1, 0, 8);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArr_1, 0, 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}

    try {
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
    } catch(e) {}

    try {
        gl.bindTexture(target3D, tex3D_1);
        gl.deleteTexture(tex3D_1);
        gl.bindTexture(target3D, tex3D_1);
        gl.bindTexture(targetArray, texArr_1);
        gl.deleteTexture(texArr_1);
        gl.bindTexture(targetArray, texArr_1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const targetCount = 8;
    const drawCount = 16;
    const texSize = 256;
    const clearValue = 0;
    const bufferSize = texSize * texSize * 4;

    const textureTarget = gl.TEXTURE_2D;
    const textureFormat = gl.RGBA32F;
    const framebufferTarget = gl.FRAMEBUFFER;
    const drawBufferMode = gl.COLOR_ATTACHMENT0;

    try {
        const tex0 = gl.createTexture();
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        const tex4 = gl.createTexture();
        const tex5 = gl.createTexture();
        const tex6 = gl.createTexture();
        const tex7 = gl.createTexture();
        gl.bindTexture(textureTarget, tex0);
        gl.texStorage2D(textureTarget, 1, textureFormat, texSize, texSize);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 1, gl.RGBA16F, 512, 512);
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, textureFormat, texSize, texSize);
        gl.bindTexture(textureTarget, tex3);
        gl.texStorage2D(textureTarget, 1, gl.RGBA8, 128, 128);
        gl.bindTexture(textureTarget, tex4);
        gl.texStorage2D(textureTarget, 1, textureFormat, texSize, texSize);
        gl.bindTexture(textureTarget, tex5);
        gl.texStorage2D(textureTarget, 1, textureFormat, texSize, texSize);
        gl.bindTexture(textureTarget, tex6);
        gl.texStorage2D(textureTarget, 1, textureFormat, texSize, texSize);
        gl.bindTexture(textureTarget, tex7);
        gl.texStorage2D(textureTarget, 1, textureFormat, texSize, texSize);
    } catch(e) {}

    try {
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo);
        gl.bindFramebuffer(framebufferTarget, null);
        gl.bindFramebuffer(framebufferTarget, fbo);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex0, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT1, textureTarget, tex1, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT2, textureTarget, tex2, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT3, textureTarget, tex3, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT4, textureTarget, tex4, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT5, textureTarget, tex5, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT6, textureTarget, tex6, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT7, textureTarget, tex7, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2,
            gl.COLOR_ATTACHMENT3,
            gl.COLOR_ATTACHMENT4,
            gl.COLOR_ATTACHMENT5,
            gl.COLOR_ATTACHMENT6,
            gl.COLOR_ATTACHMENT7
        ]);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT2,
            gl.COLOR_ATTACHMENT4,
            gl.COLOR_ATTACHMENT6
        ]);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2,
            gl.COLOR_ATTACHMENT3,
            gl.COLOR_ATTACHMENT4,
            gl.COLOR_ATTACHMENT5,
            gl.COLOR_ATTACHMENT6,
            gl.COLOR_ATTACHMENT7
        ]);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            layout(location = 0) out vec4 fragColor0;
            layout(location = 1) out vec4 fragColor1;
            layout(location = 2) out vec4 fragColor2;
            layout(location = 3) out vec4 fragColor3;
            layout(location = 4) out vec4 fragColor4;
            layout(location = 5) out vec4 fragColor5;
            layout(location = 6) out vec4 fragColor6;
            layout(location = 7) out vec4 fragColor7;
            void main() {
                fragColor0 = vec4(1.0, 0.0, 0.0, 1.0);
                fragColor1 = vec4(0.0, 1.0, 0.0, 1.0);
                fragColor2 = vec4(0.0, 0.0, 1.0, 1.0);
                fragColor3 = vec4(1.0, 1.0, 0.0, 1.0);
                fragColor4 = vec4(1.0, 0.0, 1.0, 1.0);
                fragColor5 = vec4(0.0, 1.0, 1.0, 1.0);
                fragColor6 = vec4(0.5, 0.5, 0.5, 1.0);
                fragColor7 = vec4(1.0, 1.0, 1.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(128));
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bufferData(gl.ARRAY_BUFFER, 2048, gl.DYNAMIC_DRAW);
    } catch(e) {}

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.bindVertexArray(vao2);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
    } catch(e) {}

    try {
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(clearValue, clearValue, clearValue, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex0);
        gl.deleteTexture(tex0);
        gl.bindTexture(textureTarget, tex0);
        gl.bindFramebuffer(framebufferTarget, fbo);
        gl.deleteFramebuffer(fbo);
        gl.bindFramebuffer(framebufferTarget, fbo);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

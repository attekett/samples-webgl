<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const floatTargets = 3;
    const intTargets = 3;
    const normTargets = 2;
    const texSize = 256;
    const drawIterations = 16;
    const bufferSize = texSize * texSize * 4;

    const textureTarget = gl.TEXTURE_2D;
    const framebufferTarget = gl.FRAMEBUFFER;
    const formatFloat = gl.RGBA32F;
    const formatInt = gl.RGBA32I;
    const formatNorm = gl.RGBA8;

    try {
        const texFloat1 = gl.createTexture();
        const texFloat2 = gl.createTexture();
        const texFloat3 = gl.createTexture();
        gl.bindTexture(textureTarget, texFloat1);
        gl.texStorage2D(textureTarget, 1, formatFloat, texSize, texSize);
        gl.bindTexture(textureTarget, texFloat2);
        gl.texStorage2D(textureTarget, 1, gl.RGBA16F, 512, 512);
        gl.bindTexture(textureTarget, texFloat3);
        gl.texStorage2D(textureTarget, 1, formatFloat, texSize, texSize);
        gl.bindTexture(textureTarget, texFloat1);
    } catch(e) {}

    try {
        const texInt1 = gl.createTexture();
        const texInt2 = gl.createTexture();
        const texInt3 = gl.createTexture();
        gl.bindTexture(textureTarget, texInt1);
        gl.texStorage2D(textureTarget, 1, formatInt, texSize, texSize);
        gl.bindTexture(textureTarget, texInt2);
        gl.texStorage2D(textureTarget, 1, gl.RGBA32UI, 128, 128);
        gl.bindTexture(textureTarget, texInt3);
        gl.texStorage2D(textureTarget, 1, formatInt, texSize, texSize);
        gl.bindTexture(textureTarget, texInt1);
    } catch(e) {}

    try {
        const texNorm1 = gl.createTexture();
        const texNorm2 = gl.createTexture();
        gl.bindTexture(textureTarget, texNorm1);
        gl.texStorage2D(textureTarget, 1, formatNorm, texSize, texSize);
        gl.bindTexture(textureTarget, texNorm2);
        gl.texStorage2D(textureTarget, 1, gl.RGB8, 256, 256);
        gl.bindTexture(textureTarget, texNorm1);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, texFloat1, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT1, textureTarget, texFloat2, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT2, textureTarget, texFloat3, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, texInt1, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT1, textureTarget, texInt2, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT2, textureTarget, texInt3, 0);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, texNorm1, 0);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT1, textureTarget, texNorm2, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2
        ]);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2
        ]);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1
        ]);
        gl.bindFramebuffer(framebufferTarget, fbo1);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs1 = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs1, `#version 300 es
            precision highp float;
            layout(location = 0) out vec4 fragFloat0;
            layout(location = 1) out vec4 fragFloat1;
            layout(location = 2) out vec4 fragFloat2;
            void main() {
                fragFloat0 = vec4(1.0, 0.5, 0.25, 1.0);
                fragFloat1 = vec4(0.75, 1.0, 0.5, 1.0);
                fragFloat2 = vec4(0.5, 0.25, 1.0, 1.0);
            }
        `);
        gl.compileShader(fs1);

        const program1 = gl.createProgram();
        gl.attachShader(program1, vs);
        gl.attachShader(program1, fs1);
        gl.linkProgram(program1);
        gl.useProgram(program1);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(256));
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bufferData(gl.ARRAY_BUFFER, 4096, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer3);
        gl.bufferData(gl.ARRAY_BUFFER, 8192, gl.STREAM_DRAW);
    } catch(e) {}

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, texFloat1);
        gl.deleteTexture(texFloat1);
        gl.bindTexture(textureTarget, texFloat1);
        gl.bindTexture(textureTarget, texInt1);
        gl.deleteTexture(texInt1);
        gl.bindTexture(textureTarget, texInt1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

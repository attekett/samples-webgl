<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const layerCount = 8;
    const targetCount = 4;
    const drawCount = 32;
    const texSize = 256;
    const arrayLayers = 16;
    const bufferSize = texSize * texSize * 4;

    const textureTarget = gl.TEXTURE_2D_ARRAY;
    const framebufferTarget = gl.FRAMEBUFFER;
    const textureFormat = gl.RGBA32F;
    const attachmentBase = gl.COLOR_ATTACHMENT0;

    try {
        const texArr1 = gl.createTexture();
        const texArr2 = gl.createTexture();
        const texArr3 = gl.createTexture();
        const texArr4 = gl.createTexture();
        gl.bindTexture(textureTarget, texArr1);
        gl.texStorage3D(textureTarget, 1, textureFormat, texSize, texSize, arrayLayers);
        gl.bindTexture(textureTarget, texArr2);
        gl.texStorage3D(textureTarget, 1, gl.RGBA16F, 512, 512, 8);
        gl.bindTexture(textureTarget, texArr3);
        gl.texStorage3D(textureTarget, 1, textureFormat, texSize, texSize, 32);
        gl.bindTexture(textureTarget, texArr4);
        gl.texStorage3D(textureTarget, 1, gl.RGBA8, 128, 128, 4);
        gl.bindTexture(textureTarget, texArr1);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, texArr1);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.bindTexture(textureTarget, texArr2);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindTexture(textureTarget, texArr1);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT0, texArr1, 0, 0);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT1, texArr1, 0, 1);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT2, texArr1, 0, 2);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT3, texArr1, 0, 3);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT0, texArr2, 0, 4);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT1, texArr3, 0, 8);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT2, texArr4, 0, 2);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT0, texArr1, 0, 4);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT1, texArr1, 0, 5);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT2, texArr1, 0, 6);
        gl.framebufferTextureLayer(framebufferTarget, gl.COLOR_ATTACHMENT3, texArr1, 0, 7);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2,
            gl.COLOR_ATTACHMENT3
        ]);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2
        ]);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2,
            gl.COLOR_ATTACHMENT3
        ]);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT2
        ]);
        gl.drawBuffers([
            gl.COLOR_ATTACHMENT0,
            gl.COLOR_ATTACHMENT1,
            gl.COLOR_ATTACHMENT2,
            gl.COLOR_ATTACHMENT3
        ]);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vTexCoord;
            layout(location = 0) out vec4 fragColor0;
            layout(location = 1) out vec4 fragColor1;
            layout(location = 2) out vec4 fragColor2;
            layout(location = 3) out vec4 fragColor3;
            void main() {
                fragColor0 = vec4(vTexCoord.x, 0.0, 0.0, 1.0);
                fragColor1 = vec4(0.0, vTexCoord.y, 0.0, 1.0);
                fragColor2 = vec4(0.0, 0.0, vTexCoord.x, 1.0);
                fragColor3 = vec4(vTexCoord.y, vTexCoord.x, 0.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(512));
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bufferData(gl.ARRAY_BUFFER, 2048, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer3);
        gl.bufferData(gl.ARRAY_BUFFER, 4096, gl.STREAM_DRAW);
    } catch(e) {}

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.bindVertexArray(vao2);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
        gl.bindVertexArray(vao1);
    } catch(e) {}

    try {
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, 128, 128);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, texArr1);
        gl.deleteTexture(texArr1);
        gl.bindTexture(textureTarget, texArr1);
        gl.bindTexture(textureTarget, texArr2);
        gl.deleteTexture(texArr2);
        gl.bindTexture(textureTarget, texArr2);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

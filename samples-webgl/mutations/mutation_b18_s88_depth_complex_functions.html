<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const functionCount = 8;
const rangeNear = 0.0;
const rangeFar = 1.0;
const offsetFactor = 2.0;
const vertexCount = 6;
const texSize = 256;
const depthCycles = 16;

const depthNever = 512;
const depthLess = 513;
const depthEqual = 514;
const depthLequal = 515;
const depthGreater = 516;
const depthNotequal = 517;
const depthGequal = 518;
const depthAlways = 519;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        const vertices = new Float32Array([
            -0.5,-0.5,0.2, 0.5,-0.5,0.3, -0.5,0.5,0.4,
            -0.5,0.5,0.5, 0.5,-0.5,0.6, 0.5,0.5,0.7
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array([0.1, 0.2, 0.3]));
    } catch(e) {}

    try {
        const depthTex1 = gl.createTexture();
        const depthTex2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, depthTex1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, texSize, texSize, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
        gl.bindTexture(gl.TEXTURE_2D, depthTex2);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT32F, 256, 256, 0, gl.DEPTH_COMPONENT, gl.FLOAT, null);
        gl.bindTexture(gl.TEXTURE_2D, depthTex1);
    } catch(e) {}

    try {
        const colorTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, colorTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out float vDepth;
            void main() {
                gl_Position = vec4(position.xy, position.z, 1.0);
                vDepth = position.z;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in float vDepth;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(vDepth, 1.0 - vDepth, 0.5, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depthTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depthTex2, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(depthLess);
        gl.depthFunc(depthLequal);
        gl.depthFunc(depthGreater);
        gl.depthFunc(depthGequal);
        gl.depthFunc(depthEqual);
        gl.depthFunc(depthNotequal);
        gl.depthFunc(depthAlways);
        gl.depthFunc(depthNever);
        gl.depthFunc(depthLess);
    } catch(e) {}

    try {
        gl.depthMask(true);
        gl.depthMask(false);
        gl.depthMask(true);
        gl.depthRange(rangeNear, rangeFar);
        gl.depthRange(0.2, 0.8);
        gl.depthRange(0.0, 0.5);
        gl.depthRange(0.5, 1.0);
        gl.depthRange(rangeNear, rangeFar);
    } catch(e) {}

    try {
        gl.enable(gl.POLYGON_OFFSET_FILL);
        gl.polygonOffset(offsetFactor, 1.0);
        gl.polygonOffset(4.0, 2.0);
        gl.polygonOffset(-2.0, -1.0);
        gl.polygonOffset(0.0, 0.0);
        gl.disable(gl.POLYGON_OFFSET_FILL);
        gl.enable(gl.POLYGON_OFFSET_FILL);
        gl.polygonOffset(offsetFactor, offsetFactor);
    } catch(e) {}

    try {
        gl.depthFunc(depthLess);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.depthFunc(depthGreater);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.depthFunc(depthLequal);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.depthFunc(depthLess);
        gl.clear(gl.DEPTH_BUFFER_BIT | gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.depthFunc(depthEqual);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

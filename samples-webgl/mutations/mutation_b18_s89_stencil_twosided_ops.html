<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const opCount = 8;
const refValue = 128;
const maskValue = 255;
const vertexCount = 6;
const texSize = 256;
const stencilCycles = 24;

const stencilKeep = 7680;
const stencilZero = 0;
const stencilReplace = 7681;
const stencilIncr = 7682;
const stencilDecr = 7683;
const stencilInvert = 5386;
const stencilIncrWrap = 34055;
const stencilDecrWrap = 34056;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer3);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        const vertices = new Float32Array([-0.8,-0.8, 0.8,-0.8, 0.0,0.8, -0.5,-0.5, 0.5,-0.5, 0.0,0.5]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        const stencilTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, stencilTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH24_STENCIL8, texSize, texSize, 0, gl.DEPTH_STENCIL, gl.UNSIGNED_INT_24_8, null);
        const colorTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, colorTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec2 position;
            out vec2 vPos;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
                vPos = position;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec2 vPos;
            out vec4 fragColor;
            void main() {
                float intensity = (vPos.x + vPos.y) * 0.5 + 0.5;
                fragColor = vec4(intensity, 1.0 - intensity, 0.5, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 8, 0);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.TEXTURE_2D, stencilTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.TEXTURE_2D, stencilTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}

    try {
        gl.enable(gl.STENCIL_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilMask(maskValue);
        gl.stencilMask(255);
        gl.stencilMask(127);
        gl.stencilMask(maskValue);
    } catch(e) {}

    try {
        gl.stencilFunc(gl.ALWAYS, refValue, maskValue);
        gl.stencilFunc(gl.NEVER, 64, 255);
        gl.stencilFunc(gl.LESS, 32, maskValue);
        gl.stencilFunc(gl.LEQUAL, refValue, 255);
        gl.stencilFunc(gl.GREATER, 192, maskValue);
        gl.stencilFunc(gl.GEQUAL, refValue, maskValue);
        gl.stencilFunc(gl.EQUAL, 128, 255);
        gl.stencilFunc(gl.NOTEQUAL, refValue, maskValue);
    } catch(e) {}

    try {
        gl.stencilOp(stencilKeep, stencilKeep, stencilReplace);
        gl.stencilOp(stencilZero, stencilReplace, stencilIncr);
        gl.stencilOp(stencilReplace, stencilIncr, stencilDecr);
        gl.stencilOp(stencilIncr, stencilDecr, stencilInvert);
        gl.stencilOp(stencilDecr, stencilInvert, stencilIncrWrap);
        gl.stencilOp(stencilInvert, stencilIncrWrap, stencilDecrWrap);
        gl.stencilOp(stencilIncrWrap, stencilDecrWrap, stencilKeep);
        gl.stencilOp(stencilDecrWrap, stencilKeep, stencilReplace);
    } catch(e) {}

    try {
        gl.stencilFuncSeparate(gl.FRONT, gl.ALWAYS, refValue, maskValue);
        gl.stencilFuncSeparate(gl.BACK, gl.NEVER, 64, 255);
        gl.stencilFuncSeparate(gl.FRONT, gl.LESS, 96, maskValue);
        gl.stencilFuncSeparate(gl.BACK, gl.GREATER, refValue, maskValue);
        gl.stencilFuncSeparate(gl.FRONT, gl.EQUAL, 128, 255);
        gl.stencilFuncSeparate(gl.BACK, gl.NOTEQUAL, refValue, maskValue);
    } catch(e) {}

    try {
        gl.stencilOpSeparate(gl.FRONT, stencilKeep, stencilKeep, stencilReplace);
        gl.stencilOpSeparate(gl.BACK, stencilZero, stencilReplace, stencilIncr);
        gl.stencilOpSeparate(gl.FRONT, stencilIncr, stencilDecr, stencilInvert);
        gl.stencilOpSeparate(gl.BACK, stencilDecr, stencilInvert, stencilIncrWrap);
        gl.stencilOpSeparate(gl.FRONT, stencilIncrWrap, stencilDecrWrap, stencilKeep);
        gl.stencilOpSeparate(gl.BACK, stencilReplace, stencilKeep, stencilDecr);
    } catch(e) {}

    try {
        gl.stencilMaskSeparate(gl.FRONT, maskValue);
        gl.stencilMaskSeparate(gl.BACK, 127);
        gl.stencilMaskSeparate(gl.FRONT, 255);
        gl.stencilMaskSeparate(gl.BACK, maskValue);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.STENCIL_TEST);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clear(gl.STENCIL_BUFFER_BIT | gl.COLOR_BUFFER_BIT);
        gl.stencilFunc(gl.ALWAYS, refValue, maskValue);
        gl.stencilOp(stencilKeep, stencilKeep, stencilReplace);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.stencilFunc(gl.EQUAL, refValue, maskValue);
        gl.stencilOp(stencilKeep, stencilKeep, stencilIncr);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clear(gl.STENCIL_BUFFER_BIT | gl.COLOR_BUFFER_BIT);
        gl.stencilFuncSeparate(gl.FRONT, gl.ALWAYS, refValue, maskValue);
        gl.stencilFuncSeparate(gl.BACK, gl.NEVER, 0, maskValue);
        gl.stencilOpSeparate(gl.FRONT, stencilKeep, stencilKeep, stencilReplace);
        gl.stencilOpSeparate(gl.BACK, stencilKeep, stencilKeep, stencilInvert);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.deleteBuffer(buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

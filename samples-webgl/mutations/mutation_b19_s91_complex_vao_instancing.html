<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vaoCount = 6;
    const instanceCount = 64;
    const divisorCount = 4;
    const vertexCount = 18;
    const attribCount = 8;
    const bufferSize = 4096;

    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const drawMode = gl.TRIANGLES;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in vec3 offset;
            in vec3 color;
            in float scale;
            out vec3 vColor;
            void main() {
                gl_Position = vec4(position * scale + offset, 1.0);
                vColor = color;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(vColor, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, bufferUsage);
        gl.bufferSubData(bufferTarget, 0, new Float32Array([
            -0.5,-0.5,0, 0.5,-0.5,0, 0.5,0.5,0,
            -0.5,-0.5,0, 0.5,0.5,0, -0.5,0.5,0
        ]));
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 2048, gl.DYNAMIC_DRAW);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bufferData(bufferTarget, 1024, gl.STREAM_DRAW);
    } catch(e) {}

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        const vao3 = gl.createVertexArray();
        const vao4 = gl.createVertexArray();
        const vao5 = gl.createVertexArray();
        const vao6 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.vertexAttribDivisor(0, 0);
    } catch(e) {}

    try {
        gl.bindVertexArray(vao2);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 0);
        gl.vertexAttribDivisor(1, 1);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 24, 12);
        gl.vertexAttribDivisor(2, 1);
        gl.bindVertexArray(vao3);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.enableVertexAttribArray(3);
        gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 16, 0);
        gl.vertexAttribDivisor(3, 2);
    } catch(e) {}

    try {
        gl.bindVertexArray(vao4);
        gl.enableVertexAttribArray(0);
        gl.enableVertexAttribArray(1);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribDivisor(0, 0);
        gl.vertexAttribDivisor(1, 4);
        gl.vertexAttribDivisor(2, 8);
        gl.bindVertexArray(vao5);
        gl.vertexAttribDivisor(3, 16);
        gl.bindVertexArray(vao6);
        gl.disableVertexAttribArray(0);
        gl.enableVertexAttribArray(0);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
    } catch(e) {}

    try {
        gl.bindVertexArray(vao1);
        gl.viewport(0, 0, 256, 256);
        gl.drawArraysInstanced(drawMode, 0, vertexCount, instanceCount);
        gl.bindVertexArray(vao2);
        gl.viewport(0, 0, 128, 128);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 32);
        gl.bindVertexArray(vao3);
        gl.drawArraysInstanced(drawMode, 0, 12, 16);
        gl.bindVertexArray(vao1);
        gl.drawArraysInstanced(drawMode, 0, vertexCount, instanceCount);
    } catch(e) {}

    try {
        gl.bindVertexArray(vao4);
        gl.drawArraysInstanced(gl.POINTS, 0, 8, 48);
        gl.bindVertexArray(vao5);
        gl.drawArraysInstanced(gl.LINE_STRIP, 0, 16, 24);
        gl.bindVertexArray(vao6);
        gl.drawArraysInstanced(drawMode, 0, vertexCount, instanceCount);
    } catch(e) {}

    try {
        gl.bindVertexArray(vao1);
        gl.deleteVertexArray(vao1);
        gl.bindVertexArray(vao1);
        gl.drawArraysInstanced(drawMode, 0, 6, 8);
        gl.deleteVertexArray(vao2);
        gl.deleteVertexArray(vao3);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const pboCount = 4;
    const transferSize = 65536;
    const cycleCount = 8;
    const texSize = 256;
    const pixelCount = texSize * texSize;

    const packTarget = gl.PIXEL_PACK_BUFFER;
    const unpackTarget = gl.PIXEL_UNPACK_BUFFER;
    const textureTarget = gl.TEXTURE_2D;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in vec2 texCoord;
            out vec2 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = texCoord;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec2 vTexCoord;
            uniform sampler2D tex;
            out vec4 fragColor;
            void main() {
                fragColor = texture(tex, vTexCoord);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const packBuffer1 = gl.createBuffer();
        const packBuffer2 = gl.createBuffer();
        const packBuffer3 = gl.createBuffer();
        const packBuffer4 = gl.createBuffer();
        gl.bindBuffer(packTarget, packBuffer1);
        gl.bindBuffer(packTarget, packBuffer2);
        gl.bindBuffer(packTarget, packBuffer1);
        gl.bufferData(packTarget, transferSize, gl.STREAM_READ);
        gl.bindBuffer(packTarget, packBuffer2);
        gl.bufferData(packTarget, 131072, gl.DYNAMIC_READ);
        gl.bindBuffer(packTarget, packBuffer3);
        gl.bufferData(packTarget, 32768, gl.STATIC_READ);
    } catch(e) {}

    try {
        const unpackBuffer1 = gl.createBuffer();
        const unpackBuffer2 = gl.createBuffer();
        const unpackBuffer3 = gl.createBuffer();
        const unpackBuffer4 = gl.createBuffer();
        gl.bindBuffer(unpackTarget, unpackBuffer1);
        gl.bindBuffer(unpackTarget, unpackBuffer2);
        gl.bindBuffer(unpackTarget, unpackBuffer1);
        gl.bufferData(unpackTarget, transferSize, gl.STREAM_DRAW);
        gl.bufferSubData(unpackTarget, 0, new Uint8Array(1024));
        gl.bindBuffer(unpackTarget, unpackBuffer2);
        gl.bufferData(unpackTarget, 262144, gl.DYNAMIC_DRAW);
    } catch(e) {}

    try {
        const texture1 = gl.createTexture();
        const texture2 = gl.createTexture();
        const texture3 = gl.createTexture();
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget, texture2);
        gl.bindTexture(textureTarget, texture1);
        gl.texImage2D(textureTarget, 0, gl.RGBA, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } catch(e) {}

    try {
        gl.bindBuffer(unpackTarget, unpackBuffer1);
        gl.bindTexture(textureTarget, texture1);
        gl.texImage2D(textureTarget, 0, gl.RGBA, 128, 128, 0, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(unpackTarget, unpackBuffer2);
        gl.texSubImage2D(textureTarget, 0, 0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(unpackTarget, unpackBuffer1);
        gl.texImage2D(textureTarget, 0, gl.RGBA, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    } catch(e) {}

    try {
        gl.bindBuffer(packTarget, packBuffer1);
        gl.bindTexture(textureTarget, texture1);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(packTarget, packBuffer2);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(packTarget, packBuffer1);
        gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    } catch(e) {}

    try {
        gl.bindBuffer(packTarget, packBuffer1);
        gl.bindBuffer(unpackTarget, unpackBuffer1);
        gl.texImage2D(textureTarget, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(packTarget, packBuffer2);
        gl.bindBuffer(unpackTarget, unpackBuffer2);
        gl.texSubImage2D(textureTarget, 0, 0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    } catch(e) {}

    try {
        for(let i = 0; i < cycleCount; i++) {
            gl.bindBuffer(packTarget, packBuffer1);
            gl.bindBuffer(unpackTarget, unpackBuffer1);
            gl.texImage2D(textureTarget, 0, gl.RGBA, 64, 64, 0, gl.RGBA, gl.UNSIGNED_BYTE, 0);
            gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        }
    } catch(e) {}

    try {
        gl.bindBuffer(packTarget, packBuffer1);
        gl.deleteBuffer(packBuffer1);
        gl.bindBuffer(packTarget, packBuffer1);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.deleteBuffer(packBuffer2);
        gl.bindBuffer(unpackTarget, unpackBuffer1);
        gl.deleteBuffer(unpackBuffer1);
        gl.bindBuffer(unpackTarget, unpackBuffer1);
        gl.texImage2D(textureTarget, 0, gl.RGBA, 128, 128, 0, gl.RGBA, gl.UNSIGNED_BYTE, 0);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const attribCount = 8;
    const formatCount = 12;
    const strideVariations = 6;
    const vertexCount = 18;
    const bufferSize = 4096;

    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const drawMode = gl.TRIANGLES;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in vec3 color;
            in vec2 texCoord;
            in vec3 normal;
            out vec3 vColor;
            out vec2 vTexCoord;
            void main() {
                gl_Position = vec4(position + normal * 0.1, 1.0);
                vColor = color;
                vTexCoord = texCoord;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vColor;
            in vec2 vTexCoord;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(vColor * vTexCoord.x, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, bufferUsage);
        gl.bufferSubData(bufferTarget, 0, new Float32Array([
            -0.5,-0.5,0, 0.5,-0.5,0, 0.5,0.5,0,
            -0.5,-0.5,0, 0.5,0.5,0, -0.5,0.5,0
        ]));
    } catch(e) {}

    try {
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 48, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, true, 48, 12);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 48, 24);
    } catch(e) {}

    try {
        gl.vertexAttribPointer(0, 2, gl.BYTE, false, 16, 0);
        gl.vertexAttribPointer(1, 3, gl.SHORT, true, 24, 0);
        gl.vertexAttribPointer(2, 4, gl.INT, false, 32, 0);
        gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 12, 0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 48, 0);
    } catch(e) {}

    try {
        gl.enableVertexAttribArray(3);
        gl.vertexAttribPointer(3, 3, gl.FLOAT, false, 64, 32);
        gl.vertexAttribPointer(0, 3, gl.UNSIGNED_BYTE, true, 12, 0);
        gl.vertexAttribPointer(1, 2, gl.UNSIGNED_SHORT, false, 16, 0);
        gl.vertexAttribPointer(2, 4, gl.UNSIGNED_INT, false, 32, 0);
        gl.vertexAttribPointer(3, 2, gl.HALF_FLOAT, false, 8, 0);
    } catch(e) {}

    try {
        gl.vertexAttribIPointer(0, 4, gl.INT, 32, 0);
        gl.vertexAttribIPointer(1, 3, gl.UNSIGNED_INT, 24, 0);
        gl.vertexAttribIPointer(2, 2, gl.SHORT, 16, 0);
        gl.vertexAttribIPointer(3, 1, gl.BYTE, 12, 0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 48, 0);
    } catch(e) {}

    try {
        gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 4, 0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 16, 0);
        gl.vertexAttribPointer(1, 2, gl.FLOAT, true, 24, 0);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, 0);
    } catch(e) {}

    try {
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 12, 0);
        gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 16, 0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 128, 0);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 128, 48);
        gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 128, 96);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
    } catch(e) {}

    try {
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(drawMode, 0, vertexCount);
        gl.viewport(0, 0, 128, 128);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.drawArrays(gl.TRIANGLE_FAN, 0, 6);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(drawMode, 0, 12);
    } catch(e) {}

    try {
        gl.drawArrays(gl.POINTS, 0, 32);
        gl.drawArrays(gl.LINES, 0, 16);
        gl.drawArrays(gl.LINE_STRIP, 0, 24);
        gl.drawArrays(gl.LINE_LOOP, 0, 8);
        gl.drawArrays(drawMode, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 48, 0);
        gl.drawArrays(drawMode, 0, 6);
        gl.deleteBuffer(buffer2);
        gl.bindBuffer(bufferTarget, buffer2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

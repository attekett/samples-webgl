<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    // ============ DECLARATION ZONE ============
    // Tier 1: Amplification Variables
    const stencilRef = 128;
    const stencilMask = 0xFF;
    const vertexCount = 6;
    const passCount = 4;
    const bufferSize = vertexCount * 16;

    // Tier 3: Enum Constants
    const stencilOp = gl.INCR;
    const stencilFunc = gl.ALWAYS;
    const bufferTarget = gl.ARRAY_BUFFER;
    const cullMode = gl.BACK;

    // ============ SETUP ZONE ============

    // Block 1: Buffer creation with bind ping-pong
    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, gl.STATIC_DRAW);
        const vertices = new Float32Array([
            -0.5, -0.5, 0.0,
             0.5, -0.5, 0.0,
            -0.5,  0.5, 0.0,
            -0.5,  0.5, 0.0,
             0.5, -0.5, 0.0,
             0.5,  0.5, 0.0
        ]);
        gl.bufferSubData(bufferTarget, 0, vertices);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}

    // Block 2: Shader compilation
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            uniform vec4 uColor;
            out vec4 fragColor;
            void main() {
                fragColor = uColor;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    // ============ EXECUTION ZONE ============

    // Block 3: Stencil state thrashing with enable/disable
    try {
        gl.enable(gl.STENCIL_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilFunc(stencilFunc, stencilRef, stencilMask);
        gl.stencilOp(gl.KEEP, gl.KEEP, stencilOp);
        gl.stencilMask(stencilMask);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilFunc(gl.EQUAL, 64, 0xFF);
        gl.stencilFunc(stencilFunc, stencilRef, stencilMask);
    } catch(e) {}

    // Block 4: Two-sided stencil with front/back face ops
    try {
        gl.stencilFuncSeparate(gl.FRONT, stencilFunc, stencilRef, stencilMask);
        gl.stencilFuncSeparate(gl.BACK, gl.NEVER, 0, stencilMask);
        gl.stencilFuncSeparate(gl.FRONT, gl.ALWAYS, stencilRef, 0xFF);
        gl.stencilOpSeparate(gl.FRONT, gl.KEEP, gl.KEEP, stencilOp);
        gl.stencilOpSeparate(gl.BACK, gl.KEEP, gl.KEEP, gl.DECR);
        gl.stencilFuncSeparate(gl.BACK, stencilFunc, 32, stencilMask);
        gl.stencilOpSeparate(gl.FRONT, gl.INCR, gl.DECR, gl.INVERT);
        gl.stencilOpSeparate(gl.BACK, gl.KEEP, gl.INCR, gl.DECR);
        gl.stencilOpSeparate(gl.FRONT, gl.KEEP, gl.KEEP, stencilOp);
    } catch(e) {}

    // Block 5: Cull mode switching with stencil ops
    try {
        gl.enable(gl.CULL_FACE);
        gl.cullFace(cullMode);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.FRONT);
        gl.cullFace(cullMode);
        gl.cullFace(gl.FRONT_AND_BACK);
        gl.cullFace(cullMode);
        gl.disable(gl.CULL_FACE);
    } catch(e) {}

    // Block 6: Multi-pass stencil rendering
    try {
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clearStencil(0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

        const colorLoc = gl.getUniformLocation(program, 'uColor');

        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.uniform4f(colorLoc, 1.0, 0.0, 0.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.stencilFunc(gl.EQUAL, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.INCR);
        gl.uniform4f(colorLoc, 0.0, 1.0, 0.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        gl.stencilFunc(gl.ALWAYS, stencilRef, stencilMask);
        gl.stencilOp(gl.KEEP, gl.KEEP, stencilOp);
        gl.uniform4f(colorLoc, 0.0, 0.0, 1.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.stencilFunc(gl.NOTEQUAL, 0, stencilMask);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.KEEP);
        gl.uniform4f(colorLoc, 1.0, 1.0, 0.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) {}

    // Block 7: Stencil mask mutations with additional passes
    try {
        gl.stencilMask(0x0F);
        gl.stencilFunc(gl.ALWAYS, 15, 0x0F);
        gl.uniform4f(colorLoc, 0.5, 0.5, 1.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.stencilMask(0xF0);
        gl.stencilFunc(gl.ALWAYS, 240, 0xF0);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        gl.stencilMask(stencilMask);
        gl.stencilFunc(stencilFunc, stencilRef, stencilMask);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    // Block 8: Cleanup with deletion patterns
    try {
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.disable(gl.STENCIL_TEST);
        gl.disable(gl.CULL_FACE);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    // ============ DECLARATION ZONE ============
    // Tier 1: Amplification Variables
    const viewportCount = 4;
    const scissorSize = 64;
    const tileSize = 128;
    const vertexCount = 6;
    const canvasSize = 256;
    const bufferSize = vertexCount * 12;

    // Tier 3: Enum Constants
    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;

    // ============ SETUP ZONE ============

    // Block 1: Buffer creation with bind ping-pong
    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, bufferUsage);
        const vertices = new Float32Array([
            -1.0, -1.0, 0.0,
             1.0, -1.0, 0.0,
            -1.0,  1.0, 0.0,
            -1.0,  1.0, 0.0,
             1.0, -1.0, 0.0,
             1.0,  1.0, 0.0
        ]);
        gl.bufferSubData(bufferTarget, 0, vertices);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 512, gl.DYNAMIC_DRAW);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}

    // Block 2: Shader compilation
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            uniform vec4 uColor;
            out vec4 fragColor;
            void main() {
                fragColor = uColor;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    // ============ EXECUTION ZONE ============

    // Block 3: Viewport state thrashing
    try {
        gl.viewport(0, 0, canvasSize, canvasSize);
        gl.viewport(0, 0, tileSize, tileSize);
        gl.viewport(0, 0, canvasSize, canvasSize);
        gl.viewport(0, 0, 512, 512);
        gl.viewport(0, 0, canvasSize, canvasSize);
        gl.viewport(64, 64, tileSize, tileSize);
        gl.viewport(0, 0, canvasSize, canvasSize);
    } catch(e) {}

    // Block 4: Scissor test enable/disable thrashing
    try {
        gl.enable(gl.SCISSOR_TEST);
        gl.disable(gl.SCISSOR_TEST);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, 0, scissorSize, scissorSize);
        gl.disable(gl.SCISSOR_TEST);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, 0, canvasSize, canvasSize);
    } catch(e) {}

    // Block 5: Scissor rect mutations
    try {
        gl.scissor(0, 0, scissorSize, scissorSize);
        gl.scissor(scissorSize, 0, scissorSize, scissorSize);
        gl.scissor(0, 0, tileSize, tileSize);
        gl.scissor(64, 64, 128, 128);
        gl.scissor(0, 0, scissorSize, scissorSize);
        gl.scissor(192, 192, scissorSize, scissorSize);
        gl.scissor(0, 0, canvasSize, canvasSize);
    } catch(e) {}

    // Block 6: Multi-pass tiled rendering with scissor and viewport
    try {
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        const colorLoc = gl.getUniformLocation(program, 'uColor');

        gl.enable(gl.SCISSOR_TEST);
        gl.viewport(0, 0, tileSize, tileSize);
        gl.scissor(0, 0, scissorSize, scissorSize);
        gl.uniform4f(colorLoc, 1.0, 0.0, 0.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.viewport(tileSize, 0, tileSize, tileSize);
        gl.scissor(tileSize, 0, scissorSize, scissorSize);
        gl.uniform4f(colorLoc, 0.0, 1.0, 0.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        gl.viewport(0, tileSize, tileSize, tileSize);
        gl.scissor(0, tileSize, scissorSize, scissorSize);
        gl.uniform4f(colorLoc, 0.0, 0.0, 1.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.viewport(tileSize, tileSize, tileSize, tileSize);
        gl.scissor(tileSize, tileSize, scissorSize, scissorSize);
        gl.uniform4f(colorLoc, 1.0, 1.0, 0.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) {}

    // Block 7: Additional viewport/scissor mutations with draws
    try {
        gl.viewport(32, 32, 64, 64);
        gl.scissor(32, 32, 64, 64);
        gl.uniform4f(colorLoc, 1.0, 0.0, 1.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.viewport(0, 0, canvasSize, canvasSize);
        gl.scissor(64, 64, tileSize, tileSize);
        gl.uniform4f(colorLoc, 0.0, 1.0, 1.0, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        gl.scissor(0, 0, 512, 512);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.disable(gl.SCISSOR_TEST);
        gl.viewport(0, 0, canvasSize, canvasSize);
        gl.uniform4f(colorLoc, 0.5, 0.5, 0.5, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

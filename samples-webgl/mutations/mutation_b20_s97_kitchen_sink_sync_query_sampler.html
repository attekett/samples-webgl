<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const syncCount = 4;
const queryCount = 4;
const samplerCount = 6;
const tex3DCount = 3;
const texSize = 64;
const depth = 64;
const operationCount = 32;

const texture3DTarget = 0x806F;
const anySamplesPassed = 0x8C2F;
const syncFenceType = 0x9116;
const gpuCommandsComplete = 0x9117;
const syncFlushBit = 0x00000001;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const sync1 = gl.fenceSync(gpuCommandsComplete, 0);
        const sync2 = gl.fenceSync(gpuCommandsComplete, 0);
        const sync3 = gl.fenceSync(gpuCommandsComplete, 0);
        const sync4 = gl.fenceSync(gpuCommandsComplete, 0);
        gl.flush();
        gl.clientWaitSync(sync1, syncFlushBit, 0);
        gl.clientWaitSync(sync2, 0, 1000000);
        gl.waitSync(sync3, 0, gl.TIMEOUT_IGNORED);
        gl.waitSync(sync4, 0, -1);
    } catch(e) {}

    try {
        const query1 = gl.createQuery();
        const query2 = gl.createQuery();
        const query3 = gl.createQuery();
        const query4 = gl.createQuery();
        gl.beginQuery(anySamplesPassed, query1);
        gl.endQuery(anySamplesPassed);
        gl.beginQuery(anySamplesPassed, query2);
        gl.endQuery(anySamplesPassed);
        gl.beginQuery(anySamplesPassed, query3);
        gl.endQuery(anySamplesPassed);
        gl.beginQuery(anySamplesPassed, query4);
        gl.endQuery(anySamplesPassed);
    } catch(e) {}

    try {
        const sampler1 = gl.createSampler();
        const sampler2 = gl.createSampler();
        const sampler3 = gl.createSampler();
        const sampler4 = gl.createSampler();
        const sampler5 = gl.createSampler();
        const sampler6 = gl.createSampler();
        gl.samplerParameteri(sampler1, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.samplerParameteri(sampler2, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.samplerParameteri(sampler3, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.samplerParameteri(sampler4, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(sampler5, gl.TEXTURE_WRAP_R, gl.MIRRORED_REPEAT);
        gl.samplerParameterf(sampler6, gl.TEXTURE_MAX_LOD, 4.0);
        gl.bindSampler(0, sampler1);
        gl.bindSampler(1, sampler2);
        gl.bindSampler(0, sampler3);
        gl.bindSampler(1, sampler4);
    } catch(e) {}

    try {
        const tex3D1 = gl.createTexture();
        const tex3D2 = gl.createTexture();
        const tex3D3 = gl.createTexture();
        gl.bindTexture(texture3DTarget, tex3D1);
        gl.texImage3D(texture3DTarget, 0, gl.RGBA8, texSize, texSize, depth, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(texture3DTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.bindTexture(texture3DTarget, tex3D2);
        gl.texImage3D(texture3DTarget, 0, gl.RGBA8, 32, 32, 32, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(texture3DTarget, gl.TEXTURE_WRAP_R, gl.REPEAT);
        gl.bindTexture(texture3DTarget, tex3D3);
        gl.texImage3D(texture3DTarget, 0, gl.RGBA8, texSize, texSize, depth, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vTexCoord;
            void main() {
                vTexCoord = position * 0.5 + 0.5;
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp sampler3D;
            uniform sampler3D uTexture3D1;
            uniform sampler3D uTexture3D2;
            uniform sampler3D uTexture3D3;
            in vec3 vTexCoord;
            out vec4 fragColor;
            void main() {
                vec4 c1 = texture(uTexture3D1, vTexCoord);
                vec4 c2 = texture(uTexture3D2, vTexCoord);
                vec4 c3 = texture(uTexture3D3, vTexCoord);
                fragColor = (c1 + c2 + c3) / 3.0;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 0, 1, -1, 0, 1, 1, 0,
            -1, -1, 0, 1, 1, 0, -1, 1, 0
        ]), gl.STATIC_DRAW);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.bindSampler(0, sampler1);
        gl.bindSampler(1, sampler2);
        gl.bindSampler(2, sampler3);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(texture3DTarget, tex3D1);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(texture3DTarget, tex3D2);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(texture3DTarget, tex3D3);
    } catch(e) {}

    try {
        const sync5 = gl.fenceSync(gpuCommandsComplete, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.flush();
        gl.waitSync(sync5, 0, gl.TIMEOUT_IGNORED);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.beginQuery(anySamplesPassed, query1);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(anySamplesPassed);
        const resultAvailable = gl.getQueryParameter(query1, gl.QUERY_RESULT_AVAILABLE);
        const result = gl.getQueryParameter(query1, gl.QUERY_RESULT);
    } catch(e) {}

    try {
        gl.bindSampler(0, sampler4);
        gl.bindSampler(1, sampler5);
        gl.bindSampler(2, sampler6);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindSampler(0, sampler1);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.deleteSync(sync1);
        gl.deleteSync(sync2);
        gl.clientWaitSync(sync1, 0, 0);
        gl.waitSync(sync2, 0, gl.TIMEOUT_IGNORED);
    } catch(e) {}

    try {
        gl.deleteQuery(query1);
        gl.deleteQuery(query2);
        gl.beginQuery(anySamplesPassed, query1);
        gl.endQuery(anySamplesPassed);
    } catch(e) {}

    try {
        gl.bindSampler(0, sampler1);
        gl.deleteSampler(sampler1);
        gl.bindSampler(0, sampler1);
        gl.bindTexture(texture3DTarget, tex3D1);
        gl.deleteTexture(tex3D1);
        gl.bindTexture(texture3DTarget, tex3D1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

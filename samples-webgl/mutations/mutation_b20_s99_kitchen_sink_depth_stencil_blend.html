<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

const fboCount = 4;
const attachmentCount = 8;
const blendModes = 16;
const texSize = 256;
const depthValue = 0.5;
const stencilRef = 128;

const depthStencilFormat = 0x84F9;
const depth24Stencil8 = 0x88F0;
const depthStencilAttachment = 0x821A;
const depthAttachment = 0x8D00;
const stencilAttachment = 0x8D20;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const depthStencilTex1 = gl.createTexture();
        const depthStencilTex2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, depthStencilTex1);
        gl.texImage2D(gl.TEXTURE_2D, 0, depth24Stencil8, texSize, texSize, 0, gl.DEPTH_STENCIL, gl.UNSIGNED_INT_24_8, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(gl.TEXTURE_2D, depthStencilTex2);
        gl.texImage2D(gl.TEXTURE_2D, 0, depth24Stencil8, 128, 128, 0, gl.DEPTH_STENCIL, gl.UNSIGNED_INT_24_8, null);
    } catch(e) {}

    try {
        const colorTex1 = gl.createTexture();
        const colorTex2 = gl.createTexture();
        const colorTex3 = gl.createTexture();
        const colorTex4 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, colorTex1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, texSize, texSize, 0, gl.RGBA, gl.FLOAT, null);
        gl.bindTexture(gl.TEXTURE_2D, colorTex2);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, texSize, texSize, 0, gl.RGBA, gl.FLOAT, null);
        gl.bindTexture(gl.TEXTURE_2D, colorTex3);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 128, 128, 0, gl.RGBA, gl.FLOAT, null);
        gl.bindTexture(gl.TEXTURE_2D, colorTex4);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, texSize, texSize, 0, gl.RGBA, gl.FLOAT, null);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        const fbo4 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex1, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthStencilAttachment, gl.TEXTURE_2D, depthStencilTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex2, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttachment, gl.TEXTURE_2D, depthStencilTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex3, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, stencilAttachment, gl.TEXTURE_2D, depthStencilTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo4);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colorTex4, 0);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec4 vColor;
            void main() {
                vColor = vec4(1.0, 0.5, 0.25, 0.75);
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec4 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vColor;
                gl_FragDepth = 0.5;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 0, 1, -1, 0, 1, 1, 0,
            -1, -1, 0, 1, 1, 0, -1, 1, 0
        ]), gl.STATIC_DRAW);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.depthFunc(gl.LEQUAL);
        gl.depthFunc(gl.GREATER);
        gl.depthFunc(gl.GEQUAL);
        gl.depthFunc(gl.EQUAL);
        gl.depthFunc(gl.NOTEQUAL);
        gl.depthFunc(gl.ALWAYS);
        gl.depthFunc(gl.NEVER);
        gl.depthMask(true);
        gl.depthMask(false);
        gl.depthMask(true);
    } catch(e) {}

    try {
        gl.enable(gl.STENCIL_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilFunc(gl.ALWAYS, stencilRef, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.stencilOpSeparate(gl.FRONT, gl.KEEP, gl.INCR, gl.INCR);
        gl.stencilOpSeparate(gl.BACK, gl.KEEP, gl.DECR, gl.DECR);
        gl.stencilFuncSeparate(gl.FRONT, gl.EQUAL, 64, 0xFF);
        gl.stencilFuncSeparate(gl.BACK, gl.NOTEQUAL, 192, 0xFF);
        gl.stencilMask(0xFF);
        gl.stencilMask(0x00);
        gl.stencilMask(0xFF);
    } catch(e) {}

    try {
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.blendFunc(gl.ZERO, gl.ONE);
        gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ZERO);
        gl.blendEquation(gl.FUNC_ADD);
        gl.blendEquation(gl.FUNC_SUBTRACT);
        gl.blendEquation(gl.FUNC_REVERSE_SUBTRACT);
        gl.blendEquation(gl.MIN);
        gl.blendEquation(gl.MAX);
        gl.blendEquationSeparate(gl.FUNC_ADD, gl.FUNC_SUBTRACT);
        gl.blendColor(1.0, 0.5, 0.25, 0.75);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearDepth(depthValue);
        gl.clearStencil(stencilRef);
        gl.clear(gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.depthFunc(gl.LESS);
        gl.stencilFunc(gl.EQUAL, 128, 0xFF);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.depthFunc(gl.GREATER);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo4);
        gl.depthFunc(gl.ALWAYS);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.blendEquation(gl.FUNC_SUBTRACT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.blendEquation(gl.MIN);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.blendEquation(gl.MAX);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.disable(gl.BLEND);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindTexture(gl.TEXTURE_2D, depthStencilTex1);
        gl.deleteTexture(depthStencilTex1);
        gl.bindTexture(gl.TEXTURE_2D, depthStencilTex1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const formatCount = 8;
const textureCount = 16;
const conversionCycles = 32;
const texSize = 512;
const pixelCount = texSize * texSize;
const bufferSize = pixelCount * 4;

const format_R8I = 0x8231;
const format_R8UI = 0x8232;
const format_R16I = 0x8233;
const format_R16UI = 0x8234;
const format_R32I = 0x8235;
const format_R32UI = 0x8236;
const textureTarget = 0x0DE1;
const framebufferTarget = 0x8D40;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 1, format_R8I, texSize, texSize);
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, format_R8UI, 256, 256);
        gl.bindTexture(textureTarget, tex3);
        gl.texStorage2D(textureTarget, 1, format_R16I, 512, 512);
    } catch(e) {}

    try {
        const tex4 = gl.createTexture();
        const tex5 = gl.createTexture();
        const tex6 = gl.createTexture();
        gl.bindTexture(textureTarget, tex4);
        gl.texStorage2D(textureTarget, 1, format_R16UI, texSize, texSize);
        gl.bindTexture(textureTarget, tex5);
        gl.texStorage2D(textureTarget, 1, format_R32I, 128, 128);
        gl.bindTexture(textureTarget, tex6);
        gl.bindTexture(textureTarget, tex4);
        gl.texStorage2D(textureTarget, 1, format_R32UI, texSize, texSize);
    } catch(e) {}

    try {
        const tex7 = gl.createTexture();
        const tex8 = gl.createTexture();
        gl.bindTexture(textureTarget, tex7);
        gl.bindTexture(textureTarget, tex8);
        gl.bindTexture(textureTarget, tex7);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texStorage2D(textureTarget, 1, format_R8I, 256, 256);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp isampler2D;
            uniform isampler2D intTex;
            out ivec4 fragColor;
            void main() {
                fragColor = ivec4(127, -64, 32, 16);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex1, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex2, 0);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex3, 0);
        gl.bindFramebuffer(framebufferTarget, fbo1);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        const intData = new Int8Array([127, -128, 64, -64, 32, -32, 16, -16]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, intData);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ZERO);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex3);
        gl.bindTexture(textureTarget, tex4);
        gl.bindTexture(textureTarget, tex1);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex1);
        gl.deleteTexture(tex1);
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.deleteTexture(tex2);
        gl.bindTexture(textureTarget, tex2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

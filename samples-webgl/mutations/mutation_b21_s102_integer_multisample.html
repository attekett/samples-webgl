<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const sampleCount = 4;
const attachmentCount = 4;
const texSize = 256;
const resolveCount = 8;
const pixelCount = texSize * texSize;
const bufferSize = pixelCount * 4;

const format_RGBA32I = 0x8D82;
const format_RGBA32UI = 0x8D70;
const textureTarget = 0x0DE1;
const framebufferTarget = 0x8D40;
const renderbufferTarget = 0x8D41;
const readFramebuffer = 0x8CA8;
const drawFramebuffer = 0x8CA9;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rbo1 = gl.createRenderbuffer();
        const rbo2 = gl.createRenderbuffer();
        const rbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(renderbufferTarget, rbo1);
        gl.bindRenderbuffer(renderbufferTarget, rbo2);
        gl.bindRenderbuffer(renderbufferTarget, rbo1);
        gl.renderbufferStorageMultisample(renderbufferTarget, sampleCount, format_RGBA32I, texSize, texSize);
        gl.bindRenderbuffer(renderbufferTarget, rbo2);
        gl.renderbufferStorageMultisample(renderbufferTarget, 4, format_RGBA32UI, 256, 256);
        gl.bindRenderbuffer(renderbufferTarget, rbo3);
        gl.renderbufferStorageMultisample(renderbufferTarget, sampleCount, format_RGBA32I, 512, 512);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferRenderbuffer(framebufferTarget, gl.COLOR_ATTACHMENT0, renderbufferTarget, rbo1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferRenderbuffer(framebufferTarget, gl.COLOR_ATTACHMENT0, renderbufferTarget, rbo2);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.framebufferRenderbuffer(framebufferTarget, gl.COLOR_ATTACHMENT0, renderbufferTarget, rbo3);
        gl.bindFramebuffer(framebufferTarget, fbo1);
    } catch(e) {}

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 1, format_RGBA32I, texSize, texSize);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, format_RGBA32UI, 256, 256);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out ivec4 fragColor;
            void main() {
                fragColor = ivec4(2147483647, -2147483648, 1234567, -7654321);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        const intData = new Int32Array([2147483647, -2147483648, 1000000, -1000000]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, intData);
    } catch(e) {}

    try {
        gl.enable(gl.SAMPLE_COVERAGE);
        gl.disable(gl.SAMPLE_COVERAGE);
        gl.enable(gl.SAMPLE_COVERAGE);
        gl.sampleCoverage(1.0, false);
        gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) {}

    try {
        const fbo4 = gl.createFramebuffer();
        const fbo5 = gl.createFramebuffer();
        gl.bindFramebuffer(readFramebuffer, fbo1);
        gl.bindFramebuffer(drawFramebuffer, fbo4);
        gl.framebufferTexture2D(drawFramebuffer, gl.COLOR_ATTACHMENT0, textureTarget, tex1, 0);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.bindFramebuffer(readFramebuffer, fbo2);
        gl.bindFramebuffer(drawFramebuffer, fbo5);
        gl.framebufferTexture2D(drawFramebuffer, gl.COLOR_ATTACHMENT0, textureTarget, tex2, 0);
        gl.blitFramebuffer(0, 0, 256, 256, 0, 0, 256, 256, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.3, 0.3, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(renderbufferTarget, rbo1);
        gl.deleteRenderbuffer(rbo1);
        gl.bindRenderbuffer(renderbufferTarget, rbo1);
        gl.bindRenderbuffer(renderbufferTarget, rbo2);
        gl.deleteRenderbuffer(rbo2);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.deleteFramebuffer(fbo2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

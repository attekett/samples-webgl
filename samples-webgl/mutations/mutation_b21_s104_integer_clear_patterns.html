<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const clearCycles = 24;
const clearValue = 12345;
const attachmentCount = 8;
const texSize = 256;
const pixelCount = texSize * texSize;
const bufferSize = pixelCount * 4;

const format_RGBA32I = 0x8D82;
const format_RGBA32UI = 0x8D70;
const format_R32I = 0x8235;
const format_R32UI = 0x8236;
const textureTarget = 0x0DE1;
const framebufferTarget = 0x8D40;
const colorBuffer = 0x1800;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 1, format_RGBA32I, texSize, texSize);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, format_RGBA32UI, 256, 256);
        gl.bindTexture(textureTarget, tex3);
        gl.texStorage2D(textureTarget, 1, format_R32I, 512, 512);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex1, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex2, 0);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex3, 0);
        gl.bindFramebuffer(framebufferTarget, fbo1);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.clearBufferiv(colorBuffer, 0, [clearValue, -clearValue, 54321, -67890]);
        gl.clearBufferiv(colorBuffer, 0, [2147483647, -2147483648, 999999, -888888]);
        gl.clearBufferiv(colorBuffer, 0, [clearValue, clearValue, clearValue, clearValue]);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.clearBufferuiv(colorBuffer, 0, [4294967295, 0, 2147483648, 1073741824]);
        gl.clearBufferuiv(colorBuffer, 0, [clearValue, clearValue * 2, clearValue * 3, clearValue * 4]);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.clearBufferiv(colorBuffer, 0, [1, 2, 3, 4]);
        gl.clearBufferiv(colorBuffer, 0, [5, 6, 7, 8]);
        gl.clearBufferiv(colorBuffer, 0, [9, 10, 11, 12]);
        gl.clearBufferiv(colorBuffer, 0, [13, 14, 15, 16]);
        gl.clearBufferiv(colorBuffer, 0, [17, 18, 19, 20]);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.clearBufferuiv(colorBuffer, 0, [21, 22, 23, 24]);
        gl.clearBufferuiv(colorBuffer, 0, [25, 26, 27, 28]);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out ivec4 fragColor;
            void main() {
                fragColor = ivec4(777777, -666666, 555555, -444444);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        const intData = new Int32Array([clearValue, -clearValue, 99999, -88888]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, intData);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearBufferiv(colorBuffer, 0, [11111, -22222, 33333, -44444]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.clearBufferiv(colorBuffer, 0, [55555, -66666, 77777, -88888]);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, 256, 256);
        gl.clearBufferuiv(colorBuffer, 0, [100000, 200000, 300000, 400000]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.clearBufferiv(colorBuffer, 0, [0, 0, 0, 0]);
        gl.clearBufferiv(colorBuffer, 0, [-1, -1, -1, -1]);
        gl.clearBufferiv(colorBuffer, 0, [2147483647, 2147483647, 2147483647, 2147483647]);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.clearBufferuiv(colorBuffer, 0, [4294967295, 4294967295, 4294967295, 4294967295]);
        gl.clearBufferuiv(colorBuffer, 0, [0, 0, 0, 0]);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.clearBufferiv(colorBuffer, 0, [123, -456, 789, -101112]);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.clearBufferuiv(colorBuffer, 0, [131415, 161718, 192021, 222324]);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.clearBufferiv(colorBuffer, 0, [252627, -282930, 313233, -343536]);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.5, 0.5, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.clearBufferiv(colorBuffer, 0, [clearValue, clearValue, clearValue, clearValue]);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.clearBufferiv(colorBuffer, 0, [0, 0, 0, 0]);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex1);
        gl.deleteTexture(tex1);
        gl.bindTexture(textureTarget, tex1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.clearBufferuiv(colorBuffer, 0, [1, 2, 3, 4]);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

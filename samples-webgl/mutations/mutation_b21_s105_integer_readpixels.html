<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const readCount = 16;
const pixelStride = 4;
const pboSize = 65536;
const formatVariations = 6;
const texSize = 256;
const pixelCount = texSize * texSize;
const bufferSize = pixelCount * 4;

const format_RGBA32I = 0x8D82;
const format_RGBA32UI = 0x8D70;
const format_R32I = 0x8235;
const format_R32UI = 0x8236;
const format_RGBA_INTEGER = 0x8D99;
const format_RED_INTEGER = 0x8D94;
const type_INT = 0x1404;
const type_UNSIGNED_INT = 0x1405;
const textureTarget = 0x0DE1;
const framebufferTarget = 0x8D40;
const pixelPackBuffer = 0x88EB;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 1, format_RGBA32I, texSize, texSize);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, format_RGBA32UI, 256, 256);
        gl.bindTexture(textureTarget, tex3);
        gl.texStorage2D(textureTarget, 1, format_R32I, 512, 512);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex1, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex2, 0);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, textureTarget, tex3, 0);
        gl.bindFramebuffer(framebufferTarget, fbo1);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out ivec4 fragColor;
            void main() {
                fragColor = ivec4(1357924, -2468135, 9876543, -1234567);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        const vertices = new Float32Array([-1, -1, 0, 1, -1, 0, 0, 1, 0]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertices);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearBufferiv(gl.COLOR, 0, [111111, -222222, 333333, -444444]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, 256, 256);
        gl.clearBufferuiv(gl.COLOR, 0, [555555, 666666, 777777, 888888]);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        const pixels1 = new Int32Array(pixelStride * readCount);
        const pixels2 = new Uint32Array(pixelStride * readCount);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.readPixels(0, 0, readCount, 1, format_RGBA_INTEGER, type_INT, pixels1);
        gl.readPixels(0, 0, 16, 16, format_RGBA_INTEGER, type_INT, pixels1);
        gl.readPixels(64, 64, 32, 32, format_RGBA_INTEGER, type_INT, pixels1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.readPixels(0, 0, readCount, 1, format_RGBA_INTEGER, type_UNSIGNED_INT, pixels2);
        gl.readPixels(128, 128, 64, 64, format_RGBA_INTEGER, type_UNSIGNED_INT, pixels2);
    } catch(e) {}

    try {
        const pbo1 = gl.createBuffer();
        const pbo2 = gl.createBuffer();
        const pbo3 = gl.createBuffer();
        gl.bindBuffer(pixelPackBuffer, pbo1);
        gl.bindBuffer(pixelPackBuffer, pbo2);
        gl.bindBuffer(pixelPackBuffer, pbo1);
        gl.bufferData(pixelPackBuffer, pboSize, gl.STREAM_READ);
        gl.bindBuffer(pixelPackBuffer, pbo2);
        gl.bufferData(pixelPackBuffer, 262144, gl.STREAM_READ);
        gl.bindBuffer(pixelPackBuffer, pbo3);
        gl.bufferData(pixelPackBuffer, pboSize, gl.STREAM_READ);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindBuffer(pixelPackBuffer, pbo1);
        gl.readPixels(0, 0, texSize, texSize, format_RGBA_INTEGER, type_INT, 0);
        gl.bindBuffer(pixelPackBuffer, pbo2);
        gl.readPixels(0, 0, 128, 128, format_RGBA_INTEGER, type_INT, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.bindBuffer(pixelPackBuffer, pbo3);
        gl.readPixels(0, 0, 256, 256, format_RGBA_INTEGER, type_UNSIGNED_INT, 0);
    } catch(e) {}

    try {
        const pixels3 = new Int32Array(256);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindBuffer(pixelPackBuffer, null);
        gl.readPixels(0, 0, 64, 1, format_RGBA_INTEGER, type_INT, pixels3);
        gl.readPixels(32, 32, 16, 16, format_RGBA_INTEGER, type_INT, pixels3);
        gl.readPixels(100, 100, 8, 8, format_RGBA_INTEGER, type_INT, pixels3);
        gl.readPixels(200, 200, 4, 4, format_RGBA_INTEGER, type_INT, pixels3);
    } catch(e) {}

    try {
        gl.bindBuffer(pixelPackBuffer, pbo1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.readPixels(0, 0, texSize, texSize, format_RGBA_INTEGER, type_INT, 0);
        gl.bindBuffer(pixelPackBuffer, pbo2);
        gl.readPixels(0, 0, texSize, texSize, format_RGBA_INTEGER, type_INT, 0);
        gl.bindBuffer(pixelPackBuffer, pbo3);
        gl.readPixels(0, 0, texSize, texSize, format_RGBA_INTEGER, type_INT, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.6, 0.6, 0.6, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        const pixels4 = new Int32Array(64);
        gl.bindBuffer(pixelPackBuffer, null);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.readPixels(0, 0, 16, 1, format_RGBA_INTEGER, type_INT, pixels4);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.readPixels(0, 0, 8, 1, format_RGBA_INTEGER, type_INT, pixels4);
    } catch(e) {}

    try {
        gl.bindBuffer(pixelPackBuffer, pbo1);
        gl.deleteBuffer(pbo1);
        gl.bindBuffer(pixelPackBuffer, pbo1);
        gl.bufferData(pixelPackBuffer, pboSize, gl.STREAM_READ);
        gl.readPixels(0, 0, 64, 64, format_RGBA_INTEGER, type_INT, 0);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

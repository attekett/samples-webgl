<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const minLod = 0;
const maxLod = 10;
const lodBias = 2;
const samplerCount = 8;
const mipLevels = 8;
const texBaseSize = 256;
const lodIterations = 16;

const lodMinParam = 33082;
const lodMaxParam = 33083;
const filterTarget = 10241;
const wrapMode = 10242;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.texStorage2D(gl.TEXTURE_2D, mipLevels, gl.RGBA8, texBaseSize, texBaseSize);
        gl.bindTexture(gl.TEXTURE_2D, tex2);
        gl.texStorage2D(gl.TEXTURE_2D, 6, gl.RGBA8, 128, 128);
        gl.bindTexture(gl.TEXTURE_2D, tex3);
        gl.texStorage2D(gl.TEXTURE_2D, 4, gl.RGBA8, 64, 64);
    } catch(e) { console.log(e); }

    try {
        const s1 = gl.createSampler();
        const s2 = gl.createSampler();
        const s3 = gl.createSampler();
        gl.samplerParameteri(s1, lodMinParam, minLod);
        gl.samplerParameteri(s1, lodMaxParam, maxLod);
        gl.samplerParameteri(s2, lodMinParam, 0);
        gl.samplerParameteri(s2, lodMaxParam, 5);
        gl.samplerParameteri(s3, lodMinParam, 2);
        gl.samplerParameteri(s3, lodMaxParam, 8);
    } catch(e) { console.log(e); }

    try {
        const samA = gl.createSampler();
        const samB = gl.createSampler();
        gl.samplerParameterf(samA, lodMinParam, 0.0);
        gl.samplerParameterf(samA, lodMaxParam, 10.0);
        gl.samplerParameterf(samB, lodMinParam, 1.5);
        gl.samplerParameterf(samB, lodMaxParam, 7.5);
        gl.samplerParameteri(samA, filterTarget, 9987);
        gl.samplerParameteri(samB, filterTarget, 9729);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < samplerCount; i++) {
            const sam = gl.createSampler();
            gl.samplerParameteri(sam, lodMinParam, i);
            gl.samplerParameteri(sam, lodMaxParam, i + 4);
            gl.samplerParameteri(sam, filterTarget, 9987);
            gl.samplerParameteri(sam, wrapMode, 33071);
            gl.bindSampler(i % 8, sam);
        }
    } catch(e) { console.log(e); }

    try {
        const lodSam1 = gl.createSampler();
        const lodSam2 = gl.createSampler();
        const lodSam3 = gl.createSampler();
        gl.bindSampler(0, lodSam1);
        gl.bindSampler(1, lodSam2);
        gl.bindSampler(0, lodSam3);
        gl.samplerParameteri(lodSam1, lodMinParam, 0);
        gl.samplerParameteri(lodSam1, lodMaxParam, 10);
        gl.samplerParameteri(lodSam2, lodMinParam, 2);
        gl.samplerParameteri(lodSam2, lodMaxParam, 6);
        gl.bindSampler(1, lodSam1);
        gl.bindSampler(0, lodSam2);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec2 vUv;
            out float vLod;
            void main() {
                vUv = position.xy * 0.5 + 0.5;
                vLod = position.z * 5.0 + 5.0;
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            uniform sampler2D uTex0;
            uniform sampler2D uTex1;
            uniform sampler2D uTex2;
            in vec2 vUv;
            in float vLod;
            out vec4 fragColor;
            void main() {
                vec4 c0 = textureLod(uTex0, vUv, vLod);
                vec4 c1 = textureLod(uTex1, vUv * 2.0, vLod * 0.5);
                vec4 c2 = textureLod(uTex2, vUv * 0.5, vLod * 1.5);
                fragColor = (c0 + c1 + c2) / 3.0;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([
            -1, -1, 0,
             1, -1, 0,
            -1,  1, 0,
            -1,  1, 0,
             1, -1, 0,
             1,  1, 0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        const baseLevel = 33084;
        const maxLevel = 33085;
        gl.activeTexture(gl.TEXTURE0);
        const t0 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t0);
        gl.texStorage2D(gl.TEXTURE_2D, 8, gl.RGBA8, 256, 256);
        gl.texParameteri(gl.TEXTURE_2D, baseLevel, 0);
        gl.texParameteri(gl.TEXTURE_2D, maxLevel, 7);
        gl.activeTexture(gl.TEXTURE1);
        const t1 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t1);
        gl.texStorage2D(gl.TEXTURE_2D, 6, gl.RGBA8, 128, 128);
        gl.texParameteri(gl.TEXTURE_2D, baseLevel, 1);
        gl.texParameteri(gl.TEXTURE_2D, maxLevel, 5);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < lodIterations; i++) {
            const lodSam = gl.createSampler();
            gl.samplerParameteri(lodSam, lodMinParam, i % 8);
            gl.samplerParameteri(lodSam, lodMaxParam, (i % 8) + 4);
            gl.bindSampler(0, lodSam);
            gl.bindSampler(1, lodSam);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    } catch(e) { console.log(e); }

    try {
        const finalSam1 = gl.createSampler();
        const finalSam2 = gl.createSampler();
        gl.samplerParameteri(finalSam1, lodMinParam, 0);
        gl.samplerParameteri(finalSam1, lodMaxParam, 10);
        gl.samplerParameteri(finalSam2, lodMinParam, 3);
        gl.samplerParameteri(finalSam2, lodMaxParam, 7);
        gl.bindSampler(0, finalSam1);
        gl.bindSampler(1, finalSam2);
        gl.bindSampler(2, finalSam1);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

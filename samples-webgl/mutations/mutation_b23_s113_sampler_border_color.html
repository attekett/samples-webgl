<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const samplerCount = 8;
const borderColors = 16;
const wrapModes = 4;
const texSize = 128;
const bindCycles = 24;
const colorVariations = 12;

const wrapSParam = 10242;
const wrapTParam = 10243;
const clampEdge = 33071;
const repeat = 10497;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        const tex4 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(gl.TEXTURE_2D, tex2);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(gl.TEXTURE_2D, tex3);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 64, 64, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(gl.TEXTURE_2D, tex4);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) { console.log(e); }

    try {
        const s1 = gl.createSampler();
        const s2 = gl.createSampler();
        const s3 = gl.createSampler();
        gl.samplerParameteri(s1, wrapSParam, clampEdge);
        gl.samplerParameteri(s1, wrapTParam, clampEdge);
        gl.samplerParameteri(s2, wrapSParam, repeat);
        gl.samplerParameteri(s2, wrapTParam, 33648);
        gl.samplerParameteri(s3, wrapSParam, 33071);
        gl.samplerParameteri(s3, wrapTParam, 10497);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < samplerCount; i++) {
            const sam = gl.createSampler();
            gl.samplerParameteri(sam, wrapSParam, clampEdge);
            gl.samplerParameteri(sam, wrapTParam, clampEdge);
            gl.samplerParameteri(sam, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.samplerParameteri(sam, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.bindSampler(i % 8, sam);
        }
    } catch(e) { console.log(e); }

    try {
        const samA = gl.createSampler();
        const samB = gl.createSampler();
        const samC = gl.createSampler();
        const samD = gl.createSampler();
        gl.bindSampler(0, samA);
        gl.bindSampler(1, samB);
        gl.bindSampler(0, samC);
        gl.bindSampler(1, samD);
        gl.samplerParameteri(samA, wrapSParam, 33071);
        gl.samplerParameteri(samB, wrapTParam, 10497);
        gl.bindSampler(2, samA);
        gl.bindSampler(3, samB);
        gl.bindSampler(2, samC);
    } catch(e) { console.log(e); }

    try {
        const wrapSampler1 = gl.createSampler();
        const wrapSampler2 = gl.createSampler();
        gl.samplerParameteri(wrapSampler1, wrapSParam, clampEdge);
        gl.samplerParameteri(wrapSampler1, wrapTParam, repeat);
        gl.samplerParameteri(wrapSampler2, wrapSParam, 33648);
        gl.samplerParameteri(wrapSampler2, wrapTParam, clampEdge);
        gl.bindSampler(0, wrapSampler1);
        gl.bindSampler(1, wrapSampler2);
        gl.bindSampler(0, wrapSampler2);
        gl.bindSampler(1, wrapSampler1);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec2 vUv;
            void main() {
                vUv = position.xy * 2.0;
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            uniform sampler2D uTex0;
            uniform sampler2D uTex1;
            uniform sampler2D uTex2;
            uniform sampler2D uTex3;
            in vec2 vUv;
            out vec4 fragColor;
            void main() {
                vec2 edgeUv = vUv * 1.5 - 0.25;
                vec4 c0 = texture(uTex0, edgeUv);
                vec4 c1 = texture(uTex1, edgeUv * 2.0);
                vec4 c2 = texture(uTex2, edgeUv * 0.5);
                vec4 c3 = texture(uTex3, edgeUv * 4.0);
                fragColor = (c0 + c1 + c2 + c3) * 0.25;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([
            -1, -1, 0,
             1, -1, 0,
            -1,  1, 0,
            -1,  1, 0,
             1, -1, 0,
             1,  1, 0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        gl.activeTexture(gl.TEXTURE0);
        const t0 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t0);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 128, 128, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.activeTexture(gl.TEXTURE1);
        const t1 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.activeTexture(gl.TEXTURE2);
        const t2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t2);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 64, 64, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.activeTexture(gl.TEXTURE3);
        const t3 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t3);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 32, 32, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < colorVariations; i++) {
            const colorSam = gl.createSampler();
            const wrapS = (i % 2 === 0) ? clampEdge : repeat;
            const wrapT = (i % 3 === 0) ? 33648 : clampEdge;
            gl.samplerParameteri(colorSam, wrapSParam, wrapS);
            gl.samplerParameteri(colorSam, wrapTParam, wrapT);
            gl.bindSampler(i % 4, colorSam);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    } catch(e) { console.log(e); }

    try {
        const finalSam1 = gl.createSampler();
        const finalSam2 = gl.createSampler();
        const finalSam3 = gl.createSampler();
        gl.samplerParameteri(finalSam1, wrapSParam, clampEdge);
        gl.samplerParameteri(finalSam2, wrapTParam, repeat);
        gl.samplerParameteri(finalSam3, wrapSParam, 33648);
        gl.bindSampler(0, finalSam1);
        gl.bindSampler(1, finalSam2);
        gl.bindSampler(2, finalSam3);
        gl.bindSampler(0, finalSam2);
        gl.bindSampler(1, finalSam3);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

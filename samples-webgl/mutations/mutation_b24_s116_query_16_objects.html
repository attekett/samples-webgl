<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const queryCount = 16;
const queryTypes = 4;
const pollCycles = 64;
const drawCycles = 32;
const vertexCount = 6;
const bufferSize = 4096;

const queryTargetOcclusion = 35887;
const queryTargetTF = 35976;
const queryResultAvailable = 34919;
const queryResult = 34918;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position * 0.5, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.8, 0.3, 0.5, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        const vertices = new Float32Array([
            -0.8, -0.8, 0.0,
            0.8, -0.8, 0.0,
            0.0, 0.8, 0.0,
            -0.5, 0.5, 0.0,
            0.5, 0.5, 0.0,
            0.0, -0.5, 0.0
        ]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertices);
    } catch(e) { console.log(e); }

    try {
        const query1 = gl.createQuery();
        const query2 = gl.createQuery();
        const query3 = gl.createQuery();
        const query4 = gl.createQuery();
        const query5 = gl.createQuery();
        const query6 = gl.createQuery();
        const query7 = gl.createQuery();
        const query8 = gl.createQuery();
        const query9 = gl.createQuery();
        const query10 = gl.createQuery();
        const query11 = gl.createQuery();
        const query12 = gl.createQuery();
        const query13 = gl.createQuery();
        const query14 = gl.createQuery();
        const query15 = gl.createQuery();
        const query16 = gl.createQuery();
    } catch(e) { console.log(e); }

    try {
        const tfBuffer1 = gl.createBuffer();
        const tfBuffer2 = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer2);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 2048, gl.DYNAMIC_COPY);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer2);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 1024, gl.DYNAMIC_COPY);
    } catch(e) { console.log(e); }

    try {
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        const q1 = gl.createQuery();
        const q2 = gl.createQuery();
        const q3 = gl.createQuery();
        const q4 = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, q1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, q2);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, q3);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, q4);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
    } catch(e) { console.log(e); }

    try {
        const q5 = gl.createQuery();
        const q6 = gl.createQuery();
        const q7 = gl.createQuery();
        const q8 = gl.createQuery();
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, q5);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, q6);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, q7);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, q8);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
    } catch(e) { console.log(e); }

    try {
        const query9 = gl.createQuery();
        const query10 = gl.createQuery();
        const query11 = gl.createQuery();
        const query12 = gl.createQuery();
        gl.beginQuery(35887, query9);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(35887);
        gl.beginQuery(35887, query10);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
        gl.endQuery(35887);
        gl.beginQuery(36202, query11);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(36202);
        gl.beginQuery(36202, query12);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(36202);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < pollCycles; i++) {
            const tempQ = gl.createQuery();
            gl.beginQuery(gl.ANY_SAMPLES_PASSED, tempQ);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.endQuery(gl.ANY_SAMPLES_PASSED);
            const available = gl.getQueryParameter(tempQ, queryResultAvailable);
            if (available) {
                const result = gl.getQueryParameter(tempQ, queryResult);
            }
        }
    } catch(e) { console.log(e); }

    try {
        const multiQ1 = gl.createQuery();
        const multiQ2 = gl.createQuery();
        const multiQ3 = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, multiQ1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, multiQ2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, multiQ3);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.deleteQuery(multiQ1);
        gl.deleteQuery(multiQ2);
        gl.deleteQuery(multiQ3);
    } catch(e) { console.log(e); }

    try {
        for (let cycle = 0; cycle < drawCycles; cycle++) {
            const cycleQuery = gl.createQuery();
            gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, cycleQuery);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
        }
    } catch(e) { console.log(e); }

    try {
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

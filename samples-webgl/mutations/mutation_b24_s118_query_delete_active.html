<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const deleteCount = 12;
const recreateCount = 12;
const activeDeleteCycles = 8;
const vertexCount = 6;
const bufferSize = 2048;

const queryTargetOcclusion = 35887;
const queryTargetConservative = 36202;
const queryResultAvailable = 34919;
const queryResult = 34918;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            uniform float uScale;
            void main() {
                gl_Position = vec4(position * uScale, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            uniform vec3 uColor;
            void main() {
                fragColor = vec4(uColor, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, bufferSize, gl.STATIC_DRAW);
        const vertices = new Float32Array([
            -0.9, -0.7, 0.0,
            0.9, -0.7, 0.0,
            0.0, 0.9, 0.0,
            -0.5, 0.6, 0.0,
            0.5, 0.6, 0.0,
            0.0, -0.5, 0.0
        ]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertices);
    } catch(e) { console.log(e); }

    try {
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        const q1 = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, q1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.deleteQuery(q1);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) { console.log(e); }

    try {
        const q2 = gl.createQuery();
        const q3 = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, q2);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
        gl.deleteQuery(q2);
        gl.deleteQuery(q2);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, q3);
        gl.deleteQuery(q3);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
    } catch(e) { console.log(e); }

    try {
        const activeQ1 = gl.createQuery();
        const activeQ2 = gl.createQuery();
        gl.beginQuery(queryTargetOcclusion, activeQ1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.deleteQuery(activeQ1);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(queryTargetOcclusion);
        gl.beginQuery(queryTargetOcclusion, activeQ2);
        gl.deleteQuery(activeQ2);
        gl.endQuery(queryTargetOcclusion);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < activeDeleteCycles; i++) {
            const cycleQ = gl.createQuery();
            gl.beginQuery(gl.ANY_SAMPLES_PASSED, cycleQ);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.deleteQuery(cycleQ);
            gl.endQuery(gl.ANY_SAMPLES_PASSED);
            const available = gl.getQueryParameter(cycleQ, queryResultAvailable);
        }
    } catch(e) { console.log(e); }

    try {
        const reuseQ1 = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, reuseQ1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
        gl.deleteQuery(reuseQ1);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, reuseQ1);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
    } catch(e) { console.log(e); }

    try {
        const recycleQ1 = gl.createQuery();
        const recycleQ2 = gl.createQuery();
        const recycleQ3 = gl.createQuery();
        gl.beginQuery(36202, recycleQ1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(36202);
        gl.deleteQuery(recycleQ1);
        gl.beginQuery(36202, recycleQ2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(36202);
        gl.deleteQuery(recycleQ2);
        gl.beginQuery(36202, recycleQ3);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(36202);
        gl.deleteQuery(recycleQ3);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < deleteCount; i++) {
            const tempQ = gl.createQuery();
            gl.beginQuery(gl.ANY_SAMPLES_PASSED, tempQ);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.endQuery(gl.ANY_SAMPLES_PASSED);
            gl.deleteQuery(tempQ);
            gl.deleteQuery(tempQ);
        }
    } catch(e) { console.log(e); }

    try {
        const uafQ1 = gl.createQuery();
        const uafQ2 = gl.createQuery();
        gl.beginQuery(queryTargetOcclusion, uafQ1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(queryTargetOcclusion);
        gl.deleteQuery(uafQ1);
        const available1 = gl.getQueryParameter(uafQ1, queryResultAvailable);
        const result1 = gl.getQueryParameter(uafQ1, queryResult);
        gl.beginQuery(queryTargetOcclusion, uafQ2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(queryTargetOcclusion);
        gl.deleteQuery(uafQ2);
        const available2 = gl.getQueryParameter(uafQ2, queryResultAvailable);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < recreateCount; i++) {
            const recreateQ = gl.createQuery();
            gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, recreateQ);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
            gl.deleteQuery(recreateQ);
        }
    } catch(e) { console.log(e); }

    try {
        const multiDeleteQ1 = gl.createQuery();
        const multiDeleteQ2 = gl.createQuery();
        const multiDeleteQ3 = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, multiDeleteQ1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, multiDeleteQ2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, multiDeleteQ3);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.deleteQuery(multiDeleteQ1);
        gl.deleteQuery(multiDeleteQ2);
        gl.deleteQuery(multiDeleteQ3);
        gl.deleteQuery(multiDeleteQ1);
        gl.deleteQuery(multiDeleteQ2);
        gl.deleteQuery(multiDeleteQ3);
    } catch(e) { console.log(e); }

    try {
        gl.clearColor(0.2, 0.1, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

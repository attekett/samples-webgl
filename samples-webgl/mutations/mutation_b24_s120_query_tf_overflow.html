<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const bufferSize = 1024;
const primitiveCount = 2048;
const overflowQueries = 8;
const vertexCount = 6;
const tfPrimitives = 512;

const tfPrimitivesWritten = 35976;
const primitivesGenerated = 35975;
const queryResultAvailable = 34919;
const queryResult = 34918;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vPosition;
            out vec3 vNormal;
            out vec2 vTexCoord;
            uniform float uScale;
            void main() {
                vPosition = position * uScale;
                vNormal = normalize(cross(dFdx(vPosition), dFdy(vPosition)));
                vTexCoord = position.xy * 0.5 + 0.5;
                gl_Position = vec4(vPosition, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vPosition;
            in vec3 vNormal;
            in vec2 vTexCoord;
            out vec4 fragColor;
            void main() {
                vec3 color = vec3(0.6, 0.4, 0.7);
                fragColor = vec4(color, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vPosition', 'vNormal', 'vTexCoord'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([
            -0.8, -0.8, 0.0,
            0.8, -0.8, 0.0,
            0.0, 0.8, 0.0,
            -0.6, 0.6, 0.0,
            0.6, 0.6, 0.0,
            0.0, -0.6, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    } catch(e) { console.log(e); }

    try {
        const tfBuffer1 = gl.createBuffer();
        const tfBuffer2 = gl.createBuffer();
        const tfBuffer3 = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer2);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer3);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, bufferSize, gl.DYNAMIC_COPY);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer2);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 512, gl.DYNAMIC_COPY);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer3);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 256, gl.DYNAMIC_COPY);
    } catch(e) { console.log(e); }

    try {
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        const tf = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1);
        const q1 = gl.createQuery();
        const q2 = gl.createQuery();
        gl.beginQuery(tfPrimitivesWritten, q1);
        gl.beginQuery(primitivesGenerated, q2);
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitivesWritten);
        gl.endQuery(primitivesGenerated);
    } catch(e) { console.log(e); }

    try {
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer2);
        const overflowQ1 = gl.createQuery();
        const overflowQ2 = gl.createQuery();
        gl.beginQuery(35976, overflowQ1);
        gl.beginQuery(35975, overflowQ2);
        gl.beginTransformFeedback(gl.TRIANGLES);
        for (let i = 0; i < primitiveCount; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        gl.endTransformFeedback();
        gl.endQuery(35976);
        gl.endQuery(35975);
    } catch(e) { console.log(e); }

    try {
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer3);
        const smallBufQ1 = gl.createQuery();
        const smallBufQ2 = gl.createQuery();
        gl.beginQuery(tfPrimitivesWritten, smallBufQ1);
        gl.beginQuery(primitivesGenerated, smallBufQ2);
        gl.beginTransformFeedback(gl.TRIANGLES);
        for (let i = 0; i < 512; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        }
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitivesWritten);
        gl.endQuery(primitivesGenerated);
        const a1 = gl.getQueryParameter(smallBufQ1, queryResultAvailable);
        const a2 = gl.getQueryParameter(smallBufQ2, queryResultAvailable);
        if (a1 && a2) {
            const r1 = gl.getQueryParameter(smallBufQ1, queryResult);
            const r2 = gl.getQueryParameter(smallBufQ2, queryResult);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < overflowQueries; i++) {
            const cycleQ1 = gl.createQuery();
            const cycleQ2 = gl.createQuery();
            gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1);
            gl.beginQuery(tfPrimitivesWritten, cycleQ1);
            gl.beginQuery(primitivesGenerated, cycleQ2);
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
            gl.endTransformFeedback();
            gl.endQuery(tfPrimitivesWritten);
            gl.endQuery(primitivesGenerated);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer2);
        const comparisonQ1 = gl.createQuery();
        const comparisonQ2 = gl.createQuery();
        const comparisonQ3 = gl.createQuery();
        const comparisonQ4 = gl.createQuery();
        gl.beginQuery(35976, comparisonQ1);
        gl.beginQuery(35975, comparisonQ2);
        gl.beginTransformFeedback(gl.TRIANGLES);
        for (let i = 0; i < 128; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        gl.endTransformFeedback();
        gl.endQuery(35976);
        gl.endQuery(35975);
        gl.beginQuery(35976, comparisonQ3);
        gl.beginQuery(35975, comparisonQ4);
        gl.beginTransformFeedback(gl.TRIANGLES);
        for (let i = 0; i < 256; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        gl.endTransformFeedback();
        gl.endQuery(35976);
        gl.endQuery(35975);
    } catch(e) { console.log(e); }

    try {
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer3);
        const recoveryQ1 = gl.createQuery();
        const recoveryQ2 = gl.createQuery();
        gl.beginQuery(tfPrimitivesWritten, recoveryQ1);
        gl.beginQuery(primitivesGenerated, recoveryQ2);
        gl.beginTransformFeedback(gl.TRIANGLES);
        for (let i = 0; i < tfPrimitives; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitivesWritten);
        gl.endQuery(primitivesGenerated);
        for (let i = 0; i < 64; i++) {
            const a1 = gl.getQueryParameter(recoveryQ1, queryResultAvailable);
            const a2 = gl.getQueryParameter(recoveryQ2, queryResultAvailable);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1);
        const multiOverflowQ1 = gl.createQuery();
        const multiOverflowQ2 = gl.createQuery();
        gl.beginQuery(tfPrimitivesWritten, multiOverflowQ1);
        gl.beginQuery(primitivesGenerated, multiOverflowQ2);
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitivesWritten);
        gl.endQuery(primitivesGenerated);
        const a1 = gl.getQueryParameter(multiOverflowQ1, queryResultAvailable);
        const a2 = gl.getQueryParameter(multiOverflowQ2, queryResultAvailable);
        if (a1 && a2) {
            const r1 = gl.getQueryParameter(multiOverflowQ1, queryResult);
            const r2 = gl.getQueryParameter(multiOverflowQ2, queryResult);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.clearColor(0.1, 0.15, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

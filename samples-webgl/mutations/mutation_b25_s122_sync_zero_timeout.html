<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const pollCount = 512;
const fenceCount = 8;
const nonBlockCycles = 64;
const drawIterations = 24;

const timeoutValue = 0;
const syncCondition = 0x9113;
const statusAlreadySignaled = 0x911A;
const statusTimeoutExpired = 0x911B;
const statusConditionSatisfied = 0x911C;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, `#version 300 es
        in vec3 position;
        void main() {
            gl_Position = vec4(position, 1.0);
        }
    `);
    gl.compileShader(vs);

    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, `#version 300 es
        precision highp float;
        out vec4 color;
        void main() {
            color = vec4(0.4, 0.7, 0.3, 1.0);
        }
    `);
    gl.compileShader(fs);

    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    try {
        const buffer = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, 2048, gl.STATIC_DRAW);
        gl.bufferData(gl.ARRAY_BUFFER, 4096, gl.DYNAMIC_DRAW);
        const vertexData = new Float32Array([0.0, 0.5, 0.0, -0.5, -0.5, 0.0, 0.5, -0.5, 0.0]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertexData);
    } catch(e) { console.log(e); }

    try {
        const loc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 12, 0);
        gl.disableVertexAttribArray(loc);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) { console.log(e); }

    const syncs = [];

    try {
        for (let i = 0; i < fenceCount; i++) {
            syncs.push(gl.fenceSync(syncCondition, 0));
        }
        for (let i = 0; i < fenceCount; i++) {
            syncs.push(gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0));
        }
    } catch(e) { console.log(e); }

    try {
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.flush();
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < pollCount; i++) {
            const idx = i % syncs.length;
            if (syncs[idx]) {
                const status = gl.clientWaitSync(syncs[idx], 0, timeoutValue);
            }
        }
    } catch(e) { console.log(e); }

    try {
        for (let cycle = 0; cycle < nonBlockCycles; cycle++) {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            for (let poll = 0; poll < 8; poll++) {
                gl.clientWaitSync(sync, 0, 0);
            }
            gl.deleteSync(sync);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < drawIterations; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.clientWaitSync(sync, 0, 0);
            gl.clientWaitSync(sync, 0, 0);
            gl.clientWaitSync(sync, 0, 0);
            syncs.push(sync);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < syncs.length; i++) {
            if (syncs[i]) {
                gl.clientWaitSync(syncs[i], 0, timeoutValue);
                gl.clientWaitSync(syncs[i], 0, 0);
            }
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < 32; i++) {
            const s1 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            const s2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.clientWaitSync(s1, 0, 0);
            gl.clientWaitSync(s2, 0, 0);
            gl.clientWaitSync(s1, 0, 0);
            gl.deleteSync(s1);
            gl.deleteSync(s2);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < 128; i++) {
            const idx = i % syncs.length;
            if (syncs[idx]) {
                const result = gl.clientWaitSync(syncs[idx], 0, 0);
            }
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < syncs.length; i++) {
            if (syncs[i]) {
                gl.deleteSync(syncs[i]);
            }
        }
    } catch(e) { console.log(e); }

    try {
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.flush();
        gl.finish();
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

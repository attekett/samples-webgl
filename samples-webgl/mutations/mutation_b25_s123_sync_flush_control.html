<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const flushCount = 32;
const noFlushCount = 32;
const syncCount = 8;
const waitIterations = 48;
const drawCycles = 16;

const flushBit = 0x00000001;
const syncCondition = 0x9113;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, `#version 300 es
        in vec3 aPos;
        void main() {
            gl_Position = vec4(aPos, 1.0);
        }
    `);
    gl.compileShader(vs);

    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, `#version 300 es
        precision highp float;
        out vec4 outColor;
        void main() {
            outColor = vec4(0.8, 0.4, 0.2, 1.0);
        }
    `);
    gl.compileShader(fs);

    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.useProgram(prog);

    try {
        const buf1 = gl.createBuffer();
        const buf2 = gl.createBuffer();
        const buf3 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf3);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, 3072, gl.STATIC_DRAW);
        gl.bufferData(gl.ARRAY_BUFFER, 6144, gl.DYNAMIC_DRAW);
        const vertices = new Float32Array([-0.6, 0.6, 0.0, 0.6, 0.6, 0.0, 0.0, -0.6, 0.0]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertices);
    } catch(e) { console.log(e); }

    try {
        const posAttr = gl.getAttribLocation(prog, 'aPos');
        gl.enableVertexAttribArray(posAttr);
        gl.vertexAttribPointer(posAttr, 3, gl.FLOAT, false, 12, 0);
        gl.disableVertexAttribArray(posAttr);
        gl.enableVertexAttribArray(posAttr);
        gl.vertexAttribPointer(posAttr, 3, gl.FLOAT, false, 0, 0);
    } catch(e) { console.log(e); }

    const syncObjects = [];

    try {
        for (let i = 0; i < syncCount; i++) {
            syncObjects.push(gl.fenceSync(syncCondition, 0));
        }
        for (let i = 0; i < syncCount; i++) {
            syncObjects.push(gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0));
        }
    } catch(e) { console.log(e); }

    try {
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.flush();
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < flushCount; i++) {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.clientWaitSync(sync, flushBit, 1000);
            gl.clientWaitSync(sync, gl.SYNC_FLUSH_COMMANDS_BIT, 1000);
            gl.deleteSync(sync);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < noFlushCount; i++) {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.clientWaitSync(sync, 0, 1000);
            gl.clientWaitSync(sync, 0, 1000);
            gl.deleteSync(sync);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < drawCycles; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            const s1 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.clientWaitSync(s1, gl.SYNC_FLUSH_COMMANDS_BIT, 500);
            const s2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.clientWaitSync(s2, 0, 500);
            gl.deleteSync(s1);
            gl.deleteSync(s2);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < waitIterations; i++) {
            const idx = i % syncObjects.length;
            if (syncObjects[idx]) {
                if (i % 2 === 0) {
                    gl.clientWaitSync(syncObjects[idx], flushBit, 100);
                } else {
                    gl.clientWaitSync(syncObjects[idx], 0, 100);
                }
            }
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < 24; i++) {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.clientWaitSync(sync, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
            gl.clientWaitSync(sync, 0, 0);
            gl.clientWaitSync(sync, flushBit, 0);
            gl.deleteSync(sync);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < 16; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            const s = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            gl.clientWaitSync(s, 0, 0);
            gl.flush();
            gl.clientWaitSync(s, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
            syncObjects.push(s);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < syncObjects.length; i++) {
            if (syncObjects[i]) {
                gl.clientWaitSync(syncObjects[i], gl.SYNC_FLUSH_COMMANDS_BIT, 10);
                gl.deleteSync(syncObjects[i]);
            }
        }
    } catch(e) { console.log(e); }

    try {
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.flush();
        gl.finish();
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

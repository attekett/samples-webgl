<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const parameterQueries = 256;
const syncCount = 8;
const pollVariations = 16;
const drawsPerQuery = 4;

const objectType = 0x9110;
const syncStatus = 0x9114;
const syncConditionParam = 0x9113;
const syncFlagsParam = 0x9115;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, `#version 300 es
        in vec3 pos;
        void main() {
            gl_Position = vec4(pos, 1.0);
        }
    `);
    gl.compileShader(vs);

    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, `#version 300 es
        precision highp float;
        out vec4 color;
        void main() {
            color = vec4(0.3, 0.5, 0.9, 1.0);
        }
    `);
    gl.compileShader(fs);

    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.useProgram(program);

    try {
        const buf1 = gl.createBuffer();
        const buf2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, 2048, gl.STATIC_DRAW);
        gl.bufferData(gl.ARRAY_BUFFER, 4096, gl.DYNAMIC_DRAW);
        const data = new Float32Array([0.0, 0.6, 0.0, -0.5, -0.6, 0.0, 0.5, -0.6, 0.0]);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
    } catch(e) { console.log(e); }

    try {
        const posLoc = gl.getAttribLocation(program, 'pos');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
        gl.disableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) { console.log(e); }

    const syncs = [];

    try {
        for (let i = 0; i < syncCount; i++) {
            syncs.push(gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0));
        }
        for (let i = 0; i < syncCount; i++) {
            syncs.push(gl.fenceSync(syncConditionParam, 0));
        }
    } catch(e) { console.log(e); }

    try {
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.flush();
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < parameterQueries; i++) {
            const idx = i % syncs.length;
            if (syncs[idx]) {
                const type = gl.getSyncParameter(syncs[idx], objectType);
                const status = gl.getSyncParameter(syncs[idx], syncStatus);
                const condition = gl.getSyncParameter(syncs[idx], syncConditionParam);
                const flags = gl.getSyncParameter(syncs[idx], syncFlagsParam);
            }
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < pollVariations; i++) {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);

            for (let j = 0; j < 16; j++) {
                gl.getSyncParameter(sync, syncStatus);
                gl.getSyncParameter(sync, objectType);
            }

            gl.deleteSync(sync);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < drawsPerQuery; i++) {
            gl.drawArrays(gl.TRIANGLES, 0, 3);

            const s = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);

            gl.getSyncParameter(s, syncStatus);
            gl.getSyncParameter(s, syncStatus);
            gl.getSyncParameter(s, objectType);
            gl.getSyncParameter(s, syncConditionParam);
            gl.getSyncParameter(s, syncFlagsParam);

            syncs.push(s);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < syncs.length; i++) {
            if (syncs[i]) {
                gl.getSyncParameter(syncs[i], syncStatus);
                gl.getSyncParameter(syncs[i], objectType);
                gl.getSyncParameter(syncs[i], syncConditionParam);
                gl.getSyncParameter(syncs[i], syncFlagsParam);
                gl.getSyncParameter(syncs[i], syncStatus);
            }
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < 32; i++) {
            const sync1 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            const sync2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);

            gl.getSyncParameter(sync1, syncStatus);
            gl.getSyncParameter(sync2, syncStatus);
            gl.getSyncParameter(sync1, objectType);
            gl.getSyncParameter(sync2, objectType);

            gl.deleteSync(sync1);
            gl.deleteSync(sync2);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < 64; i++) {
            const idx = i % syncs.length;
            if (syncs[idx]) {
                const s = gl.getSyncParameter(syncs[idx], syncStatus);
                const t = gl.getSyncParameter(syncs[idx], objectType);
            }
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < syncs.length; i++) {
            if (syncs[i]) {
                gl.getSyncParameter(syncs[i], syncStatus);
                gl.deleteSync(syncs[i]);
            }
        }
    } catch(e) { console.log(e); }

    try {
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.flush();
        gl.finish();
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

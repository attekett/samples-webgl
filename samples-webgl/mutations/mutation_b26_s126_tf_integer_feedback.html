<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const tfBufferSize = 8192;
const intComponents = 4;
const feedbackCycles = 16;
const vertexCount = 6;
const texSize = 256;
const tfPrimitives = vertexCount / 3;
const dataStride = intComponents * 4;

const bufferTarget = 35345;
const bufferUsage = 35048;
const textureTarget = 3553;
const intFormat = 36227;
const tfMode = 36386;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            flat out ivec4 vIntData;
            void main() {
                gl_Position = vec4(position, 1.0);
                vIntData = ivec4(int(position.x * 127.0), int(position.y * 127.0), int(position.z * 127.0), 42);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            flat in ivec4 vIntData;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(float(vIntData.x) / 127.0, float(vIntData.y) / 127.0, float(vIntData.z) / 127.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vIntData'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const tfBuffer1 = gl.createBuffer();
        const tfBuffer2 = gl.createBuffer();
        const tfBuffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, tfBuffer1);
        gl.bindBuffer(bufferTarget, tfBuffer2);
        gl.bindBuffer(bufferTarget, tfBuffer1);
        gl.bufferData(bufferTarget, tfBufferSize, bufferUsage);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer2);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 16384, gl.STATIC_DRAW);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer3);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, tfBufferSize, gl.DYNAMIC_COPY);
    } catch(e) { console.log(e); }

    try {
        const intTex1 = gl.createTexture();
        const intTex2 = gl.createTexture();
        gl.bindTexture(textureTarget, intTex1);
        gl.texStorage2D(textureTarget, 1, intFormat, texSize, texSize);
        gl.bindTexture(textureTarget, intTex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32I, 512, 512);
        gl.bindTexture(textureTarget, intTex1);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) { console.log(e); }

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const positions = new Float32Array([
            -0.8, -0.8, 0.0,
             0.8, -0.8, 0.0,
             0.0,  0.8, 0.0,
            -0.6, -0.6, 0.0,
             0.6, -0.6, 0.0,
             0.0,  0.6, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        const tf = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer2);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.endTransformFeedback();
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < feedbackCycles; i++) {
            gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, i % 2 === 0 ? tfBuffer1 : tfBuffer2);
            gl.enable(gl.RASTERIZER_DISCARD);
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.endTransformFeedback();
            gl.disable(gl.RASTERIZER_DISCARD);
        }
    } catch(e) { console.log(e); }

    try {
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) { console.log(e); }

    try {
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.deleteBuffer(tfBuffer1);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.deleteBuffer(tfBuffer2);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer2);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const tfQueries = 6;
const occlusionQueries = 6;
const combinedCycles = 24;
const vertexCount = 6;
const bufferSize = 4096;
const queryPollLimit = 128;

const tfPrimitivesQuery = 35976;
const anySamplesQuery = 35887;
const queryResult = 34918;
const queryAvailable = 34919;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vColor;
            void main() {
                gl_Position = vec4(position, 1.0);
                vColor = position * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec3 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(vColor, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vColor'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const tfQuery1 = gl.createQuery();
        const tfQuery2 = gl.createQuery();
        const tfQuery3 = gl.createQuery();
        const occQuery1 = gl.createQuery();
        const occQuery2 = gl.createQuery();
        const occQuery3 = gl.createQuery();
    } catch(e) { console.log(e); }

    try {
        const tfBuffer = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, bufferSize, gl.DYNAMIC_COPY);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 8192, gl.STATIC_DRAW);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer);
    } catch(e) { console.log(e); }

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const positions = new Float32Array([
            -0.7, -0.7, 0.0,
             0.7, -0.7, 0.0,
             0.0,  0.7, 0.0,
            -0.5, -0.5, 0.0,
             0.5, -0.5, 0.0,
             0.0,  0.5, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < combinedCycles; i++) {
            const tfQ = gl.createQuery();
            const occQ = gl.createQuery();

            gl.beginQuery(tfPrimitivesQuery, tfQ);
            gl.beginQuery(anySamplesQuery, occQ);

            gl.enable(gl.RASTERIZER_DISCARD);
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.endTransformFeedback();
            gl.disable(gl.RASTERIZER_DISCARD);

            gl.endQuery(tfPrimitivesQuery);
            gl.endQuery(anySamplesQuery);
        }
    } catch(e) { console.log(e); }

    try {
        const q1 = gl.createQuery();
        const q2 = gl.createQuery();
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, q1);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, q2);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);

        for (let poll = 0; poll < queryPollLimit; poll++) {
            const avail1 = gl.getQueryParameter(q1, queryAvailable);
            const avail2 = gl.getQueryParameter(q2, queryAvailable);
        }
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
    } catch(e) { console.log(e); }

    try {
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

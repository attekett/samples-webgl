<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const intOutputs = 4;
const tfVaryings = 8;
const feedbackCycles = 12;
const vertexCount = 6;
const bufferSize = 4096;
const texSize = 256;

const intFormat = 36227;
const tfMode = 35980;
const fbTarget = 36160;
const colorAttach0 = 36064;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            flat out ivec4 vInt1;
            flat out ivec4 vInt2;
            out vec3 vFloat;
            void main() {
                gl_Position = vec4(position, 1.0);
                vInt1 = ivec4(int(position.x * 100.0), int(position.y * 100.0), int(position.z * 100.0), 255);
                vInt2 = ivec4(127, int(position.x * 50.0), int(position.y * 50.0), 64);
                vFloat = position * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp int;
            flat in ivec4 vInt1;
            flat in ivec4 vInt2;
            in vec3 vFloat;
            layout(location = 0) out vec4 fragColor0;
            layout(location = 1) out ivec4 fragColor1;
            layout(location = 2) out ivec4 fragColor2;
            layout(location = 3) out ivec4 fragColor3;
            void main() {
                fragColor0 = vec4(vFloat, 1.0);
                fragColor1 = vInt1;
                fragColor2 = vInt2;
                fragColor3 = ivec4(vInt1.xy, vInt2.xy);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vInt1', 'vInt2', 'vFloat'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const intTex1 = gl.createTexture();
        const intTex2 = gl.createTexture();
        const intTex3 = gl.createTexture();
        const floatTex = gl.createTexture();

        gl.bindTexture(gl.TEXTURE_2D, floatTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);

        gl.bindTexture(gl.TEXTURE_2D, intTex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, intTex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32I, 512, 512);
        gl.bindTexture(gl.TEXTURE_2D, intTex3);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, texSize, texSize);

        gl.bindTexture(gl.TEXTURE_2D, intTex1);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) { console.log(e); }

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();

        gl.bindFramebuffer(fbTarget, fbo1);
        gl.framebufferTexture2D(fbTarget, colorAttach0, gl.TEXTURE_2D, floatTex, 0);
        gl.framebufferTexture2D(fbTarget, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, intTex1, 0);
        gl.framebufferTexture2D(fbTarget, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, intTex2, 0);
        gl.framebufferTexture2D(fbTarget, gl.COLOR_ATTACHMENT3, gl.TEXTURE_2D, intTex3, 0);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3]);

        gl.bindFramebuffer(fbTarget, fbo2);
        gl.framebufferTexture2D(fbTarget, colorAttach0, gl.TEXTURE_2D, intTex1, 0);
        gl.bindFramebuffer(fbTarget, fbo1);
    } catch(e) { console.log(e); }

    try {
        const tfBuf1 = gl.createBuffer();
        const tfBuf2 = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuf1);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, bufferSize, gl.DYNAMIC_COPY);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuf2);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 8192, gl.STREAM_COPY);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuf1);
    } catch(e) { console.log(e); }

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const positions = new Float32Array([
            -0.8, -0.8, 0.0,
             0.8, -0.8, 0.0,
             0.0,  0.8, 0.0,
            -0.6, -0.6, 0.0,
             0.6, -0.6, 0.0,
             0.0,  0.6, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) { console.log(e); }

    try {
        gl.clearBufferfv(gl.COLOR, 0, [0.0, 0.0, 0.0, 1.0]);
        gl.clearBufferiv(gl.COLOR, 1, [0, 0, 0, 0]);
        gl.clearBufferiv(gl.COLOR, 2, [128, 128, 128, 255]);
        gl.clearBufferiv(gl.COLOR, 3, [64, 64, 64, 128]);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < feedbackCycles; i++) {
            const tfBuf = i % 2 === 0 ? tfBuf1 : tfBuf2;
            gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuf);

            gl.bindFramebuffer(fbTarget, fbo1);
            gl.viewport(0, 0, texSize, texSize);

            gl.enable(gl.RASTERIZER_DISCARD);
            gl.disable(gl.RASTERIZER_DISCARD);
            gl.enable(gl.RASTERIZER_DISCARD);

            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            gl.endTransformFeedback();

            gl.disable(gl.RASTERIZER_DISCARD);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(fbTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);

        gl.bindFramebuffer(fbTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
    } catch(e) { console.log(e); }

    try {
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuf1);
        gl.deleteBuffer(tfBuf1);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuf1);
        gl.bindFramebuffer(fbTarget, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(fbTarget, fbo1);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

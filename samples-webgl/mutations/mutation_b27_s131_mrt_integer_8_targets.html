<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const targetCount = 8;
const targetPixels = 256 * 256;
const bufferSize = targetPixels * 4;
const clearValue = 777;
const drawCycles = 24;
const vertexCount = 6;

const colorAttach0 = 36064;
const colorAttach1 = 36065;
const colorAttach2 = 36066;
const colorAttach3 = 36067;
const colorAttach4 = 36068;
const colorAttach5 = 36069;
const colorAttach6 = 36070;
const colorAttach7 = 36071;
const intFormat = 36226;
const intType = 36226;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex0 = gl.createTexture();
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        const tex4 = gl.createTexture();
        const tex5 = gl.createTexture();
        const tex6 = gl.createTexture();
        const tex7 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, 256, 256);
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, 256, 256);
        gl.bindTexture(gl.TEXTURE_2D, tex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, 256, 256);
        gl.bindTexture(gl.TEXTURE_2D, tex3);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, 256, 256);
        gl.bindTexture(gl.TEXTURE_2D, tex4);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, 128, 128);
        gl.bindTexture(gl.TEXTURE_2D, tex5);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, 128, 128);
        gl.bindTexture(gl.TEXTURE_2D, tex6);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, 128, 128);
        gl.bindTexture(gl.TEXTURE_2D, tex7);
        gl.texStorage2D(gl.TEXTURE_2D, 1, intFormat, 128, 128);
    } catch(e) { console.log(e); }

    try {
        const fbo = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, colorAttach0, gl.TEXTURE_2D, tex0, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, colorAttach1, gl.TEXTURE_2D, tex1, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, colorAttach2, gl.TEXTURE_2D, tex2, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, colorAttach3, gl.TEXTURE_2D, tex3, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, colorAttach4, gl.TEXTURE_2D, tex4, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, colorAttach5, gl.TEXTURE_2D, tex5, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, colorAttach6, gl.TEXTURE_2D, tex6, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, colorAttach7, gl.TEXTURE_2D, tex7, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.drawBuffers([colorAttach0, colorAttach1, colorAttach2, colorAttach3]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.drawBuffers([colorAttach4, colorAttach5, colorAttach6, colorAttach7]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() { gl_Position = vec4(position, 1.0); }
        `);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp int;
            layout(location = 0) out ivec4 fragColor0;
            layout(location = 1) out ivec4 fragColor1;
            layout(location = 2) out ivec4 fragColor2;
            layout(location = 3) out ivec4 fragColor3;
            void main() {
                fragColor0 = ivec4(777, 0, 0, 1);
                fragColor1 = ivec4(0, 777, 0, 1);
                fragColor2 = ivec4(0, 0, 777, 1);
                fragColor3 = ivec4(777, 777, 0, 1);
            }
        `);
        gl.compileShader(fs);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const vertices = new Float32Array([-1,-1,0, 1,-1,0, 1,1,0, -1,-1,0, 1,1,0, -1,1,0]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.clearBufferiv(gl.COLOR, 0, [clearValue, 0, 0, 1]);
        gl.clearBufferiv(gl.COLOR, 1, [0, clearValue, 0, 1]);
        gl.clearBufferiv(gl.COLOR, 2, [0, 0, clearValue, 1]);
        gl.clearBufferiv(gl.COLOR, 3, [clearValue, clearValue, 0, 1]);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.clearBufferiv(gl.COLOR, 0, [clearValue, 0, clearValue, 1]);
        gl.clearBufferiv(gl.COLOR, 1, [0, clearValue, clearValue, 1]);
        gl.clearBufferiv(gl.COLOR, 2, [clearValue, clearValue, clearValue, 1]);
        gl.clearBufferiv(gl.COLOR, 3, [0, 0, 0, clearValue]);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.viewport(0, 0, 128, 128);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < drawCycles; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.clearBufferiv(gl.COLOR, 0, [clearValue, clearValue, clearValue, clearValue]);
        gl.clearBufferiv(gl.COLOR, 1, [clearValue, clearValue, clearValue, clearValue]);
        gl.clearBufferiv(gl.COLOR, 2, [clearValue, clearValue, clearValue, clearValue]);
        gl.clearBufferiv(gl.COLOR, 3, [clearValue, clearValue, clearValue, clearValue]);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.deleteFramebuffer(fbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.deleteFramebuffer(fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.deleteTexture(tex0);
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.deleteTexture(tex1);
        gl.deleteTexture(tex2);
        gl.deleteTexture(tex3);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clearColor(0.2, 0.3, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

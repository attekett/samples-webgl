<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const targetCount = 8;
const blendToggles = 32;
const equationCycles = 16;
const vertexCount = 6;
const drawIterations = 24;
const texSize = 256;

const attach0 = 36064;
const attach1 = 36065;
const attach2 = 36066;
const attach3 = 36067;
const blendMode = 3042;
const srcAlpha = 770;
const oneMinusSrcAlpha = 771;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex0 = gl.createTexture();
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(gl.TEXTURE_2D, tex2);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(gl.TEXTURE_2D, tex3);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) { console.log(e); }

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach0, gl.TEXTURE_2D, tex0, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach1, gl.TEXTURE_2D, tex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach2, gl.TEXTURE_2D, tex2, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach3, gl.TEXTURE_2D, tex3, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach0, gl.TEXTURE_2D, tex0, 0);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.drawBuffers([attach0, attach1]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.drawBuffers([attach2, attach3]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() { gl_Position = vec4(position, 1.0); }
        `);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            layout(location = 0) out vec4 fragColor0;
            layout(location = 1) out vec4 fragColor1;
            layout(location = 2) out vec4 fragColor2;
            layout(location = 3) out vec4 fragColor3;
            void main() {
                fragColor0 = vec4(1.0, 0.0, 0.0, 0.5);
                fragColor1 = vec4(0.0, 1.0, 0.0, 0.5);
                fragColor2 = vec4(0.0, 0.0, 1.0, 0.5);
                fragColor3 = vec4(1.0, 1.0, 0.0, 0.5);
            }
        `);
        gl.compileShader(fs);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([-1,-1,0, 1,-1,0, 1,1,0, -1,-1,0, 1,1,0, -1,1,0]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        gl.enable(blendMode);
        gl.disable(blendMode);
        gl.enable(blendMode);
        gl.blendFunc(srcAlpha, oneMinusSrcAlpha);
        gl.disable(blendMode);
        gl.enable(blendMode);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.enable(blendMode);
        gl.blendFunci(0, srcAlpha, oneMinusSrcAlpha);
        gl.disable(blendMode);
        gl.enable(blendMode);
        gl.blendFunci(1, gl.ONE, gl.ONE);
        gl.disable(blendMode);
        gl.enable(blendMode);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < blendToggles; i++) {
            gl.enablei(blendMode, 0);
            gl.disablei(blendMode, 0);
            gl.enablei(blendMode, 1);
            gl.disablei(blendMode, 1);
            gl.enablei(blendMode, 0);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enablei(blendMode, 0);
        gl.enablei(blendMode, 1);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < equationCycles; i++) {
            gl.blendEquationi(0, gl.FUNC_ADD);
            gl.blendEquationi(1, gl.FUNC_SUBTRACT);
            gl.blendEquationi(0, gl.FUNC_REVERSE_SUBTRACT);
            gl.blendEquationi(1, gl.FUNC_ADD);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enablei(blendMode, 0);
        gl.enablei(blendMode, 1);
        gl.blendFunci(0, gl.ONE, gl.ZERO);
        gl.blendFunci(1, srcAlpha, oneMinusSrcAlpha);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < drawIterations; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
            gl.disablei(blendMode, 0);
            gl.enablei(blendMode, 1);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.enablei(blendMode, 0);
            gl.disablei(blendMode, 1);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.deleteFramebuffer(fbo2);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clearColor(0.3, 0.4, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

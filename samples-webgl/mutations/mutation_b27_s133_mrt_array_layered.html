<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const mrtCount = 4;
const layerCount = 16;
const drawCycles = 32;
const texSize = 256;
const vertexCount = 6;
const layerSwaps = 24;

const attach0 = 36064;
const attach1 = 36065;
const attach2 = 36066;
const attach3 = 36067;
const texArrayTarget = 35866;
const baseLevel = 33084;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const texArray0 = gl.createTexture();
        const texArray1 = gl.createTexture();
        const texArray2 = gl.createTexture();
        const texArray3 = gl.createTexture();
        gl.bindTexture(texArrayTarget, texArray0);
        gl.bindTexture(texArrayTarget, texArray1);
        gl.bindTexture(texArrayTarget, texArray0);
        gl.texStorage3D(texArrayTarget, 1, gl.RGBA8, texSize, texSize, layerCount);
        gl.bindTexture(texArrayTarget, texArray1);
        gl.texStorage3D(texArrayTarget, 1, gl.RGBA8, texSize, texSize, layerCount);
        gl.bindTexture(texArrayTarget, texArray2);
        gl.texStorage3D(texArrayTarget, 1, gl.RGBA8, 512, 512, layerCount);
        gl.bindTexture(texArrayTarget, texArray3);
        gl.texStorage3D(texArrayTarget, 1, gl.RGBA8, 512, 512, layerCount);
    } catch(e) { console.log(e); }

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach0, texArray0, 0, 0);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach1, texArray1, 0, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach2, texArray2, 0, 4);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach3, texArray3, 0, 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach0, texArray0, 0, 8);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.drawBuffers([attach0, attach1]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.drawBuffers([attach2, attach3]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.drawBuffers([attach0]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() { gl_Position = vec4(position, 1.0); }
        `);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            layout(location = 0) out vec4 fragColor0;
            layout(location = 1) out vec4 fragColor1;
            layout(location = 2) out vec4 fragColor2;
            layout(location = 3) out vec4 fragColor3;
            void main() {
                fragColor0 = vec4(1.0, 0.0, 0.0, 1.0);
                fragColor1 = vec4(0.0, 1.0, 0.0, 1.0);
                fragColor2 = vec4(0.0, 0.0, 1.0, 1.0);
                fragColor3 = vec4(1.0, 1.0, 0.0, 1.0);
            }
        `);
        gl.compileShader(fs);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([-1,-1,0, 1,-1,0, 1,1,0, -1,-1,0, 1,1,0, -1,1,0]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        for (let layer = 0; layer < layerCount; layer++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach0, texArray0, 0, layer);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach1, texArray1, 0, layer);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach2, texArray2, 0, layer);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach3, texArray3, 0, layer);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < layerSwaps; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach0, texArray0, 0, i % layerCount);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach2, texArray2, 0, i % layerCount);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < drawCycles; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
            gl.viewport(0, 0, texSize, texSize);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.viewport(0, 0, 512, 512);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
            gl.viewport(0, 0, texSize, texSize);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach0, texArray0, 0, 0);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach0, texArray0, 0, 8);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, attach0, texArray0, 0, 15);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(texArrayTarget, texArray0);
        gl.texParameteri(texArrayTarget, baseLevel, 0);
        gl.texParameteri(texArrayTarget, gl.TEXTURE_MAX_LEVEL, 0);
        gl.texParameteri(texArrayTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(texArrayTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo2);
        gl.deleteFramebuffer(fbo3);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(texArrayTarget, texArray0);
        gl.deleteTexture(texArray0);
        gl.bindTexture(texArrayTarget, texArray0);
        gl.deleteTexture(texArray1);
        gl.deleteTexture(texArray2);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clearColor(0.2, 0.3, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const depthFormats = 4;
const mrtCount = 4;
const depthCycles = 16;
const texSize = 256;
const vertexCount = 6;
const drawIterations = 24;

const attach0 = 36064;
const attach1 = 36065;
const attach2 = 36066;
const attach3 = 36067;
const depthAttach = 36096;
const depth16 = 33189;
const depth24 = 33190;
const depth32f = 36012;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex0 = gl.createTexture();
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, tex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 512, 512);
        gl.bindTexture(gl.TEXTURE_2D, tex3);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 512, 512);
    } catch(e) { console.log(e); }

    try {
        const depthTex1 = gl.createTexture();
        const depthTex2 = gl.createTexture();
        const depthTex3 = gl.createTexture();
        const depthTex4 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, depthTex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, depth16, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, depthTex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, depth24, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, depthTex3);
        gl.texStorage2D(gl.TEXTURE_2D, 1, depth32f, 512, 512);
        gl.bindTexture(gl.TEXTURE_2D, depthTex4);
        gl.texStorage2D(gl.TEXTURE_2D, 1, depth16, 512, 512);
    } catch(e) { console.log(e); }

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        const fbo4 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach0, gl.TEXTURE_2D, tex0, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach1, gl.TEXTURE_2D, tex1, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach2, gl.TEXTURE_2D, tex2, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach3, gl.TEXTURE_2D, tex3, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex2, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach0, gl.TEXTURE_2D, tex0, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex3, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.drawBuffers([attach0, attach1]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.drawBuffers([attach2, attach3]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.drawBuffers([attach0]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() { gl_Position = vec4(position, 1.0); }
        `);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            layout(location = 0) out vec4 fragColor0;
            layout(location = 1) out vec4 fragColor1;
            layout(location = 2) out vec4 fragColor2;
            layout(location = 3) out vec4 fragColor3;
            void main() {
                fragColor0 = vec4(1.0, 0.0, 0.0, 1.0);
                fragColor1 = vec4(0.0, 1.0, 0.0, 1.0);
                fragColor2 = vec4(0.0, 0.0, 1.0, 1.0);
                fragColor3 = vec4(1.0, 1.0, 0.0, 1.0);
                gl_FragDepth = 0.5;
            }
        `);
        gl.compileShader(fs);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([-1,-1,0, 1,-1,0, 1,1,0, -1,-1,0, 1,1,0, -1,1,0]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.depthMask(true);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex2, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex3, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo4);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex4, 0);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < depthCycles; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
            gl.depthFunc(gl.LESS);
            gl.depthMask(true);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.depthFunc(gl.LEQUAL);
            gl.depthMask(false);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
            gl.depthFunc(gl.GREATER);
            gl.depthMask(true);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clearDepth(1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < drawIterations; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
            gl.clear(gl.DEPTH_BUFFER_BIT);
            gl.viewport(0, 0, texSize, texSize);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.clear(gl.DEPTH_BUFFER_BIT);
            gl.viewport(0, 0, 512, 512);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
            gl.clear(gl.DEPTH_BUFFER_BIT);
            gl.viewport(0, 0, 512, 512);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex4, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, depthAttach, gl.TEXTURE_2D, depthTex1, 0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo2);
        gl.deleteFramebuffer(fbo3);
        gl.deleteFramebuffer(fbo4);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(gl.TEXTURE_2D, depthTex1);
        gl.deleteTexture(depthTex1);
        gl.bindTexture(gl.TEXTURE_2D, depthTex1);
        gl.deleteTexture(depthTex2);
        gl.deleteTexture(depthTex3);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clearColor(0.2, 0.3, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

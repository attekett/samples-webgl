<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const readCycles = 32;
const targetIndex = 0;
const pixelReads = 16;
const texSize = 256;
const vertexCount = 6;
const drawIterations = 24;

const attach0 = 36064;
const attach1 = 36065;
const attach2 = 36066;
const attach3 = 36067;
const attach4 = 36068;
const attach5 = 36069;
const attach6 = 36070;
const attach7 = 36071;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex0 = gl.createTexture();
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        const tex4 = gl.createTexture();
        const tex5 = gl.createTexture();
        const tex6 = gl.createTexture();
        const tex7 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, tex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, tex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, tex3);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, tex4);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 512, 512);
        gl.bindTexture(gl.TEXTURE_2D, tex5);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 512, 512);
        gl.bindTexture(gl.TEXTURE_2D, tex6);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 512, 512);
        gl.bindTexture(gl.TEXTURE_2D, tex7);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 512, 512);
    } catch(e) { console.log(e); }

    try {
        const fbo = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach0, gl.TEXTURE_2D, tex0, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach1, gl.TEXTURE_2D, tex1, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach2, gl.TEXTURE_2D, tex2, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach3, gl.TEXTURE_2D, tex3, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach4, gl.TEXTURE_2D, tex4, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach5, gl.TEXTURE_2D, tex5, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach6, gl.TEXTURE_2D, tex6, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attach7, gl.TEXTURE_2D, tex7, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.drawBuffers([attach0, attach1, attach2, attach3]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.drawBuffers([attach4, attach5, attach6, attach7]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() { gl_Position = vec4(position, 1.0); }
        `);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            layout(location = 0) out vec4 fragColor0;
            layout(location = 1) out vec4 fragColor1;
            layout(location = 2) out vec4 fragColor2;
            layout(location = 3) out vec4 fragColor3;
            layout(location = 4) out vec4 fragColor4;
            layout(location = 5) out vec4 fragColor5;
            layout(location = 6) out vec4 fragColor6;
            layout(location = 7) out vec4 fragColor7;
            void main() {
                fragColor0 = vec4(1.0, 0.0, 0.0, 1.0);
                fragColor1 = vec4(0.0, 1.0, 0.0, 1.0);
                fragColor2 = vec4(0.0, 0.0, 1.0, 1.0);
                fragColor3 = vec4(1.0, 1.0, 0.0, 1.0);
                fragColor4 = vec4(1.0, 0.0, 1.0, 1.0);
                fragColor5 = vec4(0.0, 1.0, 1.0, 1.0);
                fragColor6 = vec4(0.5, 0.5, 0.5, 1.0);
                fragColor7 = vec4(0.8, 0.2, 0.6, 1.0);
            }
        `);
        gl.compileShader(fs);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        const vertices = new Float32Array([-1,-1,0, 1,-1,0, 1,1,0, -1,-1,0, 1,1,0, -1,1,0]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        const pixels = new Uint8Array(4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.readBuffer(attach0);
        gl.readBuffer(attach1);
        gl.readBuffer(attach2);
        gl.readBuffer(attach3);
        gl.readBuffer(attach0);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    } catch(e) { console.log(e); }

    try {
        const pixels = new Uint8Array(16);
        for (let i = 0; i < readCycles; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.readBuffer(attach0 + (i % 4));
            gl.readPixels(targetIndex, targetIndex, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.readBuffer(attach4 + (i % 4));
            gl.readPixels(targetIndex, targetIndex, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        }
    } catch(e) { console.log(e); }

    try {
        const pixels = new Uint8Array(64);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        for (let i = 0; i < pixelReads; i++) {
            gl.readBuffer(attach0);
            gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            gl.readBuffer(attach1);
            gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            gl.readBuffer(attach2);
            gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            gl.readBuffer(attach3);
            gl.readPixels(0, 0, 2, 2, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        }
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < drawIterations; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.readBuffer(attach0);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.readBuffer(attach1);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.readBuffer(attach5);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.readBuffer(attach6);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.readBuffer(attach0);
        gl.readBuffer(attach3);
        gl.readBuffer(attach1);
        gl.readBuffer(attach2);
        gl.readBuffer(attach0);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.deleteFramebuffer(fbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.deleteFramebuffer(fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.deleteTexture(tex0);
        gl.bindTexture(gl.TEXTURE_2D, tex0);
        gl.deleteTexture(tex1);
        gl.deleteTexture(tex2);
        gl.deleteTexture(tex3);
        gl.deleteTexture(tex4);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clearColor(0.2, 0.3, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

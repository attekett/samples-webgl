<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 128;
const depth = 128;
const slices = 128;
const dataSize = texSize * texSize * depth * 4;
const vertexCount = 6;
const mipLevels = 7;

const textureTarget = 35866;
const textureFormat = 32849;
const textureType = 5121;
const bufferTarget = 34962;
const bufferUsage = 35044;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, dataSize, bufferUsage);
        gl.bufferSubData(bufferTarget, 0, new Float32Array(512));
    } catch(e) { console.log(e); }

    try {
        const texture1 = gl.createTexture();
        const texture2 = gl.createTexture();
        const texture3 = gl.createTexture();
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget, texture2);
        gl.bindTexture(textureTarget, texture1);
        gl.texImage3D(textureTarget, 0, textureFormat, texSize, texSize, depth, 0, gl.RGBA, textureType, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.bindTexture(textureTarget, texture2);
        gl.texImage3D(textureTarget, 0, gl.RGBA8, 64, 64, 64, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(textureTarget, texture3);
        gl.texImage3D(textureTarget, 0, gl.RGB8, texSize, texSize, slices, 0, gl.RGB, gl.UNSIGNED_BYTE, null);
    } catch(e) { console.log(e); }

    try {
        const texture4 = gl.createTexture();
        gl.bindTexture(textureTarget, texture4);
        gl.texStorage3D(textureTarget, mipLevels, gl.RGBA8, texSize, texSize, depth);
        gl.texSubImage3D(textureTarget, 0, 0, 0, 0, 32, 32, 32, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(131072));
        gl.texSubImage3D(textureTarget, 0, 16, 16, 16, 16, 16, 16, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(16384));
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp sampler3D;
            in vec3 vTexCoord;
            out vec4 fragColor;
            uniform sampler3D uTexture;
            void main() {
                fragColor = texture(uTexture, vTexCoord);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) { console.log(e); }

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        const posData = new Float32Array([
            -1, -1, 0, 1, -1, 0, -1, 1, 0,
            -1, 1, 0, 1, -1, 0, 1, 1, 0
        ]);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, posData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.disableVertexAttribArray(0);
        gl.enableVertexAttribArray(0);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
    } catch(e) { console.log(e); }

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(textureTarget, texture1);
        gl.deleteTexture(texture1);
        gl.bindTexture(textureTarget, texture1);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const baseSize = 128;
const mipLevels = 7;
const depth = 128;
const generateCycles = 8;
const vertexCount = 6;

const textureTarget = 35866;
const textureInternalFormat = 32856;
const bufferTarget = 34962;
const bufferUsage = 35044;
const minFilter = 9987;
const magFilter = 9729;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        const vertexData = new Float32Array([
            -1, -1, 0, 1, -1, 0, -1, 1, 0,
            -1, 1, 0, 1, -1, 0, 1, 1, 0
        ]);
        gl.bufferData(bufferTarget, vertexData, bufferUsage);
    } catch(e) { console.log(e); }

    try {
        const texture1 = gl.createTexture();
        const texture2 = gl.createTexture();
        const texture3 = gl.createTexture();
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget, texture2);
        gl.bindTexture(textureTarget, texture3);
        gl.bindTexture(textureTarget, texture1);
        gl.texStorage3D(textureTarget, mipLevels, textureInternalFormat, baseSize, baseSize, depth);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, minFilter);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, magFilter);
        gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 0);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAX_LEVEL, mipLevels - 1);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_R, gl.REPEAT);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(textureTarget, texture2);
        gl.texStorage3D(textureTarget, 5, gl.RGBA8, 64, 64, 64);
        gl.generateMipmap(textureTarget);
        gl.generateMipmap(textureTarget);
        gl.bindTexture(textureTarget, texture3);
        gl.texStorage3D(textureTarget, mipLevels, gl.RGB8, baseSize, baseSize, depth);
        gl.generateMipmap(textureTarget);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(textureTarget, texture1);
        for (let i = 0; i < generateCycles; i++) {
            gl.generateMipmap(textureTarget);
        }
        gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 2);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAX_LEVEL, 5);
        gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 0);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAX_LEVEL, mipLevels - 1);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vTexCoord;
            uniform float uLodBias;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp sampler3D;
            in vec3 vTexCoord;
            out vec4 fragColor;
            uniform sampler3D uTexture;
            uniform float uLodLevel;
            void main() {
                fragColor = textureLod(uTexture, vTexCoord, uLodLevel);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.disableVertexAttribArray(0);
        gl.enableVertexAttribArray(0);
    } catch(e) { console.log(e); }

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
        gl.disable(gl.DEPTH_TEST);
    } catch(e) { console.log(e); }

    try {
        gl.viewport(0, 0, baseSize, baseSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(textureTarget, texture1);
        gl.deleteTexture(texture1);
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget, texture2);
        gl.deleteTexture(texture2);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

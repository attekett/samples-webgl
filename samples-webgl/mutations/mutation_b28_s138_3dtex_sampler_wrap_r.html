<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const samplerCount = 8;
const wrapModes = 4;
const depthSamples = 32;
const texSize = 64;
const texDepth = 64;
const vertexCount = 6;

const textureTarget = 35866;
const wrapS = 10242;
const wrapT = 10243;
const wrapR = 32882;
const bufferTarget = 34962;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        const vertexData = new Float32Array([
            -1, -1, 0, 1, -1, 0, -1, 1, 0,
            -1, 1, 0, 1, -1, 0, 1, 1, 0
        ]);
        gl.bufferData(bufferTarget, vertexData, gl.STATIC_DRAW);
    } catch(e) { console.log(e); }

    try {
        const texture1 = gl.createTexture();
        const texture2 = gl.createTexture();
        const texture3 = gl.createTexture();
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget, texture2);
        gl.bindTexture(textureTarget, texture1);
        gl.texImage3D(textureTarget, 0, gl.RGBA8, texSize, texSize, texDepth, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.bindTexture(textureTarget, texture2);
        gl.texImage3D(textureTarget, 0, gl.RGB8, 128, 128, 128, 0, gl.RGB, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(textureTarget, texture3);
        gl.texImage3D(textureTarget, 0, gl.RGBA8, texSize, texSize, texDepth, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) { console.log(e); }

    try {
        const sampler1 = gl.createSampler();
        const sampler2 = gl.createSampler();
        const sampler3 = gl.createSampler();
        const sampler4 = gl.createSampler();
        gl.samplerParameteri(sampler1, wrapS, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(sampler1, wrapT, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(sampler1, wrapR, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(sampler2, wrapS, gl.REPEAT);
        gl.samplerParameteri(sampler2, wrapT, gl.REPEAT);
        gl.samplerParameteri(sampler2, wrapR, gl.REPEAT);
        gl.samplerParameteri(sampler3, wrapS, gl.MIRRORED_REPEAT);
        gl.samplerParameteri(sampler3, wrapT, gl.MIRRORED_REPEAT);
        gl.samplerParameteri(sampler3, wrapR, gl.MIRRORED_REPEAT);
        gl.samplerParameteri(sampler4, wrapR, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(sampler4, wrapS, gl.REPEAT);
        gl.samplerParameteri(sampler4, wrapT, gl.MIRRORED_REPEAT);
    } catch(e) { console.log(e); }

    try {
        gl.bindSampler(0, sampler1);
        gl.bindSampler(0, sampler2);
        gl.bindSampler(0, sampler3);
        gl.bindSampler(0, sampler1);
        gl.bindSampler(1, sampler2);
        gl.bindSampler(1, sampler3);
        gl.bindSampler(1, sampler4);
        gl.bindSampler(0, sampler4);
        gl.bindSampler(0, sampler1);
    } catch(e) { console.log(e); }

    try {
        const sampler5 = gl.createSampler();
        const sampler6 = gl.createSampler();
        const sampler7 = gl.createSampler();
        const sampler8 = gl.createSampler();
        gl.samplerParameteri(sampler5, wrapR, 33071);
        gl.samplerParameteri(sampler6, wrapR, 10497);
        gl.samplerParameteri(sampler7, wrapR, 33648);
        gl.samplerParameteri(sampler8, wrapR, gl.CLAMP_TO_EDGE);
        gl.bindSampler(2, sampler5);
        gl.bindSampler(3, sampler6);
        gl.bindSampler(2, sampler7);
        gl.bindSampler(3, sampler8);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position * 2.0;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp sampler3D;
            in vec3 vTexCoord;
            out vec4 fragColor;
            uniform sampler3D uTexture;
            void main() {
                fragColor = texture(uTexture, vTexCoord);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.disableVertexAttribArray(0);
        gl.enableVertexAttribArray(0);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
    } catch(e) { console.log(e); }

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 24);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindSampler(0, sampler1);
        gl.deleteSampler(sampler1);
        gl.bindSampler(0, sampler1);
        gl.bindTexture(textureTarget, texture1);
        gl.deleteTexture(texture1);
        gl.bindTexture(textureTarget, texture1);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

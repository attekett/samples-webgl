<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 64;
const depth = 64;
const intFormat = 33333;
const sampleCount = 128;
const vertexCount = 6;
const clearValue = 999;

const textureTarget = 35866;
const textureType = 5124;
const bufferTarget = 34962;
const bufferUsage = 35044;
const attachment0 = 36064;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        const vertexData = new Float32Array([
            -1, -1, 0, 1, -1, 0, -1, 1, 0,
            -1, 1, 0, 1, -1, 0, 1, 1, 0
        ]);
        gl.bufferData(bufferTarget, vertexData, bufferUsage);
    } catch(e) { console.log(e); }

    try {
        const texture1 = gl.createTexture();
        const texture2 = gl.createTexture();
        const texture3 = gl.createTexture();
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget, texture2);
        gl.bindTexture(textureTarget, texture3);
        gl.bindTexture(textureTarget, texture1);
        gl.texStorage3D(textureTarget, 1, intFormat, texSize, texSize, depth);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(textureTarget, texture2);
        gl.texStorage3D(textureTarget, 1, gl.RGBA32I, 32, 32, 32);
        const intData = new Int32Array(131072);
        for (let i = 0; i < 131072; i++) {
            intData[i] = i % 256;
        }
        gl.texSubImage3D(textureTarget, 0, 0, 0, 0, 32, 32, 32, gl.RGBA_INTEGER, gl.INT, intData);
        gl.bindTexture(textureTarget, texture3);
        gl.texStorage3D(textureTarget, 1, gl.R32UI, texSize, texSize, depth);
    } catch(e) { console.log(e); }

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const renderTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, renderTexture);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32I, 256, 256);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, attachment0, gl.TEXTURE_2D, renderTexture, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        const clearData = new Int32Array([clearValue, clearValue, clearValue, clearValue]);
        gl.clearBufferiv(gl.COLOR, 0, clearData);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([0, 0, 0, 0]));
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([12345, 67890, -999, 555]));
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vTexCoord;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp isampler3D;
            in vec3 vTexCoord;
            out ivec4 fragColor;
            uniform isampler3D uTexture;
            void main() {
                fragColor = texture(uTexture, vTexCoord);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.disableVertexAttribArray(0);
        gl.enableVertexAttribArray(0);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.SCISSOR_TEST);
        gl.disable(gl.SCISSOR_TEST);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, 0, texSize, texSize);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.FRONT);
        gl.disable(gl.CULL_FACE);
    } catch(e) { console.log(e); }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 12);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindTexture(textureTarget, texture1);
        gl.deleteTexture(texture1);
        gl.bindTexture(textureTarget, texture1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.deleteFramebuffer(fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

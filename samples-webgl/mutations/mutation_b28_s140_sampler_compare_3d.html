<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const samplerCount = 6;
const depthLayers = 32;
const compareFunc = 8;
const texSize = 64;
const vertexCount = 6;

const textureTarget = 3553;
const textureTarget3D = 35866;
const compareMode = 34892;
const compareModeValue = 34894;
const bufferTarget = 34962;
const bufferUsage = 35044;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        const vertexData = new Float32Array([
            -1, -1, 0, 1, -1, 0, -1, 1, 0,
            -1, 1, 0, 1, -1, 0, 1, 1, 0
        ]);
        gl.bufferData(bufferTarget, vertexData, bufferUsage);
    } catch(e) { console.log(e); }

    try {
        const texture1 = gl.createTexture();
        const texture2 = gl.createTexture();
        const texture3 = gl.createTexture();
        const texture3d1 = gl.createTexture();
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget, texture2);
        gl.bindTexture(textureTarget, texture1);
        gl.texStorage2D(textureTarget, 1, gl.DEPTH_COMPONENT24, texSize, texSize);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.bindTexture(textureTarget, texture2);
        gl.texStorage2D(textureTarget, 1, gl.DEPTH_COMPONENT32F, 128, 128);
        gl.bindTexture(textureTarget, texture3);
        gl.texStorage2D(textureTarget, 1, gl.DEPTH_COMPONENT16, texSize, texSize);
        gl.bindTexture(textureTarget3D, texture3d1);
        gl.texStorage3D(textureTarget3D, 1, gl.DEPTH_COMPONENT24, texSize, texSize, depthLayers);
    } catch(e) { console.log(e); }

    try {
        const sampler1 = gl.createSampler();
        const sampler2 = gl.createSampler();
        const sampler3 = gl.createSampler();
        gl.samplerParameteri(sampler1, compareMode, compareModeValue);
        gl.samplerParameteri(sampler1, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
        gl.samplerParameteri(sampler1, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.samplerParameteri(sampler1, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.samplerParameteri(sampler2, compareMode, compareModeValue);
        gl.samplerParameteri(sampler2, gl.TEXTURE_COMPARE_FUNC, gl.GEQUAL);
        gl.samplerParameteri(sampler3, compareMode, compareModeValue);
        gl.samplerParameteri(sampler3, gl.TEXTURE_COMPARE_FUNC, gl.LESS);
    } catch(e) { console.log(e); }

    try {
        const sampler4 = gl.createSampler();
        const sampler5 = gl.createSampler();
        const sampler6 = gl.createSampler();
        gl.samplerParameteri(sampler4, compareMode, compareModeValue);
        gl.samplerParameteri(sampler4, gl.TEXTURE_COMPARE_FUNC, gl.GREATER);
        gl.samplerParameteri(sampler5, compareMode, compareModeValue);
        gl.samplerParameteri(sampler5, gl.TEXTURE_COMPARE_FUNC, gl.EQUAL);
        gl.samplerParameteri(sampler6, compareMode, compareModeValue);
        gl.samplerParameteri(sampler6, gl.TEXTURE_COMPARE_FUNC, gl.NOTEQUAL);
        gl.samplerParameteri(sampler6, gl.TEXTURE_COMPARE_FUNC, gl.ALWAYS);
        gl.samplerParameteri(sampler6, gl.TEXTURE_COMPARE_FUNC, gl.NEVER);
    } catch(e) { console.log(e); }

    try {
        gl.bindSampler(0, sampler1);
        gl.bindSampler(0, sampler2);
        gl.bindSampler(0, sampler3);
        gl.bindSampler(0, sampler1);
        gl.bindSampler(1, sampler4);
        gl.bindSampler(1, sampler5);
        gl.bindSampler(1, sampler6);
        gl.bindSampler(0, sampler6);
        gl.bindSampler(1, sampler1);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            out vec3 vTexCoord;
            out float vDepthRef;
            void main() {
                gl_Position = vec4(position, 1.0);
                vTexCoord = position * 0.5 + 0.5;
                vDepthRef = position.x * 0.5 + 0.5;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp sampler2DShadow;
            in vec3 vTexCoord;
            in float vDepthRef;
            out vec4 fragColor;
            uniform sampler2DShadow uShadowTexture;
            void main() {
                float shadow = texture(uShadowTexture, vec3(vTexCoord.xy, vDepthRef));
                fragColor = vec4(shadow, shadow, shadow, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
        gl.disableVertexAttribArray(0);
        gl.enableVertexAttribArray(0);
    } catch(e) { console.log(e); }

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.depthMask(true);
        gl.depthMask(false);
        gl.depthMask(true);
    } catch(e) { console.log(e); }

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.viewport(0, 0, 512, 512);
        gl.drawArrays(gl.TRIANGLES, 0, 18);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) { console.log(e); }

    try {
        gl.bindSampler(0, sampler1);
        gl.deleteSampler(sampler1);
        gl.bindSampler(0, sampler1);
        gl.bindTexture(textureTarget, texture1);
        gl.deleteTexture(texture1);
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget3D, texture3d1);
        gl.deleteTexture(texture3d1);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

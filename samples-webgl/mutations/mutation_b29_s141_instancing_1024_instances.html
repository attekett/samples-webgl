<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 1024;
const vertexCount = 6;
const divisorVariations = 8;
const attribCount = 8;
const bufferSize = instanceCount * 16;
const baseStride = 32;
const bufferTarget = 35345;
const bufferUsage = 35044;
const attribDivisor = 35070;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        const vao3 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
    } catch(e) { console.log(e); }

    try {
        const posBuffer = gl.createBuffer();
        const instBuffer1 = gl.createBuffer();
        const instBuffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, posBuffer);
        gl.bindBuffer(bufferTarget, instBuffer1);
        gl.bindBuffer(bufferTarget, posBuffer);
        gl.bufferData(bufferTarget, new Float32Array([
            -0.5, -0.5, 0.0,
            0.5, -0.5, 0.0,
            0.5, 0.5, 0.0,
            -0.5, -0.5, 0.0,
            0.5, 0.5, 0.0,
            -0.5, 0.5, 0.0
        ]), bufferUsage);
    } catch(e) { console.log(e); }

    try {
        const instData = new Float32Array(bufferSize);
        for (let i = 0; i < instanceCount; i++) {
            const idx = i * 4;
            instData[idx] = (i % 32) / 32.0 - 0.5;
            instData[idx + 1] = Math.floor(i / 32) / 32.0 - 0.5;
            instData[idx + 2] = (i % 8) / 8.0;
            instData[idx + 3] = Math.floor(i / 8) / 128.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer2);
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer1);
        gl.bufferData(gl.ARRAY_BUFFER, instData, gl.STATIC_DRAW);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData.subarray(0, 256));
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 aPosition;
            in vec4 aInstanceData;
            out vec4 vColor;
            void main() {
                vec2 offset = aInstanceData.xy;
                vec2 scale = vec2(0.015, 0.015);
                gl_Position = vec4(aPosition.xy * scale + offset, 0.0, 1.0);
                vColor = vec4(aInstanceData.zw, 1.0 - aInstanceData.z, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec4 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vColor;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const posLoc = gl.getAttribLocation(program, 'aPosition');
        const instLoc = gl.getAttribLocation(program, 'aInstanceData');

        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
        gl.vertexAttribDivisor(posLoc, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer1);
        gl.enableVertexAttribArray(instLoc);
        gl.vertexAttribPointer(instLoc, 4, gl.FLOAT, false, 16, 0);
        gl.vertexAttribDivisor(instLoc, 1);
        gl.vertexAttribDivisor(instLoc, 2);
        gl.vertexAttribDivisor(instLoc, 1);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
    } catch(e) { console.log(e); }

    try {
        gl.clearColor(0.1, 0.1, 0.15, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 512);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < divisorVariations; i++) {
            gl.vertexAttribDivisor(0, i % 4);
            gl.vertexAttribDivisor(1, (i * 2) % 8);
            gl.vertexAttribDivisor(2, i);
            gl.vertexAttribDivisor(3, i % 2);
        }
        gl.vertexAttribDivisor(instLoc, 1);
    } catch(e) { console.log(e); }

    try {
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer1);
        gl.deleteBuffer(instBuffer1);
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer1);
        gl.bufferData(gl.ARRAY_BUFFER, 1024, gl.STATIC_DRAW);
    } catch(e) { console.log(e); }

    try {
        gl.bindVertexArray(vao1);
        gl.deleteVertexArray(vao1);
        gl.bindVertexArray(vao1);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 128);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

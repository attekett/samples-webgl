<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 128;
const uboCount = 8;
const arraySize = 128;
const vertexCount = 6;
const uboBlockSize = arraySize * 16;
const uboTarget = 35345;
const uboUsage = 35048;
const uboBinding = 0;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const ubo1 = gl.createBuffer();
        const ubo2 = gl.createBuffer();
        const ubo3 = gl.createBuffer();
        const ubo4 = gl.createBuffer();
        const ubo5 = gl.createBuffer();
        const ubo6 = gl.createBuffer();
        const ubo7 = gl.createBuffer();
        const ubo8 = gl.createBuffer();
        gl.bindBuffer(gl.UNIFORM_BUFFER, ubo1);
        gl.bindBuffer(gl.UNIFORM_BUFFER, ubo2);
        gl.bindBuffer(gl.UNIFORM_BUFFER, ubo1);
    } catch(e) { console.log(e); }

    try {
        const uboData = new Float32Array(uboBlockSize / 4);
        for (let i = 0; i < arraySize; i++) {
            const idx = i * 4;
            uboData[idx] = Math.sin(i * 0.05);
            uboData[idx + 1] = Math.cos(i * 0.05);
            uboData[idx + 2] = (i % 8) / 8.0;
            uboData[idx + 3] = Math.floor(i / 8) / 16.0;
        }
        gl.bindBuffer(gl.UNIFORM_BUFFER, ubo1);
        gl.bufferData(gl.UNIFORM_BUFFER, uboData, uboUsage);
        gl.bindBuffer(gl.UNIFORM_BUFFER, ubo2);
        gl.bufferData(gl.UNIFORM_BUFFER, uboBlockSize, gl.STATIC_DRAW);
        gl.bufferSubData(gl.UNIFORM_BUFFER, 0, uboData.subarray(0, 256));
    } catch(e) { console.log(e); }

    try {
        const posBuffer = gl.createBuffer();
        const instBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -0.5, -0.5, 0.0,
            0.5, -0.5, 0.0,
            0.5, 0.5, 0.0,
            -0.5, -0.5, 0.0,
            0.5, 0.5, 0.0,
            -0.5, 0.5, 0.0
        ]), gl.STATIC_DRAW);
    } catch(e) { console.log(e); }

    try {
        const instData = new Float32Array(instanceCount * 4);
        for (let i = 0; i < instanceCount; i++) {
            const idx = i * 4;
            instData[idx] = (i % 16) / 16.0 - 0.5;
            instData[idx + 1] = Math.floor(i / 16) / 8.0 - 0.5;
            instData[idx + 2] = i;
            instData[idx + 3] = 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, instData, gl.STATIC_DRAW);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 aPosition;
            in vec4 aInstanceData;
            uniform InstanceBlock {
                vec4 uInstanceTransforms[128];
            };
            out vec4 vColor;
            void main() {
                int instanceID = int(aInstanceData.z);
                vec4 transform = uInstanceTransforms[instanceID % 128];
                vec2 offset = aInstanceData.xy + transform.xy * 0.1;
                vec2 scale = vec2(0.03, 0.03);
                gl_Position = vec4(aPosition.xy * scale + offset, 0.0, 1.0);
                vColor = vec4(transform.zw, 1.0 - transform.z, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec4 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vColor;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const blockIndex = gl.getUniformBlockIndex(program, 'InstanceBlock');
        gl.uniformBlockBinding(program, blockIndex, uboBinding);
        gl.uniformBlockBinding(program, blockIndex, 1);
        gl.uniformBlockBinding(program, blockIndex, 2);
        gl.uniformBlockBinding(program, blockIndex, uboBinding);
    } catch(e) { console.log(e); }

    try {
        gl.bindBufferBase(gl.UNIFORM_BUFFER, uboBinding, ubo1);
        gl.bindBufferBase(gl.UNIFORM_BUFFER, 1, ubo2);
        gl.bindBufferBase(gl.UNIFORM_BUFFER, 2, ubo3);
        gl.bindBufferBase(gl.UNIFORM_BUFFER, uboBinding, ubo1);

        gl.bindBufferRange(gl.UNIFORM_BUFFER, uboBinding, ubo1, 0, 1024);
        gl.bindBufferRange(gl.UNIFORM_BUFFER, 1, ubo2, 256, 512);
        gl.bindBufferRange(gl.UNIFORM_BUFFER, 2, ubo3, 0, uboBlockSize);
    } catch(e) { console.log(e); }

    try {
        const posLoc = gl.getAttribLocation(program, 'aPosition');
        const instLoc = gl.getAttribLocation(program, 'aInstanceData');

        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
        gl.vertexAttribDivisor(posLoc, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer);
        gl.enableVertexAttribArray(instLoc);
        gl.vertexAttribPointer(instLoc, 4, gl.FLOAT, false, 16, 0);
        gl.vertexAttribDivisor(instLoc, 1);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendEquation(gl.FUNC_ADD);
        gl.blendEquation(gl.FUNC_SUBTRACT);
        gl.blendEquation(gl.FUNC_ADD);
    } catch(e) { console.log(e); }

    try {
        gl.clearColor(0.1, 0.1, 0.12, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 64);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
    } catch(e) { console.log(e); }

    try {
        for (let i = 0; i < uboCount; i++) {
            gl.bindBufferBase(gl.UNIFORM_BUFFER, i % 4, ubo1);
            gl.bindBufferBase(gl.UNIFORM_BUFFER, (i * 2) % 4, ubo2);
            gl.bindBufferRange(gl.UNIFORM_BUFFER, i % 4, ubo3, i * 256, 512);
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindBuffer(gl.UNIFORM_BUFFER, ubo1);
        gl.deleteBuffer(ubo1);
        gl.bindBuffer(gl.UNIFORM_BUFFER, ubo1);
        gl.bufferData(gl.UNIFORM_BUFFER, 2048, gl.DYNAMIC_DRAW);
        gl.deleteBuffer(ubo2);
        gl.deleteBuffer(ubo2);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

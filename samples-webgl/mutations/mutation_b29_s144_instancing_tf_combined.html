<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 64;
const tfBufferSize = 16384;
const varyingCount = 6;
const vertexCount = 6;
const tfTarget = 35982;
const tfPrimitives = 35976;
const rasterizerDiscard = 35977;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tfBuffer1 = gl.createBuffer();
        const tfBuffer2 = gl.createBuffer();
        const tfBuffer3 = gl.createBuffer();
        const tfBuffer4 = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer2);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, tfBufferSize, gl.DYNAMIC_COPY);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 8192, gl.STREAM_COPY);
    } catch(e) { console.log(e); }

    try {
        const posBuffer = gl.createBuffer();
        const instBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer);
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -0.5, -0.5, 0.0,
            0.5, -0.5, 0.0,
            0.5, 0.5, 0.0,
            -0.5, -0.5, 0.0,
            0.5, 0.5, 0.0,
            -0.5, 0.5, 0.0
        ]), gl.STATIC_DRAW);
    } catch(e) { console.log(e); }

    try {
        const instData = new Float32Array(instanceCount * 4);
        for (let i = 0; i < instanceCount; i++) {
            const idx = i * 4;
            instData[idx] = (i % 8) / 8.0 - 0.5;
            instData[idx + 1] = Math.floor(i / 8) / 8.0 - 0.5;
            instData[idx + 2] = Math.sin(i * 0.2);
            instData[idx + 3] = Math.cos(i * 0.2);
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, instData, gl.STATIC_DRAW);
    } catch(e) { console.log(e); }

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 aPosition;
            in vec4 aInstanceData;
            out vec3 vPosition;
            out vec4 vInstanceData;
            out vec2 vTexCoord;
            out float vDepth;
            out vec3 vNormal;
            out vec4 vColor;
            void main() {
                vec2 offset = aInstanceData.xy;
                vec2 scale = vec2(0.06, 0.06);
                gl_Position = vec4(aPosition.xy * scale + offset, aInstanceData.z * 0.5, 1.0);
                vPosition = aPosition;
                vInstanceData = aInstanceData;
                vTexCoord = aPosition.xy * 0.5 + 0.5;
                vDepth = aInstanceData.z;
                vNormal = vec3(0.0, 0.0, 1.0);
                vColor = vec4(aInstanceData.zw * 0.5 + 0.5, 1.0, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec4 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vColor;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vPosition', 'vInstanceData', 'vTexCoord', 'vDepth', 'vNormal', 'vColor'], gl.INTERLEAVED_ATTRIBS);
        gl.transformFeedbackVaryings(program, ['vPosition', 'vColor'], gl.SEPARATE_ATTRIBS);
        gl.transformFeedbackVaryings(program, ['vPosition', 'vInstanceData', 'vTexCoord'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) { console.log(e); }

    try {
        const posLoc = gl.getAttribLocation(program, 'aPosition');
        const instLoc = gl.getAttribLocation(program, 'aInstanceData');

        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
        gl.vertexAttribDivisor(posLoc, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, instBuffer);
        gl.enableVertexAttribArray(instLoc);
        gl.vertexAttribPointer(instLoc, 4, gl.FLOAT, false, 16, 0);
        gl.vertexAttribDivisor(instLoc, 1);
    } catch(e) { console.log(e); }

    try {
        const tf1 = gl.createTransformFeedback();
        const tf2 = gl.createTransformFeedback();
        const tf3 = gl.createTransformFeedback();
        gl.bindTransformFeedback(tfTarget, tf1);
        gl.bindTransformFeedback(tfTarget, tf2);
        gl.bindTransformFeedback(tfTarget, tf1);
    } catch(e) { console.log(e); }

    try {
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, tfBuffer2);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 2, tfBuffer3);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1);

        gl.bindBufferRange(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1, 0, 4096);
        gl.bindBufferRange(gl.TRANSFORM_FEEDBACK_BUFFER, 1, tfBuffer2, 256, 2048);
        gl.bindBufferRange(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1, 0, tfBufferSize);
    } catch(e) { console.log(e); }

    try {
        gl.enable(rasterizerDiscard);
        gl.disable(rasterizerDiscard);
        gl.enable(rasterizerDiscard);
    } catch(e) { console.log(e); }

    try {
        const query1 = gl.createQuery();
        const query2 = gl.createQuery();

        gl.beginQuery(tfPrimitives, query1);
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitives);

        gl.beginQuery(tfPrimitives, query2);
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 32);
        gl.endTransformFeedback();
        gl.endQuery(tfPrimitives);
    } catch(e) { console.log(e); }

    try {
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.clearColor(0.08, 0.08, 0.12, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
    } catch(e) { console.log(e); }

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        for (let i = 0; i < 8; i++) {
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 16);
            gl.endTransformFeedback();
            gl.pauseTransformFeedback();
            gl.resumeTransformFeedback();
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.endTransformFeedback();
        }
    } catch(e) { console.log(e); }

    try {
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf1);
        gl.deleteTransformFeedback(tf1);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf1);
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.endTransformFeedback();
    } catch(e) { console.log(e); }

    try {
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.deleteBuffer(tfBuffer1);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 1024, gl.STREAM_COPY);
    } catch(e) { console.log(e); }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

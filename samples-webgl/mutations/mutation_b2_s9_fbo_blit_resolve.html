<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const srcSize = 256;
    const dstSize = 256;
    const sampleCount = 4;
    const blitRegion = 256;
    const blitFilter = gl.NEAREST;
    const bufferTarget = gl.ARRAY_BUFFER;
    const textureTarget = gl.TEXTURE_2D;

    const msRenderBuffer = gl.RENDERBUFFER;
    const readFramebuffer = gl.READ_FRAMEBUFFER;
    const drawFramebuffer = gl.DRAW_FRAMEBUFFER;
    const colorBufferBit = gl.COLOR_BUFFER_BIT;
    const linearFilter = gl.LINEAR;

    let buffer;
    try {
        const vertices = new Float32Array([
            -0.9, -0.9, 1.0, 0.0, 0.0,
            0.9, -0.9, 0.0, 1.0, 0.0,
            0.9, 0.9, 0.0, 0.0, 1.0,
            -0.9, -0.9, 1.0, 0.0, 0.0,
            0.9, 0.9, 0.0, 0.0, 1.0,
            -0.9, 0.9, 1.0, 1.0, 1.0
        ]);

        buffer = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer);
        gl.bufferData(bufferTarget, vertices, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(bufferTarget, buffer);
    } catch(e) { throw e; }

    let msColorBuffer;
    try {
        msColorBuffer = gl.createRenderbuffer();
        gl.bindRenderbuffer(msRenderBuffer, msColorBuffer);
        gl.renderbufferStorageMultisample(msRenderBuffer, sampleCount, gl.RGBA8, srcSize, srcSize);
        gl.bindRenderbuffer(msRenderBuffer, null);
        gl.bindRenderbuffer(msRenderBuffer, msColorBuffer);
        gl.bindRenderbuffer(msRenderBuffer, null);
        gl.bindRenderbuffer(msRenderBuffer, msColorBuffer);
    } catch(e) { throw e; }

    let resolveTex;
    try {
        resolveTex = gl.createTexture();
        gl.bindTexture(textureTarget, resolveTex);
        gl.texImage2D(textureTarget, 0, gl.RGBA8, dstSize, dstSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, linearFilter);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, linearFilter);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.bindTexture(textureTarget, null);
        gl.bindTexture(textureTarget, resolveTex);
        gl.bindTexture(textureTarget, null);
    } catch(e) { throw e; }

    let program;
    try {
        const vsSource = `#version 300 es
        in vec2 position;
        in vec3 color;
        out vec3 vColor;
        void main() {
            vColor = color;
            gl_Position = vec4(position, 0.0, 1.0);
        }`;

        const fsSource = `#version 300 es
        precision highp float;
        in vec3 vColor;
        out vec4 fragColor;
        void main() {
            fragColor = vec4(vColor, 1.0);
        }`;

        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSource);
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error('VS: ' + gl.getShaderInfoLog(vs));
        }

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSource);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error('FS: ' + gl.getShaderInfoLog(fs));
        }

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error('Link: ' + gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);
    } catch(e) { throw e; }

    let srcFBO;
    try {
        srcFBO = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, srcFBO);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, msRenderBuffer, msColorBuffer);

        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        if (status !== gl.FRAMEBUFFER_COMPLETE) {
            throw new Error('Src FBO incomplete: ' + status);
        }
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, srcFBO);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) { throw e; }

    let dstFBO;
    try {
        dstFBO = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, dstFBO);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, textureTarget, resolveTex, 0);

        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        if (status !== gl.FRAMEBUFFER_COMPLETE) {
            throw new Error('Dst FBO incomplete: ' + status);
        }
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, dstFBO);
    } catch(e) { throw e; }

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        const colorLoc = gl.getAttribLocation(program, 'color');

        gl.bindBuffer(bufferTarget, buffer);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(colorLoc);
        gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 20, 8);

        gl.bindFramebuffer(gl.FRAMEBUFFER, srcFBO);
        gl.viewport(0, 0, srcSize, srcSize);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(colorBufferBit);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) { throw e; }

    try {
        gl.bindFramebuffer(readFramebuffer, srcFBO);
        gl.bindFramebuffer(drawFramebuffer, dstFBO);
        gl.blitFramebuffer(
            0, 0, srcSize, srcSize,
            0, 0, dstSize, dstSize,
            colorBufferBit, blitFilter
        );

        gl.blitFramebuffer(
            0, 0, blitRegion, blitRegion,
            0, 0, blitRegion, blitRegion,
            colorBufferBit, linearFilter
        );

        gl.blitFramebuffer(
            0, 0, srcSize / 2, srcSize / 2,
            dstSize / 2, dstSize / 2, dstSize, dstSize,
            colorBufferBit, blitFilter
        );

        gl.bindFramebuffer(readFramebuffer, null);
        gl.bindFramebuffer(drawFramebuffer, null);
    } catch(e) { throw e; }

    try {
        gl.bindFramebuffer(readFramebuffer, srcFBO);
        gl.bindFramebuffer(drawFramebuffer, null);
        gl.blitFramebuffer(
            0, 0, srcSize, srcSize,
            0, 0, 256, 256,
            colorBufferBit, blitFilter
        );
        gl.bindFramebuffer(readFramebuffer, null);

        gl.bindFramebuffer(readFramebuffer, srcFBO);
        gl.bindFramebuffer(readFramebuffer, dstFBO);
        gl.bindFramebuffer(readFramebuffer, null);
        gl.bindFramebuffer(drawFramebuffer, dstFBO);
        gl.bindFramebuffer(drawFramebuffer, srcFBO);
        gl.bindFramebuffer(drawFramebuffer, null);
    } catch(e) { throw e; }

    gl.flush();
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

const rbCount = 15;
const rbSize = 256;
const halfSize = 128;
const rbTarget = 0x8D41;
const fboTarget = 0x8D40;
const formatRGBA8 = 0x8058;
const formatRGBA16F = 0x881A;
const formatRGBA32F = 0x8814;
const formatRGB10A2 = 0x8059;
const formatR11G11B10F = 0x8C3A;
const formatDepth16 = 0x81A5;
const formatDepth24 = 0x81A6;
const formatDepth32F = 0x8CAC;
const formatDepth24Stencil8 = 0x88F0;
const formatDepth32FStencil8 = 0x8CAD;
const paramWidth = 0x8D42;
const paramHeight = 0x8D43;
const paramFormat = 0x8D44;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rb1 = gl.createRenderbuffer();
        const rb2 = gl.createRenderbuffer();
        const rb3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rb1);
        gl.renderbufferStorage(rbTarget, formatRGBA8, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rb2);
        gl.renderbufferStorage(rbTarget, formatRGBA16F, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rb3);
        gl.renderbufferStorage(rbTarget, formatRGBA32F, halfSize, halfSize);
    } catch(e) {}

    try {
        const rb4 = gl.createRenderbuffer();
        const rb5 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rb4);
        gl.renderbufferStorage(rbTarget, formatRGB10A2, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rb5);
        gl.renderbufferStorage(rbTarget, formatR11G11B10F, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rb4);
        gl.bindRenderbuffer(rbTarget, rb5);
    } catch(e) {}

    try {
        const rb6 = gl.createRenderbuffer();
        const rb7 = gl.createRenderbuffer();
        const rb8 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rb6);
        gl.renderbufferStorage(rbTarget, formatDepth16, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rb7);
        gl.renderbufferStorage(rbTarget, formatDepth24, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rb8);
        gl.renderbufferStorage(rbTarget, formatDepth32F, rbSize, rbSize);
    } catch(e) {}

    try {
        const rb9 = gl.createRenderbuffer();
        const rb10 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rb9);
        gl.renderbufferStorage(rbTarget, formatDepth24Stencil8, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rb10);
        gl.renderbufferStorage(rbTarget, formatDepth32FStencil8, halfSize, halfSize);
        gl.bindRenderbuffer(rbTarget, rb9);
        gl.bindRenderbuffer(rbTarget, rb10);
        gl.bindRenderbuffer(rbTarget, rb9);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(rbTarget, rb1);
        const w1 = gl.getRenderbufferParameter(rbTarget, paramWidth);
        const h1 = gl.getRenderbufferParameter(rbTarget, paramHeight);
        const f1 = gl.getRenderbufferParameter(rbTarget, paramFormat);
        gl.bindRenderbuffer(rbTarget, rb2);
        const f2 = gl.getRenderbufferParameter(rbTarget, paramFormat);
        gl.bindRenderbuffer(rbTarget, rb3);
        const w3 = gl.getRenderbufferParameter(rbTarget, paramWidth);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(rbTarget, rb4);
        const f4 = gl.getRenderbufferParameter(rbTarget, paramFormat);
        gl.bindRenderbuffer(rbTarget, rb5);
        const f5 = gl.getRenderbufferParameter(rbTarget, paramFormat);
        gl.bindRenderbuffer(rbTarget, rb6);
        const f6 = gl.getRenderbufferParameter(rbTarget, paramFormat);
        gl.bindRenderbuffer(rbTarget, rb7);
        const f7 = gl.getRenderbufferParameter(rbTarget, paramFormat);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb1);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_ATTACHMENT, rbTarget, rb6);
        const status1 = gl.checkFramebufferStatus(fboTarget);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb2);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_ATTACHMENT, rbTarget, rb7);
        const status2 = gl.checkFramebufferStatus(fboTarget);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(rbTarget, rb1);
        gl.bindRenderbuffer(rbTarget, rb2);
        gl.bindRenderbuffer(rbTarget, rb3);
        gl.bindRenderbuffer(rbTarget, rb4);
        gl.bindRenderbuffer(rbTarget, rb5);
        gl.bindRenderbuffer(rbTarget, rb1);
        gl.bindRenderbuffer(rbTarget, rb6);
        gl.bindRenderbuffer(rbTarget, rb7);
        gl.bindRenderbuffer(rbTarget, rb8);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.0, 1.0, 0.5, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 0, 1, -1, 0, 1, 1, 0,
            -1, -1, 0, 1, 1, 0, -1, 1, 0
        ]), gl.STATIC_DRAW);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb1);
        gl.viewport(0, 0, rbSize, rbSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb3);
        gl.viewport(0, 0, halfSize, halfSize);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.2, 0.4, 0.8, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.flush();
        gl.finish();
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

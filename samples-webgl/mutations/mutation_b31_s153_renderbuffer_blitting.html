<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const rbSize = 256;
const halfSize = 128;
const quarterSize = 64;
const samples = 4;
const rbTarget = 0x8D41;
const readFboTarget = 0x8CA8;
const drawFboTarget = 0x8CA9;
const fboTarget = 0x8D40;
const formatRGBA8 = 0x8058;
const formatDepth24 = 0x81A6;
const blitMask = 0x00004000;
const nearestFilter = 0x2600;
const linearFilter = 0x2601;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rbMS1 = gl.createRenderbuffer();
        const rbMS2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rbMS1);
        gl.renderbufferStorageMultisample(rbTarget, samples, formatRGBA8, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rbMS2);
        gl.renderbufferStorageMultisample(rbTarget, samples, formatDepth24, rbSize, rbSize);
    } catch(e) {}

    try {
        const rb1 = gl.createRenderbuffer();
        const rb2 = gl.createRenderbuffer();
        const rb3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rb1);
        gl.renderbufferStorage(rbTarget, formatRGBA8, rbSize, rbSize);
        gl.bindRenderbuffer(rbTarget, rb2);
        gl.renderbufferStorage(rbTarget, formatRGBA8, halfSize, halfSize);
        gl.bindRenderbuffer(rbTarget, rb3);
        gl.renderbufferStorage(rbTarget, formatRGBA8, quarterSize, quarterSize);
    } catch(e) {}

    try {
        const fboMS = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fboMS);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rbMS1);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_ATTACHMENT, rbTarget, rbMS2);
        const statusMS = gl.checkFramebufferStatus(fboTarget);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb1);
        gl.bindFramebuffer(fboTarget, fbo2);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb2);
        gl.bindFramebuffer(fboTarget, fbo3);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb3);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(1.0, 0.5, 0.0, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 0, 1, -1, 0, 1, 1, 0,
            -1, -1, 0, 1, 1, 0, -1, 1, 0
        ]), gl.STATIC_DRAW);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fboMS);
        gl.viewport(0, 0, rbSize, rbSize);
        gl.clearColor(1.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(readFboTarget, fboMS);
        gl.bindFramebuffer(drawFboTarget, fbo1);
        gl.blitFramebuffer(0, 0, rbSize, rbSize, 0, 0, rbSize, rbSize, blitMask, nearestFilter);
        gl.bindFramebuffer(readFboTarget, fbo1);
        gl.bindFramebuffer(drawFboTarget, fbo2);
        gl.blitFramebuffer(0, 0, rbSize, rbSize, 0, 0, halfSize, halfSize, blitMask, linearFilter);
    } catch(e) {}

    try {
        gl.bindFramebuffer(readFboTarget, fbo2);
        gl.bindFramebuffer(drawFboTarget, fbo3);
        gl.blitFramebuffer(0, 0, halfSize, halfSize, 0, 0, quarterSize, quarterSize, blitMask, nearestFilter);
        gl.bindFramebuffer(readFboTarget, fbo1);
        gl.bindFramebuffer(drawFboTarget, fbo2);
        gl.blitFramebuffer(64, 64, 192, 192, 0, 0, halfSize, halfSize, blitMask, linearFilter);
    } catch(e) {}

    try {
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(32, 32, 64, 64);
        gl.bindFramebuffer(readFboTarget, fbo1);
        gl.bindFramebuffer(drawFboTarget, fbo2);
        gl.blitFramebuffer(0, 0, rbSize, rbSize, 0, 0, halfSize, halfSize, blitMask, nearestFilter);
        gl.disable(gl.SCISSOR_TEST);
    } catch(e) {}

    try {
        gl.bindFramebuffer(readFboTarget, fbo1);
        gl.bindFramebuffer(drawFboTarget, null);
        gl.blitFramebuffer(0, 0, rbSize, rbSize, 0, 0, 256, 256, blitMask, nearestFilter);
        gl.bindFramebuffer(readFboTarget, fbo2);
        gl.blitFramebuffer(0, 0, halfSize, halfSize, 128, 128, 256, 256, blitMask, linearFilter);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.flush();
        gl.finish();
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

const rbTarget = 0x8D41;
const fboTarget = 0x8D40;
const formatRGBA8 = 0x8058;
const formatRGBA16F = 0x881A;
const formatRGBA32F = 0x8814;
const formatDepth24 = 0x81A6;
const formatDepthStencil = 0x88F0;
const size256 = 256;
const size128 = 128;
const size64 = 64;
const size32 = 32;
const reallocCycles = 4;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rb1 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rb1);
        gl.renderbufferStorage(rbTarget, formatRGBA8, size256, size256);
        gl.renderbufferStorage(rbTarget, formatRGBA16F, size128, size128);
        gl.renderbufferStorage(rbTarget, formatRGBA32F, size64, size64);
        gl.renderbufferStorage(rbTarget, formatRGBA8, size32, size32);
    } catch(e) {}

    try {
        const rb2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rb2);
        gl.renderbufferStorage(rbTarget, formatDepth24, size256, size256);
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb1);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_ATTACHMENT, rbTarget, rb2);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.5, 0.8, 0.2, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
            -1, -1, 0, 1, -1, 0, 1, 1, 0,
            -1, -1, 0, 1, 1, 0, -1, 1, 0
        ]), gl.STATIC_DRAW);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo);
        gl.viewport(0, 0, size32, size32);
        gl.clearColor(1.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(rbTarget, rb1);
        gl.renderbufferStorage(rbTarget, formatRGBA8, size128, size128);
        gl.bindFramebuffer(fboTarget, fbo);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb1);
        gl.viewport(0, 0, size128, size128);
        gl.clearColor(0.0, 1.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(rbTarget, rb1);
        gl.renderbufferStorage(rbTarget, formatRGBA16F, size256, size256);
        gl.bindRenderbuffer(rbTarget, rb2);
        gl.renderbufferStorage(rbTarget, formatDepthStencil, size256, size256);
        gl.bindFramebuffer(fboTarget, fbo);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb1);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, rbTarget, rb2);
        gl.viewport(0, 0, size256, size256);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        for (let i = 0; i < reallocCycles; i++) {
            gl.bindRenderbuffer(rbTarget, rb1);
            gl.renderbufferStorage(rbTarget, formatRGBA32F, size64, size64);
            gl.renderbufferStorage(rbTarget, formatRGBA8, size128, size128);
            gl.bindFramebuffer(fboTarget, fbo);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
    } catch(e) {}

    try {
        gl.bindRenderbuffer(rbTarget, rb1);
        gl.renderbufferStorage(rbTarget, formatRGBA8, size256, size256);
        gl.bindFramebuffer(fboTarget, fbo);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, null);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rb1);
        gl.viewport(0, 0, size256, size256);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.3, 0.3, 0.7, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.flush();
        gl.finish();
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = ['EXT_color_buffer_float'];

const texSize = 256;
const pixelCount = texSize * texSize;
const byteCount = pixelCount * 4;
const packAlign1 = 1;
const packAlign2 = 2;
const packAlign4 = 4;
const packAlign8 = 8;
const rowLength = 512;
const skipPixels = 16;
const skipRows = 8;

const texture2DTarget = 0x0DE1;
const framebufferTarget = 0x8D40;
const pixelPackBufferTarget = 0x88EB;
const staticReadUsage = 0x88E5;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        var tex1 = gl.createTexture();
        var tex2 = gl.createTexture();
        var tex3 = gl.createTexture();
        gl.bindTexture(texture2DTarget, tex1);
        gl.bindTexture(texture2DTarget, tex2);
        gl.bindTexture(texture2DTarget, tex1);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(texture2DTarget, tex2);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA32F, 128, 128, 0, gl.RGBA, gl.FLOAT, null);
        gl.bindTexture(texture2DTarget, tex3);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA32I, texSize, texSize, 0, gl.RGBA_INTEGER, gl.INT, null);
    } catch(e) {}

    try {
        var fbo1 = gl.createFramebuffer();
        var fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, texture2DTarget, tex1, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, texture2DTarget, tex2, 0);
        gl.bindFramebuffer(framebufferTarget, fbo1);
    } catch(e) {}

    try {
        var vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        var fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.5, 0.75, 0.25, 1.0);
            }
        `);
        gl.compileShader(fs);

        var program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        gl.clearColor(0.2, 0.4, 0.6, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign1);
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign2);
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign1);
        var pixels1 = new Uint8Array(byteCount);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels1);
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign4);
        var pixels2 = new Uint8Array(byteCount);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, pixels2);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign8);
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign4);
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign8);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, rowLength);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, skipPixels);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, skipRows);
        var pixels3 = new Uint8Array(byteCount * 4);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels3);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, 128, 128);
        gl.clearColor(0.8, 0.2, 0.9, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        var pixels4 = new Float32Array(pixelCount * 4);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.FLOAT, pixels4);
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign1);
        gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.FLOAT, pixels4);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        var pixels5 = new Uint8Array(byteCount);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels5);
        var pixels6 = new Uint8Array(16384);
        gl.readPixels(32, 32, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels6);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign2);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 64);
        var pixels7 = new Uint8Array(byteCount);
        gl.readPixels(0, 0, 32, 32, gl.RGBA, gl.UNSIGNED_BYTE, pixels7);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        var pixels8 = new Uint8Array(byteCount);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels8);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlign4);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, rowLength);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 8);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 4);
        var pixels9 = new Uint8Array(byteCount * 4);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels9);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 0.5, 1.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        var pixels10 = new Uint8Array(byteCount);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixels10);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 256;
const pixelCount = texSize * texSize;
const byteCount = pixelCount * 4;
const pboSize1 = 16384;
const pboSize2 = 32768;
const pboSize3 = 65536;
const readOffset = 0;
const mapOffset = 0;
const mapLength = 4096;

const texture2DTarget = 0x0DE1;
const framebufferTarget = 0x8D40;
const pixelPackBufferTarget = 0x88EB;
const streamReadUsage = 0x88E1;
const dynamicReadUsage = 0x88E9;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        gl.bindTexture(texture2DTarget, tex1);
        gl.bindTexture(texture2DTarget, tex2);
        gl.bindTexture(texture2DTarget, tex1);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(texture2DTarget, tex2);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA32F, 128, 128, 0, gl.RGBA, gl.FLOAT, null);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, texture2DTarget, tex1, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, texture2DTarget, tex2, 0);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.25, 0.5, 0.75, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const pbo1 = gl.createBuffer();
        const pbo2 = gl.createBuffer();
        const pbo3 = gl.createBuffer();
        gl.bindBuffer(pixelPackBufferTarget, pbo1);
        gl.bindBuffer(pixelPackBufferTarget, pbo2);
        gl.bindBuffer(pixelPackBufferTarget, pbo1);
        gl.bufferData(pixelPackBufferTarget, pboSize1, streamReadUsage);
        gl.bindBuffer(pixelPackBufferTarget, pbo2);
        gl.bufferData(pixelPackBufferTarget, pboSize2, dynamicReadUsage);
        gl.bindBuffer(pixelPackBufferTarget, pbo3);
        gl.bufferData(pixelPackBufferTarget, pboSize3, streamReadUsage);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.3, 0.6, 0.9, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        gl.bindBuffer(pixelPackBufferTarget, pbo1);
        gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, readOffset);
        gl.bindBuffer(pixelPackBufferTarget, pbo2);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, readOffset);
        gl.bindBuffer(pixelPackBufferTarget, pbo3);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, readOffset);
    } catch(e) {}

    try {
        const sync1 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const sync2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        const sync3 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.clientWaitSync(sync1, 0, 0);
        gl.clientWaitSync(sync2, 0, 1000);
        gl.clientWaitSync(sync3, 0, gl.TIMEOUT_IGNORED);
    } catch(e) {}

    try {
        gl.bindBuffer(pixelPackBufferTarget, pbo1);
        const data1 = new Uint8Array(pboSize1);
        gl.getBufferSubData(pixelPackBufferTarget, 0, data1);
        gl.bindBuffer(pixelPackBufferTarget, pbo2);
        const data2 = new Uint8Array(pboSize2);
        gl.getBufferSubData(pixelPackBufferTarget, 0, data2);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, 128, 128);
        gl.clearColor(0.7, 0.3, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindBuffer(pixelPackBufferTarget, pbo1);
        gl.bindBuffer(pixelPackBufferTarget, pbo2);
        gl.bindBuffer(pixelPackBufferTarget, pbo1);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, readOffset);
    } catch(e) {}

    try {
        gl.bindBuffer(pixelPackBufferTarget, pbo3);
        gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.readPixels(64, 64, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, 16384);
        const sync4 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.clientWaitSync(sync4, 0, 5000);
    } catch(e) {}

    try {
        gl.bindBuffer(pixelPackBufferTarget, pbo1);
        gl.bindBuffer(pixelPackBufferTarget, pbo2);
        gl.bindBuffer(pixelPackBufferTarget, pbo3);
        const data3 = new Uint8Array(pboSize3);
        gl.getBufferSubData(pixelPackBufferTarget, 0, data3);
        gl.bindBuffer(pixelPackBufferTarget, pbo1);
        const data4 = new Uint8Array(pboSize1);
        gl.getBufferSubData(pixelPackBufferTarget, 0, data4);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindBuffer(pixelPackBufferTarget, pbo2);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, readOffset);
        const sync5 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.clientWaitSync(sync5, gl.SYNC_FLUSH_COMMANDS_BIT, gl.TIMEOUT_IGNORED);
        gl.deleteSync(sync5);
    } catch(e) {}

    try {
        gl.bindBuffer(pixelPackBufferTarget, null);
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(1.0, 0.5, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const pixels = new Uint8Array(byteCount);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

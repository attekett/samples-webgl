<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 256;
const copyWidth = 128;
const copyHeight = 128;
const copyX = 0;
const copyY = 0;
const mipLevel0 = 0;
const mipLevel1 = 1;
const mipLevel2 = 2;
const arrayLayers = 8;
const zDepth = 4;

const texture2DTarget = 0x0DE1;
const texture3DTarget = 0x806F;
const textureArrayTarget = 0x8C1A;
const framebufferTarget = 0x8D40;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const tex2d1 = gl.createTexture();
        const tex2d2 = gl.createTexture();
        const tex2d3 = gl.createTexture();
        gl.bindTexture(texture2DTarget, tex2d1);
        gl.bindTexture(texture2DTarget, tex2d2);
        gl.bindTexture(texture2DTarget, tex2d1);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(texture2DTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.bindTexture(texture2DTarget, tex2d2);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, 128, 128, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindTexture(texture2DTarget, tex2d3);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA8, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        const tex3d1 = gl.createTexture();
        const tex3d2 = gl.createTexture();
        gl.bindTexture(texture3DTarget, tex3d1);
        gl.bindTexture(texture3DTarget, tex3d2);
        gl.bindTexture(texture3DTarget, tex3d1);
        gl.texImage3D(texture3DTarget, 0, gl.RGBA8, 64, 64, 16, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(texture3DTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(texture3DTarget, tex3d2);
        gl.texImage3D(texture3DTarget, 0, gl.RGBA8, texSize, texSize, zDepth, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        const texArray1 = gl.createTexture();
        const texArray2 = gl.createTexture();
        gl.bindTexture(textureArrayTarget, texArray1);
        gl.bindTexture(textureArrayTarget, texArray2);
        gl.bindTexture(textureArrayTarget, texArray1);
        gl.texImage3D(textureArrayTarget, 0, gl.RGBA8, texSize, texSize, arrayLayers, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(textureArrayTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.bindTexture(textureArrayTarget, texArray2);
        gl.texImage3D(textureArrayTarget, 0, gl.RGBA8, 128, 128, 4, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, texture2DTarget, tex2d1, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTexture2D(framebufferTarget, gl.COLOR_ATTACHMENT0, texture2DTarget, tex2d2, 0);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.8, 0.2, 0.6, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.1, 0.4, 0.7, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        gl.bindTexture(texture2DTarget, tex2d2);
        gl.copyTexSubImage2D(texture2DTarget, mipLevel0, copyX, copyY, 0, 0, copyWidth, copyHeight);
        gl.bindTexture(texture2DTarget, tex2d3);
        gl.copyTexSubImage2D(texture2DTarget, mipLevel0, 0, 0, 32, 32, 64, 64);
        gl.copyTexSubImage2D(texture2DTarget, mipLevel0, 64, 64, 0, 0, copyWidth, copyHeight);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.viewport(0, 0, 128, 128);
        gl.clearColor(0.9, 0.3, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindTexture(texture2DTarget, tex2d1);
        gl.copyTexSubImage2D(texture2DTarget, mipLevel0, 0, 0, 0, 0, 128, 128);
    } catch(e) {}

    try {
        gl.bindTexture(texture3DTarget, tex3d1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.copyTexSubImage3D(texture3DTarget, mipLevel0, 0, 0, 0, 0, 0, 64, 64);
        gl.copyTexSubImage3D(texture3DTarget, mipLevel0, 0, 0, 1, 0, 0, 64, 64);
        gl.bindTexture(texture3DTarget, tex3d2);
        gl.copyTexSubImage3D(texture3DTarget, mipLevel0, 0, 0, 2, 0, 0, copyWidth, copyHeight);
    } catch(e) {}

    try {
        gl.bindTexture(textureArrayTarget, texArray1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.copyTexSubImage3D(textureArrayTarget, mipLevel0, 0, 0, 0, 0, 0, texSize, texSize);
        gl.copyTexSubImage3D(textureArrayTarget, mipLevel0, 0, 0, 1, 0, 0, texSize, texSize);
        gl.bindTexture(textureArrayTarget, texArray2);
        gl.copyTexSubImage3D(textureArrayTarget, mipLevel0, 0, 0, 0, 0, 0, 128, 128);
        gl.copyTexSubImage3D(textureArrayTarget, mipLevel0, 0, 0, 2, 0, 0, 128, 128);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.bindTexture(texture2DTarget, tex2d3);
        gl.copyTexSubImage2D(texture2DTarget, mipLevel0, copyX, copyY, 0, 0, 128, 128);
        gl.bindTexture(texture3DTarget, tex3d1);
        gl.copyTexSubImage3D(texture3DTarget, mipLevel0, 0, 0, zDepth, 0, 0, 64, 64);
    } catch(e) {}

    try {
        gl.bindTexture(textureArrayTarget, texArray1);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.copyTexSubImage3D(textureArrayTarget, mipLevel0, 0, 0, 4, 0, 0, texSize, texSize);
        gl.copyTexSubImage3D(textureArrayTarget, mipLevel0, 0, 0, 6, 0, 0, texSize, texSize);
        gl.bindTexture(textureArrayTarget, texArray2);
        gl.copyTexSubImage3D(textureArrayTarget, mipLevel0, 0, 0, 3, 0, 0, 128, 128);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 1.0, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

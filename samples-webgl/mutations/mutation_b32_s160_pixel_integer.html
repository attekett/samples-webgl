<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 256;
const pixelCount = texSize * texSize;
const byteCount = pixelCount * 4;
const clearValue0 = 127;
const clearValue1 = 255;
const clearValue2 = 63;
const clearValue3 = 191;

const texture2DTarget = 0x0DE1;
const framebufferTarget = 0x8D40;
const colorAttachment0 = 0x8CE0;
const colorAttachment1 = 0x8CE1;
const colorAttachment2 = 0x8CE2;
const colorAttachment3 = 0x8CE3;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const texInt1 = gl.createTexture();
        const texInt2 = gl.createTexture();
        const texInt3 = gl.createTexture();
        gl.bindTexture(texture2DTarget, texInt1);
        gl.bindTexture(texture2DTarget, texInt2);
        gl.bindTexture(texture2DTarget, texInt1);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA32I, texSize, texSize, 0, gl.RGBA_INTEGER, gl.INT, null);
        gl.texParameteri(texture2DTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(texture2DTarget, texInt2);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA32UI, 128, 128, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, null);
        gl.bindTexture(texture2DTarget, texInt3);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA32I, texSize, texSize, 0, gl.RGBA_INTEGER, gl.INT, null);
    } catch(e) {}

    try {
        const texUint1 = gl.createTexture();
        const texUint2 = gl.createTexture();
        gl.bindTexture(texture2DTarget, texUint1);
        gl.bindTexture(texture2DTarget, texUint2);
        gl.bindTexture(texture2DTarget, texUint1);
        gl.texImage2D(texture2DTarget, 0, gl.RGBA32UI, texSize, texSize, 0, gl.RGBA_INTEGER, gl.UNSIGNED_INT, null);
        gl.texParameteri(texture2DTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.bindTexture(texture2DTarget, texUint2);
        gl.texImage2D(texture2DTarget, 0, gl.R32I, 128, 128, 0, gl.RED_INTEGER, gl.INT, null);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.framebufferTexture2D(framebufferTarget, colorAttachment0, texture2DTarget, texInt1, 0);
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.framebufferTexture2D(framebufferTarget, colorAttachment0, texture2DTarget, texInt2, 0);
        gl.bindFramebuffer(framebufferTarget, fbo3);
        gl.framebufferTexture2D(framebufferTarget, colorAttachment0, texture2DTarget, texUint1, 0);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp int;
            out ivec4 fragColor;
            void main() {
                fragColor = ivec4(127, 255, 63, 191);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.clearBufferiv(gl.COLOR, 0, [clearValue0, clearValue1, clearValue2, clearValue3]);
        gl.clearBufferiv(gl.COLOR, 0, [100, 200, 50, 150]);
        gl.viewport(0, 0, texSize, texSize);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.clearBufferuiv(gl.COLOR, 0, [clearValue1, clearValue0, clearValue3, clearValue2]);
        gl.clearBufferuiv(gl.COLOR, 0, [255, 127, 191, 63]);
        gl.viewport(0, 0, 128, 128);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo1);
        gl.readBuffer(colorAttachment0);
        gl.readBuffer(colorAttachment0);
        const pixelsInt = new Int32Array(byteCount);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.INT, pixelsInt);
        const pixelsInt2 = new Int32Array(16384);
        gl.readPixels(0, 0, 64, 64, gl.RGBA_INTEGER, gl.INT, pixelsInt2);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, fbo2);
        gl.readBuffer(colorAttachment0);
        const pixelsUint = new Uint32Array(byteCount);
        gl.readPixels(0, 0, 128, 128, gl.RGBA_INTEGER, gl.UNSIGNED_INT, pixelsUint);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
        gl.readPixels(0, 0, 128, 128, gl.RGBA_INTEGER, gl.UNSIGNED_INT, pixelsUint);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
    } catch(e) {}

    try {
        const fboMrt = gl.createFramebuffer();
        gl.bindFramebuffer(framebufferTarget, fboMrt);
        gl.framebufferTexture2D(framebufferTarget, colorAttachment0, texture2DTarget, texInt1, 0);
        gl.framebufferTexture2D(framebufferTarget, colorAttachment1, texture2DTarget, texInt2, 0);
        gl.framebufferTexture2D(framebufferTarget, colorAttachment2, texture2DTarget, texInt3, 0);
        gl.framebufferTexture2D(framebufferTarget, colorAttachment3, texture2DTarget, texUint1, 0);
        gl.drawBuffers([colorAttachment0, colorAttachment1, colorAttachment2, colorAttachment3]);
    } catch(e) {}

    try {
        gl.clearBufferiv(gl.COLOR, 0, [10, 20, 30, 40]);
        gl.clearBufferuiv(gl.COLOR, 1, [50, 60, 70, 80]);
        gl.clearBufferiv(gl.COLOR, 2, [90, 100, 110, 120]);
        gl.clearBufferuiv(gl.COLOR, 3, [130, 140, 150, 160]);
        gl.viewport(0, 0, texSize, texSize);
    } catch(e) {}

    try {
        gl.readBuffer(colorAttachment0);
        const pixels0 = new Int32Array(byteCount);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.INT, pixels0);
        gl.readBuffer(colorAttachment1);
        const pixels1 = new Uint32Array(byteCount);
        gl.readPixels(0, 0, 128, 128, gl.RGBA_INTEGER, gl.UNSIGNED_INT, pixels1);
        gl.readBuffer(colorAttachment2);
        const pixels2 = new Int32Array(byteCount);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.INT, pixels2);
    } catch(e) {}

    try {
        gl.bindTexture(texture2DTarget, texInt3);
        gl.copyTexSubImage2D(texture2DTarget, 0, 0, 0, 0, 0, 128, 128);
        gl.bindTexture(texture2DTarget, texUint1);
        gl.copyTexSubImage2D(texture2DTarget, 0, 0, 0, 0, 0, texSize, texSize);
        gl.bindTexture(texture2DTarget, texInt1);
        gl.copyTexSubImage2D(texture2DTarget, 0, 64, 64, 0, 0, 128, 128);
    } catch(e) {}

    try {
        gl.readBuffer(colorAttachment3);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 128);
        const pixels3 = new Uint32Array(byteCount);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.UNSIGNED_INT, pixels3);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
    } catch(e) {}

    try {
        gl.bindFramebuffer(framebufferTarget, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.5, 0.5, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

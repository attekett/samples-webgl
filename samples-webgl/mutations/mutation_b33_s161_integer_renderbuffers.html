<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const rboCount = 8;
const msaaSamples = 4;
const msaaSamplesAlt = 8;
const clearVal1 = 42;
const clearVal2 = -128;
const clearVal3 = 255;
const clearVal4 = 1024;
const texSize = 256;
const smallSize = 128;
const readSize = 64;
const pixelCount = texSize * texSize;
const bufferSize = pixelCount * 4;

const rboTarget = 36161;
const fboTarget = 36160;
const intFormat1 = 36235;
const intFormat2 = 36226;
const intFormatUI = 36249;
const depthFormat = 33189;
const attachment0 = 36064;
const attachment1 = 36065;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rbo1 = gl.createRenderbuffer();
        const rbo2 = gl.createRenderbuffer();
        const rbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo1);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo2);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo3);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16I, smallSize, smallSize);
    } catch(e) {}

    try {
        const rbo4 = gl.createRenderbuffer();
        const rbo5 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo4);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, msaaSamples, gl.R32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo5);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, msaaSamplesAlt, gl.RGBA32I, 512, 512);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo4);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo5);
    } catch(e) {}

    try {
        const rbo6 = gl.createRenderbuffer();
        const rbo7 = gl.createRenderbuffer();
        const rbo8 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo6);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RG32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo7);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 8, gl.RGBA32UI, 384, 384);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo8);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, texSize, texSize);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const rbo9 = gl.createRenderbuffer();
        const rbo10 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo9);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo9);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo10);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo10);
    } catch(e) {}

    try {
        const fbo3 = gl.createFramebuffer();
        const rbo11 = gl.createRenderbuffer();
        const rbo12 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo11);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo12);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo11);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rbo12);
        const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    } catch(e) {}

    try {
        const clearBuf = new Int32Array([clearVal1, clearVal2, clearVal3, clearVal4]);
        gl.clearBufferiv(gl.COLOR, 0, clearBuf);
        gl.clearBufferiv(gl.COLOR, 0, [64, -64, 128, -128]);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([999, -999, 2048, -2048]));
    } catch(e) {}

    try {
        const clearBufUI = new Uint32Array([clearVal3, clearVal4, 512, 1024]);
        gl.clearBufferuiv(gl.COLOR, 0, clearBufUI);
        gl.clearBufferuiv(gl.COLOR, 0, [255, 511, 1023, 2047]);
        gl.clearBufferuiv(gl.COLOR, 0, new Uint32Array([32768, 65535, 131072, 262144]));
    } catch(e) {}

    const vsSource = `#version 300 es
    in vec4 aPosition;
    void main() {
        gl_Position = aPosition;
    }`;

    const fsSource = `#version 300 es
    precision highp int;
    out ivec4 fragColor;
    void main() {
        fragColor = ivec4(42, -128, 255, 1024);
    }`;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSource);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSource);
        gl.compileShader(fs);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        gl.useProgram(prog);
    } catch(e) {}

    try {
        const verts = new Float32Array([-1,-1, 1,-1, 0,1]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.flush();
    } catch(e) {}

    try {
        const readBuf = new Int32Array(readSize * readSize * 4);
        gl.readPixels(0, 0, readSize, readSize, gl.RGBA_INTEGER, gl.INT, readBuf);
        const readBufUI = new Uint32Array(readSize * readSize * 4);
        gl.readPixels(0, 0, readSize, readSize, gl.RGBA_INTEGER, gl.UNSIGNED_INT, readBufUI);
    } catch(e) {}

    try {
        const rbo13 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo13);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32UI, texSize, texSize);
        const param = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_WIDTH);
        const param2 = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_HEIGHT);
        const param3 = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_INTERNAL_FORMAT);
    } catch(e) {}

    try {
        gl.clearBufferiv(gl.COLOR, 0, [1, 2, 3, 4]);
        gl.clearBufferiv(gl.COLOR, 0, [-1, -2, -3, -4]);
        gl.clearBufferiv(gl.COLOR, 0, [999, -999, 1024, -1024]);
        gl.clearBufferuiv(gl.COLOR, 0, [100, 200, 300, 400]);
        gl.clearBufferuiv(gl.COLOR, 0, [65535, 32768, 16384, 8192]);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

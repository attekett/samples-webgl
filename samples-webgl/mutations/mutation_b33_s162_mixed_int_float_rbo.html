<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = ['EXT_color_buffer_float'];

const fboCount = 4;
const texSize = 256;
const smallSize = 128;
const clearValF = 0.75;
const clearValI = 42;
const clearValUI = 255;
const drawCount = 8;
const switchCount = 16;

const fboTarget = 36160;
const rboTarget = 36161;
const floatFormat = 34836;
const intFormat = 36226;
const depthFormat = 35056;
const attachment0 = 36064;
const attachment1 = 36065;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rboFloat1 = gl.createRenderbuffer();
        const rboFloat2 = gl.createRenderbuffer();
        const rboFloat3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboFloat1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32F, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboFloat2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16F, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboFloat3);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32F, smallSize, smallSize);
    } catch(e) {}

    try {
        const rboInt1 = gl.createRenderbuffer();
        const rboInt2 = gl.createRenderbuffer();
        const rboInt3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboInt1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboInt2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboInt3);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, smallSize, smallSize);
    } catch(e) {}

    try {
        const rboDepth1 = gl.createRenderbuffer();
        const rboDepth2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboDepth1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboDepth2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH24_STENCIL8, texSize, texSize);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const rboF1 = gl.createRenderbuffer();
        const rboI1 = gl.createRenderbuffer();
        const rboD1 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboF1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32F, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboI1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboD1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboF1);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.RENDERBUFFER, rboI1);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rboD1);
    } catch(e) {}

    try {
        const fbo2 = gl.createFramebuffer();
        const rboF2 = gl.createRenderbuffer();
        const rboI2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboF2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16F, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboI2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32I, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboF2);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.RENDERBUFFER, rboI2);
    } catch(e) {}

    try {
        const fbo3 = gl.createFramebuffer();
        const rboF3 = gl.createRenderbuffer();
        const rboI3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboF3);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32F, smallSize, smallSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboI3);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, smallSize, smallSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboF3);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.RENDERBUFFER, rboI3);
    } catch(e) {}

    const vsFloat = `#version 300 es
    in vec4 aPosition;
    void main() {
        gl_Position = aPosition;
    }`;

    const fsFloat = `#version 300 es
    precision highp float;
    out vec4 fragColor;
    void main() {
        fragColor = vec4(0.75, 0.5, 0.25, 1.0);
    }`;

    const vsInt = `#version 300 es
    in vec4 aPosition;
    void main() {
        gl_Position = aPosition;
    }`;

    const fsInt = `#version 300 es
    precision highp int;
    out ivec4 fragColor;
    void main() {
        fragColor = ivec4(42, -128, 255, 1024);
    }`;

    try {
        const vsF = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vsF, vsFloat);
        gl.compileShader(vsF);
        const fsF = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsF, fsFloat);
        gl.compileShader(fsF);
        const progFloat = gl.createProgram();
        gl.attachShader(progFloat, vsF);
        gl.attachShader(progFloat, fsF);
        gl.linkProgram(progFloat);
    } catch(e) {}

    try {
        const vsI = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vsI, vsInt);
        gl.compileShader(vsI);
        const fsI = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsI, fsInt);
        gl.compileShader(fsI);
        const progInt = gl.createProgram();
        gl.attachShader(progInt, vsI);
        gl.attachShader(progInt, fsI);
        gl.linkProgram(progInt);
    } catch(e) {}

    try {
        const verts = new Float32Array([-1,-1, 1,-1, 0,1]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
        gl.clearBufferfv(gl.COLOR, 0, [clearValF, 0.5, 0.25, 1.0]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.drawBuffers([gl.COLOR_ATTACHMENT1]);
        gl.clearBufferiv(gl.COLOR, 0, [clearValI, -128, 255, 1024]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
        gl.clearBufferfv(gl.COLOR, 0, [0.1, 0.2, 0.3, 0.4]);
        gl.drawBuffers([gl.COLOR_ATTACHMENT1]);
        gl.clearBufferiv(gl.COLOR, 0, [10, 20, 30, 40]);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
        gl.clearBufferfv(gl.COLOR, 0, [0.9, 0.8, 0.7, 0.6]);
    } catch(e) {}

    try {
        gl.drawBuffers([gl.COLOR_ATTACHMENT1]);
        gl.clearBufferiv(gl.COLOR, 0, [999, -999, 2048, -2048]);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
        gl.clearBufferfv(gl.COLOR, 0, [1.0, 0.0, 1.0, 1.0]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        for (let i = 0; i < switchCount; i++) {
            gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
            gl.clearBufferfv(gl.COLOR, 0, [0.5, 0.5, 0.5, 1.0]);
            gl.drawBuffers([gl.COLOR_ATTACHMENT1]);
            gl.clearBufferiv(gl.COLOR, 0, [i, -i, i*2, -i*2]);
        }
    } catch(e) {}

    try {
        gl.flush();
        gl.finish();
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

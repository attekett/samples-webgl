<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 256;
const halfSize = 128;
const quarterSize = 64;
const msaaSamples = 4;
const blitCount = 8;
const clearVal = 42;

const fboRead = 36008;
const fboDraw = 36009;
const fboTarget = 36160;
const rboTarget = 36161;
const colorBuffer = 16384;
const nearest = 9728;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rboMSI1 = gl.createRenderbuffer();
        const rboMSI2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboMSI1);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, msaaSamples, gl.RGBA32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboMSI2);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RG32I, halfSize, halfSize);
    } catch(e) {}

    try {
        const rboSS1 = gl.createRenderbuffer();
        const rboSS2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboSS1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboSS2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32I, halfSize, halfSize);
    } catch(e) {}

    try {
        const fboMS = gl.createFramebuffer();
        const rboMS = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboMS);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, msaaSamples, gl.RGBA32I, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboMS);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboMS);
        const status1 = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    } catch(e) {}

    try {
        const fboSS = gl.createFramebuffer();
        const rboSS = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboSS);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboSS);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboSS);
        const status2 = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    } catch(e) {}

    const vsSrc = `#version 300 es
    in vec4 aPosition;
    void main() {
        gl_Position = aPosition;
    }`;

    const fsSrc = `#version 300 es
    precision highp int;
    out ivec4 fragColor;
    void main() {
        fragColor = ivec4(42, -128, 255, 1024);
    }`;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSrc);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSrc);
        gl.compileShader(fs);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        gl.useProgram(prog);
    } catch(e) {}

    try {
        const verts = new Float32Array([-1,-1, 1,-1, 0,1]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        const fboMS = gl.createFramebuffer();
        const fboSS = gl.createFramebuffer();
        const rboMS = gl.createRenderbuffer();
        const rboSS = gl.createRenderbuffer();

        gl.bindRenderbuffer(gl.RENDERBUFFER, rboMS);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, msaaSamples, gl.RGBA32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboSS);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);

        gl.bindFramebuffer(gl.FRAMEBUFFER, fboMS);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboMS);
        gl.clearBufferiv(gl.COLOR, 0, [clearVal, -128, 255, 1024]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboMS);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboSS);
        gl.framebufferRenderbuffer(gl.DRAW_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboSS);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    } catch(e) {}

    try {
        const fboMSUI = gl.createFramebuffer();
        const fboSSUI = gl.createFramebuffer();
        const rboMSUI = gl.createRenderbuffer();
        const rboSSUI = gl.createRenderbuffer();

        gl.bindRenderbuffer(gl.RENDERBUFFER, rboMSUI);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RGBA32UI, halfSize, halfSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboSSUI);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32UI, halfSize, halfSize);

        gl.bindFramebuffer(gl.FRAMEBUFFER, fboMSUI);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboMSUI);
        gl.clearBufferuiv(gl.COLOR, 0, [255, 511, 1023, 2047]);

        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboMSUI);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboSSUI);
        gl.framebufferRenderbuffer(gl.DRAW_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboSSUI);
        gl.blitFramebuffer(0, 0, halfSize, halfSize, 0, 0, halfSize, halfSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    } catch(e) {}

    try {
        for (let i = 0; i < blitCount; i++) {
            const fboMS = gl.createFramebuffer();
            const fboSS = gl.createFramebuffer();
            const rboMS = gl.createRenderbuffer();
            const rboSS = gl.createRenderbuffer();

            gl.bindRenderbuffer(gl.RENDERBUFFER, rboMS);
            gl.renderbufferStorageMultisample(gl.RENDERBUFFER, msaaSamples, gl.RG32I, quarterSize, quarterSize);
            gl.bindRenderbuffer(gl.RENDERBUFFER, rboSS);
            gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32I, quarterSize, quarterSize);

            gl.bindFramebuffer(gl.FRAMEBUFFER, fboMS);
            gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboMS);
            gl.clearBufferiv(gl.COLOR, 0, [i, -i, i*2, -i*2]);

            gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboMS);
            gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboSS);
            gl.framebufferRenderbuffer(gl.DRAW_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboSS);
            gl.blitFramebuffer(0, 0, quarterSize, quarterSize, 0, 0, quarterSize, quarterSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        }
    } catch(e) {}

    try {
        const fboSrc = gl.createFramebuffer();
        const fboDst = gl.createFramebuffer();
        const rboSrc = gl.createRenderbuffer();
        const rboDst = gl.createRenderbuffer();

        gl.bindRenderbuffer(gl.RENDERBUFFER, rboSrc);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, rboDst);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, halfSize, halfSize);

        gl.bindFramebuffer(gl.FRAMEBUFFER, fboSrc);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboSrc);
        gl.clearBufferiv(gl.COLOR, 0, [999, -999, 2048, -2048]);

        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboSrc);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboDst);
        gl.framebufferRenderbuffer(gl.DRAW_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboDst);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, halfSize, halfSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    } catch(e) {}

    try {
        const fboMS1 = gl.createFramebuffer();
        const fboSS1 = gl.createFramebuffer();
        const rboMS1 = gl.createRenderbuffer();
        const rboSS1 = gl.createRenderbuffer();

        gl.bindRenderbuffer(gl.RENDERBUFFER, rboMS1);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RGBA16I, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboMS1);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboMS1);
        gl.clearBufferiv(gl.COLOR, 0, [100, -100, 200, -200]);

        gl.bindRenderbuffer(gl.RENDERBUFFER, rboSS1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16I, texSize, texSize);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboMS1);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboSS1);
        gl.framebufferRenderbuffer(gl.DRAW_FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rboSS1);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);

        const readBuf = new Int32Array(64 * 64 * 4);
        gl.readPixels(0, 0, 64, 64, gl.RGBA_INTEGER, gl.INT, readBuf);
    } catch(e) {}

    try {
        gl.flush();
        gl.finish();
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

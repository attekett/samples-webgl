<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 256;
const halfSize = 128;
const quarterSize = 64;
const churnCycles = 16;
const renderCycles = 8;
const clearVal = 42;

const fboTarget = 36160;
const rboTarget = 36161;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rbo1 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo1);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32I, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, halfSize, halfSize);
    } catch(e) {}

    try {
        const rbo2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16I, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8I, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, quarterSize, quarterSize);
    } catch(e) {}

    try {
        const rbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo3);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32UI, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32UI, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32UI, texSize, texSize);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R16UI, halfSize, halfSize);
    } catch(e) {}

    try {
        const fbo = gl.createFramebuffer();
        const rbo = gl.createRenderbuffer();

        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, texSize, texSize);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo);
        gl.clearBufferiv(gl.COLOR, 0, [clearVal, -128, 255, 1024]);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32I, texSize, texSize);
        gl.clearBufferiv(gl.COLOR, 0, [999, -999, 2048, -2048]);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.clearBufferiv(gl.COLOR, 0, [100, -100, 200, -200]);
    } catch(e) {}

    const vsSrc = `#version 300 es
    in vec4 aPosition;
    void main() {
        gl_Position = aPosition;
    }`;

    const fsSrc = `#version 300 es
    precision highp int;
    out ivec4 fragColor;
    void main() {
        fragColor = ivec4(42, -128, 255, 1024);
    }`;

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSrc);
        gl.compileShader(vs);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSrc);
        gl.compileShader(fs);
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        gl.useProgram(prog);
    } catch(e) {}

    try {
        const verts = new Float32Array([-1,-1, 1,-1, 0,1]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        const fbo = gl.createFramebuffer();
        const rbo = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

        for (let i = 0; i < churnCycles; i++) {
            gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, texSize, texSize);
            gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo);
            gl.clearBufferiv(gl.COLOR, 0, [i, -i, i*2, -i*2]);
            gl.drawArrays(gl.TRIANGLES, 0, 3);

            gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
            gl.clearBufferiv(gl.COLOR, 0, [i*3, -i*3, i*4, -i*4]);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
    } catch(e) {}

    try {
        const fbo2 = gl.createFramebuffer();
        const rbo2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32UI, texSize, texSize);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo2);
        gl.clearBufferuiv(gl.COLOR, 0, [255, 511, 1023, 2047]);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32UI, texSize, texSize);
        gl.clearBufferuiv(gl.COLOR, 0, [100, 200, 300, 400]);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32UI, texSize, texSize);
        gl.clearBufferuiv(gl.COLOR, 0, [1000, 2000, 3000, 4000]);

        const readBuf = new Uint32Array(64 * 64 * 4);
        gl.readPixels(0, 0, 64, 64, gl.RGBA_INTEGER, gl.UNSIGNED_INT, readBuf);
    } catch(e) {}

    try {
        const fbo3 = gl.createFramebuffer();
        const rbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo3);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo3);
        gl.clearBufferiv(gl.COLOR, 0, [42, -42, 84, -84]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16I, halfSize, halfSize);
        gl.clearBufferiv(gl.COLOR, 0, [21, -21, 42, -42]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8I, quarterSize, quarterSize);
        gl.clearBufferiv(gl.COLOR, 0, [10, -10, 20, -20]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    } catch(e) {}

    try {
        for (let i = 0; i < renderCycles; i++) {
            const fbo = gl.createFramebuffer();
            const rbo = gl.createRenderbuffer();
            gl.bindRenderbuffer(gl.RENDERBUFFER, rbo);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

            gl.renderbufferStorage(gl.RENDERBUFFER, gl.R32I, texSize - i * 8, texSize - i * 8);
            gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo);
            gl.clearBufferiv(gl.COLOR, 0, [i, -i, i*2, -i*2]);
            gl.drawArrays(gl.TRIANGLES, 0, 3);

            gl.renderbufferStorage(gl.RENDERBUFFER, gl.RG32I, texSize - i * 8, texSize - i * 8);
            gl.clearBufferiv(gl.COLOR, 0, [i*3, -i*3, i*4, -i*4]);
            gl.drawArrays(gl.TRIANGLES, 0, 3);

            gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize - i * 8, texSize - i * 8);
            gl.clearBufferiv(gl.COLOR, 0, [i*5, -i*5, i*6, -i*6]);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
    } catch(e) {}

    try {
        const fbo4 = gl.createFramebuffer();
        const rbo4 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rbo4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo4);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, texSize, texSize);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo4);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32UI, texSize, texSize);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, null);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo4);

        gl.renderbufferStorage(gl.RENDERBUFFER, gl.R16I, texSize, texSize);
        gl.clearBufferiv(gl.COLOR, 0, [1, 2, 3, 4]);
    } catch(e) {}

    try {
        gl.flush();
        gl.finish();
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

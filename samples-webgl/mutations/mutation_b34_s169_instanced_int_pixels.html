<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 512;
const texSize = 256;
const intTexCount = 4;
const readIterations = 8;

const intFormatRGBA32I = 36238;
const intFormatRGBA32UI = 36249;
const intFormatR32I = 36235;
const intFormatRG16I = 36233;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        var fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        var intTex1 = gl.createTexture();
        var intTex2 = gl.createTexture();
        var intTex3 = gl.createTexture();
        var intTex4 = gl.createTexture();

        gl.bindTexture(gl.TEXTURE_2D, intTex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32I, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, intTex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32UI, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, intTex3);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R32I, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, intTex4);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RG16I, texSize, texSize);

        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, intTex1, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, intTex2, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, intTex3, 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT3, gl.TEXTURE_2D, intTex4, 0);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3]);
    } catch(e) {}

    try {
        var vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in ivec4 instanceData;
            flat out ivec4 vData;
            void main() {
                float angle = float(gl_InstanceID) * 0.0123;
                mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
                vec2 pos = rot * position.xy;
                vData = instanceData + ivec4(gl_InstanceID, gl_InstanceID * 2, gl_InstanceID * 3, gl_InstanceID * 4);
                gl_Position = vec4(pos, position.z, 1.0);
            }
        `);
        gl.compileShader(vs);

        var fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp int;
            flat in ivec4 vData;
            layout(location = 0) out ivec4 intColor0;
            layout(location = 1) out uvec4 intColor1;
            layout(location = 2) out ivec4 intColor2;
            layout(location = 3) out ivec4 intColor3;
            void main() {
                intColor0 = vData;
                intColor1 = uvec4(abs(vData));
                intColor2 = ivec4(vData.x);
                intColor3 = ivec4(vData.xy, 0, 0);
            }
        `);
        gl.compileShader(fs);

        var program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        var posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        var positions = new Float32Array([
            -0.03, -0.03, 0.0, 0.03, -0.03, 0.0, 0.0, 0.03, 0.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        var posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        var dataBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, dataBuffer);
        var data = new Int32Array(instanceCount * 4);
        for (let i = 0; i < instanceCount; i++) {
            data[i * 4] = i * 1000;
            data[i * 4 + 1] = i * -500;
            data[i * 4 + 2] = i * 250;
            data[i * 4 + 3] = i * -125;
        }
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        var dataLoc = gl.getAttribLocation(program, 'instanceData');
        gl.enableVertexAttribArray(dataLoc);
        gl.vertexAttribIPointer(dataLoc, 4, gl.INT, 16, 0);
        gl.vertexAttribDivisor(dataLoc, 1);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([0, 0, 0, 0]));
        gl.clearBufferuiv(gl.COLOR, 1, new Uint32Array([0, 0, 0, 0]));
        gl.clearBufferiv(gl.COLOR, 2, new Int32Array([0, 0, 0, 0]));
        gl.clearBufferiv(gl.COLOR, 3, new Int32Array([0, 0, 0, 0]));
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, instanceCount);
    } catch(e) {}

    try {
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        var pixels1 = new Int32Array(texSize * texSize * 4);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.INT, pixels1);
        gl.readBuffer(gl.COLOR_ATTACHMENT1);
        var pixels2 = new Uint32Array(texSize * texSize * 4);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.UNSIGNED_INT, pixels2);
    } catch(e) {}

    try {
        gl.readBuffer(gl.COLOR_ATTACHMENT2);
        var pixels3 = new Int32Array(128 * 128 * 4);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
        gl.readPixels(64, 64, 128, 128, gl.RGBA_INTEGER, gl.INT, pixels3);
        gl.readBuffer(gl.COLOR_ATTACHMENT3);
        var pixels4 = new Int32Array(128 * 128 * 4);
        gl.readPixels(0, 0, 128, 128, gl.RGBA_INTEGER, gl.INT, pixels4);
    } catch(e) {}

    try {
        var pbo1 = gl.createBuffer();
        var pbo2 = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, texSize * texSize * 16, gl.STREAM_READ);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.INT, 0);

        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo2);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, texSize * texSize * 16, gl.STREAM_READ);
        gl.readBuffer(gl.COLOR_ATTACHMENT1);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.UNSIGNED_INT, 0);
    } catch(e) {}

    try {
        var fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        for (let w = 0; w < 100 && gl.clientWaitSync(fence, gl.SYNC_FLUSH_COMMANDS_BIT, 0) === gl.TIMEOUT_EXPIRED; w++) await new Promise(r => setTimeout(r, 10));
        var status = gl.clientWaitSync(fence, 0, 0);
        gl.deleteSync(fence);
    } catch(e) {}

    try {
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        var mapped1 = gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, new Int32Array(256));
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo2);
        var mapped2 = gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, new Uint32Array(256));
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 512);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 8);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 4);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        var pixels5 = new Int32Array(1048576);
        gl.readPixels(0, 0, 256, 256, gl.RGBA_INTEGER, gl.INT, pixels5);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        for (let i = 0; i < 4; i++) {
            gl.readBuffer(gl.COLOR_ATTACHMENT0 + i);
            const pixels = i === 1 ? new Uint32Array(64 * 64 * 4) : new Int32Array(64 * 64 * 4);
            gl.readPixels(i * 64, 0, 64, 64, gl.RGBA_INTEGER, i === 1 ? gl.UNSIGNED_INT : gl.INT, pixels);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.25, 0.25, 0.25, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.deleteBuffer(pbo1);
        gl.deleteBuffer(pbo2);
        gl.deleteTexture(intTex1);
        gl.deleteTexture(intTex2);
        gl.deleteTexture(intTex3);
        gl.deleteTexture(intTex4);
        gl.deleteFramebuffer(fbo);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

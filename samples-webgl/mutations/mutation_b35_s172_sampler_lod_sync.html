<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let samplerCount = 12;
    let minLodStart = 0.0;
    let maxLodStart = 8.0;
    let pollCount = 256;
    let textureSize = 256;
    let numDraws = 24;

    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, `#version 300 es
        in vec2 a_position;
        out vec2 v_texCoord;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
            v_texCoord = a_position * 0.5 + 0.5;
        }
    `);
    gl.compileShader(vertexShader);

    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, `#version 300 es
        precision mediump float;
        in vec2 v_texCoord;
        uniform sampler2D u_texture;
        out vec4 fragColor;
        void main() {
            fragColor = texture(u_texture, v_texCoord);
        }
    `);
    gl.compileShader(fragmentShader);

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    const positions = new Float32Array([
        -1, -1,
         1, -1,
        -1,  1,
         1,  1
    ]);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    const pixels = new Uint8Array(textureSize * textureSize * 4);
    for (let i = 0; i < pixels.length; i += 4) {
        pixels[i] = 64;
        pixels[i + 1] = 128;
        pixels[i + 2] = 192;
        pixels[i + 3] = 255;
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureSize, textureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

    try {
        gl.generateMipmap(gl.TEXTURE_2D);
    } catch (e) {
        throw new Error("Mipmap generation failed: " + e.message);
    }

    const samplers = [];
    const syncs = [];

    try {
        for (let i = 0; i < samplerCount; i++) {
            samplers[i] = gl.createSampler();
        }
    } catch (e) {
        throw new Error("Sampler creation failed: " + e.message);
    }

    try {
        for (let i = 0; i < samplerCount; i++) {
            const minLod = minLodStart + (i * 0.5);
            const maxLod = maxLodStart - (i * 0.3);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.samplerParameterf(samplers[i], gl.TEXTURE_MIN_LOD, minLod);
            gl.samplerParameterf(samplers[i], gl.TEXTURE_MAX_LOD, maxLod);
        }
    } catch (e) {
        throw new Error("Sampler LOD parameter setup failed: " + e.message);
    }

    try {
        gl.samplerParameteri(samplers[0], gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(samplers[0], gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch (e) {
        throw new Error("Sampler 0 wrap mode failed: " + e.message);
    }

    try {
        gl.samplerParameteri(samplers[3], gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.samplerParameteri(samplers[3], gl.TEXTURE_WRAP_T, gl.REPEAT);
    } catch (e) {
        throw new Error("Sampler 3 wrap mode failed: " + e.message);
    }

    try {
        gl.samplerParameteri(samplers[6], gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
        gl.samplerParameteri(samplers[6], gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
    } catch (e) {
        throw new Error("Sampler 6 wrap mode failed: " + e.message);
    }

    for (let draw = 0; draw < numDraws; draw++) {
        const samplerIndex = draw % samplerCount;

        try {
            gl.bindSampler(0, samplers[samplerIndex]);
        } catch (e) {
            throw new Error("Sampler binding failed: " + e.message);
        }

        try {
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        } catch (e) {
            throw new Error("Draw call failed: " + e.message);
        }

        try {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            syncs.push(sync);
        } catch (e) {
            throw new Error("Fence sync creation failed: " + e.message);
        }

        try {
            for (let poll = 0; poll < pollCount; poll++) {
                const status = gl.getSyncParameter(syncs[syncs.length - 1], gl.SYNC_STATUS);
                if (status === gl.SIGNALED) {
                    break;
                }
            }
        } catch (e) {
            throw new Error("Sync parameter polling failed: " + e.message);
        }

        try {
            gl.bindSampler(0, null);
        } catch (e) {
            throw new Error("Sampler unbinding failed: " + e.message);
        }
    }

    try {
        for (let i = 0; i < syncs.length; i++) {
            const condition = gl.getSyncParameter(syncs[i], gl.SYNC_CONDITION);
            if (condition !== gl.SYNC_GPU_COMMANDS_COMPLETE) {
                throw new Error("Invalid sync condition");
            }
        }
    } catch (e) {
        throw new Error("Sync condition query failed: " + e.message);
    }

    try {
        for (let i = 0; i < syncs.length; i++) {
            const flags = gl.getSyncParameter(syncs[i], gl.SYNC_FLAGS);
            if (flags !== 0) {
                throw new Error("Invalid sync flags");
            }
        }
    } catch (e) {
        throw new Error("Sync flags query failed: " + e.message);
    }

    try {
        for (let i = syncs.length - 1; i >= 0; i--) {
            gl.deleteSync(syncs[i]);
        }
    } catch (e) {
        throw new Error("Sync deletion failed: " + e.message);
    }

    try {
        for (let i = 0; i < samplerCount; i++) {
            const minLod = gl.getSamplerParameter(samplers[i], gl.TEXTURE_MIN_LOD);
            const maxLod = gl.getSamplerParameter(samplers[i], gl.TEXTURE_MAX_LOD);
            if (minLod === null || maxLod === null) {
                throw new Error("LOD query returned null");
            }
        }
    } catch (e) {
        throw new Error("Sampler LOD query failed: " + e.message);
    }

    try {
        for (let i = 0; i < samplerCount; i++) {
            gl.deleteSampler(samplers[i]);
        }
    } catch (e) {
        throw new Error("Sampler deletion failed: " + e.message);
    }

    gl.deleteTexture(texture);
    gl.deleteBuffer(buffer);
    gl.deleteProgram(program);
    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);
}

main().catch(err => { throw err; });
</script>
</body>
</html>

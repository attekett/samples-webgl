<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let shadowSamplerCount = 8;
    let numSyncs = 32;
    let textureSize = 256;
    let numDraws = 16;
    let waitSyncTimeout = 0;

    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, `#version 300 es
        in vec2 a_position;
        out vec2 v_texCoord;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
            v_texCoord = a_position * 0.5 + 0.5;
        }
    `);
    gl.compileShader(vertexShader);

    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, `#version 300 es
        precision mediump float;
        in vec2 v_texCoord;
        uniform sampler2DShadow u_shadowTexture;
        out vec4 fragColor;
        void main() {
            float shadow = texture(u_shadowTexture, vec3(v_texCoord, 0.5));
            fragColor = vec4(shadow, shadow, shadow, 1.0);
        }
    `);
    gl.compileShader(fragmentShader);

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    const positions = new Float32Array([
        -1, -1,
         1, -1,
        -1,  1,
         1,  1
    ]);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    const depthData = new Float32Array(textureSize * textureSize);
    for (let i = 0; i < depthData.length; i++) {
        depthData[i] = Math.random();
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT32F, textureSize, textureSize, 0, gl.DEPTH_COMPONENT, gl.FLOAT, depthData);

    try {
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
    } catch (e) {
        throw new Error("Texture shadow comparison setup failed: " + e.message);
    }

    const samplers = [];
    const syncs = [];
    const compareFuncs = [
        gl.LEQUAL,
        gl.GEQUAL,
        gl.LESS,
        gl.GREATER,
        gl.EQUAL,
        gl.NOTEQUAL,
        gl.ALWAYS,
        gl.NEVER
    ];

    try {
        for (let i = 0; i < shadowSamplerCount; i++) {
            samplers[i] = gl.createSampler();
        }
    } catch (e) {
        throw new Error("Sampler creation failed: " + e.message);
    }

    try {
        for (let i = 0; i < shadowSamplerCount; i++) {
            gl.samplerParameteri(samplers[i], gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_COMPARE_FUNC, compareFuncs[i]);
        }
    } catch (e) {
        throw new Error("Shadow sampler parameter setup failed: " + e.message);
    }

    try {
        gl.samplerParameteri(samplers[0], gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(samplers[0], gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch (e) {
        throw new Error("Sampler 0 wrap mode failed: " + e.message);
    }

    try {
        gl.samplerParameteri(samplers[4], gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.samplerParameteri(samplers[4], gl.TEXTURE_WRAP_T, gl.REPEAT);
    } catch (e) {
        throw new Error("Sampler 4 wrap mode failed: " + e.message);
    }

    for (let draw = 0; draw < numDraws; draw++) {
        const samplerIndex = draw % shadowSamplerCount;

        try {
            gl.bindSampler(0, samplers[samplerIndex]);
        } catch (e) {
            throw new Error("Sampler binding failed: " + e.message);
        }

        try {
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        } catch (e) {
            throw new Error("Draw call failed: " + e.message);
        }

        try {
            for (let s = 0; s < 2; s++) {
                const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
                syncs.push(sync);
            }
        } catch (e) {
            throw new Error("Multiple fence sync creation failed: " + e.message);
        }

        try {
            for (let s = syncs.length - 2; s < syncs.length; s++) {
                gl.waitSync(syncs[s], 0, gl.TIMEOUT_IGNORED);
            }
        } catch (e) {
            throw new Error("WaitSync failed: " + e.message);
        }

        try {
            gl.bindSampler(0, null);
        } catch (e) {
            throw new Error("Sampler unbinding failed: " + e.message);
        }
    }

    try {
        for (let i = 0; i < syncs.length; i++) {
            const status = gl.getSyncParameter(syncs[i], gl.SYNC_STATUS);
            const condition = gl.getSyncParameter(syncs[i], gl.SYNC_CONDITION);
            if (status !== gl.SIGNALED && status !== gl.UNSIGNALED) {
                throw new Error("Invalid sync status");
            }
            if (condition !== gl.SYNC_GPU_COMMANDS_COMPLETE) {
                throw new Error("Invalid sync condition");
            }
        }
    } catch (e) {
        throw new Error("Sync parameter query failed: " + e.message);
    }

    try {
        for (let i = 0; i < shadowSamplerCount; i++) {
            const compareMode = gl.getSamplerParameter(samplers[i], gl.TEXTURE_COMPARE_MODE);
            const compareFunc = gl.getSamplerParameter(samplers[i], gl.TEXTURE_COMPARE_FUNC);
            if (compareMode !== gl.COMPARE_REF_TO_TEXTURE) {
                throw new Error("Invalid compare mode");
            }
            if (compareFunc === null) {
                throw new Error("Compare func query returned null");
            }
        }
    } catch (e) {
        throw new Error("Sampler compare parameter query failed: " + e.message);
    }

    try {
        for (let i = 0; i < syncs.length; i++) {
            gl.deleteSync(syncs[i]);
        }
    } catch (e) {
        throw new Error("Sync deletion failed: " + e.message);
    }

    try {
        for (let i = 0; i < shadowSamplerCount; i++) {
            gl.deleteSampler(samplers[i]);
        }
    } catch (e) {
        throw new Error("Sampler deletion failed: " + e.message);
    }

    gl.deleteTexture(texture);
    gl.deleteBuffer(buffer);
    gl.deleteProgram(program);
    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);
}

main().catch(err => { throw err; });
</script>
</body>
</html>

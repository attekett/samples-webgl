<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let samplerCount = 16;
    let churnIterations = 512;
    let textureSize = 256;
    let zeroTimeout = 0;

    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, `#version 300 es
        in vec2 a_position;
        out vec2 v_texCoord;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
            v_texCoord = a_position * 0.5 + 0.5;
        }
    `);
    gl.compileShader(vertexShader);

    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, `#version 300 es
        precision mediump float;
        in vec2 v_texCoord;
        uniform sampler2D u_texture;
        out vec4 fragColor;
        void main() {
            fragColor = texture(u_texture, v_texCoord);
        }
    `);
    gl.compileShader(fragmentShader);

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    gl.useProgram(program);

    const positions = new Float32Array([
        -1, -1,
         1, -1,
        -1,  1,
         1,  1
    ]);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    const pixels = new Uint8Array(textureSize * textureSize * 4);
    for (let i = 0; i < pixels.length; i += 4) {
        pixels[i] = 200;
        pixels[i + 1] = 100;
        pixels[i + 2] = 50;
        pixels[i + 3] = 255;
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureSize, textureSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

    const samplers = [];
    const syncs = [];

    try {
        for (let i = 0; i < samplerCount; i++) {
            samplers[i] = gl.createSampler();
        }
    } catch (e) {
        throw new Error("Sampler creation failed: " + e.message);
    }

    try {
        for (let i = 0; i < samplerCount; i++) {
            gl.samplerParameteri(samplers[i], gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.samplerParameteri(samplers[i], gl.TEXTURE_WRAP_T, gl.REPEAT);
        }
    } catch (e) {
        throw new Error("Sampler parameter setup failed: " + e.message);
    }

    for (let churn = 0; churn < churnIterations; churn++) {
        const samplerIndex = churn % samplerCount;

        try {
            gl.bindSampler(0, samplers[samplerIndex]);
        } catch (e) {
            throw new Error("Sampler binding failed at iteration: " + churn);
        }

        try {
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        } catch (e) {
            throw new Error("Draw call failed at iteration: " + churn);
        }

        try {
            gl.bindSampler(0, null);
        } catch (e) {
            throw new Error("Sampler unbinding failed at iteration: " + churn);
        }

        try {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            syncs.push(sync);
        } catch (e) {
            throw new Error("Fence sync creation failed at iteration: " + churn);
        }

        try {
            gl.clientWaitSync(syncs[syncs.length - 1], 0, zeroTimeout);
        } catch (e) {
            throw new Error("ClientWaitSync failed at iteration: " + churn);
        }
    }

    try {
        for (let i = 0; i < syncs.length; i += 16) {
            const status = gl.getSyncParameter(syncs[i], gl.SYNC_STATUS);
            if (status !== gl.SIGNALED && status !== gl.UNSIGNALED) {
                throw new Error("Invalid sync status at index: " + i);
            }
        }
    } catch (e) {
        throw new Error("Sync status query failed: " + e.message);
    }

    const deletionIndices = [];
    try {
        for (let i = 0; i < samplerCount; i += 2) {
            deletionIndices.push(i);
            gl.deleteSampler(samplers[i]);
        }
    } catch (e) {
        throw new Error("Sampler deletion (even indices) failed: " + e.message);
    }

    try {
        for (let i = 0; i < churnIterations; i += 64) {
            gl.bindSampler(0, samplers[deletionIndices[0]]);
            gl.bindSampler(0, null);
        }
    } catch (e) {
    }

    try {
        for (let i = syncs.length - 1; i >= 0; i -= 8) {
            gl.waitSync(syncs[i], 0, gl.TIMEOUT_IGNORED);
        }
    } catch (e) {
        throw new Error("WaitSync on subset failed: " + e.message);
    }

    try {
        for (let i = 0; i < syncs.length; i++) {
            gl.deleteSync(syncs[i]);
        }
    } catch (e) {
        throw new Error("Sync deletion failed: " + e.message);
    }

    try {
        for (let i = 1; i < samplerCount; i += 2) {
            gl.deleteSampler(samplers[i]);
        }
    } catch (e) {
        throw new Error("Sampler deletion (odd indices) failed: " + e.message);
    }

    try {
        gl.bindSampler(0, null);
        gl.bindSampler(1, null);
        gl.bindSampler(2, null);
    } catch (e) {
        throw new Error("Final sampler unbinding failed: " + e.message);
    }

    gl.deleteTexture(texture);
    gl.deleteBuffer(buffer);
    gl.deleteProgram(program);
    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);
}

main().catch(err => { throw err; });
</script>
</body>
</html>

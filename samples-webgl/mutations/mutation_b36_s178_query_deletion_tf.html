<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let queryDeleteCount = 12;
    let vertexCount = 640;
    let tfBufferSize = 16384;
    let deleteIterations = 8;
    let recreateCount = 6;
    let uafAttempts = 4;

    const TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN = 0x8C88;
    const ANY_SAMPLES_PASSED = 0x8C2F;
    const QUERY_RESULT = 0x8866;
    const QUERY_RESULT_AVAILABLE = 0x8867;

    let tfMode = gl.TRIANGLES;
    let tfBufferTarget = gl.TRANSFORM_FEEDBACK_BUFFER;

    const vertexShader = `#version 300 es
        in vec3 a_position;
        in vec4 a_velocity;
        out vec3 v_position;
        out vec4 v_velocity;
        uniform float u_time;
        uniform vec2 u_params;
        void main() {
            vec3 newPos = a_position + a_velocity.xyz * u_time;
            vec4 newVel = a_velocity * u_params.x;
            v_position = newPos;
            v_velocity = newVel;
            gl_Position = vec4(newPos, 1.0);
        }
    `;

    const fragmentShader = `#version 300 es
        precision highp float;
        in vec4 v_velocity;
        out vec4 fragColor;
        void main() {
            fragColor = abs(v_velocity);
        }
    `;

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vertexShader);
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vs));
        }

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fragmentShader);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fs));
        }

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['v_position', 'v_velocity'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
    } catch (e) {}

    function createVertexData(count) {
        const stride = 7;
        const data = new Float32Array(count * stride);
        for (let i = 0; i < count; i++) {
            const base = i * stride;
            data[base + 0] = (Math.random() - 0.5) * 1.8;
            data[base + 1] = (Math.random() - 0.5) * 1.8;
            data[base + 2] = (Math.random() - 0.5) * 0.8;
            data[base + 3] = (Math.random() - 0.5) * 0.05;
            data[base + 4] = (Math.random() - 0.5) * 0.05;
            data[base + 5] = (Math.random() - 0.5) * 0.02;
            data[base + 6] = Math.random();
        }
        return data;
    }

    const vertexData = createVertexData(vertexCount);

    let vbo;
    try {
        vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
    } catch (e) {}

    let tfBuffer;
    try {
        tfBuffer = gl.createBuffer();
        gl.bindBuffer(tfBufferTarget, tfBuffer);
        gl.bufferData(tfBufferTarget, tfBufferSize, gl.DYNAMIC_COPY);
        gl.bindBuffer(tfBufferTarget, null);
    } catch (e) {}

    let vao;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);

        const posLoc = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 28, 0);

        const velLoc = gl.getAttribLocation(program, 'a_velocity');
        gl.enableVertexAttribArray(velLoc);
        gl.vertexAttribPointer(velLoc, 4, gl.FLOAT, false, 28, 12);

        gl.bindVertexArray(null);
    } catch (e) {}

    let tf;
    try {
        tf = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBufferBase(tfBufferTarget, 0, tfBuffer);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    } catch (e) {}

    let activeQueries = [];
    try {
        for (let i = 0; i < queryDeleteCount; i++) {
            const q = gl.createQuery();
            activeQueries.push(q);
        }
    } catch (e) {}

    try {
        gl.useProgram(program);
        const timeLoc = gl.getUniformLocation(program, 'u_time');
        const paramsLoc = gl.getUniformLocation(program, 'u_params');

        gl.bindVertexArray(vao);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);

        for (let i = 0; i < activeQueries.length; i++) {
            gl.uniform1f(timeLoc, i * 0.02);
            gl.uniform2f(paramsLoc, 0.95, 1.0);

            gl.beginQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, activeQueries[i]);
            gl.beginTransformFeedback(tfMode);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
            gl.endTransformFeedback();
            gl.endQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
        }

        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.bindVertexArray(null);
    } catch (e) {}

    try {
        for (let i = 0; i < deleteIterations; i++) {
            const deleteIdx = i % activeQueries.length;
            gl.deleteQuery(activeQueries[deleteIdx]);
            activeQueries[deleteIdx] = null;
        }
    } catch (e) {}

    try {
        for (let i = 0; i < activeQueries.length; i++) {
            if (activeQueries[i]) {
                let available = gl.getQueryParameter(activeQueries[i], QUERY_RESULT_AVAILABLE);
                if (available) {
                    const result = gl.getQueryParameter(activeQueries[i], QUERY_RESULT);
                }
            }
        }
    } catch (e) {}

    try {
        gl.bindVertexArray(vao);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);

        const deleteThenReadQuery = gl.createQuery();
        gl.beginQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, deleteThenReadQuery);
        gl.beginTransformFeedback(tfMode);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount / 2);
        gl.endTransformFeedback();
        gl.endQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);

        gl.deleteQuery(deleteThenReadQuery);

        let uafResult = gl.getQueryParameter(deleteThenReadQuery, QUERY_RESULT_AVAILABLE);

        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.bindVertexArray(null);
    } catch (e) {}

    try {
        gl.bindVertexArray(vao);
        gl.enable(gl.RASTERIZER_DISCARD);

        const deletedTf = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, deletedTf);
        gl.bindBufferBase(tfBufferTarget, 0, tfBuffer);

        gl.deleteTransformFeedback(deletedTf);

        gl.beginTransformFeedback(tfMode);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount / 4);
        gl.endTransformFeedback();

        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindVertexArray(null);
    } catch (e) {}

    let recreatedQueries = [];
    try {
        for (let i = 0; i < recreateCount; i++) {
            const q = gl.createQuery();
            recreatedQueries.push(q);
        }
    } catch (e) {}

    try {
        gl.bindVertexArray(vao);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);

        for (let i = 0; i < recreatedQueries.length; i++) {
            gl.beginQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, recreatedQueries[i]);
            gl.beginTransformFeedback(tfMode);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount / 3);
            gl.endTransformFeedback();
            gl.endQuery(TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
        }

        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.bindVertexArray(null);
    } catch (e) {}

    try {
        for (let i = 0; i < recreatedQueries.length; i++) {
            let available = false;
            let pollCount = 0;
            while (!available && pollCount < 100) {
                available = gl.getQueryParameter(recreatedQueries[i], QUERY_RESULT_AVAILABLE);
                pollCount++;
            }
            if (available) {
                const result = gl.getQueryParameter(recreatedQueries[i], QUERY_RESULT);
            }
        }
    } catch (e) {}

    try {
        gl.clearColor(0.2, 0.1, 0.15, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);

        gl.bindVertexArray(vao);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.bindVertexArray(null);
    } catch (e) {}

    try {
        for (let i = 0; i < activeQueries.length; i++) {
            if (activeQueries[i]) {
                gl.deleteQuery(activeQueries[i]);
            }
        }
        for (let i = 0; i < recreatedQueries.length; i++) {
            gl.deleteQuery(recreatedQueries[i]);
        }
    } catch (e) {}

    try {
        gl.deleteTransformFeedback(tf);
        gl.deleteVertexArray(vao);
        gl.deleteBuffer(vbo);
        gl.deleteBuffer(tfBuffer);
        gl.deleteProgram(program);
    } catch (e) {}

    gl.flush();
    gl.finish();
}

main().catch(err => { throw err; });
</script>
</body>
</html>

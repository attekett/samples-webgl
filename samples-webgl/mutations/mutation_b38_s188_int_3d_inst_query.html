<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texDepth = 64;
const texSize = 64;
const instanceCount = 1024;
const queryCount = 16;
const sliceCount = 32;
const clearValue = 8191;

const texture3DTarget = 32879;
const intFormat3D = 36226;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let int3DTex;
    try {
        int3DTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_3D, int3DTex);
        gl.texStorage3D(gl.TEXTURE_3D, 1, gl.R32I, texSize, texSize, texDepth);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    let queries = [];
    try {
        for (let i = 0; i < queryCount; i++) {
            queries[i] = gl.createQuery();
        }
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[0]);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, queries[1]);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[2]);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
    } catch(e) {}

    let sliceFBOs = [];
    let sliceTextures = [];
    try {
        for (let slice = 0; slice < sliceCount; slice++) {
            sliceTextures[slice] = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, sliceTextures[slice]);
            gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R32I, texSize, texSize);

            sliceFBOs[slice] = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, sliceFBOs[slice]);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sliceTextures[slice], 0);
        }
    } catch(e) {}

    try {
        for (let i = 0; i < sliceCount; i++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, sliceFBOs[i]);
            const val = clearValue + i * 100;
            gl.clearBufferiv(gl.COLOR, 0, new Int32Array([val, 0, 0, 0]));
        }
    } catch(e) {}

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in float instanceSlice;
            flat out int vSlice;
            out vec3 vPos;
            void main() {
                vSlice = int(instanceSlice);
                float offset = float(gl_InstanceID) / ${instanceCount}.0;
                vPos = position * 0.5 + 0.5;
                vec3 pos = position * 0.015;
                pos.x += (offset * 2.0 - 1.0);
                pos.y += sin(offset * 18.84955) * 0.3;
                gl_Position = vec4(pos, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            flat in int vSlice;
            in vec3 vPos;
            out ivec4 fragColor;
            void main() {
                int value = int(vPos.x * 8191.0) + int(vPos.y * 8191.0) + vSlice * 50;
                fragColor = ivec4(value, 0, 0, 0);
            }
        `);
        gl.compileShader(fs);

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    let vao, posBuffer, sliceBuffer;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const vertices = new Float32Array([
            -1, -1, 0, 1, -1, 0, 0, 1, 0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        sliceBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sliceBuffer);
        const slices = new Float32Array(instanceCount);
        for (let i = 0; i < instanceCount; i++) {
            slices[i] = i % texDepth;
        }
        gl.bufferData(gl.ARRAY_BUFFER, slices, gl.STATIC_DRAW);
        const sliceLoc = gl.getAttribLocation(program, 'instanceSlice');
        gl.enableVertexAttribArray(sliceLoc);
        gl.vertexAttribPointer(sliceLoc, 1, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(sliceLoc, 1);
    } catch(e) {}

    try {
        for (let slice = 0; slice < sliceCount; slice++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, sliceFBOs[slice]);
            gl.viewport(0, 0, texSize, texSize);
            const queryIdx = 3 + (slice % 8);
            gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[queryIdx]);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 32);
            gl.endQuery(gl.ANY_SAMPLES_PASSED);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, sliceFBOs[0]);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[11]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 512);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, sliceFBOs[15]);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([999, 0, 0, 0]));
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 256);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([111, 0, 0, 0]));
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.15, 0.2, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 128);
    } catch(e) {}

    try {
        for (let i = 0; i < 256; i++) {
            const available = gl.getQueryParameter(queries[3], gl.QUERY_RESULT_AVAILABLE);
            if (available) {
                const result = gl.getQueryParameter(queries[3], gl.QUERY_RESULT);
                break;
            }
        }
        for (let i = 0; i < 256; i++) {
            const available = gl.getQueryParameter(queries[11], gl.QUERY_RESULT_AVAILABLE);
            if (available) {
                const result = gl.getQueryParameter(queries[11], gl.QUERY_RESULT);
                break;
            }
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, sliceFBOs[7]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 64);
        gl.bindFramebuffer(gl.FRAMEBUFFER, sliceFBOs[23]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 64);
    } catch(e) {}

    try {
        for (let i = 0; i < queryCount; i++) {
            gl.deleteQuery(queries[i]);
        }
        for (let i = 0; i < sliceCount; i++) {
            gl.deleteFramebuffer(sliceFBOs[i]);
            gl.deleteTexture(sliceTextures[i]);
        }
        gl.deleteTexture(int3DTex);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

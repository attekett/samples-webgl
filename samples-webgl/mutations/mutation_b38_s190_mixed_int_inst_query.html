<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 1024;
const queryCount = 16;
const texSize = 256;
const formatCount = 6;
const clearValue = 16383;

const intFormatR8I = 36228;
const intFormatR16I = 36232;
const intFormatR32I = 36226;
const intFormatRGBA8UI = 36221;
const intFormatRGBA16UI = 36214;
const intFormatRGBA32UI = 36208;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let textures = [];
    let formats = [gl.R8I, gl.R16I, gl.R32I, gl.RGBA8UI, gl.RGBA16UI, gl.RGBA32UI];
    try {
        for (let i = 0; i < formatCount; i++) {
            textures[i] = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, textures[i]);
            gl.texStorage2D(gl.TEXTURE_2D, 1, formats[i], texSize, texSize);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        }
    } catch(e) {}

    let fbos = [];
    try {
        for (let i = 0; i < formatCount; i++) {
            fbos[i] = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[i]);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, textures[i], 0);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0]);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([127, 0, 0, 0]));
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[1]);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([16383, 0, 0, 0]));
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[2]);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([clearValue, 0, 0, 0]));
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[3]);
        gl.clearBufferuiv(gl.COLOR, 0, new Uint32Array([255, 255, 255, 255]));
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[4]);
        gl.clearBufferuiv(gl.COLOR, 0, new Uint32Array([65535, 65535, 65535, 65535]));
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[5]);
        gl.clearBufferuiv(gl.COLOR, 0, new Uint32Array([4294967295, 4294967295, 4294967295, 4294967295]));
    } catch(e) {}

    let queries = [];
    try {
        for (let i = 0; i < queryCount; i++) {
            queries[i] = gl.createQuery();
        }
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[0]);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, queries[1]);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
    } catch(e) {}

    let programs = [];
    try {
        const vsSource = `#version 300 es
            in vec3 position;
            in float instanceValue;
            flat out int vValue;
            void main() {
                vValue = int(instanceValue);
                float offset = float(gl_InstanceID) / ${instanceCount}.0;
                vec3 pos = position * 0.012;
                pos.x += (offset * 2.0 - 1.0);
                pos.y += cos(offset * 31.41592) * 0.35;
                gl_Position = vec4(pos, 1.0);
            }
        `;

        const fsSources = [
            `#version 300 es
                precision highp float;
                flat in int vValue;
                out ivec4 fragColor;
                void main() { fragColor = ivec4(vValue % 127, 0, 0, 0); }
            `,
            `#version 300 es
                precision highp float;
                flat in int vValue;
                out ivec4 fragColor;
                void main() { fragColor = ivec4(vValue % 16383, 0, 0, 0); }
            `,
            `#version 300 es
                precision highp float;
                flat in int vValue;
                out ivec4 fragColor;
                void main() { fragColor = ivec4(vValue, 0, 0, 0); }
            `,
            `#version 300 es
                precision highp float;
                flat in int vValue;
                out uvec4 fragColor;
                void main() { fragColor = uvec4(vValue % 255, vValue % 128, vValue % 64, 255); }
            `,
            `#version 300 es
                precision highp float;
                flat in int vValue;
                out uvec4 fragColor;
                void main() { fragColor = uvec4(vValue % 65535, vValue % 32768, vValue % 16384, 65535); }
            `,
            `#version 300 es
                precision highp float;
                flat in int vValue;
                out uvec4 fragColor;
                void main() { fragColor = uvec4(vValue, vValue * 2, vValue * 3, vValue * 4); }
            `
        ];

        for (let i = 0; i < formatCount; i++) {
            const vs = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vs, vsSource);
            gl.compileShader(vs);

            const fs = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fs, fsSources[i]);
            gl.compileShader(fs);

            programs[i] = gl.createProgram();
            gl.attachShader(programs[i], vs);
            gl.attachShader(programs[i], fs);
            gl.linkProgram(programs[i]);
        }
    } catch(e) {}

    let vao, posBuffer, valueBuffer;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const vertices = new Float32Array([
            -1, -1, 0, 1, -1, 0, 0, 1, 0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        valueBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, valueBuffer);
        const values = new Float32Array(instanceCount);
        for (let i = 0; i < instanceCount; i++) {
            values[i] = i * 17 + (i % 256);
        }
        gl.bufferData(gl.ARRAY_BUFFER, values, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        for (let format = 0; format < formatCount; format++) {
            gl.useProgram(programs[format]);

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            const posLoc = gl.getAttribLocation(programs[format], 'position');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, valueBuffer);
            const valueLoc = gl.getAttribLocation(programs[format], 'instanceValue');
            gl.enableVertexAttribArray(valueLoc);
            gl.vertexAttribPointer(valueLoc, 1, gl.FLOAT, false, 0, 0);
            gl.vertexAttribDivisor(valueLoc, 1);

            gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[format]);
            gl.viewport(0, 0, texSize, texSize);

            const queryIdx = 2 + format;
            gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[queryIdx]);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 256);
            gl.endQuery(gl.ANY_SAMPLES_PASSED);
        }
    } catch(e) {}

    try {
        gl.useProgram(programs[0]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0]);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[8]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 512);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
    } catch(e) {}

    try {
        gl.useProgram(programs[3]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[3]);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[9]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 512);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.1, 0.05, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(programs[2]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 64);
    } catch(e) {}

    try {
        for (let i = 0; i < 256; i++) {
            let allReady = true;
            for (let q = 0; q < 10; q++) {
                const available = gl.getQueryParameter(queries[q], gl.QUERY_RESULT_AVAILABLE);
                if (!available) allReady = false;
            }
            if (allReady) {
                for (let q = 0; q < 10; q++) {
                    const result = gl.getQueryParameter(queries[q], gl.QUERY_RESULT);
                }
                break;
            }
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[2]);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([999, 0, 0, 0]));
        gl.useProgram(programs[2]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 128);
    } catch(e) {}

    try {
        for (let i = 0; i < queryCount; i++) {
            gl.deleteQuery(queries[i]);
        }
        for (let i = 0; i < formatCount; i++) {
            gl.deleteProgram(programs[i]);
            gl.deleteFramebuffer(fbos[i]);
            gl.deleteTexture(textures[i]);
        }
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

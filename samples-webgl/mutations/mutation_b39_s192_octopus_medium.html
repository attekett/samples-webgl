<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    let intFbo, copyTex, vertexShader, fragmentShader, program, tfVertexShader, tfFragmentShader, tfProgram, rb1, rb2, rb3, rb4, intTex1, intTex2, floatTex, sampler1, sampler2, sampler3, sampler4, sampler5, sampler6, sampler7, sampler8, tfBuffer1, tfBuffer2, vao, posBuffer, positions, colorBuffer, colors, idBuffer, ids, query1, query2, query3, query4, sync1, sync2, sync3, sync4, sync5, sync6, sync7, sync8, pbo, fbo, texAttach, pixels, floatPixels, intPixels;

    const texSize = 256;
    const vertexCount = 6;
    const instanceCount = 512;
    const bufferSize = 8192;
    const rbSamples = 4;
    const mipLevels = 4;

    const vertexShaderSource = `#version 300 es
    in vec4 a_position;
    in vec4 a_color;
    in float a_instanceId;
    out vec4 v_color;
    void main() {
        v_color = a_color + vec4(a_instanceId * 0.001);
        gl_Position = a_position + vec4(float(gl_InstanceID) * 0.001);
    }`;

    const fragmentShaderSource = `#version 300 es
    precision highp float;
    precision highp int;
    precision highp isampler2D;
    precision highp usampler2D;
    in vec4 v_color;
    layout(location = 0) out vec4 outColor0;
    layout(location = 1) out ivec4 outColor1;
    uniform isampler2D u_intTex;
    uniform usampler2D u_uintTex;
    uniform sampler2D u_floatTex;
    void main() {
        outColor0 = v_color * texture(u_floatTex, vec2(0.5));
        outColor1 = ivec4(texture(u_intTex, vec2(0.5))) + ivec4(texture(u_uintTex, vec2(0.5)));
    }`;

    const tfVertexShaderSource = `#version 300 es
    in vec4 a_position;
    out vec4 v_tfOutput1;
    out vec4 v_tfOutput2;
    void main() {
        v_tfOutput1 = a_position * 2.0;
        v_tfOutput2 = a_position * 0.5;
        gl_Position = a_position;
    }`;

    const tfFragmentShaderSource = `#version 300 es
    precision highp float;
    out vec4 outColor;
    void main() {
        outColor = vec4(0.5, 0.5, 0.5, 1.0);
    }`;

    try {
        vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vertexShaderSource);
        gl.compileShader(vertexShader);
        fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, fragmentShaderSource);
        gl.compileShader(fragmentShader);
        program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.bindAttribLocation(program, 0, 'a_position');
        gl.bindAttribLocation(program, 1, 'a_color');
        gl.bindAttribLocation(program, 2, 'a_instanceId');
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        tfVertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(tfVertexShader, tfVertexShaderSource);
        gl.compileShader(tfVertexShader);
        tfFragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(tfFragmentShader, tfFragmentShaderSource);
        gl.compileShader(tfFragmentShader);
        tfProgram = gl.createProgram();
        gl.attachShader(tfProgram, tfVertexShader);
        gl.attachShader(tfProgram, tfFragmentShader);
        gl.transformFeedbackVaryings(tfProgram, ['v_tfOutput1', 'v_tfOutput2'], gl.SEPARATE_ATTRIBS);
        gl.linkProgram(tfProgram);
    } catch(e) {}

    try {
        rb1 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rb1);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, Math.min(rbSamples, gl.getParameter(gl.MAX_SAMPLES)), gl.RGBA8, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        rb2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rb2);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, Math.min(8, gl.getParameter(gl.MAX_SAMPLES)), gl.RGBA32F, 128, 128);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        rb3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rb3);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16F, 256, 256);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        rb4 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rb4);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
    } catch(e) {}

    try {
        intTex1 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, intTex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32I, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.INT, new Int32Array(texSize * texSize * 4));
        intFbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, intFbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, intTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindTexture(gl.TEXTURE_2D, null);
        intTex2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, intTex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32UI, 128, 128);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 128, 128, gl.RGBA_INTEGER, gl.UNSIGNED_INT, new Uint32Array(128 * 128 * 4));
        gl.bindTexture(gl.TEXTURE_2D, null);
    } catch(e) {}

    try {
        floatTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, floatTex);
        gl.texStorage2D(gl.TEXTURE_2D, mipLevels, gl.RGBA32F, 256, 256);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        for (let level = 0; level < mipLevels; level++) {
            const levelSize = 256 >> level;
            gl.texSubImage2D(gl.TEXTURE_2D, level, 0, 0, levelSize, levelSize, gl.RGBA, gl.FLOAT, new Float32Array(levelSize * levelSize * 4));
        }
        gl.bindTexture(gl.TEXTURE_2D, null);
    } catch(e) {}

    try {
        sampler1 = gl.createSampler();
        gl.samplerParameteri(sampler1, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.samplerParameteri(sampler1, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        sampler2 = gl.createSampler();
        gl.samplerParameteri(sampler2, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.samplerParameteri(sampler2, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        sampler3 = gl.createSampler();
        gl.samplerParameteri(sampler3, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.samplerParameteri(sampler3, gl.TEXTURE_MIN_LOD, 0);
        gl.samplerParameteri(sampler3, gl.TEXTURE_MAX_LOD, mipLevels);
        sampler4 = gl.createSampler();
        gl.samplerParameteri(sampler4, gl.TEXTURE_MIN_LOD, 1);
        gl.samplerParameteri(sampler4, gl.TEXTURE_MAX_LOD, 3);
        sampler5 = gl.createSampler();
        gl.samplerParameteri(sampler5, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(sampler5, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        sampler6 = gl.createSampler();
        gl.samplerParameteri(sampler6, gl.TEXTURE_WRAP_S, gl.REPEAT);
        sampler7 = gl.createSampler();
        gl.samplerParameteri(sampler7, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
        sampler8 = gl.createSampler();
        gl.samplerParameteri(sampler8, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_NEAREST);
    } catch(e) {}

    try {
        tfBuffer1 = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer1);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, bufferSize, gl.DYNAMIC_COPY);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer1);
        tfBuffer2 = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer2);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 4096, gl.DYNAMIC_COPY);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, tfBuffer2);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, null);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        positions = new Float32Array([
            -0.9, -0.9, 0.0, 1.0,
             0.9, -0.9, 0.0, 1.0,
            -0.9,  0.9, 0.0, 1.0,
            -0.9,  0.9, 0.0, 1.0,
             0.9, -0.9, 0.0, 1.0,
             0.9,  0.9, 0.0, 1.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 16, 0);
        colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        colors = new Float32Array(instanceCount * 4);
        for (let i = 0; i < colors.length; i += 4) {
            colors[i] = 0.6;
            colors[i + 1] = 0.8;
            colors[i + 2] = 0.4;
            colors[i + 3] = 1.0;
        }
        gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(1, 1);
        idBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, idBuffer);
        ids = new Float32Array(instanceCount);
        for (let i = 0; i < instanceCount; i++) {
            ids[i] = i;
        }
        gl.bufferData(gl.ARRAY_BUFFER, ids, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(2, 1);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        query1 = gl.createQuery();
        query2 = gl.createQuery();
        query3 = gl.createQuery();
        query4 = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, query1);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, query2);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, query3);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
        gl.getQueryParameter(query1, gl.QUERY_RESULT_AVAILABLE);
        gl.getQueryParameter(query2, gl.QUERY_RESULT_AVAILABLE);
    } catch(e) {}

    try {
        sync1 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(sync1, 0, 0);
        sync2 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(sync2, 0, 0);
        sync3 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(sync3, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
        sync4 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.getSyncParameter(sync4, gl.SYNC_STATUS);
        sync5 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.waitSync(sync5, 0, gl.TIMEOUT_IGNORED);
        sync6 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(sync6, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
        sync7 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.deleteSync(sync7);
        sync8 = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.getSyncParameter(sync8, gl.SYNC_CONDITION);
    } catch(e) {}

    try {
        pbo = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, texSize * texSize * 4, gl.STREAM_READ);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        texAttach = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texAttach);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, 256, 256);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texAttach, 0);
        gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]);
        gl.bindTexture(gl.TEXTURE_2D, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 128);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 0);
        copyTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, copyTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(256 * 256 * 4));
        gl.copyTexSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 0, 0, 64, 64);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.blendEquation(gl.FUNC_ADD);
        gl.disable(gl.BLEND);
    } catch(e) {}

    try {
        gl.useProgram(program);
        gl.uniform1i(gl.getUniformLocation(program, 'u_intTex'), 0);
        gl.uniform1i(gl.getUniformLocation(program, 'u_uintTex'), 1);
        gl.uniform1i(gl.getUniformLocation(program, 'u_floatTex'), 2);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, intTex1);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, intTex2);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, floatTex);
        gl.bindVertexArray(vao);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.flush();
        gl.finish();
    } catch(e) {}

    try {
        pixels = new Uint8Array(256 * 256 * 4);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        floatPixels = new Float32Array(128 * 128 * 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.FLOAT, 0);
        intPixels = new Int32Array(64 * 64 * 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, intFbo);
        gl.readPixels(0, 0, 64, 64, gl.RGBA_INTEGER, gl.INT, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.clearColor(0.2, 0.3, 0.4, 1.0);
        gl.clearDepth(1.0);
        gl.clearStencil(0);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

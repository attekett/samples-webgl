        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, intTex1);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, intTex2);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, floatTex1);
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, floatTex2);
        gl.bindVertexArray(vao);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, 128, 128);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.flush();
        gl.finish();
    } catch(e) {}

    try {
        pixels = new Uint8Array(256 * 256 * 4);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        floatPixels = new Float32Array(128 * 128 * 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.FLOAT, 0);
        intPixels = new Int32Array(64 * 64 * 4);
        gl.readBuffer(gl.COLOR_ATTACHMENT2);
        gl.readPixels(0, 0, 64, 64, gl.RGBA_INTEGER, gl.INT, 0);
        uintPixels = new Uint32Array(32 * 32 * 4);
        gl.readBuffer(gl.COLOR_ATTACHMENT3);
        gl.readPixels(0, 0, 32, 32, gl.RGBA_INTEGER, gl.UNSIGNED_INT, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearBufferfv(gl.COLOR, 0, [0.1, 0.2, 0.3, 1.0]);
        gl.clearBufferiv(gl.COLOR, 2, [0, 0, 0, 0]);
        gl.clearBufferuiv(gl.COLOR, 3, [0, 0, 0, 0]);
        gl.clearBufferfv(gl.COLOR, 1, [0.0, 0.0, 0.0, 0.0]);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>

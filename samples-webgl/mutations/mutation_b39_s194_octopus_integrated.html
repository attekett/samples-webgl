<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    let copyTex, tfVertexShader, tfFragmentShader, tfProgram, mainVertexShader, mainFragmentShader, mainProgram, tfBuffer, tfQuery, tfSync, intTex, intData, intFbo, intRb, intPbo, intSync, vao, posBuffer, positions, colorBuffer, colors, instanceQuery, instanceSync, rb1, rb2, blitFbo1, blitFbo2, blitPbo, blitQuery, floatTex, floatData, sampler1, sampler2, sampler3, sampler4, finalSync, finalQuery, pixels, floatPixels, intPixels;

    const texSize = 256;
    const vertexCount = 6;
    const instanceCount = 512;
    const bufferSize = 16384;
    const rbSamples = 4;
    const mipLevels = 4;

    const tfVertexShaderSource = `#version 300 es
    in vec4 a_position;
    out vec4 v_tfOutput;
    void main() {
        v_tfOutput = a_position * 1.5;
        gl_Position = a_position;
    }`;

    const tfFragmentShaderSource = `#version 300 es
    precision highp float;
    out vec4 outColor;
    void main() {
        outColor = vec4(0.2, 0.4, 0.6, 1.0);
    }`;

    const mainVertexShaderSource = `#version 300 es
    in vec4 a_position;
    in vec4 a_color;
    in vec4 a_tfData;
    out vec4 v_color;
    void main() {
        v_color = a_color + a_tfData * 0.2;
        gl_Position = a_position + vec4(float(gl_InstanceID) * 0.0001);
    }`;

    const mainFragmentShaderSource = `#version 300 es
    precision highp float;
    precision highp int;
    precision highp isampler2D;
    in vec4 v_color;
    layout(location = 0) out vec4 outColor0;
    layout(location = 1) out ivec4 outColor1;
    uniform isampler2D u_intTex;
    uniform sampler2D u_floatTex;
    void main() {
        outColor0 = v_color * texture(u_floatTex, vec2(0.5));
        outColor1 = texture(u_intTex, vec2(0.5));
    }`;

    try {
        tfVertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(tfVertexShader, tfVertexShaderSource);
        gl.compileShader(tfVertexShader);
        tfFragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(tfFragmentShader, tfFragmentShaderSource);
        gl.compileShader(tfFragmentShader);
        tfProgram = gl.createProgram();
        gl.attachShader(tfProgram, tfVertexShader);
        gl.attachShader(tfProgram, tfFragmentShader);
        gl.transformFeedbackVaryings(tfProgram, ['v_tfOutput'], gl.SEPARATE_ATTRIBS);
        gl.linkProgram(tfProgram);
    } catch(e) {}

    try {
        mainVertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(mainVertexShader, mainVertexShaderSource);
        gl.compileShader(mainVertexShader);
        mainFragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(mainFragmentShader, mainFragmentShaderSource);
        gl.compileShader(mainFragmentShader);
        mainProgram = gl.createProgram();
        gl.attachShader(mainProgram, mainVertexShader);
        gl.attachShader(mainProgram, mainFragmentShader);
        gl.bindAttribLocation(mainProgram, 0, 'a_position');
        gl.bindAttribLocation(mainProgram, 1, 'a_color');
        gl.bindAttribLocation(mainProgram, 2, 'a_tfData');
        gl.linkProgram(mainProgram);
    } catch(e) {}

    try {
        tfBuffer = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, bufferSize, gl.DYNAMIC_COPY);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer);
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, null);
    } catch(e) {}

    try {
        tfQuery = gl.createQuery();
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, tfQuery);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
        gl.getQueryParameter(tfQuery, gl.QUERY_RESULT_AVAILABLE);
    } catch(e) {}

    try {
        tfSync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(tfSync, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
        gl.deleteSync(tfSync);
    } catch(e) {}

    try {
        intTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, intTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32I, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        intData = new Int32Array(texSize * texSize * 4);
        for (let i = 0; i < intData.length; i++) {
            intData[i] = i % 256;
        }
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, texSize, texSize, gl.RGBA_INTEGER, gl.INT, intData);
        gl.bindTexture(gl.TEXTURE_2D, null);
    } catch(e) {}

    try {
        intFbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, intFbo);
        intRb = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, intRb);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32I, 128, 128);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, intRb);
        gl.clearBufferiv(gl.COLOR, 0, [0, 0, 0, 0]);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        intPbo = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, intPbo);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 128 * 128 * 16, gl.STREAM_READ);
        gl.bindFramebuffer(gl.FRAMEBUFFER, intFbo);
        gl.readPixels(0, 0, 128, 128, gl.RGBA_INTEGER, gl.INT, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        intSync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(intSync, 0, 0);
        gl.deleteSync(intSync);
    } catch(e) {}

    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        positions = new Float32Array([
            -0.8, -0.8, 0.0, 1.0,
             0.8, -0.8, 0.0, 1.0,
            -0.8,  0.8, 0.0, 1.0,
            -0.8,  0.8, 0.0, 1.0,
             0.8, -0.8, 0.0, 1.0,
             0.8,  0.8, 0.0, 1.0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
        colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        colors = new Float32Array(instanceCount * 4);
        for (let i = 0; i < colors.length; i += 4) {
            colors[i] = 0.8;
            colors[i + 1] = 0.6;
            colors[i + 2] = 0.4;
            colors[i + 3] = 1.0;
        }
        gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(1, 1);
        gl.bindVertexArray(null);
    } catch(e) {}

    try {
        instanceQuery = gl.createQuery();
        gl.useProgram(mainProgram);
        gl.uniform1i(gl.getUniformLocation(mainProgram, 'u_intTex'), 0);
        gl.uniform1i(gl.getUniformLocation(mainProgram, 'u_floatTex'), 1);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, intTex);
        gl.bindVertexArray(vao);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, instanceQuery);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        gl.getQueryParameter(instanceQuery, gl.QUERY_RESULT_AVAILABLE);
    } catch(e) {}

    try {
        instanceSync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(instanceSync, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
        gl.deleteSync(instanceSync);
    } catch(e) {}

    try {
        rb1 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rb1);
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, Math.min(rbSamples, gl.getParameter(gl.MAX_SAMPLES)), gl.RGBA32F, texSize, texSize);
        rb2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(gl.RENDERBUFFER, rb2);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32F, texSize, texSize);
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        blitFbo1 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, blitFbo1);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rb1);
        gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]);
        blitFbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, blitFbo2);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rb2);
        gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, blitFbo1);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, blitFbo2);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.LINEAR);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        blitPbo = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, blitPbo);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, texSize * texSize * 16, gl.STREAM_READ);
        gl.bindFramebuffer(gl.FRAMEBUFFER, blitFbo2);
        gl.readPixels(0, 0, texSize, texSize, gl.RGBA, gl.FLOAT, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        blitQuery = gl.createQuery();
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, blitQuery);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
        for (let i = 0; i < 64; i++) {
            gl.getQueryParameter(blitQuery, gl.QUERY_RESULT_AVAILABLE);
        }
    } catch(e) {}

    try {
        floatTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, floatTex);
        gl.texStorage2D(gl.TEXTURE_2D, mipLevels, gl.RGBA32F, 256, 256);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        floatData = new Float32Array(256 * 256 * 4);
        for (let i = 0; i < floatData.length; i++) {
            floatData[i] = Math.random();
        }
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 256, 256, gl.RGBA, gl.FLOAT, floatData);
        for (let level = 1; level < mipLevels; level++) {
            const levelSize = 256 >> level;
            gl.texSubImage2D(gl.TEXTURE_2D, level, 0, 0, levelSize, levelSize, gl.RGBA, gl.FLOAT, new Float32Array(levelSize * levelSize * 4));
        }
        gl.bindTexture(gl.TEXTURE_2D, null);
    } catch(e) {}

    try {
        sampler1 = gl.createSampler();
        gl.samplerParameteri(sampler1, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.samplerParameteri(sampler1, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        sampler2 = gl.createSampler();
        gl.samplerParameteri(sampler2, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.samplerParameteri(sampler2, gl.TEXTURE_MIN_LOD, 0);
        gl.samplerParameteri(sampler2, gl.TEXTURE_MAX_LOD, mipLevels);
        sampler3 = gl.createSampler();
        gl.samplerParameteri(sampler3, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.samplerParameteri(sampler3, gl.TEXTURE_WRAP_T, gl.REPEAT);
        sampler4 = gl.createSampler();
        gl.samplerParameteri(sampler4, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.samplerParameteri(sampler4, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    try {
        copyTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, copyTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(256 * 256 * 4));
        gl.copyTexSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 0, 0, 128, 128);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
    } catch(e) {}

    try {
        finalSync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.clientWaitSync(finalSync, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
        gl.getSyncParameter(finalSync, gl.SYNC_STATUS);
        gl.getSyncParameter(finalSync, gl.SYNC_CONDITION);
        gl.deleteSync(finalSync);
    } catch(e) {}

    try {
        finalQuery = gl.createQuery();
        gl.bindTexture(gl.TEXTURE_2D, intTex);
        gl.bindVertexArray(vao);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, finalQuery);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
        for (let i = 0; i < 128; i++) {
            gl.getQueryParameter(finalQuery, gl.QUERY_RESULT_AVAILABLE);
        }
    } catch(e) {}

    try {
        pixels = new Uint8Array(256 * 256 * 4);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        floatPixels = new Float32Array(128 * 128 * 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, blitFbo2);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.FLOAT, floatPixels);
        intPixels = new Int32Array(64 * 64 * 4);
        gl.bindFramebuffer(gl.FRAMEBUFFER, intFbo);
        gl.readPixels(0, 0, 64, 64, gl.RGBA_INTEGER, gl.INT, intPixels);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.flush();
        gl.finish();
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.clearColor(0.15, 0.25, 0.35, 1.0);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>

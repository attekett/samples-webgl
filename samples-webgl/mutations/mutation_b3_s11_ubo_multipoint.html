<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const uboCount = 3;
    const bindingPoints = 3;
    const uboSize = 256;
    const vertexCount = 6;
    const bufferSize = vertexCount * 8;
    const dataOffset = 64;
    const updateCount = 4;

    const uboTarget = gl.UNIFORM_BUFFER;
    const bufferUsage = gl.DYNAMIC_DRAW;
    const bufferTarget = gl.ARRAY_BUFFER;
    const primitiveMode = gl.TRIANGLES;

    try {
        const ubo1 = gl.createBuffer();
        const ubo2 = gl.createBuffer();
        const ubo3 = gl.createBuffer();
        gl.bindBuffer(uboTarget, ubo1);
        gl.bindBuffer(uboTarget, ubo2);
        gl.bindBuffer(uboTarget, ubo1);
        gl.bufferData(uboTarget, uboSize, bufferUsage);
        gl.bindBuffer(uboTarget, ubo2);
        gl.bufferData(uboTarget, 512, gl.STATIC_DRAW);
        gl.bindBuffer(uboTarget, ubo3);
        gl.bufferData(uboTarget, uboSize, bufferUsage);
    } catch(e) {}

    try {
        const uboData1 = new Float32Array(64);
        const uboData2 = new Float32Array(128);
        for (let i = 0; i < 64; i++) {
            uboData1[i] = Math.sin(i * 0.1);
        }
        for (let i = 0; i < 128; i++) {
            uboData2[i] = Math.cos(i * 0.05);
        }
        gl.bindBuffer(uboTarget, ubo1);
        gl.bufferSubData(uboTarget, 0, uboData1);
        gl.bindBuffer(uboTarget, ubo2);
        gl.bufferSubData(uboTarget, dataOffset, uboData2);
        gl.bindBuffer(uboTarget, ubo1);
        gl.bufferSubData(uboTarget, 16, uboData1.subarray(0, 32));
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            layout(std140) uniform Block1 {
                vec4 color1;
                vec4 offset1;
                mat4 transform1;
            };
            layout(std140) uniform Block2 {
                vec4 color2;
                vec4 offset2;
                vec2 scale2;
            };
            layout(std140) uniform Block3 {
                vec4 params[4];
            };
            in vec2 position;
            out vec4 vColor;
            void main() {
                vec2 pos = position * scale2 + offset1.xy + offset2.xy;
                gl_Position = vec4(pos, 0.0, 1.0);
                vColor = color1 + color2 + params[0];
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec4 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vColor;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const blockIdx1 = gl.getUniformBlockIndex(program, 'Block1');
        const blockIdx2 = gl.getUniformBlockIndex(program, 'Block2');
        const blockIdx3 = gl.getUniformBlockIndex(program, 'Block3');
        gl.uniformBlockBinding(program, blockIdx1, 0);
        gl.uniformBlockBinding(program, blockIdx2, 1);
        gl.uniformBlockBinding(program, blockIdx3, 2);
        gl.uniformBlockBinding(program, blockIdx1, 1);
        gl.uniformBlockBinding(program, blockIdx2, 0);
        gl.uniformBlockBinding(program, blockIdx3, 2);
        gl.uniformBlockBinding(program, blockIdx1, 0);
        gl.uniformBlockBinding(program, blockIdx2, 1);
    } catch(e) {}

    try {
        gl.bindBufferBase(uboTarget, 0, ubo1);
        gl.bindBufferBase(uboTarget, 1, ubo2);
        gl.bindBufferBase(uboTarget, 2, ubo3);
        gl.bindBufferBase(uboTarget, 0, ubo2);
        gl.bindBufferBase(uboTarget, 1, ubo1);
        gl.bindBufferBase(uboTarget, 2, ubo3);
        gl.bindBufferBase(uboTarget, 0, ubo1);
        gl.bindBufferBase(uboTarget, 1, ubo2);
        gl.bindBufferBase(uboTarget, 2, ubo3);
    } catch(e) {}

    try {
        const positions = new Float32Array([
            -0.8, -0.8,
             0.8, -0.8,
             0.0,  0.8,
            -0.5, -0.5,
             0.5, -0.5,
             0.0,  0.5
        ]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(bufferTarget, vbo);
        gl.bufferData(bufferTarget, positions, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.bindBufferBase(uboTarget, 0, ubo1);
        gl.bufferSubData(uboTarget, 0, new Float32Array([1.0, 0.0, 0.0, 1.0]));
        gl.bindBufferBase(uboTarget, 1, ubo2);
        gl.bufferSubData(uboTarget, 0, new Float32Array([0.0, 1.0, 0.0, 1.0]));
        gl.bindBufferBase(uboTarget, 2, ubo3);
        gl.bufferSubData(uboTarget, 0, new Float32Array([0.0, 0.0, 1.0, 1.0]));
        gl.bindBufferBase(uboTarget, 0, ubo1);
    } catch(e) {}

    try {
        gl.drawArrays(primitiveMode, 0, vertexCount);
        gl.bindBufferBase(uboTarget, 0, ubo2);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindBufferBase(uboTarget, 0, ubo1);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
    } catch(e) {}

    try {
        for (let i = 0; i < updateCount; i++) {
            gl.bindBuffer(uboTarget, ubo1);
            gl.bindBuffer(uboTarget, ubo2);
            gl.bindBuffer(uboTarget, ubo3);
            gl.bindBufferBase(uboTarget, 0, ubo1);
            gl.bindBufferBase(uboTarget, 1, ubo2);
            gl.bindBufferBase(uboTarget, 2, ubo3);
        }
    } catch(e) {}

    try {
        gl.bindBuffer(uboTarget, ubo1);
        gl.deleteBuffer(ubo1);
        gl.bindBuffer(uboTarget, ubo1);
        gl.bindBufferBase(uboTarget, 0, ubo1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

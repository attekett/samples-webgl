<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const offsetCount = 4;
    const rangeSize = 128;
    const uboSize = 1024;
    const alignment = 256;
    const vertexCount = 6;
    const dataSize = rangeSize * 4;

    const uboTarget = gl.UNIFORM_BUFFER;
    const bufferUsage = gl.DYNAMIC_DRAW;
    const bufferTarget = gl.ARRAY_BUFFER;
    const primitiveMode = gl.TRIANGLES;

    try {
        const ubo = gl.createBuffer();
        gl.bindBuffer(uboTarget, ubo);
        gl.bindBuffer(uboTarget, null);
        gl.bindBuffer(uboTarget, ubo);
        gl.bufferData(uboTarget, uboSize, bufferUsage);
        gl.bufferData(uboTarget, 2048, gl.STATIC_DRAW);
        gl.bufferData(uboTarget, uboSize, bufferUsage);
    } catch(e) {}

    try {
        const data = new Float32Array(256);
        for (let i = 0; i < 256; i++) {
            data[i] = Math.sin(i * 0.05) * Math.cos(i * 0.1);
        }
        gl.bindBuffer(uboTarget, ubo);
        gl.bufferSubData(uboTarget, 0, data);
        gl.bufferSubData(uboTarget, alignment, data);
        gl.bufferSubData(uboTarget, alignment * 2, data);
        gl.bufferSubData(uboTarget, 512, data.subarray(0, 128));
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            layout(std140) uniform DataBlock {
                vec4 colors[8];
                vec4 offsets[4];
                mat4 matrices[2];
            };
            in vec2 position;
            out vec4 vColor;
            void main() {
                vec2 pos = position + offsets[0].xy + offsets[1].xy;
                gl_Position = vec4(pos, 0.0, 1.0);
                vColor = colors[0] + colors[1];
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec4 vColor;
            out vec4 fragColor;
            void main() {
                fragColor = vColor;
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const blockIdx = gl.getUniformBlockIndex(program, 'DataBlock');
        gl.uniformBlockBinding(program, blockIdx, 0);
        gl.uniformBlockBinding(program, blockIdx, 1);
        gl.uniformBlockBinding(program, blockIdx, 0);
    } catch(e) {}

    try {
        gl.bindBufferRange(uboTarget, 0, ubo, 0, rangeSize);
        gl.bindBufferRange(uboTarget, 0, ubo, alignment, rangeSize);
        gl.bindBufferRange(uboTarget, 0, ubo, 0, rangeSize);
        gl.bindBufferRange(uboTarget, 0, ubo, 128, 256);
        gl.bindBufferRange(uboTarget, 0, ubo, alignment * 2, rangeSize);
        gl.bindBufferRange(uboTarget, 0, ubo, 0, dataSize);
    } catch(e) {}

    try {
        const positions = new Float32Array([
            -0.9, -0.9,
             0.9, -0.9,
             0.0,  0.9,
            -0.6, -0.6,
             0.6, -0.6,
             0.0,  0.6
        ]);
        const vbo = gl.createBuffer();
        gl.bindBuffer(bufferTarget, vbo);
        gl.bufferData(bufferTarget, positions, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        for (let i = 0; i < offsetCount; i++) {
            const offset = i * alignment;
            gl.bindBufferRange(uboTarget, 0, ubo, offset, rangeSize);
            gl.bindBufferRange(uboTarget, 0, ubo, 64, 192);
            gl.bindBufferRange(uboTarget, 0, ubo, offset, rangeSize);
            gl.bufferSubData(uboTarget, offset, new Float32Array([1.0, 0.5, 0.0, 1.0]));
        }
    } catch(e) {}

    try {
        gl.bindBufferRange(uboTarget, 0, ubo, 0, rangeSize);
        gl.drawArrays(primitiveMode, 0, 3);
        gl.bindBufferRange(uboTarget, 0, ubo, alignment, rangeSize);
        gl.drawArrays(gl.TRIANGLES, 3, 3);
        gl.bindBufferRange(uboTarget, 0, ubo, 512, rangeSize);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindBufferRange(uboTarget, 0, ubo, 0, rangeSize);
        gl.bindBufferRange(uboTarget, 0, ubo, alignment, 256);
        gl.bindBufferRange(uboTarget, 0, ubo, alignment * 2, rangeSize);
        gl.bindBufferRange(uboTarget, 0, ubo, 768, 128);
        gl.bindBufferRange(uboTarget, 0, ubo, 0, rangeSize);
    } catch(e) {}

    try {
        gl.bindBuffer(uboTarget, ubo);
        gl.deleteBuffer(ubo);
        gl.bindBuffer(uboTarget, ubo);
        gl.bindBufferRange(uboTarget, 0, ubo, 0, rangeSize);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

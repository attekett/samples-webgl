<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vertexCount = 100;
    const tfBufferSize = vertexCount * 32;
    const varyingCount = 3;
    const primitiveCount = vertexCount / 3;
    const inputSize = vertexCount * 8;

    const tfTarget = gl.TRANSFORM_FEEDBACK_BUFFER;
    const tfMode = gl.INTERLEAVED_ATTRIBS;
    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.DYNAMIC_COPY;
    const primitiveMode = gl.TRIANGLES;

    try {
        const inputData = new Float32Array(vertexCount * 2);
        for (let i = 0; i < vertexCount * 2; i++) {
            inputData[i] = (Math.random() - 0.5) * 2.0;
        }
        const inputBuffer = gl.createBuffer();
        gl.bindBuffer(bufferTarget, inputBuffer);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(bufferTarget, inputBuffer);
        gl.bufferData(bufferTarget, inputData, gl.STATIC_DRAW);
        gl.bufferData(bufferTarget, inputSize, gl.DYNAMIC_DRAW);
        gl.bufferData(bufferTarget, inputData, gl.STATIC_DRAW);
    } catch(e) {}

    try {
        const tfBuffer = gl.createBuffer();
        gl.bindBuffer(tfTarget, tfBuffer);
        gl.bindBuffer(tfTarget, null);
        gl.bindBuffer(tfTarget, tfBuffer);
        gl.bufferData(tfTarget, tfBufferSize, bufferUsage);
        gl.bufferData(tfTarget, 4096, gl.STREAM_COPY);
        gl.bufferData(tfTarget, tfBufferSize, bufferUsage);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec2 position;
            out vec2 v_position;
            out vec3 v_color;
            out vec4 v_params;
            void main() {
                v_position = position * 0.9;
                v_color = vec3(position.x * 0.5 + 0.5, position.y * 0.5 + 0.5, 1.0);
                v_params = vec4(position, position.x * position.y, 1.0);
                gl_Position = vec4(v_position, 0.0, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            in vec2 v_position;
            in vec3 v_color;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(v_color, 1.0);
            }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['v_position', 'v_color', 'v_params'], tfMode);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.bindBuffer(bufferTarget, inputBuffer);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        const tf = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
    } catch(e) {}

    try {
        gl.bindBufferBase(tfTarget, 0, tfBuffer);
        gl.bindBufferBase(tfTarget, 0, null);
        gl.bindBufferBase(tfTarget, 0, tfBuffer);
        gl.bindBufferBase(tfTarget, 1, tfBuffer);
        gl.bindBufferBase(tfTarget, 0, tfBuffer);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginTransformFeedback(primitiveMode);
        gl.drawArrays(primitiveMode, 0, vertexCount);
        gl.endTransformFeedback();
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginTransformFeedback(primitiveMode);
        gl.drawArrays(gl.POINTS, 0, 50);
        gl.pauseTransformFeedback();
        gl.resumeTransformFeedback();
        gl.drawArrays(gl.POINTS, 50, 50);
        gl.endTransformFeedback();
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        const readData = new Float32Array(256);
        gl.bindBuffer(tfTarget, tfBuffer);
        gl.getBufferSubData(tfTarget, 0, readData);
        gl.bindBuffer(tfTarget, null);
        gl.bindBuffer(tfTarget, tfBuffer);
    } catch(e) {}

    try {
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.drawArrays(primitiveMode, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLES, 0, 30);
        gl.drawArrays(gl.TRIANGLES, 30, 30);
    } catch(e) {}

    try {
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.deleteTransformFeedback(tf);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBuffer(tfTarget, tfBuffer);
        gl.deleteBuffer(tfBuffer);
        gl.bindBuffer(tfTarget, tfBuffer);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float',
    'EXT_texture_filter_anisotropic'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    const extFloat = gl.getExtension('EXT_color_buffer_float');
    const extAniso = gl.getExtension('EXT_texture_filter_anisotropic');

    const texSize = 512;
    const texPixels = texSize * texSize;
    const bufferSize = texPixels * 16;
    const vertexCount = 24;
    const instanceCount = 2048;
    const mipLevels = 9;
    const mrtCount = 8;
    const arrayLayers = 128;
    const tex3dDepth = 64;
    const samplerCount = 16;
    const syncCount = 32;
    const queryCount = 16;
    const tfBufferCount = 8;
    const uboCount = 16;
    const renderbufferCount = 32;

    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const textureTarget = gl.TEXTURE_2D;
    const arrayTarget = gl.TEXTURE_2D_ARRAY;
    const tex3dTarget = gl.TEXTURE_3D;
    const textureFormat = gl.RGBA32F;
    const integerFormat = gl.RGBA32I;

    const vsSource = `#version 300 es
    in vec4 position;
    in vec3 normal;
    in vec2 texcoord;
    in vec4 color;
    in vec4 tangent;
    flat out int instanceID;
    flat out int layerID;
    out vec2 vTexcoord;
    out vec3 vNormal;
    out vec4 vColor;
    out vec3 vTangent;
    out vec3 vBitangent;
    out vec3 vWorldPos;
    uniform Matrices {
        mat4 projection;
        mat4 view;
        mat4 model;
        mat4 normalMatrix;
        mat4 lightSpace;
        mat4 texMatrix0;
        mat4 texMatrix1;
        mat4 texMatrix2;
    };
    void main() {
        instanceID = gl_InstanceID;
        layerID = gl_InstanceID % 128;
        vTexcoord = texcoord;
        vNormal = mat3(normalMatrix) * normal;
        vColor = color;
        vTangent = mat3(normalMatrix) * tangent.xyz;
        vBitangent = cross(vNormal, vTangent) * tangent.w;
        vec4 worldPos = model * position;
        vWorldPos = worldPos.xyz;
        gl_Position = projection * view * worldPos;
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    precision highp int;
    precision highp sampler2D;
    precision highp sampler2DArray;
    precision highp sampler3D;
    precision highp isampler2D;
    flat in int instanceID;
    flat in int layerID;
    in vec2 vTexcoord;
    in vec3 vNormal;
    in vec4 vColor;
    in vec3 vTangent;
    in vec3 vBitangent;
    in vec3 vWorldPos;
    uniform sampler2D tex0;
    uniform sampler2D tex1;
    uniform sampler2D tex2;
    uniform sampler2D tex3;
    uniform sampler2DArray texArray;
    uniform sampler3D tex3d;
    uniform isampler2D intTex;
    uniform Lighting {
        vec4 lightPos0;
        vec4 lightColor0;
        vec4 lightPos1;
        vec4 lightColor1;
        vec4 ambient;
        float intensity;
        float shininess;
        float time;
    };
    layout(location = 0) out vec4 fragColor0;
    layout(location = 1) out vec4 fragColor1;
    layout(location = 2) out vec4 fragColor2;
    layout(location = 3) out vec4 fragColor3;
    layout(location = 4) out vec4 fragColor4;
    layout(location = 5) out vec4 fragColor5;
    layout(location = 6) out vec4 fragColor6;
    layout(location = 7) out vec4 fragColor7;
    void main() {
        vec4 t0 = texture(tex0, vTexcoord);
        vec4 t1 = texture(tex1, vTexcoord * 2.0);
        vec4 t2 = texture(tex2, vTexcoord * 0.5);
        vec4 t3 = texture(tex3, vTexcoord + vec2(time * 0.01));
        vec4 tArray = texture(texArray, vec3(vTexcoord, float(layerID)));
        vec4 t3d = texture(tex3d, vec3(vTexcoord, time * 0.01));
        ivec4 tInt = texture(intTex, vTexcoord);
        mat3 tbn = mat3(vTangent, vBitangent, vNormal);
        vec3 normal = normalize(tbn * (t0.xyz * 2.0 - 1.0));
        vec3 lightDir0 = normalize(lightPos0.xyz - vWorldPos);
        vec3 lightDir1 = normalize(lightPos1.xyz - vWorldPos);
        float diff0 = max(dot(normal, lightDir0), 0.0);
        float diff1 = max(dot(normal, lightDir1), 0.0);
        vec4 diffuse = (lightColor0 * diff0 + lightColor1 * diff1) * intensity;
        vec4 base = (t0 + t1 * 0.5 + t2 * 0.25 + t3 * 0.125 + tArray * 0.2 + t3d * 0.15) * vColor;
        base += vec4(tInt) * 0.001;
        base = base * (ambient + diffuse);
        base.a = 1.0;
        fragColor0 = base;
        fragColor1 = base * vec4(1.0, 0.95, 0.9, 1.0);
        fragColor2 = base * vec4(0.9, 1.0, 0.95, 1.0);
        fragColor3 = base * vec4(0.95, 0.9, 1.0, 1.0);
        fragColor4 = base * 0.8;
        fragColor5 = base * 0.7;
        fragColor6 = base * 0.6;
        fragColor7 = base * 0.5;
    }`;

    try {
        const vShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vShader, vsSource);
        gl.compileShader(vShader);
        const fShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShader, fsSource);
        gl.compileShader(fShader);
        const program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        const buffer4 = gl.createBuffer();
        const buffer5 = gl.createBuffer();
        const buffer6 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 16384, gl.DYNAMIC_DRAW);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bufferData(bufferTarget, 32768, gl.STREAM_DRAW);
        gl.bindBuffer(bufferTarget, buffer4);
        gl.bufferData(bufferTarget, 65536, gl.STATIC_COPY);
        gl.bindBuffer(bufferTarget, buffer5);
        gl.bufferData(bufferTarget, 131072, gl.DYNAMIC_COPY);
        gl.bindBuffer(bufferTarget, buffer6);
        gl.bufferData(bufferTarget, 262144, gl.STREAM_COPY);
    } catch(e) {}

    try {
        const posData = new Float32Array(vertexCount * 3);
        for (let i = 0; i < vertexCount; i++) {
            const angle = (i / vertexCount) * Math.PI * 2;
            posData[i * 3] = Math.cos(angle);
            posData[i * 3 + 1] = Math.sin(angle);
            posData[i * 3 + 2] = 0.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, posData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        const normalData = new Float32Array(vertexCount * 3);
        for (let i = 0; i < normalData.length; i += 3) {
            normalData[i] = Math.sin(i * 0.1);
            normalData[i+1] = Math.cos(i * 0.1);
            normalData[i+2] = 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, normalData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        const texData = new Float32Array(vertexCount * 2);
        for (let i = 0; i < vertexCount; i++) {
            texData[i * 2] = i / vertexCount;
            texData[i * 2 + 1] = (i % 2);
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, texData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 8, 0);
    } catch(e) {}

    try {
        const colorData = new Float32Array(vertexCount * 4);
        for (let i = 0; i < colorData.length; i += 4) {
            colorData[i] = Math.random();
            colorData[i+1] = Math.random();
            colorData[i+2] = Math.random();
            colorData[i+3] = 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, colorData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(3);
        gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 16, 0);
    } catch(e) {}

    try {
        const tangentData = new Float32Array(vertexCount * 4);
        for (let i = 0; i < tangentData.length; i += 4) {
            tangentData[i] = 1.0;
            tangentData[i+1] = 0.0;
            tangentData[i+2] = 0.0;
            tangentData[i+3] = 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, tangentData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(4);
        gl.vertexAttribPointer(4, 4, gl.FLOAT, false, 16, 0);
    } catch(e) {}

    const ubos = [];
    try {
        for (let i = 0; i < uboCount; i++) {
            const ubo = gl.createBuffer();
            ubos.push(ubo);
            gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
            gl.bufferData(gl.UNIFORM_BUFFER, 512, gl.DYNAMIC_DRAW);
            gl.bindBufferBase(gl.UNIFORM_BUFFER, i, ubo);
        }
    } catch(e) {}

    const textures = [];
    try {
        for (let i = 0; i < 12; i++) {
            const tex = gl.createTexture();
            textures.push(tex);
            gl.bindTexture(textureTarget, tex);
            gl.bindTexture(textureTarget, null);
            gl.bindTexture(textureTarget, tex);
            gl.texStorage2D(textureTarget, mipLevels, textureFormat, texSize, texSize);
            gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.REPEAT);
        }
    } catch(e) {}

    let intTex;
    try {
        intTex = gl.createTexture();
        gl.bindTexture(textureTarget, intTex);
        gl.texStorage2D(textureTarget, 1, integerFormat, 256, 256);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    let texArray;
    try {
        texArray = gl.createTexture();
        gl.bindTexture(arrayTarget, texArray);
        gl.bindTexture(arrayTarget, null);
        gl.bindTexture(arrayTarget, texArray);
        gl.texStorage3D(arrayTarget, 7, gl.RGBA32F, 512, 512, arrayLayers);
        gl.texParameteri(arrayTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(arrayTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(arrayTarget, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(arrayTarget, gl.TEXTURE_WRAP_T, gl.REPEAT);
    } catch(e) {}

    let tex3d;
    try {
        tex3d = gl.createTexture();
        gl.bindTexture(tex3dTarget, tex3d);
        gl.bindTexture(tex3dTarget, null);
        gl.bindTexture(tex3dTarget, tex3d);
        gl.texStorage3D(tex3dTarget, 6, gl.RGBA16F, 128, 128, tex3dDepth);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    const renderbuffers = [];
    try {
        for (let i = 0; i < renderbufferCount; i++) {
            const rb = gl.createRenderbuffer();
            renderbuffers.push(rb);
            gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
            gl.bindRenderbuffer(gl.RENDERBUFFER, null);
            gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
            if (i % 8 === 0) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32F, 512, 512);
            } else if (i % 8 === 1) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RGBA16F, 256, 256);
            } else if (i % 8 === 2) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 8, gl.RGBA8, 128, 128);
            } else if (i % 8 === 3) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.R11F_G11F_B10F, 256, 256);
            } else if (i % 8 === 4) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, 512, 512);
            } else if (i % 8 === 5) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.DEPTH_COMPONENT32F, 256, 256);
            } else if (i % 8 === 6) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH24_STENCIL8, 512, 512);
            } else {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 8, gl.DEPTH32F_STENCIL8, 256, 256);
            }
        }
    } catch(e) {}

    const samplers = [];
    try {
        const maxAniso = gl.getParameter(extAniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
        for (let i = 0; i < samplerCount; i++) {
            const sampler = gl.createSampler();
            samplers.push(sampler);
            gl.samplerParameteri(sampler, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.samplerParameteri(sampler, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.samplerParameteri(sampler, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.samplerParameteri(sampler, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.samplerParameterf(sampler, extAniso.TEXTURE_MAX_ANISOTROPY_EXT, maxAniso * (i + 1) / samplerCount);
            gl.samplerParameterf(sampler, gl.TEXTURE_MIN_LOD, -1000.0);
            gl.samplerParameterf(sampler, gl.TEXTURE_MAX_LOD, 1000.0);
            if (i % 8 === 0) {
                gl.samplerParameteri(sampler, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
                gl.samplerParameteri(sampler, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
            }
        }
    } catch(e) {}

    const fbos = [];
    try {
        for (let i = 0; i < 12; i++) {
            const fbo = gl.createFramebuffer();
            fbos.push(fbo);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            for (let j = 0; j < mrtCount; j++) {
                if (i % 3 === 0) {
                    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + j, gl.TEXTURE_2D, textures[j % textures.length], 0);
                } else {
                    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + j, gl.RENDERBUFFER, renderbuffers[j % renderbufferCount]);
                }
            }
            if (i % 2 === 0) {
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, renderbuffers[4]);
            } else {
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, renderbuffers[6]);
            }
            const drawBuffers = [gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3, gl.COLOR_ATTACHMENT4, gl.COLOR_ATTACHMENT5, gl.COLOR_ATTACHMENT6, gl.COLOR_ATTACHMENT7];
            gl.drawBuffers(drawBuffers);
        }
    } catch(e) {}

    const queries = [];
    try {
        for (let i = 0; i < queryCount; i++) {
            const query = gl.createQuery();
            queries.push(query);
        }
    } catch(e) {}

    const tfBuffers = [];
    try {
        for (let i = 0; i < tfBufferCount; i++) {
            const buf = gl.createBuffer();
            tfBuffers.push(buf);
            gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, buf);
            gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 65536, gl.DYNAMIC_COPY);
        }
    } catch(e) {}

    const syncs = [];
    try {
        for (let i = 0; i < syncCount; i++) {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            syncs.push(sync);
            gl.flush();
        }
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.depthMask(true);
        gl.clearDepth(1.0);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.stencilMask(0xFF);
        gl.clearStencil(0);
    } catch(e) {}

    try {
        gl.enable(gl.BLEND);
        gl.blendEquationSeparate(gl.FUNC_ADD, gl.FUNC_ADD);
        gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ZERO);
        for (let i = 0; i < mrtCount; i++) {
            gl.blendEquationi(i, gl.FUNC_ADD);
            if (i % 2 === 0) {
                gl.blendFunci(i, gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            } else {
                gl.blendFunci(i, gl.ONE, gl.ONE);
            }
        }
        gl.blendColor(0.5, 0.5, 0.5, 0.5);
    } catch(e) {}

    try {
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        gl.frontFace(gl.CCW);
        gl.enable(gl.POLYGON_OFFSET_FILL);
        gl.polygonOffset(1.0, 1.0);
        gl.enable(gl.SAMPLE_COVERAGE);
        gl.sampleCoverage(0.75, false);
        gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.enable(gl.DITHER);
        gl.disable(gl.DITHER);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, 0, 256, 256);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0]);
        gl.viewport(0, 0, texSize, texSize);
        for (let i = 0; i < mrtCount; i++) {
            const color = [Math.random(), Math.random(), Math.random(), 1.0];
            gl.clearBufferfv(gl.COLOR, i, color);
        }
        gl.clearBufferfv(gl.DEPTH, 0, [1.0]);
        gl.clearBufferiv(gl.STENCIL, 0, [0]);
    } catch(e) {}

    try {
        for (let i = 0; i < samplerCount; i++) {
            gl.bindSampler(i, samplers[i]);
        }
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, textures[0]);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, textures[1]);
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, textures[2]);
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, textures[3]);
        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray);
        gl.activeTexture(gl.TEXTURE5);
        gl.bindTexture(gl.TEXTURE_3D, tex3d);
        gl.activeTexture(gl.TEXTURE6);
        gl.bindTexture(gl.TEXTURE_2D, intTex);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0]);
        gl.viewport(0, 0, 512, 512);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[0]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[1]);
        gl.viewport(0, 0, 256, 256);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, queries[1]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 12, 1024);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[2]);
        gl.viewport(0, 0, 256, 256);
        gl.stencilFunc(gl.EQUAL, 1, 0xFF);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[2]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 512);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[0]);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbos[3]);
        gl.blitFramebuffer(0, 0, 512, 512, 0, 0, 256, 256, gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT, gl.LINEAR);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[3]);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbos[4]);
        gl.blitFramebuffer(0, 0, 256, 256, 0, 0, 128, 128, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[4]);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbos[5]);
        gl.blitFramebuffer(0, 0, 128, 128, 0, 0, 512, 512, gl.COLOR_BUFFER_BIT, gl.LINEAR);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[0]);
        for (let i = 0; i < mrtCount; i++) {
            gl.readBuffer(gl.COLOR_ATTACHMENT0 + i);
            const pixels = new Float32Array(256 * 256 * 4);
            gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.FLOAT, pixels);
        }
    } catch(e) {}

    try {
        const pbo1 = gl.createBuffer();
        const pbo2 = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 512 * 512 * 16, gl.STREAM_READ);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[0]);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.readPixels(0, 0, 512, 512, gl.RGBA, gl.FLOAT, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo2);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 256 * 256 * 16, gl.STREAM_READ);
        gl.readBuffer(gl.COLOR_ATTACHMENT1);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.FLOAT, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        for (let i = 0; i < syncs.length; i++) {
            const status = gl.clientWaitSync(syncs[i], gl.SYNC_FLUSH_COMMANDS_BIT, 5000);
            const signaled = gl.getSyncParameter(syncs[i], gl.SYNC_STATUS);
            const condition = gl.getSyncParameter(syncs[i], gl.SYNC_CONDITION);
            const flags = gl.getSyncParameter(syncs[i], gl.SYNC_FLAGS);
        }
    } catch(e) {}

    try {
        for (let i = 0; i < queries.length; i++) {
            for (let j = 0; j < 256; j++) {
                const available = gl.getQueryParameter(queries[i], gl.QUERY_RESULT_AVAILABLE);
                if (available) {
                    const result = gl.getQueryParameter(queries[i], gl.QUERY_RESULT);
                    break;
                }
            }
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[6]);
        gl.viewport(0, 0, 256, 256);
        gl.depthFunc(gl.GREATER);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 9, 256);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[7]);
        gl.viewport(0, 0, 128, 128);
        gl.depthFunc(gl.ALWAYS);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 128);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, 64);
    } catch(e) {}

    try {
        for (let i = 0; i < syncs.length; i++) {
            gl.deleteSync(syncs[i]);
        }
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float',
    'EXT_texture_filter_anisotropic'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    const extFloat = gl.getExtension('EXT_color_buffer_float');
    const extAniso = gl.getExtension('EXT_texture_filter_anisotropic');

    const texSize = 1024;
    const texSizeHalf = texSize / 2;
    const texSizeQuarter = texSize / 4;
    const texPixels = texSize * texSize;
    const bufferSize = texPixels * 16;
    const vertexCount = 36;
    const instanceCount = 4096;
    const mipLevels = 10;
    const mrtCount = 8;
    const arrayLayers = 256;
    const tex3dDepth = 128;
    const samplerCount = 32;
    const syncCount = 64;
    const queryCount = 32;
    const tfBufferCount = 16;
    const uboCount = 32;
    const renderbufferCount = 64;
    const vaoCount = 16;
    const fboCount = 32;

    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const textureTarget = gl.TEXTURE_2D;
    const arrayTarget = gl.TEXTURE_2D_ARRAY;
    const tex3dTarget = gl.TEXTURE_3D;
    const cubeTarget = gl.TEXTURE_CUBE_MAP;
    const textureFormat = gl.RGBA32F;
    const integerFormat = gl.RGBA32I;
    const uintFormat = gl.RGBA32UI;

    const vsSource = `#version 300 es
    in vec4 position;
    in vec3 normal;
    in vec2 texcoord;
    in vec4 color;
    in vec4 tangent;
    in vec3 bitangent;
    flat out int instanceID;
    flat out int layerID;
    flat out int drawID;
    out vec2 vTexcoord;
    out vec3 vNormal;
    out vec4 vColor;
    out vec3 vTangent;
    out vec3 vBitangent;
    out vec3 vWorldPos;
    out vec3 vViewPos;
    out vec4 vLightSpace;
    uniform Matrices {
        mat4 projection;
        mat4 view;
        mat4 model;
        mat4 normalMatrix;
        mat4 lightSpace0;
        mat4 lightSpace1;
        mat4 texMatrix0;
        mat4 texMatrix1;
        mat4 texMatrix2;
        mat4 texMatrix3;
        mat4 shadowMatrix;
        mat4 reflectionMatrix;
    };
    uniform Transform {
        vec4 scale;
        vec4 rotation;
        vec4 translation;
        vec4 pivot;
    };
    void main() {
        instanceID = gl_InstanceID;
        layerID = gl_InstanceID % 256;
        drawID = gl_InstanceID / 256;
        vTexcoord = texcoord;
        vNormal = mat3(normalMatrix) * normal;
        vColor = color;
        vTangent = mat3(normalMatrix) * tangent.xyz;
        vBitangent = mat3(normalMatrix) * bitangent;
        vec4 worldPos = model * position;
        vWorldPos = worldPos.xyz;
        vViewPos = (view * worldPos).xyz;
        vLightSpace = lightSpace0 * worldPos;
        gl_Position = projection * view * worldPos;
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    precision highp int;
    precision highp sampler2D;
    precision highp sampler2DArray;
    precision highp sampler3D;
    precision highp samplerCube;
    precision highp isampler2D;
    precision highp usampler2D;
    precision highp sampler2DShadow;
    flat in int instanceID;
    flat in int layerID;
    flat in int drawID;
    in vec2 vTexcoord;
    in vec3 vNormal;
    in vec4 vColor;
    in vec3 vTangent;
    in vec3 vBitangent;
    in vec3 vWorldPos;
    in vec3 vViewPos;
    in vec4 vLightSpace;
    uniform sampler2D tex0;
    uniform sampler2D tex1;
    uniform sampler2D tex2;
    uniform sampler2D tex3;
    uniform sampler2D tex4;
    uniform sampler2D tex5;
    uniform sampler2D tex6;
    uniform sampler2D tex7;
    uniform sampler2DArray texArray;
    uniform sampler3D tex3d;
    uniform samplerCube texCube;
    uniform isampler2D intTex;
    uniform usampler2D uintTex;
    uniform sampler2DShadow shadowTex;
    uniform Lighting {
        vec4 lightPos0;
        vec4 lightColor0;
        vec4 lightPos1;
        vec4 lightColor1;
        vec4 lightPos2;
        vec4 lightColor2;
        vec4 lightPos3;
        vec4 lightColor3;
        vec4 ambient;
        vec4 specular;
        float intensity;
        float shininess;
        float time;
        float padding;
    };
    uniform Material {
        vec4 diffuse;
        vec4 emissive;
        vec4 reflectance;
        vec4 metallic;
        float roughness;
        float ao;
        float opacity;
        float refraction;
    };
    layout(location = 0) out vec4 fragColor0;
    layout(location = 1) out vec4 fragColor1;
    layout(location = 2) out vec4 fragColor2;
    layout(location = 3) out vec4 fragColor3;
    layout(location = 4) out vec4 fragColor4;
    layout(location = 5) out vec4 fragColor5;
    layout(location = 6) out vec4 fragColor6;
    layout(location = 7) out vec4 fragColor7;
    void main() {
        vec4 t0 = texture(tex0, vTexcoord);
        vec4 t1 = texture(tex1, vTexcoord * 2.0);
        vec4 t2 = texture(tex2, vTexcoord * 0.5);
        vec4 t3 = texture(tex3, vTexcoord + vec2(time * 0.01));
        vec4 t4 = texture(tex4, vTexcoord * 4.0);
        vec4 t5 = texture(tex5, vTexcoord * 0.25);
        vec4 t6 = texture(tex6, vTexcoord + vec2(0.5));
        vec4 t7 = texture(tex7, vTexcoord * vec2(2.0, 0.5));
        vec4 tArray = texture(texArray, vec3(vTexcoord, float(layerID)));
        vec4 t3d = texture(tex3d, vec3(vTexcoord, time * 0.01));
        vec3 reflectDir = reflect(normalize(vViewPos), normalize(vNormal));
        vec4 tCube = texture(texCube, reflectDir);
        ivec4 tInt = texture(intTex, vTexcoord);
        uvec4 tUint = texture(uintTex, vTexcoord);
        vec3 shadowCoord = vLightSpace.xyz / vLightSpace.w * 0.5 + 0.5;
        float shadow = texture(shadowTex, shadowCoord);
        mat3 tbn = mat3(vTangent, vBitangent, vNormal);
        vec3 normalMap = t0.xyz * 2.0 - 1.0;
        vec3 normal = normalize(tbn * normalMap);
        vec3 viewDir = normalize(-vViewPos);
        vec3 lightDir0 = normalize(lightPos0.xyz - vWorldPos);
        vec3 lightDir1 = normalize(lightPos1.xyz - vWorldPos);
        vec3 lightDir2 = normalize(lightPos2.xyz - vWorldPos);
        vec3 lightDir3 = normalize(lightPos3.xyz - vWorldPos);
        float diff0 = max(dot(normal, lightDir0), 0.0);
        float diff1 = max(dot(normal, lightDir1), 0.0);
        float diff2 = max(dot(normal, lightDir2), 0.0);
        float diff3 = max(dot(normal, lightDir3), 0.0);
        vec3 halfDir0 = normalize(lightDir0 + viewDir);
        vec3 halfDir1 = normalize(lightDir1 + viewDir);
        float spec0 = pow(max(dot(normal, halfDir0), 0.0), shininess);
        float spec1 = pow(max(dot(normal, halfDir1), 0.0), shininess);
        vec4 diffuseLight = (lightColor0 * diff0 + lightColor1 * diff1 + lightColor2 * diff2 + lightColor3 * diff3) * intensity;
        vec4 specularLight = (lightColor0 * spec0 + lightColor1 * spec1) * specular * intensity;
        vec4 base = (t0 + t1 * 0.5 + t2 * 0.25 + t3 * 0.125 + t4 * 0.0625 + t5 * 0.03125 + t6 * 0.015625 + t7 * 0.0078125);
        base += tArray * 0.2 + t3d * 0.15 + tCube * 0.1;
        base += vec4(tInt) * 0.001 + vec4(tUint) * 0.0005;
        base *= vColor * diffuse;
        base = base * (ambient + diffuseLight * shadow) + specularLight * shadow;
        base += emissive;
        base *= reflectance;
        base.rgb = mix(base.rgb, base.rgb * metallic.rgb, metallic.a);
        base.rgb *= 1.0 - roughness * 0.5;
        base.rgb *= ao;
        base.a = opacity;
        fragColor0 = base;
        fragColor1 = base * vec4(1.0, 0.95, 0.9, 1.0);
        fragColor2 = base * vec4(0.9, 1.0, 0.95, 1.0);
        fragColor3 = base * vec4(0.95, 0.9, 1.0, 1.0);
        fragColor4 = base * 0.85;
        fragColor5 = base * 0.75;
        fragColor6 = base * 0.65;
        fragColor7 = base * 0.55;
    }`;

    try {
        const vShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vShader, vsSource);
        gl.compileShader(vShader);
        if (!gl.getShaderParameter(vShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vShader));
        }
        const fShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fShader, fsSource);
        gl.compileShader(fShader);
        if (!gl.getShaderParameter(fShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fShader));
        }
        const program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);
    } catch(e) {}

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        const buffer4 = gl.createBuffer();
        const buffer5 = gl.createBuffer();
        const buffer6 = gl.createBuffer();
        const buffer7 = gl.createBuffer();
        const buffer8 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 32768, gl.DYNAMIC_DRAW);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bufferData(bufferTarget, 65536, gl.STREAM_DRAW);
        gl.bindBuffer(bufferTarget, buffer4);
        gl.bufferData(bufferTarget, 131072, gl.STATIC_COPY);
        gl.bindBuffer(bufferTarget, buffer5);
        gl.bufferData(bufferTarget, 262144, gl.DYNAMIC_COPY);
        gl.bindBuffer(bufferTarget, buffer6);
        gl.bufferData(bufferTarget, 524288, gl.STREAM_COPY);
        gl.bindBuffer(bufferTarget, buffer7);
        gl.bufferData(bufferTarget, 1048576, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, buffer8);
        gl.bufferData(bufferTarget, 2097152, gl.DYNAMIC_DRAW);
    } catch(e) {}

    try {
        const posData = new Float32Array(vertexCount * 3);
        for (let i = 0; i < vertexCount; i++) {
            const angle = (i / vertexCount) * Math.PI * 2;
            const radius = 0.5 + Math.sin(i * 0.5) * 0.3;
            posData[i * 3] = Math.cos(angle) * radius;
            posData[i * 3 + 1] = Math.sin(angle) * radius;
            posData[i * 3 + 2] = Math.sin(i * 0.3) * 0.2;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, posData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        const normalData = new Float32Array(vertexCount * 3);
        for (let i = 0; i < normalData.length; i += 3) {
            normalData[i] = Math.sin(i * 0.1);
            normalData[i+1] = Math.cos(i * 0.1);
            normalData[i+2] = 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, normalData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    try {
        const texData = new Float32Array(vertexCount * 2);
        for (let i = 0; i < vertexCount; i++) {
            texData[i * 2] = i / vertexCount;
            texData[i * 2 + 1] = (i % 4) / 4.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, texData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 8, 0);
    } catch(e) {}

    try {
        const colorData = new Float32Array(vertexCount * 4);
        for (let i = 0; i < colorData.length; i += 4) {
            colorData[i] = Math.random() * 0.5 + 0.5;
            colorData[i+1] = Math.random() * 0.5 + 0.5;
            colorData[i+2] = Math.random() * 0.5 + 0.5;
            colorData[i+3] = 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, colorData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(3);
        gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 16, 0);
    } catch(e) {}

    try {
        const tangentData = new Float32Array(vertexCount * 4);
        for (let i = 0; i < tangentData.length; i += 4) {
            tangentData[i] = 1.0;
            tangentData[i+1] = 0.0;
            tangentData[i+2] = 0.0;
            tangentData[i+3] = 1.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, tangentData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(4);
        gl.vertexAttribPointer(4, 4, gl.FLOAT, false, 16, 0);
    } catch(e) {}

    try {
        const bitangentData = new Float32Array(vertexCount * 3);
        for (let i = 0; i < bitangentData.length; i += 3) {
            bitangentData[i] = 0.0;
            bitangentData[i+1] = 1.0;
            bitangentData[i+2] = 0.0;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, bitangentData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(5);
        gl.vertexAttribPointer(5, 3, gl.FLOAT, false, 12, 0);
    } catch(e) {}

    const ubos = [];
    try {
        for (let i = 0; i < uboCount; i++) {
            const ubo = gl.createBuffer();
            ubos.push(ubo);
            gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
            gl.bindBuffer(gl.UNIFORM_BUFFER, null);
            gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
            gl.bufferData(gl.UNIFORM_BUFFER, 1024, gl.DYNAMIC_DRAW);
            gl.bindBufferBase(gl.UNIFORM_BUFFER, i, ubo);
        }
    } catch(e) {}

    const textures = [];
    try {
        for (let i = 0; i < 16; i++) {
            const tex = gl.createTexture();
            textures.push(tex);
            gl.bindTexture(textureTarget, tex);
            gl.bindTexture(textureTarget, null);
            gl.bindTexture(textureTarget, tex);
            gl.texStorage2D(textureTarget, mipLevels, textureFormat, texSize, texSize);
            gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.REPEAT);
            gl.texParameteri(textureTarget, gl.TEXTURE_BASE_LEVEL, 0);
            gl.texParameteri(textureTarget, gl.TEXTURE_MAX_LEVEL, mipLevels - 1);
        }
    } catch(e) {}

    let intTex, uintTex;
    try {
        intTex = gl.createTexture();
        gl.bindTexture(textureTarget, intTex);
        gl.texStorage2D(textureTarget, 1, integerFormat, 512, 512);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        uintTex = gl.createTexture();
        gl.bindTexture(textureTarget, uintTex);
        gl.texStorage2D(textureTarget, 1, uintFormat, 512, 512);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    let texArray;
    try {
        texArray = gl.createTexture();
        gl.bindTexture(arrayTarget, texArray);
        gl.bindTexture(arrayTarget, null);
        gl.bindTexture(arrayTarget, texArray);
        gl.texStorage3D(arrayTarget, 8, gl.RGBA32F, 1024, 1024, arrayLayers);
        gl.texParameteri(arrayTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(arrayTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(arrayTarget, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(arrayTarget, gl.TEXTURE_WRAP_T, gl.REPEAT);
    } catch(e) {}

    let tex3d;
    try {
        tex3d = gl.createTexture();
        gl.bindTexture(tex3dTarget, tex3d);
        gl.bindTexture(tex3dTarget, null);
        gl.bindTexture(tex3dTarget, tex3d);
        gl.texStorage3D(tex3dTarget, 7, gl.RGBA16F, 256, 256, tex3dDepth);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(tex3dTarget, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    let texCube;
    try {
        texCube = gl.createTexture();
        gl.bindTexture(cubeTarget, texCube);
        gl.texStorage2D(cubeTarget, 6, gl.RGBA16F, 512, 512);
        gl.texParameteri(cubeTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(cubeTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(cubeTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(cubeTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(cubeTarget, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    let shadowTex;
    try {
        shadowTex = gl.createTexture();
        gl.bindTexture(textureTarget, shadowTex);
        gl.texStorage2D(textureTarget, 1, gl.DEPTH_COMPONENT24, 1024, 1024);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
        gl.texParameteri(textureTarget, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
    } catch(e) {}

    const renderbuffers = [];
    try {
        for (let i = 0; i < renderbufferCount; i++) {
            const rb = gl.createRenderbuffer();
            renderbuffers.push(rb);
            gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
            gl.bindRenderbuffer(gl.RENDERBUFFER, null);
            gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
            if (i % 16 === 0) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA32F, 1024, 1024);
            } else if (i % 16 === 1) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.RGBA32F, 512, 512);
            } else if (i % 16 === 2) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 8, gl.RGBA16F, 256, 256);
            } else if (i % 16 === 3) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 16, gl.RGBA8, 256, 256);
            } else if (i % 16 === 4) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.R11F_G11F_B10F, 512, 512);
            } else if (i % 16 === 5) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGB10_A2, 512, 512);
            } else if (i % 16 === 6) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16F, 256, 256);
            } else if (i % 16 === 7) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, 1024, 1024);
            } else if (i % 16 === 8) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, 1024, 1024);
            } else if (i % 16 === 9) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, 512, 512);
            } else if (i % 16 === 10) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT32F, 512, 512);
            } else if (i % 16 === 11) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 4, gl.DEPTH_COMPONENT24, 512, 512);
            } else if (i % 16 === 12) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH24_STENCIL8, 1024, 1024);
            } else if (i % 16 === 13) {
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH32F_STENCIL8, 512, 512);
            } else if (i % 16 === 14) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 8, gl.DEPTH24_STENCIL8, 512, 512);
            } else {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 16, gl.DEPTH32F_STENCIL8, 256, 256);
            }
        }
    } catch(e) {}

    const samplers = [];
    try {
        const maxAniso = gl.getParameter(extAniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
        for (let i = 0; i < samplerCount; i++) {
            const sampler = gl.createSampler();
            samplers.push(sampler);
            gl.samplerParameteri(sampler, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.samplerParameteri(sampler, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.samplerParameteri(sampler, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.samplerParameteri(sampler, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.samplerParameterf(sampler, extAniso.TEXTURE_MAX_ANISOTROPY_EXT, maxAniso * (i + 1) / samplerCount);
            gl.samplerParameterf(sampler, gl.TEXTURE_MIN_LOD, -1000.0);
            gl.samplerParameterf(sampler, gl.TEXTURE_MAX_LOD, 1000.0);
            if (i % 4 === 0) {
                gl.samplerParameteri(sampler, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
                gl.samplerParameteri(sampler, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
            }
        }
    } catch(e) {}

    const vaos = [];
    try {
        for (let i = 0; i < vaoCount; i++) {
            const vao = gl.createVertexArray();
            vaos.push(vao);
            gl.bindVertexArray(vao);
            gl.bindVertexArray(null);
            gl.bindVertexArray(vao);
        }
    } catch(e) {}

    const fbos = [];
    try {
        for (let i = 0; i < fboCount; i++) {
            const fbo = gl.createFramebuffer();
            fbos.push(fbo);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            for (let j = 0; j < mrtCount; j++) {
                if (i % 4 === 0) {
                    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + j, gl.TEXTURE_2D, textures[j % textures.length], 0);
                } else {
                    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + j, gl.RENDERBUFFER, renderbuffers[j % renderbufferCount]);
                }
            }
            if (i % 3 === 0) {
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, renderbuffers[8]);
            } else if (i % 3 === 1) {
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, renderbuffers[12]);
            } else {
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
            }
            const drawBuffers = [gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3, gl.COLOR_ATTACHMENT4, gl.COLOR_ATTACHMENT5, gl.COLOR_ATTACHMENT6, gl.COLOR_ATTACHMENT7];
            gl.drawBuffers(drawBuffers);
        }
    } catch(e) {}

    const queries = [];
    try {
        for (let i = 0; i < queryCount; i++) {
            const query = gl.createQuery();
            queries.push(query);
        }
    } catch(e) {}

    const tfBuffers = [];
    try {
        for (let i = 0; i < tfBufferCount; i++) {
            const buf = gl.createBuffer();
            tfBuffers.push(buf);
            gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, buf);
            gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, null);
            gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, buf);
            gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 131072, gl.DYNAMIC_COPY);
        }
    } catch(e) {}

    const syncs = [];
    try {
        for (let i = 0; i < syncCount; i++) {
            const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
            syncs.push(sync);
            if (i % 8 === 0) {
                gl.flush();
            }
        }
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.depthFunc(gl.LESS);
        gl.depthFunc(gl.LEQUAL);
        gl.depthMask(true);
        gl.depthMask(false);
        gl.depthMask(true);
        gl.clearDepth(1.0);
        gl.depthRange(0.0, 1.0);
    } catch(e) {}

    try {
        gl.enable(gl.STENCIL_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilFunc(gl.EQUAL, 1, 0xFF);
        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.stencilOp(gl.INCR, gl.DECR, gl.INVERT);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.stencilMask(0xFF);
        gl.stencilMask(0x00);
        gl.stencilMask(0xFF);
        gl.clearStencil(0);
    } catch(e) {}

    try {
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendEquation(gl.FUNC_ADD);
        gl.blendEquationSeparate(gl.FUNC_ADD, gl.FUNC_ADD);
        gl.blendEquationSeparate(gl.FUNC_SUBTRACT, gl.FUNC_REVERSE_SUBTRACT);
        gl.blendEquationSeparate(gl.FUNC_ADD, gl.FUNC_ADD);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ZERO);
        gl.blendFuncSeparate(gl.ONE, gl.ONE, gl.ONE, gl.ONE);
        gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ZERO);
        for (let i = 0; i < mrtCount; i++) {
            gl.blendEquationi(i, gl.FUNC_ADD);
            if (i % 4 === 0) {
                gl.blendFunci(i, gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
            } else if (i % 4 === 1) {
                gl.blendFunci(i, gl.ONE, gl.ONE);
            } else if (i % 4 === 2) {
                gl.blendFunci(i, gl.SRC_COLOR, gl.DST_COLOR);
            } else {
                gl.blendFunci(i, gl.ZERO, gl.ONE);
            }
        }
        gl.blendColor(0.5, 0.5, 0.5, 0.5);
        gl.blendColor(1.0, 1.0, 1.0, 1.0);
        gl.blendColor(0.25, 0.75, 0.5, 0.5);
    } catch(e) {}

    try {
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        gl.cullFace(gl.FRONT);
        gl.cullFace(gl.BACK);
        gl.frontFace(gl.CCW);
        gl.frontFace(gl.CW);
        gl.frontFace(gl.CCW);
        gl.enable(gl.POLYGON_OFFSET_FILL);
        gl.polygonOffset(1.0, 1.0);
        gl.polygonOffset(2.0, 2.0);
        gl.polygonOffset(0.5, 0.5);
    } catch(e) {}

    try {
        gl.enable(gl.SAMPLE_COVERAGE);
        gl.sampleCoverage(1.0, false);
        gl.sampleCoverage(0.5, false);
        gl.sampleCoverage(0.75, true);
        gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
        gl.enable(gl.DITHER);
        gl.disable(gl.DITHER);
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(0, 0, 1024, 1024);
        gl.scissor(0, 0, 512, 512);
        gl.scissor(0, 0, 256, 256);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0]);
        gl.viewport(0, 0, texSize, texSize);
        for (let i = 0; i < mrtCount; i++) {
            const color = [Math.random(), Math.random(), Math.random(), 1.0];
            gl.clearBufferfv(gl.COLOR, i, color);
        }
        gl.clearBufferfv(gl.DEPTH, 0, [1.0]);
        gl.clearBufferiv(gl.STENCIL, 0, [0]);
        gl.clearBufferfi(gl.DEPTH_STENCIL, 0, 1.0, 0);
    } catch(e) {}

    try {
        for (let i = 0; i < samplerCount; i++) {
            gl.bindSampler(i, samplers[i]);
        }
        for (let i = 0; i < 8; i++) {
            gl.activeTexture(gl.TEXTURE0 + i);
            gl.bindTexture(gl.TEXTURE_2D, textures[i]);
        }
        gl.activeTexture(gl.TEXTURE8);
        gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray);
        gl.activeTexture(gl.TEXTURE9);
        gl.bindTexture(gl.TEXTURE_3D, tex3d);
        gl.activeTexture(gl.TEXTURE10);
        gl.bindTexture(gl.TEXTURE_CUBE_MAP, texCube);
        gl.activeTexture(gl.TEXTURE11);
        gl.bindTexture(gl.TEXTURE_2D, intTex);
        gl.activeTexture(gl.TEXTURE12);
        gl.bindTexture(gl.TEXTURE_2D, uintTex);
        gl.activeTexture(gl.TEXTURE13);
        gl.bindTexture(gl.TEXTURE_2D, shadowTex);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[0]);
        gl.viewport(0, 0, 1024, 1024);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[0]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, instanceCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[1]);
        gl.viewport(0, 0, 512, 512);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, queries[1]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 18, 2048);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[2]);
        gl.viewport(0, 0, 256, 256);
        gl.stencilFunc(gl.EQUAL, 1, 0xFF);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, queries[2]);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 12, 1024);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[0]);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbos[3]);
        gl.blitFramebuffer(0, 0, 1024, 1024, 0, 0, 512, 512, gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT, gl.LINEAR);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[3]);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbos[4]);
        gl.blitFramebuffer(0, 0, 512, 512, 0, 0, 256, 256, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[4]);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbos[5]);
        gl.blitFramebuffer(0, 0, 256, 256, 0, 0, 128, 128, gl.COLOR_BUFFER_BIT, gl.LINEAR);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[5]);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbos[6]);
        gl.blitFramebuffer(0, 0, 128, 128, 0, 0, 1024, 1024, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[0]);
        for (let i = 0; i < mrtCount; i++) {
            gl.readBuffer(gl.COLOR_ATTACHMENT0 + i);
            const pixels = new Float32Array(512 * 512 * 4);
            gl.readPixels(0, 0, 512, 512, gl.RGBA, gl.FLOAT, pixels);
        }
    } catch(e) {}

    try {
        const pbo1 = gl.createBuffer();
        const pbo2 = gl.createBuffer();
        const pbo3 = gl.createBuffer();
        const pbo4 = gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo1);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 1024 * 1024 * 16, gl.STREAM_READ);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos[0]);
        gl.readBuffer(gl.COLOR_ATTACHMENT0);
        gl.readPixels(0, 0, 1024, 1024, gl.RGBA, gl.FLOAT, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo2);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 512 * 512 * 16, gl.STREAM_READ);
        gl.readBuffer(gl.COLOR_ATTACHMENT1);
        gl.readPixels(0, 0, 512, 512, gl.RGBA, gl.FLOAT, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo3);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 256 * 256 * 16, gl.STREAM_READ);
        gl.readBuffer(gl.COLOR_ATTACHMENT2);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.FLOAT, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo4);
        gl.bufferData(gl.PIXEL_PACK_BUFFER, 128 * 128 * 16, gl.STREAM_READ);
        gl.readBuffer(gl.COLOR_ATTACHMENT3);
        gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.FLOAT, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        for (let i = 0; i < syncs.length; i++) {
            const status = gl.clientWaitSync(syncs[i], gl.SYNC_FLUSH_COMMANDS_BIT, 10000);
            const signaled = gl.getSyncParameter(syncs[i], gl.SYNC_STATUS);
            const condition = gl.getSyncParameter(syncs[i], gl.SYNC_CONDITION);
            const flags = gl.getSyncParameter(syncs[i], gl.SYNC_FLAGS);
            if (i % 16 === 0) {
                gl.waitSync(syncs[i], 0, gl.TIMEOUT_IGNORED);
            }
        }
    } catch(e) {}

    try {
        for (let i = 0; i < queries.length; i++) {
            for (let j = 0; j < 512; j++) {
                const available = gl.getQueryParameter(queries[i], gl.QUERY_RESULT_AVAILABLE);
                if (available) {
                    const result = gl.getQueryParameter(queries[i], gl.QUERY_RESULT);
                    break;
                }
            }
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[7]);
        gl.viewport(0, 0, 512, 512);
        gl.depthFunc(gl.GREATER);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 18, 512);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[8]);
        gl.viewport(0, 0, 256, 256);
        gl.depthFunc(gl.ALWAYS);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 12, 256);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[9]);
        gl.viewport(0, 0, 128, 128);
        gl.depthFunc(gl.NEVER);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 128);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, 32);
    } catch(e) {}

    try {
        for (let i = 0; i < syncs.length; i++) {
            gl.deleteSync(syncs[i]);
        }
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>

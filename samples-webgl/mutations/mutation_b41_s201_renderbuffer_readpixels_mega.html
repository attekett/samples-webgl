<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = ['EXT_color_buffer_float'];

const rboCount = 8;
const pixelSize = 256;
const packAlignment = 4;
const packRowLength = 512;
const packSkipPixels = 16;
const packSkipRows = 8;
const readIterations = 4;

const RGBA8 = 32856;
const RGBA16F = 34842;
const RGBA32F = 34836;
const R11F_G11F_B10F = 35898;
const RGB10_A2 = 32857;
const DEPTH_COMPONENT32F = 36012;
const DEPTH24_STENCIL8 = 35056;
const STENCIL_INDEX8 = 36168;
const RENDERBUFFER = 36161;
const FRAMEBUFFER = 36160;
const COLOR_ATTACHMENT0 = 36064;
const DEPTH_ATTACHMENT = 36096;
const DEPTH_STENCIL_ATTACHMENT = 33306;
const PIXEL_PACK_BUFFER = 35051;
const STREAM_READ = 35041;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    let rbo1, rbo2, rbo3, rbo4, rbo5, rbo6, rbo7, rbo8, fbo1, fbo2, pixels1, pixels2, pbo1, pbo2, fbo3, pixels3;

    try {
        rbo1 = gl.createRenderbuffer();
        rbo2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rbo1);
        gl.bindRenderbuffer(RENDERBUFFER, rbo2);
        gl.bindRenderbuffer(RENDERBUFFER, rbo1);
        gl.renderbufferStorage(RENDERBUFFER, RGBA8, pixelSize, pixelSize);
        gl.renderbufferStorage(RENDERBUFFER, 32856, 256, 256);
    } catch(e) {}

    try {
        rbo3 = gl.createRenderbuffer();
        rbo4 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rbo3);
        gl.renderbufferStorage(RENDERBUFFER, RGBA16F, pixelSize, pixelSize);
        gl.bindRenderbuffer(RENDERBUFFER, rbo4);
        gl.renderbufferStorage(RENDERBUFFER, RGBA32F, 256, 256);
        gl.bindRenderbuffer(RENDERBUFFER, rbo3);
    } catch(e) {}

    try {
        rbo5 = gl.createRenderbuffer();
        rbo6 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rbo5);
        gl.renderbufferStorage(RENDERBUFFER, R11F_G11F_B10F, pixelSize, pixelSize);
        gl.bindRenderbuffer(RENDERBUFFER, rbo6);
        gl.renderbufferStorage(RENDERBUFFER, RGB10_A2, pixelSize, pixelSize);
    } catch(e) {}

    try {
        rbo7 = gl.createRenderbuffer();
        rbo8 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rbo7);
        gl.renderbufferStorage(RENDERBUFFER, DEPTH_COMPONENT32F, 256, 256);
        gl.bindRenderbuffer(RENDERBUFFER, rbo8);
        gl.renderbufferStorage(RENDERBUFFER, DEPTH24_STENCIL8, pixelSize, pixelSize);
    } catch(e) {}

    try {
        fbo1 = gl.createFramebuffer();
        fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(FRAMEBUFFER, fbo1);
        gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo1);
        gl.bindFramebuffer(FRAMEBUFFER, fbo2);
        gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo3);
        gl.bindFramebuffer(FRAMEBUFFER, fbo1);
    } catch(e) {}

    try {
        gl.clearColor(0.1, 0.2, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(FRAMEBUFFER, fbo2);
        gl.clearColor(0.4, 0.5, 0.6, 0.8);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, packAlignment);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, packRowLength);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, packSkipPixels);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, packSkipRows);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 0);
    } catch(e) {}

    try {
        pixels1 = new Uint8Array(pixelSize * pixelSize * 4);
        pixels2 = new Float32Array(256 * 256 * 4);
        gl.bindFramebuffer(FRAMEBUFFER, fbo1);
        gl.readPixels(0, 0, pixelSize, pixelSize, gl.RGBA, gl.UNSIGNED_BYTE, pixels1);
        gl.bindFramebuffer(FRAMEBUFFER, fbo2);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.FLOAT, pixels2);
    } catch(e) {}

    try {
        pbo1 = gl.createBuffer();
        pbo2 = gl.createBuffer();
        gl.bindBuffer(PIXEL_PACK_BUFFER, pbo1);
        gl.bufferData(PIXEL_PACK_BUFFER, pixelSize * pixelSize * 16, STREAM_READ);
        gl.bindBuffer(PIXEL_PACK_BUFFER, pbo2);
        gl.bufferData(PIXEL_PACK_BUFFER, pixelSize * pixelSize * 32, STREAM_READ);
    } catch(e) {}

    try {
        gl.bindBuffer(PIXEL_PACK_BUFFER, pbo1);
        gl.bindFramebuffer(FRAMEBUFFER, fbo1);
        gl.readPixels(0, 0, pixelSize, pixelSize, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(PIXEL_PACK_BUFFER, pbo2);
        gl.bindFramebuffer(FRAMEBUFFER, fbo2);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.FLOAT, 0);
    } catch(e) {}

    try {
        for (let i = 0; i < readIterations; i++) {
            gl.pixelStorei(gl.PACK_ALIGNMENT, 1 << i);
            gl.bindFramebuffer(FRAMEBUFFER, fbo1);
            gl.readPixels(i * 32, i * 16, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, 0);
            gl.pixelStorei(gl.PACK_ROW_LENGTH, (i + 2) * 128);
            gl.readPixels(0, 0, pixelSize, pixelSize, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        }
    } catch(e) {}

    try {
        gl.bindBuffer(PIXEL_PACK_BUFFER, null);
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(FRAMEBUFFER, fbo3);
        gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo5);
        gl.clearColor(0.7, 0.8, 0.9, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        pixels3 = new Float32Array(pixelSize * pixelSize * 4);
        gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.FLOAT, pixels3);
    } catch(e) {}

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, 8);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 1024);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 32);
        gl.pixelStorei(gl.PACK_SKIP_ROWS, 16);
        gl.bindBuffer(PIXEL_PACK_BUFFER, pbo2);
        gl.bindFramebuffer(FRAMEBUFFER, fbo1);
        gl.readPixels(0, 0, pixelSize, pixelSize, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(PIXEL_PACK_BUFFER, null);
    } catch(e) {}

    try {
        gl.bindFramebuffer(FRAMEBUFFER, null);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

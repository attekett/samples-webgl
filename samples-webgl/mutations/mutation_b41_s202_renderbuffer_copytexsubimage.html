<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const rboSize = 256;
const msaaSamples4 = 4;
const msaaSamples8 = 8;
const msaaSamples16 = 16;
const msaaSamples32 = 32;
const mipLevels = 4;
const arrayLayers = 8;

const RGBA8 = 32856;
const RENDERBUFFER = 36161;
const FRAMEBUFFER = 36160;
const READ_FRAMEBUFFER = 36008;
const DRAW_FRAMEBUFFER = 36009;
const COLOR_ATTACHMENT0 = 36064;
const TEXTURE_2D = 3553;
const TEXTURE_2D_ARRAY = 35866;
const RGBA = 6408;
const UNSIGNED_BYTE = 5121;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rboMs4 = gl.createRenderbuffer();
        const rboMs8 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rboMs4);
        gl.bindRenderbuffer(RENDERBUFFER, rboMs8);
        gl.bindRenderbuffer(RENDERBUFFER, rboMs4);
        gl.renderbufferStorageMultisample(RENDERBUFFER, msaaSamples4, RGBA8, rboSize, rboSize);
        gl.renderbufferStorageMultisample(RENDERBUFFER, 4, 32856, 256, 256);
    } catch(e) {}

    try {
        const rboMs16 = gl.createRenderbuffer();
        const rboMs32 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rboMs16);
        gl.renderbufferStorageMultisample(RENDERBUFFER, msaaSamples16, RGBA8, rboSize, rboSize);
        gl.bindRenderbuffer(RENDERBUFFER, rboMs32);
        gl.renderbufferStorageMultisample(RENDERBUFFER, msaaSamples32, RGBA8, 256, 256);
    } catch(e) {}

    try {
        const rboSingle1 = gl.createRenderbuffer();
        const rboSingle2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rboSingle1);
        gl.renderbufferStorage(RENDERBUFFER, RGBA8, rboSize, rboSize);
        gl.bindRenderbuffer(RENDERBUFFER, rboSingle2);
        gl.renderbufferStorage(RENDERBUFFER, RGBA8, 256, 256);
    } catch(e) {}

    try {
        const fboRead = gl.createFramebuffer();
        const fboDraw = gl.createFramebuffer();
        gl.bindFramebuffer(READ_FRAMEBUFFER, fboRead);
        gl.framebufferRenderbuffer(READ_FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rboMs4);
        gl.bindFramebuffer(DRAW_FRAMEBUFFER, fboDraw);
        gl.framebufferRenderbuffer(DRAW_FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rboSingle1);
    } catch(e) {}

    try {
        gl.bindFramebuffer(READ_FRAMEBUFFER, fboRead);
        gl.clearColor(0.1, 0.2, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.blitFramebuffer(0, 0, rboSize, rboSize, 0, 0, 256, 256, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.blitFramebuffer(0, 0, 256, 256, 0, 0, rboSize, rboSize, gl.COLOR_BUFFER_BIT, gl.LINEAR);
    } catch(e) {}

    try {
        const tex1 = gl.createTexture();
        gl.bindTexture(TEXTURE_2D, tex1);
        gl.texImage2D(TEXTURE_2D, 0, RGBA8, rboSize, rboSize, 0, RGBA, UNSIGNED_BYTE, null);
        gl.texImage2D(TEXTURE_2D, 1, RGBA8, 128, 128, 0, RGBA, UNSIGNED_BYTE, null);
        gl.texImage2D(TEXTURE_2D, 2, RGBA8, 64, 64, 0, RGBA, UNSIGNED_BYTE, null);
        gl.texImage2D(TEXTURE_2D, 3, RGBA8, 32, 32, 0, RGBA, UNSIGNED_BYTE, null);
    } catch(e) {}

    try {
        gl.bindFramebuffer(READ_FRAMEBUFFER, fboDraw);
        gl.bindTexture(TEXTURE_2D, tex1);
        gl.copyTexSubImage2D(TEXTURE_2D, 0, 0, 0, 0, 0, rboSize, rboSize);
        gl.copyTexSubImage2D(TEXTURE_2D, 1, 0, 0, 0, 0, 128, 128);
        gl.copyTexSubImage2D(TEXTURE_2D, 2, 0, 0, 64, 64, 64, 64);
        gl.copyTexSubImage2D(TEXTURE_2D, 3, 0, 0, 128, 128, 32, 32);
    } catch(e) {}

    try {
        gl.bindFramebuffer(READ_FRAMEBUFFER, fboRead);
        gl.framebufferRenderbuffer(READ_FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rboMs8);
        gl.clearColor(0.4, 0.5, 0.6, 0.8);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.blitFramebuffer(0, 0, rboSize, rboSize, 0, 0, 256, 256, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    } catch(e) {}

    try {
        const texArray = gl.createTexture();
        gl.bindTexture(TEXTURE_2D_ARRAY, texArray);
        gl.texImage3D(TEXTURE_2D_ARRAY, 0, RGBA8, rboSize, rboSize, arrayLayers, 0, RGBA, UNSIGNED_BYTE, null);
        gl.texImage3D(TEXTURE_2D_ARRAY, 0, 32856, 256, 256, 8, 0, 6408, 5121, null);
    } catch(e) {}

    try {
        for (let i = 0; i < arrayLayers; i++) {
            gl.bindFramebuffer(READ_FRAMEBUFFER, fboDraw);
            gl.copyTexSubImage3D(TEXTURE_2D_ARRAY, 0, 0, 0, i, i * 32, i * 16, 128, 128);
            gl.copyTexSubImage3D(TEXTURE_2D_ARRAY, 0, 128, 0, i, 0, 0, 128, 256);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(READ_FRAMEBUFFER, fboRead);
        gl.framebufferRenderbuffer(READ_FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rboMs16);
        gl.clearColor(0.7, 0.8, 0.9, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(DRAW_FRAMEBUFFER, fboDraw);
        gl.framebufferRenderbuffer(DRAW_FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rboSingle2);
        gl.blitFramebuffer(0, 0, 256, 256, 0, 0, rboSize, rboSize, gl.COLOR_BUFFER_BIT, gl.LINEAR);
    } catch(e) {}

    try {
        gl.bindTexture(TEXTURE_2D, tex1);
        gl.bindFramebuffer(READ_FRAMEBUFFER, fboDraw);
        for (let level = 0; level < mipLevels; level++) {
            const size = rboSize >> level;
            gl.copyTexSubImage2D(TEXTURE_2D, level, 0, 0, 0, 0, size, size);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(FRAMEBUFFER, null);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

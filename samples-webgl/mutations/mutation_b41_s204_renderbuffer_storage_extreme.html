<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const rboCount = 12;
const initialSize = 256;
const midSize = 128;
const smallSize = 64;
const reallocationCycles = 4;
const attachmentSwaps = 8;

const RGBA8 = 32856;
const RGBA16F = 34842;
const RGBA32F = 34836;
const RGB10_A2 = 32857;
const R11F_G11F_B10F = 35898;
const RG16F = 33327;
const R32F = 33326;
const RGB8 = 32849;
const RG8 = 33323;
const R8 = 33321;
const DEPTH_COMPONENT32F = 36012;
const DEPTH24_STENCIL8 = 35056;
const RENDERBUFFER = 36161;
const FRAMEBUFFER = 36160;
const COLOR_ATTACHMENT0 = 36064;
const RENDERBUFFER_WIDTH = 36162;
const RENDERBUFFER_HEIGHT = 36163;
const RENDERBUFFER_INTERNAL_FORMAT = 36164;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const rbo1 = gl.createRenderbuffer();
        const rbo2 = gl.createRenderbuffer();
        const rbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rbo1);
        gl.bindRenderbuffer(RENDERBUFFER, rbo2);
        gl.bindRenderbuffer(RENDERBUFFER, rbo3);
        gl.bindRenderbuffer(RENDERBUFFER, rbo1);
        gl.renderbufferStorage(RENDERBUFFER, RGBA8, initialSize, initialSize);
    } catch(e) {}

    try {
        const rbo4 = gl.createRenderbuffer();
        const rbo5 = gl.createRenderbuffer();
        const rbo6 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rbo4);
        gl.renderbufferStorage(RENDERBUFFER, RGBA16F, initialSize, initialSize);
        gl.bindRenderbuffer(RENDERBUFFER, rbo5);
        gl.renderbufferStorage(RENDERBUFFER, RGBA32F, 256, 256);
        gl.bindRenderbuffer(RENDERBUFFER, rbo6);
        gl.renderbufferStorage(RENDERBUFFER, RGB10_A2, initialSize, initialSize);
    } catch(e) {}

    try {
        const rbo7 = gl.createRenderbuffer();
        const rbo8 = gl.createRenderbuffer();
        const rbo9 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rbo7);
        gl.renderbufferStorage(RENDERBUFFER, R11F_G11F_B10F, initialSize, initialSize);
        gl.bindRenderbuffer(RENDERBUFFER, rbo8);
        gl.renderbufferStorage(RENDERBUFFER, RG16F, 256, 256);
        gl.bindRenderbuffer(RENDERBUFFER, rbo9);
        gl.renderbufferStorage(RENDERBUFFER, R32F, initialSize, initialSize);
    } catch(e) {}

    try {
        const rbo10 = gl.createRenderbuffer();
        const rbo11 = gl.createRenderbuffer();
        const rbo12 = gl.createRenderbuffer();
        gl.bindRenderbuffer(RENDERBUFFER, rbo10);
        gl.renderbufferStorage(RENDERBUFFER, RGB8, initialSize, initialSize);
        gl.bindRenderbuffer(RENDERBUFFER, rbo11);
        gl.renderbufferStorage(RENDERBUFFER, RG8, 256, 256);
        gl.bindRenderbuffer(RENDERBUFFER, rbo12);
        gl.renderbufferStorage(RENDERBUFFER, R8, initialSize, initialSize);
    } catch(e) {}

    try {
        for (let i = 0; i < reallocationCycles; i++) {
            gl.bindRenderbuffer(RENDERBUFFER, rbo1);
            gl.renderbufferStorage(RENDERBUFFER, RGBA8, midSize, midSize);
            gl.renderbufferStorage(RENDERBUFFER, RGBA16F, initialSize, initialSize);
            gl.renderbufferStorage(RENDERBUFFER, RGBA32F, smallSize, smallSize);
            gl.renderbufferStorage(RENDERBUFFER, RGBA8, 256, 256);
        }
    } catch(e) {}

    try {
        gl.bindRenderbuffer(RENDERBUFFER, rbo2);
        gl.renderbufferStorage(RENDERBUFFER, RGBA8, initialSize, initialSize);
        gl.renderbufferStorage(RENDERBUFFER, RGB10_A2, midSize, midSize);
        gl.bindRenderbuffer(RENDERBUFFER, rbo3);
        gl.renderbufferStorage(RENDERBUFFER, R11F_G11F_B10F, initialSize, initialSize);
        gl.renderbufferStorage(RENDERBUFFER, RG16F, smallSize, smallSize);
        gl.renderbufferStorage(RENDERBUFFER, RGBA8, 128, 128);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(FRAMEBUFFER, fbo1);
        gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo1);
    } catch(e) {}

    try {
        for (let i = 0; i < attachmentSwaps; i++) {
            gl.bindFramebuffer(FRAMEBUFFER, fbo1);
            gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo1);
            gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo4);
            gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo7);
            gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, null);
            gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo10);
        }
    } catch(e) {}

    try {
        gl.bindRenderbuffer(RENDERBUFFER, rbo4);
        const width = gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_WIDTH);
        const height = gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_HEIGHT);
        const format = gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_INTERNAL_FORMAT);
        gl.bindRenderbuffer(RENDERBUFFER, rbo7);
        gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_WIDTH);
        gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_HEIGHT);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(RENDERBUFFER, rbo5);
        gl.renderbufferStorage(RENDERBUFFER, RGBA8, initialSize, initialSize);
        gl.renderbufferStorage(RENDERBUFFER, RGBA32F, midSize, midSize);
        gl.bindRenderbuffer(RENDERBUFFER, rbo6);
        gl.renderbufferStorage(RENDERBUFFER, R32F, smallSize, smallSize);
        gl.renderbufferStorage(RENDERBUFFER, RGB10_A2, initialSize, initialSize);
    } catch(e) {}

    try {
        gl.bindFramebuffer(FRAMEBUFFER, fbo2);
        gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo8);
        gl.clearColor(0.1, 0.2, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.framebufferRenderbuffer(FRAMEBUFFER, COLOR_ATTACHMENT0, RENDERBUFFER, rbo11);
        gl.clearColor(0.4, 0.5, 0.6, 0.8);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(RENDERBUFFER, rbo9);
        gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_INTERNAL_FORMAT);
        gl.bindRenderbuffer(RENDERBUFFER, rbo12);
        gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_WIDTH);
        gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_HEIGHT);
        gl.bindRenderbuffer(RENDERBUFFER, rbo1);
        gl.getRenderbufferParameter(RENDERBUFFER, RENDERBUFFER_INTERNAL_FORMAT);
    } catch(e) {}

    try {
        gl.bindFramebuffer(FRAMEBUFFER, null);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

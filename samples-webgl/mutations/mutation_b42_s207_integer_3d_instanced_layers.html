<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 1024;
const texSize = 128;
const sliceCount = 128;
const clearValue = 8192;
const divisor = 4;

const texture3DTarget = 32879;
const formatR32I = 36828;
const samplerType = 36297;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let tex3D, texOutput;
    try {
        tex3D = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_3D, tex3D);
        gl.texStorage3D(gl.TEXTURE_3D, 1, gl.R32I, texSize, texSize, sliceCount);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    try {
        texOutput = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texOutput);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32I, 256, 256);
    } catch(e) {}

    let fbo1, fbo2;
    try {
        fbo1 = gl.createFramebuffer();
        fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texOutput, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([clearValue, clearValue, clearValue, clearValue]));
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
    } catch(e) {}

    try {
        for (let layer = 0; layer < sliceCount; layer++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex3D, 0, layer);
            gl.clearBufferiv(gl.COLOR, 0, new Int32Array([layer * 64]));
        }
    } catch(e) {}

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in int instanceLayer;
            flat out int vLayer;
            void main() {
                vLayer = instanceLayer;
                float offset = float(gl_InstanceID) / ${instanceCount}.0;
                vec3 pos = position * 0.008;
                pos.x += (offset * 2.0 - 1.0);
                pos.y += cos(offset * 6.28318) * 0.3;
                gl_Position = vec4(pos, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            precision highp isampler3D;
            uniform isampler3D texSampler;
            flat in int vLayer;
            out ivec4 fragColor;
            void main() {
                float depth = float(vLayer) / ${sliceCount}.0;
                vec3 coord = vec3(gl_FragCoord.xy / vec2(${texSize}.0), depth);
                ivec4 texValue = texture(texSampler, coord);
                fragColor = ivec4(texValue.r, vLayer, texValue.r >> 4, 32767);
            }
        `);
        gl.compileShader(fs);

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const samplerLoc = gl.getUniformLocation(program, 'texSampler');
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_3D, tex3D);
        gl.uniform1i(samplerLoc, 0);
    } catch(e) {}

    let vao, posBuffer, layerBuffer;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const vertices = new Float32Array([
            -1, -1, 0,
            1, -1, 0,
            0, 1, 0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        layerBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, layerBuffer);
        const layers = new Int32Array(instanceCount);
        for (let i = 0; i < instanceCount; i++) {
            layers[i] = (i % sliceCount);
        }
        gl.bufferData(gl.ARRAY_BUFFER, layers, gl.STATIC_DRAW);
        const layerLoc = gl.getAttribLocation(program, 'instanceLayer');
        gl.enableVertexAttribArray(layerLoc);
        gl.vertexAttribIPointer(layerLoc, 1, gl.INT, 0, 0);
        gl.vertexAttribDivisor(layerLoc, 1);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, 256, 256);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, instanceCount);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 512);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 256);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 128);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([999, 888, 777, 666]));
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 64);
    } catch(e) {}

    try {
        gl.deleteTexture(tex3D);
        gl.deleteTexture(texOutput);
        gl.deleteFramebuffer(fbo1);
        gl.deleteFramebuffer(fbo2);
        gl.deleteBuffer(posBuffer);
        gl.deleteBuffer(layerBuffer);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 2048;
const layerCount = 128;
const texSize = 256;
const clearValue = 16383;
const queryCount = 4;

const texArrayTarget = 35866;
const formatRGBA32I = 36227;
const queryTarget = 35887;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let texArray1, texArray2;
    try {
        texArray1 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray1);
        gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA32I, texSize, texSize, layerCount);
        gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    try {
        texArray2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray2);
        gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA32I, 256, 256, layerCount);
        gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    let fbo;
    try {
        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    } catch(e) {}

    try {
        for (let layer = 0; layer < layerCount; layer++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray1, 0, layer);
            gl.clearBufferiv(gl.COLOR, 0, new Int32Array([layer * 256, clearValue, layer * 128, 32767]));
        }
    } catch(e) {}

    try {
        for (let layer = 0; layer < 64; layer++) {
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray2, 0, layer);
            gl.clearBufferiv(gl.COLOR, 0, new Int32Array([clearValue, layer * 512, layer * 64, 16384]));
        }
    } catch(e) {}

    let query1, query2, query3, query4;
    try {
        query1 = gl.createQuery();
        query2 = gl.createQuery();
        query3 = gl.createQuery();
        query4 = gl.createQuery();
    } catch(e) {}

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in ivec2 instanceData;
            flat out int vLayer;
            flat out ivec4 vData;
            void main() {
                vLayer = gl_InstanceID % ${layerCount};
                vData = ivec4(instanceData.x, instanceData.y, vLayer, gl_InstanceID);
                float offset = float(gl_InstanceID) / ${instanceCount}.0;
                vec3 pos = position * 0.004;
                pos.x += (offset * 2.0 - 1.0);
                pos.y += sin(offset * 18.84955) * 0.5;
                gl_Position = vec4(pos, 1.0);
                gl_Layer = vLayer;
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            flat in int vLayer;
            flat in ivec4 vData;
            out ivec4 fragColor;
            void main() {
                fragColor = ivec4(vData.x, vData.y, vData.z, vData.w & 32767);
            }
        `);
        gl.compileShader(fs);

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    let vao, posBuffer, dataBuffer;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const vertices = new Float32Array([
            -1, -1, 0,
            1, -1, 0,
            -1, 1, 0,
            1, 1, 0,
            0, -1, 0,
            0, 1, 0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        dataBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, dataBuffer);
        const data = new Int32Array(instanceCount * 2);
        for (let i = 0; i < instanceCount; i++) {
            data[i * 2 + 0] = (i % 256) * 64;
            data[i * 2 + 1] = ((i * 11) % 256) * 64;
        }
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        const dataLoc = gl.getAttribLocation(program, 'instanceData');
        gl.enableVertexAttribArray(dataLoc);
        gl.vertexAttribIPointer(dataLoc, 2, gl.INT, 0, 0);
        gl.vertexAttribDivisor(dataLoc, 1);
    } catch(e) {}

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray1, 0, 0);
        gl.viewport(0, 0, texSize, texSize);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, query1);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, instanceCount);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    try {
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray2, 0, 0);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE, query2);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 1024);
        gl.endQuery(gl.ANY_SAMPLES_PASSED_CONSERVATIVE);
    } catch(e) {}

    try {
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray1, 0, 64);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, query3);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 512);
        gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.15, 0.15, 0.15, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.beginQuery(gl.ANY_SAMPLES_PASSED, query4);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 128);
        gl.endQuery(gl.ANY_SAMPLES_PASSED);
    } catch(e) {}

    try {
        for (let i = 0; i < 512; i++) {
            const available1 = gl.getQueryParameter(query1, gl.QUERY_RESULT_AVAILABLE);
            const available2 = gl.getQueryParameter(query2, gl.QUERY_RESULT_AVAILABLE);
            const available3 = gl.getQueryParameter(query3, gl.QUERY_RESULT_AVAILABLE);
            const available4 = gl.getQueryParameter(query4, gl.QUERY_RESULT_AVAILABLE);
            if (available1 && available2 && available3) {
                const result1 = gl.getQueryParameter(query1, gl.QUERY_RESULT);
                const result2 = gl.getQueryParameter(query2, gl.QUERY_RESULT);
                break;
            }
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray1, 0, 127);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([111, 222, 333, 444]));
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 64);
    } catch(e) {}

    try {
        gl.deleteQuery(query1);
        gl.deleteQuery(query2);
        gl.deleteQuery(query3);
        gl.deleteQuery(query4);
        gl.deleteTexture(texArray1);
        gl.deleteTexture(texArray2);
        gl.deleteFramebuffer(fbo);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

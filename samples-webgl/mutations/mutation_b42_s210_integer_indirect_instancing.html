<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const instanceCount = 2048;
const texSize = 256;
const tfBufferSize = 16384;
const clearValue = 21845;
const divisor = 8;

const textureTarget = 35678;
const formatR32UI = 36208;
const formatRG32I = 36227;
const tfTarget = 35982;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let inputTex1, inputTex2, outputTex1, outputTex2;
    try {
        inputTex1 = gl.createTexture();
        inputTex2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, inputTex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R32UI, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindTexture(gl.TEXTURE_2D, inputTex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RG32I, 256, 256);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    try {
        const data1 = new Uint32Array(texSize * texSize);
        const data2 = new Int32Array(texSize * texSize * 2);
        for (let i = 0; i < texSize * texSize; i++) {
            data1[i] = (i % 65536) * 1024;
            data2[i * 2 + 0] = ((i % 256) - 128) * 256;
            data2[i * 2 + 1] = ((i % 512) - 256) * 128;
        }
        gl.bindTexture(gl.TEXTURE_2D, inputTex1);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, texSize, texSize, gl.RED_INTEGER, gl.UNSIGNED_INT, data1);
        gl.bindTexture(gl.TEXTURE_2D, inputTex2);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 256, 256, gl.RG_INTEGER, gl.INT, data2);
    } catch(e) {}

    try {
        outputTex1 = gl.createTexture();
        outputTex2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, outputTex1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32I, texSize, texSize);
        gl.bindTexture(gl.TEXTURE_2D, outputTex2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32UI, 256, 256);
    } catch(e) {}

    let fbo1, fbo2;
    try {
        fbo1 = gl.createFramebuffer();
        fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outputTex1, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outputTex2, 0);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([clearValue, -clearValue, clearValue, -clearValue]));
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.clearBufferuiv(gl.COLOR, 0, new Uint32Array([clearValue * 2, clearValue, clearValue / 2, clearValue / 4]));
    } catch(e) {}

    let tfBuffer;
    try {
        tfBuffer = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, tfBufferSize, gl.DYNAMIC_COPY);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer);
    } catch(e) {}

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            in ivec2 instanceData;
            uniform highp usampler2D texInput1;
            uniform highp isampler2D texInput2;
            flat out ivec4 vData;
            out ivec4 tfOutput;
            void main() {
                int instID = gl_InstanceID;
                ivec2 texCoord1 = ivec2(instID % ${texSize}, instID / ${texSize});
                ivec2 texCoord2 = ivec2((instID * 7) % 256, (instID * 11) % 256);

                uvec4 texVal1 = texelFetch(texInput1, texCoord1, 0);
                ivec4 texVal2 = texelFetch(texInput2, texCoord2, 0);

                int r = int(texVal1.r >> 10u) + texVal2.r;
                int g = texVal2.g;
                int b = instanceData.x;
                int a = instanceData.y;

                vData = ivec4(r, g, b, a);
                tfOutput = ivec4(r, g, b, a);

                float offset = float(instID) / ${instanceCount}.0;
                vec3 pos = position * 0.006;
                pos.x += (offset * 2.0 - 1.0);
                pos.y += sin(offset * 25.13274) * 0.6;
                gl_Position = vec4(pos, 1.0);
            }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            flat in ivec4 vData;
            out ivec4 fragColor;
            void main() {
                fragColor = vData;
            }
        `);
        gl.compileShader(fs);

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['tfOutput'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const samplerLoc1 = gl.getUniformLocation(program, 'texInput1');
        const samplerLoc2 = gl.getUniformLocation(program, 'texInput2');
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, inputTex1);
        gl.uniform1i(samplerLoc1, 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, inputTex2);
        gl.uniform1i(samplerLoc2, 1);
    } catch(e) {}

    let vao, posBuffer, dataBuffer;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        const vertices = new Float32Array([
            -1, -1, 0,
            1, -1, 0,
            -1, 1, 0,
            1, 1, 0,
            0, -1, 0,
            0, 1, 0
        ]);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        dataBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, dataBuffer);
        const data = new Int32Array(instanceCount * 2);
        for (let i = 0; i < instanceCount; i++) {
            data[i * 2 + 0] = ((i % 256) - 128) * 128;
            data[i * 2 + 1] = ((i % 512) - 256) * 64;
        }
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        const dataLoc = gl.getAttribLocation(program, 'instanceData');
        gl.enableVertexAttribArray(dataLoc);
        gl.vertexAttribIPointer(dataLoc, 2, gl.INT, 0, 0);
        gl.vertexAttribDivisor(dataLoc, 1);
    } catch(e) {}

    try {
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, texSize, texSize);
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, instanceCount);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.viewport(0, 0, 256, 256);
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 1024);
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 512);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 256);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.12, 0.12, 0.12, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 128);
    } catch(e) {}

    try {
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        const tfData = new Int32Array(1024);
        gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfData);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearBufferiv(gl.COLOR, 0, new Int32Array([111, 222, 333, 444]));
        gl.drawArraysInstanced(gl.TRIANGLES, 0, 3, 64);
    } catch(e) {}

    try {
        gl.deleteTexture(inputTex1);
        gl.deleteTexture(inputTex2);
        gl.deleteTexture(outputTex1);
        gl.deleteTexture(outputTex2);
        gl.deleteFramebuffer(fbo1);
        gl.deleteFramebuffer(fbo2);
        gl.deleteBuffer(tfBuffer);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

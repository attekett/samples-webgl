<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    const numRBOs = 16;
    const numFBOs = 8;
    const rboSize = 256;

    const vertexShaderSource = `#version 300 es
    in vec4 a_position;
    void main() {
        gl_Position = a_position;
    }`;

    const fragmentShaderSource = `#version 300 es
    precision highp float;
    uniform vec4 u_color;
    out vec4 fragColor;
    void main() {
        fragColor = u_color;
    }`;

    let program;
    try {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vertexShaderSource);
        gl.compileShader(vertexShader);
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, fragmentShaderSource);
        gl.compileShader(fragmentShader);
        program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    const colorLoc = gl.getUniformLocation(program, 'u_color');

    const allFormats = [
        gl.RGBA8,
        gl.RGBA4,
        gl.RGB565,
        gl.RGB5_A1,
        gl.RGBA16F,
        gl.RGBA32F,
        gl.RGB16F,
        gl.RGB32F,
        gl.R11F_G11F_B10F,
        gl.RGB10_A2,
        gl.RGB10_A2UI,
        gl.RGBA8UI,
        gl.RGBA8I,
        gl.DEPTH_COMPONENT32F,
        gl.DEPTH24_STENCIL8,
        gl.STENCIL_INDEX8
    ];

    const msaaSamples = [2, 4, 8, 16];
    const renderbuffers = [];

    try {
        for (let i = 0; i < numRBOs; i++) {
            const rbo = gl.createRenderbuffer();
            gl.bindRenderbuffer(gl.RENDERBUFFER, rbo);
            const format = allFormats[i % allFormats.length];
            const samples = (i < 4) ? msaaSamples[i] : 0;
            if (samples > 0) {
                gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, format, rboSize, rboSize);
            } else {
                gl.renderbufferStorage(gl.RENDERBUFFER, format, rboSize, rboSize);
            }
            renderbuffers.push({
                obj: rbo,
                format: format,
                samples: samples
            });
        }
    } catch(e) {}

    const vertices = new Float32Array([
        -0.9, -0.9, 0, 1,
         0.9, -0.9, 0, 1,
         0.9,  0.9, 0, 1,
        -0.9, -0.9, 0, 1,
         0.9,  0.9, 0, 1,
        -0.9,  0.9, 0, 1
    ]);

    let vbo, vao;
    try {
        vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(positionLoc);
        gl.vertexAttribPointer(positionLoc, 4, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    const fbos = [];
    try {
        for (let i = 0; i < numFBOs; i++) {
            const fbo = gl.createFramebuffer();
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            fbos.push(fbo);
        }
    } catch(e) {}

    try {
        for (let cycle = 0; cycle < 4; cycle++) {
            for (let f = 0; f < numFBOs; f++) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[f]);
                const rboIdx = (f + cycle * numFBOs) % numRBOs;
                const rbo = renderbuffers[rboIdx];
                const isDepthStencil = rbo.format === gl.DEPTH24_STENCIL8 ||
                                       rbo.format === gl.DEPTH_COMPONENT32F ||
                                       rbo.format === gl.STENCIL_INDEX8;
                if (isDepthStencil) {
                    if (rbo.format === gl.STENCIL_INDEX8) {
                        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.STENCIL_ATTACHMENT, gl.RENDERBUFFER, rbo.obj);
                    } else if (rbo.format === gl.DEPTH24_STENCIL8) {
                        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, rbo.obj);
                    } else {
                        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rbo.obj);
                    }
                    const helperRbo = gl.createRenderbuffer();
                    gl.bindRenderbuffer(gl.RENDERBUFFER, helperRbo);
                    gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, rboSize, rboSize);
                    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, helperRbo);
                } else {
                    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rbo.obj);
                }
            }
        }
    } catch(e) {}

    try {
        for (let f = 0; f < numFBOs; f++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[f]);
            gl.viewport(0, 0, rboSize, rboSize);
            const r = f / numFBOs;
            const g = (f * 2) / numFBOs;
            const b = (f * 3) / numFBOs;
            gl.clearColor(r, g, b, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
            gl.uniform4f(colorLoc, r, g, b, 1.0);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
        }
    } catch(e) {}

    try {
        for (let i = 0; i < renderbuffers.length; i++) {
            gl.bindRenderbuffer(gl.RENDERBUFFER, renderbuffers[i].obj);
            const width = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_WIDTH);
            const height = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_HEIGHT);
            const internalFormat = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_INTERNAL_FORMAT);
            const samples = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_SAMPLES);
            const redSize = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_RED_SIZE);
            const greenSize = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_GREEN_SIZE);
            const blueSize = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_BLUE_SIZE);
            const alphaSize = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_ALPHA_SIZE);
            const depthSize = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_DEPTH_SIZE);
            const stencilSize = gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_STENCIL_SIZE);
        }
    } catch(e) {}

    try {
        for (let i = 0; i < 4; i++) {
            gl.bindRenderbuffer(gl.RENDERBUFFER, renderbuffers[i].obj);
            gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, 512, 512);
            gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA16F, 256, 256);
            gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGB10_A2, 128, 128);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.4, 0.5, 0.6, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.uniform4f(colorLoc, 0.6, 0.7, 0.8, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(gl.RENDERBUFFER, null);
        gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_WIDTH);
    } catch(e) {}

    try {
        const deletedRbo = renderbuffers[0].obj;
        gl.deleteRenderbuffer(deletedRbo);
        gl.bindRenderbuffer(gl.RENDERBUFFER, deletedRbo);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, 256, 256);
    } catch(e) {}

    try {
        gl.renderbufferStorageMultisample(gl.RENDERBUFFER, 999, gl.RGBA8, 256, 256);
    } catch(e) {}

    try {
        for (let i = 0; i < renderbuffers.length; i++) {
            gl.deleteRenderbuffer(renderbuffers[i].obj);
        }
        for (let i = 0; i < fbos.length; i++) {
            gl.deleteFramebuffer(fbos[i]);
        }
        gl.deleteBuffer(vbo);
        gl.deleteVertexArray(vao);
        gl.deleteProgram(program);
    } catch(e) {}

    try {
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, null);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const rboCount = 12;
const texSize = 256;
const bufSize = texSize * texSize * 4;
const fboCount = 6;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const rbTarget = gl.RENDERBUFFER;
    const fboTarget = gl.FRAMEBUFFER;

    try {
        const depthRbo1 = gl.createRenderbuffer();
        const depthRbo2 = gl.createRenderbuffer();
        const depthRbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, depthRbo1);
        gl.bindRenderbuffer(rbTarget, depthRbo2);
        gl.bindRenderbuffer(rbTarget, depthRbo1);
        gl.renderbufferStorage(rbTarget, gl.DEPTH_COMPONENT32F, texSize, texSize);
        gl.renderbufferStorage(rbTarget, gl.DEPTH_COMPONENT24, 512, 512);
        gl.renderbufferStorage(rbTarget, gl.DEPTH_COMPONENT16, 128, 128);
    } catch(e) {}

    try {
        const stencilRbo1 = gl.createRenderbuffer();
        const stencilRbo2 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, stencilRbo1);
        gl.renderbufferStorage(rbTarget, gl.STENCIL_INDEX8, texSize, texSize);
        gl.bindRenderbuffer(rbTarget, stencilRbo2);
        gl.renderbufferStorage(rbTarget, gl.STENCIL_INDEX8, 512, 512);
        gl.bindRenderbuffer(rbTarget, stencilRbo1);
        gl.renderbufferStorage(rbTarget, gl.STENCIL_INDEX8, 256, 256);
    } catch(e) {}

    try {
        const dsRbo1 = gl.createRenderbuffer();
        const dsRbo2 = gl.createRenderbuffer();
        const dsRbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, dsRbo1);
        gl.renderbufferStorage(rbTarget, gl.DEPTH24_STENCIL8, texSize, texSize);
        gl.bindRenderbuffer(rbTarget, dsRbo2);
        gl.renderbufferStorage(rbTarget, gl.DEPTH32F_STENCIL8, 512, 512);
        gl.bindRenderbuffer(rbTarget, dsRbo3);
        gl.renderbufferStorage(rbTarget, gl.DEPTH24_STENCIL8, 256, 256);
        gl.bindRenderbuffer(rbTarget, dsRbo1);
    } catch(e) {}

    try {
        const colorRbo1 = gl.createRenderbuffer();
        const colorRbo2 = gl.createRenderbuffer();
        const colorRbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, colorRbo1);
        gl.renderbufferStorage(rbTarget, gl.RGBA8, texSize, texSize);
        gl.bindRenderbuffer(rbTarget, colorRbo2);
        gl.renderbufferStorage(rbTarget, gl.RGBA16F, 512, 512);
        gl.bindRenderbuffer(rbTarget, colorRbo3);
        gl.renderbufferStorage(rbTarget, gl.RGB10_A2, 256, 256);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, colorRbo1);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_ATTACHMENT, rbTarget, depthRbo1);
        gl.bindFramebuffer(fboTarget, fbo2);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, colorRbo2);
        gl.framebufferRenderbuffer(fboTarget, gl.STENCIL_ATTACHMENT, rbTarget, stencilRbo1);
        gl.bindFramebuffer(fboTarget, fbo3);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, colorRbo3);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, rbTarget, dsRbo1);
        gl.bindFramebuffer(fboTarget, fbo1);
    } catch(e) {}

    try {
        const fbo4 = gl.createFramebuffer();
        const fbo5 = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo4);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, colorRbo1);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, rbTarget, dsRbo2);
        gl.bindFramebuffer(fboTarget, fbo5);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, colorRbo2);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, rbTarget, dsRbo3);
        gl.bindFramebuffer(fboTarget, fbo4);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.clearDepth(1.0);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LESS);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo3);
        gl.enable(gl.STENCIL_TEST);
        gl.stencilFunc(gl.ALWAYS, 1, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
        gl.clearStencil(0);
        gl.clear(gl.STENCIL_BUFFER_BIT);
        gl.disable(gl.STENCIL_TEST);
        gl.enable(gl.STENCIL_TEST);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbo2);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, 512, 512, gl.COLOR_BUFFER_BIT, gl.NEAREST);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbo3);
        gl.blitFramebuffer(0, 0, 512, 512, 0, 0, 256, 256, gl.COLOR_BUFFER_BIT, gl.LINEAR);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo3);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbo1);
        gl.blitFramebuffer(0, 0, 256, 256, 0, 0, texSize, texSize, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo4);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbo5);
        gl.blitFramebuffer(0, 0, texSize, texSize, 0, 0, 512, 512, gl.DEPTH_BUFFER_BIT, gl.NEAREST);
        gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo5);
        gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbo4);
        gl.blitFramebuffer(0, 0, 512, 512, 0, 0, 256, 256, gl.STENCIL_BUFFER_BIT, gl.NEAREST);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.clearColor(0.3, 0.5, 0.7, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.bindFramebuffer(fboTarget, fbo3);
        gl.clearColor(0.9, 0.2, 0.4, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, null);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.6, 0.4, 0.8, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(rbTarget, depthRbo1);
        gl.deleteRenderbuffer(depthRbo1);
        gl.bindRenderbuffer(rbTarget, depthRbo1);
        gl.bindRenderbuffer(rbTarget, dsRbo1);
        gl.deleteRenderbuffer(dsRbo1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

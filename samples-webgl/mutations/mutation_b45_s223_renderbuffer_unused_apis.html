<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const rboCount = 8;
const texSize = 256;
const bufSize = texSize * texSize * 4;
const fboCount = 4;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const rbTarget = gl.RENDERBUFFER;
    const fboTarget = gl.FRAMEBUFFER;

    try {
        const rbo1 = gl.createRenderbuffer();
        const rbo2 = gl.createRenderbuffer();
        const rbo3 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rbo1);
        gl.bindRenderbuffer(rbTarget, rbo2);
        gl.bindRenderbuffer(rbTarget, rbo1);
        gl.renderbufferStorage(rbTarget, gl.RGBA8, texSize, texSize);
        const width1 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_WIDTH);
        const height1 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_HEIGHT);
        const format1 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_INTERNAL_FORMAT);
    } catch(e) {}

    try {
        const rbo4 = gl.createRenderbuffer();
        const rbo5 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rbo4);
        gl.renderbufferStorage(rbTarget, gl.RGBA16F, 512, 512);
        const width2 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_WIDTH);
        const height2 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_HEIGHT);
        const redSize = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_RED_SIZE);
        const greenSize = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_GREEN_SIZE);
        const blueSize = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_BLUE_SIZE);
        const alphaSize = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_ALPHA_SIZE);
    } catch(e) {}

    try {
        const rbo6 = gl.createRenderbuffer();
        const rbo7 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rbo6);
        gl.renderbufferStorage(rbTarget, gl.DEPTH24_STENCIL8, texSize, texSize);
        const depthSize = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_DEPTH_SIZE);
        const stencilSize = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_STENCIL_SIZE);
        const format3 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_INTERNAL_FORMAT);
        gl.bindRenderbuffer(rbTarget, rbo7);
        gl.renderbufferStorage(rbTarget, gl.DEPTH_COMPONENT32F, 512, 512);
        const depthSize2 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_DEPTH_SIZE);
    } catch(e) {}

    try {
        const rbo8 = gl.createRenderbuffer();
        gl.bindRenderbuffer(rbTarget, rbo8);
        gl.renderbufferStorage(rbTarget, gl.RGB10_A2, 256, 256);
        const width3 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_WIDTH);
        const height3 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_HEIGHT);
        const redSize2 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_RED_SIZE);
        const greenSize2 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_GREEN_SIZE);
        const blueSize2 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_BLUE_SIZE);
        const alphaSize2 = gl.getRenderbufferParameter(rbTarget, gl.RENDERBUFFER_ALPHA_SIZE);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rbo1);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_STENCIL_ATTACHMENT, rbTarget, rbo6);
        gl.bindFramebuffer(fboTarget, fbo2);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rbo4);
        gl.framebufferRenderbuffer(fboTarget, gl.DEPTH_ATTACHMENT, rbTarget, rbo7);
        gl.bindFramebuffer(fboTarget, fbo1);
    } catch(e) {}

    try {
        const fbo3 = gl.createFramebuffer();
        const fbo4 = gl.createFramebuffer();
        gl.bindFramebuffer(fboTarget, fbo3);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rbo8);
        gl.bindFramebuffer(fboTarget, fbo4);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rbo1);
        gl.bindFramebuffer(fboTarget, fbo3);
        gl.framebufferRenderbuffer(fboTarget, gl.COLOR_ATTACHMENT0, rbTarget, rbo4);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.clearColor(0.2, 0.4, 0.6, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
        gl.invalidateFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0]);
        gl.bindFramebuffer(fboTarget, fbo2);
        gl.clearColor(0.8, 0.3, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.invalidateFramebuffer(fboTarget, [gl.DEPTH_ATTACHMENT]);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo3);
        gl.clearColor(0.1, 0.9, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.invalidateFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0]);
        gl.bindFramebuffer(fboTarget, fbo4);
        gl.invalidateFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0]);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.clearColor(0.5, 0.7, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.invalidateSubFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0], 0, 0, 128, 128);
        gl.bindFramebuffer(fboTarget, fbo2);
        gl.clearColor(0.6, 0.2, 0.9, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.invalidateSubFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0], 64, 64, 256, 256);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo3);
        gl.clearColor(0.4, 0.8, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.invalidateSubFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0], 0, 0, 512, 512);
        gl.bindFramebuffer(fboTarget, fbo4);
        gl.invalidateSubFramebuffer(fboTarget, [gl.COLOR_ATTACHMENT0], 128, 128, 128, 128);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.invalidateFramebuffer(fboTarget, [gl.DEPTH_STENCIL_ATTACHMENT]);
        gl.bindFramebuffer(fboTarget, fbo2);
        gl.invalidateFramebuffer(fboTarget, [gl.DEPTH_ATTACHMENT]);
        gl.bindFramebuffer(fboTarget, fbo1);
        gl.invalidateSubFramebuffer(fboTarget, [gl.DEPTH_STENCIL_ATTACHMENT], 32, 32, 192, 192);
    } catch(e) {}

    try {
        gl.bindFramebuffer(fboTarget, null);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.5, 0.5, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.bindRenderbuffer(rbTarget, rbo1);
        gl.deleteRenderbuffer(rbo1);
        gl.bindRenderbuffer(rbTarget, rbo1);
        gl.bindRenderbuffer(rbTarget, rbo6);
        gl.deleteRenderbuffer(rbo6);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const texSize = 256;
const bufSize = texSize * texSize * 4;
const vertexCount = 6;
const uniformCount = 4;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const textureTarget = gl.TEXTURE_2D;

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufSize, bufferUsage);
        const bufUsage = gl.getBufferParameter(bufferTarget, gl.BUFFER_USAGE);
        const bufSize1 = gl.getBufferParameter(bufferTarget, gl.BUFFER_SIZE);
    } catch(e) {}

    try {
        const buffer4 = gl.createBuffer();
        const buffer5 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer4);
        gl.bufferData(bufferTarget, 2048, gl.DYNAMIC_DRAW);
        const bufUsage2 = gl.getBufferParameter(bufferTarget, gl.BUFFER_USAGE);
        const bufSize2 = gl.getBufferParameter(bufferTarget, gl.BUFFER_SIZE);
        gl.bindBuffer(bufferTarget, buffer5);
        gl.bufferData(bufferTarget, 4096, gl.STREAM_DRAW);
        const bufUsage3 = gl.getBufferParameter(bufferTarget, gl.BUFFER_USAGE);
        const bufSize3 = gl.getBufferParameter(bufferTarget, gl.BUFFER_SIZE);
    } catch(e) {}

    try {
        const texture1 = gl.createTexture();
        const texture2 = gl.createTexture();
        const texture3 = gl.createTexture();
        gl.bindTexture(textureTarget, texture1);
        gl.bindTexture(textureTarget, texture2);
        gl.bindTexture(textureTarget, texture1);
        gl.texImage2D(textureTarget, 0, gl.RGBA, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameterf(textureTarget, gl.TEXTURE_MIN_LOD, 0.0);
        gl.texParameterf(textureTarget, gl.TEXTURE_MAX_LOD, 4.0);
        gl.texParameterf(textureTarget, gl.TEXTURE_BASE_LEVEL, 0.0);
        gl.texParameterf(textureTarget, gl.TEXTURE_MAX_LEVEL, 4.0);
    } catch(e) {}

    try {
        const texture4 = gl.createTexture();
        const texture5 = gl.createTexture();
        gl.bindTexture(textureTarget, texture4);
        gl.texImage2D(textureTarget, 0, gl.RGBA8, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameterf(textureTarget, gl.TEXTURE_MIN_LOD, -1000.0);
        gl.texParameterf(textureTarget, gl.TEXTURE_MAX_LOD, 1000.0);
        gl.bindTexture(textureTarget, texture5);
        gl.texImage2D(textureTarget, 0, gl.RGBA16F, 256, 256, 0, gl.RGBA, gl.HALF_FLOAT, null);
        gl.texParameterf(textureTarget, gl.TEXTURE_BASE_LEVEL, 0.0);
        gl.texParameterf(textureTarget, gl.TEXTURE_MAX_LEVEL, 8.0);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const texture6 = gl.createTexture();
        const texture7 = gl.createTexture();
        gl.bindTexture(textureTarget, texture6);
        gl.texImage2D(textureTarget, 0, gl.RGBA, 512, 512, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, textureTarget, texture6, 0);
        gl.clearColor(0.2, 0.4, 0.6, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindTexture(textureTarget, texture7);
        gl.copyTexImage2D(textureTarget, 0, gl.RGBA, 0, 0, 256, 256, 0);
    } catch(e) {}

    try {
        const fbo3 = gl.createFramebuffer();
        const texture8 = gl.createTexture();
        const texture9 = gl.createTexture();
        gl.bindTexture(textureTarget, texture8);
        gl.texImage2D(textureTarget, 0, gl.RGB, 256, 256, 0, gl.RGB, gl.UNSIGNED_BYTE, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, textureTarget, texture8, 0);
        gl.clearColor(0.8, 0.3, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindTexture(textureTarget, texture9);
        gl.copyTexImage2D(textureTarget, 0, gl.RGB, 0, 0, 512, 512, 0);
    } catch(e) {}

    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            uniform mat4 uMatrix;
            void main() { gl_Position = uMatrix * vec4(position, 1.0); }
        `);
        gl.compileShader(vs);

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            uniform vec4 uColor;
            void main() { fragColor = uColor; }
        `);
        gl.compileShader(fs);

        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const vs2 = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs2, `#version 300 es
            layout(std140) uniform Block {
                vec4 color1;
                vec4 color2;
                mat4 matrix;
            };
            in vec3 position;
            void main() { gl_Position = matrix * vec4(position, 1.0); }
        `);
        gl.compileShader(vs2);

        const fs2 = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs2, `#version 300 es
            precision highp float;
            layout(std140) uniform Block {
                vec4 color1;
                vec4 color2;
                mat4 matrix;
            };
            out vec4 fragColor;
            void main() { fragColor = color1 + color2; }
        `);
        gl.compileShader(fs2);

        const program2 = gl.createProgram();
        gl.attachShader(program2, vs2);
        gl.attachShader(program2, fs2);
        gl.linkProgram(program2);
        gl.useProgram(program2);

        const blockIndex = gl.getUniformBlockIndex(program2, 'Block');
        const blockSize = gl.getActiveUniformBlockParameter(program2, blockIndex, gl.UNIFORM_BLOCK_DATA_SIZE);
        const blockBinding = gl.getActiveUniformBlockParameter(program2, blockIndex, gl.UNIFORM_BLOCK_BINDING);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.viewport(0, 0, 512, 512);
        gl.clearColor(0.5, 0.7, 0.3, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.6, 0.2, 0.9, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.5, 0.5, 0.5, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindTexture(textureTarget, texture1);
        gl.deleteTexture(texture1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    const numLayers = 256;
    const texSize = 128;
    const instanceCount = 1024;
    const vertexCount = 6;
    const numQueries = 64;
    const tfBufferSize = instanceCount * 5 * 4;
    const layerBatchSize = 4;

    const bufferTarget = gl.ARRAY_BUFFER;
    const tfTarget = gl.TRANSFORM_FEEDBACK_BUFFER;
    const texTarget = gl.TEXTURE_2D_ARRAY;

    const vertexShaderSource = `#version 300 es
    in vec4 a_position;
    out float v_layer;
    out vec4 v_position;
    out vec3 v_data;
    void main() {
        float layer = float(gl_InstanceID % 256);
        gl_Position = a_position + vec4(0.0, 0.0, float(gl_InstanceID) * 0.0001, 0.0);
        v_layer = layer;
        v_position = a_position;
        v_data = vec3(layer, float(gl_InstanceID), a_position.x);
    }`;

    const fragmentShaderSource = `#version 300 es
    precision highp float;
    precision highp sampler2DArray;
    in float v_layer;
    in vec3 v_data;
    uniform sampler2DArray u_texArray;
    out vec4 fragColor;
    void main() {
        float layer = mod(v_layer, 256.0);
        vec3 texCoord = vec3(gl_FragCoord.xy / 128.0, layer);
        vec4 texel = texture(u_texArray, texCoord);
        fragColor = texel * 0.7 + vec4(v_data / 256.0, 1.0) * 0.3;
    }`;

    let program;
    try {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vertexShaderSource);
        gl.compileShader(vertexShader);
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, fragmentShaderSource);
        gl.compileShader(fragmentShader);
        program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.transformFeedbackVaryings(program, ['v_layer', 'v_position', 'v_data'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    const positionLoc = gl.getAttribLocation(program, 'a_position');

    const vertices = new Float32Array([
        -0.9, -0.9, 0, 1,
         0.9, -0.9, 0, 1,
         0.9,  0.9, 0, 1,
        -0.9, -0.9, 0, 1,
         0.9,  0.9, 0, 1,
        -0.9,  0.9, 0, 1
    ]);

    let vbo, vao;
    try {
        vbo = gl.createBuffer();
        gl.bindBuffer(bufferTarget, vbo);
        gl.bufferData(bufferTarget, vertices, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(bufferTarget, vbo);
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(bufferTarget, vbo);
        gl.enableVertexAttribArray(positionLoc);
        gl.vertexAttribPointer(positionLoc, 4, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    let texArray;
    try {
        texArray = gl.createTexture();
        gl.bindTexture(texTarget, texArray);
        gl.texStorage3D(texTarget, 1, gl.RGBA8, texSize, texSize, numLayers);
        gl.texParameteri(texTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(texTarget, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(texTarget, gl.TEXTURE_WRAP_T, gl.REPEAT);
    } catch(e) {}

    try {
        const texData = new Uint8Array(texSize * texSize * 4);
        for (let layer = 0; layer < numLayers; layer++) {
            const r = (layer % 16) * 16;
            const g = ((layer / 16) | 0) * 16;
            const b = ((layer / 64) | 0) * 64;
            for (let i = 0; i < texData.length; i += 4) {
                texData[i] = r;
                texData[i + 1] = g;
                texData[i + 2] = b;
                texData[i + 3] = 255;
            }
            gl.texSubImage3D(texTarget, 0, 0, 0, layer, texSize, texSize, 1, gl.RGBA, gl.UNSIGNED_BYTE, texData);
        }
    } catch(e) {}

    let tfBuffer, tf;
    try {
        tfBuffer = gl.createBuffer();
        gl.bindBuffer(tfTarget, tfBuffer);
        gl.bufferData(tfTarget, tfBufferSize * Float32Array.BYTES_PER_ELEMENT, gl.DYNAMIC_COPY);
        tf = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBufferBase(tfTarget, 0, tfBuffer);
    } catch(e) {}

    const queries = [];
    try {
        for (let i = 0; i < numQueries; i++) {
            queries.push(gl.createQuery());
        }
    } catch(e) {}

    const fbo = gl.createFramebuffer();
    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        for (let batch = 0; batch < 32; batch++) {
            const layer = (batch * layerBatchSize) % numLayers;
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray, 0, layer);
            gl.viewport(0, 0, texSize, texSize);
            gl.clearColor(batch / 32.0, 0.5, 1.0 - batch / 32.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
        }
    } catch(e) {}

    try {
        for (let batch = 0; batch < 16; batch++) {
            const queryIdx = batch % numQueries;
            gl.enable(gl.RASTERIZER_DISCARD);
            gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[queryIdx]);
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, 64);
            gl.endTransformFeedback();
            gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
            gl.disable(gl.RASTERIZER_DISCARD);
        }
    } catch(e) {}

    try {
        for (let batch = 16; batch < 32; batch++) {
            const queryIdx = batch % numQueries;
            gl.enable(gl.RASTERIZER_DISCARD);
            gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[queryIdx]);
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 32);
            gl.endTransformFeedback();
            gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
            gl.disable(gl.RASTERIZER_DISCARD);
        }
    } catch(e) {}

    try {
        for (let layer = 64; layer < 96; layer++) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray, 0, layer);
            gl.viewport(0, 0, 128, 128);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, 4);
        }
    } catch(e) {}

    try {
        for (let layer = 96; layer < 128; layer++) {
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, texArray, 0, layer);
            gl.viewport(0, 0, texSize, texSize);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, 2);
        }
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.15, 0.25, 0.35, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(texTarget, texArray);
        const texLoc = gl.getUniformLocation(program, 'u_texArray');
        gl.uniform1i(texLoc, 0);
        gl.drawArraysInstanced(gl.TRIANGLES, 0, vertexCount, 16);
    } catch(e) {}

    try {
        for (let i = 0; i < queries.length; i++) {
            const available = gl.getQueryParameter(queries[i], gl.QUERY_RESULT_AVAILABLE);
            if (available) {
                const result = gl.getQueryParameter(queries[i], gl.QUERY_RESULT);
            }
        }
    } catch(e) {}

    try {
        gl.bindBuffer(tfTarget, tfBuffer);
        const tfData = new Float32Array(1024);
        gl.getBufferSubData(tfTarget, 0, tfData);
    } catch(e) {}

    try {
        gl.beginTransformFeedback(gl.TRIANGLES);
        gl.beginTransformFeedback(gl.TRIANGLES);
    } catch(e) {}

    try {
        gl.endTransformFeedback();
    } catch(e) {}

    try {
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[0]);
        gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[1]);
    } catch(e) {}

    try {
        for (let i = 0; i < queries.length; i++) {
            gl.deleteQuery(queries[i]);
        }
        gl.deleteTransformFeedback(tf);
        gl.deleteBuffer(tfBuffer);
        gl.deleteFramebuffer(fbo);
        gl.deleteTexture(texArray);
        gl.deleteBuffer(vbo);
        gl.deleteVertexArray(vao);
        gl.deleteProgram(program);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

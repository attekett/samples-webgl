<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

const bufferSize = 4096;
const mapSize = 2048;
const orphanCount = 3;
const vertexCount = 6;
const subDataSize = bufferSize / 2;

const mapAccess = 0x88BA;
const mapFlags = 0x0001;
const bufferTarget = 0x8892;
const bufferUsage = 0x88E4;

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    try {
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 8192, 0x88E0);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, bufferSize, null);
        gl.bufferData(bufferTarget, bufferSize, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, null, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer1);
        const ptr1 = gl.mapBufferRange(bufferTarget, 0, mapSize, mapAccess | mapFlags);
        if (ptr1) {
            const view = new Float32Array(ptr1);
            for (let i = 0; i < 128; i++) {
                view[i] = i * 0.01;
            }
        }
        gl.unmapBuffer(bufferTarget);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer2);
        const ptr2 = gl.mapBufferRange(bufferTarget, 0, 4096, 0x0002);
        gl.unmapBuffer(bufferTarget);
        gl.bindBuffer(bufferTarget, buffer1);
        const ptr3 = gl.mapBufferRange(bufferTarget, 512, mapSize, mapAccess);
        gl.unmapBuffer(bufferTarget);
    } catch(e) {}

    try {
        const vs = gl.createShader(0x8B31);
        gl.shaderSource(vs, `#version 300 es
            in vec3 position;
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `);
        gl.compileShader(vs);
        const fs = gl.createShader(0x8B30);
        gl.shaderSource(fs, `#version 300 es
            precision highp float;
            out vec4 fragColor;
            void main() {
                fragColor = vec4(0.2, 0.6, 0.8, 1.0);
            }
        `);
        gl.compileShader(fs);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const posData = new Float32Array([
            -0.8, -0.8, 0.0,
             0.8, -0.8, 0.0,
             0.0,  0.8, 0.0
        ]);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferSubData(bufferTarget, 0, posData);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferSubData(bufferTarget, 0, posData);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        gl.bindBuffer(bufferTarget, buffer1);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, 0x1406, false, 12, 0);
    } catch(e) {}

    try {
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(0x4000);
        gl.drawArrays(0x0004, 0, 3);
        gl.drawArrays(0x0000, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer1);
        const ptr4 = gl.mapBufferRange(bufferTarget, 0, mapSize, mapAccess);
        gl.unmapBuffer(bufferTarget);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, null, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer2);
        gl.deleteBuffer(buffer1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

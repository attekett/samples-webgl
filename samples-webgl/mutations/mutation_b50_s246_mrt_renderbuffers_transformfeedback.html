<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const mrtCount = 8;
    const texCount = 4;
    const rbCount = 4;
    const texSize = 256;
    const vertexCount = 6;
    const tfStride = 7;

    const vsSource = `#version 300 es
    in vec3 aPosition;
    in vec2 aTexCoord;
    out vec2 vTexCoord;
    out float vTargetIndex;
    out vec4 vFragOutput;
    out float vRenderBufferFlag;
    uniform float uTargetOffset;
    void main() {
        gl_Position = vec4(aPosition, 1.0);
        vTexCoord = aTexCoord;
        float vertID = float(gl_VertexID);
        vTargetIndex = uTargetOffset + mod(vertID, float(${mrtCount}));
        vFragOutput = vec4(aPosition.xy * 0.5 + 0.5, vTargetIndex / float(${mrtCount}), 1.0);
        vRenderBufferFlag = step(float(${texCount}), vTargetIndex);
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    in vec2 vTexCoord;
    in float vTargetIndex;
    in vec4 vFragOutput;
    in float vRenderBufferFlag;
    layout(location = 0) out vec4 fragColor0;
    layout(location = 1) out vec4 fragColor1;
    layout(location = 2) out vec4 fragColor2;
    layout(location = 3) out vec4 fragColor3;
    layout(location = 4) out vec4 fragColor4;
    layout(location = 5) out vec4 fragColor5;
    layout(location = 6) out vec4 fragColor6;
    layout(location = 7) out vec4 fragColor7;
    void main() {
        float targetMod = mod(vTargetIndex, float(${mrtCount}));
        vec4 baseColor = vFragOutput;
        fragColor0 = baseColor * (1.0 - vRenderBufferFlag * 0.2);
        fragColor1 = baseColor * (1.0 - vRenderBufferFlag * 0.3);
        fragColor2 = baseColor * (1.0 - vRenderBufferFlag * 0.4);
        fragColor3 = baseColor * (1.0 - vRenderBufferFlag * 0.5);
        fragColor4 = baseColor * (0.5 + vRenderBufferFlag * 0.2);
        fragColor5 = baseColor * (0.5 + vRenderBufferFlag * 0.3);
        fragColor6 = baseColor * (0.5 + vRenderBufferFlag * 0.4);
        fragColor7 = baseColor * (0.5 + vRenderBufferFlag * 0.5);
    }`;

    try {
        const program = gl.createProgram();
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSource);
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vs));
        }

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSource);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fs));
        }

        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vTexCoord', 'vTargetIndex', 'vFragOutput', 'vRenderBufferFlag'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);
    } catch (e) {
        throw e;
    }

    const aPosition = gl.getAttribLocation(gl.getParameter(gl.CURRENT_PROGRAM), 'aPosition');
    const aTexCoord = gl.getAttribLocation(gl.getParameter(gl.CURRENT_PROGRAM), 'aTexCoord');
    const uTargetOffset = gl.getUniformLocation(gl.getParameter(gl.CURRENT_PROGRAM), 'uTargetOffset');

    const vertices = new Float32Array([
        -0.8, -0.8, 0.0, 0.0, 0.0,
         0.8, -0.8, 0.0, 1.0, 0.0,
         0.8,  0.8, 0.0, 1.0, 1.0,
        -0.8, -0.8, 0.0, 0.0, 0.0,
         0.8,  0.8, 0.0, 1.0, 1.0,
        -0.8,  0.8, 0.0, 0.0, 1.0
    ]);

    try {
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    } catch (e) {
        throw e;
    }

    try {
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(aTexCoord);
        gl.vertexAttribPointer(aTexCoord, 2, gl.FLOAT, false, 20, 12);
    } catch (e) {
        throw e;
    }

    const mrtTextures = [];
    for (let i = 0; i < texCount; i++) {
        try {
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, texSize, texSize);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            mrtTextures.push(tex);
        } catch (e) {
            throw e;
        }
    }

    const mrtRenderbuffers = [];
    for (let i = 0; i < rbCount; i++) {
        try {
            const rb = gl.createRenderbuffer();
            gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
            gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, texSize, texSize);
            mrtRenderbuffers.push(rb);
        } catch (e) {
            throw e;
        }
    }

    const fbo = gl.createFramebuffer();
    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        for (let i = 0; i < texCount; i++) {
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, mrtTextures[i], 0);
        }
        for (let i = 0; i < rbCount; i++) {
            gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + texCount + i, gl.RENDERBUFFER, mrtRenderbuffers[i]);
        }
        const drawBuffers = Array.from({length: mrtCount}, (_, i) => gl.COLOR_ATTACHMENT0 + i);
        gl.drawBuffers(drawBuffers);
    } catch (e) {
        throw e;
    }

    const tfBuffer = gl.createBuffer();
    try {
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, vertexCount * tfStride * 4, gl.STATIC_READ);
    } catch (e) {
        throw e;
    }

    const tf = gl.createTransformFeedback();
    try {
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer);
    } catch (e) {
        throw e;
    }

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch (e) {
        throw e;
    }

    for (let pass = 0; pass < 4; pass++) {
        try {
            gl.uniform1f(uTargetOffset, pass * 2.0);
        } catch (e) {
            throw e;
        }

        try {
            gl.enable(gl.RASTERIZER_DISCARD);
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
            gl.endTransformFeedback();
            gl.disable(gl.RASTERIZER_DISCARD);
        } catch (e) {
            throw e;
        }

        try {
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        } catch (e) {
            throw e;
        }

        try {
            const drawBuffers1 = [gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT4, gl.COLOR_ATTACHMENT5];
            gl.drawBuffers(drawBuffers1);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        } catch (e) {
            throw e;
        }

        try {
            const drawBuffers2 = [gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3, gl.COLOR_ATTACHMENT6, gl.COLOR_ATTACHMENT7];
            gl.drawBuffers(drawBuffers2);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        } catch (e) {
            throw e;
        }

        try {
            const drawBuffers3 = Array.from({length: mrtCount}, (_, i) => gl.COLOR_ATTACHMENT0 + i);
            gl.drawBuffers(drawBuffers3);
        } catch (e) {
            throw e;
        }
    }

    try {
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, mrtTextures[0], 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.RENDERBUFFER, mrtRenderbuffers[0]);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch (e) {
        throw e;
    }

    try {
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, mrtTextures[1], 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT3, gl.RENDERBUFFER, mrtRenderbuffers[1]);
        gl.drawBuffers([gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3]);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch (e) {
        throw e;
    }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch (e) {
        throw e;
    }

    try {
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch (e) {
        throw e;
    }

    try {
        gl.finish();
    } catch (e) {
        throw e;
    }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const texSize = 128;
    const sliceCount = 128;
    const vertexCount = 6;
    const tfStride = 7;
    const readSize = 64;

    const vsSource = `#version 300 es
    in vec3 aPosition;
    in vec2 aTexCoord;
    out vec2 vTexCoord;
    out vec3 vSliceCoord;
    out vec4 vPixelData;
    out float vDepthIndex;
    uniform float uSliceOffset;
    void main() {
        gl_Position = vec4(aPosition, 1.0);
        vTexCoord = aTexCoord;
        float vertID = float(gl_VertexID);
        float sliceID = uSliceOffset + mod(vertID, float(${sliceCount}));
        vDepthIndex = sliceID;
        vSliceCoord = vec3(aTexCoord, sliceID / float(${sliceCount}));
        vPixelData = vec4(aTexCoord, sliceID / float(${sliceCount}), 1.0);
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    precision highp sampler3D;
    in vec2 vTexCoord;
    in vec3 vSliceCoord;
    in vec4 vPixelData;
    in float vDepthIndex;
    uniform sampler3D uTex3D;
    out vec4 fragColor;
    void main() {
        vec4 texColor = texture(uTex3D, vSliceCoord);
        float depthMod = mod(vDepthIndex, float(${sliceCount})) / float(${sliceCount});
        fragColor = texColor * vPixelData * vec4(1.0, depthMod, 1.0 - depthMod, 1.0);
    }`;

    try {
        const program = gl.createProgram();
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSource);
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vs));
        }

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSource);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fs));
        }

        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['vTexCoord', 'vSliceCoord', 'vPixelData', 'vDepthIndex'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);
    } catch (e) {
        throw e;
    }

    const aPosition = gl.getAttribLocation(gl.getParameter(gl.CURRENT_PROGRAM), 'aPosition');
    const aTexCoord = gl.getAttribLocation(gl.getParameter(gl.CURRENT_PROGRAM), 'aTexCoord');
    const uSliceOffset = gl.getUniformLocation(gl.getParameter(gl.CURRENT_PROGRAM), 'uSliceOffset');
    const uTex3D = gl.getUniformLocation(gl.getParameter(gl.CURRENT_PROGRAM), 'uTex3D');

    const vertices = new Float32Array([
        -0.8, -0.8, 0.0, 0.0, 0.0,
         0.8, -0.8, 0.0, 1.0, 0.0,
         0.8,  0.8, 0.0, 1.0, 1.0,
        -0.8, -0.8, 0.0, 0.0, 0.0,
         0.8,  0.8, 0.0, 1.0, 1.0,
        -0.8,  0.8, 0.0, 0.0, 1.0
    ]);

    try {
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
    } catch (e) {
        throw e;
    }

    try {
        gl.enableVertexAttribArray(aPosition);
        gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 20, 0);
        gl.enableVertexAttribArray(aTexCoord);
        gl.vertexAttribPointer(aTexCoord, 2, gl.FLOAT, false, 20, 12);
    } catch (e) {
        throw e;
    }

    const tex3D = gl.createTexture();
    try {
        gl.bindTexture(gl.TEXTURE_3D, tex3D);
        gl.texStorage3D(gl.TEXTURE_3D, 1, gl.RGBA16F, texSize, texSize, sliceCount);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } catch (e) {
        throw e;
    }

    for (let slice = 0; slice < sliceCount; slice++) {
        try {
            const data = new Uint16Array(texSize * texSize * 4);
            for (let i = 0; i < data.length; i += 4) {
                const x = (i / 4) % texSize;
                const y = Math.floor((i / 4) / texSize);
                data[i] = ((x * 512 + slice * 256) % 65536);
                data[i + 1] = ((y * 512 + slice * 128) % 65536);
                data[i + 2] = (slice * 512) % 65536;
                data[i + 3] = 65535;
            }
            gl.texSubImage3D(gl.TEXTURE_3D, 0, 0, 0, slice, texSize, texSize, 1, gl.RGBA, gl.HALF_FLOAT, data);
        } catch (e) {
            throw e;
        }
    }

    const renderTex = gl.createTexture();
    try {
        gl.bindTexture(gl.TEXTURE_2D, renderTex);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch (e) {
        throw e;
    }

    const fbo = gl.createFramebuffer();
    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, renderTex, 0);
    } catch (e) {
        throw e;
    }

    const tfBuffer = gl.createBuffer();
    try {
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, vertexCount * tfStride * 4, gl.STATIC_READ);
    } catch (e) {
        throw e;
    }

    const tf = gl.createTransformFeedback();
    try {
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer);
    } catch (e) {
        throw e;
    }

    try {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_3D, tex3D);
        gl.uniform1i(uTex3D, 0);
    } catch (e) {
        throw e;
    }

    try {
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch (e) {
        throw e;
    }

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
        gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 0);
    } catch (e) {
        throw e;
    }

    for (let sliceBatch = 0; sliceBatch < 16; sliceBatch++) {
        try {
            gl.uniform1f(uSliceOffset, sliceBatch * 8.0);
        } catch (e) {
            throw e;
        }

        try {
            gl.enable(gl.RASTERIZER_DISCARD);
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
            gl.endTransformFeedback();
            gl.disable(gl.RASTERIZER_DISCARD);
        } catch (e) {
            throw e;
        }

        try {
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        } catch (e) {
            throw e;
        }

        for (let slice = 0; slice < 8; slice++) {
            try {
                const sliceIndex = sliceBatch * 8 + slice;
                if (sliceIndex < sliceCount) {
                    gl.bindTexture(gl.TEXTURE_3D, tex3D);
                    gl.copyTexSubImage3D(gl.TEXTURE_3D, 0, 0, 0, sliceIndex, 0, 0, readSize, readSize);
                }
            } catch (e) {
                throw e;
            }
        }

        try {
            const pixels = new Uint16Array(readSize * readSize * 4);
            gl.readPixels(0, 0, readSize, readSize, gl.RGBA, gl.HALF_FLOAT, pixels);
        } catch (e) {
            throw e;
        }

        try {
            gl.pixelStorei(gl.PACK_ALIGNMENT, 2);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 2);
            gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        } catch (e) {
            throw e;
        }
    }

    try {
        gl.pixelStorei(gl.PACK_ALIGNMENT, 4);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 128);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 128);
        gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
        gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
    } catch (e) {
        throw e;
    }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch (e) {
        throw e;
    }

    try {
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch (e) {
        throw e;
    }

    try {
        gl.finish();
    } catch (e) {
        throw e;
    }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

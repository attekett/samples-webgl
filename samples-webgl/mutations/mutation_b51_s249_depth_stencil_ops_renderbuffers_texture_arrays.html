<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vsSource = `#version 300 es
    in vec4 position;
    in vec2 texCoord;
    out vec2 vTexCoord;
    out float vLayer;
    uniform float uLayer;
    uniform float uDepth;
    void main() {
        vTexCoord = texCoord;
        vLayer = uLayer;
        gl_Position = position;
        gl_Position.z = uDepth;
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    precision highp sampler2DArray;
    in vec2 vTexCoord;
    in float vLayer;
    out vec4 fragColor;
    uniform sampler2DArray uTexArray;
    uniform vec4 uColor;
    uniform int uStencilRef;
    void main() {
        vec4 texColor = texture(uTexArray, vec3(vTexCoord, vLayer));
        float stencilEffect = float(uStencilRef) / 255.0;
        fragColor = texColor * uColor * stencilEffect;
    }`;

    try {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vsSource);
        gl.compileShader(vertexShader);
        if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vertexShader));
        }

        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, fsSource);
        gl.compileShader(fragmentShader);
        if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fragmentShader));
        }

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);

        const positionLoc = gl.getAttribLocation(program, 'position');
        const texCoordLoc = gl.getAttribLocation(program, 'texCoord');
        const uLayerLoc = gl.getUniformLocation(program, 'uLayer');
        const uDepthLoc = gl.getUniformLocation(program, 'uDepth');
        const uColorLoc = gl.getUniformLocation(program, 'uColor');
        const uStencilRefLoc = gl.getUniformLocation(program, 'uStencilRef');
        const uTexArrayLoc = gl.getUniformLocation(program, 'uTexArray');

        const positions = new Float32Array([
            -0.8, -0.8, 0, 1,
            0.8, -0.8, 0, 1,
            -0.8, 0.8, 0, 1,
            0.8, 0.8, 0, 1
        ]);

        const texCoords = new Float32Array([
            0, 0,
            1, 0,
            0, 1,
            1, 1
        ]);

        let positionBuffer, texCoordBuffer, vao;

        try {
            positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
        } catch (e) {
            throw e;
        }

        try {
            texCoordBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, texCoords, gl.STATIC_DRAW);
        } catch (e) {
            throw e;
        }

        try {
            vao = gl.createVertexArray();
            gl.bindVertexArray(vao);
        } catch (e) {
            throw e;
        }

        try {
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.enableVertexAttribArray(positionLoc);
            gl.vertexAttribPointer(positionLoc, 4, gl.FLOAT, false, 0, 0);
        } catch (e) {
            throw e;
        }

        try {
            gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
            gl.enableVertexAttribArray(texCoordLoc);
            gl.vertexAttribPointer(texCoordLoc, 2, gl.FLOAT, false, 0, 0);
        } catch (e) {
            throw e;
        }

        let arrayTexture;
        try {
            arrayTexture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrayTexture);
            gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, 512, 512, 64);
        } catch (e) {
            throw e;
        }

        const layerData = new Uint8Array(512 * 512 * 4);
        for (let layer = 0; layer < 64; layer++) {
            try {
                for (let i = 0; i < layerData.length; i += 4) {
                    layerData[i] = (layer * 4) % 256;
                    layerData[i + 1] = (layer * 7) % 256;
                    layerData[i + 2] = (layer * 11) % 256;
                    layerData[i + 3] = 255;
                }
                gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, layer, 512, 512, 1, gl.RGBA, gl.UNSIGNED_BYTE, layerData);
            } catch (e) {
                continue;
            }
        }

        try {
            gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        } catch (e) {
            throw e;
        }

        try {
            gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.REPEAT);
        } catch (e) {
            throw e;
        }

        const depthStencilRBs = [];
        const depthRBs = [];
        const fbos = [];

        for (let i = 0; i < 4; i++) {
            try {
                const dsRB = gl.createRenderbuffer();
                gl.bindRenderbuffer(gl.RENDERBUFFER, dsRB);
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH24_STENCIL8, 512, 512);
                depthStencilRBs.push(dsRB);
            } catch (e) {
                throw e;
            }

            try {
                const colorRB = gl.createRenderbuffer();
                gl.bindRenderbuffer(gl.RENDERBUFFER, colorRB);
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, 512, 512);

                const fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, colorRB);
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, depthStencilRBs[i]);
                fbos.push(fbo);
            } catch (e) {
                throw e;
            }
        }

        for (let i = 0; i < 4; i++) {
            try {
                const dRB = gl.createRenderbuffer();
                gl.bindRenderbuffer(gl.RENDERBUFFER, dRB);
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, 512, 512);
                depthRBs.push(dRB);
            } catch (e) {
                throw e;
            }

            try {
                const colorRB = gl.createRenderbuffer();
                gl.bindRenderbuffer(gl.RENDERBUFFER, colorRB);
                gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, 512, 512);

                const fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, colorRB);
                gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depthRBs[i]);
                fbos.push(fbo);
            } catch (e) {
                throw e;
            }
        }

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrayTexture);
        gl.uniform1i(uTexArrayLoc, 0);

        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.STENCIL_TEST);

        for (let layer = 0; layer < 64; layer++) {
            try {
                const fboIndex = layer % 8;
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[fboIndex]);

                const depthFunc = [gl.NEVER, gl.LESS, gl.EQUAL, gl.LEQUAL, gl.GREATER, gl.NOTEQUAL, gl.GEQUAL, gl.ALWAYS][layer % 8];
                gl.depthFunc(depthFunc);

                const stencilOp = layer % 7;
                switch (stencilOp) {
                    case 0:
                        gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
                        gl.stencilFunc(gl.ALWAYS, layer % 256, 0xFF);
                        break;
                    case 1:
                        gl.stencilOp(gl.ZERO, gl.REPLACE, gl.INCR);
                        gl.stencilFunc(gl.EQUAL, layer % 128, 0xFF);
                        break;
                    case 2:
                        gl.stencilOp(gl.REPLACE, gl.INCR, gl.DECR);
                        gl.stencilFunc(gl.NOTEQUAL, layer % 64, 0x7F);
                        break;
                    case 3:
                        gl.stencilOp(gl.INCR, gl.DECR, gl.INVERT);
                        gl.stencilFunc(gl.LESS, layer % 32, 0x3F);
                        break;
                    case 4:
                        gl.stencilOp(gl.DECR, gl.INVERT, gl.INCR_WRAP);
                        gl.stencilFunc(gl.LEQUAL, layer % 16, 0x1F);
                        break;
                    case 5:
                        gl.stencilOp(gl.INVERT, gl.INCR_WRAP, gl.DECR_WRAP);
                        gl.stencilFunc(gl.GREATER, layer % 8, 0x0F);
                        break;
                    case 6:
                        gl.stencilOp(gl.INCR_WRAP, gl.DECR_WRAP, gl.KEEP);
                        gl.stencilFunc(gl.GEQUAL, layer % 4, 0x07);
                        break;
                }

                gl.uniform1f(uLayerLoc, layer);
                gl.uniform1f(uDepthLoc, (layer / 64.0) * 2.0 - 1.0);
                gl.uniform4f(uColorLoc,
                    Math.cos(layer * 0.1),
                    Math.sin(layer * 0.13),
                    Math.cos(layer * 0.17),
                    1.0);
                gl.uniform1i(uStencilRefLoc, (layer % 256));

                gl.clearColor(0.0, 0.0, 0.0, 1.0);
                gl.clearDepth(1.0);
                gl.clearStencil(0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                if (layer % 8 === 0) {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                    gl.depthFunc(gl.LESS);
                    gl.stencilFunc(gl.ALWAYS, 0, 0xFF);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                }

                gl.disable(gl.DEPTH_TEST);
                gl.disable(gl.STENCIL_TEST);
                gl.enable(gl.DEPTH_TEST);
                gl.enable(gl.STENCIL_TEST);

            } catch (e) {
                gl.depthFunc(gl.LESS);
                gl.stencilFunc(gl.ALWAYS, 0, 0xFF);
            }
        }

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.depthFunc(gl.LESS);
        gl.stencilFunc(gl.ALWAYS, 255, 0xFF);
        gl.stencilOp(gl.KEEP, gl.KEEP, gl.KEEP);

        for (let i = 0; i < 8; i++) {
            try {
                gl.uniform1f(uLayerLoc, i * 8);
                gl.uniform1f(uDepthLoc, (i / 8.0) * 2.0 - 1.0);
                gl.uniform4f(uColorLoc, 0.6, 0.6, 0.6, 1.0);
                gl.uniform1i(uStencilRefLoc, 255);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            } catch (e) {
                continue;
            }
        }

        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.STENCIL_TEST);
        gl.flush();

    } catch (e) {
        throw e;
    }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

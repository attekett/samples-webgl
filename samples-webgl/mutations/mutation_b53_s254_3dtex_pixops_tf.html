<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vsSource = `#version 300 es
    in float vertexId;
    out float sliceCoord;
    out vec4 pixelData;
    out float sliceIndex;

    void main() {
        sliceCoord = fract(vertexId * 0.13);
        sliceIndex = floor(vertexId * 0.13);
        pixelData = vec4(sliceCoord, fract(vertexId * 0.37), fract(vertexId * 0.71), 1.0);
        gl_Position = vec4(sliceCoord * 2.0 - 1.0, pixelData.y * 2.0 - 1.0, 0.0, 1.0);
        gl_PointSize = 1.0;
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    in float sliceCoord;
    in vec4 pixelData;
    in float sliceIndex;
    out vec4 fragColor;

    void main() {
        fragColor = pixelData;
    }`;

    let vs, fs, program;
    try {
        vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vsSource);
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error("VS compile failed: " + gl.getShaderInfoLog(vs));
        }
    } catch (e) {
        throw new Error("Vertex shader creation failed: " + e.message);
    }

    try {
        fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fsSource);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error("FS compile failed: " + gl.getShaderInfoLog(fs));
        }
    } catch (e) {
        throw new Error("Fragment shader creation failed: " + e.message);
    }

    try {
        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.transformFeedbackVaryings(program, ['sliceCoord', 'pixelData', 'sliceIndex'], gl.INTERLEAVED_ATTRIBS);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error("Program link failed: " + gl.getProgramInfoLog(program));
        }
    } catch (e) {
        throw new Error("Program creation failed: " + e.message);
    }

    gl.useProgram(program);

    let texture3D;
    try {
        texture3D = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_3D, texture3D);
        gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, 256, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
    } catch (e) {
        throw new Error("3D texture creation failed: " + e.message);
    }

    const vertexCount = 65536;
    const vertexData = new Float32Array(vertexCount);
    for (let i = 0; i < vertexCount; i++) {
        vertexData[i] = i;
    }

    let vbo;
    try {
        vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
    } catch (e) {
        throw new Error("VBO creation failed: " + e.message);
    }

    const vertexIdLoc = gl.getAttribLocation(program, 'vertexId');
    gl.enableVertexAttribArray(vertexIdLoc);
    gl.vertexAttribPointer(vertexIdLoc, 1, gl.FLOAT, false, 0, 0);

    let tfBuffer;
    try {
        tfBuffer = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, vertexCount * 24, gl.DYNAMIC_COPY);
    } catch (e) {
        throw new Error("Transform feedback buffer creation failed: " + e.message);
    }

    let tfObject;
    try {
        tfObject = gl.createTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObject);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer);
    } catch (e) {
        throw new Error("Transform feedback object creation failed: " + e.message);
    }

    let fbo;
    try {
        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        const fboTex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, fboTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
            throw new Error("Framebuffer incomplete");
        }
    } catch (e) {
        throw new Error("FBO creation failed: " + e.message);
    }

    const sliceBatches = 128;
    const slicesPerBatch = 2;
    const pixelBuffer = new Uint8Array(256 * 256 * 4);

    for (let batch = 0; batch < sliceBatches; batch++) {
        try {
            gl.pixelStorei(gl.PACK_ALIGNMENT, (batch % 4) + 1);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, ((batch + 1) % 4) + 1);
        } catch (e) {
            throw new Error("Pixel store state setup failed: " + e.message);
        }

        try {
            gl.pixelStorei(gl.PACK_ROW_LENGTH, batch % 2 === 0 ? 256 : 0);
            gl.pixelStorei(gl.UNPACK_ROW_LENGTH, batch % 3 === 0 ? 256 : 0);
        } catch (e) {
            throw new Error("Row length setup failed: " + e.message);
        }

        try {
            gl.pixelStorei(gl.PACK_SKIP_PIXELS, batch % 5);
            gl.pixelStorei(gl.PACK_SKIP_ROWS, batch % 7);
        } catch (e) {
            throw new Error("Pack skip setup failed: " + e.message);
        }

        try {
            gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, batch % 3);
            gl.pixelStorei(gl.UNPACK_SKIP_ROWS, batch % 11);
            gl.pixelStorei(gl.UNPACK_SKIP_IMAGES, batch % 13);
        } catch (e) {
            throw new Error("Unpack skip setup failed: " + e.message);
        }

        try {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.viewport(0, 0, 256, 256);
            gl.clearColor(batch * 0.007, 1.0 - batch * 0.007, 0.5, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
        } catch (e) {
            throw new Error("FBO clear failed: " + e.message);
        }

        try {
            gl.enable(gl.RASTERIZER_DISCARD);
            gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tfObject);
            gl.beginTransformFeedback(gl.POINTS);
            gl.drawArrays(gl.POINTS, batch * 512, 512);
            gl.endTransformFeedback();
            gl.disable(gl.RASTERIZER_DISCARD);
        } catch (e) {
            throw new Error("Transform feedback rendering failed: " + e.message);
        }

        try {
            gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
            gl.bindBuffer(gl.ARRAY_BUFFER, tfBuffer);
            const tfData = new Float32Array(512 * 6);
            gl.getBufferSubData(gl.ARRAY_BUFFER, 0, tfData);
        } catch (e) {
            throw new Error("Transform feedback data readback failed: " + e.message);
        }

        for (let s = 0; s < slicesPerBatch; s++) {
            const sliceZ = (batch * slicesPerBatch + s) % 256;

            try {
                gl.bindTexture(gl.TEXTURE_3D, texture3D);
                gl.copyTexSubImage3D(gl.TEXTURE_3D, 0, 0, 0, sliceZ, 0, 0, 256, 256);
            } catch (e) {
                throw new Error("copyTexSubImage3D failed: " + e.message);
            }

            try {
                gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
                gl.pixelStorei(gl.PACK_ROW_LENGTH, 0);
                gl.pixelStorei(gl.PACK_SKIP_PIXELS, 0);
                gl.pixelStorei(gl.PACK_SKIP_ROWS, 0);
                gl.readPixels(0, 0, 256, 256, gl.RGBA, gl.UNSIGNED_BYTE, pixelBuffer);
            } catch (e) {
                throw new Error("readPixels failed: " + e.message);
            }

            try {
                if (pixelBuffer[0] > 255 || pixelBuffer[1023] > 255) {
                    throw new Error("Invalid pixel data");
                }
            } catch (e) {
                throw new Error("Pixel validation failed: " + e.message);
            }
        }

        try {
            gl.bindTexture(gl.TEXTURE_3D, texture3D);
            gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, batch % 2 ? gl.LINEAR : gl.NEAREST);
        } catch (e) {
            throw new Error("Texture parameter update failed: " + e.message);
        }
    }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.2, 0.4, 0.6, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
    } catch (e) {
        throw new Error("Final rendering failed: " + e.message);
    }
}

main().catch(err => { throw err; });
</script>
</body>
</html>

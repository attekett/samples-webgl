<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
    'EXT_color_buffer_float'
];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const vsSource = `#version 300 es
    in vec2 a_position;
    in float a_samplerID;
    in float a_layerIndex;
    out float v_samplerID;
    out vec2 v_texCoord;
    out float v_layerIndex;

    void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
        v_samplerID = a_samplerID;
        v_texCoord = a_position * 0.5 + 0.5;
        v_layerIndex = a_layerIndex;
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    precision highp sampler2DArray;
    uniform sampler2DArray u_texArray;
    in float v_samplerID;
    in vec2 v_texCoord;
    in float v_layerIndex;
    out vec4 fragColor;

    void main() {
        float layer = mod(v_layerIndex, 64.0);
        vec4 texel = texture(u_texArray, vec3(v_texCoord, layer));
        fragColor = texel * (1.0 + v_samplerID * 0.1);
    }`;

    const vShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vShader, vsSource);
    gl.compileShader(vShader);
    try {
        if (!gl.getShaderParameter(vShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vShader));
        }
    } catch(e) {
        throw e;
    }

    const fShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fShader, fsSource);
    gl.compileShader(fShader);
    try {
        if (!gl.getShaderParameter(fShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fShader));
        }
    } catch(e) {
        throw e;
    }

    const program = gl.createProgram();
    gl.attachShader(program, vShader);
    gl.attachShader(program, fShader);

    try {
        gl.transformFeedbackVaryings(program, ['v_samplerID', 'v_texCoord', 'v_layerIndex'], gl.INTERLEAVED_ATTRIBS);
    } catch(e) {
        throw e;
    }

    gl.linkProgram(program);
    try {
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
    } catch(e) {
        throw e;
    }

    gl.useProgram(program);

    const posLoc = gl.getAttribLocation(program, 'a_position');
    const samplerIDLoc = gl.getAttribLocation(program, 'a_samplerID');
    const layerIndexLoc = gl.getAttribLocation(program, 'a_layerIndex');

    const vertexData = new Float32Array([
        -0.8, -0.8, 0.0, 0.0,
         0.8, -0.8, 1.0, 8.0,
         0.0,  0.8, 2.0, 16.0,
        -0.6, -0.4, 3.0, 24.0,
         0.6, -0.4, 4.0, 32.0,
         0.0,  0.6, 5.0, 40.0
    ]);

    const vbo = gl.createBuffer();
    try {
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);
    } catch(e) {
        throw e;
    }

    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 16, 0);
    gl.enableVertexAttribArray(samplerIDLoc);
    gl.vertexAttribPointer(samplerIDLoc, 1, gl.FLOAT, false, 16, 8);
    gl.enableVertexAttribArray(layerIndexLoc);
    gl.vertexAttribPointer(layerIndexLoc, 1, gl.FLOAT, false, 16, 12);

    const texArray = gl.createTexture();
    try {
        gl.bindTexture(gl.TEXTURE_2D_ARRAY, texArray);
        gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, 512, 512, 64);
    } catch(e) {
        throw e;
    }

    const layerPixels = new Uint8Array(512 * 512 * 4);
    for (let layer = 0; layer < 64; layer++) {
        for (let i = 0; i < layerPixels.length; i += 4) {
            layerPixels[i] = (layer * 4) & 0xFF;
            layerPixels[i + 1] = (layer * 8) & 0xFF;
            layerPixels[i + 2] = (layer * 12) & 0xFF;
            layerPixels[i + 3] = 255;
        }
        try {
            gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, layer, 512, 512, 1, gl.RGBA, gl.UNSIGNED_BYTE, layerPixels);
        } catch(e) {
            throw e;
        }
    }

    const samplers = [];
    const wrapModes = [gl.REPEAT, gl.CLAMP_TO_EDGE, gl.MIRRORED_REPEAT];
    const filterModes = [gl.NEAREST, gl.LINEAR];

    for (let i = 0; i < 16; i++) {
        const sampler = gl.createSampler();
        samplers.push(sampler);
        try {
            gl.samplerParameteri(sampler, gl.TEXTURE_WRAP_S, wrapModes[i % 3]);
            gl.samplerParameteri(sampler, gl.TEXTURE_WRAP_T, wrapModes[(i + 1) % 3]);
            gl.samplerParameteri(sampler, gl.TEXTURE_WRAP_R, wrapModes[(i + 2) % 3]);
            gl.samplerParameteri(sampler, gl.TEXTURE_MIN_FILTER, filterModes[i % 2]);
            gl.samplerParameteri(sampler, gl.TEXTURE_MAG_FILTER, filterModes[(i + 1) % 2]);
        } catch(e) {
            throw e;
        }
    }

    const tfBuffer = gl.createBuffer();
    try {
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 6 * 5 * 4, gl.DYNAMIC_COPY);
    } catch(e) {
        throw e;
    }

    const tf = gl.createTransformFeedback();
    try {
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, tfBuffer);
    } catch(e) {
        throw e;
    }

    gl.clearColor(0.1, 0.1, 0.15, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    for (let pass = 0; pass < 4; pass++) {
        const samplerIdx = (pass * 4) % 16;
        try {
            gl.bindSampler(0, samplers[samplerIdx]);
        } catch(e) {
            throw e;
        }

        try {
            gl.samplerParameteri(samplers[samplerIdx], gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.samplerParameteri(samplers[samplerIdx], gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        } catch(e) {
            throw e;
        }

        gl.enable(gl.RASTERIZER_DISCARD);
        try {
            gl.beginTransformFeedback(gl.TRIANGLES);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
            gl.endTransformFeedback();
        } catch(e) {
            throw e;
        }
        gl.disable(gl.RASTERIZER_DISCARD);

        gl.drawArrays(gl.TRIANGLES, 0, 6);

        try {
            gl.samplerParameteri(samplers[samplerIdx], gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.samplerParameteri(samplers[samplerIdx], gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        } catch(e) {
            throw e;
        }
    }

    const readbackData = new Float32Array(6 * 5);
    try {
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuffer);
        gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER, 0, readbackData);
    } catch(e) {
        throw e;
    }

    gl.bindSampler(0, null);
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, null);
    gl.bindBuffer(gl.ARRAY_BUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, null);

    samplers.forEach(s => gl.deleteSampler(s));
    gl.deleteTransformFeedback(tf);
    gl.deleteBuffer(tfBuffer);
    gl.deleteBuffer(vbo);
    gl.deleteTexture(texArray);
    gl.deleteProgram(program);
    gl.deleteShader(vShader);
    gl.deleteShader(fShader);
}

main().catch(err => { throw err; });
</script>
</body>
</html>

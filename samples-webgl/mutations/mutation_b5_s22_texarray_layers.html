<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const layerCount = 16;
    const texSize = 128;
    const texPixels = texSize * texSize * layerCount;
    const vertexCount = 6;
    const mipLevels = 4;
    const bufferSize = vertexCount * 16;

    const arrayTarget = gl.TEXTURE_2D_ARRAY;
    const textureFormat = gl.RGBA8;
    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;

    try {
        const array1 = gl.createTexture();
        const array2 = gl.createTexture();
        const array3 = gl.createTexture();
        gl.bindTexture(arrayTarget, array1);
        gl.bindTexture(arrayTarget, array2);
        gl.bindTexture(arrayTarget, array1);
        gl.texStorage3D(arrayTarget, mipLevels, textureFormat, texSize, texSize, layerCount);
        gl.texParameteri(arrayTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(arrayTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(arrayTarget, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(arrayTarget, gl.TEXTURE_WRAP_T, gl.REPEAT);
        const layerData = new Uint8Array(texSize * texSize * 4);
        for (let layer = 0; layer < layerCount; layer++) {
            for (let y = 0; y < texSize; y++) {
                for (let x = 0; x < texSize; x++) {
                    const idx = (y * texSize + x) * 4;
                    layerData[idx + 0] = (layer / layerCount) * 255;
                    layerData[idx + 1] = (x / texSize) * 255;
                    layerData[idx + 2] = (y / texSize) * 255;
                    layerData[idx + 3] = 255;
                }
            }
            gl.texSubImage3D(arrayTarget, 0, 0, 0, layer, texSize, texSize, 1, gl.RGBA, gl.UNSIGNED_BYTE, layerData);
        }
        gl.generateMipmap(arrayTarget);
        gl.bindTexture(arrayTarget, array2);
        gl.texStorage3D(arrayTarget, 2, textureFormat, 64, 64, 8);
        gl.bindTexture(arrayTarget, array1);
    } catch(e) {}

    try {
        const renderTarget1 = gl.createTexture();
        const renderTarget2 = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, renderTarget1);
        gl.bindTexture(gl.TEXTURE_2D, renderTarget2);
        gl.bindTexture(gl.TEXTURE_2D, renderTarget1);
        gl.texStorage2D(gl.TEXTURE_2D, 1, textureFormat, texSize, texSize);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.bindTexture(gl.TEXTURE_2D, renderTarget2);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 256, 256);
    } catch(e) {}

    const vertexShaderSource = `#version 300 es
        in vec2 position;
        in vec2 texCoord;
        out vec2 vTexCoord;
        void main() {
            gl_Position = vec4(position, 0.0, 1.0);
            vTexCoord = texCoord;
        }`;

    const fragmentShaderSource = `#version 300 es
        precision highp float;
        precision highp sampler2DArray;
        in vec2 vTexCoord;
        uniform sampler2DArray uTexArray;
        uniform float uLayer;
        uniform int uLayerInt;
        out vec4 fragColor;
        void main() {
            vec3 coords1 = vec3(vTexCoord, uLayer);
            vec3 coords2 = vec3(vTexCoord, float(uLayerInt));
            vec4 color1 = texture(uTexArray, coords1);
            vec4 color2 = texture(uTexArray, coords2);
            vec4 color3 = texture(uTexArray, vec3(vTexCoord * 2.0, uLayer + 1.0));
            fragColor = (color1 + color2 + color3) / 3.0;
        }`;

    try {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        const vertexShader2 = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vertexShaderSource);
        gl.shaderSource(vertexShader2, vertexShaderSource);
        gl.compileShader(vertexShader);
        gl.compileShader(vertexShader2);
        if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vertexShader));
        }
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        const fragmentShader2 = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, fragmentShaderSource);
        gl.shaderSource(fragmentShader2, fragmentShaderSource);
        gl.compileShader(fragmentShader);
        gl.compileShader(fragmentShader2);
        if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fragmentShader));
        }
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        const fbo3 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, array1, 0, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, array1, 0, 1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo3);
        gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, array1, 0, 2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        const vertices = new Float32Array([
            -1.0, -1.0, 0.0, 0.0,
             1.0, -1.0, 1.0, 0.0,
            -1.0,  1.0, 0.0, 1.0,
            -1.0,  1.0, 0.0, 1.0,
             1.0, -1.0, 1.0, 0.0,
             1.0,  1.0, 1.0, 1.0
        ]);
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, vertices, bufferUsage);
        gl.bufferSubData(bufferTarget, 0, new Float32Array([0.2, 0.3]));
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bufferData(bufferTarget, 1024, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        const texLoc = gl.getAttribLocation(program, 'texCoord');
        const arrayLoc = gl.getUniformLocation(program, 'uTexArray');
        const layerLoc = gl.getUniformLocation(program, 'uLayer');
        const layerIntLoc = gl.getUniformLocation(program, 'uLayerInt');
        gl.enableVertexAttribArray(posLoc);
        gl.disableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(texLoc);
        gl.disableVertexAttribArray(texLoc);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 16, 0);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 16, 8);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(arrayTarget, array1);
        gl.uniform1i(arrayLoc, 0);
    } catch(e) {}

    try {
        gl.clearColor(0.05, 0.05, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.viewport(0, 0, 256, 256);
        for (let i = 0; i < 8; i++) {
            gl.uniform1f(layerLoc, i);
            gl.uniform1i(layerIntLoc, i + 1);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        }
        gl.viewport(0, 0, texSize, texSize);
        gl.uniform1f(layerLoc, 5.5);
        gl.uniform1i(layerIntLoc, 3);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.uniform1f(layerLoc, 10.0);
        gl.uniform1i(layerIntLoc, 7);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.clearColor(0.5, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.clearColor(0.0, 0.5, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.bindTexture(arrayTarget, array1);
        gl.deleteTexture(array1);
        gl.bindTexture(arrayTarget, array2);
        gl.deleteTexture(array2);
        gl.deleteTexture(array3);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.deleteBuffer(buffer2);
        gl.deleteFramebuffer(fbo1);
        gl.deleteFramebuffer(fbo2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const texSize = 256;
    const texPixels = texSize * texSize;
    const channelCount = 4;
    const vertexCount = 6;
    const bufferSize = vertexCount * 16;

    const textureTarget = gl.TEXTURE_2D;
    const swizzleR = gl.RED;
    const swizzleG = gl.GREEN;
    const swizzleB = gl.BLUE;
    const swizzleA = gl.ALPHA;
    const bufferTarget = gl.ARRAY_BUFFER;

    try {
        const tex1 = gl.createTexture();
        const tex2 = gl.createTexture();
        const tex3 = gl.createTexture();
        gl.bindTexture(textureTarget, tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.bindTexture(textureTarget, tex1);
        gl.texStorage2D(textureTarget, 4, gl.RGBA8, texSize, texSize);
        const texData = new Uint8Array(texPixels * channelCount);
        for (let y = 0; y < texSize; y++) {
            for (let x = 0; x < texSize; x++) {
                const idx = (y * texSize + x) * 4;
                texData[idx + 0] = (x / texSize) * 255;
                texData[idx + 1] = (y / texSize) * 255;
                texData[idx + 2] = ((x + y) / (2 * texSize)) * 255;
                texData[idx + 3] = 255;
            }
        }
        gl.texSubImage2D(textureTarget, 0, 0, 0, texSize, texSize, gl.RGBA, gl.UNSIGNED_BYTE, texData);
        gl.generateMipmap(textureTarget);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_R, swizzleR);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_G, swizzleG);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_B, swizzleB);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_A, swizzleA);
        gl.bindTexture(textureTarget, tex2);
        gl.texStorage2D(textureTarget, 1, gl.RGBA8, 128, 128);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_R, gl.BLUE);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_G, gl.RED);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_B, gl.GREEN);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_A, gl.ONE);
        gl.bindTexture(textureTarget, tex1);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex1);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_R, gl.GREEN);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_G, gl.BLUE);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_B, gl.RED);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_A, gl.ALPHA);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_R, gl.BLUE);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_G, gl.ALPHA);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_B, gl.GREEN);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_A, gl.RED);
    } catch(e) {}

    const vertexShaderSource = `#version 300 es
        in vec2 position;
        in vec2 texCoord;
        out vec2 vTexCoord;
        void main() {
            gl_Position = vec4(position, 0.0, 1.0);
            vTexCoord = texCoord;
        }`;

    const fragmentShaderSource = `#version 300 es
        precision highp float;
        in vec2 vTexCoord;
        uniform sampler2D uTexture;
        uniform int uSwizzleMode;
        out vec4 fragColor;
        void main() {
            vec4 color = texture(uTexture, vTexCoord);
            if (uSwizzleMode == 0) {
                fragColor = color;
            } else if (uSwizzleMode == 1) {
                fragColor = color.bgra;
            } else if (uSwizzleMode == 2) {
                fragColor = color.rrra;
            } else if (uSwizzleMode == 3) {
                fragColor = vec4(color.a, color.b, color.g, color.r);
            } else {
                fragColor = vec4(color.rgb * color.a, 1.0);
            }
        }`;

    try {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        const vertexShader2 = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, vertexShaderSource);
        gl.shaderSource(vertexShader2, vertexShaderSource);
        gl.compileShader(vertexShader);
        gl.compileShader(vertexShader2);
        if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vertexShader));
        }
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, fragmentShaderSource);
        gl.compileShader(fragmentShader);
        if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fragmentShader));
        }
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);
    } catch(e) {}

    try {
        const fbo1 = gl.createFramebuffer();
        const fbo2 = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
        const renderTex = gl.createTexture();
        gl.bindTexture(textureTarget, renderTex);
        gl.texStorage2D(textureTarget, 1, gl.RGBA8, texSize, texSize);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_R, gl.ALPHA);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_G, gl.BLUE);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_B, gl.GREEN);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_A, gl.RED);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, textureTarget, renderTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        const vertices = new Float32Array([
            -1.0, -1.0, 0.0, 0.0,
             1.0, -1.0, 1.0, 0.0,
            -1.0,  1.0, 0.0, 1.0,
            -1.0,  1.0, 0.0, 1.0,
             1.0, -1.0, 1.0, 0.0,
             1.0,  1.0, 1.0, 1.0
        ]);
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, vertices, gl.STATIC_DRAW);
        gl.bufferSubData(bufferTarget, 0, new Float32Array([0.25, 0.75]));
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, 512, gl.DYNAMIC_DRAW);
        gl.bindBuffer(bufferTarget, buffer1);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'position');
        const texLoc = gl.getAttribLocation(program, 'texCoord');
        const textureLoc = gl.getUniformLocation(program, 'uTexture');
        const swizzleLoc = gl.getUniformLocation(program, 'uSwizzleMode');
        gl.enableVertexAttribArray(posLoc);
        gl.disableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(texLoc);
        gl.disableVertexAttribArray(texLoc);
        gl.enableVertexAttribArray(texLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 16, 0);
        gl.vertexAttribPointer(texLoc, 2, gl.FLOAT, false, 16, 8);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(textureTarget, tex1);
        gl.uniform1i(textureLoc, 0);
    } catch(e) {}

    try {
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.viewport(0, 0, 256, 256);
        for (let mode = 0; mode < 5; mode++) {
            gl.uniform1i(swizzleLoc, mode);
            gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        }
        gl.bindTexture(textureTarget, tex1);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_R, gl.ZERO);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_G, gl.ONE);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_B, gl.RED);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_A, gl.GREEN);
        gl.uniform1i(swizzleLoc, 2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_R, gl.ALPHA);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_G, gl.ZERO);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_B, gl.ZERO);
        gl.texParameteri(textureTarget, gl.TEXTURE_SWIZZLE_A, gl.ONE);
        gl.uniform1i(swizzleLoc, 4);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindTexture(textureTarget, tex1);
        gl.deleteTexture(tex1);
        gl.bindTexture(textureTarget, tex2);
        gl.deleteTexture(tex2);
        gl.deleteTexture(tex3);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.deleteBuffer(buffer1);
        gl.deleteBuffer(buffer2);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

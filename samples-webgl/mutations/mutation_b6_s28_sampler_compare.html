<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));
    let depthTex, sampler1, sampler2, sampler3, fbo;

    const texSize = 256;
    const samplerCount = 3;
    const vertexCount = 6;
    const compareMode = gl.COMPARE_REF_TO_TEXTURE;
    const compareFunc = gl.LEQUAL;
    const textureTarget = gl.TEXTURE_2D;
    const bufferTarget = gl.ARRAY_BUFFER;

    try {
        depthTex = gl.createTexture();
        gl.bindTexture(textureTarget, depthTex);
        gl.bindTexture(textureTarget, null);
        gl.bindTexture(textureTarget, depthTex);
        gl.texStorage2D(textureTarget, 1, gl.DEPTH_COMPONENT24, texSize, texSize);
        gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(textureTarget, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    } catch(e) {}

    try {
        sampler1 = gl.createSampler();
        sampler2 = gl.createSampler();
        sampler3 = gl.createSampler();
        gl.bindSampler(0, sampler1);
        gl.bindSampler(0, sampler2);
        gl.bindSampler(0, sampler1);
        gl.samplerParameteri(sampler1, gl.TEXTURE_COMPARE_MODE, compareMode);
        gl.samplerParameteri(sampler1, gl.TEXTURE_COMPARE_FUNC, compareFunc);
        gl.samplerParameteri(sampler1, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.samplerParameteri(sampler1, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    } catch(e) {}

    try {
        gl.samplerParameteri(sampler2, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
        gl.samplerParameteri(sampler2, gl.TEXTURE_COMPARE_FUNC, gl.GREATER);
        gl.samplerParameteri(sampler2, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.samplerParameteri(sampler2, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.bindSampler(0, sampler2);
        gl.bindSampler(0, sampler3);
    } catch(e) {}

    try {
        gl.samplerParameteri(sampler3, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
        gl.samplerParameteri(sampler3, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.samplerParameteri(sampler3, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.samplerParameteri(sampler3, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.samplerParameteri(sampler3, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.bindSampler(0, sampler1);
    } catch(e) {}

    try {
        const buffer = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(bufferTarget, buffer);
        gl.bufferData(bufferTarget, new Float32Array([
            -1, -1, 0, 0, 0.5,
             1, -1, 1, 0, 0.8,
             1,  1, 1, 1, 0.3,
            -1, -1, 0, 0, 0.5,
             1,  1, 1, 1, 0.3,
            -1,  1, 0, 1, 0.2
        ]), gl.STATIC_DRAW);
    } catch(e) {}

    const vertexShaderSource = `#version 300 es
        in vec2 aPosition;
        in vec2 aTexCoord;
        in float aDepthRef;
        out vec2 vTexCoord;
        out float vDepthRef;
        void main() {
            gl_Position = vec4(aPosition, 0.0, 1.0);
            vTexCoord = aTexCoord;
            vDepthRef = aDepthRef;
        }
    `;

    const fragmentShaderSource = `#version 300 es
        precision highp float;
        precision highp sampler2DShadow;
        in vec2 vTexCoord;
        in float vDepthRef;
        uniform sampler2DShadow uShadowMap;
        out vec4 fragColor;
        void main() {
            float shadow = texture(uShadowMap, vec3(vTexCoord, vDepthRef));
            fragColor = vec4(vec3(shadow), 1.0);
        }
    `;

    try {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(vertexShader, vertexShaderSource);
        gl.shaderSource(fragmentShader, fragmentShaderSource);
        gl.compileShader(vertexShader);
        gl.compileShader(fragmentShader);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);
        const aPosition = gl.getAttribLocation(program, 'aPosition');
        const aTexCoord = gl.getAttribLocation(program, 'aTexCoord');
        const aDepthRef = gl.getAttribLocation(program, 'aDepthRef');
        const uShadowMap = gl.getUniformLocation(program, 'uShadowMap');
        gl.enableVertexAttribArray(aPosition);
        gl.enableVertexAttribArray(aTexCoord);
        gl.enableVertexAttribArray(aDepthRef);
        gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 20, 0);
        gl.vertexAttribPointer(aTexCoord, 2, gl.FLOAT, false, 20, 8);
        gl.vertexAttribPointer(aDepthRef, 1, gl.FLOAT, false, 20, 16);
        gl.uniform1i(uShadowMap, 0);
    } catch(e) {}

    try {
        fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depthTex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, texSize, texSize);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    } catch(e) {}

    try {
        gl.bindSampler(0, sampler1);
        gl.viewport(0, 0, texSize, texSize);
        gl.clearColor(0.2, 0.2, 0.2, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
        gl.bindSampler(0, sampler2);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
        gl.bindSampler(0, sampler3);
        gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindSampler(0, sampler1);
        gl.bindSampler(0, sampler1);
        gl.samplerParameteri(sampler1, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.deleteSampler(sampler1);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

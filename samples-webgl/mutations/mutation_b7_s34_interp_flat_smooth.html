<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }
    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    const varyingCount = 8;
    const vertexCount = 12;
    const interpolationModes = 3;
    const bufferSize = vertexCount * 16;
    const triangleSize = 0.4;

    const bufferTarget = gl.ARRAY_BUFFER;
    const bufferUsage = gl.STATIC_DRAW;
    const primitiveType = gl.TRIANGLES;

    const vertexShader = `#version 300 es
    in vec2 a_position;
    in vec4 a_color1;
    in vec4 a_color2;
    in vec4 a_color3;
    in vec2 a_data1;
    in vec2 a_data2;
    in float a_index;

    flat out vec4 v_flat_color;
    smooth out vec4 v_smooth_color;
    centroid out vec4 v_centroid_color;
    flat out int v_flat_index;
    smooth out vec2 v_smooth_data;
    centroid out vec2 v_centroid_data;
    out vec2 v_default_data;

    void main() {
        v_flat_color = a_color1;
        v_smooth_color = a_color2;
        v_centroid_color = a_color3;
        v_flat_index = int(a_index);
        v_smooth_data = a_data1;
        v_centroid_data = a_data2;
        v_default_data = a_data1 + a_data2;
        gl_Position = vec4(a_position, 0.0, 1.0);
    }
    `;

    const fragmentShader = `#version 300 es
    precision highp float;

    flat in vec4 v_flat_color;
    smooth in vec4 v_smooth_color;
    centroid in vec4 v_centroid_color;
    flat in int v_flat_index;
    smooth in vec2 v_smooth_data;
    centroid in vec2 v_centroid_data;
    in vec2 v_default_data;

    out vec4 fragColor;

    void main() {
        vec4 flatComponent = v_flat_color;
        vec4 smoothComponent = v_smooth_color * (0.5 + 0.5 * v_smooth_data.x);
        vec4 centroidComponent = v_centroid_color * (0.5 + 0.5 * v_centroid_data.y);
        float indexFactor = float(v_flat_index % 4) * 0.2;
        vec4 defaultComponent = vec4(v_default_data, 0.5, 1.0) * 0.3;
        fragColor = flatComponent * 0.4 + smoothComponent * 0.3 + centroidComponent * 0.3 + defaultComponent * indexFactor;
    }
    `;

    try {
        const positions = new Float32Array([
            -0.8, -0.8, -0.4, -0.8, -0.6, -0.4,
            -0.2, -0.8, 0.2, -0.8, 0.0, -0.4,
            0.4, -0.8, 0.8, -0.8, 0.6, -0.4,
            -0.8, 0.0, -0.4, 0.0, -0.6, 0.4
        ]);
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, positions, bufferUsage);
        gl.bufferData(bufferTarget, 2048, bufferUsage);
        gl.bufferData(bufferTarget, positions, bufferUsage);
    } catch(e) {}

    try {
        const colors1 = new Float32Array(vertexCount * 4);
        const colors2 = new Float32Array(vertexCount * 4);
        const colors3 = new Float32Array(vertexCount * 4);
        for (let i = 0; i < vertexCount; i++) {
            const t = i / vertexCount;
            colors1[i * 4 + 0] = 1.0;
            colors1[i * 4 + 1] = 0.2;
            colors1[i * 4 + 2] = 0.2;
            colors1[i * 4 + 3] = 1.0;
            colors2[i * 4 + 0] = 0.2;
            colors2[i * 4 + 1] = 1.0;
            colors2[i * 4 + 2] = 0.2;
            colors2[i * 4 + 3] = 1.0;
            colors3[i * 4 + 0] = 0.2;
            colors3[i * 4 + 1] = 0.2;
            colors3[i * 4 + 2] = 1.0;
            colors3[i * 4 + 3] = 1.0;
        }
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, colors1, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, colors2, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bufferData(bufferTarget, colors3, bufferUsage);
    } catch(e) {}

    try {
        const data1 = new Float32Array(vertexCount * 2);
        const data2 = new Float32Array(vertexCount * 2);
        const indices = new Float32Array(vertexCount);
        for (let i = 0; i < vertexCount; i++) {
            data1[i * 2 + 0] = Math.cos(i * 0.5);
            data1[i * 2 + 1] = Math.sin(i * 0.5);
            data2[i * 2 + 0] = Math.cos(i * 0.7 + 1.0);
            data2[i * 2 + 1] = Math.sin(i * 0.7 + 1.0);
            indices[i] = i;
        }
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bindBuffer(bufferTarget, buffer1);
        gl.bufferData(bufferTarget, data1, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.bufferData(bufferTarget, data2, bufferUsage);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.bufferData(bufferTarget, indices, bufferUsage);
    } catch(e) {}

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(vs, vertexShader);
        gl.shaderSource(fs, fragmentShader);
        gl.compileShader(vs);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vs));
        }
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fs));
        }
        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
        gl.useProgram(program);
        gl.useProgram(null);
        gl.useProgram(program);
    } catch(e) {}

    try {
        const vao1 = gl.createVertexArray();
        const vao2 = gl.createVertexArray();
        gl.bindVertexArray(vao1);
        gl.bindVertexArray(vao2);
        gl.bindVertexArray(vao1);
        const posLoc = gl.getAttribLocation(program, 'a_position');
        const color1Loc = gl.getAttribLocation(program, 'a_color1');
        const color2Loc = gl.getAttribLocation(program, 'a_color2');
        const color3Loc = gl.getAttribLocation(program, 'a_color3');
        const data1Loc = gl.getAttribLocation(program, 'a_data1');
        const data2Loc = gl.getAttribLocation(program, 'a_data2');
        const indexLoc = gl.getAttribLocation(program, 'a_index');
        gl.enableVertexAttribArray(posLoc);
        gl.disableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(posLoc);
        gl.enableVertexAttribArray(color1Loc);
        gl.enableVertexAttribArray(color2Loc);
        gl.disableVertexAttribArray(color2Loc);
        gl.enableVertexAttribArray(color2Loc);
        gl.enableVertexAttribArray(color3Loc);
        gl.enableVertexAttribArray(data1Loc);
        gl.enableVertexAttribArray(data2Loc);
        gl.enableVertexAttribArray(indexLoc);
    } catch(e) {}

    try {
        const posLoc = gl.getAttribLocation(program, 'a_position');
        const color1Loc = gl.getAttribLocation(program, 'a_color1');
        const color2Loc = gl.getAttribLocation(program, 'a_color2');
        const color3Loc = gl.getAttribLocation(program, 'a_color3');
        const data1Loc = gl.getAttribLocation(program, 'a_data1');
        const data2Loc = gl.getAttribLocation(program, 'a_data2');
        const indexLoc = gl.getAttribLocation(program, 'a_index');
        const buffer1 = gl.createBuffer();
        const buffer2 = gl.createBuffer();
        const buffer3 = gl.createBuffer();
        const buffer4 = gl.createBuffer();
        const buffer5 = gl.createBuffer();
        const buffer6 = gl.createBuffer();
        const buffer7 = gl.createBuffer();
        gl.bindBuffer(bufferTarget, buffer1);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(bufferTarget, buffer2);
        gl.vertexAttribPointer(color1Loc, 4, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(bufferTarget, buffer3);
        gl.vertexAttribPointer(color2Loc, 4, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(bufferTarget, buffer4);
        gl.vertexAttribPointer(color3Loc, 4, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(bufferTarget, buffer5);
        gl.vertexAttribPointer(data1Loc, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(bufferTarget, buffer6);
        gl.vertexAttribPointer(data2Loc, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(bufferTarget, buffer7);
        gl.vertexAttribPointer(indexLoc, 1, gl.FLOAT, false, 0, 0);
    } catch(e) {}

    try {
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.BLEND);
        gl.disable(gl.BLEND);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.blendEquation(gl.FUNC_ADD);
        gl.disable(gl.CULL_FACE);
        gl.enable(gl.CULL_FACE);
        gl.disable(gl.CULL_FACE);
    } catch(e) {}

    try {
        gl.drawArrays(primitiveType, 0, vertexCount);
        gl.drawArrays(primitiveType, 0, 18);
        gl.drawArrays(primitiveType, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLE_FAN, 0, 9);
        gl.drawArrays(primitiveType, 0, vertexCount);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 15);
        gl.drawArrays(primitiveType, 0, vertexCount);
    } catch(e) {}

    try {
        gl.bindBuffer(bufferTarget, null);
        gl.bindVertexArray(null);
        gl.useProgram(null);
        const delBuffer = gl.createBuffer();
        gl.bindBuffer(bufferTarget, delBuffer);
        gl.deleteBuffer(delBuffer);
        gl.bindBuffer(bufferTarget, delBuffer);
        gl.bufferData(bufferTarget, 256, gl.STATIC_DRAW);
    } catch(e) {}
}

main().catch(err => { throw err; });
</script>
</body>
</html>

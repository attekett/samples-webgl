<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let syncCount = 4;
    let waitTimeout = 1000000000;
    let drawCount = 8;
    let renderIterations = 3;
    let syncDelay = 500;
    let timeoutVariation = 50000000;
    let flushInterval = 2;

    const SYNC_GPU_COMMANDS_COMPLETE = 0x9117;
    const ALREADY_SIGNALED = 0x911A;
    const TIMEOUT_EXPIRED = 0x911B;
    const CONDITION_SATISFIED = 0x911C;
    const WAIT_FAILED = 0x911D;
    const SYNC_FLUSH_COMMANDS_BIT = 0x00000001;

    let syncCondition = SYNC_GPU_COMMANDS_COMPLETE;
    let waitFlags = SYNC_FLUSH_COMMANDS_BIT;
    let bufferTarget = gl.ARRAY_BUFFER;
    let textureTarget = gl.TEXTURE_2D;

    const vertexShader = `#version 300 es
        in vec2 a_position;
        in vec3 a_color;
        out vec3 v_color;
        uniform float u_time;
        void main() {
            vec2 pos = a_position;
            pos.x += sin(u_time + float(gl_VertexID)) * 0.1;
            pos.y += cos(u_time + float(gl_VertexID)) * 0.1;
            gl_Position = vec4(pos, 0.0, 1.0);
            v_color = a_color;
        }
    `;

    const fragmentShader = `#version 300 es
        precision highp float;
        in vec3 v_color;
        out vec4 fragColor;
        uniform float u_brightness;
        void main() {
            fragColor = vec4(v_color * u_brightness, 1.0);
        }
    `;

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vertexShader);
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vs));
        }

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fragmentShader);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fs));
        }

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
    } catch (e) {
        throw e;
    }

    const vertices = new Float32Array([
        -0.5, -0.5,  1.0, 0.0, 0.0,
         0.5, -0.5,  0.0, 1.0, 0.0,
         0.0,  0.5,  0.0, 0.0, 1.0,
        -0.3,  0.2,  1.0, 1.0, 0.0,
         0.3,  0.2,  0.0, 1.0, 1.0,
         0.0, -0.3,  1.0, 0.0, 1.0
    ]);

    let vbo;
    try {
        vbo = gl.createBuffer();
        gl.bindBuffer(bufferTarget, vbo);
        gl.bufferData(bufferTarget, vertices, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.DYNAMIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
    } catch (e) {
        throw e;
    }

    let vao;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);

        const posLoc = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 20, 0);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 20, 0);

        const colorLoc = gl.getAttribLocation(program, 'a_color');
        gl.enableVertexAttribArray(colorLoc);
        gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 20, 8);
        gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 20, 8);

        gl.bindVertexArray(null);
    } catch (e) {
        throw e;
    }

    const texture = gl.createTexture();
    gl.bindTexture(textureTarget, texture);
    gl.texImage2D(textureTarget, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(textureTarget, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(textureTarget, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.bindTexture(textureTarget, null);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindTexture(gl.TEXTURE_2D, null);

    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
        throw new Error("Framebuffer incomplete");
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    let syncs = [];

    try {
        gl.useProgram(program);
        const timeLoc = gl.getUniformLocation(program, 'u_time');
        const brightnessLoc = gl.getUniformLocation(program, 'u_brightness');

        for (let iter = 0; iter < renderIterations; iter++) {
            for (let i = 0; i < drawCount; i++) {
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.viewport(0, 0, 256, 256);
                gl.clearColor(0.1 + i * 0.05, 0.1, 0.2, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);

                gl.bindVertexArray(vao);
                gl.uniform1f(timeLoc, i * 0.5);
                gl.uniform1f(brightnessLoc, 0.8 + i * 0.02);
                gl.drawArrays(gl.TRIANGLES, 0, 6);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                gl.bindVertexArray(null);

                if (i % flushInterval === 0) {
                    gl.flush();
                }

                const sync = gl.fenceSync(syncCondition, 0);
                if (sync) {
                    syncs.push(sync);
                }
                const syncDup = gl.fenceSync(SYNC_GPU_COMMANDS_COMPLETE, 0);
                if (syncDup) {
                    syncs.push(syncDup);
                }
            }

            for (let j = 0; j < syncs.length; j++) {
                const currentTimeout = waitTimeout + (j * timeoutVariation);
                const status = gl.clientWaitSync(syncs[j], waitFlags, currentTimeout);
                gl.clientWaitSync(syncs[j], 0, currentTimeout - timeoutVariation);
                gl.clientWaitSync(syncs[j], SYNC_FLUSH_COMMANDS_BIT, waitTimeout);
            }

            for (let k = syncs.length - 1; k >= 0; k--) {
                gl.deleteSync(syncs[k]);
            }
            syncs = [];
        }
    } catch (e) {
        throw e;
    }

    try {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, 256, 256);
        gl.clearColor(0.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.bindVertexArray(vao);
        const timeLoc = gl.getUniformLocation(program, 'u_time');
        const brightnessLoc = gl.getUniformLocation(program, 'u_brightness');
        gl.uniform1f(timeLoc, 1.5);
        gl.uniform1f(brightnessLoc, 1.0);
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        const finalSync = gl.fenceSync(SYNC_GPU_COMMANDS_COMPLETE, 0);
        if (finalSync) {
            gl.flush();
            const result = gl.clientWaitSync(finalSync, SYNC_FLUSH_COMMANDS_BIT, waitTimeout);
            gl.deleteSync(finalSync);
        }
    } catch (e) {
        throw e;
    }

    try {
        const stressSync1 = gl.fenceSync(SYNC_GPU_COMMANDS_COMPLETE, 0);
        const stressSync2 = gl.fenceSync(SYNC_GPU_COMMANDS_COMPLETE, 0);
        const stressSync3 = gl.fenceSync(SYNC_GPU_COMMANDS_COMPLETE, 0);

        if (stressSync1) {
            gl.clientWaitSync(stressSync1, 0, 0);
            gl.clientWaitSync(stressSync1, SYNC_FLUSH_COMMANDS_BIT, waitTimeout);
            gl.deleteSync(stressSync1);
        }

        if (stressSync2) {
            gl.clientWaitSync(stressSync2, waitFlags, waitTimeout * 2);
            gl.deleteSync(stressSync2);
        }

        if (stressSync3) {
            gl.flush();
            gl.clientWaitSync(stressSync3, SYNC_FLUSH_COMMANDS_BIT, waitTimeout / 2);
            gl.deleteSync(stressSync3);
        }
    } catch (e) {
        throw e;
    }

    gl.flush();
    gl.finish();
}

main().catch(err => { throw err; });
</script>
</body>
</html>

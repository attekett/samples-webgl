<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 not supported");

    const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
    if (missingExtensions.length > 0) {
        throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
    }

    REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

    let queryCount = 8;
    let drawCount = 12;
    let primitiveCount = 100;
    let occlusionIterations = 3;
    let resultCheckDelay = 50;
    let depthTestVariations = 4;

    const ANY_SAMPLES_PASSED = 0x8C2F;
    const ANY_SAMPLES_PASSED_CONSERVATIVE = 0x8D6A;
    const QUERY_RESULT = 0x8866;
    const QUERY_RESULT_AVAILABLE = 0x8867;

    let queryTarget = ANY_SAMPLES_PASSED;
    let bufferTarget = gl.ARRAY_BUFFER;
    let depthFunc = gl.LESS;
    let cullMode = gl.BACK;

    const vertexShader = `#version 300 es
        in vec3 a_position;
        in vec3 a_normal;
        out vec3 v_normal;
        uniform mat4 u_mvp;
        uniform float u_depth;
        void main() {
            vec3 pos = a_position;
            pos.z += u_depth;
            gl_Position = u_mvp * vec4(pos, 1.0);
            v_normal = a_normal;
        }
    `;

    const fragmentShader = `#version 300 es
        precision highp float;
        in vec3 v_normal;
        out vec4 fragColor;
        uniform vec3 u_color;
        void main() {
            vec3 normal = normalize(v_normal);
            float light = max(dot(normal, vec3(0.0, 0.0, 1.0)), 0.3);
            fragColor = vec4(u_color * light, 1.0);
        }
    `;

    let program;
    try {
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, vertexShader);
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(vs));
        }

        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, fragmentShader);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(fs));
        }

        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program));
        }
    } catch (e) {
        throw e;
    }

    function createCubeVertices() {
        return new Float32Array([
            -0.3, -0.3, -0.3,  0.0,  0.0, -1.0,
             0.3, -0.3, -0.3,  0.0,  0.0, -1.0,
             0.3,  0.3, -0.3,  0.0,  0.0, -1.0,
            -0.3,  0.3, -0.3,  0.0,  0.0, -1.0,
            -0.3, -0.3,  0.3,  0.0,  0.0,  1.0,
             0.3, -0.3,  0.3,  0.0,  0.0,  1.0,
             0.3,  0.3,  0.3,  0.0,  0.0,  1.0,
            -0.3,  0.3,  0.3,  0.0,  0.0,  1.0,
            -0.3, -0.3, -0.3, -1.0,  0.0,  0.0,
            -0.3,  0.3, -0.3, -1.0,  0.0,  0.0,
            -0.3,  0.3,  0.3, -1.0,  0.0,  0.0,
            -0.3, -0.3,  0.3, -1.0,  0.0,  0.0,
             0.3, -0.3, -0.3,  1.0,  0.0,  0.0,
             0.3,  0.3, -0.3,  1.0,  0.0,  0.0,
             0.3,  0.3,  0.3,  1.0,  0.0,  0.0,
             0.3, -0.3,  0.3,  1.0,  0.0,  0.0
        ]);
    }

    const cubeIndices = new Uint16Array([
        0, 1, 2,  0, 2, 3,
        4, 5, 6,  4, 6, 7,
        8, 9, 10,  8, 10, 11,
        12, 13, 14,  12, 14, 15
    ]);

    let vbo;
    try {
        const vertices = createCubeVertices();
        vbo = gl.createBuffer();
        gl.bindBuffer(bufferTarget, vbo);
        gl.bufferData(bufferTarget, vertices, gl.STATIC_DRAW);
        gl.bindBuffer(bufferTarget, null);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
    } catch (e) {
        throw e;
    }

    let ibo;
    try {
        ibo = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, cubeIndices, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
    } catch (e) {
        throw e;
    }

    let vao;
    try {
        vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);

        const posLoc = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 24, 0);

        const normalLoc = gl.getAttribLocation(program, 'a_normal');
        gl.enableVertexAttribArray(normalLoc);
        gl.vertexAttribPointer(normalLoc, 3, gl.FLOAT, false, 24, 12);
        gl.vertexAttribPointer(normalLoc, 3, gl.FLOAT, false, 24, 12);

        gl.bindVertexArray(null);
    } catch (e) {
        throw e;
    }

    function createMVPMatrix(offset, rotation) {
        const mat = new Float32Array(16);
        mat[0] = Math.cos(rotation);
        mat[1] = Math.sin(rotation);
        mat[2] = 0;
        mat[3] = 0;
        mat[4] = -Math.sin(rotation);
        mat[5] = Math.cos(rotation);
        mat[6] = 0;
        mat[7] = 0;
        mat[8] = 0;
        mat[9] = 0;
        mat[10] = 1;
        mat[11] = 0;
        mat[12] = offset[0];
        mat[13] = offset[1];
        mat[14] = offset[2];
        mat[15] = 1;
        return mat;
    }

    let queries = [];
    try {
        for (let i = 0; i < queryCount; i++) {
            const query = gl.createQuery();
            if (query) {
                queries.push(query);
            }
        }
    } catch (e) {
        throw e;
    }

    try {
        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(depthFunc);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(cullMode);
        gl.clearColor(0.1, 0.1, 0.1, 1.0);
        gl.clearDepth(1.0);

        gl.useProgram(program);
        const mvpLoc = gl.getUniformLocation(program, 'u_mvp');
        const depthLoc = gl.getUniformLocation(program, 'u_depth');
        const colorLoc = gl.getUniformLocation(program, 'u_color');

        for (let iter = 0; iter < occlusionIterations; iter++) {
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.viewport(0, 0, 256, 256);

            for (let i = 0; i < drawCount; i++) {
                const queryIdx = i % queries.length;
                const query = queries[queryIdx];

                const offset = [
                    Math.sin(i * 0.5) * 0.3,
                    Math.cos(i * 0.5) * 0.3,
                    -0.5 - (i * 0.1)
                ];
                const rotation = i * 0.3;
                const mvp = createMVPMatrix(offset, rotation);

                gl.uniformMatrix4fv(mvpLoc, false, mvp);
                gl.uniform1f(depthLoc, i * 0.05);
                gl.uniform3f(colorLoc, (i % 3) * 0.3 + 0.3, (i % 4) * 0.2 + 0.3, (i % 5) * 0.15 + 0.3);

                gl.bindVertexArray(vao);

                gl.beginQuery(queryTarget, query);
                gl.beginQuery(queryTarget, query);
                gl.drawElements(gl.TRIANGLES, cubeIndices.length, gl.UNSIGNED_SHORT, 0);
                gl.endQuery(queryTarget);
                gl.endQuery(queryTarget);

                if (i % 3 === 0) {
                    gl.depthFunc(gl.LEQUAL);
                    gl.depthFunc(depthFunc);
                }
            }

            gl.bindVertexArray(null);
            gl.flush();
        }
    } catch (e) {
        throw e;
    }

    try {
        let resultsPending = true;
        let checkCount = 0;
        while (resultsPending && checkCount < 100) {
            resultsPending = false;
            for (let i = 0; i < queries.length; i++) {
                const available = gl.getQueryParameter(queries[i], QUERY_RESULT_AVAILABLE);
                if (available) {
                    const result = gl.getQueryParameter(queries[i], QUERY_RESULT);
                } else {
                    resultsPending = true;
                }
            }
            checkCount++;
        }
    } catch (e) {
        throw e;
    }

    try {
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.bindVertexArray(vao);
        const mvpLoc = gl.getUniformLocation(program, 'u_mvp');
        const depthLoc = gl.getUniformLocation(program, 'u_depth');
        const colorLoc = gl.getUniformLocation(program, 'u_color');

        const mvp = createMVPMatrix([0.0, 0.0, -0.5], 0.5);
        gl.uniformMatrix4fv(mvpLoc, false, mvp);
        gl.uniform1f(depthLoc, 0.0);
        gl.uniform3f(colorLoc, 0.8, 0.4, 0.6);

        const finalQuery = gl.createQuery();
        gl.beginQuery(ANY_SAMPLES_PASSED_CONSERVATIVE, finalQuery);
        gl.drawElements(gl.TRIANGLES, cubeIndices.length, gl.UNSIGNED_SHORT, 0);
        gl.endQuery(ANY_SAMPLES_PASSED_CONSERVATIVE);

        gl.flush();

        let available = false;
        let attempts = 0;
        while (!available && attempts < 50) {
            available = gl.getQueryParameter(finalQuery, QUERY_RESULT_AVAILABLE);
            attempts++;
        }

        if (available) {
            const result = gl.getQueryParameter(finalQuery, QUERY_RESULT);
        }

        gl.deleteQuery(finalQuery);
    } catch (e) {
        throw e;
    }

    try {
        for (let i = 0; i < queries.length; i++) {
            gl.deleteQuery(queries[i]);
        }
    } catch (e) {
        throw e;
    }

    gl.flush();
    gl.finish();
}

main().catch(err => { throw err; });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
// CONFIGURATION: Define required extensions here
const REQUIRED_EXTENSIONS = [
 // No extensions required for this core WebGL ping-pong texturing test
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
 if (!gl) throw new Error("WebGL not supported");

 // 1. EXTENSION GATING
 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 // Signal to the Test Runner that this is an environment limit, not a code bug
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS
 REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // FUZZING VARIABLES: Mix inline literals with parameterized variables
 const pingPongPasses = 50;
 const textureWidth = 256;
 const blendEquation = gl.FUNC_ADD;
 const stateChangeCount = 25;

 // Create two textures for ping-pong
 const textureA = gl.createTexture();
 const textureB = gl.createTexture();

 // Initialize texture A with base pattern
 gl.bindTexture(gl.TEXTURE_2D, textureA);
 gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureWidth, textureWidth, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

 // Initialize texture B with different pattern
 gl.bindTexture(gl.TEXTURE_2D, textureB);
 gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, textureWidth, textureWidth, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

 // Create two framebuffers
 const fbo1 = gl.createFramebuffer();
 const fbo2 = gl.createFramebuffer();

 // Attach texture A to FBO1
 gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
 gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, textureA, 0);

 // Attach texture B to FBO2
 gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
 gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, textureB, 0);

 // Create shaders for ping-pong rendering
 const vertexShaderSource = `
 attribute vec2 a_position;
 varying vec2 v_texCoord;
 void main() {
   gl_Position = vec4(a_position, 0.0, 1.0);
   v_texCoord = a_position * 0.5 + 0.5;
 }
 `;

 const fragmentShaderSource = `
 precision mediump float;
 uniform sampler2D u_texture;
 uniform float u_time;
 uniform float u_pass;
 varying vec2 v_texCoord;
 void main() {
   vec4 color = texture2D(u_texture, v_texCoord);

   // Add some visual effects based on pass number
   float phase = u_pass * 0.1 + u_time;
   color.r += sin(phase) * 0.1;
   color.g += cos(phase * 1.3) * 0.1;
   color.b += sin(phase * 0.7) * 0.1;

   // Add some geometric patterns
   float dist = distance(v_texCoord, vec2(0.5));
   color.rgb += vec3(sin(dist * 10.0 + u_pass) * 0.05);

   gl_FragColor = color;
 }
 `;

 // Compile shaders
 const vertexShader = gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vertexShader, vertexShaderSource);
 gl.compileShader(vertexShader);

 const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fragmentShader, fragmentShaderSource);
 gl.compileShader(fragmentShader);

 // Create program
 const program = gl.createProgram();
 gl.attachShader(program, vertexShader);
 gl.attachShader(program, fragmentShader);
 gl.linkProgram(program);
 gl.useProgram(program);

 // Get attribute and uniform locations
 const positionLocation = gl.getAttribLocation(program, 'a_position');
 const textureLocation = gl.getUniformLocation(program, 'u_texture');
 const timeLocation = gl.getUniformLocation(program, 'u_time');
 const passLocation = gl.getUniformLocation(program, 'u_pass');

 // Create fullscreen quad
 const positions = new Float32Array([
   -1, -1,
    1, -1,
   -1,  1,
    1,  1,
 ]);

 const positionBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

 // STATE POISONING: Enable/disable capabilities redundantly
 const capabilities = [gl.BLEND, gl.CULL_FACE, gl.DEPTH_TEST, gl.SCISSOR_TEST, gl.STENCIL_TEST];
 for (let i = 0; i < stateChangeCount; i++) {
   capabilities.forEach(cap => {
     gl.enable(cap);
     gl.disable(cap);
   });
 }

 // Bind initial texture
 gl.activeTexture(gl.TEXTURE0);
 gl.uniform1i(textureLocation, 0);

 // Enable vertex array
 gl.enableVertexAttribArray(positionLocation);
 gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

 // PING-PONG LOOP: 50 iterations
 let currentTime = 0;
 for (let pass = 0; pass < pingPongPasses; pass++) {
   // STATE CHANGES BETWEEN PASSES: Blend modes and parameters
   if (pass % 2 === 0) {
     gl.enable(gl.BLEND);
     gl.blendEquation(blendEquation);
     gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
   } else {
     gl.disable(gl.BLEND);
     gl.blendEquation(gl.FUNC_SUBTRACT);
     gl.blendFunc(gl.ONE, gl.ONE);
   }

   // MORE STATE POISONING: Change viewport and scissor
   gl.viewport(0, 0, textureWidth, textureWidth);
   gl.scissor(pass % textureWidth, pass % textureWidth, textureWidth - pass % textureWidth, textureWidth - pass % textureWidth);

   // Bind appropriate framebuffer and texture for this pass
   if (pass % 2 === 0) {
     // Even pass: render to FBO1 using texture B
     gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
     gl.bindTexture(gl.TEXTURE_2D, textureB);
   } else {
     // Odd pass: render to FBO2 using texture A
     gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
     gl.bindTexture(gl.TEXTURE_2D, textureA);
   }

   // Update uniforms
   gl.uniform1f(timeLocation, currentTime);
   gl.uniform1f(passLocation, pass);

   // Clear with pass-dependent color
   const clearR = (pass % 3) / 3.0;
   const clearG = ((pass + 1) % 3) / 3.0;
   const clearB = ((pass + 2) % 3) / 3.0;
   gl.clearColor(clearR, clearG, clearB, 1.0);
   gl.clear(gl.COLOR_BUFFER_BIT);

   // Draw quad
   gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

   // MORE STATE CHANGES: Toggle depth test and cull face
   if (pass % 3 === 0) {
     gl.enable(gl.DEPTH_TEST);
     gl.depthFunc(gl.LESS);
   } else if (pass % 3 === 1) {
     gl.disable(gl.DEPTH_TEST);
     gl.enable(gl.CULL_FACE);
     gl.cullFace(gl.BACK);
   } else {
     gl.disable(gl.CULL_FACE);
   }

   // Advance time for animation
   currentTime += 0.1;
 }

 // FINAL RENDER TO CANVAS: Use the result from the last pass
 gl.bindFramebuffer(gl.FRAMEBUFFER, null);
 gl.viewport(0, 0, 256, 256);

 // Bind the texture from the last pass
 if (pingPongPasses % 2 === 0) {
   gl.bindTexture(gl.TEXTURE_2D, textureA);
 } else {
   gl.bindTexture(gl.TEXTURE_2D, textureB);
 }

 // Final state changes
 gl.disable(gl.BLEND);
 gl.disable(gl.DEPTH_TEST);
 gl.disable(gl.CULL_FACE);
 gl.disable(gl.SCISSOR_TEST);
 gl.disable(gl.STENCIL_TEST);

 // Clear canvas
 gl.clearColor(0.0, 0.0, 0.0, 1.0);
 gl.clear(gl.COLOR_BUFFER_BIT);

 // Draw final result
 gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

 // ADDITIONAL STATE POISONING: Redundant binding/unbinding
 for (let i = 0; i < 10; i++) {
   gl.bindTexture(gl.TEXTURE_2D, textureA);
   gl.bindTexture(gl.TEXTURE_2D, textureB);
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo1);
   gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
   gl.bindFramebuffer(gl.FRAMEBUFFER, null);
 }

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
 throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 // If the error string contains "UNSUPPORTED_EXTENSIONS", the Python runner
 // knows to log it to UNSUPPORTED.md and skip.
 // Otherwise, it counts as a test failure/crash.
 console.error(err); // Allowed for debugging, but DOM update is primary signal
});
</script>
</body>
</html>

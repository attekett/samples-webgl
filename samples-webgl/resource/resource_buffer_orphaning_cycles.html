<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
// CONFIGURATION: Define required extensions here
const REQUIRED_EXTENSIONS = [
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
 if (!gl) throw new Error("WebGL not supported");

 // 1. EXTENSION GATING
 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 // Signal to the Test Runner that this is an environment limit, not a code bug
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS
 REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // Configuration variables for fuzzing (mix inline literals with variables)
 const bufferCount = 50;
 const orphanCycles = 10;
 const bufferSize = 1024;
 const subDataUpdates = 20;
 const vertexCount = 256;

 // STATE POISONING: Heavy capability churn (50+ state changes)
 for (let i = 0; i < 10; i++) {
   gl.enable(gl.BLEND);
   gl.disable(gl.BLEND);
   gl.enable(gl.CULL_FACE);
   gl.disable(gl.CULL_FACE);
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.DEPTH_TEST);
   gl.enable(gl.DITHER);
   gl.disable(gl.DITHER);
   gl.enable(gl.POLYGON_OFFSET_FILL);
   gl.disable(gl.POLYGON_OFFSET_FILL);
   gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
   gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
   gl.enable(gl.SAMPLE_COVERAGE);
   gl.disable(gl.SAMPLE_COVERAGE);
   gl.enable(gl.SCISSOR_TEST);
   gl.disable(gl.SCISSOR_TEST);
   gl.enable(gl.STENCIL_TEST);
   gl.disable(gl.STENCIL_TEST);
 }

 // Create buffers with varying usage patterns
 const vertexBuffers = [];
 const indexBuffers = [];

 for (let i = 0; i < bufferCount; i++) {
   // Create vertex buffer
   const vertexBuffer = gl.createBuffer();
   gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
   const vertexData = new Float32Array(bufferSize * (i % 3 + 1));
   for (let j = 0; j < vertexData.length; j++) {
     vertexData[j] = Math.sin(j * 0.01 + i) * Math.cos(j * 0.005 + i * 0.1);
   }
   gl.bufferData(gl.ARRAY_BUFFER, vertexData, i % 4 === 0 ? gl.STATIC_DRAW : i % 4 === 1 ? gl.DYNAMIC_DRAW : gl.STREAM_DRAW);
   vertexBuffers.push(vertexBuffer);

   // Create index buffer
   const indexBuffer = gl.createBuffer();
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
   const indexData = new Uint16Array(bufferSize / 4 * (i % 2 + 1));
   for (let j = 0; j < indexData.length; j++) {
     indexData[j] = j % vertexCount;
   }
   gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indexData, gl.STATIC_DRAW);
   indexBuffers.push(indexBuffer);

   // State changes during buffer creation
   gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
   gl.blendEquation(gl.FUNC_ADD);
   gl.cullFace(gl.BACK);
   gl.depthFunc(gl.LESS);
   gl.stencilFunc(gl.ALWAYS, 0, 0xFF);
   gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
 }

 // ORPHANING CYCLES: Stress buffer reallocation patterns with bufferData
 for (let cycle = 0; cycle < orphanCycles; cycle++) {
   for (let i = 0; i < vertexBuffers.length; i++) {
     gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffers[i]);

     // Orphan by reallocating with different size (bufferData orphans previous allocation)
     const newSize = bufferSize * (cycle % 3 + 1) * 4;
     gl.bufferData(gl.ARRAY_BUFFER, newSize, gl.DYNAMIC_DRAW);

     // Fill with new data pattern
     const updateData = new Float32Array(newSize / 4);
     for (let j = 0; j < updateData.length; j++) {
       updateData[j] = Math.sin(j * 0.02 + cycle + i) * Math.cos(j * 0.01 + cycle * 0.5);
     }
     gl.bufferData(gl.ARRAY_BUFFER, updateData, gl.DYNAMIC_DRAW);

     // State poisoning during orphaning
     gl.enable(gl.BLEND);
     gl.blendFunc(gl.ONE, gl.ONE);
     gl.depthMask(cycle % 2 === 0);
     gl.colorMask(i % 4 === 0, i % 4 === 1, i % 4 === 2, i % 4 === 3);
   }

   // Orphan index buffers too
   for (let i = 0; i < indexBuffers.length; i++) {
     gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffers[i]);
     const newIndexSize = (bufferSize / 4) * (cycle % 2 + 1) * 2;
     gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, newIndexSize, gl.STATIC_DRAW);

     const indexUpdateData = new Uint16Array(newIndexSize / 2);
     for (let j = 0; j < indexUpdateData.length; j++) {
       indexUpdateData[j] = j % vertexCount;
     }
     gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indexUpdateData, gl.STATIC_DRAW);
   }
 }

 // BUFFER SUBDATA UPDATES: Use bufferSubData to update portions of buffers
 for (let update = 0; update < subDataUpdates; update++) {
   for (let i = 0; i < vertexBuffers.length; i++) {
     gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffers[i]);

     // Update subset of buffer data using bufferSubData
     const offset = (update * 64) % (bufferSize * 4);
     const size = Math.min(256, bufferSize * 4 - offset);
     const subData = new Float32Array(size / 4);
     for (let j = 0; j < subData.length; j++) {
       subData[j] = Math.sin(j * 0.05 + update + i) + Math.cos(j * 0.03 + update * 0.2);
     }
     gl.bufferSubData(gl.ARRAY_BUFFER, offset, subData);

     // State changes during subdata updates
     gl.blendEquation(update % 3 === 0 ? gl.FUNC_ADD : update % 3 === 1 ? gl.FUNC_SUBTRACT : gl.FUNC_REVERSE_SUBTRACT);
     gl.depthFunc(update % 6 === 0 ? gl.NEVER : update % 6 === 1 ? gl.LESS : update % 6 === 2 ? gl.EQUAL : update % 6 === 3 ? gl.LEQUAL : update % 6 === 4 ? gl.GREATER : gl.ALWAYS);
   }

   // Update index buffers with bufferSubData
   for (let i = 0; i < indexBuffers.length; i++) {
     gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffers[i]);

     const indexOffset = (update * 32) % (bufferSize * 2);
     const indexSize = Math.min(128, bufferSize * 2 - indexOffset);
     const indexSubData = new Uint16Array(indexSize / 2);
     for (let j = 0; j < indexSubData.length; j++) {
       indexSubData[j] = (j + update + i) % vertexCount;
     }
     gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER, indexOffset, indexSubData);
   }
 }

 // Create shaders for visual demonstration
 const vertexShaderSource = `
   attribute vec2 position;
   attribute vec3 color;
   varying vec3 vColor;
   uniform float time;
   uniform float bufferRatio;
   uniform float orphanIntensity;
   void main() {
     gl_Position = vec4(position * bufferRatio, 0.0, 1.0);
     vColor = color + vec3(sin(time + position.x * orphanIntensity), cos(time + position.y * orphanIntensity), orphanIntensity * 0.5);
   }
 `;

 const fragmentShaderSource = `
   precision mediump float;
   varying vec3 vColor;
   void main() {
     gl_FragColor = vec4(vColor, 1.0);
   }
 `;

 // Compile shaders
 const vertexShader = gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vertexShader, vertexShaderSource);
 gl.compileShader(vertexShader);

 const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fragmentShader, fragmentShaderSource);
 gl.compileShader(fragmentShader);

 // Create program
 const program = gl.createProgram();
 gl.attachShader(program, vertexShader);
 gl.attachShader(program, fragmentShader);
 gl.linkProgram(program);
 gl.useProgram(program);

 // Get attribute/uniform locations
 const positionLocation = gl.getAttribLocation(program, 'position');
 const colorLocation = gl.getAttribLocation(program, 'color');
 const timeLocation = gl.getUniformLocation(program, 'time');
 const bufferRatioLocation = gl.getUniformLocation(program, 'bufferRatio');
 const orphanIntensityLocation = gl.getUniformLocation(program, 'orphanIntensity');

 // Create geometry for visual output
 const positions = [];
 const colors = [];
 const indices = [];

 // Create a grid of points showing buffer operation effects
 for (let x = 0; x < 16; x++) {
   for (let y = 0; y < 16; y++) {
     const px = (x - 8) / 8;
     const py = (y - 8) / 8;
     positions.push(px, py);
     colors.push(x / 16, y / 16, (x + y) / 32);
   }
 }

 for (let i = 0; i < 256; i++) {
   indices.push(i);
 }

 // Create final buffers for rendering
 const positionBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

 const colorBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);

 const indexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

 // Set up attributes
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.enableVertexAttribArray(positionLocation);
 gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

 gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
 gl.enableVertexAttribArray(colorLocation);
 gl.vertexAttribPointer(colorLocation, 3, gl.FLOAT, false, 0, 0);

 // Animation loop to show dynamic buffer effects
 let time = 0;
 function render() {
   time += 0.016;

   // Update uniforms to show buffer operation effects
   gl.uniform1f(timeLocation, time);
   gl.uniform1f(bufferRatioLocation, 0.8 + Math.sin(time * 0.5) * 0.2);
   gl.uniform1f(orphanIntensityLocation, 0.5 + Math.sin(time * 0.3) * 0.3);

   // Clear and draw
   gl.clearColor(0.1, 0.1, 0.1, 1.0);
   gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

   gl.drawElements(gl.POINTS, indices.length, gl.UNSIGNED_SHORT, 0);

   // Continue animation for visual feedback
   requestAnimationFrame(render);
 }

 render();

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
 throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 // If the error string contains "UNSUPPORTED_EXTENSIONS", the Python runner
 // knows to log it to UNSUPPORTED.md and skip.
 // Otherwise, it counts as a test failure/crash.
 console.error(err); // Allowed for debugging, but DOM update is primary signal
});
</script>
</body>
</html>

<script>

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 required");

    // HYPERCOMPLEX COMPUTE-TRANSFORM-MRT STORM
    // Biomass: Compute shaders + SSBO atomics + Transform Feedback + MRT + 3D Textures + Instancing + Queries + Sampler Objects

    const COMPUTE_WORKGROUPS = 32;
    const PARTICLE_COUNT = 1024;
    const MRT_TARGETS = 4;
    const TEXTURE_SIZE_3D = 16;
    const INSTANCE_BATCHES = 8;
    const QUERY_COUNT = 4;

    const TF_BUFFER_MODE = gl.SEPARATE_ATTRIBS;
    const BLEND_MODE_SRC = gl.SRC_ALPHA;
    const BLEND_MODE_DST = gl.ONE_MINUS_SRC_ALPHA;
    const TEX_WRAP_MODE = gl.REPEAT;
    const TEX_FILTER_MIN = gl.LINEAR_MIPMAP_LINEAR;
    const TEX_FILTER_MAG = gl.LINEAR;
    const DEPTH_COMPARE = gl.LEQUAL;
    const STENCIL_REF = 1;
    const CULL_MODE = gl.BACK;

    // INITIAL STATE SETUP
    gl.viewport(0, 0, 256, 256);
    gl.clearColor(0.02, 0.04, 0.08, 1.0);
    gl.clearDepth(1.0);
    gl.clearStencil(0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.STENCIL_TEST);
    gl.enable(gl.BLEND);
    gl.enable(gl.CULL_FACE);
    gl.depthFunc(DEPTH_COMPARE);
    gl.stencilFunc(gl.ALWAYS, STENCIL_REF, 0xFF);
    gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
    gl.blendFunc(BLEND_MODE_SRC, BLEND_MODE_DST);
    gl.cullFace(CULL_MODE);

    // 1. CREATE SSBOs FOR COMPUTE SHADER
    const ssboComputeIn = gl.createBuffer();
    gl.bindBuffer(gl.SHADER_STORAGE_BUFFER, ssboComputeIn);
    const computeInData = new Float32Array(PARTICLE_COUNT * 4);
    for (let i = 0; i < computeInData.length; i++) computeInData[i] = Math.sin(i * 0.01) * Math.random();
    gl.bufferData(gl.SHADER_STORAGE_BUFFER, computeInData, gl.DYNAMIC_COPY);
    gl.bindBufferBase(gl.SHADER_STORAGE_BUFFER, 0, ssboComputeIn);

    const ssboComputeOut = gl.createBuffer();
    gl.bindBuffer(gl.SHADER_STORAGE_BUFFER, ssboComputeOut);
    const computeOutData = new Float32Array(PARTICLE_COUNT * 4);
    gl.bufferData(gl.SHADER_STORAGE_BUFFER, computeOutData, gl.DYNAMIC_COPY);
    gl.bindBufferBase(gl.SHADER_STORAGE_BUFFER, 1, ssboComputeOut);

    const ssboAtomicCounter = gl.createBuffer();
    gl.bindBuffer(gl.ATOMIC_COUNTER_BUFFER, ssboAtomicCounter);
    const atomicData = new Uint32Array([0]);
    gl.bufferData(gl.ATOMIC_COUNTER_BUFFER, atomicData, gl.DYNAMIC_COPY);
    gl.bindBufferBase(gl.ATOMIC_COUNTER_BUFFER, 0, ssboAtomicCounter);

    // 2. CREATE 3D TEXTURE FOR VOLUMETRIC SAMPLING
    const volumeTexture = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_3D, volumeTexture);
    const volumeData = new Uint8Array(TEXTURE_SIZE_3D * TEXTURE_SIZE_3D * TEXTURE_SIZE_3D * 4);
    for (let i = 0; i < volumeData.length; i++) volumeData[i] = (i * 7) % 256;
    gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, TEXTURE_SIZE_3D, TEXTURE_SIZE_3D, TEXTURE_SIZE_3D, 0, gl.RGBA, gl.UNSIGNED_BYTE, volumeData);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, TEX_FILTER_MIN);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, TEX_FILTER_MAG);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_S, TEX_WRAP_MODE);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_T, TEX_WRAP_MODE);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_WRAP_R, TEX_WRAP_MODE);
    gl.generateMipmap(gl.TEXTURE_3D);

    // 3. CREATE SAMPLER OBJECTS
    const volumeSampler = gl.createSampler();
    gl.samplerParameteri(volumeSampler, gl.TEXTURE_MIN_FILTER, TEX_FILTER_MIN);
    gl.samplerParameteri(volumeSampler, gl.TEXTURE_MAG_FILTER, TEX_FILTER_MAG);
    gl.samplerParameteri(volumeSampler, gl.TEXTURE_WRAP_S, TEX_WRAP_MODE);
    gl.samplerParameteri(volumeSampler, gl.TEXTURE_WRAP_T, TEX_WRAP_MODE);
    gl.samplerParameteri(volumeSampler, gl.TEXTURE_WRAP_R, TEX_WRAP_MODE);

    const renderSampler = gl.createSampler();
    gl.samplerParameteri(renderSampler, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.samplerParameteri(renderSampler, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

    // 4. CREATE MRT FRAMEBUFFER
    const mrtFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, mrtFbo);
    const mrtTextures = [];
    for (let i = 0; i < MRT_TARGETS; i++) {
        const tex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE1 + i);
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, tex, 0);
        mrtTextures.push(tex);
    }
    const depthTex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE1 + MRT_TARGETS);
    gl.bindTexture(gl.TEXTURE_2D, depthTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH24_STENCIL8, 256, 256, 0, gl.DEPTH_STENCIL, gl.UNSIGNED_INT_24_8, null);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.TEXTURE_2D, depthTex, 0);

    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3]);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
        throw new Error("MRT framebuffer incomplete");
    }

    // 5. CREATE TRANSFORM FEEDBACK BUFFERS
    const tfBuffers = [];
    for (let i = 0; i < 3; i++) {
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        const data = new Float32Array(PARTICLE_COUNT * 4);
        for (let j = 0; j < data.length; j++) data[j] = Math.random() * 2.0 - 1.0;
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_COPY);
        tfBuffers.push(buf);
    }

    // 6. CREATE QUERY OBJECTS
    const queries = [];
    for (let i = 0; i < QUERY_COUNT; i++) {
        queries.push(gl.createQuery());
    }

    // COMPUTE SHADER: Updates particle data with atomics
    const computeShader = gl.createShader(gl.COMPUTE_SHADER);
    gl.shaderSource(computeShader, `
#version 310 es
layout(local_size_x = ${COMPUTE_LOCAL_SIZE}) in;

layout(std430, binding = 0) buffer InputBuffer {
    vec4 inputData[];
};

layout(std430, binding = 1) buffer OutputBuffer {
    vec4 outputData[];
};

layout(binding = 0) uniform atomic_uint counter;

uniform float time;
uniform vec3 params;

void main() {
    uint idx = gl_GlobalInvocationID.x;
    if (idx >= ${PARTICLE_COUNT}u) return;

    vec4 pos = inputData[idx];
    vec4 vel = inputData[idx + ${PARTICLE_COUNT}u];

    // Complex computation with atomics
    uint count = atomicCounterIncrement(counter);

    float t = time + float(count) * 0.001;
    vec3 force = vec3(sin(t + pos.x), cos(t + pos.y), sin(t * 0.7 + pos.z));
    vel.xyz += force * params.x;
    pos.xyz += vel.xyz * params.y;

    // Boundary conditions
    if (abs(pos.x) > 2.0) pos.x *= -0.9;
    if (abs(pos.y) > 2.0) pos.y *= -0.9;
    if (abs(pos.z) > 2.0) pos.z *= -0.9;

    outputData[idx] = pos;
    outputData[idx + ${PARTICLE_COUNT}u] = vel;
}
`);
    gl.compileShader(computeShader);
    if (!gl.getShaderParameter(computeShader, gl.COMPILE_STATUS)) {
        throw new Error("Compute shader compile failed: " + gl.getShaderInfoLog(computeShader));
    }

    // TRANSFORM FEEDBACK VERTEX SHADER
    const tfVertShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(tfVertShader, `
#version 300 es
layout(location = 0) in vec4 position;
layout(location = 1) in vec4 velocity;
layout(location = 2) in vec4 extra;

out vec4 tf_position;
out vec4 tf_velocity;
out vec4 tf_extra;

uniform float time;
uniform mat4 modelViewProjection;

void main() {
    tf_position = position + velocity * time * 0.01;
    tf_velocity = velocity + vec4(sin(time), cos(time * 1.3), sin(time * 0.7), 0.0) * 0.1;
    tf_extra = extra + vec4(0.01, 0.01, 0.01, 0.01);
}
`);
    gl.compileShader(tfVertShader);

    // TRANSFORM FEEDBACK PROGRAM
    const tfProgram = gl.createProgram();
    gl.attachShader(tfProgram, tfVertShader);
    const tfVaryings = ['tf_position', 'tf_velocity', 'tf_extra'];
    gl.transformFeedbackVaryings(tfProgram, tfVaryings, TF_BUFFER_MODE);
    gl.linkProgram(tfProgram);

    if (!gl.getProgramParameter(tfProgram, gl.LINK_STATUS)) {
        throw new Error("TF program link failed: " + gl.getProgramInfoLog(tfProgram));
    }

    // MRT RENDER VERTEX SHADER
    const mrtVertShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(mrtVertShader, `
#version 300 es
layout(location = 0) in vec4 position;
layout(location = 1) in vec4 velocity;
layout(location = 2) in vec4 extra;

uniform mat4 mvp;
uniform float time;
uniform int instanceId;

void main() {
    vec3 offset = vec3(float(instanceId % 4) * 0.5 - 0.75, float(instanceId / 4) * 0.5 - 0.75, 0.0);
    gl_Position = mvp * vec4(position.xyz + offset, 1.0);
}
`);
    gl.compileShader(mrtVertShader);

    // MRT RENDER FRAGMENT SHADER
    const mrtFragShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(mrtFragShader, `
#version 300 es
precision highp float;

uniform sampler3D volumeTex;
uniform float time;
uniform vec3 params;

layout(location = 0) out vec4 color0;
layout(location = 1) out vec4 color1;
layout(location = 2) out vec4 color2;
layout(location = 3) out vec4 color3;

void main() {
    vec3 coord = vec3(gl_FragCoord.xy / 256.0, time * 0.1);
    coord = fract(coord * 2.0);

    vec4 vol = texture(volumeTex, coord);

    color0 = vec4(vol.r, sin(time), cos(time), 1.0);
    color1 = vec4(vol.g, cos(time * 1.3), sin(time * 0.7), 1.0);
    color2 = vec4(vol.b, sin(time * 0.5), cos(time * 1.1), 1.0);
    color3 = vec4(vol.a, cos(time * 0.3), sin(time * 1.7), 1.0);
}
`);
    gl.compileShader(mrtFragShader);

    // MRT RENDER PROGRAM
    const mrtProgram = gl.createProgram();
    gl.attachShader(mrtProgram, mrtVertShader);
    gl.attachShader(mrtProgram, mrtFragShader);
    gl.linkProgram(mrtProgram);

    if (!gl.getProgramParameter(mrtProgram, gl.LINK_STATUS)) {
        throw new Error("MRT program link failed: " + gl.getProgramInfoLog(mrtProgram));
    }

    // DISPLAY VERTEX SHADER
    const displayVertShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(displayVertShader, `
#version 300 es
layout(location = 0) in vec2 position;

void main() {
    gl_Position = vec4(position, 0.0, 1.0);
}
`);
    gl.compileShader(displayVertShader);

    // DISPLAY FRAGMENT SHADER
    const displayFragShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(displayFragShader, `
#version 300 es
precision highp float;

uniform sampler2D mrtTex0;
uniform sampler2D mrtTex1;
uniform sampler2D mrtTex2;
uniform sampler2D mrtTex3;
uniform float time;

out vec4 fragColor;

void main() {
    vec2 uv = gl_FragCoord.xy / 256.0;

    vec4 c0 = texture(mrtTex0, uv);
    vec4 c1 = texture(mrtTex1, uv);
    vec4 c2 = texture(mrtTex2, uv);
    vec4 c3 = texture(mrtTex3, uv);

    fragColor = (c0 + c1 + c2 + c3) * 0.25;
    fragColor.rgb += vec3(sin(time * 2.0), cos(time * 1.5), sin(time * 0.8)) * 0.1;
}
`);
    gl.compileShader(displayFragShader);

    // DISPLAY PROGRAM
    const displayProgram = gl.createProgram();
    gl.attachShader(displayProgram, displayVertShader);
    gl.attachShader(displayProgram, displayFragShader);
    gl.linkProgram(displayProgram);

    // EXECUTION PHASE: Complex interleaving of operations

    // Bind samplers
    gl.bindSampler(0, volumeSampler);
    gl.bindSampler(1, renderSampler);

    // COMPUTE PASS: Update particles
    gl.useProgram(gl.createProgram()); // Dummy bind/unbind
    gl.useProgram(computeShader); // Actually this should be the compute program, wait I made a mistake

    // Wait, I need to create the compute program properly
    const computeProgram = gl.createProgram();
    gl.attachShader(computeProgram, computeShader);
    gl.linkProgram(computeProgram);

    gl.useProgram(computeProgram);
    gl.uniform1f(gl.getUniformLocation(computeProgram, 'time'), performance.now() * 0.001);
    gl.uniform3f(gl.getUniformLocation(computeProgram, 'params'), 0.01, 0.005, 1.0);

    gl.dispatchCompute(COMPUTE_WORKGROUPS, 1, 1);
    gl.memoryBarrier(gl.SHADER_STORAGE_BARRIER_BIT | gl.ATOMIC_COUNTER_BARRIER_BIT);

    // TRANSFORM FEEDBACK PASS
    gl.useProgram(tfProgram);
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, gl.createTransformFeedback());

    for (let i = 0; i < tfBuffers.length; i++) {
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, i, tfBuffers[i]);
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, ssboComputeOut); // Bind input from compute
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, PARTICLE_COUNT * 16);

    gl.beginTransformFeedback(gl.POINTS);
    gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
    gl.endTransformFeedback();

    // MRT RENDER PASS
    gl.bindFramebuffer(gl.FRAMEBUFFER, mrtFbo);
    gl.viewport(0, 0, 256, 256);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

    gl.useProgram(mrtProgram);
    const mvpLoc = gl.getUniformLocation(mrtProgram, 'mvp');
    const timeLoc = gl.getUniformLocation(mrtProgram, 'time');
    const instanceLoc = gl.getUniformLocation(mrtProgram, 'instanceId');

    // Bind volume texture
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_3D, volumeTexture);

    // Begin queries
    for (let q = 0; q < QUERY_COUNT; q++) {
        gl.beginQuery(q % 2 === 0 ? gl.PRIMITIVES_GENERATED : gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, queries[q]);
    }

    // Instanced rendering with MRT
    for (let batch = 0; batch < INSTANCE_BATCHES; batch++) {
        gl.uniform1i(instanceLoc, batch);
        gl.uniform1f(timeLoc, performance.now() * 0.001 + batch * 0.1);

        // Dummy MVP matrix
        const mvp = new Float32Array(16);
        for (let i = 0; i < 16; i++) mvp[i] = i % 4 === i / 4 ? 1.0 : 0.0;
        gl.uniformMatrix4fv(mvpLoc, false, mvp);

        gl.bindBuffer(gl.ARRAY_BUFFER, tfBuffers[batch % 3]);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, PARTICLE_COUNT * 16);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 0, PARTICLE_COUNT * 32);

        gl.vertexAttribDivisor(0, 0);
        gl.vertexAttribDivisor(1, 0);
        gl.vertexAttribDivisor(2, 0);

        gl.drawArraysInstanced(gl.POINTS, 0, PARTICLE_COUNT, 1);
    }

    // End queries
    for (let q = 0; q < QUERY_COUNT; q++) {
        gl.endQuery(q % 2 === 0 ? gl.PRIMITIVES_GENERATED : gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
    }

    // DISPLAY PASS: Render to screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, 256, 256);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

    gl.useProgram(displayProgram);
    gl.uniform1f(gl.getUniformLocation(displayProgram, 'time'), performance.now() * 0.001);

    // Bind MRT textures
    for (let i = 0; i < MRT_TARGETS; i++) {
        gl.activeTexture(gl.TEXTURE1 + i);
        gl.bindTexture(gl.TEXTURE_2D, mrtTextures[i]);
        gl.uniform1i(gl.getUniformLocation(displayProgram, `mrtTex${i}`), 1 + i);
    }

    // Full screen quad
    const quadBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // CLEANUP: Lots of unbinding to create fuzzing opportunities
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
    gl.bindBuffer(gl.ARRAY_BUFFER, null);
    gl.bindBuffer(gl.SHADER_STORAGE_BUFFER, null);
    gl.bindBuffer(gl.ATOMIC_COUNTER_BUFFER, null);
    gl.bindBuffer(gl.UNIFORM_BUFFER, null);
    for (let i = 0; i < 8; i++) {
        gl.activeTexture(gl.TEXTURE0 + i);
        gl.bindTexture(gl.TEXTURE_2D, null);
        gl.bindTexture(gl.TEXTURE_3D, null);
    }
    gl.bindSampler(0, null);
    gl.bindSampler(1, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(null);

    // Query results (for fuzzing coverage)
    for (let q of queries) {
        if (gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) {
            gl.getQueryParameter(q, gl.QUERY_RESULT);
        }
    }

    const err = gl.getError();
    if (err !== gl.NO_ERROR) throw new Error("WebGL Error: " + err);
}
main().catch(e => { throw e; });
</script>

<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>

async function main() {
    const canvas = document.getElementById('webgl-canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl) throw new Error("WebGL2 required");

    // HIGH-BIOMASS SEED: SSBO + Transform Feedback + 3D Textures + Instanced Rendering + UBO + State Churn
    // Biomass: Complex resource sharing, multiple pipelines, state machine stress

    const PARTICLE_COUNT = 1024;
    const INSTANCE_COUNT = 16;
    const TEXTURE_LAYERS = 8;

    // FUZZING CONSTANTS: Mix literals with variables
    const textureSize = 64;
    const bufferElements = 256;
    const uboSize = 64;

    // =================================================================================
    // PHASE 1: STATE CHURN - Create fragile state machine
    // =================================================================================

    gl.viewport(0, 0, 256, 256);
    gl.clearColor(0.1, 0.2, 0.3, 1.0);
    gl.clearDepth(1.0);
    gl.clearStencil(0);

    // Aggressive state changes
    for (let i = 0; i < 5; i++) {
        gl.enable(gl.DEPTH_TEST); gl.disable(gl.DEPTH_TEST);
        gl.enable(gl.BLEND); gl.disable(gl.BLEND);
        gl.enable(gl.CULL_FACE); gl.disable(gl.CULL_FACE);
    }
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);

    // =================================================================================
    // PHASE 2: RESOURCE CREATION - Complex interlinked resources
    // =================================================================================

    // SSBO for particle data
    const ssbo1 = gl.createBuffer();
    gl.bindBuffer(gl.SHADER_STORAGE_BUFFER, ssbo1);
    const ssbo1Data = new Float32Array(bufferElements * 4);
    for (let i = 0; i < ssbo1Data.length; i++) ssbo1Data[i] = Math.sin(i * 0.01);
    gl.bufferData(gl.SHADER_STORAGE_BUFFER, ssbo1Data, gl.DYNAMIC_COPY);

    const ssbo2 = gl.createBuffer();
    gl.bindBuffer(gl.SHADER_STORAGE_BUFFER, ssbo2);
    const ssbo2Data = new Float32Array(bufferElements * 3);
    for (let i = 0; i < ssbo2Data.length; i++) ssbo2Data[i] = Math.cos(i * 0.007);
    gl.bufferData(gl.SHADER_STORAGE_BUFFER, ssbo2Data, gl.DYNAMIC_COPY);

    // 3D Texture for volumetric data
    const volumeTex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_3D, volumeTex);
    const volumeData = new Uint8Array(textureSize * textureSize * TEXTURE_LAYERS * 4);
    for (let i = 0; i < volumeData.length; i++) volumeData[i] = Math.floor(Math.random() * 255);
    gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, textureSize, textureSize, TEXTURE_LAYERS, 0, gl.RGBA, gl.UNSIGNED_BYTE, volumeData);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    // UBO for shared parameters
    const ubo = gl.createBuffer();
    gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
    const uboData = new Float32Array(uboSize);
    for (let i = 0; i < uboData.length; i++) uboData[i] = i * 0.1;
    gl.bufferData(gl.UNIFORM_BUFFER, uboData, gl.DYNAMIC_DRAW);

    // Transform feedback buffers
    const tfBuffers = [];
    for (let i = 0; i < 3; i++) {
        const tfBuf = gl.createBuffer();
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, tfBuf);
        gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, new Float32Array(PARTICLE_COUNT * (i + 1)), gl.DYNAMIC_COPY);
        tfBuffers.push(tfBuf);
    }

    // =================================================================================
    // PHASE 3: SHADER COMPILATION
    // =================================================================================

    const vsSource = `#version 300 es
    precision highp float;
    layout(location = 0) in vec3 aPos;
    layout(location = 1) in vec3 aVel;
    out vec3 vPos;
    out vec3 vVel;
    out float vEnergy;
    uniform float time;
    uniform vec3 offset;
    void main() {
        vPos = aPos + offset;
        vVel = aVel;
        vEnergy = length(aPos) + sin(time + float(gl_InstanceID));
        gl_Position = vec4(vPos * 0.01, 1.0);
    }`;

    const fsSource = `#version 300 es
    precision highp float;
    precision highp sampler3D;
    in vec3 vPos;
    in vec3 vVel;
    in float vEnergy;
    out vec4 fragColor;
    uniform sampler3D volTex;
    uniform float time;
    void main() {
        vec4 volSample = texture(volTex, vPos * 0.1 + 0.5);
        fragColor = vec4(volSample.rgb * vEnergy * 0.1, 1.0);
    }`;

    const vsShader = gl.createShader(gl.VERTEX_SHADER);
    const fsShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(vsShader, vsSource);
    gl.shaderSource(fsShader, fsSource);
    gl.compileShader(vsShader);
    gl.compileShader(fsShader);

    if (!gl.getShaderParameter(vsShader, gl.COMPILE_STATUS)) {
        throw new Error('VS compile failed: ' + gl.getShaderInfoLog(vsShader));
    }
    if (!gl.getShaderParameter(fsShader, gl.COMPILE_STATUS)) {
        throw new Error('FS compile failed: ' + gl.getShaderInfoLog(fsShader));
    }

    const program = gl.createProgram();
    gl.attachShader(program, vsShader);
    gl.attachShader(program, fsShader);

    // Transform feedback varyings
    gl.transformFeedbackVaryings(program, ['vPos', 'vVel', 'vEnergy'], gl.INTERLEAVED_ATTRIBS);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error('Program link failed: ' + gl.getProgramInfoLog(program));
    }

    // =================================================================================
    // PHASE 4: RESOURCE BINDING - Complex binding patterns
    // =================================================================================

    gl.bindBufferBase(gl.SHADER_STORAGE_BUFFER, 0, ssbo1);
    gl.bindBufferBase(gl.SHADER_STORAGE_BUFFER, 1, ssbo2);
    gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, ubo);

    gl.useProgram(program);
    gl.uniform1i(gl.getUniformLocation(program, 'volTex'), 0);
    gl.uniform1f(gl.getUniformLocation(program, 'time'), performance.now() * 0.001);

    // =================================================================================
    // PHASE 5: MULTI-PASS RENDERING - State changes and feedback
    // =================================================================================

    // Pass 1: Transform feedback to update particle data
    gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, gl.createTransformFeedback());
    for (let i = 0; i < 3; i++) {
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, i, tfBuffers[i]);
    }

    // Create input vertex data
    const vertexBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    const vertexData = new Float32Array(PARTICLE_COUNT * 6); // pos + vel
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        vertexData[i * 6] = (Math.random() - 0.5) * 2;
        vertexData[i * 6 + 1] = (Math.random() - 0.5) * 2;
        vertexData[i * 6 + 2] = (Math.random() - 0.5) * 2;
        vertexData[i * 6 + 3] = Math.random() * 0.1 - 0.05;
        vertexData[i * 6 + 4] = Math.random() * 0.1 - 0.05;
        vertexData[i * 6 + 5] = Math.random() * 0.1 - 0.05;
    }
    gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);

    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);

    gl.beginTransformFeedback(gl.POINTS);
    gl.drawArrays(gl.POINTS, 0, PARTICLE_COUNT);
    gl.endTransformFeedback();

    // Pass 2: Instanced rendering using feedback data
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // Create instance data
    const instanceBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuffer);
    const instanceData = new Float32Array(INSTANCE_COUNT * 3);
    for (let i = 0; i < INSTANCE_COUNT; i++) {
        instanceData[i * 3] = (i % 4) * 0.5 - 0.75;
        instanceData[i * 3 + 1] = Math.floor(i / 4) * 0.5 - 0.75;
        instanceData[i * 3 + 2] = 0.0;
    }
    gl.bufferData(gl.ARRAY_BUFFER, instanceData, gl.STATIC_DRAW);

    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(2, 1);

    gl.uniform3f(gl.getUniformLocation(program, 'offset'), 0, 0, 0);
    gl.drawArraysInstanced(gl.POINTS, 0, PARTICLE_COUNT, INSTANCE_COUNT);

    // =================================================================================
    // PHASE 6: RESOURCE CLEANUP CHAOS
    // =================================================================================

    gl.deleteBuffer(ssbo1);
    gl.bindBufferBase(gl.SHADER_STORAGE_BUFFER, 0, ssbo2); // Rebind different buffer

    gl.deleteTexture(volumeTex);
    // Continue using deleted texture handle for fuzzing

    // =================================================================================
    // PHASE 7: FINAL VALIDATION
    // =================================================================================

    const error = gl.getError();
    if (error !== gl.NO_ERROR) {
        throw new Error(`WebGL Error: ${error}`);
    }
}

main().catch(err => { throw err; });
</script>
</body>

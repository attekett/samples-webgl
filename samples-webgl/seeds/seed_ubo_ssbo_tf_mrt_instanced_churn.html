<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2');
 if (!gl) throw new Error("WebGL2 required");

 // FUZZING TARGETS: Complex state management and resource sharing
 const NUM_INSTANCES = 100;
 const NUM_PARTICLES = 10;
 const MRT_COUNT = 4;
 const STATE_CHURN_COUNT = 50;

 // Create shared UBO for uniforms
 const uboData = new Float32Array([
  1.0, 0.5, 0.2, 1.0, // color1
  0.2, 1.0, 0.5, 1.0, // color2
  0.1, 0.1, 0.8, 1.0, // color3
  0.8, 0.1, 0.1, 1.0, // color4
  Math.sin(Date.now() * 0.001), Math.cos(Date.now() * 0.001), 0.0, 1.0 // dynamic
 ]);
 const ubo = gl.createBuffer();
 gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
 gl.bufferData(gl.UNIFORM_BUFFER, uboData, gl.DYNAMIC_DRAW);

 // Create additional UBO for data
 const dataData = new Float32Array(256);
 for (let i = 0; i < dataData.length; i++) dataData[i] = Math.random();
 const dataUbo = gl.createBuffer();
 gl.bindBuffer(gl.UNIFORM_BUFFER, dataUbo);
 gl.bufferData(gl.UNIFORM_BUFFER, dataData, gl.DYNAMIC_DRAW);

 // Create transform feedback buffers
 let tfInputs = [];
 let tfOutputs = [];
 for (let i = 0; i < 3; i++) {
  const inputData = new Float32Array(NUM_PARTICLES * 3);
  for (let j = 0; j < inputData.length; j++) inputData[j] = (Math.random() - 0.5) * 0.5;
  const inputBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, inputBuf);
  gl.bufferData(gl.ARRAY_BUFFER, inputData, gl.STREAM_DRAW);
  tfInputs.push(inputBuf);

  const outputBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, outputBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(NUM_PARTICLES * 3), gl.STREAM_DRAW);
  tfOutputs.push(outputBuf);
 }


 // Shaders
 const vsTF = `#version 300 es
layout(location=0) in vec3 pos;
layout(location=1) in vec3 vel;
layout(location=2) in vec3 acc;

layout(std140) uniform UBO { vec4 colors[5]; };

out vec3 outPos;
out vec3 outVel;
out vec3 outAcc;

void main() {
 outPos = pos + vel * 0.01 + acc * 0.005;
 outVel = vel + acc * 0.01;
 outAcc = acc + vec3(sin(float(gl_VertexID) * 0.1), cos(float(gl_VertexID) * 0.1), 0.0) * 0.001;
}
`;

 const fsTF = `#version 300 es
void main() {}
`;

 const vsRender = `#version 300 es
layout(location=0) in vec3 pos;
layout(location=1) in vec3 vel;
layout(location=2) in vec3 acc;

layout(std140) uniform UBO { vec4 colors[5]; };

out vec4 vColor;

void main() {
 gl_Position = vec4(pos * 0.5, 1.0);
 vColor = colors[gl_VertexID % 5];
}
`;

 const fsRender = `#version 300 es
precision highp float;
in vec4 vColor;
out vec4 fragColor;

void main() {
 float intensity = 0.5;
 fragColor = vColor * intensity;
}
`;

 // Create programs
 const progTF = gl.createProgram();
 const vsTFShader = gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vsTFShader, vsTF);
 gl.compileShader(vsTFShader);
 gl.attachShader(progTF, vsTFShader);
 const fsTFShader = gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fsTFShader, fsTF);
 gl.compileShader(fsTFShader);
 gl.attachShader(progTF, fsTFShader);
 gl.transformFeedbackVaryings(progTF, ['outPos', 'outVel', 'outAcc'], gl.SEPARATE_ATTRIBS);
 gl.linkProgram(progTF);
 const uboIndex = gl.getUniformBlockIndex(progTF, 'UBO');
 gl.uniformBlockBinding(progTF, uboIndex, 0);

 const progRender = gl.createProgram();
 const vsRenderShader = gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vsRenderShader, vsRender);
 gl.compileShader(vsRenderShader);
 gl.attachShader(progRender, vsRenderShader);
 const fsRenderShader = gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fsRenderShader, fsRender);
 gl.compileShader(fsRenderShader);
 gl.attachShader(progRender, fsRenderShader);
 gl.linkProgram(progRender);
 const uboIndexRender = gl.getUniformBlockIndex(progRender, 'UBO');
 gl.uniformBlockBinding(progRender, uboIndexRender, 0);
 // const dataUboIndex = gl.getUniformBlockIndex(progRender, 'DataUBO');
 // gl.uniformBlockBinding(progRender, dataUboIndex, 1);

 // State churn loop
 for (let churn = 0; churn < STATE_CHURN_COUNT; churn++) {
  // Bind/unbind various things
  gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, ubo);
  gl.bindBufferBase(gl.UNIFORM_BUFFER, 1, dataUbo);
  gl.bindBuffer(gl.UNIFORM_BUFFER, null);
  gl.enable(gl.BLEND);
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.disable(gl.CULL_FACE);
 }

 // Skip TF for now
 // Transform feedback pass
 // gl.useProgram(progTF);
 // ... 

 // Data update pass (simulate compute)
 // gl.bindBufferBase(gl.UNIFORM_BUFFER, 1, dataUbo);
 // const dataView = new Float32Array(256);
 // for (let i = 0; i < dataView.length; i++) dataView[i] = Math.sin(i * 0.01 + Date.now() * 0.001);
 // gl.bufferSubData(gl.UNIFORM_BUFFER, 0, dataView);

 // Render pass directly to canvas
 gl.bindFramebuffer(gl.FRAMEBUFFER, null);
 gl.viewport(0, 0, 256, 256);
 gl.clearColor(0, 0, 0, 1);
 gl.clear(gl.COLOR_BUFFER_BIT);
 gl.useProgram(progRender);
 gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, ubo);
 // gl.bindBufferBase(gl.UNIFORM_BUFFER, 1, dataUbo);

 gl.bindBuffer(gl.ARRAY_BUFFER, tfInputs[0]);
 gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
 gl.enableVertexAttribArray(0);
 gl.bindBuffer(gl.ARRAY_BUFFER, tfInputs[1]);
 gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
 gl.enableVertexAttribArray(1);
 gl.bindBuffer(gl.ARRAY_BUFFER, tfInputs[2]);
 gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 0, 0);
 gl.enableVertexAttribArray(2);

 gl.enable(gl.BLEND);
 gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

 gl.drawArrays(gl.POINTS, 0, NUM_PARTICLES);

 const error = gl.getError();
 if (error !== gl.NO_ERROR) throw new Error(`WebGL Error: ${error}`);
}
main().catch(err => { throw err; });
</script>
</body>
</html>

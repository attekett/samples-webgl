<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2');
 if (!gl) throw new Error("WebGL2 not supported");

 // 1. EXTENSION GATING
 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS
 REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

 const DEPTH_TEST_COUNT = 4;
 const VERTEX_COUNT = 1024;
 const DEPTH_MODIFICATION_FACTOR = 0.3;
 const STATE_CHANGE_COUNT = 25;

 // Create vertex data for multiple depth layers
 const vertices = [];
 for (let i = 0; i < VERTEX_COUNT; i++) {
   const angle = (i / VERTEX_COUNT) * Math.PI * 4;
   const radius = 0.1 + (i % DEPTH_TEST_COUNT) * 0.2;
   const x = Math.cos(angle) * radius;
   const y = Math.sin(angle) * radius;
   const depthLayer = (i % DEPTH_TEST_COUNT) / DEPTH_TEST_COUNT;
   vertices.push(x, y, depthLayer);
 }
 const vertexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

 // Create index buffer for triangle strips
 const indices = [];
 for (let i = 0; i < VERTEX_COUNT - 2; i++) {
   indices.push(i, i + 1, i + 2);
 }
 const indexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

 // Vertex shader
 const vertexShader = gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vertexShader, `#version 300 es
 in vec3 aPosition;
 uniform float uDepthModificationFactor;
 out vec3 vPosition;
 out float vDepthLayer;

 void main() {
   vPosition = aPosition;
   vDepthLayer = aPosition.z;
   gl_Position = vec4(aPosition.xy, aPosition.z * 2.0 - 1.0, 1.0);
 }
 `);
 gl.compileShader(vertexShader);
 if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
   throw new Error('Vertex shader compilation failed: ' + gl.getShaderInfoLog(vertexShader));
 }

 // Fragment shader with gl_FragDepth modification
 const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fragmentShader, `#version 300 es
 precision highp float;
 in vec3 vPosition;
 in float vDepthLayer;
 uniform float uDepthModificationFactor;
 out vec4 fragColor;

 void main() {
   // Modify fragment depth based on position and layer
   float depthOffset = sin(vPosition.x * 10.0 + vPosition.y * 10.0) * uDepthModificationFactor;
   gl_FragDepth = clamp(gl_FragCoord.z + depthOffset * vDepthLayer, 0.0, 1.0);

   // Color based on depth modification
   float intensity = (1.0 - gl_FragDepth) * 2.0;
   fragColor = vec4(intensity * (1.0 - vDepthLayer), intensity * vDepthLayer, intensity * 0.5, 1.0);
 }
 `);
 gl.compileShader(fragmentShader);
 if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
   throw new Error('Fragment shader compilation failed: ' + gl.getShaderInfoLog(fragmentShader));
 }

 // Create program
 const program = gl.createProgram();
 gl.attachShader(program, vertexShader);
 gl.attachShader(program, fragmentShader);
 gl.linkProgram(program);
 if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
   throw new Error('Program linking failed: ' + gl.getProgramInfoLog(program));
 }
 gl.useProgram(program);

 // Get attribute and uniform locations
 const positionLoc = gl.getAttribLocation(program, 'aPosition');
 const depthModLoc = gl.getUniformLocation(program, 'uDepthModificationFactor');

 // Set up vertex attributes
 gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
 gl.enableVertexAttribArray(positionLoc);
 gl.vertexAttribPointer(positionLoc, 3, gl.FLOAT, false, 0, 0);

 // Set uniform
 gl.uniform1f(depthModLoc, DEPTH_MODIFICATION_FACTOR);

 // State poisoning - enable/disable various states
 for (let i = 0; i < STATE_CHANGE_COUNT; i++) {
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.DEPTH_TEST);
   gl.enable(gl.BLEND);
   gl.disable(gl.BLEND);
   gl.depthFunc(gl.LESS);
   gl.depthFunc(gl.GREATER);
   gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
   gl.blendFunc(gl.ONE, gl.ONE);
   gl.viewport(0, 0, 256, 256);
   gl.viewport(10, 10, 236, 236);
 }

 // Enable depth testing for final render
 gl.enable(gl.DEPTH_TEST);
 gl.depthFunc(gl.LESS);
 gl.clearDepth(1.0);
 gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

 // Bind index buffer
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

 // Render with depth modification
 gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
   throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 console.error(err);
});
</script>
</body>
</html>

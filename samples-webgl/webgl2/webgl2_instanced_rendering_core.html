<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
// CONFIGURATION: WebGL2 native instanced rendering - no extensions required
const REQUIRED_EXTENSIONS = [
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2');
 if (!gl) {
 throw new Error("WebGL2 not supported - required for all tests");
 }

 // 1. EXTENSION GATING (none required for WebGL2 native instanced rendering)
 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS (none required)

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // FUZZING VARIABLES - Mix inline literals with parameterized variables
 const INSTANCE_COUNT = 1000;
 const DIVISOR_VALUE = 1;
 const ATTRIBUTE_SETUP = 2;
 const VERTEX_DENSITY = 32;
 const STATE_CHANGE_COUNT = 25;

 // Create shader program
 const vertexShader = gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vertexShader, `#version 300 es
   layout(location = 0) in vec2 a_position;
   layout(location = 1) in vec3 a_color;
   layout(location = 2) in vec2 a_offset;
   layout(location = 3) in float a_scale;

   out vec3 v_color;

   void main() {
     vec2 pos = a_position * a_scale + a_offset;
     gl_Position = vec4(pos, 0.0, 1.0);
     v_color = a_color;
   }
 `);
 gl.compileShader(vertexShader);

 const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fragmentShader, `#version 300 es
   precision mediump float;
   in vec3 v_color;
   out vec4 fragColor;

   void main() {
     fragColor = vec4(v_color, 1.0);
   }
 `);
 gl.compileShader(fragmentShader);

 const program = gl.createProgram();
 gl.attachShader(program, vertexShader);
 gl.attachShader(program, fragmentShader);
 gl.linkProgram(program);
 gl.useProgram(program);

 // Create geometry - simple quad
 const positions = new Float32Array([
   -0.01, -0.01,
    0.01, -0.01,
   -0.01,  0.01,
    0.01,  0.01
 ]);

 // Create instance attributes
 const colors = new Float32Array(INSTANCE_COUNT * 3);
 const offsets = new Float32Array(INSTANCE_COUNT * 2);
 const scales = new Float32Array(INSTANCE_COUNT);

 // Initialize instance data with mathematical patterns
 for (let i = 0; i < INSTANCE_COUNT; i++) {
   const angle = (i / INSTANCE_COUNT) * Math.PI * 4;
   const radius = 0.3 + 0.2 * Math.sin(i * 0.1);

   // Position in spiral pattern
   offsets[i * 2] = radius * Math.cos(angle);
   offsets[i * 2 + 1] = radius * Math.sin(angle);

   // Color based on angle and index
   colors[i * 3] = Math.sin(angle * 3) * 0.5 + 0.5;
   colors[i * 3 + 1] = Math.cos(angle * 2) * 0.5 + 0.5;
   colors[i * 3 + 2] = Math.sin(i * 0.01) * 0.5 + 0.5;

   // Scale variation
   scales[i] = 0.5 + 0.3 * Math.sin(i * 0.05);
 }

 // Create vertex array object
 const vao = gl.createVertexArray();
 gl.bindVertexArray(vao);

 // Position buffer (per-vertex, not instanced)
 const positionBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);
 gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
 gl.vertexAttribDivisor(0, 0); // Not instanced

 // Color buffer (per-instance)
 const colorBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
 gl.enableVertexAttribArray(1);
 gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
 gl.vertexAttribDivisor(1, DIVISOR_VALUE); // Instanced

 // Offset buffer (per-instance)
 const offsetBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, offsets, gl.STATIC_DRAW);
 gl.enableVertexAttribArray(2);
 gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);
 gl.vertexAttribDivisor(2, DIVISOR_VALUE); // Instanced

 // Scale buffer (per-instance)
 const scaleBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuffer);
 gl.bufferData(gl.ARRAY_BUFFER, scales, gl.STATIC_DRAW);
 gl.enableVertexAttribArray(3);
 gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 0, 0);
 gl.vertexAttribDivisor(3, DIVISOR_VALUE); // Instanced

 // STATE POISONING - 25+ state changes to create fragile state machine
 for (let i = 0; i < STATE_CHANGE_COUNT; i++) {
   // Capability enable/disable churn
   gl.enable(gl.BLEND);
   gl.disable(gl.BLEND);
   gl.enable(gl.CULL_FACE);
   gl.disable(gl.CULL_FACE);
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.DEPTH_TEST);

   // Blend state changes
   gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
   gl.blendFunc(gl.ONE, gl.ONE);
   gl.blendEquation(gl.FUNC_ADD);
   gl.blendEquation(gl.FUNC_SUBTRACT);

   // Viewport changes
   gl.viewport(0, 0, 256, 256);
   gl.viewport(10, 10, 236, 236);
   gl.viewport(0, 0, 256, 256);

   // Buffer binding churn
   gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
   gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
   gl.bindBuffer(gl.ARRAY_BUFFER, offsetBuffer);
   gl.bindBuffer(gl.ARRAY_BUFFER, scaleBuffer);
   gl.bindBuffer(gl.ARRAY_BUFFER, null);

   // Texture unit changes (even though no textures used)
   gl.activeTexture(gl.TEXTURE0);
   gl.activeTexture(gl.TEXTURE1);
   gl.activeTexture(gl.TEXTURE0);
 }

 // Final state setup
 gl.disable(gl.CULL_FACE);
 gl.disable(gl.DEPTH_TEST);
 gl.enable(gl.BLEND);
 gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

 // Draw instanced geometry
 gl.clearColor(0.0, 0.0, 0.0, 1.0);
 gl.clear(gl.COLOR_BUFFER_BIT);

 // Use drawArraysInstanced for instanced rendering
 gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, INSTANCE_COUNT);

 // Additional state changes after drawing
 for (let i = 0; i < 5; i++) {
   gl.enable(gl.BLEND);
   gl.disable(gl.BLEND);
   gl.viewport(0, 0, 256, 256);
 }

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
 throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 // If the error string contains "UNSUPPORTED_EXTENSIONS", the Python runner
 // knows to log it to UNSUPPORTED.md and skip.
 // Otherwise, it counts as a test failure/crash.
 console.log(err.message); // Log the detailed error message for test runner detection
 console.error(err); // Allowed for debugging, but DOM update is primary signal
});
</script>
</body>
</html>

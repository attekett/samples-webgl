<!DOCTYPE html>
<html>
<body>
<canvas id="webgl-canvas" width="256" height="256"></canvas>
<script>
const REQUIRED_EXTENSIONS = [
];

async function main() {
 const canvas = document.getElementById('webgl-canvas');
 const gl = canvas.getContext('webgl2');
 if (!gl) {
 throw new Error("WebGL2 not supported - required for all tests");
 }

 // 1. EXTENSION GATING
 const missingExtensions = REQUIRED_EXTENSIONS.filter(ext => !gl.getExtension(ext));
 if (missingExtensions.length > 0) {
 throw new Error(`UNSUPPORTED_EXTENSIONS: ${missingExtensions.join(', ')}`);
 }

 // 2. ENABLE REQUIRED EXTENSIONS
 REQUIRED_EXTENSIONS.forEach(ext => gl.getExtension(ext));

 // ==========================================
 // COMPLEX IMPLEMENTATION STARTS HERE
 // ==========================================

 // CONFIGURATION: Expose variables for fuzzing
 const TEXTURE_SIZE = 64;
 const VERTEX_COUNT = 1024;
 const ATTRIBUTE_COUNT = 4;
 const STATE_CHANGE_COUNT = 25;
 const INTEGER_DATA_SCALE = 255;

 // Create vertex shader with integer attributes and uniforms
 const vertexShaderSource = `#version 300 es
 in ivec4 vertexData;      // Integer vertex attribute
 in ivec2 texCoordData;    // Integer texture coordinates
 uniform ivec4 dataOffset; // Integer uniform
 uniform int dataScale;   // Integer uniform

 out vec2 texCoord;
 flat out ivec4 processedData;

 void main() {
   // Process integer data
   processedData = vertexData + dataOffset;
   processedData *= dataScale;

   // Convert to texture coordinates
   texCoord = vec2(float(texCoordData.x) / 256.0, float(texCoordData.y) / 256.0);

   // Generate position from integer data
   vec2 pos = vec2(float(vertexData.x) / 128.0 - 1.0, float(vertexData.y) / 128.0 - 1.0);
   gl_Position = vec4(pos, 0.0, 1.0);
   gl_PointSize = 2.0;
 }
 `;

 // Create fragment shader with integer texture sampling
 const fragmentShaderSource = `#version 300 es
 precision highp float;

 uniform highp isampler2D intTexture;    // Signed integer texture
 uniform highp usampler2D uintTexture;   // Unsigned integer texture
 uniform ivec4 colorMultiplier;          // Integer color control

 in vec2 texCoord;
 flat in ivec4 processedData;

 out vec4 fragColor;

 void main() {
   // Sample integer textures
   ivec4 intSample = texture(intTexture, texCoord);
   uvec4 uintSample = texture(uintTexture, texCoord);

   // Process integer data
   ivec4 combined = intSample + ivec4(uintSample) + processedData;
   combined *= colorMultiplier;

   // Convert to visual color (normalize to 0-1 range)
   fragColor = vec4(
     float(combined.x) / 65535.0,
     float(combined.y) / 65535.0,
     float(combined.z) / 65535.0,
     1.0
   );
 }
 `;

 // Compile shaders
 const vertexShader = gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vertexShader, vertexShaderSource);
 gl.compileShader(vertexShader);
 if (!gl.getShaderParameter(vertexShader, gl.COMPILE_STATUS)) {
   throw new Error('Vertex shader compilation failed: ' + gl.getShaderInfoLog(vertexShader));
 }

 const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fragmentShader, fragmentShaderSource);
 gl.compileShader(fragmentShader);
 if (!gl.getShaderParameter(fragmentShader, gl.COMPILE_STATUS)) {
   throw new Error('Fragment shader compilation failed: ' + gl.getShaderInfoLog(fragmentShader));
 }

 // Create program
 const program = gl.createProgram();
 gl.attachShader(program, vertexShader);
 gl.attachShader(program, fragmentShader);
 gl.linkProgram(program);
 if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
   throw new Error('Program linking failed: ' + gl.getProgramInfoLog(program));
 }
 gl.useProgram(program);

 // Create integer textures
 const intTexture = gl.createTexture();
 gl.bindTexture(gl.TEXTURE_2D, intTexture);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

 // Generate integer texture data (R32I format)
 const intData = new Int32Array(TEXTURE_SIZE * TEXTURE_SIZE);
 for (let i = 0; i < intData.length; i++) {
   intData[i] = Math.floor(Math.sin(i * 0.01) * INTEGER_DATA_SCALE);
 }

 gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32I, TEXTURE_SIZE, TEXTURE_SIZE, 0, gl.RED_INTEGER, gl.INT, intData);

 const uintTexture = gl.createTexture();
 gl.bindTexture(gl.TEXTURE_2D, uintTexture);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

 // Generate unsigned integer texture data (RG16UI format)
 const uintData = new Uint16Array(TEXTURE_SIZE * TEXTURE_SIZE * 2);
 for (let i = 0; i < uintData.length; i += 2) {
   uintData[i] = Math.floor(Math.cos(i * 0.005) * 65535);     // R component
   uintData[i + 1] = Math.floor(Math.sin(i * 0.007) * 32767);  // G component
 }

 gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16UI, TEXTURE_SIZE, TEXTURE_SIZE, 0, gl.RG_INTEGER, gl.UNSIGNED_SHORT, uintData);

 // Create vertex buffer with integer attributes
 const vertexBuffer = gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);

 // Generate vertex data with integer attributes
 const vertexData = new Int32Array(VERTEX_COUNT * 6); // 4 ints for vertexData + 2 ints for texCoordData
 for (let i = 0; i < VERTEX_COUNT; i++) {
   const baseIdx = i * 6;
   // vertexData (4 integers)
   vertexData[baseIdx] = Math.floor(Math.random() * 256) - 128;     // x coordinate
   vertexData[baseIdx + 1] = Math.floor(Math.random() * 256) - 128; // y coordinate
   vertexData[baseIdx + 2] = Math.floor(Math.random() * 65535);     // additional data
   vertexData[baseIdx + 3] = Math.floor(Math.random() * 32767);     // additional data

   // texCoordData (2 integers)
   vertexData[baseIdx + 4] = Math.floor(Math.random() * TEXTURE_SIZE);
   vertexData[baseIdx + 5] = Math.floor(Math.random() * TEXTURE_SIZE);
 }

 gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);

 // Set up vertex attributes
 const vertexDataLoc = gl.getAttribLocation(program, 'vertexData');
 gl.enableVertexAttribArray(vertexDataLoc);
 gl.vertexAttribIPointer(vertexDataLoc, 4, gl.INT, 24, 0); // 6 * 4 bytes per vertex

 const texCoordDataLoc = gl.getAttribLocation(program, 'texCoordData');
 gl.enableVertexAttribArray(texCoordDataLoc);
 gl.vertexAttribIPointer(texCoordDataLoc, 2, gl.INT, 24, 16); // offset 16 bytes

 // Set up uniforms
 const dataOffsetLoc = gl.getUniformLocation(program, 'dataOffset');
 gl.uniform4i(dataOffsetLoc, 10, 20, 30, 40);

 const dataScaleLoc = gl.getUniformLocation(program, 'dataScale');
 gl.uniform1i(dataScaleLoc, 2);

 const intTextureLoc = gl.getUniformLocation(program, 'intTexture');
 gl.uniform1i(intTextureLoc, 0);

 const uintTextureLoc = gl.getUniformLocation(program, 'uintTexture');
 gl.uniform1i(uintTextureLoc, 1);

 const colorMultiplierLoc = gl.getUniformLocation(program, 'colorMultiplier');
 gl.uniform4i(colorMultiplierLoc, 1, 1, 1, 1);

 // HEAVY STATE POISONING: 50+ state changes to create fragile state machine
 for (let i = 0; i < STATE_CHANGE_COUNT; i++) {
   // Capability toggling
   gl.enable(gl.BLEND);
   gl.disable(gl.BLEND);
   gl.enable(gl.CULL_FACE);
   gl.disable(gl.CULL_FACE);
   gl.enable(gl.DEPTH_TEST);
   gl.disable(gl.DEPTH_TEST);
   gl.enable(gl.SCISSOR_TEST);
   gl.disable(gl.SCISSOR_TEST);

   // Blend state changes
   gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
   gl.blendEquation(gl.FUNC_ADD);

   // Texture binding churn
   gl.activeTexture(gl.TEXTURE0);
   gl.bindTexture(gl.TEXTURE_2D, intTexture);
   gl.activeTexture(gl.TEXTURE1);
   gl.bindTexture(gl.TEXTURE_2D, uintTexture);

   // Buffer binding churn
   gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
   gl.bindBuffer(gl.ARRAY_BUFFER, null);

   // Program switching
   gl.useProgram(program);
   gl.useProgram(null);
   gl.useProgram(program);

   // Viewport changes
   gl.viewport(0, 0, 256, 256);
   gl.scissor(0, 0, 128, 128);

   // Clear state changes
   gl.clearColor(0.0, 0.0, 0.0, 1.0);
   gl.clear(gl.COLOR_BUFFER_BIT);

   // Additional redundant operations
   gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
   gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
 }

 // Bind textures for rendering
 gl.activeTexture(gl.TEXTURE0);
 gl.bindTexture(gl.TEXTURE_2D, intTexture);
 gl.activeTexture(gl.TEXTURE1);
 gl.bindTexture(gl.TEXTURE_2D, uintTexture);

 // Final state setup
 gl.viewport(0, 0, 256, 256);
 gl.clearColor(0.1, 0.1, 0.1, 1.0);
 gl.clear(gl.COLOR_BUFFER_BIT);

 // Render points
 gl.drawArrays(gl.POINTS, 0, VERTEX_COUNT);

 // ==========================================
 // COMPLEX IMPLEMENTATION ENDS HERE
 // ==========================================

 // 3. ERROR CHECKING
 const error = gl.getError();
 if (error !== gl.NO_ERROR) {
 throw new Error(`WebGL Error: ${error}`);
 }
}

main().catch(err => {
 // If the error string contains "PLAYWRIGHT_FIREFOX_LIMITATION" or "UNSUPPORTED_EXTENSIONS",
 // the Python runner knows to log it as an environmental limitation, not a test failure.
 // Otherwise, it counts as a test failure/crash.
 console.log(err.message); // Log the detailed error message for test runner detection
 console.error(err); // Allowed for debugging, but DOM update is primary signal
});
</script>
</body>
</html>
